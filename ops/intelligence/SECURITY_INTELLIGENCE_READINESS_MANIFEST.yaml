version: 1
status: PREP_ONLY
owner_gate_required_for_connect: true
last_reviewed: 2026-09-08
principles:
  - public_or_explicitly_authorized_sources_only
  - no_secrets_in_repo
  - no_private_network_access
  - no_claim_of_connected_without_live_evidence
  - sandbox_shadow_before_promotion
  - provenance_and_audit_required
  - kill_switch_required
trust_tiers:
  T0: official_primary_public_or_explicitly_authorized
  T1: official_secondary_public
  T2: reputable_partner_or_research_public
  T3: open_web_unverified_quarantine_only
