connection_contract:
  required_fields:
    - source_id
    - endpoint_or_feed_type
    - public_or_authorized_status
    - expected_auth_model
    - schema_mapping_version
    - polling_or_webhook_mode
    - rate_limit_policy
    - retention_class
    - allowed_use
    - prohibited_use
    - owner_gated_flag
    - sandbox_plan
    - rollback_or_kill_switch
    - acceptance_criteria
    - evidence_requirement
pipeline:
  - discover
  - legal_auth_gate
  - fetch_to_quarantine
  - normalize
  - provenance_score
  - deduplicate
  - redact
  - contradiction_check
  - sandbox_validate
  - shadow_compare
  - evaluator_gate
  - promote_or_reject
acceptance_criteria:
  ready_to_connect:
    - source_identity_verified
    - public_or_explicit_authorization_verified
    - schema_contract_defined
    - rate_limit_and_backoff_defined
    - redaction_and_retention_defined
    - sandbox_test_plan_defined
    - observability_defined
    - kill_switch_defined
    - owner_approval_pending_or_granted
  connected:
    - owner_approval_granted
    - live_endpoint_verified
    - auth_gate_verified_if_required
    - first_ingest_evidence_recorded
    - health_and_freshness_evidence_recorded
    - rollback_tested
