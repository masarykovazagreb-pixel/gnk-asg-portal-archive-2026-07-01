name: GNK ASG News V14 Lifecycle

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

concurrency:
  group: gnk-asg-news-v14-lifecycle
  cancel-in-progress: false

jobs:
  refresh-news:
    name: Refresh verified public news feed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zagreb schedule gate
        id: gate
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          event = os.environ.get('GITHUB_EVENT_NAME', '')
          hour = datetime.now(ZoneInfo('Europe/Zagreb')).hour
          allowed = event != 'schedule' or hour in {9, 16, 21}
          print(f'run={str(allowed).lower()}')
          print(f'zagreb_hour={hour}')
          PY

      - name: Refresh GNK ASG news data
        if: steps.gate.outputs.run == 'true'
        run: python3 scripts/news_publication.py

      - name: Validate V14 news contract
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = Path('data')
          news = json.loads((data / 'news.json').read_text(encoding='utf-8'))
          archive = json.loads((data / 'news_archive.json').read_text(encoding='utf-8'))
          status = json.loads((data / 'news-automation-status.json').read_text(encoding='utf-8'))
          health = json.loads((data / 'news_sources_health.json').read_text(encoding='utf-8'))
          assert status.get('version') == 'GNK_ASG_NEWS_V14_20260626'
          assert status.get('scheduled_hours_local') == [9, 16, 21]
          assert status.get('configured_sources', 0) >= 15
          assert status.get('healthy_sources', 0) >= 15
          assert isinstance(news, list) and 1 <= len(news) <= 150
          assert all(item.get('title') and item.get('summary') and item.get('source') and item.get('url') and item.get('image') and item.get('imageVerified') is True for item in news)
          assert all(not str(item.get('image')).endswith('news-fallback.svg') for item in news)
          assert isinstance(archive, list) and len(archive) <= 1000
          assert status.get('archive_prune_trigger') == 900
          assert status.get('archive_prune_to') == 450
          if status.get('archive_prune_triggered'):
              assert len(archive) <= 450
          else:
              assert len(archive) < 900
          assert isinstance(health.get('sources'), list) and len(health['sources']) == status.get('configured_sources')
          print({'public': len(news), 'archive': len(archive), 'healthy_sources': status.get('healthy_sources'), 'updated_at': status.get('updated_at')})
          PY

      - name: Commit refreshed public news data
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "GNK ASG News Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/news_archive.json data/news_sources_health.json data/news-automation-status.json data/update_status.json
          if git diff --cached --quiet; then
            echo "No news data changes to commit."
            exit 0
          fi
          git commit -m "chore(news): refresh verified V14 public feed"
          git pull --rebase origin main
          git push
