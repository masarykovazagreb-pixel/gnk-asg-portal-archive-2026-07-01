name: Emergency deploy corrected Mail Center autoreply
on:
  push:
    paths:
      - '.github/workflows/emergency-deploy-mail-autoreply-bcc-20260722.yml'
permissions:
  contents: read
  issues: write
concurrency:
  group: gnk-asg-mail-autoreply-emergency
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch, validate and deploy corrected Mail Center Worker
        id: fix_deploy
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/fix-deploy.log) 2>&1
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workers/gnk-asg-mail-center-worker/src/index.js')
          s=p.read_text()
          broken="      bcc: mandatoryBcc(env).join(', '),"
          fixed="      bcc: mandatoryBcc(env),"
          print('broken_transport_count=', s.count(broken))
          if s.count(broken) != 1:
              raise SystemExit('expected exactly one broken EMAIL.send BCC expression')
          p.write_text(s.replace(broken,fixed,1))
          PY
          node --check workers/gnk-asg-mail-center-worker/src/index.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('workers/gnk-asg-mail-center-worker/src/index.js').read_text()
          assert "      bcc: mandatoryBcc(env)," in s
          assert "      bcc: mandatoryBcc(env).join(', ')," not in s
          assert 'prepareAiAutoReply(message, env)' in s
          print('transport and fallback source contract: PASS')
          PY
          cat > workers/gnk-asg-mail-center-worker/wrangler.runtime.toml <<'EOF'
          name = "gnk-asg-mail-center-worker"
          main = "src/index.js"
          compatibility_date = "2026-06-18"
          workers_dev = true
          preview_urls = true

          [ai]
          binding = "AI"

          [vars]
          AI_AUTO_REPLY_DISABLED = "false"

          [[kv_namespaces]]
          binding = "GNK_ASG_KV"
          id = "a3e9e78c7d554d7fa10996da9a89e7bc"

          [[send_email]]
          name = "EMAIL"
          remote = true
          EOF
          cd workers/gnk-asg-mail-center-worker
          npx --yes wrangler@4 deploy --config wrangler.runtime.toml --name gnk-asg-mail-center-worker --keep-vars
      - name: Publish atomic deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '## Atomic autoreply BCC hotfix deployment'
            echo
            echo "Outcome: ${{ steps.fix_deploy.outcome }}"
            echo
            echo '```'
            tail -n 160 /tmp/fix-deploy.log 2>/dev/null || true
            echo '```'
          } > /tmp/report.md
          gh issue edit 712 --repo "${{ github.repository }}" --body-file /tmp/report.md
