name: Validate gnk-asg-image-proxy

on:
  pull_request:
    paths:
      - 'workers/gnk-asg-image-proxy/**'
      - '.github/workflows/validate-gnk-asg-image-proxy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate image proxy without production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: workers/gnk-asg-image-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate JavaScript and Wrangler configuration
        run: |
          set -euo pipefail
          node --check src/index.js
          grep -q '^name = "gnk-asg-image-proxy"' wrangler.toml
          grep -q 'pattern = "gnk-asg.hr/api/slike\*"' wrangler.toml

      - name: Build Worker package without deployment
        run: npx wrangler@4 deploy --dry-run

      - name: Confirm production deployment is forbidden
        run: echo 'Production deployment is not permitted from this workflow.'
