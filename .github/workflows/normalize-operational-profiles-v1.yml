name: Normalize Operational Profiles V1

on:
  push:
    branches:
      - enterprise-portal-ui-v3-20260704
    paths:
      - '.github/workflows/normalize-operational-profiles-v1.yml'
      - 'apps/portal/enterprise/index.html'
      - 'apps/portal/digital-workforce/**'
      - 'apps/portal/assets/js/digital-workforce-directory-v1.js'
      - 'apps/portal/assets/public-operations-dashboard-v1.js'
      - 'apps/portal/data/public-portal-catalog.json'
      - 'apps/portal/public-operations/index.html'
      - 'workers/gnk-asg-direct-operator/src/public-operations-v1.js'

permissions:
  contents: write

concurrency:
  group: normalize-operational-profiles-v1
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: enterprise-portal-ui-v3-20260704
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply consistent operational profile model
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            Path('apps/portal/assets/js/digital-workforce-directory-v1.js'): [
              ("2026-07-04.directory.02", "2026-07-05.directory.03"),
              ("The directory contains digital operations profiles and functional workflow identities.", "The directory contains operational profiles and functional workflow identities."),
              ("Senior Digital Operations Specialist", "Senior Operations Specialist"),
              ("Digital Operations Worker", "Operations Worker"),
              ("Array.from({length:1500}", "Array.from({length:1537}"),
              ("profileType:'digital operations profile'", "profileType:'operations profile'"),
            ],
            Path('apps/portal/digital-workforce/index.html'): [
              ("1,500", "1,537"),
              ("Digital Workforce", "Operational Workforce"),
              ("digital workforce", "operational workforce"),
              ("digital operations profiles", "operations profiles"),
              ("Digital operations profiles", "Operations profiles"),
            ],
            Path('apps/portal/digital-workforce/directory/index.html'): [
              ("1,500", "1,537"),
              ("Digital Workforce", "Operational Workforce"),
              ("digital workforce", "operational workforce"),
              ("digital operations profiles", "operations profiles"),
              ("Digital operations profiles", "Operations profiles"),
              ("data.count!==1500", "data.count!==1537"),
              ("Page 1 of 30", "Page 1 of 31"),
              ("gnk-digital-workforce-directory-review.csv", "gnk-operational-workforce-directory-review.csv"),
            ],
            Path('apps/portal/enterprise/index.html'): [
              ("<strong>1.500</strong><span>digitalnih operativnih profila u javnom modelu</span>", "<strong>1.537</strong><span>operativnih profila u javnom modelu</span>"),
              ("Javna izvješća, digitalni profili i governance tabla.", "Javna izvješća, operativni profili i governance tabla."),
            ],
            Path('apps/portal/data/public-portal-catalog.json'): [
              ("2026-07-04.public-portal-catalog.v1", "2026-07-05.public-portal-catalog.v2"),
              ('"labelHr": "Digitalni operativni profili"', '"labelHr": "Operativni profili"'),
              ('"labelEn": "Digital Operations Profiles"', '"labelEn": "Operational Profiles"'),
              ('"profileCount": 1500', '"profileCount": 1537'),
              ("Profiles are functional digital workflow identities.", "Profiles are functional operational workflow identities."),
            ],
            Path('workers/gnk-asg-direct-operator/src/public-operations-v1.js'): [
              ("GNK_ASG_PUBLIC_OPERATIONS_V2_20260705_", "GNK_ASG_PUBLIC_OPERATIONS_V3_20260705_"),
              ("profileType:'digital operations profile'", "profileType:'operations profile'"),
              ("configuredProfiles:1500", "configuredProfiles:1537"),
              ("statusDistribution:{active:644,busy:214,scheduled:214,idle:214,'approval-required':214}", "statusDistribution:{active:661,busy:219,scheduled:219,idle:219,'approval-required':219}"),
              ("Functional digital workflow identities.", "Functional operational workflow identities."),
            ],
            Path('apps/portal/assets/public-operations-dashboard-v1.js'): [
              ("GNK_ASG_PUBLIC_OPERATIONS_DASHBOARD_V2_20260705_RESILIENT", "GNK_ASG_PUBLIC_OPERATIONS_DASHBOARD_V3_20260705_OPERATIONAL"),
              ("||1500", "||1537"),
              ("Functional digital workflow identities.", "Functional operational workflow identities."),
              ("Dnevna izvješća, javni katalog i digitalna operativa", "Dnevna izvješća, javni katalog i operativa"),
              ("Digitalni operativni profili", "Operativni profili"),
              ("Digital operations profiles are functional workflow identities", "Operational profiles are functional workflow identities"),
              (">Digital workforce directory<", ">Operational profiles directory<"),
            ],
            Path('apps/portal/public-operations/index.html'): [
              ("digitalnih operativnih profila", "operativnih profila"),
              ("status digitalne operative", "status operative"),
              ("digitalni workflow identiteti", "operativni workflow identiteti"),
              ("public-operations-dashboard-v1.js?v=20260704-2300", "public-operations-dashboard-v1.js?v=20260705-1537"),
            ],
          }

          changed = []
          for path, pairs in replacements.items():
            if not path.exists():
              raise SystemExit(f'Missing required file: {path}')
            text = path.read_text(encoding='utf-8')
            original = text
            for old, new in pairs:
              text = text.replace(old, new)
            if text != original:
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          print('Changed files:')
          for path in changed:
            print(f'- {path}')
          PY
      - name: Verify count, terminology and distribution
        run: |
          set -euxo pipefail
          grep -q 'Array.from({length:1537}' apps/portal/assets/js/digital-workforce-directory-v1.js
          grep -q "count:profiles.length" apps/portal/assets/js/digital-workforce-directory-v1.js
          grep -q 'data.count!==1537' apps/portal/digital-workforce/directory/index.html
          grep -q '<strong>1.537</strong><span>operativnih profila' apps/portal/enterprise/index.html
          grep -q '"profileCount": 1537' apps/portal/data/public-portal-catalog.json
          grep -q 'configuredProfiles:1537' workers/gnk-asg-direct-operator/src/public-operations-v1.js
          grep -q "statusDistribution:{active:661,busy:219,scheduled:219,idle:219,'approval-required':219}" workers/gnk-asg-direct-operator/src/public-operations-v1.js
          grep -q "metric('Operativni profili'" apps/portal/assets/public-operations-dashboard-v1.js
          ! grep -E '1,500|1\.500|configuredProfiles:1500|length:1500|data\.count!==1500|Digitalni operativni profili|digitalnih operativnih profila' \
            apps/portal/enterprise/index.html \
            apps/portal/digital-workforce/index.html \
            apps/portal/digital-workforce/directory/index.html \
            apps/portal/assets/js/digital-workforce-directory-v1.js \
            apps/portal/assets/public-operations-dashboard-v1.js \
            apps/portal/data/public-portal-catalog.json \
            apps/portal/public-operations/index.html \
            workers/gnk-asg-direct-operator/src/public-operations-v1.js
          python - <<'PY'
          assert 661 + 219 + 219 + 219 + 219 == 1537
          print('OPERATIONAL_PROFILE_DISTRIBUTION_OK')
          PY
      - name: Commit normalized profile model
        run: |
          if git diff --quiet; then
            echo 'No profile normalization changes required.'
            exit 0
          fi
          git config user.name 'gnk-asg-review-bot'
          git config user.email 'review-bot@gnk-asg.hr'
          git add \
            apps/portal/enterprise/index.html \
            apps/portal/digital-workforce/index.html \
            apps/portal/digital-workforce/directory/index.html \
            apps/portal/assets/js/digital-workforce-directory-v1.js \
            apps/portal/assets/public-operations-dashboard-v1.js \
            apps/portal/data/public-portal-catalog.json \
            apps/portal/public-operations/index.html \
            workers/gnk-asg-direct-operator/src/public-operations-v1.js
          git commit -m 'content(operations): use 1537 operational profiles'
          git push origin HEAD:enterprise-portal-ui-v3-20260704
