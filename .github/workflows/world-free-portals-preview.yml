name: AKTUAL MEDIA WORLD — FREE Pages preview (manual only)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'World edition ID or all'
        required: true
        type: choice
        options: [all, new-york, mexico-city, sao-paulo, lagos, nairobi, dubai, mumbai, singapore, tokyo, seoul, jakarta, sydney]
        default: all
      confirmation:
        description: 'Type STAGE_FREE_WORLD_12 to create FREE Pages preview sites'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: asg-free-world-portals-deploy
  cancel-in-progress: false

jobs:
  preview-only:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      REQUESTED_CHANNEL: ${{ inputs.channel }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check no-cost preview release gate, languages and noindex
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "STAGE_FREE_WORLD_12" || { echo "::error::Missing typed preview confirmation"; exit 1; }
          test -n "$CF_TOKEN" && test -n "$CF_ACCOUNT" || { echo "::error::Cloudflare secrets unavailable"; exit 1; }
          node tests/test-agent-factory-150-v1.mjs
          node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync('config/control-plane/world-free-portal-network-v1.json','utf8'));
          if(d.sites.length!==12||d.noPaidServices!==true||d.release.state!=='STAGING_ONLY'||d.release.publishDefault!==false)throw Error('World free-only preview fence invalid');
          for(const s of d.sites){
            const html=fs.readFileSync(s.outputDirectory+'/index.html','utf8');
            if(!html.includes('noindex,nofollow')||html.includes('rel="canonical"')||s.publicUrl!==null)throw Error(s.id+': unsafe preview');
          }
          NODE
      - name: Create missing Cloudflare Pages free projects and deploy previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/world-free-preview
          node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync('config/control-plane/world-free-portal-network-v1.json','utf8'));
          const selected=process.env.REQUESTED_CHANNEL==='all'?d.sites:d.sites.filter(s=>s.id===process.env.REQUESTED_CHANNEL);
          if(!selected.length)throw Error('Unknown channel');
          fs.writeFileSync('/tmp/world-free-sites.tsv',selected.map(s=>[s.id,s.projectName,s.outputDirectory].join('\t')).join('\n')+'\n');
          NODE
          printf 'channel\tproject\tverified_url\tcommit_sha\tstatus\n' > artifacts/world-free-preview/evidence.tsv
          while IFS=$'\t' read -r id project directory; do
            endpoint="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$project"
            code=$(curl --silent --show-error -o /tmp/world-project.json -w '%{http_code}' \
              -H "Authorization: Bearer $CF_TOKEN" "$endpoint")
            if [ "$code" = '404' ]; then
              code=$(curl --silent --show-error -o /tmp/world-created.json -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
                --data "{\"name\":\"$project\",\"production_branch\":\"main\"}" \
                "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects")
              { [ "$code" = '200' ] || [ "$code" = '201' ]; } || { echo "::error::Cannot create $project (HTTP $code)"; exit 1; }
            elif [ "$code" != '200' ]; then
              echo "::error::Cannot verify $project (HTTP $code)"; exit 1
            fi
            npx --yes wrangler@4 pages deploy "$directory" --project-name="$project" --branch=main --commit-hash="$GITHUB_SHA"
            url="https://$project.pages.dev/"
            curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$url" -o /tmp/world-live.html
            grep -q 'noindex,nofollow' /tmp/world-live.html || { echo "::error::Noindex missing at $url"; exit 1; }
            grep -q 'AKTUAL MEDIA' /tmp/world-live.html || { echo "::error::Brand absent at $url"; exit 1; }
            printf '%s\t%s\t%s\t%s\tverified-noindex-only\n' "$id" "$project" "$url" "$GITHUB_SHA" >> artifacts/world-free-preview/evidence.tsv
          done < /tmp/world-free-sites.tsv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-free-preview-${{ github.run_id }}
          path: artifacts/world-free-preview
          if-no-files-found: warn
          retention-days: 14
      - name: Report only independently verified public previews
        if: success()
        run: |
          echo '## AKTUAL MEDIA WORLD · staged FREE Pages previews (not indexed editorial releases)' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/world-free-preview/evidence.tsv >> "$GITHUB_STEP_SUMMARY"
