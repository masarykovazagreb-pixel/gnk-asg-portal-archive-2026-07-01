name: Publish Scheduled Editorial Content
on:
  schedule:
    - cron: '20 8 * * *'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Deploy the current exact main SHA even when no package is due'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'apps/portal/data/editorial-plan/**'
      - 'scripts/editorial-publish-scheduled-v1.mjs'
      - 'scripts/validate-editorial-content-policy-v1.mjs'
      - 'scripts/test-editorial-content-policy-v1.mjs'
      - 'workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js'
      - 'workers/gnk-asg-direct-operator/src/public-editorial-asset-router-v1.js'
      - 'workers/gnk-asg-direct-operator/wrangler.mail-proxy-no-routes.toml'
      - '.github/workflows/editorial-scheduled-publish.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: gnk-asg-main-mutation
  cancel-in-progress: false
jobs:
  publish:
    if: vars.GNK_ASG_RELEASE_FENCE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test editorial policy gate
        run: node scripts/test-editorial-content-policy-v1.mjs
      - name: Enforce editorial policy before materialization
        run: node scripts/validate-editorial-content-policy-v1.mjs
      - name: Materialize due editorial pages
        run: node scripts/editorial-publish-scheduled-v1.mjs
      - name: Validate generated editorial package
        run: node scripts/test-editorial-publish-seo-v1.mjs
      - name: Commit due content
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/portal/objave apps/portal/komentari apps/portal/editorial-sitemap.xml apps/portal/data/editorial-plan artifacts/editorial-scheduled-publish.json; then
            echo "No scheduled public or state change is due."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/portal/objave apps/portal/komentari apps/portal/editorial-sitemap.xml apps/portal/data/editorial-plan artifacts/editorial-scheduled-publish.json
          git commit -m "Publish scheduled editorial package"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            echo "Push odbijen (pokusaj $attempt) - main se pomaknuo, radim fetch+rebase."
            git fetch origin main
            git rebase origin/main || { echo "Rebase konflikt."; exit 1; }
            sleep $((attempt * 5))
            if [ "$attempt" = "5" ]; then echo "Push nije uspio nakon 5 pokusaja."; exit 1; fi
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Dispatch exact-SHA production deploy
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_deploy == true)
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          gh workflow run deploy-admin-auth-v6.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f confirm_production_deploy=DEPLOY_ADMIN_AUTH_V6 \
            -f approved_sha="$APPROVED_SHA"
