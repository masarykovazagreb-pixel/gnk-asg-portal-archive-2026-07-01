name: Publish Scheduled Editorial Content
on:
  schedule:
    - cron: '20 8 * * *'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Deploy the current exact main SHA even when no package is due'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'apps/portal/data/editorial-plan/**'
      - 'apps/portal/data/editorial-premium-art.json'
      - 'apps/portal/assets/editorial/*.svg'
      - 'scripts/lib/editorial-premium-art-v1.mjs'
      - 'scripts/generate-editorial-cover-assets-v1.mjs'
      - 'scripts/editorial-publish-scheduled-v1.mjs'
      - 'scripts/build-aktual-media-weekly-v1.mjs'
      - 'scripts/build-aktual-media-weekly-archive-v1.mjs'
      - 'apps/portal/data/aktual-weekly-archives/**'
      - 'apps/portal/en/gnk-aktual/index.html'
      - 'apps/portal/en/gnk-aktual/weekly/**'
      - 'scripts/enforce-nermin-author-seo-v1.mjs'
      - 'scripts/lib/editorial-attribution-v1.mjs'
      - 'scripts/lib/editorial-route-protection-v1.mjs'
      - 'apps/portal/data/news.json'
      - 'apps/portal/data/aktual-weekly.json'
      - 'apps/portal/data/aktual-weekly-curation.json'
      - 'scripts/validate-editorial-content-policy-v1.mjs'
      - 'scripts/test-editorial-content-policy-v1.mjs'
      - 'scripts/test-editorial-publish-seo-v1.mjs'
      - 'workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js'
      - 'workers/gnk-asg-direct-operator/src/public-editorial-asset-router-v1.js'
      - 'workers/gnk-asg-direct-operator/wrangler.mail-proxy-no-routes.toml'
      - '.github/workflows/editorial-scheduled-publish.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: gnk-asg-main-mutation
  cancel-in-progress: false
jobs:
  publish:
    if: vars.GNK_ASG_RELEASE_FENCE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Capture exact generation base SHA
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Test editorial policy gate
        run: node scripts/test-editorial-content-policy-v1.mjs
      - name: Enforce editorial policy before materialization
        run: node scripts/validate-editorial-content-policy-v1.mjs
      - name: Refresh weekly AKTUAL MEDIA magazine when issue week changes
        run: node scripts/build-aktual-media-weekly-v1.mjs
      - name: Materialize bilingual weekly issue and archive pages
        run: node scripts/build-aktual-media-weekly-archive-v1.mjs --refresh
      - name: Keep verified author and neutral editor roles separate on columns
        run: node scripts/enforce-nermin-author-seo-v1.mjs --write
      - name: Materialize due editorial pages
        run: node scripts/editorial-publish-scheduled-v1.mjs
      - name: Regenerate editorial registry and canonical sitemap from materialized pages
        run: |
          node scripts/editorial-registry-v1.mjs
          node scripts/generate-editorial-sitemap-v2.mjs
      - name: Install required ImageMagick WebP generator
        if: ${{ hashFiles('apps/portal/data/editorial-plan/20261019-roto-apfel-commentary.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends imagemagick fonts-dejavu-core
          fi
          convert -version
          convert -size 8x8 xc:white "$RUNNER_TEMP/aktual-webp-functional-check.webp"
          test -s "$RUNNER_TEMP/aktual-webp-functional-check.webp"
          test "$(head -c 4 "$RUNNER_TEMP/aktual-webp-functional-check.webp")" = 'RIFF'
          test "$(dd if="$RUNNER_TEMP/aktual-webp-functional-check.webp" bs=1 skip=8 count=4 status=none)" = 'WEBP'
          identify "$RUNNER_TEMP/aktual-webp-functional-check.webp"

      - name: Validate original premium artwork and generated WebP quality
        if: ${{ hashFiles('apps/portal/data/editorial-premium-art.json') != '' }}
        run: node scripts/test-premium-editorial-art-v1.mjs

      - name: Generate and synchronize approved topical WebP cover for new commentary
        if: ${{ hashFiles('apps/portal/data/editorial-plan/20261019-roto-apfel-commentary.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          route="apps/portal/komentari/roto-dinamic-apfel-prijava-nije-odobrenje/index.html"
          if [ -f "$route" ]; then
            node scripts/generate-editorial-cover-assets-v1.mjs
            printf '["/komentari/roto-dinamic-apfel-prijava-nije-odobrenje/"]\n' > "$RUNNER_TEMP/aktual-image-routes.json"
            node scripts/apply-editorial-publication-completeness-v1.mjs --write --routes-file "$RUNNER_TEMP/aktual-image-routes.json"
            node scripts/editorial-registry-v1.mjs
            node scripts/generate-editorial-sitemap-v2.mjs
            node scripts/audit-editorial-publication-completeness-v1.mjs
          fi
      - name: Validate generated editorial package
        run: node scripts/test-editorial-publish-seo-v1.mjs
      - name: Commit due content
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/portal/objave apps/portal/komentari apps/portal/gnk-aktual apps/portal/en/gnk-aktual/index.html apps/portal/en/gnk-aktual/weekly apps/portal/data/aktual-weekly.json apps/portal/data/aktual-weekly-archives apps/portal/editorial-sitemap.xml apps/portal/sitemap-index.xml apps/portal/data/editorial-registry.json apps/portal/data/editorial-image-manifest.json apps/portal/assets/editorial/generated apps/portal/data/editorial-plan artifacts/editorial-scheduled-publish.json; then
            echo "No scheduled public or state change is due."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/portal/objave apps/portal/komentari apps/portal/gnk-aktual apps/portal/en/gnk-aktual/index.html apps/portal/en/gnk-aktual/weekly apps/portal/data/aktual-weekly.json apps/portal/data/aktual-weekly-archives apps/portal/editorial-sitemap.xml apps/portal/sitemap-index.xml apps/portal/data/editorial-registry.json apps/portal/data/editorial-image-manifest.json apps/portal/assets/editorial/generated apps/portal/data/editorial-plan artifacts/editorial-scheduled-publish.json
          git commit -m "Publish scheduled editorial package"

          # Exact-SHA / single-writer fence: output was generated from one main
          # snapshot and must never be rebased onto a moving main.
          git fetch origin main
          expected_base="${{ steps.base.outputs.sha }}"
          current_main="$(git rev-parse origin/main)"
          if [ "$current_main" != "$expected_base" ]; then
            echo "Main moved during editorial generation: expected $expected_base, found $current_main. Deferring without rebase/push."
            exit 75
          fi

          # Ordinary non-force push is the final compare-and-swap guard.
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Dispatch exact-SHA production deploy
        if: steps.commit.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_deploy == true)
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          gh workflow run deploy-admin-auth-v6.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f confirm_production_deploy=DEPLOY_ADMIN_AUTH_V6 \
            -f approved_sha="$APPROVED_SHA" \
            -f notify_search_engines=false
