name: Diagnose Email Routing now

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-email-routing-now.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read sanitized routing assignment
        id: routing
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json")
          zone=$(curl -fsS "${auth[@]}" 'https://api.cloudflare.com/client/v4/zones?name=gnk-asg.hr')
          zid=$(printf '%s' "$zone" | jq -r '.result[0].id')
          rules=$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/${zid}/email/routing/rules")
          printf '%s' "$rules" | jq '{success,rules:[.result[]|select(.enabled==true)|{name,priority,matchers:[.matchers[]|{type,field,value}],actions:[.actions[]|{type,value}]}]}' > /tmp/routing.json
          cat /tmp/routing.json
      - name: Report diagnostic
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            let data='Diagnostic did not produce output.';
            try{data=fs.readFileSync('/tmp/routing.json','utf8')}catch{}
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:309,body:'## Active Email Routing assignment\n```json\n'+data+'\n```'});
