name: Diagnose Email Routing now

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-email-routing-now.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read sanitized routing assignment
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -u
          mkdir -p /tmp
          if [ -z "${CF_TOKEN:-}" ]; then
            printf '%s\n' '{"status":"TOKEN_NOT_AVAILABLE"}' > /tmp/routing.json
            exit 0
          fi
          auth=(-H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json")
          zone_http=$(curl -sS -o /tmp/zone.json -w '%{http_code}' "${auth[@]}" 'https://api.cloudflare.com/client/v4/zones?name=gnk-asg.hr' || true)
          zid=$(jq -r '.result[0].id // empty' /tmp/zone.json 2>/dev/null || true)
          if [ -z "$zid" ]; then
            jq --arg http "$zone_http" '{status:"ZONE_LOOKUP_FAILED",http:$http,success:(.success // false),errors:(.errors // [])}' /tmp/zone.json > /tmp/routing.json 2>/dev/null || printf '{"status":"ZONE_RESPONSE_INVALID","http":"%s"}\n' "$zone_http" > /tmp/routing.json
            exit 0
          fi
          rules_http=$(curl -sS -o /tmp/rules.json -w '%{http_code}' "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/${zid}/email/routing/rules" || true)
          jq --arg http "$rules_http" '{status:"RULES_READ",http:$http,success:(.success // false),errors:(.errors // []),rules:[.result[]?|select(.enabled==true)|{name,priority,matchers:[.matchers[]?|{type,field,value}],actions:[.actions[]?|{type,value}]}]}' /tmp/rules.json > /tmp/routing.json 2>/dev/null || printf '{"status":"RULES_RESPONSE_INVALID","http":"%s"}\n' "$rules_http" > /tmp/routing.json
          cat /tmp/routing.json
      - name: Report diagnostic
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            let data='{"status":"NO_OUTPUT"}';
            try{data=fs.readFileSync('/tmp/routing.json','utf8')}catch{}
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:309,body:'## Active Email Routing assignment\n```json\n'+data+'\n```'});
