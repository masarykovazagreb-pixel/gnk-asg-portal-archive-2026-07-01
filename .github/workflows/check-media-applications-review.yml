name: Check Media Applications Review

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/portal/media-application/**'
      - 'apps/portal/media-registration-admin/**'
      - 'apps/portal/assets/media-applications-review-v1.css'
      - 'apps/portal/assets/media-applications-review-v1.js'
      - 'apps/portal/assets/media-applications-decision-guard-v1.js'
      - 'workers/gnk-asg-direct-operator/src/media-registration-post-code-v2.js'
      - 'workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js'
      - 'workers/gnk-asg-direct-operator/src/media-registration-review-decision-v1.js'
      - 'workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js'
      - 'workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js'
      - 'workers/gnk-asg-direct-operator/test/unified-auth-enterprise-scope.test.mjs'
      - '.github/workflows/check-media-applications-review.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          set -euxo pipefail
          node --check apps/portal/assets/media-applications-review-v1.js
          node --check apps/portal/assets/media-applications-decision-guard-v1.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/media-registration-review-decision-v1.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/media-registration-post-code-v2.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
      - name: Verify public and protected route separation statically
        run: |
          set -euxo pipefail
          grep -q "const PUBLIC_UI=" workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
          grep -q "'/media-application'" workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
          grep -q "'/media-registration-admin'" workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
          grep -q "path.startsWith('/api/media-registration-admin')" workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
          grep -q "const isPublicRegistration=path=>path==='/media-application'" workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js
          grep -q "const isAdminRegistration=path=>path==='/media-registration-admin'" workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js
      - name: Verify public registration is preserved
        run: |
          set -euxo pipefail
          grep -q "const REGISTRATION_URL='https://www.gnk-asg.hr/media-application/?lang=en'" workers/gnk-asg-direct-operator/src/media-registration-post-code-v2.js
          grep -q "const PUBLIC_UI=" workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
          grep -q "'/media-application'" workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
          grep -q 'Newsroom registration and secure access' apps/portal/media-application/index.html
          grep -q 'This account is only for the media application and does not grant admin access.' apps/portal/media-application/index.html
      - name: Verify protected review data model
        run: |
          set -euxo pipefail
          grep -q "path.startsWith('/api/media-registration-admin')" workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
          grep -q 'authorizeCampaignMailer' workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js
          grep -q 'media_registration_drafts' workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js
          grep -q 'media_registration_documents' workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js
          grep -q 'media_registration_audit' workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js
          grep -q 'downloadUrl' workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js
          grep -q 'cache-control.*no-store' workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js
      - name: Verify advisory quality flags
        run: |
          set -euxo pipefail
          for marker in INCOMPLETE_PROFILE NO_DOCUMENTS DUPLICATE_EMAIL DUPLICATE_OUTLET DOMAIN_MISMATCH STALE_APPLICATION DELIVERY_ERROR ACCESS_EXPIRED; do
            grep -q "$marker" workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js
          done
          grep -q 'hasAttention:flags.length>0' workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js
          grep -q 'Ove oznake su informativne' apps/portal/assets/media-applications-review-v1.js
          grep -q 'Ne odobravaju, ne odbijaju i ne mijenjaju status' apps/portal/assets/media-applications-review-v1.js
          grep -q "api('/decision'" apps/portal/assets/media-applications-review-v1.js
          grep -q 'Review Flags' apps/portal/assets/media-applications-review-v1.js
      - name: Verify revision-safe human decisions
        run: |
          set -euxo pipefail
          grep -q 'expected_revision_required' workers/gnk-asg-direct-operator/src/media-registration-review-decision-v1.js
          grep -q 'decision_reason_required' workers/gnk-asg-direct-operator/src/media-registration-review-decision-v1.js
          grep -q 'stale_review' workers/gnk-asg-direct-operator/src/media-registration-review-decision-v1.js
          grep -q 'human_review_status_changed' workers/gnk-asg-direct-operator/src/media-registration-review-decision-v1.js
          grep -q 'PROTECTED_ADMIN_REVIEW' workers/gnk-asg-direct-operator/src/media-registration-review-decision-v1.js
          grep -q 'noNotification:true' workers/gnk-asg-direct-operator/src/media-registration-review-decision-v1.js
          grep -q 'expectedRevision=currentRevision' apps/portal/assets/media-applications-decision-guard-v1.js
          grep -q 'Za ovaj status obavezno je kratko obrazloženje' apps/portal/assets/media-applications-decision-guard-v1.js
          grep -q 'patchMediaRegistrationDecisionGuard' workers/gnk-asg-direct-operator/src/media-registration-post-code-v2.js
          grep -q 'handleMediaRegistrationReviewDecision' workers/gnk-asg-direct-operator/src/media-registration-post-code-v2.js
      - name: Verify active review UI assets
        run: |
          set -euxo pipefail
          test -s apps/portal/media-application/index.html
          test -s apps/portal/media-registration-admin/index.html
          grep -q 'media-applications-review-v1.js' workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js
          grep -q 'media-applications-review-v1.css' workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js
          grep -q 'media-applications-decision-guard-v1.js' workers/gnk-asg-direct-operator/src/media-registration-review-decision-v1.js
      - name: Preserve review-only execution
        run: |
          set -euxo pipefail
          ! grep -R 'wrangler deploy' apps/portal/assets/media-applications-review-v1.js apps/portal/assets/media-applications-decision-guard-v1.js workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js workers/gnk-asg-direct-operator/src/media-registration-review-decision-v1.js
          ! grep -R 'EMAIL.send' apps/portal/assets/media-applications-review-v1.js apps/portal/assets/media-applications-decision-guard-v1.js workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js workers/gnk-asg-direct-operator/src/media-registration-review-decision-v1.js
          echo 'No deployment or mail send action exists in the review center.'
