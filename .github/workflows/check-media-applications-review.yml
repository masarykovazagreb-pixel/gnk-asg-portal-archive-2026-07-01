name: Check Media Applications Review

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/portal/media-application/**'
      - 'apps/portal/media-registration-admin/**'
      - 'apps/portal/admin-center/**'
      - 'apps/portal/design-review/**'
      - 'apps/portal/enterprise/**'
      - 'apps/portal/mission-control/**'
      - 'apps/portal/assets/media-applications-review-v1.css'
      - 'apps/portal/assets/media-applications-review-v1.js'
      - 'apps/portal/assets/admin-media-applications-entry-v1.js'
      - 'workers/gnk-asg-direct-operator/src/media-registration-post-code-v2.js'
      - 'workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js'
      - 'workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js'
      - 'workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js'
      - 'workers/gnk-asg-direct-operator/test/unified-auth-enterprise-scope.test.mjs'
      - '.github/workflows/check-media-applications-review.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          set -euxo pipefail
          node --check apps/portal/assets/media-applications-review-v1.js
          node --check apps/portal/assets/admin-media-applications-entry-v1.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/media-registration-post-code-v2.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
      - name: Test public and protected route separation
        run: node workers/gnk-asg-direct-operator/test/unified-auth-enterprise-scope.test.mjs
      - name: Verify public registration is preserved
        run: |
          set -euxo pipefail
          grep -q "const REGISTRATION_URL='https://www.gnk-asg.hr/media-application/?lang=en'" workers/gnk-asg-direct-operator/src/media-registration-post-code-v2.js
          grep -q "const PUBLIC_UI=" workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
          grep -q "'/media-application'" workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
          grep -q 'First, register your newsroom' apps/portal/media-application/index.html
          grep -q 'Create access or continue your application' apps/portal/media-application/index.html
      - name: Verify protected review data model
        run: |
          set -euxo pipefail
          grep -q "path.startsWith('/api/media-registration-admin')" workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
          grep -q 'authorizeCampaignMailer' workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js
          grep -q 'media_registration_drafts' workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js
          grep -q 'media_registration_documents' workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js
          grep -q 'media_registration_audit' workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js
          grep -q 'downloadUrl' workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js
          grep -q 'cache-control.*no-store' workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js
      - name: Verify advisory quality flags
        run: |
          set -euxo pipefail
          for marker in INCOMPLETE_PROFILE NO_DOCUMENTS DUPLICATE_EMAIL DUPLICATE_OUTLET DOMAIN_MISMATCH STALE_APPLICATION DELIVERY_ERROR ACCESS_EXPIRED; do
            grep -q "$marker" workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js
          done
          grep -q 'hasAttention:flags.length>0' workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js
          grep -q 'Ove oznake su informativne' apps/portal/assets/media-applications-review-v1.js
          grep -q 'Ne odobravaju, ne odbijaju i ne mijenjaju status' apps/portal/assets/media-applications-review-v1.js
          grep -q "api('/decision'" apps/portal/assets/media-applications-review-v1.js
          grep -q 'Review Flags' apps/portal/assets/media-applications-review-v1.js
      - name: Verify navigation and responsive review coverage
        run: |
          set -euxo pipefail
          grep -q 'admin-media-applications-entry-v1.js' apps/portal/admin-center/index.html
          grep -q 'Pregled media prijava' apps/portal/assets/admin-media-applications-entry-v1.js
          grep -q 'Javna media prijavnica' apps/portal/assets/admin-media-applications-entry-v1.js
          grep -q 'Media Applications Review' apps/portal/enterprise/index.html
          grep -q 'Public Media Application' apps/portal/enterprise/index.html
          grep -q "\['Media Applications Review','/media-registration-admin/'\]" apps/portal/design-review/index.html
          grep -q "\['Public Media Application','/media-application/?lang=en'\]" apps/portal/design-review/index.html
      - name: Verify Mission Control privacy summary
        run: |
          set -euxo pipefail
          grep -q '/api/media-registration-admin/applications?page=1&pageSize=10' apps/portal/mission-control/index.html
          grep -q 'Mission Control prikazuje samo zbirne podatke' apps/portal/mission-control/index.html
          grep -q 'Osobni podaci i dokumenti nisu prikazani' apps/portal/mission-control/index.html
          grep -q 'Public Media Application' apps/portal/mission-control/index.html
          grep -q 'Media Applications Review' apps/portal/mission-control/index.html
          if grep -q 'data\.items' apps/portal/mission-control/index.html; then
            echo 'Mission Control must not render individual application records.' >&2
            exit 1
          fi
      - name: Preserve review-only execution
        run: |
          set -euxo pipefail
          ! grep -R 'wrangler deploy' apps/portal/assets/media-applications-review-v1.js workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js
          ! grep -R 'EMAIL.send' apps/portal/assets/media-applications-review-v1.js workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js
          echo 'No deployment or mail send action exists in the review center.'
