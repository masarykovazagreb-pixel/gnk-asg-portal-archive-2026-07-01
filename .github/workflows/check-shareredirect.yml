name: Provjeri popravljeno preusmjeravanje
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p apps/portal/data/tmp-shareredirect
          python3 -c "
import json
d = json.load(open('apps/portal/data/news_archive.json', encoding='utf-8'))
print(d[0]['share_url'])
print(d[5]['share_url'])
" > /tmp/urls.txt
          cat /tmp/urls.txt
          while read -r u; do
            kod=$(curl -s -o /dev/null -w "%{http_code}" -D - "https://gnk-asg.hr${u}" 2>&1 | grep -i "^http\|^location" )
            echo "=== ${u} ===" >> apps/portal/data/tmp-shareredirect/r.txt
            curl -sI "https://gnk-asg.hr${u}" >> apps/portal/data/tmp-shareredirect/r.txt
          done < /tmp/urls.txt
          cat apps/portal/data/tmp-shareredirect/r.txt
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          BRANCH="shareredirect-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-shareredirect
          git commit -m "check"
          git push origin "$BRANCH"
