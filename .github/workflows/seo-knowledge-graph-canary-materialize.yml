name: SEO Knowledge Graph Canary Materialize

on:
  push:
    branches:
      - agent/seo-knowledge-graph-canary-20260801
    paths:
      - 'scripts/apply-seo-knowledge-graph-v1.mjs'
      - '.github/workflows/seo-knowledge-graph-canary-materialize.yml'

permissions:
  contents: write

concurrency:
  group: seo-knowledge-graph-canary-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seo-knowledge-graph-canary-20260801
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize four-page canary
        run: >-
          node scripts/apply-seo-knowledge-graph-v1.mjs --write
          --only=objave/upravljanje-ugovorima-o-razini-usluge-sla/index.html,en/publications/managing-service-level-agreements/index.html,komentari/dokumentacija-je-jeftinija-od-spora/index.html,en/commentary/documentation-is-cheaper-than-a-dispute/index.html
      - name: Repair EN commentary URL signals
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/portal/en/commentary/documentation-is-cheaper-than-a-dispute/index.html';
          let html = fs.readFileSync(path, 'utf8');
          html = html.replaceAll(
            'https://gnk-asg.hr/en/en/documentation-is-cheaper-than-a-dispute/',
            'https://gnk-asg.hr/en/commentary/documentation-is-cheaper-than-a-dispute/'
          );
          fs.writeFileSync(path, html);
          NODE
      - name: Validate canary scope and URL integrity
        run: |
          node scripts/validate-seo-knowledge-graph-v1.mjs
          node <<'NODE'
          const fs = require('node:fs');
          const files = [
            'apps/portal/objave/upravljanje-ugovorima-o-razini-usluge-sla/index.html',
            'apps/portal/en/publications/managing-service-level-agreements/index.html',
            'apps/portal/komentari/dokumentacija-je-jeftinija-od-spora/index.html',
            'apps/portal/en/commentary/documentation-is-cheaper-than-a-dispute/index.html'
          ];
          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            if (!html.includes('/assets/seo-knowledge-graph-v1.css?v=20260801')) throw new Error(`Missing canary CSS: ${file}`);
            if (!html.includes('/assets/seo-knowledge-graph-v1.js?v=20260801')) throw new Error(`Missing canary JS: ${file}`);
          }
          const en = fs.readFileSync(files[3], 'utf8');
          if (en.includes('/en/en/documentation-is-cheaper-than-a-dispute/')) throw new Error('Invalid /en/en/ URL remains');
          const expected = 'https://gnk-asg.hr/en/commentary/documentation-is-cheaper-than-a-dispute/';
          for (const marker of ['rel="canonical"', 'hreflang="en"', 'property="og:url"', '"url":"']) {
            if (!en.includes(marker)) throw new Error(`Missing URL marker: ${marker}`);
          }
          if ((en.match(new RegExp(expected.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g')) || []).length < 4) {
            throw new Error('Canonical, hreflang, OG and JSON-LD URLs are not aligned');
          }
          NODE
      - name: Commit materialized canary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/portal/objave/upravljanje-ugovorima-o-razini-usluge-sla/index.html \
            apps/portal/en/publications/managing-service-level-agreements/index.html \
            apps/portal/komentari/dokumentacija-je-jeftinija-od-spora/index.html \
            apps/portal/en/commentary/documentation-is-cheaper-than-a-dispute/index.html
          if git diff --cached --quiet; then
            echo 'Canary already materialized.'
            exit 0
          fi
          git commit -m 'feat(seo): materialize four-page knowledge graph canary'
          git push origin HEAD:agent/seo-knowledge-graph-canary-20260801
