name: GNK ASG Emergency Entry Route Hotfix

on:
  pull_request:
    branches:
      - visual-redesign
    paths:
      - 'workers/gnk-asg-emergency-entry-redirect/**'
      - '.github/workflows/emergency-entry-route-hotfix.yml'
  push:
    branches:
      - experience-ai-live-overview
    paths:
      - 'workers/gnk-asg-emergency-entry-redirect/**'
      - '.github/workflows/emergency-entry-route-hotfix.yml'

permissions:
  contents: read

concurrency:
  group: gnk-asg-emergency-entry-route-hotfix
  cancel-in-progress: true

jobs:
  deploy-entry-fix:
    if: github.event_name == 'push' || github.head_ref == 'experience-ai-live-overview'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate isolated worker
        run: |
          set -euo pipefail
          node --check workers/gnk-asg-emergency-entry-redirect/src/index.js
          grep -Fxq 'pattern = "gnk-asg.hr/app"' workers/gnk-asg-emergency-entry-redirect/wrangler.toml
          grep -Fxq 'pattern = "gnk-asg.hr/app/*"' workers/gnk-asg-emergency-entry-redirect/wrangler.toml
          ! grep -q 'www.gnk-asg.hr' workers/gnk-asg-emergency-entry-redirect/wrangler.toml
          grep -Fxq 'scope: /app redirect to existing homepage only' workers/gnk-asg-emergency-entry-redirect/HOTFIX_VERSION.txt
          grep -Fxq 'new portal deployment: false' workers/gnk-asg-emergency-entry-redirect/HOTFIX_VERSION.txt
          grep -Fxq 'production marker: absent' workers/gnk-asg-emergency-entry-redirect/HOTFIX_VERSION.txt
          grep -Fxq 'www route ownership: unchanged' workers/gnk-asg-emergency-entry-redirect/HOTFIX_VERSION.txt
          test ! -e .github/release/PRODUCTION_APPROVED

      - name: Deploy isolated redirect only
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx --yes wrangler@4 deploy --config workers/gnk-asg-emergency-entry-redirect/wrangler.toml > wrangler-hotfix.log 2>&1
          status=$?
          printf '%s' "$status" > wrangler-hotfix.exit
          tail -n 80 wrangler-hotfix.log
          exit "$status"

      - name: Upload deploy diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnk-asg-emergency-entry-deploy-${{ github.run_id }}
          path: |
            wrangler-hotfix.log
            wrangler-hotfix.exit
          if-no-files-found: error
          retention-days: 3

      - name: Stop after failed deploy
        if: steps.deploy.outcome != 'success'
        run: exit 1

      - name: Wait for route propagation
        run: sleep 12

      - name: Prove app entry route
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set +e
          curl --silent --show-error --dump-header app-entry.headers --output /dev/null --max-redirs 0 https://gnk-asg.hr/app/
          header_curl=$?
          app_code=$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' app-entry.headers)
          app_location=$(awk 'tolower($1)=="location:" {gsub("\r", "", $2); value=$2} END {print value}' app-entry.headers)
          app_marker=$(awk 'tolower($1)=="x-gnk-asg-emergency-entry-fix:" {gsub("\r", "", $2); value=$2} END {print value}' app-entry.headers)
          app_final=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --retry 4 --retry-all-errors --retry-delay 3 https://gnk-asg.hr/app/)
          final_curl=$?
          {
            echo "header_curl=${header_curl}"
            echo "app_code=${app_code}"
            echo "app_location=${app_location}"
            echo "app_marker=${app_marker}"
            echo "final_curl=${final_curl}"
            echo "app_final=${app_final}"
          } | tee app-entry-result.txt
          status=0
          test "$header_curl" = '0' || status=1
          [[ "$app_code" =~ ^30[1278]$ ]] || status=1
          [[ "$app_location" =~ ^https://gnk-asg\.hr/?$ ]] || status=1
          test "$app_marker" = 'pwa-start-to-home' || status=1
          test "$final_curl" = '0' || status=1
          test "$app_final" = '200' || status=1
          exit "$status"

      - name: Upload runtime proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnk-asg-emergency-entry-runtime-${{ github.run_id }}
          path: |
            app-entry.headers
            app-entry-result.txt
          if-no-files-found: error
          retention-days: 3

      - name: Stop after failed runtime proof
        if: steps.smoke.outcome != 'success'
        run: exit 1

      - name: Confirm existing homepage remained available
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --retry 4 --retry-all-errors --retry-delay 3 https://gnk-asg.hr/)
          echo "apex=${code}"
          test "$code" = '200'
