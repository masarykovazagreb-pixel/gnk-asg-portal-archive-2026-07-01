name: GNK ASG Emergency Entry Route Hotfix

on:
  workflow_dispatch:
    inputs:
      approval:
        description: Type EMERGENCY_ENTRY_HOTFIX_APPROVED
        required: true
        type: string
      source_commit:
        description: Exact 40-character commit SHA to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gnk-asg-emergency-entry-route-hotfix
  cancel-in-progress: false

jobs:
  deploy-entry-fix:
    if: github.event.inputs.approval == 'EMERGENCY_ENTRY_HOTFIX_APPROVED'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate typed approval and source SHA
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.event.inputs.approval }}' = 'EMERGENCY_ENTRY_HOTFIX_APPROVED'
          printf '%s' '${{ github.event.inputs.source_commit }}' | grep -Eq '^[0-9a-fA-F]{40}$'

      - name: Checkout exact approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_commit }}
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify approved commit and isolated app route
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.inputs.source_commit }}'
          node --check workers/gnk-asg-emergency-entry-redirect/src/index.js
          grep -Fxq 'pattern = "gnk-asg.hr/app"' workers/gnk-asg-emergency-entry-redirect/wrangler.toml
          grep -Fxq 'pattern = "gnk-asg.hr/app/*"' workers/gnk-asg-emergency-entry-redirect/wrangler.toml
          ! grep -q 'www.gnk-asg.hr' workers/gnk-asg-emergency-entry-redirect/wrangler.toml
          grep -Fxq 'new portal deployment: false' workers/gnk-asg-emergency-entry-redirect/HOTFIX_VERSION.txt

      - name: Deploy approved isolated app entry
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config workers/gnk-asg-emergency-entry-redirect/wrangler.toml | tee wrangler-hotfix.log

      - name: Wait for route propagation
        run: sleep 12

      - name: Prove standalone app response
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --dump-header app-entry.headers --output app-entry.html https://gnk-asg.hr/app/
          app_code=$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' app-entry.headers)
          app_marker=$(awk 'tolower($1)=="x-gnk-asg-emergency-entry-fix:" {gsub("\r", "", $2); value=$2} END {print value}' app-entry.headers)
          app_type=$(awk 'tolower($1)=="content-type:" {gsub("\r", "", $2); value=$2} END {print value}' app-entry.headers)
          {
            echo "app_code=${app_code}"
            echo "app_marker=${app_marker}"
            echo "app_type=${app_type}"
          } | tee app-entry-result.txt
          test "$app_code" = '200'
          test "$app_marker" = 'standalone-mobile-entry'
          test "$app_type" = 'text/html;'
          grep -q 'GNK ASG mobilni portal' app-entry.html
          ! grep -qi 'not found' app-entry.html

      - name: Upload runtime proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnk-asg-emergency-entry-runtime-${{ github.run_id }}
          path: |
            wrangler-hotfix.log
            app-entry.headers
            app-entry.html
            app-entry-result.txt
          if-no-files-found: warn
          retention-days: 7
