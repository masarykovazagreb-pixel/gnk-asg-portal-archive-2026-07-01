name: Analysis Direct Static Policy Repair 20260807

on:
  push:
    branches:
      - fix/analysis-direct-static-policy-20260807
    paths:
      - 'scripts/fix-analysis-direct-static-policy-20260807.mjs'
      - '.github/workflows/analysis-direct-static-policy-repair-20260807.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/analysis-direct-static-policy-20260807
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded analysis repair
        run: node scripts/fix-analysis-direct-static-policy-20260807.mjs
      - name: Validate direct static editorial policy
        run: node scripts/validate-direct-static-editorial-v1.mjs apps/portal/analize/rat-dug-i-zlato-kapital-bitcoin-2026/index.html
      - name: Diff guard
        run: git diff --check
      - name: Commit repaired analysis
        run: |
          git config user.name 'gnk-asg-editorial-fix-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/portal/analize/rat-dug-i-zlato-kapital-bitcoin-2026/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(analysis): satisfy direct static editorial policy'
          git push origin HEAD:fix/analysis-direct-static-policy-20260807
