name: Provjeri nove webp slike
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p apps/portal/data/tmp-webpcheck
          for ruta in "/assets/seo-gallery/gnk-asg-ai-asistent.webp" "/assets/cibona-prvak-2026/proslava-2.webp" "/assets/seo-gallery/gnk-asg-ai-asistent.jpg"; do
            kod=$(curl -s -o /dev/null -w "%{http_code}" "https://gnk-asg.hr${ruta}")
            echo "${kod} ${ruta}" >> apps/portal/data/tmp-webpcheck/r.txt
          done
          cat apps/portal/data/tmp-webpcheck/r.txt
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          BRANCH="webpcheck-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-webpcheck
          git commit -m "check"
          git push origin "$BRANCH"
