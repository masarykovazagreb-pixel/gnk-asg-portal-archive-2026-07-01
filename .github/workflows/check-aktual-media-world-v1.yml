name: Check AKTUAL Media World Edition

on:
  pull_request:
    paths:
      - 'apps/portal/gnk-aktual/**'
      - 'apps/portal/en/gnk-aktual/**'
      - 'apps/portal/assets/aktual-media-world-v1.css'
      - 'apps/portal/assets/aktual-media-world-v1.js'
      - 'apps/portal/assets/aktual-media-layout-seo-v1.js'
      - 'apps/portal/sitemap.xml'
      - 'scripts/test-aktual-media-world-v1.mjs'
      - '.github/workflows/check-aktual-media-world-v1.yml'
  push:
    branches: [main]
    paths:
      - 'apps/portal/gnk-aktual/**'
      - 'apps/portal/en/gnk-aktual/**'
      - 'apps/portal/assets/aktual-media-world-v1.css'
      - 'apps/portal/assets/aktual-media-world-v1.js'
      - 'apps/portal/assets/aktual-media-layout-seo-v1.js'
      - 'apps/portal/sitemap.xml'
      - 'scripts/test-aktual-media-world-v1.mjs'
      - '.github/workflows/check-aktual-media-world-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate AKTUAL Media world-edition contract
        run: node scripts/test-aktual-media-world-v1.mjs
