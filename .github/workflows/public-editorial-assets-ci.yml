name: Public Editorial Assets Contract
on:
  pull_request:
    paths:
      - 'workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js'
      - 'workers/gnk-asg-direct-operator/src/public-editorial-asset-router-v1.js'
      - 'workers/gnk-asg-direct-operator/wrangler.mail-proxy-no-routes.toml'
      - 'apps/portal/objave/**'
      - 'apps/portal/komentari/**'
      - 'apps/portal/analize/**'
      - 'apps/portal/en/publications/**'
      - 'apps/portal/en/commentary/**'
      - 'apps/portal/en/analyses/**'
      - 'scripts/test-public-editorial-asset-routes-v1.mjs'
      - 'scripts/test-final-release-v31.mjs'
      - '.github/workflows/public-editorial-assets-ci.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          set -euo pipefail
          node --check workers/gnk-asg-direct-operator/src/public-editorial-asset-router-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          node --check scripts/test-public-editorial-asset-routes-v1.mjs
          node --check scripts/test-final-release-v31.mjs
      - name: Editorial asset route runtime contract
        run: node scripts/test-public-editorial-asset-routes-v1.mjs
      - name: Final release integration contract
        run: node scripts/test-final-release-v31.mjs
