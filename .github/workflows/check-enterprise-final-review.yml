name: Check Enterprise Final Review

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/portal/enterprise/**'
      - 'apps/portal/admin-center/**'
      - 'apps/portal/about/**'
      - 'apps/portal/en/about/**'
      - 'apps/portal/entities/**'
      - 'apps/portal/digital-workforce/**'
      - 'apps/portal/en/digital-workforce/**'
      - 'workers/gnk-asg-direct-operator/src/**'
      - 'workers/gnk-asg-direct-operator/test/**'
      - 'workers/gnk-asg-direct-operator/wrangler.toml'
      - 'workers/gnk-asg-direct-operator/wrangler.review-preview.toml'
      - '.github/workflows/check-enterprise-final-review.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Syntax and unit tests
        run: |
          set -euxo pipefail
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/index-enterprise-projects-runtime-v1.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/mail-studio-extension-v4.js
          node workers/gnk-asg-direct-operator/test/global-service-centres.test.mjs
          node workers/gnk-asg-direct-operator/test/mail-studio-centre-routing.test.mjs
          node workers/gnk-asg-direct-operator/test/enterprise-final-review.test.mjs

      - name: Enterprise protected runtime contract
        run: |
          set -euxo pipefail
          auth=workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
          runtime=workers/gnk-asg-direct-operator/src/index-enterprise-projects-runtime-v1.js
          test -s "$auth"
          test -s "$runtime"
          grep -q "'/enterprise'" "$auth"
          grep -q "'/mission-control'" "$auth"
          grep -q "'/registry-center'" "$auth"
          grep -q "'/deployment'" "$auth"
          grep -q "'/mobile-admin'" "$auth"
          grep -q "'/api/enterprise-projects'" "$auth"
          grep -q 'reviewSafety' "$auth"
          grep -q 'productionDeploy:false' "$auth"
          grep -q 'bulkMail:false' "$auth"
          grep -q 'automaticPublication:false' "$auth"
          grep -q 'reviewEnvironment' "$runtime"
          grep -q 'x-robots-tag' "$runtime"
          grep -q 'noindex, nofollow, noarchive' "$runtime"

      - name: Protected route auth contract
        run: |
          set -euxo pipefail
          auth=workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
          for route in enterprise admin-center mission-control registry-center deployment mobile-admin seo mail-studio email-status; do
            grep -Eq "'/${route}'|\"/${route}\"" "$auth"
          done
          grep -q 'meta name="robots" content="noindex,nofollow"' "$auth"
          grep -q 'isUi(path)' "$auth"
          grep -q 'loginPage(next)' "$auth"

      - name: Review public-route indexing lock
        run: |
          set -euxo pipefail
          for file in \
            apps/portal/about/index.html \
            apps/portal/en/about/index.html \
            apps/portal/digital-workforce/index.html \
            apps/portal/en/digital-workforce/index.html; do
            test -s "$file"
            grep -qi 'rel="canonical"' "$file"
            grep -qi 'name="description"' "$file"
          done
          runtime=workers/gnk-asg-direct-operator/src/index-enterprise-projects-runtime-v1.js
          grep -q 'reviewEnvironment' "$runtime"
          grep -q 'x-robots-tag' "$runtime"
          grep -q 'x-gnk-review-indexing' "$runtime"
          grep -q 'noindex, nofollow, noarchive' "$runtime"
          grep -Eq 'PUBLIC_ENVIRONMENT = ".*(review|preview|isolated)' workers/gnk-asg-direct-operator/wrangler.toml
          grep -Eq 'PUBLIC_ENVIRONMENT = ".*(review|preview|isolated)' workers/gnk-asg-direct-operator/wrangler.review-preview.toml

      - name: Production safety lock
        run: |
          set -euxo pipefail
          wrangler=workers/gnk-asg-direct-operator/wrangler.toml
          grep -q '^workers_dev = true' "$wrangler"
          grep -q '^preview_urls = true' "$wrangler"
          grep -q 'MAIL_MANUAL_LIVE = "false"' "$wrangler"
          grep -q 'MEDIA_OUTREACH_LIVE = "false"' "$wrangler"
          ! grep -Eq '^[[:space:]]*(routes|route|zone_name)[[:space:]]*=' "$wrangler"
          ! grep -Eq '^[[:space:]]*\[\[routes\]\]' "$wrangler"
