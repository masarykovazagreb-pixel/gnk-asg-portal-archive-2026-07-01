name: Deploy Contact Receiving Centers V1

on:
  push:
    branches:
      - project-50-white-integrated-menu
    paths:
      - '.github/deploy-contact-centers-v1.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gnk-asg-contact-centers-v1-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate contact receiving centers
        shell: bash
        run: |
          set -euxo pipefail
          node --check workers/gnk-asg-direct-operator/src/mail-receiving-centers-v1.js
          node --check workers/gnk-asg-contact-api-worker/src/index-centers-v4.js
          node --test workers/gnk-asg-contact-api-worker/tests/contact-centers.test.mjs
          grep -q 'main = "src/index-centers-v4.js"' workers/gnk-asg-contact-api-worker/wrangler.toml
          grep -q 'GNK_ASG_MAIL_RECEIVING_CENTERS_V1_20260628' workers/gnk-asg-direct-operator/src/mail-receiving-centers-v1.js
          grep -q 'GNK_ASG_CONTACT_CENTERS_WRAPPER_V4_20260628' workers/gnk-asg-contact-api-worker/src/index-centers-v4.js
          cd workers/gnk-asg-contact-api-worker
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-contact-api
      - name: Deploy Contact API Worker
        working-directory: workers/gnk-asg-contact-api-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-contact-api
      - name: Verify Contact API without submitting a message
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          for(let attempt=1;attempt<=20;attempt++){
            const response=await fetch(`https://gnk-asg.hr/api/contact-submit?cb=${Date.now()}-${attempt}`,{headers:{'cache-control':'no-cache','pragma':'no-cache'}});
            const text=await response.text();
            const centerHeader=response.headers.get('x-gnk-asg-contact-centers')||'';
            const centersVersion=response.headers.get('x-gnk-asg-receiving-centers')||'';
            const ok=response.status===200&&text.includes('"status": "READY"')&&centerHeader.includes('GNK_ASG_CONTACT_CENTERS_WRAPPER_V4_20260628')&&centersVersion.includes('GNK_ASG_MAIL_RECEIVING_CENTERS_V1_20260628');
            console.log(JSON.stringify({attempt,status:response.status,centerHeader,centersVersion,ok}));
            if(ok)process.exit(0);
            await sleep(8000);
          }
          process.exit(1);
          JS
      - name: Record successful Contact API deployment
        uses: actions/github-script@v7
        with:
          script: |
            const path='docs/deployments/contact-centers-v1-live.json';
            const branch='project-50-white-integrated-menu';
            let sha;
            try {
              const current=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:branch});
              if(!Array.isArray(current.data))sha=current.data.sha;
            } catch(error) { if(error.status!==404)throw error; }
            const payload={ok:true,release:'GNK_ASG_CONTACT_CENTERS_WRAPPER_V4_20260628',receivingCenters:10,sourceCommit:context.sha,workflowRunId:context.runId,branch,deployedAt:new Date().toISOString(),contactSubmitted:false,mailSent:false};
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch,sha,message:'Record Contact centers deployment [skip ci]',content:Buffer.from(JSON.stringify(payload,null,2)+'\n').toString('base64')});
