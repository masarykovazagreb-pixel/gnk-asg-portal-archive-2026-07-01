name: Test extended market pulse data (one-off)
on:
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run and capture output
        run: |
          echo "# extended market-pulse test" > /tmp/d.md
          echo '```' >> /tmp/d.md
          node scripts/refresh-market-pulse.mjs >> /tmp/d.md 2>&1 || echo "EXIT: $?" >> /tmp/d.md
          echo '```' >> /tmp/d.md
          echo "## sample" >> /tmp/d.md
          echo '```json' >> /tmp/d.md
          python3 -c "
import json
d = json.load(open('apps/portal/data/market-pulse.json'))
print('instrumentsOk', d['instrumentsOk'], 'total', d['instrumentsTotal'])
print('sample index sparkline len:', len(d['indices'][0].get('sparkline',[])))
print('fear greed history len:', len(d['crypto']['fearGreed'].get('history',[])))
print('gainers:', [g['name'] for g in d['crypto']['gainers']])
print('losers:', [g['name'] for g in d['crypto']['losers']])
print('topCoins count:', len(d['crypto']['topCoins']))
print('sample coin sparkline len:', len(d['crypto']['topCoins'][0].get('sparkline',[])))
" >> /tmp/d.md
          echo '```' >> /tmp/d.md
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" --title "extended market-pulse test" --body-file /tmp/d.md
