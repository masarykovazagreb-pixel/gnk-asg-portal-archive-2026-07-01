name: One-Time Patch Deploy Verifier V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-patch-deploy-verifier-v2.yml'

permissions:
  contents: write

concurrency:
  group: one-time-patch-deploy-verifier-v2
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Replace stale route-owner and contact assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deploy-admin-auth-v6.yml')
          s=p.read_text()
          old='''          assert_file "new publication V34 route owner" grep -Fiq -- 'x-gnk-route-owner: GNK_ASG_UNIFIED_AUTH_V34_PUBLIC_EDITORIAL_ASSETS_GNK_PUBLIC_EDITORIAL_ASSETS_V2_20260715' deploy-verification/article-rates.html.headers
          assert_file "new commentary V34 route owner" grep -Fiq -- 'x-gnk-route-owner: GNK_ASG_UNIFIED_AUTH_V34_PUBLIC_EDITORIAL_ASSETS_GNK_PUBLIC_EDITORIAL_ASSETS_V2_20260715' deploy-verification/commentary-speed.html.headers
'''
          new='''          assert_file "new publication current route owner" bash -c "grep -Fiq -- 'x-gnk-route-owner:' deploy-verification/article-rates.html.headers && grep -Fiq -- 'GNK_PUBLIC_EDITORIAL_ASSETS_V2_20260715' deploy-verification/article-rates.html.headers && grep -Eiq -- 'GNK_ASG_UNIFIED_AUTH_V(35|36)_' deploy-verification/article-rates.html.headers"
          assert_file "new commentary current route owner" bash -c "grep -Fiq -- 'x-gnk-route-owner:' deploy-verification/commentary-speed.html.headers && grep -Fiq -- 'GNK_PUBLIC_EDITORIAL_ASSETS_V2_20260715' deploy-verification/commentary-speed.html.headers && grep -Eiq -- 'GNK_ASG_UNIFIED_AUTH_V(35|36)_' deploy-verification/commentary-speed.html.headers"
'''
          if old not in s:
              raise SystemExit('legacy route-owner assertions not found')
          s=s.replace(old,new)
          old='''          grep -q '"ready": true' deploy-verification/contact-ready.json
          grep -q '"storage"' deploy-verification/contact-ready.json
          grep -q '"mail"' deploy-verification/contact-ready.json
          grep -q '"transport"' deploy-verification/contact-ready.json
'''
          new='''          jq -e '\n            (.ready == true and has("storage") and has("mail") and has("transport"))\n            or\n            (.status == "READY" and .bindings.kv == true and .bindings.r2 == true and .bindings.email == true)\n          ' deploy-verification/contact-ready.json >/dev/null
'''
          if old not in s:
              raise SystemExit('legacy contact readiness assertions not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
          grep -Fq 'new publication current route owner' .github/workflows/deploy-admin-auth-v6.yml
          grep -Fq '.status == "READY"' .github/workflows/deploy-admin-auth-v6.yml
      - name: Commit verifier patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-admin-auth-v6.yml
          git commit -m 'fix(ci): accept current route owner and contact worker readiness'
          git push origin HEAD:main

# activation: 2026-07-15T10:00:00+02:00
