name: Check Bilingual Publication Routes V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/portal/objave/**'
      - 'apps/portal/publications/**'
      - '.github/workflows/check-bilingual-publication-routes-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - name: Verify Croatian routes
        shell: bash
        run: |
          set -euxo pipefail
          for slug in \
            likvidnosni-jaz-i-upravljanje-obrtnim-kapitalom \
            revizijski-odbor-i-neovisnost-nadzora \
            dobavljacki-rizik-koncentracije-jednog-partnera \
            cijena-kapitala-i-investicijske-odluke \
            whistleblowing-politika-i-interna-kontrola \
            prekogranicno-oporezivanje-transferne-cijene \
            digitalizacija-nabave-i-transparentnost-dobavljaca \
            javni-podaci-autorski-rad-odgovorno-upravljanje
          do
            file="apps/portal/objave/$slug/index.html"
            test -s "$file"
            grep -Fq '<title>' "$file"
            grep -Fq 'name="description"' "$file"
            grep -Fq 'rel="canonical"' "$file"
            grep -Fq "/objave/$slug/" apps/portal/objave/index.html
          done
      - name: Verify English routes
        shell: bash
        run: |
          set -euxo pipefail
          for slug in \
            technology-capital-and-responsible-governance \
            ai-governance-race-us-eu-china \
            critical-minerals-energy-transition-geopolitics \
            global-debt-two-decades-cheap-money \
            demographic-reshuffling-global-economy \
            end-cheap-globalization-supply-chains \
            global-water-scarcity-next-crisis \
            antimicrobial-resistance-silent-pandemic
          do
            file="apps/portal/en/publications/$slug/index.html"
            test -s "$file"
            grep -Fq '<title>' "$file"
            grep -Fq 'name="description"' "$file"
            grep -Fq 'rel="canonical"' "$file"
            grep -Fq "/en/publications/$slug/" apps/portal/en/publications/index.html
          done
          echo BILINGUAL_PUBLICATION_ROUTES_OK
