name: Check Bilingual Publication Routes V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/portal/objave/**'
      - 'apps/portal/analize/**'
      - 'apps/portal/komentari/**'
      - 'apps/portal/en/publications/**'
      - 'apps/portal/en/analyses/**'
      - 'apps/portal/en/commentary/**'
      - '.github/workflows/check-bilingual-publication-routes-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - name: Verify current HR and EN paired routes
        shell: bash
        run: |
          set -euxo pipefail
          pairs=(
            "apps/portal/objave/tehnologija-kapital-i-odgovorno-upravljanje/index.html|apps/portal/en/publications/technology-capital-and-responsible-governance/index.html"
            "apps/portal/analize/kapitalna-struktura-i-operativna-otpornost/index.html|apps/portal/en/analyses/capital-structure-and-operational-resilience/index.html"
            "apps/portal/komentari/inovacija-bez-povjerenja-nije-napredak/index.html|apps/portal/en/commentary/innovation-without-trust-is-not-progress/index.html"
          )
          for pair in "${pairs[@]}"; do
            hr="${pair%%|*}"; en="${pair##*|}"
            test -s "$hr"; test -s "$en"
            grep -Fq 'rel="canonical"' "$hr"
            grep -Fq 'rel="canonical"' "$en"
            grep -Fq 'hreflang="hr"' "$en"
            grep -Fq 'hreflang="en"' "$hr"
          done
          echo BILINGUAL_PUBLICATION_ROUTES_OK
