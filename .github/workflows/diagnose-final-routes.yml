name: Diagnose Final Routes

on:
  push:
    branches: [verify-final-portal]
    paths: ['.github/workflows/diagnose-final-routes.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/diagnose-final-routes.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read protected route states
        shell: bash
        run: |
          set -u
          CB="${GITHUB_RUN_ID}"
          MAIL_CODE=$(curl -sS -D /tmp/mail.h -o /tmp/mail.b -w '%{http_code}' "https://gnk-asg.hr/api/mail-center/send-readiness?cb=${CB}" || true)
          echo "MAIL_HTTP=${MAIL_CODE}"
          grep -iE '^(content-type|location|x-gnk-asg-[^:]+):' /tmp/mail.h || true
          head -c 1200 /tmp/mail.b | tr '\n' ' ' || true
          echo
          MEDIA_CODE=$(curl -sS -D /tmp/media.h -o /tmp/media.b -w '%{http_code}' "https://gnk-asg.hr/api/media-command-center/delivery-status?cb=${CB}" || true)
          echo "MEDIA_HTTP=${MEDIA_CODE}"
          grep -iE '^(content-type|location|x-gnk-asg-[^:]+):' /tmp/media.h || true
          head -c 1200 /tmp/media.b | tr '\n' ' ' || true
          echo
