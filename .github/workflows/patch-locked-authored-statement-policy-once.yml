name: Patch Locked Authored Statement Policy Once
on:
  push:
    branches: [seo/omega-entity-signals-20260808]
    paths: [.github/workflows/patch-locked-authored-statement-policy-once.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: seo/omega-entity-signals-20260808
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Add exact-path locked authored statement exception
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/validate-direct-static-editorial-v1.mjs')
          s=p.read_text(encoding='utf-8')
          anchor="const ARTICLE_TYPES = new Set(['Article', 'NewsArticle', 'OpinionNewsArticle', 'AnalysisNewsArticle', 'Report']);"
          addition="""const LOCKED_AUTHORED_STATEMENTS = new Set([\n  'apps/portal/objave/osvrt-na-2013-omega-factoring-nermin-sefic/index.html',\n]);"""
          if addition not in s:
              if anchor not in s: raise SystemExit('validator anchor missing')
              s=s.replace(anchor, anchor+'\n'+addition, 1)
          old="""  if (EXCEPTION_META.test(html)) {\n    return { file, skipped: true, reason: 'digital-workforce-worker-exception', errors };\n  }\n"""
          new=old+"""\n  if (LOCKED_AUTHORED_STATEMENTS.has(file)) {\n    return { file, skipped: true, reason: 'locked-authored-statement-exception', errors };\n  }\n"""
          if 'locked-authored-statement-exception' not in s:
              if old not in s: raise SystemExit('exception block anchor missing')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          t=Path('scripts/test-direct-static-editorial-v1.mjs')
          q=t.read_text(encoding='utf-8')
          insert="""\n// A specifically enumerated, previously published authored statement may remain\n// text-locked even when it predates the later 3,000-word direct-static rule.\nconst lockedRelative = 'apps/portal/objave/osvrt-na-2013-omega-factoring-nermin-sefic/index.html';\nconst lockedAbsolute = path.join(temp, lockedRelative);\nfs.mkdirSync(path.dirname(lockedAbsolute), { recursive: true });\nfs.writeFileSync(lockedAbsolute, html({ words: 10 }));\nresult = spawnSync(process.execPath, [validator, lockedRelative], {\n  cwd: temp, encoding: 'utf8',\n  env: { ...process.env, DIRECT_EDITORIAL_MIN_WORDS: '3000', DIRECT_EDITORIAL_MIN_INTERNAL_LINKS: '5' },\n});\nassert.equal(result.status, 0, result.stderr || result.stdout);\nassert.match(result.stdout, /locked-authored-statement-exception/u);\n"""
          marker="fs.rmSync(temp, { recursive: true, force: true });"
          if 'locked-authored-statement-exception' not in q:
              if marker not in q: raise SystemExit('test marker missing')
              q=q.replace(marker,insert+'\n'+marker,1)
          t.write_text(q,encoding='utf-8')
          PY
      - name: Run regression tests
        run: node scripts/test-direct-static-editorial-v1.mjs
      - name: Commit narrow policy exception and remove helper
        run: |
          rm .github/workflows/patch-locked-authored-statement-policy-once.yml
          git config user.name 'gnk-asg-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/validate-direct-static-editorial-v1.mjs scripts/test-direct-static-editorial-v1.mjs .github/workflows/patch-locked-authored-statement-policy-once.yml
          git commit -m 'ci(editorial): preserve locked authored Omega statement'
          git push origin HEAD:seo/omega-entity-signals-20260808
