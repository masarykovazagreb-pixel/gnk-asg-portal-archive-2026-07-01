name: Deploy Private Admin UI Main

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/portal/assets/private-admin-menu-v1.js"
      - "apps/portal/assets/private-admin-menu-v1.css"
      - "apps/portal/assets/admin-auth-controls-v1.js"
      - "apps/portal/assets/admin-auth-controls-v1.css"
      - "workers/gnk-asg-direct-operator/src/index-private-ui-assets-v1.js"
      - "workers/gnk-asg-direct-operator/wrangler.mail-proxy-no-routes.toml"
      - ".github/workflows/deploy-private-admin-ui-main.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GNK_ASG_OPERATOR_TOKEN: ${{ secrets.GNK_ASG_OPERATOR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate
        run: |
          test -n "$GNK_ASG_OPERATOR_TOKEN"
          node --check workers/gnk-asg-direct-operator/src/index-private-ui-assets-v1.js
          node --check apps/portal/assets/private-admin-menu-v1.js
          node --check apps/portal/assets/admin-auth-controls-v1.js
      - name: Deploy
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          token_hash=$(printf '%s' "$GNK_ASG_OPERATOR_TOKEN" | sha256sum | awk '{print $1}')
          test ${#token_hash} -eq 64
          npx --yes wrangler@4 deploy --config wrangler.mail-proxy-no-routes.toml --name gnk-asg-direct-operator --var "OPERATOR_TOKEN_SHA256:$token_hash" --keep-vars
      - name: Verify raw token and session
        run: |
          sleep 15
          code=$(curl --silent --show-error --output auth.json --write-out '%{http_code}' --header "Authorization: Bearer $GNK_ASG_OPERATOR_TOKEN" --header "x-operator-token: $GNK_ASG_OPERATOR_TOKEN" "https://gnk-asg.hr/api/operator-auth-check?cb=$(date +%s)")
          cat auth.json
          test "$code" = "200"
          code=$(curl --silent --show-error --output login.html --dump-header login.headers --write-out '%{http_code}' --cookie-jar cookies.txt --request POST --data-urlencode "token=$GNK_ASG_OPERATOR_TOKEN" --data-urlencode 'next=/mail-studio/' 'https://gnk-asg.hr/mail-studio/')
          test "$code" = "303"
          for path in mail-studio admin-center operator-dashboard operator-mobile mail-studio-pro; do
            code=$(curl --silent --show-error --output "$path.html" --write-out '%{http_code}' --cookie cookies.txt "https://gnk-asg.hr/$path/?cb=$(date +%s)")
            test "$code" = "200"
            grep -q 'private-admin-menu-v1.js' "$path.html"
            grep -q 'admin-auth-controls-v1.js' "$path.html"
          done
          echo "PRIVATE_ADMIN_AUTH_MAIN_OK=true"
