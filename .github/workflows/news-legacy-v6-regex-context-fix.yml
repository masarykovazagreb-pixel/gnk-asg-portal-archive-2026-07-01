name: GNK ASG Legacy News V6 Context Regex Fix

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  fix:
    if: contains(github.event.issue.title, 'RUN GNK ASG LEGACY NEWS V6 CONTEXT FIX')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fix two parser lines by function context
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python - <<'PY'
          from pathlib import Path
          path=Path('workers/gnk-asg-direct-operator/src/index-publication-news-hotfix.js')
          lines=path.read_text(encoding='utf-8').splitlines()
          dollar=chr(36)
          targets={}
          for index,line in enumerate(lines):
              if line.strip()=='function rawTag(block,name){': targets['raw']=index+1
              if line.strip()=='function attr(block,name,attribute){': targets['attr']=index+1
          if set(targets)!={'raw','attr'}: raise SystemExit(f'unexpected function targets: {targets}')
          lines[targets['raw']]="  const match=String(block||'').match(new RegExp(`<"+dollar+"{name}[^>]*>([\\\\s\\\\S]*?)</"+dollar+"{name}>`,'i'));"
          lines[targets['attr']]="  const match=String(block||'').match(new RegExp(`<"+dollar+"{name}\\\\b[^>]*\\\\b"+dollar+"{attribute}=[\"']([^\"']+)[\"'][^>]*>`,'i'));"
          path.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          node --check workers/gnk-asg-direct-operator/src/index-publication-news-hotfix.js
          python - <<'PY'
          from pathlib import Path
          text=Path('workers/gnk-asg-direct-operator/src/index-publication-news-hotfix.js').read_text(encoding='utf-8')
          if text.count(r'([\\s\\S]*?)')!=1: raise SystemExit('character class escape not fixed')
          if text.count(r'\\b[^>]*\\b')!=1: raise SystemExit('word boundary escape not fixed')
          print('parser_escape_check=ok')
          PY
      - name: Commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/gnk-asg-direct-operator/src/index-publication-news-hotfix.js
          git commit -m 'Fix dynamic RSS parser regex construction'
          git pull --rebase origin main
          node --check workers/gnk-asg-direct-operator/src/index-publication-news-hotfix.js
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "context_regex_commit=${{ steps.commit.outputs.sha }} workflow=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
