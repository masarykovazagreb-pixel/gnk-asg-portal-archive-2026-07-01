name: Deploy Mail Studio Multilingual

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-mail-media-strict-english.yml"
      - "apps/portal/mail-studio/**"
      - "apps/portal/admin-center/**"
      - "apps/portal/assets/mail-studio-*.js"
      - "apps/portal/media-command-center/**"
      - "apps/portal/assets/media-center-*.js"
      - "workers/gnk-asg-direct-operator/src/index-mail-studio-bridge-v17.js"
      - "workers/gnk-asg-direct-operator/src/mail-studio-extension-v1.js"
      - "workers/gnk-asg-direct-operator/src/email-signature-contract-v1.js"
      - "workers/gnk-asg-direct-operator/src/media-global-auto-reply-v1.js"
      - "workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v1.js"
      - "workers/gnk-asg-direct-operator/src/index-final-admin-gateway-projects-v1.js"
      - "workers/gnk-asg-direct-operator/wrangler.runtime.toml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-mail-studio-multilingual
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Report deploy start
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body=$(printf '## Mail Studio multilingual deploy — started\n\n- Commit: `%s`\n- Run: https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh api "repos/${GITHUB_REPOSITORY}/issues/83/comments" -f body="$body"

      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Validate Mail Studio source and Worker graph
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/portal/assets/mail-studio-multilingual-v25.js
          node --check workers/gnk-asg-direct-operator/src/mail-studio-extension-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-final-admin-gateway-projects-v1.js
          grep -q "sefic@gnk-asg.hr" workers/gnk-asg-direct-operator/src/mail-studio-extension-v1.js
          grep -q "ubo@gnk-asg.hr" workers/gnk-asg-direct-operator/src/mail-studio-extension-v1.js
          grep -q "press@gnk-asg.hr" workers/gnk-asg-direct-operator/src/mail-studio-extension-v1.js
          grep -q "assistant@gnk-asg.hr" workers/gnk-asg-direct-operator/src/mail-studio-extension-v1.js
          grep -q "name:'Sydney'" workers/gnk-asg-direct-operator/src/mail-studio-extension-v1.js
          grep -q "languagePolicy:'MULTILINGUAL'" workers/gnk-asg-direct-operator/src/mail-studio-extension-v1.js
          grep -q "handleMailStudioInbound" workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v1.js
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.runtime.toml --name gnk-asg-direct-operator

      - name: Deploy Worker and assets to Cloudflare
        id: cloudflare
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.runtime.toml --name gnk-asg-direct-operator

      - name: Verify deployed multilingual Mail Studio
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          base="https://gnk-asg-direct-operator.beckuphome.workers.dev"
          ok=false
          for attempt in $(seq 1 30); do
            cb="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            mail_code=$(curl -sS -D /tmp/mail.headers -o /tmp/mail.html -w '%{http_code}' "$base/mail-studio/?cb=$cb" || true)
            asset_code=$(curl -sS -o /tmp/mail-multi.js -w '%{http_code}' "$base/assets/mail-studio-multilingual-v25.js?cb=$cb" || true)
            version_code=$(curl -sS -o /tmp/version.json -w '%{http_code}' "$base/data/portal-version.json?cb=$cb" || true)
            if { [ "$mail_code" = "200" ] || [ "$mail_code" = "401" ] || [ "$mail_code" = "403" ]; } \
              && [ "$asset_code" = "200" ] \
              && [ "$version_code" = "200" ] \
              && grep -q 'GNK_ASG_MAIL_STUDIO_MULTILINGUAL_V25_20260702' /tmp/mail-multi.js \
              && grep -q 'press@gnk-asg.hr' /tmp/mail-multi.js \
              && grep -q 'assistant@gnk-asg.hr' /tmp/mail-multi.js \
              && grep -q 'GNK_ASG_MAIL_STUDIO_EXTENSION_V1_20260702_MULTILINGUAL_ROUTING' /tmp/version.json; then
              ok=true
              break
            fi
            sleep 6
          done
          echo "mail_code=$mail_code" >> "$GITHUB_OUTPUT"
          echo "asset_code=$asset_code" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          [ "$ok" = "true" ]

      - name: Report deploy result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          VALIDATE_STATUS: ${{ steps.validate.outcome }}
          CLOUDFLARE_STATUS: ${{ steps.cloudflare.outcome }}
          VERIFY_STATUS: ${{ steps.verify.outcome }}
          MAIL_CODE: ${{ steps.verify.outputs.mail_code }}
          ASSET_CODE: ${{ steps.verify.outputs.asset_code }}
          VERSION_CODE: ${{ steps.verify.outputs.version_code }}
        shell: bash
        run: |
          body=$(printf '## Mail Studio multilingual deploy — %s\n\n- Commit: `%s`\n- Source validation: **%s**\n- Cloudflare deploy: **%s**\n- Live verification: **%s**\n- Mail Studio HTTP: `%s`\n- Multilingual asset HTTP: `%s`\n- Version endpoint HTTP: `%s`\n- Run: https://github.com/%s/actions/runs/%s\n' "$JOB_STATUS" "$GITHUB_SHA" "$VALIDATE_STATUS" "$CLOUDFLARE_STATUS" "$VERIFY_STATUS" "$MAIL_CODE" "$ASSET_CODE" "$VERSION_CODE" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh api "repos/${GITHUB_REPOSITORY}/issues/83/comments" -f body="$body"
