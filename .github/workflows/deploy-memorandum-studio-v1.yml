name: Deploy Memorandum Studio V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-memorandum-studio-v1.yml'
      - 'apps/portal/memorandum-studio/**'
      - 'apps/portal/assets/memorandum-studio-v1.css'
      - 'apps/portal/assets/memorandum-studio-v1.js'
      - 'apps/portal/assets/admin-center-memorandum-v1.js'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-memorandum-studio-v1.yml'
      - 'apps/portal/memorandum-studio/**'
      - 'apps/portal/assets/memorandum-studio-v1.css'
      - 'apps/portal/assets/memorandum-studio-v1.js'
      - 'apps/portal/assets/admin-center-memorandum-v1.js'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnk-asg-memorandum-studio-v1
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate Memorandum Studio V1
        shell: bash
        run: |
          set -euxo pipefail
          node --check apps/portal/assets/memorandum-studio-v1.js
          node --check apps/portal/assets/admin-center-memorandum-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js
          test -s apps/portal/assets/memorandum-studio-v1.css
          test -s apps/portal/memorandum-studio/index.html
          grep -q 'Memorandum Studio' apps/portal/memorandum-studio/index.html
          grep -q '/api/admin-mail-send' apps/portal/assets/memorandum-studio-v1.js
          grep -q '%PDF-1.4' apps/portal/assets/memorandum-studio-v1.js
          grep -q 'GNK_ASG_logo_gold_transparent.png' apps/portal/memorandum-studio/index.html
          grep -q 'GNK_DINAMO_Ltd_logo_gold_transparent.png' apps/portal/memorandum-studio/index.html
          grep -q 'admin-center-memorandum-v1.js' workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator
      - name: Deploy Cloudflare Worker
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator
      - name: Verify Memorandum Studio V1
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 18); do
            ADMIN_HEADERS=$(mktemp)
            ADMIN=$(curl -fsS -D "$ADMIN_HEADERS" "https://gnk-asg.hr/admin-center/?cb=${GITHUB_RUN_ID}-${n}" || true)
            STUDIO=$(curl -fsS "https://gnk-asg.hr/memorandum-studio/?embedded=1&cb=${GITHUB_RUN_ID}-${n}" || true)
            STUDIO_JS=$(curl -fsS "https://gnk-asg.hr/assets/memorandum-studio-v1.js?cb=${GITHUB_RUN_ID}-${n}" || true)
            if printf '%s' "$ADMIN" | grep -q 'admin-center-memorandum-v1.js' \
              && printf '%s' "$STUDIO" | grep -q 'Memorandum Studio' \
              && printf '%s' "$STUDIO" | grep -q 'memorandum-studio-v1.css' \
              && printf '%s' "$STUDIO_JS" | grep -q '/api/admin-mail-send' \
              && grep -qi 'x-gnk-asg-memorandum-studio: GNK_ASG_MEMORANDUM_STUDIO_V1_20260627' "$ADMIN_HEADERS"; then
                exit 0
            fi
            sleep 10
          done
          exit 1
