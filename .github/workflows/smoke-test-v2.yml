name: Puni smoke test v2 (jednokratno)
on: workflow_dispatch
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p apps/portal/data/tmp-smoke2
          for ruta in "/" "/en/" "/digital-workforce/" "/gnk-aktual/" "/objave/" "/komentari/" "/analize/" "/trgovina/" "/kontakt/" "/contact/" "/admin/" "/sitemap.xml" "/sitemap-index.xml" "/robots.txt" "/en/publications/" "/en/commentary/"; do
            kod=$(curl -s -o /dev/null -w "%{http_code}" "https://gnk-asg.hr${ruta}")
            echo "${kod} ${ruta}" >> apps/portal/data/tmp-smoke2/rezultat.txt
          done
          cat apps/portal/data/tmp-smoke2/rezultat.txt
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          BRANCH="smoke2-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-smoke2
          git commit -m "smoke2"
          git push origin "$BRANCH"
