name: Validate Market Primary Alias Runtime

on:
  pull_request:
    paths:
      - 'workers/gnk-asg-direct-operator/src/public-market-data-v1.js'
      - 'apps/portal/assets/market.js'
      - 'scripts/test-market-primary-alias-runtime.mjs'
      - '.github/workflows/validate-market-primary-alias-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check workers/gnk-asg-direct-operator/src/public-market-data-v1.js
          node --check scripts/test-market-primary-alias-runtime.mjs
      - name: Market primary alias runtime contract
        run: node scripts/test-market-primary-alias-runtime.mjs
