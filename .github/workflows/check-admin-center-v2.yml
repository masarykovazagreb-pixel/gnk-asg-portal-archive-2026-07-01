name: Check Admin Center V2

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/portal/admin-center/index.html'
      - 'apps/portal/assets/public-floating-menu-v2.js'
      - 'workers/gnk-asg-direct-operator/wrangler.toml'
      - '.github/workflows/check-admin-center-v2.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate current static Admin Center contract
        run: |
          set -euxo pipefail
          html=apps/portal/admin-center/index.html
          menu=apps/portal/assets/public-floating-menu-v2.js
          test -s "$html"
          test -s "$menu"
          node --check "$menu"
          grep -q '<meta name="robots" content="noindex,nofollow,noarchive">' "$html"
          grep -q 'Admin centar / Admin Center' "$html"
          grep -q 'ZAŠTIĆENO / PROTECTED' "$html"
          grep -q '/assets/public-floating-menu-v2.js' "$html"
          grep -q 'Admin centar sam ne pokreće slanje, kampanju, automatsku objavu ni worker funkcije' "$html"
          ! grep -Eq '<form|type="submit"|data-action="(send|publish|deploy|execute)' "$html"

      - name: Validate canonical safe navigation surface
        run: |
          set -euxo pipefail
          html=apps/portal/admin-center/index.html
          for route in \
            /mail-studio/ \
            /email-status/ \
            /campaign-mailer/ \
            /admin-center/mail-search/ \
            /admin-center/contacts/ \
            /admin-center/pdf/ \
            /worker-ops/ \
            /media-registration-admin/ \
            /admin-center/news-publication/ \
            /operator-dashboard/ \
            /digital-headquarters/ \
            /admin-center/workers/ \
            /admin-center/editorial-approval/ \
            /digital-workforce/ \
            /workers/ \
            /visual-index/ \
            /objave/ \
            /komentari/; do
            grep -Fq "href=\"$route\"" "$html"
          done
          test "$(grep -c 'class=\"card' "$html")" -ge 18

      - name: Confirm review isolation and production locks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euxo pipefail
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "$changed"
          wrangler=workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'main = "src/index-digital-workforce-v1.js"' "$wrangler"
          grep -q 'PUBLIC_ENVIRONMENT = "review-direct-operator"' "$wrangler"
          grep -q 'MAIL_MANUAL_LIVE = "false"' "$wrangler"
          grep -q 'MEDIA_OUTREACH_LIVE = "false"' "$wrangler"
          grep -q 'NEWS_AUTO_PUBLICATION_SCHEDULED_LIVE = "false"' "$wrangler"
          ! grep -Eq '^[[:space:]]*routes[[:space:]]*=|^[[:space:]]*\[\[routes\]\]|^[[:space:]]*zone_name[[:space:]]*=' "$wrangler"
          ! printf '%s\n' "$changed" | grep -E '(^|/)\.env($|\.)|secrets|cloudflare-production'
