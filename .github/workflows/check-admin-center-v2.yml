name: Check Admin Center V2

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/portal/admin-center/index.html'
      - 'apps/portal/assets/admin-center-v2.css'
      - 'apps/portal/assets/admin-center-v2.js'
      - 'apps/portal/assets/admin-center-health-v1.js'
      - 'apps/portal/assets/admin-media-applications-entry-v1.js'
      - 'apps/portal/assets/data/operator-os-config.json'
      - '.github/workflows/check-admin-center-v2.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate Admin Center assets
        run: |
          set -euxo pipefail
          html=apps/portal/admin-center/index.html
          js=apps/portal/assets/admin-center-v2.js
          css=apps/portal/assets/admin-center-v2.css
          media=apps/portal/assets/admin-media-applications-entry-v1.js
          node --check "$js"
          node --check apps/portal/assets/admin-center-health-v1.js
          node --check "$media"
          test -s "$html"
          test -s "$css"
          grep -q '/assets/admin-center-v2.css' "$html"
          grep -q '/assets/admin-center-v2.js' "$html"
          grep -q '/assets/admin-center-health-v1.js' "$html"
          grep -q '/assets/admin-media-applications-entry-v1.js' "$html"
          test "$(grep -c 'class="sidebar"' "$html")" -eq 1
          test "$(grep -c 'id="moduleNav"' "$html")" -eq 1
          grep -q 'id="moduleFrame"' "$html"
          grep -q 'id="commandDialog"' "$html"
          grep -q 'AbortController' "$js"
          grep -q 'MutationObserver' "$js"
          grep -q 'prefers-reduced-motion' "$css"

      - name: Validate canonical safe routes
        run: |
          set -euxo pipefail
          js=apps/portal/assets/admin-center-v2.js
          media=apps/portal/assets/admin-media-applications-entry-v1.js
          for route in /mail-studio/ /operator-dashboard/ /media-command-center/ /media-registration-admin/ /media-application/ /auto-editor/ /news-admin/ /pdf-publisher/; do
            grep -Fq "'$route'" "$js"
          done
          grep -Fq '/media-application/?lang=en' apps/portal/assets/data/operator-os-config.json
          grep -q 'Pregled media prijava' "$media"
          grep -q 'Javna media prijavnica' "$media"
          ! grep -E 'https?://' "$js" apps/portal/assets/admin-center-v2.css "$media"

      - name: Confirm locked public entry points unchanged
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          ! printf '%s\n' "$changed" | grep -E '^(apps/portal/index\.html|apps/portal/en/index\.html|workers/gnk-asg-direct-operator/wrangler\.toml)$'
