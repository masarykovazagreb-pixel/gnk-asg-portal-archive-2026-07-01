name: Visual Redesign Preview Artifact

on:
  workflow_dispatch:
  push:
    branches:
      - visual-redesign
    paths:
      - 'apps/portal/**'
      - 'workers/**'
      - 'contracts/**'
      - 'docs/**'
      - '.github/workflows/visual-redesign-preview.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/portal/**'
      - 'workers/**'
      - 'contracts/**'
      - 'docs/**'
      - '.github/workflows/visual-redesign-preview.yml'

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout visual-redesign
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify required portal files
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/portal/index.html
          test -f apps/portal/en/index.html
          test -f apps/portal/app/index.html
          test -f apps/portal/operator-mobile/index.html
          test -f apps/portal/operator-dashboard/index.html
          test -f apps/portal/review/index.html
          test -f apps/portal/assets/brand/gnk-asg-global-layer.css
          test -f apps/portal/assets/brand/gnk-asg-global-layer.js
          test -f apps/portal/data/navigation.json
          test -f apps/portal/data/review-status.json
          test -f apps/portal/data/design-system.json
          ! grep -R "GNK_ASG_FORCE_OPERATOR_TOKEN" apps/portal

      - name: Validate JavaScript and JSON
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/portal/assets/brand/gnk-asg-global-layer.js
          node --check apps/portal/assets/js/publications-shared.js
          node --check workers/gnk-asg-auto-editor-worker/src/index.js
          node -e "JSON.parse(require('fs').readFileSync('apps/portal/data/navigation.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('apps/portal/data/review-status.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('apps/portal/data/design-system.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('apps/portal/site.webmanifest','utf8'))"

      - name: Verify premium features
        shell: bash
        run: |
          set -euo pipefail
          grep -q "gnk-asg-float-home" apps/portal/assets/brand/gnk-asg-global-layer.js
          grep -q "gnk-asg-float-ai" apps/portal/assets/brand/gnk-asg-global-layer.js
          grep -q "gnk-asg-premium-menu" apps/portal/assets/brand/gnk-asg-global-layer.js
          grep -q "gnk-asg-theme" apps/portal/assets/brand/gnk-asg-global-layer.js
          grep -q "capture=\"environment\"" apps/portal/operator-mobile/index.html
          grep -q "publish.gnk-asg.hr/api/publications/publish" apps/portal/operator-mobile/index.html
          grep -q "operator/contact-inbox" apps/portal/operator-dashboard/index.html
          grep -q "api/mail-center/sent" apps/portal/operator-dashboard/index.html
          grep -q "GNK ASG Premium Preview" apps/portal/review/index.html

      - name: Build static preview package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview-artifact
          cp -R apps/portal/. preview-artifact/
          printf '%s\n' "Branch: visual-redesign" "Commit: $GITHUB_SHA" "Production changed: false" "Cloudflare deployed: false" > preview-artifact/PREVIEW_BUILD.txt

      - name: Build complete repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repository-snapshot
          git archive --format=zip --output="repository-snapshot/GNK_ASG_visual-redesign_${GITHUB_SHA}.zip" HEAD
          printf '%s\n' "Branch: visual-redesign" "Commit: $GITHUB_SHA" "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)" "Tracked files only: true" "Secrets included: false" > repository-snapshot/SNAPSHOT_MANIFEST.txt

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnk-asg-visual-redesign-preview
          path: preview-artifact
          if-no-files-found: error
          retention-days: 14

      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: gnk-asg-repository-snapshot-${{ github.sha }}
          path: repository-snapshot
          if-no-files-found: error
          retention-days: 30
