name: GNK ASG Visual Index News Images

on:
  push:
    branches: [main]
    paths:
      - 'apps/portal/assets/visual-index-full-gallery.js'
      - 'apps/portal/assets/visual-index-central-v7.js'
      - 'apps/portal/visual-index/**'
      - '.github/workflows/visual-index-news-images-live.yml'
  workflow_dispatch:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  deploy-and-verify:
    if: github.event_name != 'issues' || contains(github.event.issue.title, 'RUN GNK ASG VISUAL INDEX NEWS IMAGES')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Visual Index integration
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/portal/assets/visual-index-full-gallery.js
          node --check apps/portal/assets/visual-index-central-v7.js
          grep -q 'visual-index-central-v7.js' apps/portal/assets/visual-index-full-gallery.js
          grep -q 'cleanVisualCards' apps/portal/assets/visual-index-full-gallery.js
          grep -q 'invalidSrc' apps/portal/assets/visual-index-full-gallery.js
          grep -q 'mapNews' apps/portal/assets/visual-index-central-v7.js
          grep -q "getJson('/data/news.json')" apps/portal/assets/visual-index-central-v7.js
          grep -q 'gnk-news-gallery-item' apps/portal/assets/visual-index-central-v7.js
          grep -q "addEventListener('error'" apps/portal/assets/visual-index-central-v7.js
      - name: Deploy current Worker and assets
        id: deploy
        shell: bash
        run: |
          set +e
          npx --yes wrangler@4 deploy --config workers/gnk-asg-direct-operator/wrangler.toml > deploy.log 2>&1
          code=$?
          cat deploy.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Wait for propagation
        if: steps.deploy.outputs.code == '0'
        run: sleep 15
      - name: Verify production Visual Index and image MIME types
        id: verify
        if: steps.deploy.outputs.code == '0'
        shell: bash
        run: |
          set +e
          : > verify.log
          failed=0

          visual_code=$(curl --silent --show-error --location --output visual.html --write-out '%{http_code}' --retry 4 --retry-all-errors --retry-delay 2 'https://gnk-asg.hr/visual-index/?cb=visual-news')
          loader_code=$(curl --silent --show-error --location --output loader.js --write-out '%{http_code}' --retry 4 --retry-all-errors --retry-delay 2 'https://gnk-asg.hr/assets/visual-index-full-gallery.js?cb=visual-news')
          central_code=$(curl --silent --show-error --location --output central.js --write-out '%{http_code}' --retry 4 --retry-all-errors --retry-delay 2 'https://gnk-asg.hr/assets/visual-index-central-v7.js?cb=visual-news')
          news_code=$(curl --silent --show-error --location --output news.json --write-out '%{http_code}' --retry 4 --retry-all-errors --retry-delay 2 'https://gnk-asg.hr/data/news.json?cb=visual-news')
          echo "VISUAL_HTTP=$visual_code" >> verify.log
          echo "LOADER_HTTP=$loader_code" >> verify.log
          echo "CENTRAL_HTTP=$central_code" >> verify.log
          echo "NEWS_HTTP=$news_code" >> verify.log
          [ "$visual_code" = '200' ] || failed=1
          [ "$loader_code" = '200' ] || failed=1
          [ "$central_code" = '200' ] || failed=1
          [ "$news_code" = '200' ] || failed=1
          grep -q 'cleanVisualCards' loader.js || { echo 'LIVE_CLEANUP_MISSING' >> verify.log; failed=1; }
          grep -q 'invalidSrc' loader.js || { echo 'LIVE_INVALID_FILTER_MISSING' >> verify.log; failed=1; }
          grep -q 'mapNews' central.js || { echo 'LIVE_NEWS_MAPPER_MISSING' >> verify.log; failed=1; }
          grep -q "getJson('/data/news.json')" central.js || { echo 'LIVE_NEWS_SOURCE_MISSING' >> verify.log; failed=1; }
          grep -q 'gnk-news-gallery-item' central.js || { echo 'LIVE_NEWS_CARD_MISSING' >> verify.log; failed=1; }

          node - <<'NODE' > image-urls.txt 2>> verify.log
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('news.json','utf8'));
          const items=Array.isArray(payload)?payload:(Array.isArray(payload?.items)?payload.items:[]);
          const fallback=value=>!value||/news-fallback\.svg|placeholder|favicon|logo|crest|badge|emblem/i.test(String(value));
          const imageOf=item=>String(item?.image||item?.imageUrl||'').trim();
          const articleOf=item=>String(item?.url||item?.link||item?.sourceUrl||'').trim();
          const eligible=items.filter(item=>{
            const image=imageOf(item),article=articleOf(item);
            return !item?.imageFallback&&!fallback(image)&&/^https?:\/\//i.test(image)&&/^https?:\/\//i.test(article)&&image!==article&&/\.(?:avif|gif|jpe?g|png|svg|webp)(?:[?#]|$)/i.test(image);
          });
          console.error(`NEWS_ITEMS=${items.length}`);
          console.error(`VISUAL_ELIGIBLE=${eligible.length}`);
          console.error(`FILTERED_OUT=${items.length-eligible.length}`);
          console.error(`FALLBACK_ELIGIBLE=${eligible.filter(item=>fallback(imageOf(item))).length}`);
          console.error(`ARTICLE_AS_IMAGE=${eligible.filter(item=>imageOf(item)===articleOf(item)).length}`);
          if(eligible.length<20)process.exitCode=1;
          eligible.slice(0,20).forEach(item=>console.log(imageOf(item)));
          NODE
          if [ $? -ne 0 ]; then failed=1; fi

          : > mime.log
          valid_images=0
          checked=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            checked=$((checked+1))
            code=$(curl --silent --show-error --location --range 0-1023 --output /dev/null --dump-header image.headers --write-out '%{http_code}' --max-time 20 "$url" || true)
            type=$(awk -F': ' 'tolower($1)=="content-type"{gsub("\r","");v=$2} END{print v}' image.headers)
            echo "$code | $type | $url" >> mime.log
            if [[ "$type" == image/* ]] && { [ "$code" = '200' ] || [ "$code" = '206' ]; }; then valid_images=$((valid_images+1)); fi
          done < image-urls.txt
          echo "MIME_CHECKED=$checked" >> verify.log
          echo "MIME_VALID_IMAGES=$valid_images" >> verify.log
          cat mime.log >> verify.log
          if [ "$valid_images" -lt 10 ]; then failed=1; fi

          cat verify.log
          echo "code=$failed" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-index-news-images-production
          path: |
            verify.log
            mime.log
            image-urls.txt
            deploy.log
          retention-days: 14
      - name: Report issue-triggered result
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "VISUAL_INDEX_DEPLOY_CODE=${{ steps.deploy.outputs.code }}"
            echo "VISUAL_INDEX_VERIFY_CODE=${{ steps.verify.outputs.code }}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```text'
            cat verify.log 2>/dev/null || true
            echo '```'
          } > issue-report.md
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body-file issue-report.md
      - name: Enforce success
        if: always()
        shell: bash
        run: |
          test "${{ steps.deploy.outputs.code }}" = '0'
          test "${{ steps.verify.outputs.code }}" = '0'
