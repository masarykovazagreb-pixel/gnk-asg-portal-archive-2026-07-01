name: GNK ASG Verified News Publications and Visual Index

on:
  push:
    branches: [main]
    paths:
      - 'apps/portal/assets/visual-index-full-gallery.js'
      - 'apps/portal/assets/visual-index-central-v8.js'
      - 'apps/portal/visual-index/**'
      - 'apps/portal/assets/business-news-v16.js'
      - 'apps/portal/vijesti/**'
      - 'apps/portal/news/**'
      - 'workers/gnk-asg-direct-operator/src/news-curation-v10.js'
      - 'workers/gnk-asg-direct-operator/src/index-news-lifecycle-v12.js'
      - 'workers/gnk-asg-direct-operator/src/index-portal-experience-v10.js'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v22-news.js'
      - 'workers/gnk-asg-direct-operator/src/article-visual-v2.js'
      - 'workers/gnk-asg-direct-operator/src/index-article-automation-v2.js'
      - 'workers/gnk-asg-direct-operator/src/index-publication-seo-v3.js'
      - '.github/workflows/visual-index-news-images-live.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: gnk-asg-content-production
  cancel-in-progress: true

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate News V16 syntax
        id: news_syntax
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            node --check workers/gnk-asg-direct-operator/src/news-curation-v10.js
            node --check workers/gnk-asg-direct-operator/src/index-news-lifecycle-v12.js
            node --check workers/gnk-asg-direct-operator/src/index-portal-experience-v10.js
            node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v22-news.js
            node --check apps/portal/assets/business-news-v16.js
          } 2>&1 | tee news-syntax.log

      - name: Validate publication and R2 visual syntax
        id: publication_syntax
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            node --check workers/gnk-asg-direct-operator/src/article-visual-v2.js
            node --check workers/gnk-asg-direct-operator/src/index-article-automation-v2.js
            node --check workers/gnk-asg-direct-operator/src/index-publication-seo-v3.js
          } 2>&1 | tee publication-syntax.log

      - name: Validate Visual Index V8 syntax
        id: visual_syntax
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            node --check apps/portal/assets/visual-index-full-gallery.js
            node --check apps/portal/assets/visual-index-central-v8.js
          } 2>&1 | tee visual-syntax.log

      - name: Validate content contracts
        id: contracts
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            grep -q 'GNK_ASG_NEWS_LIFECYCLE_V16_VERIFIED_MEDIA_20260626' workers/gnk-asg-direct-operator/src/news-curation-v10.js
            grep -q 'export const NEWS_MINIMUM=15' workers/gnk-asg-direct-operator/src/news-curation-v10.js
            grep -q 'export const ACTIVE_NEWS_LIMIT=100' workers/gnk-asg-direct-operator/src/news-curation-v10.js
            grep -q 'export const ARCHIVE_PRUNE_AT=900' workers/gnk-asg-direct-operator/src/news-curation-v10.js
            grep -q 'export const ARCHIVE_RETAIN_AFTER_PRUNE=450' workers/gnk-asg-direct-operator/src/news-curation-v10.js
            grep -q 'fallbackImagesAllowed:false' workers/gnk-asg-direct-operator/src/news-curation-v10.js
            grep -q 'business-news-v16.js?v=20260626-news-v16' apps/portal/vijesti/index.html
            grep -q 'business-news-v16.js?v=20260626-news-v16' apps/portal/news/index.html
            grep -q 'GNK_ASG_ARTICLE_VISUAL_V3_R2_CANONICAL_20260626' workers/gnk-asg-direct-operator/src/article-visual-v2.js
            grep -q 'cover-2400x1350.svg' workers/gnk-asg-direct-operator/src/article-visual-v2.js
            grep -q 'social-1200x630.svg' workers/gnk-asg-direct-operator/src/article-visual-v2.js
            grep -q 'portrait-1600x2000.svg' workers/gnk-asg-direct-operator/src/article-visual-v2.js
            grep -q 'GNK_ASG_PUBLICATION_SEO_V4_R2_VISUALS_20260626' workers/gnk-asg-direct-operator/src/index-publication-seo-v3.js
            grep -q 'visual-index-central-v8.js?v=20260626-v8' apps/portal/assets/visual-index-full-gallery.js
            grep -q 'mapNews' apps/portal/assets/visual-index-central-v8.js
            grep -q "getJson('/data/publications.json')" apps/portal/assets/visual-index-central-v8.js
            grep -q "getJson('/data/news.json')" apps/portal/assets/visual-index-central-v8.js
            grep -q 'main = "src/index-admin-hub-v23-aktual.js"' workers/gnk-asg-direct-operator/wrangler.toml
          } 2>&1 | tee contracts.log

      - name: Enforce package validation before deploy
        id: package
        shell: bash
        env:
          NEWS_SYNTAX: ${{ steps.news_syntax.outcome }}
          PUBLICATION_SYNTAX: ${{ steps.publication_syntax.outcome }}
          VISUAL_SYNTAX: ${{ steps.visual_syntax.outcome }}
          CONTRACTS: ${{ steps.contracts.outcome }}
        run: |
          printf 'news=%s\npublication=%s\nvisual=%s\ncontracts=%s\n' "$NEWS_SYNTAX" "$PUBLICATION_SYNTAX" "$VISUAL_SYNTAX" "$CONTRACTS" | tee package.log
          test "$NEWS_SYNTAX" = success
          test "$PUBLICATION_SYNTAX" = success
          test "$VISUAL_SYNTAX" = success
          test "$CONTRACTS" = success
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator 2>&1 | tee -a ../../package.log

      - name: Deploy current Worker and assets
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy --config workers/gnk-asg-direct-operator/wrangler.toml 2>&1 | tee deploy.log

      - name: Wait for propagation
        if: steps.deploy.outcome == 'success'
        run: sleep 18

      - name: Warm and verify production content
        id: verify
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node <<'JS' 2>&1 | tee verify.log
          const fs=require('node:fs');
          const base='https://gnk-asg.hr';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function get(path,timeout=420000){try{const response=await fetch(`${base}${path}${path.includes('?')?'&':'?'}cb=${Date.now()}`,{headers:{accept:'application/json,text/html;q=0.9','cache-control':'no-cache'},signal:AbortSignal.timeout(timeout)});return{status:response.status,text:await response.text()}}catch(error){return{status:0,text:'',error:String(error)}}}
          const validNews=item=>Boolean(item?.verified&&item?.verification?.article?.ok&&item?.verification?.image?.ok&&/^https?:\/\//i.test(item?.url||'')&&/^https?:\/\//i.test(item?.image||'')&&!/news-fallback\.svg/i.test(item?.image||'')&&String(item?.summary||'').trim().length>=60&&String(item?.source||'').trim());
          (async()=>{
            const warm=await get('/data/news.json?warm=1');
            let report={warmStatus:warm.status,failures:['not_checked']};
            for(let attempt=1;attempt<=10;attempt++){
              const [feedResponse,statusResponse,archiveResponse,hr,en,visual,publications,visualStatus]=await Promise.all([get('/data/news.json',60000),get('/data/news-automation-status.json',60000),get('/data/news-archive.json',60000),get('/vijesti/',60000),get('/news/',60000),get('/visual-index/?lang=en',60000),get('/data/publications.json',60000),get('/data/article-visual-status.json',60000)]);
              let feed={},status={},archive={},publicationData={},visualData={};try{feed=JSON.parse(feedResponse.text)}catch{}try{status=JSON.parse(statusResponse.text)}catch{}try{archive=JSON.parse(archiveResponse.text)}catch{}try{publicationData=JSON.parse(publications.text)}catch{}try{visualData=JSON.parse(visualStatus.text)}catch{}
              const items=Array.isArray(feed.items)?feed.items:[],invalid=items.filter(item=>!validNews(item)),failures=[];
              if(feedResponse.status!==200)failures.push(`feed_http=${feedResponse.status}`);
              if(feed.version!=='GNK_ASG_NEWS_LIFECYCLE_V16_VERIFIED_MEDIA_20260626')failures.push(`version=${feed.version||'missing'}`);
              if(items.length<15||items.length>100)failures.push(`items=${items.length}`);
              if(invalid.length)failures.push(`invalid=${invalid.length}`);
              if(status.newsRefreshesPerDay!==3||status.minimumVerifiedLinks!==15)failures.push('schedule_contract');
              if(status.archivePruneAt!==900||status.archiveRetainAfterPrune!==450||status.archiveHardLimit!==1000)failures.push('archive_contract');
              if(Number(archive.count||0)>1000)failures.push(`archive_count=${archive.count}`);
              if(hr.status!==200||!hr.text.includes('business-news-v16.js'))failures.push(`hr=${hr.status}`);
              if(en.status!==200||!en.text.includes('business-news-v16.js'))failures.push(`en=${en.status}`);
              if(visual.status!==200||!visual.text.includes('visual-index-full-gallery.js'))failures.push(`visual=${visual.status}`);
              if(publications.status!==200||publicationData.version!=='GNK_ASG_PUBLICATION_SEO_V4_R2_VISUALS_20260626')failures.push(`publications=${publications.status}:${publicationData.version||'missing'}`);
              if(visualStatus.status!==200||visualData.visualVersion!=='GNK_ASG_ARTICLE_VISUAL_V3_R2_CANONICAL_20260626')failures.push(`visual_status=${visualStatus.status}:${visualData.visualVersion||'missing'}`);
              report={checkedAt:new Date().toISOString(),attempt,warmStatus:warm.status,failures,feed:{status:feed.status,count:items.length,freshCount:feed.freshCount,verifiedCount:feed.verifiedCount,successfulSourceCount:feed.successfulSourceCount,updatedAt:feed.updatedAt},automation:{schedule:status.newsSchedule,lastNewsRefresh:status.lastNewsRefresh,lastAutoEditor:status.lastAutoEditor},archive:{count:archive.count,pruneAt:archive.pruneAt,retainAfterPrune:archive.retainAfterPrune,hardLimit:archive.hardLimit},publications:{count:publicationData.count,version:publicationData.version,visualContract:publicationData.visualContract},articleVisual:visualData,codes:{feed:feedResponse.status,status:statusResponse.status,archive:archiveResponse.status,hr:hr.status,en:en.status,visual:visual.status,publications:publications.status,visualStatus:visualStatus.status}};
              fs.writeFileSync('verification.json',JSON.stringify(report,null,2));
              console.log(JSON.stringify(report));
              if(!failures.length)process.exit(0);
              await sleep(15000);
            }
            process.exit(1);
          })().catch(error=>{console.error(error);process.exit(1)});
          JS

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnk-asg-content-production-evidence
          path: |
            news-syntax.log
            publication-syntax.log
            visual-syntax.log
            contracts.log
            package.log
            deploy.log
            verify.log
            verification.json
          if-no-files-found: warn
          retention-days: 14

      - name: Report canonical result to Issue 120
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NEWS_SYNTAX: ${{ steps.news_syntax.outcome }}
          PUBLICATION_SYNTAX: ${{ steps.publication_syntax.outcome }}
          VISUAL_SYNTAX: ${{ steps.visual_syntax.outcome }}
          CONTRACTS: ${{ steps.contracts.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          report=$(cat verification.json 2>/dev/null || printf '{"error":"production verification not reached"}')
          {
            echo "GNK ASG content production run"
            echo
            echo "News syntax: **${NEWS_SYNTAX}**"
            echo "Publication syntax: **${PUBLICATION_SYNTAX}**"
            echo "Visual syntax: **${VISUAL_SYNTAX}**"
            echo "Contracts: **${CONTRACTS}**"
            echo "Package: **${PACKAGE}**"
            echo "Deploy: **${DEPLOY}**"
            echo "Production verify: **${VERIFY}**"
            echo "Workflow: ${RUN_URL}"
            echo
            echo '```json'
            echo "$report"
            echo '```'
            for file in news-syntax.log publication-syntax.log visual-syntax.log contracts.log package.log deploy.log verify.log; do
              if [ -s "$file" ]; then echo; echo "### $file"; echo '```text'; tail -n 35 "$file"; echo '```'; fi
            done
          } > issue-report.md
          gh issue comment 120 --repo "$GITHUB_REPOSITORY" --body-file issue-report.md

      - name: Enforce successful production content
        if: always()
        env:
          PACKAGE: ${{ steps.package.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          test "$PACKAGE" = success
          test "$DEPLOY" = success
          test "$VERIFY" = success
