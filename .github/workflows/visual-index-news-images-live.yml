name: GNK ASG Visual Index News Images

on:
  push:
    branches: [main]
    paths:
      - 'apps/portal/assets/visual-index-full-gallery.js'
      - 'apps/portal/visual-index/**'
      - '.github/workflows/visual-index-news-images-live.yml'
  workflow_dispatch:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: gnk-asg-visual-index-news-images
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    if: github.event_name != 'issues' || contains(github.event.issue.title, 'RUN GNK ASG VISUAL INDEX NEWS IMAGES')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Visual Index integration
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/portal/assets/visual-index-full-gallery.js
          grep -q "loadNewsItems" apps/portal/assets/visual-index-full-gallery.js
          grep -q "data/news.json" apps/portal/assets/visual-index-full-gallery.js
          grep -q "imageFallback" apps/portal/assets/visual-index-full-gallery.js
          grep -q "discardItem" apps/portal/assets/visual-index-full-gallery.js
          grep -q "gnk-news-gallery-item" apps/portal/assets/visual-index-full-gallery.js
      - name: Deploy current Worker and assets
        id: deploy
        shell: bash
        run: |
          set +e
          npx --yes wrangler@4 deploy --config workers/gnk-asg-direct-operator/wrangler.toml > deploy.log 2>&1
          code=$?
          cat deploy.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Wait for propagation
        if: steps.deploy.outputs.code == '0'
        run: sleep 15
      - name: Install browser
        if: steps.deploy.outputs.code == '0'
        shell: bash
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.52.0
          npx playwright install --with-deps chromium
      - name: Verify production Visual Index
        id: verify
        if: steps.deploy.outputs.code == '0'
        shell: bash
        run: |
          set +e
          node - <<'NODE' > verify.log 2>&1
          const {chromium}=require('@playwright/test');
          const assert=(condition,message)=>{if(!condition)throw new Error(message)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1100}});
            const errors=[];
            page.on('pageerror',error=>errors.push(String(error)));
            const response=await page.goto(`https://gnk-asg.hr/visual-index/?cb=${Date.now()}`,{waitUntil:'networkidle',timeout:90000});
            assert(response&&response.status()===200,`visual_index_http_${response?.status()}`);
            await page.waitForSelector('#visualGrid .item',{timeout:30000});
            await page.waitForFunction(()=>document.querySelectorAll('.gnk-news-gallery-item').length>0,{timeout:30000});
            for(let y=0;y<5000;y+=700){await page.evaluate(value=>window.scrollTo(0,value),y);await page.waitForTimeout(250)}
            await page.evaluate(()=>window.scrollTo(0,0));
            await page.waitForTimeout(5000);
            const result=await page.evaluate(()=>{
              const cards=[...document.querySelectorAll('#visualGrid .item')];
              const news=[...document.querySelectorAll('#visualGrid .gnk-news-gallery-item')];
              const fallback=cards.filter(card=>String(card.querySelector('img')?.getAttribute('src')||'').includes('/assets/news-fallback.svg'));
              const empty=cards.filter(card=>!String(card.querySelector('img')?.getAttribute('src')||'').trim());
              const broken=cards.filter(card=>{const img=card.querySelector('img');return img&&img.complete&&img.naturalWidth===0});
              const articleAsImage=news.filter(card=>{
                const img=card.querySelector('img');
                const link=card.querySelector('a');
                return img&&link&&img.src===link.href;
              });
              const loadedNews=news.filter(card=>{const img=card.querySelector('img');return img&&img.complete&&img.naturalWidth>0});
              return{
                title:document.title,
                status:document.querySelector('[data-gallery-status]')?.textContent||'',
                totalCards:cards.length,
                newsCards:news.length,
                loadedNewsImages:loadedNews.length,
                fallbackCards:fallback.length,
                emptyImageCards:empty.length,
                brokenImageCards:broken.length,
                articleAsImage:articleAsImage.length,
                firstNews:news.slice(0,5).map(card=>({title:card.querySelector('h2')?.textContent||'',image:card.querySelector('img')?.src||'',article:card.querySelector('a')?.href||''}))
              };
            });
            console.log(JSON.stringify(result,null,2));
            if(errors.length)console.log('PAGE_ERRORS='+JSON.stringify(errors));
            assert(result.newsCards>=20,`news_cards_too_low_${result.newsCards}`);
            assert(result.loadedNewsImages>=10,`loaded_news_images_too_low_${result.loadedNewsImages}`);
            assert(result.fallbackCards===0,`fallback_cards_${result.fallbackCards}`);
            assert(result.emptyImageCards===0,`empty_image_cards_${result.emptyImageCards}`);
            assert(result.brokenImageCards===0,`broken_image_cards_${result.brokenImageCards}`);
            assert(result.articleAsImage===0,`article_as_image_${result.articleAsImage}`);
            assert(result.status.includes('iz Vijesti'),'status_missing_news_count');
            await page.screenshot({path:'visual-index-news-images.png',fullPage:true});
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
          code=$?
          cat verify.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload production screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-index-news-images-production
          path: |
            visual-index-news-images.png
            verify.log
            deploy.log
          retention-days: 14
      - name: Report issue-triggered result
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "VISUAL_INDEX_DEPLOY_CODE=${{ steps.deploy.outputs.code }}"
            echo "VISUAL_INDEX_VERIFY_CODE=${{ steps.verify.outputs.code }}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```json'
            cat verify.log 2>/dev/null || true
            echo '```'
          } > issue-report.md
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body-file issue-report.md
      - name: Enforce success
        if: always()
        shell: bash
        run: |
          test "${{ steps.deploy.outputs.code }}" = '0'
          test "${{ steps.verify.outputs.code }}" = '0'
