name: Diagnose Production Candidate a82af2a

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify-public-editorial-assets-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/editorial-paragraph-contract-20260724
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run exact public editorial assets contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-public-editorial-asset-routes-v1.mjs
