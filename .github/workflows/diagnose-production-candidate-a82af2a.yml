name: Diagnose Production Candidate a82af2a

on:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  extract-production-package-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download exact failing production-package job log
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: '89527032260'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/beckuphome-gnk/gnk-asg-portal/actions/jobs/${JOB_ID}/logs" \
            > diagnostics/production-package-full.log
          tail -n 240 diagnostics/production-package-full.log \
            > diagnostics/production-package-tail.log
          grep -E -i -C 8 '(error|failed|failure|assert|exception|not found|missing|mismatch|exit code)' \
            diagnostics/production-package-full.log \
            > diagnostics/production-package-errors.log || true
          cat diagnostics/production-package-errors.log
          echo '--- FINAL 240 LINES ---'
          cat diagnostics/production-package-tail.log
      - name: Upload concise production-package diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: production-candidate-production-package-diagnostic
          path: diagnostics
          retention-days: 7
