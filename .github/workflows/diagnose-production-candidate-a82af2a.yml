name: Diagnose Production Candidate a82af2a

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-homepage-contrast-race-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/editorial-paragraph-contract-20260724
          fetch-depth: 2
      - name: Add navigation retry around contrast runtime injection
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          p = Path('apps/portal/tests/all-pages-visual-contrast.spec.js')
          s = p.read_text()
          anchor = "async function evaluateWithNavigationRetry(page, callback, argument) {"
          if anchor not in s:
              raise SystemExit('evaluateWithNavigationRetry helper missing')
          helper = """async function addScriptTagWithNavigationRetry(page, options) {
            const attempts = 5;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              try {
                return await page.addScriptTag(options);
              } catch (error) {
                const transient = /Execution context was destroyed|Cannot find context with specified id|Inspected target navigated or closed/i.test(error?.message || String(error));
                if (!transient || attempt === attempts) throw error;
                await page.waitForLoadState('domcontentloaded', { timeout: 10_000 }).catch(() => {});
                await page.waitForTimeout(300);
              }
            }
            throw new Error('Script-tag navigation retry exhausted without a result');
          }

          """
          if 'async function addScriptTagWithNavigationRetry' not in s:
              start = s.index(anchor)
              s = s[:start] + helper + s[start:]
          old = "if (!runtimeWasPresent) await page.addScriptTag({ content: CONTRAST_RUNTIME });"
          new = "if (!runtimeWasPresent) await addScriptTagWithNavigationRetry(page, { content: CONTRAST_RUNTIME });"
          if old not in s and new not in s:
              raise SystemExit('runtime injection line missing')
          s = s.replace(old, new)
          p.write_text(s)
          PY
          node --check apps/portal/tests/all-pages-visual-contrast.spec.js
      - name: Commit test-harness fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/portal/tests/all-pages-visual-contrast.spec.js; then
            echo 'Test harness already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/portal/tests/all-pages-visual-contrast.spec.js
          git commit -m 'fix(test): retry contrast runtime injection across navigation'
          git push origin HEAD:fix/editorial-paragraph-contract-20260724
