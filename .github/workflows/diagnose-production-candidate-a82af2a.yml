name: Diagnose Production Candidate a82af2a

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-contrast-failure-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/editorial-paragraph-contract-20260724
          fetch-depth: 2
      - name: Remove stale retry failure evidence on each test attempt
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          p = Path('apps/portal/tests/all-pages-visual-contrast.spec.js')
          s = p.read_text()
          old = """    const isHomepage = entry.route === '/' || entry.route === '/en/';
    const runtimeActivationTimeout = isHomepage ? 30_000 : 3_000;
    fs.mkdirSync(projectDir, { recursive: true });
    if (isHomepage) testInfo.setTimeout(60_000);
"""
          new = """    const isHomepage = entry.route === '/' || entry.route === '/en/';
    const runtimeActivationTimeout = isHomepage ? 30_000 : 3_000;
    const failureReportPath = path.join(projectDir, `${reportStem}.failure.json`);
    fs.mkdirSync(projectDir, { recursive: true });
    fs.rmSync(failureReportPath, { force: true });
    if (isHomepage) testInfo.setTimeout(60_000);
"""
          if old not in s and new not in s:
              raise SystemExit('attempt cleanup insertion anchor missing')
          s = s.replace(old, new)
          old_write = "fs.writeFileSync(path.join(projectDir, `${reportStem}.failure.json`), JSON.stringify({"
          new_write = "fs.writeFileSync(failureReportPath, JSON.stringify({"
          if old_write not in s and new_write not in s:
              raise SystemExit('failure report write anchor missing')
          s = s.replace(old_write, new_write)
          p.write_text(s)
          PY
          node --check apps/portal/tests/all-pages-visual-contrast.spec.js
      - name: Commit cleanup fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/portal/tests/all-pages-visual-contrast.spec.js; then
            echo 'Cleanup fix already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/portal/tests/all-pages-visual-contrast.spec.js
          git commit -m 'fix(test): clear stale contrast retry failures'
          git push origin HEAD:fix/editorial-paragraph-contract-20260724
