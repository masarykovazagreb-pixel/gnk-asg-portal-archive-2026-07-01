name: Verify Floating Home V16

on:
  push:
    branches: [main]
    paths:
      - ".github/verify-floating-home-v16.trigger"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/portal/assets/public-floating-home-v16.js
          node --check workers/gnk-asg-direct-operator/src/public-shell-v11.js
          node --check workers/gnk-asg-direct-operator/src/index-portal-final-v12.js
          grep -q 'public-floating-home-v16.js?v=20260625-v16' workers/gnk-asg-direct-operator/src/public-shell-v11.js
          grep -q 'GNK_ASG_FLOATING_HOME_V16' workers/gnk-asg-direct-operator/src/index-portal-final-v12.js
      - name: Install Chromium
        run: |
          npm install --no-package-lock --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Verify production desktop and mobile
        shell: bash
        run: |
          node - <<'JS'
          const fs=require('fs');
          const {chromium}=require('playwright');
          const publicRoutes=[
            ['/',false,'/'],['/en/',false,'/en/'],
            ['/objave/',true,'/'],['/publications/',true,'/en/'],
            ['/vijesti/',true,'/'],['/news/',true,'/en/'],
            ['/trzista/',true,'/'],['/markets/',true,'/en/'],
            ['/contact/',true,'/'],['/en/contact/',true,'/en/'],
            ['/legal/',true,'/'],['/en/legal/',true,'/en/'],
            ['/assistant/',true,'/'],['/en/assistant/',true,'/en/'],
            ['/downloads/',true,'/'],['/en/downloads/',true,'/en/'],
            ['/visual-index/',true,'/'],['/app/',true,'/'],
            ['/status-automatizacije/',true,'/'],['/automation-status/',true,'/en/']
          ];
          const views=[['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const results=[];
            for(const [view,viewport] of views){
              for(const [route,expected,href] of publicRoutes){
                const page=await browser.newPage({viewport,deviceScaleFactor:1});
                let http=0;
                try{
                  const response=await page.goto(`https://gnk-asg.hr${route}?cb=${Date.now()}`,{waitUntil:'networkidle',timeout:90000});
                  http=response?.status()||0;
                  await page.waitForTimeout(1200);
                  const data=await page.evaluate(()=>{
                    const home=document.getElementById('gnk-floating-home-v16');
                    const ai=document.getElementById('gnk-ai-badge-v13');
                    const hr=home?.getBoundingClientRect();
                    const ar=ai?.getBoundingClientRect();
                    return {
                      visible:Boolean(home&&getComputedStyle(home).display!=='none'&&hr&&hr.width>4&&hr.height>4),
                      href:home?.getAttribute('href')||null,
                      left:hr?Number(hr.left.toFixed(2)):null,
                      bottom:hr?Number((window.innerHeight-hr.bottom).toFixed(2)):null,
                      aiVisible:Boolean(ai&&getComputedStyle(ai).display!=='none'&&ar&&ar.width>4&&ar.height>4),
                      aiRight:ar?Number((window.innerWidth-ar.right).toFixed(2)):null,
                      overlap:hr&&ar?!(hr.right<ar.left||ar.right<hr.left||hr.bottom<ar.top||ar.bottom<hr.top):false,
                      script:[...document.scripts].some(s=>String(s.src||'').includes('public-floating-home-v16.js?v=20260625-v16')),
                      overflow:document.documentElement.scrollWidth>window.innerWidth+2
                    };
                  });
                  const ok=http===200&&data.script&&!data.overflow&&(expected?(data.visible&&data.href===href&&data.left<=20&&data.bottom<=20&&data.aiVisible&&data.aiRight<=20&&!data.overlap):!data.visible);
                  results.push({route,view,http,expected,expectedHref:href,...data,ok});
                }catch(error){results.push({route,view,http,error:error.message,ok:false});}
                await page.close();
              }
            }
            const privatePage=await browser.newPage({viewport:{width:1440,height:1000}});
            const privateResponse=await privatePage.goto(`https://gnk-asg.hr/operator-dashboard/?cb=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:90000});
            await privatePage.waitForTimeout(500);
            const privateHome=await privatePage.locator('#gnk-floating-home-v16').count();
            results.push({route:'/operator-dashboard/',view:'desktop',http:privateResponse?.status()||0,private:true,homeCount:privateHome,ok:privateHome===0});
            await privatePage.close();
            await browser.close();
            const failures=results.filter(x=>!x.ok);
            const report={checkedAt:new Date().toISOString(),ok:failures.length===0,total:results.length,passed:results.length-failures.length,failures,results};
            fs.writeFileSync('floating-home-v16-report.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report,null,2));
            if(!report.ok)process.exitCode=1;
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -f floating-home-v16-report.json ]; then
            body=$(printf 'Završna produkcijska provjera plutajućeg gumba Početna/Home V16.\n\n```json\n%s\n```\n' "$(cat floating-home-v16-report.json)")
          else
            body="Provjera V16 nije proizvela strukturirani rezultat. Run: ${GITHUB_RUN_ID}"
          fi
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/67" -f body="$body"
