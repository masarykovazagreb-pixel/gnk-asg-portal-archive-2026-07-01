name: Worker bundle diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install dependencies
        working-directory: workers/gnk-asg-direct-operator
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run dry check
        id: check
        working-directory: workers/gnk-asg-direct-operator
        shell: bash
        run: |
          set +e
          npx wrangler deploy --dry-run --config wrangler.runtime.toml --name gnk-asg-direct-operator > "$RUNNER_TEMP/result.log" 2>&1
          code=$?
          echo "$code" > "$RUNNER_TEMP/result.code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Save result
        uses: actions/upload-artifact@v4
        with:
          name: worker-check-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/result.log
            ${{ runner.temp }}/result.code
          retention-days: 1
      - name: Enforce result
        if: steps.check.outputs.code != '0'
        run: exit 1
