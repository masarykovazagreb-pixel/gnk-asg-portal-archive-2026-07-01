name: Image Entity SEO Boost

# Normalizes image alt text for the actual image subject; author and editor roles
# stay separate. Hashtags remain social-only. Any production dispatch suppresses search-engine notifications.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: image-entity-seo
  cancel-in-progress: false

jobs:
  boost:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test author/editor separation and protected-route contract
        run: node scripts/test-approved-author-markers-v1.mjs
      - name: Test protected-route write guards
        run: node scripts/test-protected-route-write-guards-v1.mjs
      - name: Enrich image alt/title with entities
        run: node scripts/image-entity-seo-v1.mjs --write
      - name: Confirm hashtags remain social-only
        run: node scripts/hashtag-boost-v1.mjs
      - name: Regenerate image sitemap from pages
        run: python3 scripts/generate-image-sitemap.py
      - name: Commit and dispatch exact-SHA production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gnk-image-seo-bot"
          git config user.email "actions@github.com"
          git add apps/portal
          if git diff --cached --quiet; then
            echo "Nema promjena."
            exit 0
          fi
          git commit -m "SEO: normalize image alt text and regenerate image sitemap"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            echo "Push odbijen (pokusaj $attempt) - main se pomaknuo, radim fetch+rebase."
            git fetch origin main
            git rebase origin/main || { echo "Rebase konflikt."; exit 1; }
            sleep $((attempt * 5))
            if [ "$attempt" = "5" ]; then echo "Push nije uspio nakon 5 pokusaja."; exit 1; fi
          done
          sha="$(git rev-parse HEAD)"
          gh workflow run deploy-admin-auth-v6.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f confirm_production_deploy=DEPLOY_ADMIN_AUTH_V6 \
            -f approved_sha="$sha" \
            -f notify_search_engines=false
