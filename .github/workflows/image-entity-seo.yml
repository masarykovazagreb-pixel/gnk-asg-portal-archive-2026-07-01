name: Image Entity SEO Boost

# Obogaćuje alt/title atribute entitetima (Nermin Sefić, GNK ASG, GNK DINAMO Ltd.)
# na siguran, aditivan način, zatim regenerira image-sitemap.xml iz stranica
# i dispatcha exact-SHA production deploy (verifikacija + IndexNow).

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: image-entity-seo
  cancel-in-progress: false

jobs:
  boost:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enrich image alt/title with entities
        run: node scripts/image-entity-seo-v1.mjs
      - name: Boost hashtags in article bodies
        run: node scripts/hashtag-boost-v1.mjs
      - name: Regenerate image sitemap from pages
        run: python3 scripts/generate-image-sitemap.py
      - name: Commit and dispatch exact-SHA production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gnk-image-seo-bot"
          git config user.email "actions@github.com"
          git add apps/portal
          if git diff --cached --quiet; then
            echo "Nema promjena."
            exit 0
          fi
          git commit -m "Entity SEO: full-name alt/title (Nermin Sefic) + body hashtags (#NerminSefic #GNKASG #GNKDINAMOLtd) + image sitemap regen"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            echo "Push odbijen (pokusaj $attempt) - main se pomaknuo, radim fetch+rebase."
            git fetch origin main
            git rebase origin/main || { echo "Rebase konflikt."; exit 1; }
            sleep $((attempt * 5))
            if [ "$attempt" = "5" ]; then echo "Push nije uspio nakon 5 pokusaja."; exit 1; fi
          done
          sha="$(git rev-parse HEAD)"
          gh workflow run deploy-admin-auth-v6.yml \
            --repo beckuphome-gnk/gnk-asg-portal \
            --ref main \
            -f confirm_production_deploy=DEPLOY_ADMIN_AUTH_V6 \
            -f approved_sha="$sha"
