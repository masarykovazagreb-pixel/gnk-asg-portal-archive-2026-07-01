name: Deploy Index Code Showcase V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-index-code-showcase-v1.yml'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v22-news.js'
      - 'apps/portal/assets/gallery-bootstrap.js'
      - 'apps/portal/assets/the-code-index-slot.css'
      - 'apps/portal/assets/the-code-visual-01.b64'
      - 'apps/portal/assets/the-code-visual-02.b64'
      - 'apps/portal/the-code/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gnk-asg-canonical-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate isolated index package
        shell: bash
        run: |
          set -euxo pipefail
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v22-news.js
          node --check apps/portal/assets/gallery-bootstrap.js
          node --check apps/portal/the-code/assets/the-code.js
          test -s apps/portal/assets/the-code-index-slot.css
          test -s apps/portal/assets/the-code-visual-01.b64
          test -s apps/portal/assets/the-code-visual-02.b64
          test -s apps/portal/the-code/index.html
          grep -q 'mountCodeShowcase' apps/portal/assets/gallery-bootstrap.js
          grep -q 'the-code-visual-01.b64' apps/portal/assets/gallery-bootstrap.js
          grep -q 'the-code-visual-02.b64' apps/portal/assets/gallery-bootstrap.js
          grep -q '/the-code/?v=20260627-static-v1' apps/portal/assets/gallery-bootstrap.js
          grep -q 'gnkCodeVisualOne 20s' apps/portal/assets/the-code-index-slot.css
          grep -q 'gnkCodeVisualTwo 20s' apps/portal/assets/the-code-index-slot.css
          grep -q 'object-fit:contain' apps/portal/assets/the-code-index-slot.css
          grep -q 'aspect-ratio:9/16' apps/portal/assets/the-code-index-slot.css
          python - <<'PY'
          import base64
          from pathlib import Path
          for name in ('the-code-visual-01.b64','the-code-visual-02.b64'):
              raw=base64.b64decode(Path('apps/portal/assets',name).read_text().strip(),validate=True)
              assert raw[:4]==b'RIFF' and raw[8:12]==b'WEBP'
              assert len(raw)>1000
          PY
          git fetch origin checkpoint-index-code-visuals-20260627 --force
          git diff --exit-code origin/checkpoint-index-code-visuals-20260627 -- \
            apps/portal/index.html \
            apps/portal/en/index.html \
            workers/gnk-asg-direct-operator/src/public-shell-v11.js \
            workers/gnk-asg-direct-operator/src/index-lock-v4.js
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator

      - name: Deploy canonical Worker and assets
        id: deploy
        continue-on-error: true
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator

      - name: Verify live index and isolated windows
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs=require('fs');
          const base='https://gnk-asg.hr';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function get(path){
            try{
              const response=await fetch(`${base}${path}${path.includes('?')?'&':'?'}cb=${process.env.GITHUB_RUN_ID}-${Date.now()}`,{headers:{'cache-control':'no-cache'}});
              return {status:response.status,text:await response.text(),type:response.headers.get('content-type')||''};
            }catch(error){return {status:0,text:'',type:'',error:String(error)}}
          }
          (async()=>{
            let last={};
            for(let attempt=1;attempt<=24;attempt++){
              const [hr,en,bootstrap,css,visualOne,visualTwo,code]=await Promise.all([
                get('/'),get('/en/'),get('/assets/gallery-bootstrap.js'),get('/assets/the-code-index-slot.css'),
                get('/assets/the-code-visual-01.b64'),get('/assets/the-code-visual-02.b64'),get('/the-code/')
              ]);
              const failures=[];
              for(const [name,response] of Object.entries({hr,en})){
                if(response.status!==200)failures.push(`${name}_status=${response.status}`);
                if(!response.text.includes('<main id="main">'))failures.push(`${name}_main_missing`);
                if(!response.text.includes('</main>'))failures.push(`${name}_main_unclosed`);
                if(!response.text.includes('/assets/gallery-bootstrap.js'))failures.push(`${name}_bootstrap_missing`);
                if(!response.text.includes('PDF i Download centar'))failures.push(`${name}_index_content_missing`);
              }
              if(bootstrap.status!==200||!bootstrap.text.includes('mountCodeShowcase'))failures.push(`bootstrap=${bootstrap.status}`);
              if(!bootstrap.text.includes('the-code-visual-01.b64')||!bootstrap.text.includes('the-code-visual-02.b64'))failures.push('bootstrap_visuals_missing');
              if(!bootstrap.text.includes('/the-code/?v=20260627-static-v1'))failures.push('bootstrap_iframe_missing');
              if(css.status!==200||!css.text.includes('gnkCodeVisualOne 20s')||!css.text.includes('gnkCodeVisualTwo 20s'))failures.push(`css=${css.status}`);
              if(visualOne.status!==200||visualOne.text.length<1000)failures.push(`visual_one=${visualOne.status}`);
              if(visualTwo.status!==200||visualTwo.text.length<1000)failures.push(`visual_two=${visualTwo.status}`);
              if(code.status!==200||(!code.text.includes('data-gnk-code-enter')&&!code.text.includes('id="app"')))failures.push(`code=${code.status}`);
              last={attempt,failures,codes:{hr:hr.status,en:en.status,bootstrap:bootstrap.status,css:css.status,visualOne:visualOne.status,visualTwo:visualTwo.status,code:code.status}};
              console.log(JSON.stringify(last));
              if(!failures.length){
                fs.writeFileSync('/tmp/index-code-showcase-verification.json',JSON.stringify({ok:true,version:'GNK_ASG_INDEX_CODE_SHOWCASE_STATIC_V1_20260627',commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,verifiedAt:new Date().toISOString(),...last},null,2));
                return;
              }
              await sleep(10000);
            }
            fs.writeFileSync('/tmp/index-code-showcase-verification.json',JSON.stringify({ok:false,version:'GNK_ASG_INDEX_CODE_SHOWCASE_STATIC_V1_20260627',commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,verifiedAt:new Date().toISOString(),...last},null,2));
            process.exitCode=1;
          })().catch(error=>{
            fs.writeFileSync('/tmp/index-code-showcase-verification.json',JSON.stringify({ok:false,version:'GNK_ASG_INDEX_CODE_SHOWCASE_STATIC_V1_20260627',commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,verifiedAt:new Date().toISOString(),error:String(error?.stack||error)},null,2));
            console.error(error);
            process.exitCode=1;
          });
          JS

      - name: Record deployment evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/deployments
          if [ ! -s /tmp/index-code-showcase-verification.json ]; then
            printf '{\n  "ok": false,\n  "version": "GNK_ASG_INDEX_CODE_SHOWCASE_STATIC_V1_20260627",\n  "commit": "%s",\n  "runId": "%s",\n  "deployOutcome": "%s",\n  "verifyOutcome": "%s",\n  "verifiedAt": "%s"\n}\n' \
              "$GITHUB_SHA" "$GITHUB_RUN_ID" '${{ steps.deploy.outcome }}' '${{ steps.verify.outcome }}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              > /tmp/index-code-showcase-verification.json
          fi
          cp /tmp/index-code-showcase-verification.json docs/deployments/index-code-showcase-v1-live.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/deployments/index-code-showcase-v1-live.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(index): record THE CODE showcase deployment [skip ci]'
            git push origin HEAD:main
          fi

      - name: Enforce deployment result
        if: always()
        shell: bash
        run: |
          test '${{ steps.deploy.outcome }}' = 'success'
          test '${{ steps.verify.outcome }}' = 'success'
