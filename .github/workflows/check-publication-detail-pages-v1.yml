name: Check Publication Detail Pages V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/portal/objave/**'
      - 'apps/portal/analize/**'
      - 'apps/portal/komentari/**'
      - '.github/workflows/check-publication-detail-pages-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - name: Verify current representative HR editorial pages
        shell: bash
        run: |
          set -euxo pipefail
          for file in             apps/portal/objave/tehnologija-kapital-i-odgovorno-upravljanje/index.html             apps/portal/objave/transparentno-upravljanje-kao-operativni-standard/index.html             apps/portal/analize/kapitalna-struktura-i-operativna-otpornost/index.html             apps/portal/komentari/inovacija-bez-povjerenja-nije-napredak/index.html
          do
            test -s "$file"
            grep -qi '<title>' "$file"
            grep -qi 'name="description"' "$file"
            grep -qi 'rel="canonical"' "$file"
            grep -qi 'name="viewport"' "$file"
          done
          count=$(grep -o 'class="editorial-card"' apps/portal/objave/index.html | wc -l | tr -d ' ')
          echo "PUBLICATION_CARD_COUNT=$count"
          test "$count" -ge 3
          echo PUBLICATION_DETAIL_PAGES_OK
