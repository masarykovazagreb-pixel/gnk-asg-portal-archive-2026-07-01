name: Check Publication Detail Pages V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/portal/objave/**'
      - 'apps/portal/publications/**'
      - '.github/workflows/check-publication-detail-pages-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - name: Verify current HR publication pages
        shell: bash
        run: |
          set -euxo pipefail
          pages=(
            likvidnosni-jaz-i-upravljanje-obrtnim-kapitalom
            revizijski-odbor-i-neovisnost-nadzora
            dobavljacki-rizik-koncentracije-jednog-partnera
            cijena-kapitala-i-investicijske-odluke
            whistleblowing-politika-i-interna-kontrola
            prekogranicno-oporezivanje-transferne-cijene
            digitalizacija-nabave-i-transparentnost-dobavljaca
            javni-podaci-autorski-rad-odgovorno-upravljanje
          )
          for slug in "${pages[@]}"; do
            file="apps/portal/objave/$slug/index.html"
            test -s "$file"
            grep -qi '<title>' "$file"
            grep -qi 'name="description"' "$file"
            grep -qi 'rel="canonical"' "$file"
            grep -Fq "/objave/$slug/" apps/portal/objave/index.html
          done
          count=$(grep -o '<article class="editorial-card"' apps/portal/objave/index.html | wc -l | tr -d ' ')
          echo "PUBLICATION_CARD_COUNT=$count"
          test "$count" -ge 8
          echo PUBLICATION_DETAIL_PAGES_OK
