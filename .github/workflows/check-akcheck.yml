name: Provjeri EN aktual medija
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p apps/portal/data/tmp-akcheck
          curl -s -o /dev/null -w "%{http_code}\n" "https://gnk-asg.hr/en/gnk-aktual/" > apps/portal/data/tmp-akcheck/r.txt
          curl -s "https://gnk-asg.hr/en/gnk-aktual/" | grep -o "akStopTiska\|akKomentari\|akReceptDana\|Stop Press\|Kitchen" | sort -u >> apps/portal/data/tmp-akcheck/r.txt
          cat apps/portal/data/tmp-akcheck/r.txt
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          BRANCH="akcheck-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-akcheck
          git commit -m "check"
          git push origin "$BRANCH"
