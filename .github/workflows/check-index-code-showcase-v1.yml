name: Check Index Code Showcase V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/portal/index.html'
      - 'apps/portal/en/index.html'
      - 'apps/portal/the-code/**'
      - 'apps/portal/assets/the-code-countdown-v1.js'
      - 'apps/portal/assets/the-code-experience-loop-v1.html'
      - 'apps/portal/assets/the-code-logo-v1.svg'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v22-news.js'
      - 'workers/gnk-asg-direct-operator/src/public-shell-v11.js'
      - 'scripts/test-the-code-index-contract.mjs'
      - '.github/workflows/check-index-code-showcase-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate current THE CODE package
        shell: bash
        run: |
          set -euxo pipefail
          node --check apps/portal/assets/the-code-countdown-v1.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/public-shell-v11.js
          test -s apps/portal/the-code/index.html
          test -s apps/portal/the-code/media-memorandum/index.html
          test -s apps/portal/assets/the-code-experience-loop-v1.html
          test -s apps/portal/assets/the-code-logo-v1.svg
          grep -q 'rel="canonical" href="https://gnk-asg.hr/the-code/"' apps/portal/the-code/index.html
          grep -q '/assets/the-code-experience-loop-v1.html' apps/portal/the-code/index.html
          grep -q '7. listopada 2026.' apps/portal/the-code/index.html
          grep -q "2026-10-07T11:30:00-04:00" apps/portal/assets/the-code-countdown-v1.js
          node scripts/test-the-code-index-contract.mjs
      - name: Preserve public shell safety contract
        run: |
          set -euxo pipefail
          grep -q 'if(isPrivatePath(normalized))return html;' workers/gnk-asg-direct-operator/src/public-shell-v11.js
          grep -q "const indexPath=\['/','/en','/en/'\]" workers/gnk-asg-direct-operator/src/public-shell-v11.js
          grep -q "'/admin-center'" workers/gnk-asg-direct-operator/src/public-shell-v11.js
          grep -q "'/enterprise'" workers/gnk-asg-direct-operator/src/public-shell-v11.js
      - name: Confirm canonical Worker validation ownership
        run: echo 'Worker syntax, import graph and dry run are validated by Validate GNK ASG Portal Release.'
