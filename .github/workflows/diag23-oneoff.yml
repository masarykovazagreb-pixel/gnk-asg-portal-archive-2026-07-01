name: Check Cloudflare Email Routing rules (one-off)
on:
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query email routing rules
        run: |
          CF_TOKEN="cfut_RQcfszqhP9EYO7NmPjgWRjrklpw9pCN4e89DjKXL42804731"
          ACCOUNT_ID="1728309632b4e7be93fba322822905da"
          echo "# Email routing check $(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/d.md
          echo '```' >> /tmp/d.md
          echo "--- zones ---" >> /tmp/d.md
          ZONES=$(curl -s "https://api.cloudflare.com/client/v4/zones?account.id=$ACCOUNT_ID" -H "Authorization: Bearer $CF_TOKEN")
          echo "$ZONES" | head -c 500 >> /tmp/d.md
          ZONE_ID=$(echo "$ZONES" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['result'][0]['id'] if d.get('result') else '')")
          echo "" >> /tmp/d.md
          echo "zone_id: $ZONE_ID" >> /tmp/d.md
          echo "--- email routing settings ---" >> /tmp/d.md
          curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/email/routing" -H "Authorization: Bearer $CF_TOKEN" >> /tmp/d.md
          echo "" >> /tmp/d.md
          echo "--- email routing rules ---" >> /tmp/d.md
          curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/email/routing/rules?per_page=50" -H "Authorization: Bearer $CF_TOKEN" >> /tmp/d.md
          echo '```' >> /tmp/d.md
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" --title "Email routing check $(date -u +%Y-%m-%dT%H:%M:%SZ)" --body-file /tmp/d.md
