name: Provjeri Tumblr verifikaciju v2 (jednokratno)
on: workflow_dispatch
jobs:
  provjeri:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p apps/portal/data/tmp-provjera2
          curl -s "https://nermin-sefic.tumblr.com/" -o apps/portal/data/tmp-provjera2/stranica.html
          grep -o 'google-site-verification[^>]*' apps/portal/data/tmp-provjera2/stranica.html > apps/portal/data/tmp-provjera2/rezultat.txt || echo "NIJE NADJENO" > apps/portal/data/tmp-provjera2/rezultat.txt
          echo "--- prvih 300 znakova stranice ---" >> apps/portal/data/tmp-provjera2/rezultat.txt
          head -c 300 apps/portal/data/tmp-provjera2/stranica.html >> apps/portal/data/tmp-provjera2/rezultat.txt
          cat apps/portal/data/tmp-provjera2/rezultat.txt
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          BRANCH="provjera-tumblr2-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-provjera2/rezultat.txt
          git commit -m "provjera2"
          git push origin "$BRANCH"
