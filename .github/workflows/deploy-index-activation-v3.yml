name: Deploy Index Activation V7

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Deploy
        id: deploy
        continue-on-error: true
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator
      - name: Purge Cloudflare edge cache
        id: purge
        if: always()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ZONE_ID=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/zones?name=gnk-asg.hr&status=active' | python -c "import json,sys; d=json.load(sys.stdin); print((d.get('result') or [{}])[0].get('id',''))")
          test -n "$ZONE_ID"
          curl -fsS -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" --data '{"purge_everything":true}' | tee /tmp/purge.json
          python -c "import json; d=json.load(open('/tmp/purge.json')); assert d.get('success') is True, d"
      - name: Probe canonical and cache-busted live index
        id: probe
        if: always()
        continue-on-error: true
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          PURGE_OUTCOME: ${{ steps.purge.outcome }}
        run: |
          for n in $(seq 1 30); do
            curl -sS -D /tmp/hr.headers -o /tmp/hr.body "https://gnk-asg.hr/" || true
            curl -sS -D /tmp/en.headers -o /tmp/en.body "https://gnk-asg.hr/en/" || true
            curl -sS -o /tmp/hr_cb.body "https://gnk-asg.hr/?cb=${GITHUB_RUN_ID}-${n}" || true
            curl -sS -o /tmp/en_cb.body "https://gnk-asg.hr/en/?cb=${GITHUB_RUN_ID}-${n}" || true
            if grep -q 'AKTIVACIJA KODA' /tmp/hr.body && grep -q 'CODE ACTIVATION' /tmp/en.body && grep -q 'AKTIVACIJA KODA' /tmp/hr_cb.body && grep -q 'CODE ACTIVATION' /tmp/en_cb.body; then break; fi
            sleep 5
          done
          python - <<'PY'
          import json, os, pathlib, re
          def text(path):
              p=pathlib.Path(path)
              return p.read_text(errors='ignore') if p.exists() else ''
          hr=text('/tmp/hr.body'); en=text('/tmp/en.body'); hr_cb=text('/tmp/hr_cb.body'); en_cb=text('/tmp/en_cb.body'); headers=text('/tmp/hr.headers')
          def h(name):
              m=re.search(rf'(?im)^{re.escape(name)}:\s*(.+)$',headers)
              return m.group(1).strip() if m else ''
          data={
            'commit':os.environ.get('GITHUB_SHA',''),
            'runId':os.environ.get('GITHUB_RUN_ID',''),
            'deployOutcome':os.environ.get('DEPLOY_OUTCOME',''),
            'purgeOutcome':os.environ.get('PURGE_OUTCOME',''),
            'canonicalHrActivation':'AKTIVACIJA KODA' in hr,
            'canonicalEnActivation':'CODE ACTIVATION' in en,
            'cacheBustedHrActivation':'AKTIVACIJA KODA' in hr_cb,
            'cacheBustedEnActivation':'CODE ACTIVATION' in en_cb,
            'theCodeInBody':'THE CODE' in hr and 'THE CODE' in en,
            'mapInBody':'gnk-activation__map' in hr and 'gnk-activation__map' in en,
            'filmInBody':'gnk-activation__film' in hr and 'gnk-activation__film' in en,
            'endStateHrInBody':'KOD AKTIVIRAN · NEW YORK · 7.10.2026. · 11:30 ET' in hr,
            'endStateEnInBody':'CODE ACTIVATED · NEW YORK · OCTOBER 7, 2026 · 11:30 AM ET' in en,
            'hrLanguageSwitch':'href="/en/"' in hr,
            'enLanguageSwitch':'href="/"' in en,
            'fullHrMenu':'PDF centar' in hr and 'AI pomoć' in hr and 'Admin' in hr,
            'fullEnMenu':'PDF centre' in en and 'AI help' in en and 'Admin' in en,
            'indexActivationHeader':h('x-gnk-asg-index-activation'),
            'indexMapFilmHeader':h('x-gnk-asg-index-map-film'),
            'indexCleanHeader':h('x-gnk-asg-index-clean-layout'),
            'indexReleaseHeader':h('x-gnk-asg-index-release'),
            'cacheControl':h('cache-control'),
            'cfCacheStatus':h('cf-cache-status')
          }
          data['ok']=all([
            data['deployOutcome']=='success',data['canonicalHrActivation'],data['canonicalEnActivation'],
            data['cacheBustedHrActivation'],data['cacheBustedEnActivation'],data['theCodeInBody'],
            data['mapInBody'],data['filmInBody'],data['endStateHrInBody'],data['endStateEnInBody'],
            data['hrLanguageSwitch'],data['enLanguageSwitch'],data['fullHrMenu'],data['fullEnMenu']
          ])
          pathlib.Path('/tmp/probe.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
          print(json.dumps(data,ensure_ascii=False))
          PY
      - name: Record result without branch conflict
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CONTENT=$(base64 -w0 /tmp/probe.json)
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/docs/deployments/index-activation-v3-status.json?ref=main" --jq '.sha' 2>/dev/null || true)
          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/docs/deployments/index-activation-v3-status.json" \
              -f message='chore(index): record canonical activation probe [skip ci]' \
              -f content="$CONTENT" -f sha="$CURRENT_SHA" -f branch='main'
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/docs/deployments/index-activation-v3-status.json" \
              -f message='chore(index): record canonical activation probe [skip ci]' \
              -f content="$CONTENT" -f branch='main'
          fi
      - name: Enforce deploy and canonical index
        if: always()
        run: |
          test '${{ steps.deploy.outcome }}' = 'success'
          python -c "import json; d=json.load(open('/tmp/probe.json')); assert d.get('ok') is True, d"
