name: Deploy Index Activation V3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Deploy
        id: deploy
        continue-on-error: true
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator
      - name: Record result
        if: always()
        run: |
          mkdir -p docs/deployments
          printf '{"commit":"%s","runId":"%s","deploy":"%s","time":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" '${{ steps.deploy.outcome }}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > docs/deployments/index-activation-v3-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/deployments/index-activation-v3-status.json
          git commit -m 'chore(index): record activation deployment [skip ci]' || true
          git push origin HEAD:main
      - name: Enforce result
        if: always()
        run: test '${{ steps.deploy.outcome }}' = 'success'
