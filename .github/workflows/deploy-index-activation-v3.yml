name: Deploy Index Activation V4

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Deploy
        id: deploy
        continue-on-error: true
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator
      - name: Probe live index
        id: probe
        if: always()
        continue-on-error: true
        run: |
          for n in $(seq 1 18); do
            curl -sS -D /tmp/hr.headers -o /tmp/hr.body "https://gnk-asg.hr/?cb=${GITHUB_RUN_ID}-${n}" || true
            if grep -q 'AKTIVACIJA KODA' /tmp/hr.body; then break; fi
            sleep 5
          done
          python - <<'PY'
          import json, os, pathlib, re
          body=pathlib.Path('/tmp/hr.body').read_text(errors='ignore') if pathlib.Path('/tmp/hr.body').exists() else ''
          headers=pathlib.Path('/tmp/hr.headers').read_text(errors='ignore') if pathlib.Path('/tmp/hr.headers').exists() else ''
          def h(name):
              m=re.search(rf'(?im)^{re.escape(name)}:\s*(.+)$',headers)
              return m.group(1).strip() if m else ''
          data={
            'commit':os.environ.get('GITHUB_SHA',''),
            'runId':os.environ.get('GITHUB_RUN_ID',''),
            'activationInBody':'AKTIVACIJA KODA' in body,
            'theCodeInBody':'THE CODE' in body,
            'mapInBody':'gnk-activation__map' in body,
            'filmInBody':'gnk-activation__film' in body,
            'indexActivationHeader':h('x-gnk-asg-index-activation'),
            'indexMapFilmHeader':h('x-gnk-asg-index-map-film'),
            'indexSourceHeader':h('x-gnk-asg-index-source'),
            'cfCacheStatus':h('cf-cache-status')
          }
          pathlib.Path('/tmp/probe.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
          PY
      - name: Record result
        if: always()
        run: |
          mkdir -p docs/deployments
          cp /tmp/probe.json docs/deployments/index-activation-v3-status.json || printf '{"probe":"missing"}\n' > docs/deployments/index-activation-v3-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/deployments/index-activation-v3-status.json
          git commit -m 'chore(index): record activation probe [skip ci]' || true
          git push origin HEAD:main
      - name: Enforce deploy
        if: always()
        run: test '${{ steps.deploy.outcome }}' = 'success'
