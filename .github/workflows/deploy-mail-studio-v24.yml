name: Deploy Mail Studio V24

on:
  push:
    branches: [main]
    paths:
      - "apps/portal/mail-studio/index.html"
      - "apps/portal/assets/mail-studio-english-v23.js"
      - "apps/portal/assets/delivery-history-dashboard-v3.js"
      - "workers/gnk-asg-direct-operator/src/index-mail-studio-bridge-v17.js"
      - "workers/gnk-asg-direct-operator/src/index-media-command-center-v20.js"
      - "workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v1.js"
      - "workers/gnk-asg-direct-operator/src/email-english-metadata-guard-v1.js"
      - "workers/gnk-asg-direct-operator/wrangler.runtime.toml"
      - ".github/mail-studio-v24.trigger"
      - ".github/workflows/deploy-mail-studio-v24.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mail-studio-v24
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Mail Studio
        run: |
          set -euo pipefail
          node --check apps/portal/assets/mail-studio-english-v23.js
          node --check apps/portal/assets/delivery-history-dashboard-v3.js
          node --check workers/gnk-asg-direct-operator/src/index-mail-studio-bridge-v17.js
          node --check workers/gnk-asg-direct-operator/src/index-media-command-center-v20.js
          node --check workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v1.js
          node --check workers/gnk-asg-direct-operator/src/email-english-metadata-guard-v1.js
          grep -q 'id="previewFrame"' apps/portal/mail-studio/index.html
          grep -q 'GNK_ASG_MAIL_STUDIO_ENGLISH_V24' apps/portal/assets/mail-studio-english-v23.js
          grep -q 'ENGLISH_ONLY' workers/gnk-asg-direct-operator/src/index-mail-studio-bridge-v17.js
      - name: Deploy Worker and assets
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.runtime.toml --name gnk-asg-direct-operator
      - name: Verify deployed assets
        run: |
          set -euo pipefail
          base="https://gnk-asg-direct-operator.beckuphome.workers.dev"
          ready=false
          for attempt in $(seq 1 24); do
            stamp=$(date +%s%N)
            page=$(curl -sSL "$base/mail-studio/?cb=$stamp" || true)
            script=$(curl -sSL "$base/assets/mail-studio-english-v23.js?cb=$stamp" || true)
            if echo "$page" | grep -q 'id="previewFrame"' && echo "$script" | grep -q 'GNK_ASG_MAIL_STUDIO_ENGLISH_V24'; then ready=true; break; fi
            sleep 5
          done
          test "$ready" = "true"
