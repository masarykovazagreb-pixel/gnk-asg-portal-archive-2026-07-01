name: Site parity audit (manual, read only)

# Manual diagnostic only: run generators in CI workspace and audit differences.
# This workflow is NOT a canonical writer, is not scheduled, and never commits.
# The former direct-main self-heal was not allowlisted and conflicted with
# protected home-page ownership and the production schedule safety gate.

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: gnk-asg-index-parity-readonly-audit
  cancel-in-progress: false

jobs:
  heal:
    if: vars.GNK_ASG_RELEASE_FENCE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dohvati main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Zabilježi polazni SHA
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Osvježi zapise o runovima
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/collect-workflow-runs.mjs

      - name: Regeneriraj index, katalog radnika i flotu
        run: |
          set -euo pipefail
          node scripts/build-index-parity.mjs
          node scripts/build-worker-groups-v1.mjs
          node scripts/build-fleet-status-v1.mjs

      - name: Auditi portala i kanala
        id: audits
        run: |
          set -uo pipefail
          status=0
          node scripts/audit-public-portal-v1.mjs > /tmp/portal-audit.json 2>&1 || status=1
          node scripts/audit-aktual-all-pages-v2.mjs > /tmp/aktual-audit.json 2>&1 || status=1
          tail -5 /tmp/portal-audit.json || true
          tail -5 /tmp/aktual-audit.json || true
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Issue ako audit padne
        if: steps.audits.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          export GH_REPO="$GITHUB_REPOSITORY"
          gh issue create \
            --title "Dnevni audit: pad $(date -u +%Y-%m-%d)" \
            --body "Automatski dnevni audit nije prošao pa self-heal nije ništa objavio. Log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            || echo "Issue nije bilo moguće otvoriti."

      - name: Show working-tree drift (no push or commit)
        if: steps.audits.outputs.status == '0'
        shell: bash
        run: |
          git status --short
          git diff --stat -- apps/portal/index.html apps/portal/en/index.html \
            apps/portal/workers/grupacije apps/portal/data/worker-groups.json \
            apps/portal/automation-status/flota apps/portal/data/fleet-status.json \
            apps/portal/data/workflow-runs.json
          echo "Audit only; changes remain on this temporary CI runner."

      - name: Padni ako audit nije prošao
        if: steps.audits.outputs.status != '0'
        run: |
          echo "::error::Dnevni audit nije prošao — vidi issue."
          exit 1
