name: Check Editorial Draft Planner

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/portal/editorial-operations/**'
      - 'apps/portal/assets/js/editorial-operations-runtime-v1.js'
      - 'apps/portal/assets/js/editorial-slot-editor-v1.js'
      - 'apps/portal/assets/js/editorial-release-queue-v1.js'
      - 'workers/gnk-asg-direct-operator/src/editorial-draft-planner-v1.js'
      - 'workers/gnk-asg-direct-operator/src/editorial-workflow-v1.js'
      - 'workers/gnk-asg-direct-operator/src/editorial-workflow-api-v1.js'
      - 'workers/gnk-asg-direct-operator/src/publication-readiness-v1.js'
      - 'workers/gnk-asg-direct-operator/src/publication-document-v1.js'
      - 'workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js'
      - 'workers/gnk-asg-direct-operator/test/editorial-draft-planner.test.mjs'
      - 'workers/gnk-asg-direct-operator/test/editorial-workflow.test.mjs'
      - 'workers/gnk-asg-direct-operator/test/publication-readiness.test.mjs'
      - 'workers/gnk-asg-direct-operator/test/publication-document.test.mjs'
      - '.github/workflows/check-editorial-draft-planner.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check module syntax
        run: |
          set -euxo pipefail
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/publication-readiness-v1.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/publication-document-v1.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/editorial-workflow-v1.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/editorial-workflow-api-v1.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/editorial-draft-planner-v1.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js
          node --check apps/portal/assets/js/editorial-operations-runtime-v1.js
          node --check apps/portal/assets/js/editorial-slot-editor-v1.js
          node --check apps/portal/assets/js/editorial-release-queue-v1.js
          node --check workers/gnk-asg-direct-operator/test/editorial-draft-planner.test.mjs
          node --check workers/gnk-asg-direct-operator/test/editorial-workflow.test.mjs
          node --check workers/gnk-asg-direct-operator/test/publication-readiness.test.mjs
          node --check workers/gnk-asg-direct-operator/test/publication-document.test.mjs
      - name: Run planner tests
        run: node workers/gnk-asg-direct-operator/test/editorial-draft-planner.test.mjs
      - name: Run slot and release queue tests
        run: node workers/gnk-asg-direct-operator/test/editorial-workflow.test.mjs
      - name: Run publication readiness tests
        run: node workers/gnk-asg-direct-operator/test/publication-readiness.test.mjs
      - name: Run publication document tests
        run: node workers/gnk-asg-direct-operator/test/publication-document.test.mjs
      - name: Verify console, editor and queue integration
        run: |
          set -euxo pipefail
          grep -q 'publication-readiness-v1.js' workers/gnk-asg-direct-operator/src/editorial-draft-planner-v1.js
          grep -q 'publication-document-v1.js' workers/gnk-asg-direct-operator/src/editorial-draft-planner-v1.js
          grep -q 'publication/readiness' workers/gnk-asg-direct-operator/src/editorial-draft-planner-v1.js
          grep -q 'publication/preview' workers/gnk-asg-direct-operator/src/editorial-draft-planner-v1.js
          grep -q 'x-robots-tag' workers/gnk-asg-direct-operator/src/editorial-draft-planner-v1.js
          grep -q 'slot/save' workers/gnk-asg-direct-operator/src/editorial-workflow-api-v1.js
          grep -q 'slot/preview' workers/gnk-asg-direct-operator/src/editorial-workflow-api-v1.js
          grep -q 'slot/queue' workers/gnk-asg-direct-operator/src/editorial-workflow-api-v1.js
          grep -q 'publication/queue' workers/gnk-asg-direct-operator/src/editorial-workflow-api-v1.js
          grep -q 'awaiting-executive-release' workers/gnk-asg-direct-operator/src/editorial-workflow-v1.js
          if grep -q "state:'published'" workers/gnk-asg-direct-operator/src/editorial-workflow-v1.js; then exit 1; fi
          grep -q 'editorial-workflow-api-v1.js' workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js
          grep -q 'handleEditorialWorkflowApi' workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js
          grep -q 'editorial-draft-planner-v1.js' workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js
          grep -q 'runEditorialDraftPlanner' workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js
          grep -q 'isEditorialOperationsApi' workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js
          grep -q 'editorial-operations-runtime-v1.js' apps/portal/editorial-operations/index.html
          grep -q '/editorial-operations/editor/' apps/portal/assets/js/editorial-operations-runtime-v1.js
          grep -q '/editorial-operations/release-queue/' apps/portal/assets/js/editorial-operations-runtime-v1.js
          grep -q '/api/editorial-operations/plan' apps/portal/assets/js/editorial-operations-runtime-v1.js
          grep -q '/slot/save' apps/portal/assets/js/editorial-slot-editor-v1.js
          grep -q '/slot/preview' apps/portal/assets/js/editorial-slot-editor-v1.js
          grep -q '/slot/queue' apps/portal/assets/js/editorial-slot-editor-v1.js
          grep -q '/publication/queue' apps/portal/assets/js/editorial-release-queue-v1.js
          grep -q 'awaiting-executive-release' apps/portal/editorial-operations/editor/index.html
          grep -q 'No publish action exists here' apps/portal/editorial-operations/release-queue/index.html
          for file in apps/portal/editorial-operations/index.html apps/portal/editorial-operations/editor/index.html apps/portal/editorial-operations/release-queue/index.html; do grep -qi 'noindex' "$file"; done
          if grep -Eqi '<button[^>]*>[^<]*(publish|objavi)' apps/portal/editorial-operations/release-queue/index.html; then exit 1; fi
