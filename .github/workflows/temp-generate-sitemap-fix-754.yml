name: Temporary Generate Sitemap for PR 754

on:
  push:
    branches:
      - fix/editorial-paragraph-contract-20260724

permissions:
  contents: write

concurrency:
  group: temp-generate-sitemap-fix-754
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/editorial-paragraph-contract-20260724
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate reviewed portal sitemap output
        run: |
          set -euo pipefail
          python apps/portal/scripts/sync_publication_indexes.py
          python apps/portal/scripts/generate_sitewide_seo.py
          python apps/portal/scripts/finalize_sitewide_seo.py
          python apps/portal/scripts/harden_internal_routes.py
      - name: Commit sitemap only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/portal/sitemap.xml; then
            echo 'Sitemap is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/portal/sitemap.xml
          git commit -m 'fix(seo): include Digital Workforce in canonical sitemap'
          git push origin HEAD:fix/editorial-paragraph-contract-20260724
