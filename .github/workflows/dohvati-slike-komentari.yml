name: Dohvati slike za EU/SAD komentare (jednokratno)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dohvati:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dohvati slike preko gnk-asg-image-proxy
        run: |
          mkdir -p /tmp/slike
          curl -s "https://gnk-asg.hr/api/slike?upit=european+union+flags+brussels" -o /tmp/slike/eu.json
          curl -s "https://gnk-asg.hr/api/slike?upit=wall+street+stock+exchange+new+york" -o /tmp/slike/sad.json
          cat /tmp/slike/eu.json
          echo "---"
          cat /tmp/slike/sad.json
          mkdir -p apps/portal/data/tmp-slike
          cp /tmp/slike/eu.json apps/portal/data/tmp-slike/eu.json
          cp /tmp/slike/sad.json apps/portal/data/tmp-slike/sad.json
      - name: Commit rezultata
        run: |
          git config user.name "gnk-asg-bot"
          git config user.email "it@gnk-asg.hr"
          git add apps/portal/data/tmp-slike
          git diff --cached --quiet || git commit -m "Privremeno: rezultat dohvata slika za EU/SAD komentare"
          git push
