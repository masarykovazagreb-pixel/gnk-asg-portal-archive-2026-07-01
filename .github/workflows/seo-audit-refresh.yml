name: SEO Audit Refresh

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: seo-audit-refresh-readonly
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Capture main SHA
        id: before
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run SEO audit crawl
        run: node scripts/seo-audit.mjs

      - name: Preserve SEO audit as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-report-${{ github.run_id }}
          path: apps/portal/data/seo-audit-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce read-only main invariant
        shell: bash
        env:
          BEFORE_SHA: ${{ steps.before.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          AFTER_SHA="$(git rev-parse origin/main)"
          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            echo "main moved during audit: $BEFORE_SHA -> $AFTER_SHA"
            exit 1
          fi
          CHANGED="$(git status --porcelain --untracked-files=all | awk '{print $2}' | grep -v '^apps/portal/data/seo-audit-report.json$' || true)"
          if [ -n "$CHANGED" ]; then
            echo "Unexpected files changed by SEO audit:"
            printf '%s\n' "$CHANGED"
            exit 1
          fi
          echo "SEO audit is read-only; report is retained only as an Actions artifact."
