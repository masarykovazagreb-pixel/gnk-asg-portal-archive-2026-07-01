name: One-Time Fix Deploy Verifier and Release V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fix-deploy-verifier-and-release-v1.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: one-time-fix-deploy-verifier-and-release-v1
  cancel-in-progress: false

jobs:
  fix-deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch stale production assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deploy-admin-auth-v6.yml')
          s=p.read_text()
          old_owner="x-gnk-route-owner: GNK_ASG_UNIFIED_AUTH_V34_PUBLIC_EDITORIAL_ASSETS_GNK_PUBLIC_EDITORIAL_ASSETS_V2_20260715"
          new_owner="x-gnk-route-owner: GNK_ASG_UNIFIED_AUTH_V36_CURRENT_NEWS_GNK_PUBLIC_EDITORIAL_ASSETS_V2_20260715"
          if s.count(old_owner) != 2:
              raise SystemExit(f'expected 2 legacy owner assertions, found {s.count(old_owner)}')
          s=s.replace(old_owner,new_owner)
          old='''          grep -q '"ready": true' deploy-verification/contact-ready.json
          grep -q '"storage"' deploy-verification/contact-ready.json
          grep -q '"mail"' deploy-verification/contact-ready.json
          grep -q '"transport"' deploy-verification/contact-ready.json
'''
          new='''          jq -e '\n            (.ready == true and has("storage") and has("mail") and has("transport"))\n            or\n            (.status == "READY" and .bindings.kv == true and .bindings.r2 == true and .bindings.email == true)\n          ' deploy-verification/contact-ready.json >/dev/null
'''
          if old not in s:
              raise SystemExit('legacy contact readiness assertion block not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
          grep -Fq 'GNK_ASG_UNIFIED_AUTH_V36_CURRENT_NEWS' .github/workflows/deploy-admin-auth-v6.yml
          grep -Fq '.status == "READY"' .github/workflows/deploy-admin-auth-v6.yml

      - name: Validate corrected release source
        shell: bash
        run: |
          set -euo pipefail
          node --check workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          node --check workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js
          node --check apps/portal/assets/index-editorial-order-v1.js
          node --check apps/portal/assets/editorial-latest-index-v1.js
          node scripts/test-visible-menu-logo-content-v1.mjs
          node scripts/test-contact-form-contract.mjs
          node scripts/test-email-signature-contract.mjs
          node scripts/test-mail-transport-guardrails.mjs
          node scripts/test-email-mime-guardrails.mjs
          node scripts/test-autoreply-guardrails.mjs
          node scripts/test-autoreply-all-addresses.mjs
          node scripts/test-public-editorial-asset-routes-v1.mjs
          node scripts/test-data-fallback-contract.mjs
          node scripts/predeploy-release-v6.mjs
          grep -Fq "x-gnk-news-source','current-static-asset-20260715" workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          grep -Fq '2026-07-15' apps/portal/data/news.json
          grep -Fq 'Kapitalna disciplina u razdoblju geopolitičkih i energetskih šokova' apps/portal/objave/index.html
          grep -Fq 'AI ne smije pisati konačnu odluku' apps/portal/komentari/index.html
          grep -Fq 'GNK_ASG_MAIL_IDENTITY_AUTOREPLY_V6_20260715_AI_BRANDED' workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js
          grep -Fq 'loadEmailLogo' workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js
          grep -Fq 'signature.html' workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js

      - name: Commit verifier repair
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-admin-auth-v6.yml
          git commit -m 'fix(ci): accept current editorial owner and contact readiness contract'
          git push origin HEAD:main
          release_sha=$(git rev-parse HEAD)
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch exact-SHA production deploy
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-admin-auth-v6.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f confirm_production_deploy=DEPLOY_ADMIN_AUTH_V6 \
            -f approved_sha="$RELEASE_SHA"

      - name: Wait for deploy conclusion
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_json='{}'
          for attempt in $(seq 1 75); do
            run_json=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-admin-auth-v6.yml/runs?event=workflow_dispatch&per_page=100" | jq -c --arg sha "$RELEASE_SHA" '[.workflow_runs[] | select(.head_sha==$sha)] | sort_by(.created_at) | reverse | .[0] // {}')
            status=$(jq -r '.status // "not_found"' <<<"$run_json")
            if [ "$status" = completed ]; then break; fi
            sleep 20
          done
          run_id=$(jq -r '.id // empty' <<<"$run_json")
          conclusion=$(jq -r '.conclusion // "pending"' <<<"$run_json")
          status=$(jq -r '.status // "not_found"' <<<"$run_json")
          html_url=$(jq -r '.html_url // ""' <<<"$run_json")
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "html_url=$html_url" >> "$GITHUB_OUTPUT"

      - name: Verify production functions
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          DEPLOY_STATUS: ${{ steps.deploy.outputs.status }}
          DEPLOY_CONCLUSION: ${{ steps.deploy.outputs.conclusion }}
          DEPLOY_RUN_ID: ${{ steps.deploy.outputs.run_id }}
          DEPLOY_URL: ${{ steps.deploy.outputs.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          out=artifacts/final-repair-v1
          mkdir -p "$out"
          cache="${RELEASE_SHA}-$(date +%s)"

          check(){
            local name="$1" url="$2" marker="$3"
            local headers="$out/${name}.headers" body="$out/${name}.body"
            local code location marker_ok=false
            code=$(curl --silent --show-error --dump-header "$headers" --output "$body" --write-out '%{http_code}' "${url}?verify=${cache}" || true)
            location=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/\r$/,"",$0);print substr($0,11)}' "$headers" | tail -1)
            if grep -Fqi -- "$marker" "$body" "$headers"; then marker_ok=true; fi
            jq -n --arg name "$name" --arg url "$url" --arg code "$code" --arg location "$location" --arg marker "$marker" --argjson markerOk "$marker_ok" '{name:$name,url:$url,http:($code|tonumber? // 0),location:($location|select(length>0)//null),marker:$marker,markerOk:$markerOk}'
          }

          home=$(check home 'https://gnk-asg.hr/' 'index-editorial-order-v6.js')
          objave=$(check objave 'https://gnk-asg.hr/objave/' 'Kapitalna disciplina u razdoblju geopolitičkih i energetskih šokova')
          komentari=$(check komentari 'https://gnk-asg.hr/komentari/' 'AI ne smije pisati konačnu odluku')
          contact_page=$(check contact-page 'https://gnk-asg.hr/contact/' 'id="contactForm"')
          mail_studio=$(check mail-studio 'https://gnk-asg.hr/assets/mail-studio-ui-v28.js' 'min-height:520px')
          autoreply_asset=$(check autoreply-source 'https://gnk-asg.hr/assets/logo-gnk-asg-email.png' 'x-gnk-canonical-logo: same-as-portal')

          news_headers="$out/news.headers"; news_body="$out/news.body"
          news_code=$(curl --silent --show-error --dump-header "$news_headers" --output "$news_body" --write-out '%{http_code}' "https://gnk-asg.hr/data/news.json?verify=${cache}" || true)
          news_latest=$(jq -r 'if type=="array" then .[0].published_at // .[0].publishedAt // "" else (.items[0].published_at // .items[0].publishedAt // "") end' "$news_body" 2>/dev/null || true)
          news_ok=false; [[ "$news_latest" == 2026-07-15* ]] && news_ok=true
          news_source=$(awk 'BEGIN{IGNORECASE=1}/^x-gnk-news-source:/{sub(/\r$/,"",$0);print substr($0,19)}' "$news_headers" | tail -1)
          news=$(jq -n --arg code "$news_code" --arg latest "$news_latest" --arg source "$news_source" --argjson markerOk "$news_ok" '{name:"news",url:"https://gnk-asg.hr/data/news.json",http:($code|tonumber? // 0),latest:$latest,source:$source,markerOk:$markerOk}')

          contact_headers="$out/contact-ready.headers"; contact_body="$out/contact-ready.body"
          contact_code=$(curl --silent --show-error --dump-header "$contact_headers" --output "$contact_body" --write-out '%{http_code}' "https://gnk-asg.hr/api/contact-submit?verify=${cache}" || true)
          contact_ok=$(jq '(.ready == true and has("storage") and has("mail") and has("transport")) or (.status == "READY" and .bindings.kv == true and .bindings.r2 == true and .bindings.email == true)' "$contact_body" 2>/dev/null || echo false)
          contact=$(jq -n --arg code "$contact_code" --argjson markerOk "$contact_ok" --slurpfile body "$contact_body" '{name:"contact-readiness",url:"https://gnk-asg.hr/api/contact-submit",http:($code|tonumber? // 0),markerOk:$markerOk,response:($body[0]//null)}')

          checks=$(jq -s '.' < <(printf '%s\n' "$home" "$news" "$objave" "$komentari" "$contact_page" "$contact" "$mail_studio" "$autoreply_asset"))
          checks_ok=$(jq 'all(.[]; .http==200 and .markerOk==true and ((.location // "")==""))' <<<"$checks")
          ok=false
          if [ "$DEPLOY_STATUS" = completed ] && [ "$DEPLOY_CONCLUSION" = success ] && [ "$checks_ok" = true ]; then ok=true; fi

          jq -n \
            --arg checkedAt "$(date -u +%FT%TZ)" \
            --arg releaseSha "$RELEASE_SHA" \
            --arg runId "$DEPLOY_RUN_ID" \
            --arg status "$DEPLOY_STATUS" \
            --arg conclusion "$DEPLOY_CONCLUSION" \
            --arg htmlUrl "$DEPLOY_URL" \
            --argjson checks "$checks" \
            --argjson ok "$ok" \
            '{checkedAt:$checkedAt,releaseSha:$releaseSha,deploy:{runId:$runId,status:$status,conclusion:$conclusion,htmlUrl:$htmlUrl},checks:$checks,ok:$ok}' > "$out/status.json"
          cat "$out/status.json"

      - name: Record final evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/final-repair-v1
          git commit -m 'ci: record final urgent repair verification' || exit 0
          git push origin HEAD:main
