name: Disaster Recovery Mirror V2

on:
  push:
    branches:
      - main
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disaster-recovery-mirror-v2
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror all branches, tags and LFS objects
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out complete source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Mirror repository to recovery account
        env:
          SOURCE_TOKEN: ${{ github.token }}
          MIRROR_TOKEN: ${{ secrets.MASARYKOVA_BACKUP_TOKEN }}
          BACKUP_REPOSITORY: masarykovazagreb-pixel/gnk-asg-portal-archive-2026-07-01
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SOURCE_TOKEN:-}"
          test -n "${MIRROR_TOKEN:-}"

          git config --local --unset-all http.https://github.com/.extraheader || true
          git update-ref -d refs/remotes/origin/HEAD || true
          git lfs install

          askpass="$RUNNER_TEMP/gnk-asg-git-askpass.sh"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$ACTIVE_TOKEN" ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0

          # Fetch all LFS objects from the private source with the source token.
          export ACTIVE_TOKEN="$SOURCE_TOKEN"
          git lfs fetch --all origin || true

          # Use only the recovery PAT for all operations against the backup repository.
          export ACTIVE_TOKEN="$MIRROR_TOKEN"
          git remote add recovery "https://github.com/${BACKUP_REPOSITORY}.git"
          git push --force --prune recovery 'refs/remotes/origin/*:refs/heads/*'

          if git show-ref --tags --quiet; then
            git push --force --prune recovery 'refs/tags/*:refs/tags/*'
          fi

          mapfile -t lfs_refs < <(git for-each-ref --format='%(refname)' refs/remotes/origin refs/tags)
          if ((${#lfs_refs[@]})); then
            git lfs push --all recovery "${lfs_refs[@]}" || true
          fi

          source_main="$(git rev-parse refs/remotes/origin/main)"
          recovery_main="$(git ls-remote recovery refs/heads/main | awk '{print $1}')"
          test -n "$recovery_main"
          test "$source_main" = "$recovery_main"

          restore_ref="$(git ls-remote recovery refs/heads/restore-point-2026-07-02-full-system | awk '{print $1}')"
          test -n "$restore_ref"

          {
            echo "## Disaster-recovery mirror verified"
            echo
            echo "- Source: $GITHUB_REPOSITORY"
            echo "- Recovery: $BACKUP_REPOSITORY"
            echo "- Main commit: $recovery_main"
            echo "- Fixed restore point: restore-point-2026-07-02-full-system"
          } >> "$GITHUB_STEP_SUMMARY"
