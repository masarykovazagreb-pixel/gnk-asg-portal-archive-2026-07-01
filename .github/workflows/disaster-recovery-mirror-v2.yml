name: Disaster Recovery Mirror

on:
  push:
    branches: [main]
  schedule:
    # Hourly reconciliation also captures automation commits that intentionally use [skip ci].
    - cron: "23 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disaster-recovery-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror and verify branches, tags and LFS
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out complete source history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Mirror repository to independent recovery account
        env:
          SOURCE_TOKEN: ${{ github.token }}
          MIRROR_TOKEN: ${{ secrets.MASARYKOVA_BACKUP_TOKEN }}
          BACKUP_REPOSITORY: masarykovazagreb-pixel/gnk-asg-portal-archive-2026-07-01
          RESTORE_BRANCH: restore-point-2026-07-02-full-system
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SOURCE_TOKEN:-}" || { echo "Source token is missing."; exit 1; }
          test -n "${MIRROR_TOKEN:-}" || { echo "MASARYKOVA_BACKUP_TOKEN is missing."; exit 1; }
          test -n "${BACKUP_REPOSITORY:-}"
          test -n "${RESTORE_BRANCH:-}"

          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git update-ref -d refs/remotes/origin/HEAD || true
          git lfs install --local

          askpass="$RUNNER_TEMP/gnk-asg-git-askpass.sh"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$ACTIVE_TOKEN" ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0

          export ACTIVE_TOKEN="$SOURCE_TOKEN"
          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'
          git lfs fetch --all origin

          source_main="$(git rev-parse refs/remotes/origin/main)"
          source_restore="$(git rev-parse "refs/remotes/origin/${RESTORE_BRANCH}")"
          test -n "$source_main"
          test -n "$source_restore"

          export ACTIVE_TOKEN="$MIRROR_TOKEN"
          git remote remove recovery 2>/dev/null || true
          git remote add recovery "https://github.com/${BACKUP_REPOSITORY}.git"
          git ls-remote recovery HEAD >/dev/null

          git push --force --prune recovery 'refs/remotes/origin/*:refs/heads/*'

          if git show-ref --tags --quiet; then
            git push --force --prune recovery 'refs/tags/*:refs/tags/*'
          else
            mapfile -t remote_tags < <(git ls-remote --tags --refs recovery | awk '{sub("refs/tags/", "", $2); print $2}')
            if ((${#remote_tags[@]})); then
              git push recovery --delete "${remote_tags[@]}"
            fi
          fi

          git lfs push --all recovery

          source_branches="$RUNNER_TEMP/source-branches.txt"
          recovery_branches="$RUNNER_TEMP/recovery-branches.txt"
          source_tags="$RUNNER_TEMP/source-tags.txt"
          recovery_tags="$RUNNER_TEMP/recovery-tags.txt"

          git for-each-ref --format='%(refname:strip=3) %(objectname)' refs/remotes/origin \
            | grep -v '^HEAD ' | sort > "$source_branches"
          git ls-remote --heads recovery \
            | awk '{sub("refs/heads/", "", $2); print $2 " " $1}' | sort > "$recovery_branches"
          diff -u "$source_branches" "$recovery_branches"

          git for-each-ref --format='%(refname:strip=2) %(objectname)' refs/tags \
            | sort > "$source_tags"
          git ls-remote --tags --refs recovery \
            | awk '{sub("refs/tags/", "", $2); print $2 " " $1}' | sort > "$recovery_tags"
          diff -u "$source_tags" "$recovery_tags"

          recovery_main="$(git ls-remote recovery refs/heads/main | awk '{print $1}')"
          recovery_restore="$(git ls-remote recovery "refs/heads/${RESTORE_BRANCH}" | awk '{print $1}')"
          test "$source_main" = "$recovery_main"
          test "$source_restore" = "$recovery_restore"

          branch_count="$(wc -l < "$source_branches" | tr -d ' ')"
          tag_count="$(wc -l < "$source_tags" | tr -d ' ')"
          {
            echo "## Disaster-recovery mirror verified"
            echo
            echo "- Source: $GITHUB_REPOSITORY"
            echo "- Recovery: $BACKUP_REPOSITORY"
            echo "- Main commit: $recovery_main"
            echo "- Restore branch: $RESTORE_BRANCH"
            echo "- Restore commit: $recovery_restore"
            echo "- Branches verified: $branch_count"
            echo "- Tags verified: $tag_count"
            echo "- LFS push: completed"
          } >> "$GITHUB_STEP_SUMMARY"
