name: Validate Legacy Public Portal Package

on:
  pull_request:
    paths:
      - "apps/portal/**"
      - "workers/gnk-asg-direct-operator/**"
      - "scripts/**"
      - ".github/workflows/deploy-public-portal-assets-safe.yml"
      - ".github/workflows/deploy-admin-auth-v6.yml"

permissions:
  contents: read

jobs:
  validate-public-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate production authorization and current portal source
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/portal/index.html
          test -s apps/portal/en/index.html
          test -s apps/portal/sitemap.xml
          test -s workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          test -s workers/gnk-asg-direct-operator/wrangler.toml
          node --check workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          node scripts/test-deploy-approval-guardrails.mjs

      - name: Dry-run legacy public Worker package
        working-directory: workers/gnk-asg-direct-operator
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator

      - name: Confirm validation-only boundary
        run: echo "Production deployment is not permitted from this event."
