name: Deploy Public Portal Assets Safe

on:
  workflow_dispatch:
    inputs:
      confirm_public_assets_deploy:
        description: "Type DEPLOY_PUBLIC_PORTAL_SAFE to deploy public portal assets"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-public-assets:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_public_assets_deploy == 'DEPLOY_PUBLIC_PORTAL_SAFE'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate public portal assets and protected entrypoint
        shell: bash
        run: |
          set -euxo pipefail

          required_files=(
            apps/portal/index.html
            apps/portal/en/index.html
            apps/portal/about/index.html
            apps/portal/en/about/index.html
            apps/portal/projects/index.html
            apps/portal/en/projects/index.html
            apps/portal/projects/roadmap/index.html
            apps/portal/en/projects/roadmap/index.html
            apps/portal/finance/index.html
            apps/portal/en/finance/index.html
            apps/portal/reports/index.html
            apps/portal/en/reports/index.html
            apps/portal/media-application/index.html
            apps/portal/the-code/index.html
            apps/portal/the-code/media-memorandum/index.html
            apps/portal/group-network/index.html
            apps/portal/email-status/index.html
            apps/portal/mail-studio/index.html
            apps/portal/sitemap.xml
            apps/portal/assets/digital-headquarters-v1.css
            apps/portal/assets/digital-headquarters-v1.js
            apps/portal/assets/digital-headquarters-home-v2.css
            apps/portal/assets/digital-headquarters-home-v2.js
            apps/portal/assets/group-network-v1.css
            apps/portal/assets/group-network-v1.js
            apps/portal/assets/strategic-project-roadmap-v1.css
            apps/portal/assets/strategic-project-roadmap-v1.js
            apps/portal/assets/media-registration-v1.js
            apps/portal/assets/email-status-dashboard-v2.js
            apps/portal/assets/admin-only-module-map-v1.js
            apps/portal/assets/mail-studio-webmail-v27.js
            apps/portal/assets/mail-studio-auto-reply-panel-v1.js
            apps/portal/assets/mail-studio-reference-code-v1.js
            apps/portal/google46686328e30c759f.html
            apps/portal/data/finance-kpi-2025.json
            apps/portal/data/public-group-network.json
            apps/portal/data/strategic-project-roadmap.json
            apps/portal/data/content-operations-queue.json
            apps/portal/tests/group-network-v1.test.mjs
            apps/portal/tests/strategic-project-roadmap.test.mjs
            apps/portal/tests/strategic-roadmap-routes.test.mjs
            apps/portal/downloads/GNK_ASG_doo_Audited_Financial_Statements_2025_HR.pdf
            apps/portal/downloads/GNK_DINAMO_Ltd_Consolidated_Financial_Report_2025_USA.pdf
            workers/gnk-asg-direct-operator/src/index-unified-auth-v15.js
            workers/gnk-asg-direct-operator/src/index-unified-auth-v16.js
            workers/gnk-asg-direct-operator/src/email-status-tracking-v1.js
            workers/gnk-asg-direct-operator/src/email-status-tracking-v5.js
            workers/gnk-asg-direct-operator/src/email-status-tracking-v6.js
            workers/gnk-asg-direct-operator/src/auto-reply-case-center-v1.js
            workers/gnk-asg-direct-operator/src/email-signature-contract-v1.js
            workers/gnk-asg-direct-operator/src/manual-mail-service-v1.js
            workers/gnk-asg-direct-operator/src/public-ai-v10.js
            workers/gnk-asg-direct-operator/src/automation-control-v1.js
            workers/gnk-asg-direct-operator/tests/automation-control-v1.test.mjs
            workers/gnk-asg-direct-operator/tests/email-signature-contract-v1.test.mjs
            workers/gnk-asg-direct-operator/tests/public-ai-v10.test.mjs
          )
          for file in "${required_files[@]}"; do
            test -s "$file" || { echo "::error file=${file}::Required file is missing or empty"; exit 1; }
          done

          grep -q 'DIGITAL_HEADQUARTERS_V1' apps/portal/index.html apps/portal/en/index.html
          grep -q 'GNK DINAMO Ltd. Group is the international parent group' apps/portal/en/index.html
          grep -q 'An international Group and a Croatian development company.' apps/portal/en/about/index.html
          grep -q 'Financial indicators and publicly available reports.' apps/portal/en/finance/index.html
          grep -q '45 aktivnih društava' apps/portal/index.html
          grep -q '45 active companies' apps/portal/en/index.html
          grep -q '/group-network/' apps/portal/index.html apps/portal/sitemap.xml
          grep -q 'data-gnk-network-mount' apps/portal/index.html apps/portal/group-network/index.html
          grep -q 'group-network-v1.js' apps/portal/index.html apps/portal/group-network/index.html
          grep -q 'Međunarodne bolnice, sportska medicina i rehabilitacija' apps/portal/index.html apps/portal/projects/index.html
          grep -q 'International hospitals, sports medicine and rehabilitation' apps/portal/en/index.html apps/portal/en/projects/index.html
          grep -q 'Arhitektura projektirana za približno 1.537 operativnih pozicija' apps/portal/index.html
          grep -q 'Architecture designed for approximately 1,537 operating positions' apps/portal/en/index.html
          grep -q 'Izjava uprave · stanje na 29. lipnja 2026.' apps/portal/finance/index.html
          grep -q 'Management statement · position at 29 June 2026' apps/portal/en/finance/index.html
          grep -q 'dedicated username and password' apps/portal/media-application/index.html
          grep -q 'does not grant admin access' apps/portal/media-application/index.html

          for route in en/about en/projects projects/roadmap en/projects/roadmap en/finance en/reports group-network; do
            grep -q "https://www.gnk-asg.hr/${route}/" apps/portal/sitemap.xml
          done

          grep -q 'data-strategic-roadmap-mount' apps/portal/projects/roadmap/index.html apps/portal/en/projects/roadmap/index.html
          grep -q 'strategic-project-roadmap-v1.js' apps/portal/projects/roadmap/index.html apps/portal/en/projects/roadmap/index.html
          grep -q 'Nine projects structured by phase, gates and risk.' apps/portal/en/projects/roadmap/index.html
          grep -q 'Devet projekata po fazama, gateovima i rizicima.' apps/portal/projects/roadmap/index.html
          grep -q '"projects"' apps/portal/data/strategic-project-roadmap.json
          grep -q '"mode"' apps/portal/data/content-operations-queue.json
          grep -q 'GNK_ASG_AUTOMATION_CONTROL_V1_20260710' workers/gnk-asg-direct-operator/src/automation-control-v1.js
          grep -q "externalPublish:'manual-approval-required'" workers/gnk-asg-direct-operator/src/automation-control-v1.js
          grep -q "productionDeploy:'manual-approval-required'" workers/gnk-asg-direct-operator/src/automation-control-v1.js
          grep -q "bulkEmail:'disabled'" workers/gnk-asg-direct-operator/src/automation-control-v1.js

          echo "Validating PDF links on public download surfaces"
          for page in \
            apps/portal/index.html apps/portal/en/index.html \
            apps/portal/finance/index.html apps/portal/en/finance/index.html \
            apps/portal/reports/index.html apps/portal/en/reports/index.html; do
            grep -q 'GNK_ASG_doo_Audited_Financial_Statements_2025_HR.pdf' "$page"
            grep -q 'GNK_DINAMO_Ltd_Consolidated_Financial_Report_2025_USA.pdf' "$page"
          done

          grep -q '/the-code/media-memorandum/' apps/portal/index.html
          grep -q '/media-application/?lang=en' apps/portal/en/index.html
          grep -q 'Official Media Invitation and Detailed Memorandum' apps/portal/the-code/media-memorandum/index.html
          grep -q 'google-site-verification: google46686328e30c759f.html' apps/portal/google46686328e30c759f.html

          grep -q 'GNK_ASG_EMAIL_STATUS_DASHBOARD_V3' apps/portal/assets/email-status-dashboard-v2.js
          grep -q 'GNK_ASG_EMAIL_STATUS_CLASSIC_FALLBACK_V1_20260710' apps/portal/email-status/index.html
          grep -q 'email-status-dashboard-v2.js?v=20260710-3' workers/gnk-asg-direct-operator/src/email-status-tracking-v6.js
          grep -q 'EMAIL_OPEN_TRACKING_ENABLED = "true"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q "scheduledAutomation:'email-status-sync-only'" workers/gnk-asg-direct-operator/src/index-unified-auth-v16.js
          grep -q "lowerScheduledHandlers:'disabled'" workers/gnk-asg-direct-operator/src/index-unified-auth-v16.js
          ! grep -q 'app\.scheduled' workers/gnk-asg-direct-operator/src/index-unified-auth-v16.js

          grep -q 'GNK_ASG_WEBMAIL_V27_20260709_BCC_SOURCE_CLEANUP' apps/portal/assets/mail-studio-webmail-v27.js
          grep -q 'GNK_ASG_MAIL_STUDIO_AUTO_REPLY_PANEL_V1_20260709' apps/portal/assets/mail-studio-auto-reply-panel-v1.js
          grep -q 'GNK_ASG_MAIL_STUDIO_REFERENCE_CODE_V1_20260709' apps/portal/assets/mail-studio-reference-code-v1.js
          grep -q 'beckuphome@gmail.com' apps/portal/mail-studio/index.html
          grep -q "const BCC='beckuphome@gmail.com'" apps/portal/assets/mail-studio-webmail-v27.js
          ! grep -q 'rht@gmx.com' apps/portal/mail-studio/index.html apps/portal/assets/mail-studio-webmail-v27.js
          grep -q 'GNK_ASG_AUTO_REPLY_CASE_CENTER_V1_20260709_PERSONALIZED_AI_SIGNATURES' workers/gnk-asg-direct-operator/src/auto-reply-case-center-v1.js
          grep -q 'GNK_ASG_EMAIL_SIGNATURE_CONTRACT_V2_20260709_GOLD_LOGO_CASE_AUTO_REPLY' workers/gnk-asg-direct-operator/src/email-signature-contract-v1.js
          grep -q 'GNK_ASG_PUBLIC_AI_V11_20260710_LIMITS_ROUTES' workers/gnk-asg-direct-operator/src/public-ai-v10.js

          grep -q 'GNK_ASG_UNIFIED_AUTH_V30_20260710_WORKER_OPS_PROTECTED' workers/gnk-asg-direct-operator/src/index-unified-auth-v15.js
          grep -q 'GNK_ASG_UNIFIED_AUTH_V31_20260710_WORKER_OPS_ENTRY_GUARD' workers/gnk-asg-direct-operator/src/index-unified-auth-v16.js
          grep -q "path.startsWith('/worker-ops/')" workers/gnk-asg-direct-operator/src/index-unified-auth-v16.js
          grep -q "workerOpsDirectAssetGuard:'operator-auth-required'" workers/gnk-asg-direct-operator/src/index-unified-auth-v16.js
          grep -q 'main = "src/index-unified-auth-v16.js"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'directory = "../../apps/portal"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'run_worker_first = true' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'keep_vars = true' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'MAIL_MANUAL_LIVE = "true"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'MEDIA_OUTREACH_LIVE = "false"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'MAIL_PROFILE_TEST_LIVE = "false"' workers/gnk-asg-direct-operator/wrangler.toml

          grep -q '"excludedMetrics"' apps/portal/data/finance-kpi-2025.json
          grep -q '"ebitdaEstimated"' apps/portal/data/finance-kpi-2025.json
          grep -q '"shortTermLiabilities"' apps/portal/data/finance-kpi-2025.json
          grep -q '"longTermLiabilities"' apps/portal/data/finance-kpi-2025.json
          grep -q '"asgDisclosureLabel": "audited financial statements 2025 / MSFI"' apps/portal/data/finance-kpi-2025.json
          ! grep -q 'HSFI' apps/portal/data/finance-kpi-2025.json

          node --check apps/portal/assets/digital-headquarters-v1.js
          node --check apps/portal/assets/digital-headquarters-home-v2.js
          node --check apps/portal/assets/group-network-v1.js
          node --check apps/portal/assets/strategic-project-roadmap-v1.js
          node --check apps/portal/assets/media-registration-v1.js
          node --check apps/portal/assets/email-status-dashboard-v2.js
          node --check apps/portal/assets/admin-only-module-map-v1.js
          node --check apps/portal/assets/mail-studio-webmail-v27.js
          node --check apps/portal/assets/mail-studio-auto-reply-panel-v1.js
          node --check apps/portal/assets/mail-studio-reference-code-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-unified-auth-v15.js
          node --check workers/gnk-asg-direct-operator/src/index-unified-auth-v16.js
          node --check workers/gnk-asg-direct-operator/src/email-status-tracking-v1.js
          node --check workers/gnk-asg-direct-operator/src/email-status-tracking-v6.js
          node --check workers/gnk-asg-direct-operator/src/auto-reply-case-center-v1.js
          node --check workers/gnk-asg-direct-operator/src/email-signature-contract-v1.js
          node --check workers/gnk-asg-direct-operator/src/manual-mail-service-v1.js
          node --check workers/gnk-asg-direct-operator/src/public-ai-v10.js
          node --check workers/gnk-asg-direct-operator/src/automation-control-v1.js

          node apps/portal/tests/group-network-v1.test.mjs
          node apps/portal/tests/strategic-project-roadmap.test.mjs
          node apps/portal/tests/strategic-roadmap-routes.test.mjs
          node workers/gnk-asg-direct-operator/tests/automation-control-v1.test.mjs
          node workers/gnk-asg-direct-operator/tests/email-signature-contract-v1.test.mjs
          node workers/gnk-asg-direct-operator/tests/public-ai-v10.test.mjs

      - name: Dry-run public Worker and assets deploy
        working-directory: workers/gnk-asg-direct-operator
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator

      - name: Deploy public portal assets through direct operator
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator

      - name: Verify public portal assets
        shell: bash
        run: |
          set -euo pipefail
          cb="${GITHUB_SHA}-${GITHUB_RUN_ID}"

          check_contains() {
            local label="$1" url="$2" needle="$3" body status curl_exit
            body="$(mktemp)"
            echo "::group::${label}"
            for attempt in 1 2 3 4 5 6; do
              set +e
              status="$(curl --location --silent --show-error --output "$body" --write-out '%{http_code}' --max-time 20 "$url")"
              curl_exit=$?
              set -e
              if [ "$curl_exit" = "0" ] && [ "$status" = "200" ] && grep -q "$needle" "$body"; then
                echo "OK: ${label}"
                echo "::endgroup::"
                rm -f "$body"
                return 0
              fi
              head -c 500 "$body" || true
              echo
              sleep 10
            done
            echo "FAILED: ${label}; expected ${needle}" >&2
            echo "::endgroup::"
            rm -f "$body"
            return 1
          }

          check_status() {
            local label="$1" url="$2" body status curl_exit
            body="$(mktemp)"
            echo "::group::${label}"
            for attempt in 1 2 3 4 5 6; do
              set +e
              status="$(curl --location --silent --show-error --output "$body" --write-out '%{http_code}' --max-time 30 "$url")"
              curl_exit=$?
              set -e
              if [ "$curl_exit" = "0" ] && [ "$status" = "200" ]; then
                echo "OK: ${label}"
                echo "::endgroup::"
                rm -f "$body"
                return 0
              fi
              head -c 200 "$body" || true
              echo
              sleep 10
            done
            echo "FAILED: ${label}" >&2
            echo "::endgroup::"
            rm -f "$body"
            return 1
          }

          check_contains "Google verification" "https://gnk-asg.hr/google46686328e30c759f.html?cb=${cb}" "google-site-verification: google46686328e30c759f.html"
          check_contains "Digital Headquarters HR" "https://gnk-asg.hr/?cb=${cb}" "DIGITAL_HEADQUARTERS_V1"
          check_contains "Digital Headquarters EN" "https://gnk-asg.hr/en?cb=${cb}" "GNK DINAMO Ltd. Group is the international parent group"
          check_contains "English About" "https://gnk-asg.hr/en/about/?cb=${cb}" "An international Group and a Croatian development company."
          check_contains "English Projects" "https://gnk-asg.hr/en/projects/?cb=${cb}" "Nine actual projects"
          check_contains "Strategic Roadmap HR" "https://gnk-asg.hr/projects/roadmap/?cb=${cb}" "Devet projekata po fazama, gateovima i rizicima."
          check_contains "Strategic Roadmap EN" "https://gnk-asg.hr/en/projects/roadmap/?cb=${cb}" "Nine projects structured by phase, gates and risk."
          check_contains "Strategic Roadmap data" "https://gnk-asg.hr/data/strategic-project-roadmap.json?cb=${cb}" "projects"
          check_contains "Strategic Roadmap JS" "https://gnk-asg.hr/assets/strategic-project-roadmap-v1.js?cb=${cb}" "GNKStrategicRoadmap"
          check_contains "English Finance" "https://gnk-asg.hr/en/finance/?cb=${cb}" "Financial indicators and publicly available reports."
          check_contains "English Reports" "https://gnk-asg.hr/en/reports/?cb=${cb}" "The documents are public. Downloads are direct"
          check_contains "Group Network page" "https://gnk-asg.hr/group-network/?cb=${cb}" "Global Group Network"
          check_contains "Group Network data" "https://gnk-asg.hr/data/public-group-network.json?cb=${cb}" "operatingLocations"
          check_contains "Group Network JS" "https://gnk-asg.hr/assets/group-network-v1.js?cb=${cb}" "GNKGroupNetwork"
          check_contains "Media username-password flow" "https://gnk-asg.hr/media-application/?lang=en&cb=${cb}" "dedicated username and password"
          check_contains "THE CODE memorandum" "https://gnk-asg.hr/the-code/media-memorandum/?cb=${cb}" "Official Media Invitation and Detailed Memorandum"
          check_contains "THE CODE" "https://gnk-asg.hr/the-code/?cb=${cb}" "THE CODE"
          check_contains "Finance downloads" "https://gnk-asg.hr/finance/?cb=${cb}" "GNK_DINAMO_Ltd_Consolidated_Financial_Report_2025_USA.pdf"
          check_contains "Reports downloads" "https://gnk-asg.hr/reports/?cb=${cb}" "GNK_ASG_doo_Audited_Financial_Statements_2025_HR.pdf"
          check_contains "Active entrypoint" "https://gnk-asg.hr/data/portal-version.json?cb=${cb}" "index-unified-auth-v16.js"
          check_contains "Worker Ops guard" "https://gnk-asg.hr/data/portal-version.json?cb=${cb}" "operator-auth-required"
          check_contains "Scheduled isolation" "https://gnk-asg.hr/data/portal-version.json?cb=${cb}" "email-status-sync-only"
          check_contains "Digital Headquarters JS" "https://gnk-asg.hr/assets/digital-headquarters-v1.js?cb=${cb}" "data-auth-only"
          check_contains "Email Status dashboard JS" "https://gnk-asg.hr/assets/email-status-dashboard-v2.js?cb=${cb}" "GNK_ASG_EMAIL_STATUS_DASHBOARD_V3"
          check_contains "Finance KPI JSON" "https://gnk-asg.hr/data/finance-kpi-2025.json?cb=${cb}" "ebitdaEstimated"
          check_contains "Finance MSFI label" "https://gnk-asg.hr/data/finance-kpi-2025.json?cb=${cb}" "MSFI"
          check_status "GNK ASG audited PDF" "https://gnk-asg.hr/downloads/GNK_ASG_doo_Audited_Financial_Statements_2025_HR.pdf?cb=${cb}"
          check_status "GNK DINAMO Group PDF" "https://gnk-asg.hr/downloads/GNK_DINAMO_Ltd_Consolidated_Financial_Report_2025_USA.pdf?cb=${cb}"
