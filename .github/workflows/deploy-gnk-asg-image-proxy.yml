name: Deploy gnk-asg-image-proxy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/gnk-asg-image-proxy/**'
      - '.github/workflows/deploy-gnk-asg-image-proxy.yml'

permissions:
  contents: write

concurrency:
  group: gnk-asg-image-proxy-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/gnk-asg-image-proxy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Provjeri konfiguraciju prije deploya
        run: |
          set -euo pipefail
          node --check src/index.js
          grep -q '^name = "gnk-asg-image-proxy"' wrangler.toml
          grep -q 'pattern = "gnk-asg.hr/api/slike\*"' wrangler.toml

      - name: Provjeri Cloudflare vjerodajnice
        id: credentials
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare vjerodajnice nisu konfigurirane; deploy je sigurno preskocen.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy na gnk-asg.hr/api/slike*
        if: steps.credentials.outputs.configured == 'true'
        run: npx wrangler@4 deploy

      - name: Provjeri da ruta odgovara i zapisi rezultat u repozitorij
        if: steps.credentials.outputs.configured == 'true'
        run: |
          set -uo pipefail
          sleep 8
          status=$(curl -s -o /tmp/odgovor.json -w '%{http_code}' "https://gnk-asg.hr/api/slike?upit=test" || echo "000")
          body=$(cat /tmp/odgovor.json 2>/dev/null || echo "")
          echo "HTTP status: $status"
          echo "$body"
          python3 - "$status" "$body" <<'PYEOF'
          import json, sys, datetime
          status, body = sys.argv[1], sys.argv[2]
          try:
              parsed = json.loads(body)
          except Exception:
              parsed = None
          rezultat = {
              "provjereno_u": datetime.datetime.utcnow().isoformat() + "Z",
              "http_status": status,
              "odgovor_sirovo": body[:2000],
              "odgovor_json": parsed,
              "ocjena": "radi" if status == "200" else (
                  "ziv_ali_ceka_secret" if parsed and "PEXELS_API_KEY" in json.dumps(parsed) else "provjeri_rucno"
              ),
          }
          with open("workers/gnk-asg-image-proxy/DEPLOY-STATUS.json", "w") as f:
              json.dump(rezultat, f, indent=2, ensure_ascii=False)
          PYEOF
          cat workers/gnk-asg-image-proxy/DEPLOY-STATUS.json

      - name: Zabiljezi status u repozitorij
        if: always() && steps.credentials.outputs.configured == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'gnk-asg-image-proxy: zapis statusa nakon deploya'
          file_pattern: 'workers/gnk-asg-image-proxy/DEPLOY-STATUS.json' 
