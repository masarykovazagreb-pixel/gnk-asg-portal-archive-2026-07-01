name: Validate gnk-asg-image-proxy

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'workers/gnk-asg-image-proxy/**'
      - '.github/workflows/deploy-gnk-asg-image-proxy.yml'
  push:
    branches: [main]
    paths:
      - 'workers/gnk-asg-image-proxy/**'
      - '.github/workflows/deploy-gnk-asg-image-proxy.yml'

permissions:
  contents: read

concurrency:
  group: gnk-asg-image-proxy-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/gnk-asg-image-proxy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Worker source and route contract
        run: |
          set -euo pipefail
          node --check src/index.js
          grep -q '^name = "gnk-asg-image-proxy"' wrangler.toml
          grep -q 'pattern = "gnk-asg.hr/api/slike\*"' wrangler.toml

      - name: Record safe validation summary
        run: |
          {
            echo '## gnk-asg-image-proxy validation'
            echo
            echo '- Worker JavaScript syntax: valid'
            echo '- Worker name contract: valid'
            echo '- Route contract: valid'
            echo '- Production deployment: intentionally delegated to the protected deploy workflow'
          } >> "$GITHUB_STEP_SUMMARY"
