name: Deploy gnk-asg-image-proxy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/gnk-asg-image-proxy/**'
      - '.github/workflows/deploy-gnk-asg-image-proxy.yml'

permissions:
  contents: read

concurrency:
  group: gnk-asg-image-proxy-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/gnk-asg-image-proxy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Provjeri konfiguraciju prije deploya
        run: |
          set -euo pipefail
          node --check src/index.js
          grep -q '^name = "gnk-asg-image-proxy"' wrangler.toml
          grep -q 'pattern = "gnk-asg.hr/api/slike\*"' wrangler.toml

      - name: Provjeri Cloudflare vjerodajnice
        id: credentials
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare vjerodajnice nisu konfigurirane; deploy je sigurno preskocen.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy na gnk-asg.hr/api/slike*
        if: steps.credentials.outputs.configured == 'true'
        run: npx wrangler@4 deploy

      - name: Provjeri da ruta odgovara (ocekuje se poruka o nedostajucem secretu dok se ne postavi)
        if: steps.credentials.outputs.configured == 'true'
        run: |
          set -euo pipefail
          sleep 5
          status=$(curl -s -o /tmp/odgovor.json -w '%{http_code}' "https://gnk-asg.hr/api/slike?upit=test")
          echo "HTTP status: $status"
          cat /tmp/odgovor.json
          # Ocekujemo 200 (radi) ili 500 s objasnjenjem da secret nije postavljen -
          # oboje znaci da je Worker ziv i odgovara na svojoj ruti bez rusenja sajta.
          test "$status" = "200" || grep -q "PEXELS_API_KEY" /tmp/odgovor.json
