name: Debug editorial validation failure (one-off)
on:
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reproduce the publish + validate steps
        run: |
          echo "# Editorial validation debug $(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/d.md
          echo '```' >> /tmp/d.md
          node scripts/editorial-publish-scheduled-v1.mjs >> /tmp/d.md 2>&1 || echo "PUBLISH SCRIPT EXIT: $?" >> /tmp/d.md
          echo "--- validate ---" >> /tmp/d.md
          node scripts/test-editorial-publish-seo-v1.mjs >> /tmp/d.md 2>&1 || echo "VALIDATE SCRIPT EXIT: $?" >> /tmp/d.md
          echo '```' >> /tmp/d.md
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" --title "Editorial validation debug $(date -u +%Y-%m-%dT%H:%M:%SZ)" --body-file /tmp/d.md
