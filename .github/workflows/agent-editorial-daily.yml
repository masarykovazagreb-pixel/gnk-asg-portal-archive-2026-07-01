name: AGENTI — pisac i AI kontrola pregleda

# Svakodnevni pregled aktualnih tema: pisac agent sastavlja HR i EN preglede iz
# javnih izvora (apps/region/data, sa atribucijom i linkom na izvornik), a AI
# kontrolni agent (AGENT-KONTROLA-001) odobrava ili odbija svaku objavu.
# Čovjek ne odobrava objave. Odobreni pregledi se generiraju i provjeravaju (HR i EN stranice, popisi,
# sitemap) i spremaju kao artefakt. Ovaj workflow NE piše na main (contents: read):
# novi direct-main tok nije dopušten registrom vlasništva. Kill switch
# (ops/agent-editorial-kill-switch.json) zaustavlja pisca, kontrolu i objavu.
# Vidi apps/agents/lib/policy-v1.mjs.
#
# Ručno: Actions → "AGENTI — pisac i AI kontrola pregleda" → Run workflow.

on:
  schedule:
    # 05:52 UTC = 07:52 Zagreb: nakon jutarnjeg osvježavanja izvora, prije dnevnog izdanja.
    - cron: '52 5 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'apps/agents/**'
      - 'scripts/validate-agent-editorial-queue-v1.mjs'
      - 'scripts/publish-agent-reviews-v1.mjs'
      - 'tests/test-agent-editorial-pipeline-v1.mjs'
      - 'tests/test-agent-publish-v1.mjs'
      - 'tests/test-agent-review-packet-v1.mjs'
      - '.github/workflows/agent-editorial-daily.yml'

permissions:
  contents: read

concurrency:
  group: agent-editorial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pregled:
    name: Pisac i AI kontrola
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # A fresh run must not re-process old, checked-in queues.
      AGENT_OUT: ${{ github.workspace }}/artifacts/agent-editorial-run
      AGENT_PREVIEW_PORTAL: ${{ github.workspace }}/artifacts/agent-editorial-preview
    steps:
      - name: Dohvati granu
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Testovi agenata
        run: |
          node tests/test-agent-editorial-pipeline-v1.mjs
          node tests/test-agent-publish-v1.mjs
          node --test tests/test-agent-review-packet-v1.mjs

      - name: Prekidač uredničkog tijeka
        id: editorial_switch
        run: |
          node --input-type=module -e 'import {killSwitchState} from "./apps/agents/lib/policy-v1.mjs"; import {appendFileSync} from "node:fs"; const s=killSwitchState(); appendFileSync(process.env.GITHUB_OUTPUT, `enabled=${s.enabled ? "true" : "false"}\n`); console.log(s.enabled ? "Urednički tijek omogućen" : "Urednički tijek zaustavljen: " + s.reason);'

      - name: Pisac — sastavi preglede iz svježih izvora
        if: ${{ steps.editorial_switch.outputs.enabled == 'true' }}
        run: node apps/agents/writer-agent-v1.mjs

      - name: Newsroom Scout — izdvoji istraživačke teme iz postojećih izdanja
        if: ${{ steps.editorial_switch.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/newsroom/triage-v1.mjs --out "$AGENT_OUT/research-leads.json"
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync(process.env.AGENT_OUT+"/research-leads.json"));if(d.publication_enabled!==false||d.totals.publishable!==0)process.exit(1);console.log("Istraživačke teme:",d.totals.research_leads,"; automatski objavljeno: 0")'

      - name: AI kontrola — odobri ili odbij svaku objavu
        if: ${{ steps.editorial_switch.outputs.enabled == 'true' }}
        run: node apps/agents/control-agent-v1.mjs

      - name: Validiraj red objava
        if: ${{ steps.editorial_switch.outputs.enabled == 'true' }}
        run: node scripts/validate-agent-editorial-queue-v1.mjs

      - name: Pripremi paket za ljudski urednički pregled
        if: ${{ steps.editorial_switch.outputs.enabled == 'true' }}
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: node apps/agents/operations/review-packet-v1.mjs --queue-dir "$AGENT_OUT" --sha "$SOURCE_SHA" > "$AGENT_OUT/review-packet.json"

      - name: Izradi statički pregled za artefakt (ne deploy)
        if: ${{ steps.editorial_switch.outputs.enabled == 'true' }}
        run: node scripts/publish-agent-reviews-v1.mjs

      - name: Spremi red i odluke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-editorial-${{ github.run_id }}
          path: |
            artifacts/agent-editorial-run/
            artifacts/agent-editorial-preview/
          if-no-files-found: warn
          retention-days: 30
