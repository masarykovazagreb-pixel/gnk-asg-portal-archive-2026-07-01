name: One-Time Verify Production V4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-verify-production-v4.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: one-time-verify-production-v4
  cancel-in-progress: false

jobs:
  verify:
    if: vars.GNK_ASG_RELEASE_FENCE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Wait for exact-SHA deploy and verify production
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 4ef7a4246848358df0f530a3430e1ad8be44040e
        shell: bash
        run: |
          set -euo pipefail
          out=artifacts/production-verification-v4
          mkdir -p "$out"
          run_json='{}'
          for attempt in $(seq 1 45); do
            run_json=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-admin-auth-v6.yml/runs?event=workflow_dispatch&per_page=100" | jq -c --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha==$sha)] | sort_by(.created_at) | reverse | .[0] // {}')
            status=$(jq -r '.status // "not_found"' <<<"$run_json")
            if [ "$status" = completed ]; then break; fi
            sleep 20
          done
          run_id=$(jq -r '.id // empty' <<<"$run_json")
          status=$(jq -r '.status // "not_found"' <<<"$run_json")
          conclusion=$(jq -r '.conclusion // "pending"' <<<"$run_json")
          html_url=$(jq -r '.html_url // ""' <<<"$run_json")

          cache="${TARGET_SHA}-$(date +%s)"
          check_html(){
            local name="$1" url="$2" marker="$3"
            local headers="$out/${name}.headers" body="$out/${name}.body"
            local code location marker_ok=false
            code=$(curl --silent --show-error --dump-header "$headers" --output "$body" --write-out '%{http_code}' "${url}?verify=${cache}" || true)
            location=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/\r$/,"",$0);print substr($0,11)}' "$headers" | tail -1)
            if grep -Fqi -- "$marker" "$body" "$headers"; then marker_ok=true; fi
            jq -n --arg name "$name" --arg url "$url" --arg code "$code" --arg location "$location" --arg marker "$marker" --argjson markerOk "$marker_ok" '{name:$name,url:$url,http:($code|tonumber? // 0),location:($location|select(length>0)//null),marker:$marker,markerOk:$markerOk}'
          }

          home=$(check_html home 'https://gnk-asg.hr/' 'index-editorial-order-v1.js?v=20260715-editorial-v6-latest-first')
          objave=$(check_html objave 'https://gnk-asg.hr/objave/' 'Kapitalna disciplina u razdoblju geopolitičkih i energetskih šokova')
          komentari=$(check_html komentari 'https://gnk-asg.hr/komentari/' 'AI ne smije pisati konačnu odluku')
          contact_page=$(check_html contact-page 'https://gnk-asg.hr/contact/' 'id="contactForm"')
          mail_asset=$(check_html mail-studio-asset 'https://gnk-asg.hr/assets/mail-studio-ui-v28.js' 'min-height:520px')

          news_headers="$out/news.headers"; news_body="$out/news.body"
          news_code=$(curl --silent --show-error --dump-header "$news_headers" --output "$news_body" --write-out '%{http_code}' "https://gnk-asg.hr/data/news.json?verify=${cache}" || true)
          news_latest=$(jq -r 'if type=="array" then .[0].published_at // .[0].publishedAt // "" else (.items[0].published_at // .items[0].publishedAt // "") end' "$news_body" 2>/dev/null || true)
          news_ok=false; [[ "$news_latest" == 2026-07-15* ]] && news_ok=true
          news=$(jq -n --arg code "$news_code" --arg latest "$news_latest" --argjson markerOk "$news_ok" '{name:"news",url:"https://gnk-asg.hr/data/news.json",http:($code|tonumber? // 0),latest:$latest,markerOk:$markerOk}')

          contact_headers="$out/contact-readiness.headers"; contact_body="$out/contact-readiness.body"
          contact_code=$(curl --silent --show-error --dump-header "$contact_headers" --output "$contact_body" --write-out '%{http_code}' "https://gnk-asg.hr/api/contact-submit?verify=${cache}" || true)
          contact_ok=$(jq '(.ok==true and .ready==true and .storage==true and .mail==true and .transport=="cloudflare-email-binding")' "$contact_body" 2>/dev/null || echo false)
          contact=$(jq -n --arg code "$contact_code" --argjson markerOk "$contact_ok" --slurpfile body "$contact_body" '{name:"contact-readiness",url:"https://gnk-asg.hr/api/contact-submit",http:($code|tonumber? // 0),markerOk:$markerOk,response:($body[0]//null)}')

          checks=$(jq -s '.' < <(printf '%s\n' "$home" "$news" "$objave" "$komentari" "$contact_page" "$contact" "$mail_asset"))
          checks_ok=$(jq 'all(.[]; .http==200 and .markerOk==true and ((.location // "")==""))' <<<"$checks")
          ok=false
          if [ "$status" = completed ] && [ "$conclusion" = success ] && [ "$checks_ok" = true ]; then ok=true; fi

          jq -n --arg checkedAt "$(date -u +%FT%TZ)" --arg targetSha "$TARGET_SHA" --arg runId "$run_id" --arg status "$status" --arg conclusion "$conclusion" --arg htmlUrl "$html_url" --argjson checks "$checks" --argjson ok "$ok" '{checkedAt:$checkedAt,targetSha:$targetSha,deploy:{runId:$runId,status:$status,conclusion:$conclusion,htmlUrl:$htmlUrl},checks:$checks,ok:$ok}' > "$out/status.json"
          cat "$out/status.json"

      - name: Record production verification
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/production-verification-v4
          git commit -m 'ci: record production verification v4' || exit 0
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            echo "Push odbijen (pokusaj $attempt) - main se pomaknuo, radim fetch+rebase."
            git fetch origin main
            git rebase origin/main || { echo "Rebase konflikt."; exit 1; }
            sleep $((attempt * 5))
            if [ "$attempt" = "5" ]; then echo "Push nije uspio nakon 5 pokusaja."; exit 1; fi
          done
