name: Weather Refresh (Zagreb)

# Osvježava /data/weather-zagreb.json četiri puta dnevno preko Open-Meteo (besplatan,
# bez API ključa, CC BY 4.0 s atribucijom u UI-u). Koristi isti obrazac kao
# market.js: server-side fetch + cache, klijent čita statični JSON s
# poštenim STALE/UNAVAILABLE stanjima ako izvor ne odgovori.

on:
  workflow_dispatch:
  schedule:
    - cron: '5 2,8,14,20 * * *'   # four times daily; Control Plane V2

permissions:
  contents: write

concurrency:
  group: gnk-asg-main-mutation
  cancel-in-progress: false

jobs:
  refresh:
    if: vars.GNK_ASG_RELEASE_FENCE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch Zagreb weather (Open-Meteo)
        run: |
          node scripts/weather-refresh-v1.mjs
          node scripts/freshness-status-v2.mjs
      - name: Commit if changed
        shell: bash
        run: |
          set -euo pipefail
          expected_base="$(git rev-parse HEAD)"
          git config user.name "gnk-weather-bot"
          git config user.email "actions@github.com"
          git add apps/portal/data/weather-zagreb.json apps/portal/data/freshness-status.json
          if git diff --cached --quiet; then
            echo "Nema promjena."
            exit 0
          fi
          git commit -m "Weather: refresh Zagreb data"

          # Exact-SHA writer fence: weather output belongs to the main snapshot
          # it was generated from. Never rebase generated state onto newer main.
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          if [ "$current_main" != "$expected_base" ]; then
            echo "Main moved during weather refresh: expected $expected_base, found $current_main. Deferring without rebase/push."
            exit 75
          fi

          # Normal non-force push is the final compare-and-swap guard.
          git push origin HEAD:main
