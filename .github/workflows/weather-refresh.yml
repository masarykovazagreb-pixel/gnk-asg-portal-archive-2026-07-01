name: Weather Refresh (Zagreb)

# Osvježava /data/weather-zagreb.json četiri puta dnevno preko Open-Meteo (besplatan,
# bez API ključa, CC BY 4.0 s atribucijom u UI-u). Koristi isti obrazac kao
# market.js: server-side fetch + cache, klijent čita statični JSON s
# poštenim STALE/UNAVAILABLE stanjima ako izvor ne odgovori.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/weather-refresh.yml'
      - 'scripts/weather-refresh-v1.mjs'
      - 'scripts/freshness-status-v2.mjs'
      - 'ops/automation-kill-switches.json'
  schedule:
    - cron: '5 2,8,14,20 * * *'   # four times daily; Control Plane V2

permissions:
  contents: write
  actions: write

concurrency:
  # All production main writers share one serialization group.
  # Existing non-force push and bounded retry remain the final safety fences.
  group: gnk-asg-main-mutation
  cancel-in-progress: false

jobs:
  refresh:
    if: vars.GNK_ASG_RELEASE_FENCE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Fetch only the selected branch's recent history, not every branch/tag.
          # Updates still use a fresh origin/main CAS/rebase before non-force push.
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch Zagreb weather (Open-Meteo)
        run: |
          node scripts/weather-refresh-v1.mjs
          node scripts/freshness-status-v2.mjs
      - name: Commit freshly generated weather with bounded main race recovery
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gnk-weather-bot"
          git config user.email "actions@github.com"

          # Normal non-force push remains the final concurrency fence.
          # If main advances, discard only THIS RUN's unpushed generated
          # state and recompute weather/freshness from the new main snapshot.
          for attempt in 1 2 3; do
            git fetch origin main
            current_main="$(git rev-parse origin/main)"
            if [ "$(git rev-parse HEAD)" != "$current_main" ]; then
              echo "::notice::Weather run rebasing GENERATED state safely against new main (attempt $attempt)."
              git reset --hard "$current_main"
              node scripts/weather-refresh-v1.mjs
              node scripts/freshness-status-v2.mjs
            fi

            git add apps/portal/data/weather-zagreb.json apps/portal/data/freshness-status.json
            if git diff --cached --quiet; then
              echo "No new weather output; no commit required."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "Weather: refresh Zagreb data"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::Main advanced during non-force weather push attempt $attempt; recomputing against latest main."
            # The next iteration fetches new main, discards only our
            # unpushed weather commit, then fetches fresh live data.
          done
          echo "::error::Weather data generated but not published: main changed during three safe attempts."
          exit 75

      - name: Dispatch exact-SHA production deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          gh workflow run deploy-admin-auth-v6.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f confirm_production_deploy=DEPLOY_ADMIN_AUTH_V6 \
            -f approved_sha="$APPROVED_SHA"
