name: AKTUAL MEDIA - Global Multilingual Distribution

# No scheduled publication. Existing 4/4 blog-mirror workflows are untouched.
# Live writing requires manual workflow_dispatch on main, explicit confirmation,
# a repository distribution allow variable, account credentials, verified
# original canonical, and durable dedupe receipts on a separate state branch.

on:
  pull_request:
    paths:
      - 'ops/aktual-global-distribution-v1.json'
      - 'scripts/aktual-global-distribution-v1.mjs'
      - 'scripts/distribution-safety-v1.mjs'
      - 'scripts/restore-distribution-state-v1.sh'
      - 'tests/test-distribution-reliability-v1.mjs'
      - 'tests/test-aktual-global-distribution-v1.mjs'
      - '.github/workflows/aktual-global-distribution.yml'
  workflow_dispatch:
    inputs:
      article_path:
        description: 'Original GNK ASG / AKTUAL MEDIA owned editorial article route'
        type: string
        required: true
        default: '/gnk-aktual/kolumne/tisina-nakon-pitanja/'
      platforms:
        description: 'bluesky,mastodon,pixelfed,wordpress,substack,medium'
        type: string
        required: true
        default: 'pixelfed'
      languages:
        description: '1-3 localized introductions (hr,en,de,fr,es,pt,...)'
        type: string
        required: true
        default: 'en'
      confirm_live:
        description: 'I explicitly approve external publication for THIS run'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  validation:
    name: Offline rights / canonical / language / no-publish gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check script syntax
        run: node --check scripts/aktual-global-distribution-v1.mjs
      - name: Test preview, roles, 15 languages, live refusal and dedupe
        run: node tests/test-aktual-global-distribution-v1.mjs

  distribute:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      (inputs.confirm_live != true || vars.GNK_ASG_EXTERNAL_DISTRIBUTION == 'true')
    needs: validation
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: aktual-media-global-writer
      cancel-in-progress: false
    env:
      ARTICLE_PATH: ${{ inputs.article_path }}
      PLATFORMS: ${{ inputs.platforms }}
      LANGUAGES: ${{ inputs.languages }}
      APPROVE_LIVE: ${{ inputs.confirm_live }}
      GNK_ASG_EXTERNAL_DISTRIBUTION: ${{ vars.GNK_ASG_EXTERNAL_DISTRIBUTION }}
      BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
      BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
      MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
      MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
      PIXELFED_INSTANCE: ${{ secrets.PIXELFED_INSTANCE }}
      PIXELFED_TOKEN: ${{ secrets.PIXELFED_TOKEN }}
      WORDPRESS_SITE_ID: ${{ secrets.WORDPRESS_SITE_ID }}
      WORDPRESS_ACCESS_TOKEN: ${{ secrets.WORDPRESS_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare candidate and confirm rights without publishing
        run: |
          set -euo pipefail
          node scripts/aktual-global-distribution-v1.mjs \
            --check --article "$ARTICLE_PATH" \
            --platforms "$PLATFORMS" --languages "$LANGUAGES"
          node scripts/aktual-global-distribution-v1.mjs \
            --article "$ARTICLE_PATH" \
            --platforms "$PLATFORMS" --languages "$LANGUAGES"
      - name: Preserve preview for non-live review
        if: inputs.confirm_live != true
        uses: actions/upload-artifact@v4
        with:
          name: aktual-global-preview-${{ github.run_id }}
          path: artifacts/distribution/aktual-global-preview.json
          retention-days: 14
      - name: Recover durable receipts without mutating production main
        id: receipts
        if: inputs.confirm_live == true
        shell: bash
        run: |
          set -euo pipefail
          test "$GNK_ASG_EXTERNAL_DISTRIBUTION" = "true"
          git config user.name "aktual-global-publisher"
          git config user.email "actions@github.com"
          bash scripts/restore-distribution-state-v1.sh automation/aktual-global-distribution-state \
            apps/portal/data/aktual-global-distribution/state.json "$GITHUB_SHA"
      - name: Publish only expressly authorized channels and record provider URLs
        if: inputs.confirm_live == true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/aktual-global-distribution-v1.mjs --live --confirm-live \
            --article "$ARTICLE_PATH" --platforms "$PLATFORMS" \
            --languages "$LANGUAGES"
      - name: Preserve published receipts on isolated branch
        if: inputs.confirm_live == true && steps.receipts.outputs.ready == 'true' && (success() || failure())
        shell: bash
        env:
          OLD_REMOTE_SHA: ${{ steps.receipts.outputs.remote_sha }}
        run: |
          set -euo pipefail
          if [ -f apps/portal/data/aktual-global-distribution/state.json ]; then
            git add apps/portal/data/aktual-global-distribution/state.json
            if ! git diff --cached --quiet; then
              git commit -m "distribution: persist verified external URLs for run ${{ github.run_id }}"
              git push --force-with-lease="refs/heads/automation/aktual-global-distribution-state:$OLD_REMOTE_SHA" origin HEAD:refs/heads/automation/aktual-global-distribution-state
            fi
          fi
