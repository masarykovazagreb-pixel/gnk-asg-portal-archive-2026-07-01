name: Deploy Admin Auth V6

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Type DEPLOY_ADMIN_AUTH_V6 to run production deploy"
        required: true
        type: string
      approved_sha:
        description: "Full 40-character main commit SHA approved for production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gnk-asg-production-deploy
  cancel-in-progress: false

jobs:
  authorize-production:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_production_deploy == 'DEPLOY_ADMIN_AUTH_V6'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0
      - name: Verify main ref, exact reviewed SHA and executive approval
        env:
          DEPLOY_APPROVAL: ${{ inputs.confirm_production_deploy }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1" >&2; exit 1; }
          require_eq() {
            local actual="$1" expected="$2" label="$3"
            [ "$actual" = "$expected" ] || fail "$label mismatch: expected '$expected', got '$actual'"
          }
          require_nonempty() {
            local value="$1" label="$2"
            [ -n "$value" ] || fail "$label must not be empty"
          }

          require_eq "$GITHUB_EVENT_NAME" 'workflow_dispatch' 'GitHub event'
          require_eq "$GITHUB_REF_TYPE" 'branch' 'Git ref type'
          require_eq "$GITHUB_REF_NAME" 'main' 'Git ref name'
          require_eq "$GITHUB_REF" 'refs/heads/main' 'Full Git ref'
          require_eq "$DEPLOY_APPROVAL" 'DEPLOY_ADMIN_AUTH_V6' 'Executive approval phrase'
          require_nonempty "$APPROVED_SHA" 'Approved SHA'
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "Approved SHA is not a full 40-character lowercase commit SHA: '$APPROVED_SHA'"
          require_eq "$GITHUB_SHA" "$APPROVED_SHA" 'Workflow SHA'
          require_eq "$(git rev-parse HEAD)" "$APPROVED_SHA" 'Checked-out HEAD'
          git fetch origin main --no-tags
          require_eq "$(git rev-parse origin/main)" "$APPROVED_SHA" 'origin/main SHA'
          [ -z "$(git status --porcelain)" ] || fail 'Authorized checkout is not clean'
          echo "Exact production source authorized: $APPROVED_SHA."

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate current V38 release package
        shell: bash
        run: |
          set -euo pipefail
          test -f workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          test -f workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js
          test -f workers/gnk-asg-direct-operator/src/index-unified-auth-v21.js
          test -f apps/portal/assets/index-editorial-order-v6.js
          test -f apps/portal/assets/index-editorial-order-v1.js
          test -f apps/portal/assets/editorial-latest-index-v1.js
          test -f apps/portal/assets/contact-form-v2.js
          test -f apps/portal/assets/mail-studio-ui-v28.js
          test -f apps/portal/data/news.json
          test -f apps/portal/objave/index.html
          test -f apps/portal/komentari/index.html
          test -f scripts/test-news-share-routing-v1.mjs
          test -f scripts/verify-production-release-v38.sh
          test -f workers/gnk-asg-direct-operator/wrangler.mail-proxy-no-routes.toml

          node --check workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          node --check workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js
          node --check workers/gnk-asg-direct-operator/src/index-unified-auth-v21.js
          node --check apps/portal/assets/index-editorial-order-v6.js
          node --check apps/portal/assets/index-editorial-order-v1.js
          node --check apps/portal/assets/editorial-latest-index-v1.js
          node --check apps/portal/assets/contact-form-v2.js
          node --check apps/portal/assets/mail-studio-ui-v28.js
          bash -n scripts/verify-production-release-v38.sh
          node scripts/test-news-share-routing-v1.mjs

          grep -Fq 'main = "src/index-unified-auth-v23.js"' workers/gnk-asg-direct-operator/wrangler.mail-proxy-no-routes.toml
          grep -Fq 'GNK_ASG_UNIFIED_AUTH_V38_RELEASE_PROOF_NEWS_SOURCE_LINKS' workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          grep -Fq "export const ENTRYPOINT='src/index-unified-auth-v23.js'" workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          grep -Fq "headers.set('x-gnk-deploy-revision',revision)" workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          grep -Fq 'current-static-asset-20260715' workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          grep -Fq 'source-redirect' workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          grep -Fq '20260715-source-links-v2' workers/gnk-asg-direct-operator/src/index-unified-auth-v21.js
          grep -Fq 'item.sourceUrl||item.url||item.href||item.share_url' apps/portal/assets/index-editorial-order-v6.js
          grep -Fq 'index-editorial-order-v1.js?v=20260715-editorial-v6-latest-first' workers/gnk-asg-direct-operator/src/index-unified-auth-v19.js
          grep -Fq 'Kapitalna disciplina u razdoblju geopolitičkih i energetskih šokova' apps/portal/objave/index.html
          grep -Fq 'AI ne smije pisati konačnu odluku' apps/portal/komentari/index.html
          grep -Fq 'GNK_ASG_MAIL_IDENTITY_AUTOREPLY_V9_20260717_UNTRUSTED_SUBJECT_DATA' workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js
          grep -Fq 'aiMessageText' workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js
          grep -Fq 'loadEmailLogo' workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js
          grep -Fq 'signature.html' workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js
          grep -Fq 'min-height:520px' apps/portal/assets/mail-studio-ui-v28.js

  deploy-production:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_production_deploy == 'DEPLOY_ADMIN_AUTH_V6'
    needs: [authorize-production]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0
      - name: Reconfirm exact authorized SHA immediately before production deployment
        env:
          DEPLOY_APPROVAL: ${{ inputs.confirm_production_deploy }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1" >&2; exit 1; }
          require_eq() {
            local actual="$1" expected="$2" label="$3"
            [ "$actual" = "$expected" ] || fail "$label mismatch: expected '$expected', got '$actual'"
          }
          require_nonempty() {
            local value="$1" label="$2"
            [ -n "$value" ] || fail "$label must not be empty"
          }

          require_eq "$GITHUB_EVENT_NAME" 'workflow_dispatch' 'GitHub event'
          require_eq "$GITHUB_REF_TYPE" 'branch' 'Git ref type'
          require_eq "$GITHUB_REF_NAME" 'main' 'Git ref name'
          require_eq "$GITHUB_REF" 'refs/heads/main' 'Full Git ref'
          require_eq "$DEPLOY_APPROVAL" 'DEPLOY_ADMIN_AUTH_V6' 'Executive approval phrase'
          require_nonempty "$APPROVED_SHA" 'Approved SHA'
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "Approved SHA is not a full 40-character lowercase commit SHA: '$APPROVED_SHA'"
          require_eq "$GITHUB_SHA" "$APPROVED_SHA" 'Workflow SHA'
          require_eq "$(git rev-parse HEAD)" "$APPROVED_SHA" 'Checked-out HEAD'
          git fetch origin main --no-tags
          require_eq "$(git rev-parse origin/main)" "$APPROVED_SHA" 'origin/main SHA'
          [ -z "$(git status --porcelain)" ] || fail 'Deployment checkout is not clean'
          echo "Authorized SHA and approval reconfirmed immediately before production deployment."
          echo "DEPLOY_SOURCE_SHA=$APPROVED_SHA" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preflight Newsroom route ownership
        run: scripts/check-newsroom-route-readiness.sh deploy-preflight

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-preflight-${{ inputs.approved_sha }}
          path: deploy-preflight
          if-no-files-found: warn
          retention-days: 14

      - name: Resolve token hash
        id: auth
        env:
          TOKEN: ${{ secrets.GNK_ASG_OPERATOR_TOKEN }}
          TOKEN_FALLBACK: ${{ secrets.OPERATOR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1" >&2; exit 1; }
          value="$TOKEN"
          [ -n "$value" ] || value="$TOKEN_FALLBACK"
          [ -n "$value" ] || fail 'Neither GNK_ASG_OPERATOR_TOKEN nor OPERATOR_TOKEN is configured'
          hash=$(printf '%s' "$value" | sha256sum | awk '{print $1}')
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Install locked direct operator dependencies without lifecycle scripts
        working-directory: workers/gnk-asg-direct-operator
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Reconfirm tracked release integrity before Cloudflare credentials
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1" >&2; exit 1; }
          [ "$(git rev-parse HEAD)" = "$APPROVED_SHA" ] || fail 'Checked-out HEAD changed after authorization'
          git diff --quiet || fail 'Tracked release files changed after authorization'
          git diff --cached --quiet || fail 'Staged release files changed after authorization'
          echo "Tracked release integrity reconfirmed before Cloudflare credentials are exposed."

      - name: Deploy contact session bridge
        working-directory: workers/gnk-asg-contact-api-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy src/index-session-cookie-v1.js --config wrangler.no-routes.toml --name gnk-asg-contact-api --var "OPERATOR_TOKEN_SHA256:${{ steps.auth.outputs.hash }}"

      - name: Deploy direct operator and shared assets
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.mail-proxy-no-routes.toml --name gnk-asg-direct-operator --var "OPERATOR_TOKEN_SHA256:${{ steps.auth.outputs.hash }}" --var "DEPLOY_REVISION:${DEPLOY_SOURCE_SHA}"

      - name: Deploy operator center
        working-directory: workers/gnk-asg-operator-center
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-operator-center

      - name: Verify exact production release
        shell: bash
        run: bash scripts/verify-production-release-v38.sh deploy-verification

      - name: Upload production verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-verification-${{ inputs.approved_sha }}
          path: deploy-verification
          if-no-files-found: warn
          retention-days: 14
