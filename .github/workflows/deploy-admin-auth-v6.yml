name: Deploy Admin Auth V6

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Type DEPLOY_ADMIN_AUTH_V6 to run production deploy"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_production_deploy == 'DEPLOY_ADMIN_AUTH_V6'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate release source
        run: |
          set -euo pipefail
          node --check apps/portal/assets/public-compact-menu-v1.js
          node --check apps/portal/assets/release-completion-v1.js
          node --check apps/portal/assets/newsroom-live-v1.js
          node --check apps/portal/assets/public-market-live-v1.js
          node --check workers/gnk-asg-direct-operator/src/news-auto-publication-v1.js
          node --check workers/gnk-asg-direct-operator/src/email-logo-endpoint-v1.js
          node --check workers/gnk-asg-direct-operator/src/email-brand-signature-v1.js
          node --check workers/gnk-asg-direct-operator/src/email-brand-mime-v1.js
          node --check workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js
          node --check workers/gnk-asg-direct-operator/src/index-unified-auth-v17.js
          node --check workers/gnk-asg-direct-operator/src/index-unified-auth-v18.js
          test -s apps/portal/index.html
          test -s apps/portal/en/index.html
          test -s apps/portal/newsroom/index.html
          test -s apps/portal/en/newsroom/index.html
          test -s apps/portal/objave/index.html
          test -s apps/portal/komentari/index.html
          test -s apps/portal/trzista/index.html
          test -s apps/portal/the-code/index.html
          test -s apps/portal/assets/logo-gnk-asg-gold.svg
          test -s apps/portal/assets/logo-gnk-dinamo-gold.svg
          test -s apps/portal/sitemap-index.xml
          test -s apps/portal/sitemap.xml
          test -s apps/portal/editorial-sitemap.xml
          test -s apps/portal/visual-sitemap.xml
          test -s apps/portal/robots.txt
          grep -q "GNK_RELEASE_COMPLETION_V6" apps/portal/assets/release-completion-v1.js
          grep -q "renderNews" apps/portal/assets/release-completion-v1.js
          grep -q "renderMarkets" apps/portal/assets/release-completion-v1.js
          grep -q "staticEditorial" apps/portal/assets/release-completion-v1.js
          grep -q "logo-gnk-dinamo-gold.svg" apps/portal/assets/release-completion-v1.js
          grep -q "the-code-experience-loop-v1.html" apps/portal/assets/release-completion-v1.js
          grep -q "scheduledEnabled" workers/gnk-asg-direct-operator/src/news-auto-publication-v1.js
          grep -q "cid-inline" workers/gnk-asg-direct-operator/src/index-unified-auth-v18.js
          grep -q "renderBrandSignatureHtml" workers/gnk-asg-direct-operator/src/index-unified-auth-v18.js
          grep -q "https://gnk-asg.hr/sitemap.xml" apps/portal/sitemap-index.xml
          grep -q "https://gnk-asg.hr/editorial-sitemap.xml" apps/portal/sitemap-index.xml
          grep -q "Sitemap: https://gnk-asg.hr/sitemap-index.xml" apps/portal/robots.txt

      - name: Upload private Worker source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: worker-source-snapshot
          path: |
            workers
            .github/workflows
          if-no-files-found: error
          retention-days: 3

      - name: Resolve token hash
        id: auth
        env:
          TOKEN: ${{ secrets.GNK_ASG_OPERATOR_TOKEN }}
          TOKEN_FALLBACK: ${{ secrets.OPERATOR_TOKEN }}
        run: |
          value="$TOKEN"
          [ -n "$value" ] || value="$TOKEN_FALLBACK"
          test -n "$value"
          hash=$(printf '%s' "$value" | sha256sum | awk '{print $1}')
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Install direct operator dependencies
        working-directory: workers/gnk-asg-direct-operator
        run: npm install --no-audit --no-fund

      - name: Deploy contact session bridge
        working-directory: workers/gnk-asg-contact-api-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy src/index-session-cookie-v1.js --config wrangler.no-routes.toml --name gnk-asg-contact-api --var "OPERATOR_TOKEN_SHA256:${{ steps.auth.outputs.hash }}"

      - name: Deploy direct operator and shared assets
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.mail-proxy-no-routes.toml --name gnk-asg-direct-operator --var "OPERATOR_TOKEN_SHA256:${{ steps.auth.outputs.hash }}"

      - name: Deploy operator center
        working-directory: workers/gnk-asg-operator-center
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-operator-center

      - name: Verify production release
        run: |
          set -euo pipefail
          sleep 12
          cache_bust=$(date +%s)

          fetch_required() {
            local url="$1" output="$2" attempt status
            for attempt in 1 2 3 4 5; do
              status=$(curl --silent --show-error --location --output "$output" --write-out '%{http_code}' "$url" || true)
              echo "VERIFY ${url} -> HTTP ${status} (attempt ${attempt}/5)"
              [ "$status" = "200" ] && return 0
              sleep $((attempt * 4))
            done
            echo "Verification failed for ${url}; final HTTP status ${status}" >&2
            return 1
          }

          fetch_required "https://gnk-asg.hr/assets/public-compact-menu-v1.js?deploy-admin-v6=${cache_bust}" menu.js
          fetch_required "https://gnk-asg.hr/assets/release-completion-v1.js?deploy-admin-v6=${cache_bust}" release.js
          fetch_required "https://gnk-asg.hr/assets/logo-gnk-asg-gold.svg?deploy-admin-v6=${cache_bust}" asg-logo.svg
          fetch_required "https://gnk-asg.hr/assets/logo-gnk-dinamo-gold.svg?deploy-admin-v6=${cache_bust}" dinamo-logo.svg
          fetch_required "https://gnk-asg.hr/?deploy-admin-v6=${cache_bust}" home.html
          fetch_required "https://gnk-asg.hr/en/?deploy-admin-v6=${cache_bust}" home-en.html
          fetch_required "https://gnk-asg.hr/newsroom/index.html?deploy-admin-v6=${cache_bust}" newsroom.html
          fetch_required "https://gnk-asg.hr/en/newsroom/index.html?deploy-admin-v6=${cache_bust}" newsroom-en.html
          fetch_required "https://gnk-asg.hr/objave/index.html?deploy-admin-v6=${cache_bust}" objave.html
          fetch_required "https://gnk-asg.hr/komentari/index.html?deploy-admin-v6=${cache_bust}" komentari.html
          fetch_required "https://gnk-asg.hr/trzista/index.html?deploy-admin-v6=${cache_bust}" trzista.html
          fetch_required "https://gnk-asg.hr/the-code/index.html?deploy-admin-v6=${cache_bust}" the-code.html
          fetch_required "https://gnk-asg.hr/api/public-news?limit=1&deploy-admin-v6=${cache_bust}" news.json
          fetch_required "https://gnk-asg.hr/sitemap-index.xml?deploy-admin-v6=${cache_bust}" sitemap-index.xml
          fetch_required "https://gnk-asg.hr/sitemap.xml?deploy-admin-v6=${cache_bust}" sitemap.xml
          fetch_required "https://gnk-asg.hr/editorial-sitemap.xml?deploy-admin-v6=${cache_bust}" editorial-sitemap.xml
          fetch_required "https://gnk-asg.hr/robots.txt?deploy-admin-v6=${cache_bust}" robots.txt

          grep -q "gnk-compact-menu" menu.js
          grep -q "GNK_RELEASE_COMPLETION_V6" release.js
          grep -q "renderNews" release.js
          grep -q "renderMarkets" release.js
          grep -q "logo-gnk-dinamo-gold.svg" release.js
          grep -q "GNK ASG" asg-logo.svg
          grep -q "GNK DINAMO" dinamo-logo.svg
          grep -q "release-completion-v1.js" home.html
          grep -q "release-completion-v1.js" home-en.html
          ! grep -q "index-live-hub-v1.js" home.html
          ! grep -q "index-live-hub-v1.js" home-en.html
          [ "$(grep -o 'public-compact-menu-v1.js' home.html | wc -l)" -eq 1 ]
          [ "$(grep -o 'public-compact-menu-v1.js' home-en.html | wc -l)" -eq 1 ]
          grep -q "Newsroom" newsroom.html
          grep -q "Newsroom" newsroom-en.html
          grep -q "povjerenje-investitora-kroz-transparentnost" objave.html
          grep -q "odgovornost-se-ne-moze-automatizirati" komentari.html
          grep -q "Trži" trzista.html
          grep -q "THE CODE" the-code.html
          grep -q '"ok": true' news.json
          grep -q "https://gnk-asg.hr/editorial-sitemap.xml" sitemap-index.xml
          grep -q "https://gnk-asg.hr/newsroom/" sitemap.xml
          grep -q "https://gnk-asg.hr/komentari/" editorial-sitemap.xml
          grep -q "Sitemap: https://gnk-asg.hr/sitemap-index.xml" robots.txt

          mail_status=$(curl --silent --show-error --output mail.json --write-out '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "https://gnk-asg.hr/api/studio-message/send?deploy-admin-v6=${cache_bust}" || true)
          echo "VERIFY Mail Studio unauthenticated JSON gate -> HTTP ${mail_status}"
          case "$mail_status" in 400|401) ;; *) cat mail.json; exit 1;; esac
          grep -q '"error"' mail.json

          logo_status=$(curl --silent --show-error --output mail-logo.bin --write-out '%{http_code}' "https://gnk-asg.hr/assets/logo-gnk-asg-email.jpg?deploy-admin-v6=${cache_bust}" || true)
          echo "VERIFY mail logo asset -> HTTP ${logo_status}"
          [ "$logo_status" = "200" ]
          test -s mail-logo.bin
