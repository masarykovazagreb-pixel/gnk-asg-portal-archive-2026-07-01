name: Deploy Admin Auth V6

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-admin-auth-v6.yml"
      - "apps/portal/assets/backend-ui-shell.js"
      - "apps/portal/assets/backend-ui-shell.css"
      - "apps/portal/auto-editor/**"
      - "workers/gnk-asg-direct-operator/**"
      - "workers/gnk-asg-operator-center/**"
      - "workers/gnk-asg-contact-api-worker/src/index-session-cookie-v1.js"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate files
        run: |
          node --check apps/portal/assets/backend-ui-shell.js
          node --check workers/gnk-asg-direct-operator/src/index-mail-session-final-v1.js
          node --check workers/gnk-asg-operator-center/src/index.js
          node --check workers/gnk-asg-contact-api-worker/src/index-session-cookie-v1.js
      - name: Resolve token hash
        id: auth
        env:
          TOKEN: ${{ secrets.GNK_ASG_OPERATOR_TOKEN }}
          TOKEN_FALLBACK: ${{ secrets.OPERATOR_TOKEN }}
        run: |
          value="$TOKEN"
          [ -n "$value" ] || value="$TOKEN_FALLBACK"
          test -n "$value"
          hash=$(printf '%s' "$value" | sha256sum | awk '{print $1}')
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - name: Deploy contact session bridge
        working-directory: workers/gnk-asg-contact-api-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy src/index-session-cookie-v1.js --config wrangler.no-routes.toml --name gnk-asg-contact-api --var "OPERATOR_TOKEN_SHA256:${{ steps.auth.outputs.hash }}"
      - name: Deploy direct operator and shared assets
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.mail-proxy-no-routes.toml --name gnk-asg-direct-operator --var "OPERATOR_TOKEN_SHA256:${{ steps.auth.outputs.hash }}"
      - name: Deploy operator center
        working-directory: workers/gnk-asg-operator-center
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-operator-center
      - name: Diagnose Email Routing worker assignment
        id: email_routing
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -u
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json")
          zone_response=$(curl --silent --show-error "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=gnk-asg.hr")
          zone_id=$(printf '%s' "$zone_response" | jq -r '.result[0].id // empty')
          if [ -z "$zone_id" ]; then
            printf '%s' "$zone_response" | jq '{checkedAt:(now|todate),success,errors,status:"ZONE_LOOKUP_UNAVAILABLE"}' > email-routing-active.json
            cat email-routing-active.json
            exit 0
          fi
          rules=$(curl --silent --show-error "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/${zone_id}/email/routing/rules")
          printf '%s' "$rules" | jq '{checkedAt:(now|todate),success,errors,status:"RULES_READ",rules:[.result[]? | {id,name,enabled,priority,matchers:[.matchers[]? | {type,field,value}],actions:[.actions[]? | {type,value}]}]}' > email-routing-active.json
          cat email-routing-active.json
      - name: Upload sanitized Email Routing diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-routing-active
          path: email-routing-active.json
          if-no-files-found: warn
          retention-days: 3
      - name: Verify public assets
        run: |
          sleep 10
          curl --fail --silent --show-error https://gnk-asg.hr/assets/backend-ui-shell.js?admin-v6 | grep -q gnkAdminToken
          curl --fail --silent --show-error https://gnk-asg.hr/assets/backend-ui-shell.js?admin-v6 | grep -q gnkAdminLogout
          curl --fail --silent --show-error https://gnk-asg.hr/operator-dashboard/?admin-v6 | grep -q backend-ui-shell.js
