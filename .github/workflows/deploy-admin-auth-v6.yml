name: Deploy Admin Auth V6

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Type DEPLOY_ADMIN_AUTH_V6 to run production deploy"
        required: true
        type: string
      approved_sha:
        description: "Full 40-character main commit SHA approved for production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gnk-asg-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_production_deploy == 'DEPLOY_ADMIN_AUTH_V6'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate approval input
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "Approved production SHA: $APPROVED_SHA"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify exact approved release source
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          test "$actual" = "$APPROVED_SHA"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$APPROVED_SHA" origin/main
          test -z "$(git status --porcelain)"
          echo "DEPLOY_SOURCE_SHA=$actual" >> "$GITHUB_ENV"

      - name: Validate release source
        run: |
          set -euo pipefail
          bash -n scripts/verify-production-route.sh
          bash -n scripts/check-newsroom-route-readiness.sh
          for file in \
            scripts/audit-public-portal-v1.mjs \
            scripts/audit-worker-route-ownership.mjs \
            scripts/predeploy-release-v6.mjs \
            scripts/prepare-approved-deploy-v1.mjs \
            scripts/test-deploy-approval-guardrails.mjs \
            scripts/test-index-runtime-ownership.mjs \
            scripts/test-public-design-contract.mjs \
            scripts/test-data-fallback-contract.mjs \
            scripts/test-email-signature-contract.mjs \
            scripts/test-mail-transport-guardrails.mjs \
            scripts/test-email-mime-guardrails.mjs \
            scripts/test-autoreply-guardrails.mjs \
            scripts/test-autoreply-all-addresses.mjs \
            scripts/test-news-queue-guardrails.mjs \
            apps/portal/assets/public-compact-menu-v1.js \
            apps/portal/assets/public-design-runtime-v1.js \
            apps/portal/assets/release-completion-v1.js \
            apps/portal/assets/index-data-resilience-v1.js \
            apps/portal/assets/index-editorial-order-v1.js \
            apps/portal/assets/newsroom-live-v1.js \
            apps/portal/assets/public-market-live-v1.js \
            apps/portal/assets/market-centre-data.js \
            apps/portal/assets/market.js \
            workers/gnk-asg-direct-operator/src/news-auto-publication-v1.js \
            workers/gnk-asg-direct-operator/src/email-logo-endpoint-v1.js \
            workers/gnk-asg-direct-operator/src/email-brand-signature-v1.js \
            workers/gnk-asg-direct-operator/src/email-brand-mime-v1.js \
            workers/gnk-asg-direct-operator/src/email-brand-mime-safe-v2.js \
            workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js \
            workers/gnk-asg-direct-operator/src/mail-identity-autoreply-all-v1.js \
            workers/gnk-asg-direct-operator/src/mail-autoreply-profile-factory-v1.js \
            workers/gnk-asg-direct-operator/src/index-unified-auth-v17.js \
            workers/gnk-asg-direct-operator/src/index-unified-auth-v18.js \
            workers/gnk-asg-direct-operator/src/index-unified-auth-v19.js
          do
            node --check "$file"
          done
          node scripts/test-deploy-approval-guardrails.mjs
          node scripts/test-index-runtime-ownership.mjs
          node scripts/test-public-design-contract.mjs
          node scripts/test-email-signature-contract.mjs
          node scripts/test-mail-transport-guardrails.mjs
          node scripts/test-email-mime-guardrails.mjs
          node scripts/test-autoreply-guardrails.mjs
          node scripts/test-autoreply-all-addresses.mjs
          node scripts/test-news-queue-guardrails.mjs
          node scripts/audit-public-portal-v1.mjs
          node scripts/audit-worker-route-ownership.mjs
          node scripts/test-data-fallback-contract.mjs
          node scripts/predeploy-release-v6.mjs

      - name: Upload approved source and audit snapshot
        uses: actions/upload-artifact@v4
        with:
          name: approved-production-source-${{ inputs.approved_sha }}
          path: |
            workers
            .github/workflows/deploy-admin-auth-v6.yml
            scripts
            artifacts/public-portal-audit.json
            artifacts/worker-route-ownership.json
          if-no-files-found: error
          retention-days: 14

      - name: Preflight Newsroom route ownership
        run: scripts/check-newsroom-route-readiness.sh deploy-preflight

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-preflight-${{ inputs.approved_sha }}
          path: deploy-preflight
          if-no-files-found: warn
          retention-days: 14

      - name: Resolve token hash
        id: auth
        env:
          TOKEN: ${{ secrets.GNK_ASG_OPERATOR_TOKEN }}
          TOKEN_FALLBACK: ${{ secrets.OPERATOR_TOKEN }}
        run: |
          set -euo pipefail
          value="$TOKEN"
          [ -n "$value" ] || value="$TOKEN_FALLBACK"
          test -n "$value"
          hash=$(printf '%s' "$value" | sha256sum | awk '{print $1}')
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Install direct operator dependencies
        working-directory: workers/gnk-asg-direct-operator
        run: npm install --no-audit --no-fund

      - name: Deploy contact session bridge
        working-directory: workers/gnk-asg-contact-api-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy src/index-session-cookie-v1.js --config wrangler.no-routes.toml --name gnk-asg-contact-api --var "OPERATOR_TOKEN_SHA256:${{ steps.auth.outputs.hash }}"

      - name: Deploy direct operator and shared assets
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.mail-proxy-no-routes.toml --name gnk-asg-direct-operator --var "OPERATOR_TOKEN_SHA256:${{ steps.auth.outputs.hash }}" --var "DEPLOY_REVISION:${DEPLOY_SOURCE_SHA}"

      - name: Deploy operator center
        working-directory: workers/gnk-asg-operator-center
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-operator-center

      - name: Verify production release and route ownership
        run: |
          set -euo pipefail
          mkdir -p deploy-verification
          sleep 15
          cache_bust="${DEPLOY_SOURCE_SHA}-$(date +%s)"

          verify() {
            bash scripts/verify-production-route.sh "$1" "deploy-verification/$2" "${3:-}"
          }

          verify "https://gnk-asg.hr/assets/public-compact-menu-v1.js?deploy-admin-v6=${cache_bust}" menu.js "gnk-compact-menu"
          verify "https://gnk-asg.hr/assets/public-design-runtime-v1.js?deploy-admin-v6=${cache_bust}" public-design.js "__GNK_PUBLIC_DESIGN_RUNTIME_V1__"
          verify "https://gnk-asg.hr/assets/public-design-tokens-v1.css?deploy-admin-v6=${cache_bust}" public-design.css "--gnk-gold-600"
          verify "https://gnk-asg.hr/assets/release-completion-v1.js?deploy-admin-v6=${cache_bust}" release.js "GNK_RELEASE_COMPLETION_V7"
          verify "https://gnk-asg.hr/assets/index-data-resilience-v1.js?deploy-admin-v6=${cache_bust}" resilience.js "__GNK_INDEX_DATA_RESILIENCE_V2__"
          verify "https://gnk-asg.hr/assets/index-editorial-order-v1.js?deploy-admin-v6=${cache_bust}" editorial-order.js "__GNK_INDEX_EDITORIAL_ORDER_V3__"
          verify "https://gnk-asg.hr/assets/newsroom-live-v1.js?deploy-admin-v6=${cache_bust}" newsroom-live.js "/data/news.json"
          verify "https://gnk-asg.hr/assets/market-centre-data.js?deploy-admin-v6=${cache_bust}" market-centre.js "GNK_MARKET_CENTRE_DATA_V2"
          verify "https://gnk-asg.hr/assets/logo-gnk-asg-gold.svg?deploy-admin-v6=${cache_bust}" asg-logo.svg "GNK ASG"
          verify "https://gnk-asg.hr/?deploy-admin-v6=${cache_bust}" home.html "public-design-runtime-v1.js"
          verify "https://gnk-asg.hr/en/?deploy-admin-v6=${cache_bust}" home-en.html "public-design-runtime-v1.js"
          verify "https://gnk-asg.hr/newsroom/?deploy-admin-v6=${cache_bust}" newsroom.html "x-gnk-explicit-html-route"
          verify "https://gnk-asg.hr/en/newsroom/?deploy-admin-v6=${cache_bust}" newsroom-en.html "x-gnk-explicit-html-route"
          verify "https://gnk-asg.hr/objave/?deploy-admin-v6=${cache_bust}" objave.html "povjerenje-investitora-kroz-transparentnost"
          verify "https://gnk-asg.hr/analize/?deploy-admin-v6=${cache_bust}" analize.html "Poslovne i tehnološke analize"
          verify "https://gnk-asg.hr/komentari/?deploy-admin-v6=${cache_bust}" komentari.html "odgovornost-se-ne-moze-automatizirati"
          verify "https://gnk-asg.hr/trzista/?deploy-admin-v6=${cache_bust}" trzista.html "Trži"
          verify "https://gnk-asg.hr/the-code/?deploy-admin-v6=${cache_bust}" the-code.html "THE CODE"
          verify "https://gnk-asg.hr/data/news.json?deploy-admin-v6=${cache_bust}" news-fallback.json '"title"'
          verify "https://gnk-asg.hr/data/market.json?deploy-admin-v6=${cache_bust}" market-fallback.json '"coins"'
          verify "https://gnk-asg.hr/api/public-news?limit=1&deploy-admin-v6=${cache_bust}" news.json '"ok": true'
          verify "https://gnk-asg.hr/sitemap-index.xml?deploy-admin-v6=${cache_bust}" sitemap-index.xml "sitemap"
          verify "https://gnk-asg.hr/editorial-sitemap.xml?deploy-admin-v6=${cache_bust}" editorial-sitemap.xml "https://gnk-asg.hr/analize/"
          verify "https://gnk-asg.hr/robots.txt?deploy-admin-v6=${cache_bust}" robots.txt "Sitemap: https://gnk-asg.hr/sitemap-index.xml"

          grep -Fiq 'x-gnk-public-design: v1' deploy-verification/home.html.headers
          grep -Fiq 'x-gnk-public-design: v1' deploy-verification/home-en.html.headers
          ! grep -q "index-live-hub-v1.js" deploy-verification/home.html
          ! grep -q "index-live-hub-v1.js" deploy-verification/home-en.html
          [ "$(grep -o 'public-compact-menu-v1.js' deploy-verification/home.html | wc -l)" -eq 1 ]
          [ "$(grep -o 'public-compact-menu-v1.js' deploy-verification/home-en.html | wc -l)" -eq 1 ]
          news_count=$(node -e "const n=require('./deploy-verification/news-fallback.json'); console.log(Array.isArray(n)?n.length:0)")
          [ "$news_count" -ge 100 ]

          mail_status=$(curl --silent --show-error --output deploy-verification/mail.json --write-out '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "https://gnk-asg.hr/api/studio-message/send?deploy-admin-v6=${cache_bust}" || true)
          case "$mail_status" in 400|401) ;; *) cat deploy-verification/mail.json; exit 1;; esac
          grep -q '"error"' deploy-verification/mail.json

          logo_status=$(curl --silent --show-error --output deploy-verification/mail-logo.bin --write-out '%{http_code}' "https://gnk-asg.hr/assets/logo-gnk-asg-email.jpg?deploy-admin-v6=${cache_bust}" || true)
          [ "$logo_status" = "200" ]
          test -s deploy-verification/mail-logo.bin

      - name: Upload production verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-verification-${{ inputs.approved_sha }}
          path: deploy-verification
          if-no-files-found: warn
          retention-days: 14
