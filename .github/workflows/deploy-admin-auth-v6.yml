name: Deploy Admin Auth V6

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Type DEPLOY_ADMIN_AUTH_V6 to run production deploy"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_production_deploy == 'DEPLOY_ADMIN_AUTH_V6'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate current admin and portal files
        run: |
          node --check apps/portal/assets/public-floating-menu-v2.js
          node --check apps/portal/assets/index-live-hub-v1.js
          node --check workers/gnk-asg-direct-operator/src/email-brand-signature-v1.js
          node --check workers/gnk-asg-direct-operator/src/email-brand-mime-v1.js
          node --check workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js
          node --check workers/gnk-asg-direct-operator/src/manual-mail-service-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-unified-auth-v17.js
          node --check workers/gnk-asg-direct-operator/src/index-unified-auth-v16.js
          node --check workers/gnk-asg-operator-center/src/index.js
          node --check workers/gnk-asg-contact-api-worker/src/index-session-cookie-v1.js

      - name: Upload private Worker source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: worker-source-snapshot
          path: |
            workers
            .github/workflows
          if-no-files-found: error
          retention-days: 3

      - name: Resolve token hash
        id: auth
        env:
          TOKEN: ${{ secrets.GNK_ASG_OPERATOR_TOKEN }}
          TOKEN_FALLBACK: ${{ secrets.OPERATOR_TOKEN }}
        run: |
          value="$TOKEN"
          [ -n "$value" ] || value="$TOKEN_FALLBACK"
          test -n "$value"
          hash=$(printf '%s' "$value" | sha256sum | awk '{print $1}')
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Install direct operator dependencies
        working-directory: workers/gnk-asg-direct-operator
        run: npm install --no-audit --no-fund

      - name: Deploy contact session bridge
        working-directory: workers/gnk-asg-contact-api-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy src/index-session-cookie-v1.js --config wrangler.no-routes.toml --name gnk-asg-contact-api --var "OPERATOR_TOKEN_SHA256:${{ steps.auth.outputs.hash }}"

      - name: Deploy direct operator and shared assets
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.mail-proxy-no-routes.toml --name gnk-asg-direct-operator --var "OPERATOR_TOKEN_SHA256:${{ steps.auth.outputs.hash }}"

      - name: Deploy operator center
        working-directory: workers/gnk-asg-operator-center
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-operator-center

      - name: Verify current production shell
        run: |
          set -euo pipefail
          sleep 10

          require_status() {
            local route="$1"
            local expected="$2"
            local status
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://gnk-asg.hr${route}?deploy-admin-v6")
            if [ "$status" != "$expected" ]; then
              echo "Unexpected HTTP status for ${route}: got ${status}, expected ${expected}" >&2
              exit 1
            fi
          }

          require_protected_route() {
            local route="$1"
            local status
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://gnk-asg.hr${route}?deploy-admin-v6")
            case "$status" in
              200|301|302|303|307|308|401) ;;
              *)
                echo "Protected route ${route} returned unsupported HTTP status ${status}" >&2
                exit 1
                ;;
            esac
          }

          curl --fail --silent --show-error https://gnk-asg.hr/assets/public-floating-menu-v2.js?deploy-admin-v6 -o public-floating-menu-v2.js
          grep -q "HOME" public-floating-menu-v2.js
          grep -q "MENU" public-floating-menu-v2.js
          curl --fail --silent --show-error https://gnk-asg.hr/ -o public-home.html
          grep -q "public-floating-menu-v2.js" public-home.html

          require_status "/media-application/" "200"
          require_protected_route "/mail-studio/"
          require_protected_route "/email-status/"
          require_protected_route "/operator-dashboard/"
