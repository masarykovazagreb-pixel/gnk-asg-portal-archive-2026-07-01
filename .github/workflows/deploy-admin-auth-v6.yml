name: Deploy Admin Auth V6

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Type DEPLOY_ADMIN_AUTH_V6 to run production deploy"
        required: true
        type: string
      approved_sha:
        description: "Full 40-character main commit SHA approved for production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gnk-asg-production-deploy
  cancel-in-progress: false

jobs:
  authorize-production:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_production_deploy == 'DEPLOY_ADMIN_AUTH_V6'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0
      - name: Verify main ref, exact reviewed SHA and executive approval
        env:
          DEPLOY_APPROVAL: ${{ inputs.confirm_production_deploy }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1" >&2; exit 1; }
          require_eq() {
            local actual="$1" expected="$2" label="$3"
            [ "$actual" = "$expected" ] || fail "$label mismatch: expected '$expected', got '$actual'"
          }
          require_nonempty() {
            local value="$1" label="$2"
            [ -n "$value" ] || fail "$label must not be empty"
          }

          require_eq "$GITHUB_EVENT_NAME" 'workflow_dispatch' 'GitHub event'
          require_eq "$GITHUB_REF_TYPE" 'branch' 'Git ref type'
          require_eq "$GITHUB_REF_NAME" 'main' 'Git ref name'
          require_eq "$GITHUB_REF" 'refs/heads/main' 'Full Git ref'
          require_eq "$DEPLOY_APPROVAL" 'DEPLOY_ADMIN_AUTH_V6' 'Executive approval phrase'
          require_nonempty "$APPROVED_SHA" 'Approved SHA'
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "Approved SHA is not a full 40-character lowercase commit SHA: '$APPROVED_SHA'"
          require_eq "$GITHUB_SHA" "$APPROVED_SHA" 'Workflow SHA'
          require_eq "$(git rev-parse HEAD)" "$APPROVED_SHA" 'Checked-out HEAD'
          git fetch origin main --no-tags
          require_eq "$(git rev-parse origin/main)" "$APPROVED_SHA" 'origin/main SHA'
          [ -z "$(git status --porcelain)" ] || fail 'Authorized checkout is not clean'
          echo "Exact production source authorized: $APPROVED_SHA."

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate current V38 release package
        shell: bash
        run: |
          set -euo pipefail
          test -f workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          test -f workers/gnk-asg-direct-operator/src/index-digital-workforce-v1.js
          test -f workers/gnk-asg-direct-operator/src/dynamic-editorial-image-v1.js
          test -f workers/gnk-asg-direct-operator/src/public-market-data-v1.js
          test -f workers/gnk-asg-direct-operator/src/canonical-news-feed-v1.js
          test -f workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js
          test -f workers/gnk-asg-direct-operator/src/index-unified-auth-v21.js
          test -f workers/gnk-asg-direct-operator/src/email-brand-mime-v1.js
          test -f workers/gnk-asg-direct-operator/src/email-autoreply-mime-v1.js
          test -f apps/portal/assets/index-editorial-order-v6.js
          test -f apps/portal/assets/index-editorial-order-v1.js
          test -f apps/portal/assets/editorial-latest-index-v1.js
          test -f apps/portal/assets/contact-form-v2.js
          test -f apps/portal/assets/mail-studio-ui-v28.js
          test -f apps/portal/data/news.json
          test -f apps/portal/objave/index.html
          test -f apps/portal/komentari/index.html
          test -f scripts/test-news-share-routing-v1.mjs
          test -f scripts/test-canonical-news-dedupe-v1.mjs
          test -f scripts/verify-production-release-v38.sh
          test -f scripts/deploy-direct-operator-with-retry-v1.sh
          test -f scripts/test-deploy-assets-retry-contract-v1.mjs
          test -f workers/gnk-asg-direct-operator/wrangler.mail-proxy-no-routes.toml
          test -f workers/gnk-asg-direct-operator/wrangler.workforce-production-no-routes.toml

          node --check workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          node --check workers/gnk-asg-direct-operator/src/index-digital-workforce-v1.js
          node --check workers/gnk-asg-direct-operator/src/dynamic-editorial-image-v1.js
          node --check workers/gnk-asg-direct-operator/src/public-market-data-v1.js
          node --check workers/gnk-asg-direct-operator/src/canonical-news-feed-v1.js
          node --check workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js
          node --check workers/gnk-asg-direct-operator/src/index-unified-auth-v21.js
          node --check workers/gnk-asg-direct-operator/src/email-brand-mime-v1.js
          node --check workers/gnk-asg-direct-operator/src/email-autoreply-mime-v1.js
          node --check apps/portal/assets/index-editorial-order-v6.js
          node --check apps/portal/assets/index-editorial-order-v1.js
          node --check apps/portal/assets/editorial-latest-index-v1.js
          node --check apps/portal/assets/contact-form-v2.js
          node --check apps/portal/assets/mail-studio-ui-v28.js
          bash -n scripts/verify-production-release-v38.sh
          bash -n scripts/deploy-direct-operator-with-retry-v1.sh
          node scripts/test-news-share-routing-v1.mjs
          node scripts/test-canonical-news-dedupe-v1.mjs
          node scripts/test-production-authorization-mail-contract.mjs
          node scripts/test-deploy-assets-retry-contract-v1.mjs

          grep -Fq 'main = "src/index-unified-auth-v23.js"' workers/gnk-asg-direct-operator/wrangler.mail-proxy-no-routes.toml
          grep -Fq 'main = "src/index-digital-workforce-v1.js"' workers/gnk-asg-direct-operator/wrangler.workforce-production-no-routes.toml
          grep -Fq "import app,{VERSION as BASE_VERSION} from './index-unified-auth-v23.js';" workers/gnk-asg-direct-operator/src/index-digital-workforce-v1.js
          grep -Fq "h.set('x-gnk-active-entrypoint','src/index-digital-workforce-v1.js')" workers/gnk-asg-direct-operator/src/index-digital-workforce-v1.js
          grep -Fq "h.set('x-gnk-base-runtime','src/index-unified-auth-v23.js')" workers/gnk-asg-direct-operator/src/index-digital-workforce-v1.js
          grep -Fq 'GNK_ASG_UNIFIED_AUTH_V38_RELEASE_PROOF_NEWS_SOURCE_LINKS' workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          grep -Fq "export const ENTRYPOINT='src/index-unified-auth-v23.js'" workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          grep -Fq "headers.set('x-gnk-deploy-revision',revision)" workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          grep -Fq 'current-static-asset-20260715' workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          grep -Fq '/api/public-news-feed' workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          grep -Fq 'canonical-normalized-feed-v3-assets-primary-url-deduped' workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          grep -Fq 'GNK_ASG_CANONICAL_NEWS_FEED_V1_20260719_URL_DEDUPLICATION' workers/gnk-asg-direct-operator/src/canonical-news-feed-v1.js
          grep -Fq 'coinbase-spot-static-fx' workers/gnk-asg-direct-operator/src/public-market-data-v1.js
          grep -Fq 'source-redirect' workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          grep -Fq '20260715-source-links-v2' workers/gnk-asg-direct-operator/src/index-unified-auth-v21.js
          grep -Fq 'item.sourceUrl||item.url||item.href||item.share_url' apps/portal/assets/index-editorial-order-v6.js
          grep -Fq 'index-editorial-order-v1.js?v=20260715-editorial-v6-latest-first' workers/gnk-asg-direct-operator/src/index-unified-auth-v19.js
          grep -Fq 'Kapitalna disciplina u razdoblju geopolitičkih i energetskih šokova' apps/portal/objave/index.html
          grep -Fq 'AI ne smije pisati konačnu odluku' apps/portal/komentari/index.html
          grep -Fq 'GNK_ASG_MAIL_IDENTITY_AUTOREPLY_V10_20260718_PRE_SEND_DEDUPE' workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js
          grep -Fq 'aiMessageText' workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js
          grep -Fq "import {EMAIL_LOGO_CID,loadEmailLogo,VERSION as BRAND_MIME_VERSION} from './email-brand-mime-v1.js'" workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js
          grep -Fq 'signatureData(profile,`cid:${EMAIL_LOGO_CID}`)' workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js
          grep -Fq 'buildAutoreplyRawEmail(' workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js
          grep -Fqi 'multipart/related' workers/gnk-asg-direct-operator/src/email-autoreply-mime-v1.js
          grep -Fq 'Content-ID: <${EMAIL_LOGO_CID}>' workers/gnk-asg-direct-operator/src/email-autoreply-mime-v1.js
          grep -Fq 'signature.html' workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js
          grep -Fq 'min-height:520px' apps/portal/assets/mail-studio-ui-v28.js

  deploy-production:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_production_deploy == 'DEPLOY_ADMIN_AUTH_V6'
    needs: [authorize-production]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0
      - name: Reconfirm exact authorized SHA immediately before production deployment
        env:
          DEPLOY_APPROVAL: ${{ inputs.confirm_production_deploy }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1" >&2; exit 1; }
          require_eq() {
            local actual="$1" expected="$2" label="$3"
            [ "$actual" = "$expected" ] || fail "$label mismatch: expected '$expected', got '$actual'"
          }
          require_nonempty() {
            local value="$1" label="$2"
            [ -n "$value" ] || fail "$label must not be empty"
          }

          require_eq "$GITHUB_EVENT_NAME" 'workflow_dispatch' 'GitHub event'
          require_eq "$GITHUB_REF_TYPE" 'branch' 'Git ref type'
          require_eq "$GITHUB_REF_NAME" 'main' 'Git ref name'
          require_eq "$GITHUB_REF" 'refs/heads/main' 'Full Git ref'
          require_eq "$DEPLOY_APPROVAL" 'DEPLOY_ADMIN_AUTH_V6' 'Executive approval phrase'
          require_nonempty "$APPROVED_SHA" 'Approved SHA'
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "Approved SHA is not a full 40-character lowercase commit SHA: '$APPROVED_SHA'"
          require_eq "$GITHUB_SHA" "$APPROVED_SHA" 'Workflow SHA'
          require_eq "$(git rev-parse HEAD)" "$APPROVED_SHA" 'Checked-out HEAD'
          git fetch origin main --no-tags
          require_eq "$(git rev-parse origin/main)" "$APPROVED_SHA" 'origin/main SHA'
          [ -z "$(git status --porcelain)" ] || fail 'Deployment checkout is not clean'
          echo "Authorized SHA and approval reconfirmed immediately before production deployment."
          echo "DEPLOY_SOURCE_SHA=$APPROVED_SHA" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preflight Newsroom route ownership
        run: scripts/check-newsroom-route-readiness.sh deploy-preflight

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-preflight-${{ inputs.approved_sha }}
          path: deploy-preflight
          if-no-files-found: warn
          retention-days: 14

      - name: Install locked direct operator dependencies without lifecycle scripts
        working-directory: workers/gnk-asg-direct-operator
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Reconfirm tracked release integrity before any production secret
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1" >&2; exit 1; }
          [ "$(git rev-parse HEAD)" = "$APPROVED_SHA" ] || fail 'Checked-out HEAD changed after authorization'
          git diff --quiet || fail 'Tracked release files changed after authorization'
          git diff --cached --quiet || fail 'Staged release files changed after authorization'
          echo "Tracked release integrity reconfirmed before any production secret is exposed."

      - name: Resolve token hash after integrity verification
        id: auth
        env:
          TOKEN: ${{ secrets.GNK_ASG_OPERATOR_TOKEN }}
          TOKEN_FALLBACK: ${{ secrets.OPERATOR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1" >&2; exit 1; }
          value="$TOKEN"
          [ -n "$value" ] || value="$TOKEN_FALLBACK"
          [ -n "$value" ] || fail 'Neither GNK_ASG_OPERATOR_TOKEN nor OPERATOR_TOKEN is configured'
          hash=$(printf '%s' "$value" | sha256sum | awk '{print $1}')
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Deploy contact session bridge
        working-directory: workers/gnk-asg-contact-api-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy src/index-session-cookie-v1.js --config wrangler.no-routes.toml --name gnk-asg-contact-api --var "OPERATOR_TOKEN_SHA256:${{ steps.auth.outputs.hash }}"

      - name: Deploy direct operator and shared assets with bounded Cloudflare retry
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash ../../scripts/deploy-direct-operator-with-retry-v1.sh "${{ steps.auth.outputs.hash }}" "$DEPLOY_SOURCE_SHA"

      - name: Upload Wrangler deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-wrangler-logs-${{ inputs.approved_sha }}
          path: deploy-wrangler-logs
          if-no-files-found: warn
          retention-days: 14

      - name: Deploy operator center
        working-directory: workers/gnk-asg-operator-center
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-operator-center

      - name: Validate Mail Center Worker source
        run: node --check workers/gnk-asg-mail-center-worker/src/index.js

      - name: Build temporary Wrangler configuration for Mail Center Worker
        working-directory: workers/gnk-asg-mail-center-worker
        run: |
          cat > wrangler.runtime.toml <<'EOF'
          name = "gnk-asg-mail-center-worker"
          main = "src/index.js"
          compatibility_date = "2026-06-18"
          workers_dev = true
          preview_urls = true

          [ai]
          binding = "AI"

          [[kv_namespaces]]
          binding = "GNK_ASG_KV"
          id = "a3e9e78c7d554d7fa10996da9a89e7bc"

          [[send_email]]
          name = "EMAIL"
          remote = true
          EOF

      - name: Deploy Mail Center Worker (auto-reply / inbound email)
        working-directory: workers/gnk-asg-mail-center-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.runtime.toml --name gnk-asg-mail-center-worker --keep-vars

      - name: Verify exact production release (with retry for automation-commit races)
        shell: bash
        run: |
          set +e
          MAX_ATTEMPTS=4
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            if [ "$attempt" -gt 1 ]; then
              case "$attempt" in
                2) delay=20 ;;
                3) delay=45 ;;
                *) delay=75 ;;
              esac
              echo "Retrying production verification after ${delay}s (attempt ${attempt}/${MAX_ATTEMPTS})."
              sleep "$delay"
            fi
            bash scripts/verify-production-release-v38.sh deploy-verification
            status=$?
            if [ "$status" -eq 0 ]; then
              echo "Production verification passed on attempt ${attempt}."
              exit 0
            fi
            echo "Production verification failed on attempt ${attempt}/${MAX_ATTEMPTS} (exit ${status})."
          done
          echo "Production verification failed after ${MAX_ATTEMPTS} attempts." >&2
          exit "$status"

      - name: Upload production verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-verification-${{ inputs.approved_sha }}
          path: deploy-verification
          if-no-files-found: warn
          retention-days: 14

  indexnow-notify:
    name: Obavijesti IndexNow (Bing/Yandex) o novom deployu
    needs: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INDEXNOW_KEY: '2396905717b36885586139576d11142f'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pošalji sve URL-ove na IndexNow
        run: node scripts/gnk-indexnow-submit-v1.mjs
      - name: Ping Google i Bing sitemap
        run: |
          curl -s -o /dev/null -w "Google ping status: %{http_code}\n" "https://www.google.com/ping?sitemap=https://gnk-asg.hr/sitemap.xml"
          curl -s -o /dev/null -w "Bing ping status: %{http_code}\n" "https://www.bing.com/ping?sitemap=https://gnk-asg.hr/sitemap.xml"
