name: Deploy Admin Auth V6

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Type DEPLOY_ADMIN_AUTH_V6 to run production deploy"
        required: true
        type: string
      approved_sha:
        description: "Full 40-character main commit SHA approved for production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gnk-asg-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_production_deploy == 'DEPLOY_ADMIN_AUTH_V6'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate approval input
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "Approved production SHA: $APPROVED_SHA"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify exact approved release source
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          test "$actual" = "$APPROVED_SHA"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$APPROVED_SHA" origin/main
          test -z "$(git status --porcelain)"
          echo "DEPLOY_SOURCE_SHA=$actual" >> "$GITHUB_ENV"

      - name: Validate current V36 release package
        shell: bash
        run: |
          set -euo pipefail
          test -f workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          test -f workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js
          test -f apps/portal/assets/index-editorial-order-v1.js
          test -f apps/portal/assets/editorial-latest-index-v1.js
          test -f apps/portal/assets/contact-form-v2.js
          test -f apps/portal/assets/mail-studio-ui-v28.js
          test -f apps/portal/data/news.json
          test -f apps/portal/objave/index.html
          test -f apps/portal/komentari/index.html
          test -f workers/gnk-asg-direct-operator/wrangler.mail-proxy-no-routes.toml

          node --check workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          node --check workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js
          node --check apps/portal/assets/index-editorial-order-v1.js
          node --check apps/portal/assets/editorial-latest-index-v1.js
          node --check apps/portal/assets/contact-form-v2.js
          node --check apps/portal/assets/mail-studio-ui-v28.js

          grep -Fq 'main = "src/index-unified-auth-v23.js"' workers/gnk-asg-direct-operator/wrangler.mail-proxy-no-routes.toml
          grep -Fq 'GNK_ASG_UNIFIED_AUTH_V36_CURRENT_NEWS' workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          grep -Fq 'current-static-asset-20260715' workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          grep -Fq 'index-editorial-order-v1.js?v=20260715-editorial-v6-latest-first' workers/gnk-asg-direct-operator/src/index-unified-auth-v19.js
          grep -Fq 'Kapitalna disciplina u razdoblju geopolitičkih i energetskih šokova' apps/portal/objave/index.html
          grep -Fq 'AI ne smije pisati konačnu odluku' apps/portal/komentari/index.html
          grep -Fq 'GNK_ASG_MAIL_IDENTITY_AUTOREPLY_V6_20260715_AI_BRANDED' workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js
          grep -Fq 'aiMessageText' workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js
          grep -Fq 'loadEmailLogo' workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js
          grep -Fq 'signature.html' workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js
          grep -Fq 'min-height:520px' apps/portal/assets/mail-studio-ui-v28.js

          node <<'NODE'
          const fs=require('node:fs');
          const raw=JSON.parse(fs.readFileSync('apps/portal/data/news.json','utf8'));
          const items=Array.isArray(raw)?raw:(raw.items||raw.posts||raw.news||[]);
          if(!items.length)throw new Error('news feed empty');
          const value=items[0].published_at||items[0].publishedAt||items[0].date||'';
          if(!String(value).startsWith('2026-07-15'))throw new Error(`latest news is not 2026-07-15: ${value}`);
          console.log(JSON.stringify({ok:true,latest:value,count:items.length}));
          NODE

      - name: Preflight Newsroom route ownership
        run: scripts/check-newsroom-route-readiness.sh deploy-preflight

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-preflight-${{ inputs.approved_sha }}
          path: deploy-preflight
          if-no-files-found: warn
          retention-days: 14

      - name: Resolve token hash
        id: auth
        env:
          TOKEN: ${{ secrets.GNK_ASG_OPERATOR_TOKEN }}
          TOKEN_FALLBACK: ${{ secrets.OPERATOR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          value="$TOKEN"
          [ -n "$value" ] || value="$TOKEN_FALLBACK"
          test -n "$value"
          hash=$(printf '%s' "$value" | sha256sum | awk '{print $1}')
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Install direct operator dependencies
        working-directory: workers/gnk-asg-direct-operator
        run: npm install --no-audit --no-fund

      - name: Deploy contact session bridge
        working-directory: workers/gnk-asg-contact-api-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy src/index-session-cookie-v1.js --config wrangler.no-routes.toml --name gnk-asg-contact-api --var "OPERATOR_TOKEN_SHA256:${{ steps.auth.outputs.hash }}"

      - name: Deploy direct operator and shared assets
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.mail-proxy-no-routes.toml --name gnk-asg-direct-operator --var "OPERATOR_TOKEN_SHA256:${{ steps.auth.outputs.hash }}" --var "DEPLOY_REVISION:${DEPLOY_SOURCE_SHA}"

      - name: Deploy operator center
        working-directory: workers/gnk-asg-operator-center
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-operator-center

      - name: Verify current production release
        shell: bash
        run: |
          set -euo pipefail
          out=deploy-verification
          mkdir -p "$out"
          sleep 15
          cache="${DEPLOY_SOURCE_SHA}-$(date +%s)"

          verify_marker() {
            local name="$1" url="$2" marker="$3"
            local headers="$out/${name}.headers" body="$out/${name}.body"
            local code
            code=$(curl --silent --show-error --dump-header "$headers" --output "$body" --write-out '%{http_code}' "${url}?deploy-admin-v6=${cache}" || true)
            echo "ASSERT ${name} HTTP 200; actual=${code}"
            [ "$code" = "200" ]
            ! grep -Eiq '^location:' "$headers"
            grep -Fqi -- "$marker" "$body" "$headers"
          }

          verify_marker home 'https://gnk-asg.hr/' 'index-editorial-order-v6.js'
          verify_marker home-en 'https://gnk-asg.hr/en/' 'index-editorial-order-v6.js'
          verify_marker objave 'https://gnk-asg.hr/objave/' 'Kapitalna disciplina u razdoblju geopolitičkih i energetskih šokova'
          verify_marker komentari 'https://gnk-asg.hr/komentari/' 'AI ne smije pisati konačnu odluku'
          verify_marker contact-page 'https://gnk-asg.hr/contact/' 'id="contactForm"'
          verify_marker mail-studio 'https://gnk-asg.hr/assets/mail-studio-ui-v28.js' 'min-height:520px'
          verify_marker mail-logo 'https://gnk-asg.hr/assets/logo-gnk-asg-email.png' 'x-gnk-canonical-logo: same-as-portal'

          news_status=$(curl --silent --show-error --dump-header "$out/news.headers" --output "$out/news.json" --write-out '%{http_code}' "https://gnk-asg.hr/data/news.json?deploy-admin-v6=${cache}" || true)
          echo "ASSERT current news HTTP 200; actual=${news_status}"
          [ "$news_status" = "200" ]
          latest=$(jq -r 'if type=="array" then .[0].published_at // .[0].publishedAt // "" else (.items[0].published_at // .items[0].publishedAt // "") end' "$out/news.json")
          [[ "$latest" == 2026-07-15* ]]
          grep -Fiq 'x-gnk-news-source: current-static-asset-20260715' "$out/news.headers"

          contact_status=$(curl --silent --show-error --output "$out/contact-ready.json" --write-out '%{http_code}' "https://gnk-asg.hr/api/contact-submit?deploy-admin-v6=${cache}" || true)
          echo "ASSERT contact readiness HTTP 200; actual=${contact_status}"
          [ "$contact_status" = "200" ]
          jq -e '(.ready == true and has("storage") and has("mail") and has("transport")) or (.status == "READY" and .bindings.kv == true and .bindings.r2 == true and .bindings.email == true)' "$out/contact-ready.json" >/dev/null

          mail_status=$(curl --silent --show-error --output "$out/mail.json" --write-out '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "https://gnk-asg.hr/api/studio-message/send?deploy-admin-v6=${cache}" || true)
          echo "ASSERT unauthenticated mail endpoint controlled; actual=${mail_status}"
          case "$mail_status" in 400|401|403) ;; *) cat "$out/mail.json"; exit 1;; esac
          grep -q '"error"' "$out/mail.json"

      - name: Upload production verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-verification-${{ inputs.approved_sha }}
          path: deploy-verification
          if-no-files-found: warn
          retention-days: 14
