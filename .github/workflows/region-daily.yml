name: REGION — dnevni ciklus izdanja

# Sedamnaest gradskih kanala AKTUAL MEDIA — osam regionalnih (Zagreb, Beograd,
# Sarajevo, Budimpešta, Ljubljana, Rim, Sofija, Bukurešt) i devet svjetskih
# (Nairobi, Jakarta, New York, São Paulo, Sydney, Singapur, Kairo, Tokio,
# Peking): čitanje javnih feedova, osvrti, build, commit na main i deploy —
# s dvije izmjenične grupe svaka 2 sata (svaki grad svakih 4 sata). Novi zapisi ulaze u
# arhivu, stranice se grade za sve kanale, a commit ide samo ako se sadržaj
# stvarno promijenio.
#
# Registrirano u ops/automation-control-v1.json (knownCurrentSchedules) i
# ops/automation-kill-switches.json (regionPublish).
# Ručno: Actions → "REGION — dnevni ciklus izdanja" → Run workflow.

on:
  schedule:
    # Svaka 2 sata, cijeli dan: 12 ciklusa dnevno. Minuta je namjerno 7, ne 0 —
    # GitHub odbacuje dio rasporeda na puni sat zbog opterećenja, pa je ciklus
    # 19. i 20. 10. preskočen i izdanja su ostala na 19. 10.
    # Opposite half of the channels on alternating 2-hour slots (full rotation: 4h).
    - cron: '7 0,4,8,12,16,20 * * *'
    - cron: '7 2,6,10,14,18,22 * * *'
  # Ručno osvježavanje: izmjena ove datoteke pokreće ciklus i na grani.
  push:
    paths:
      - '.github/region-refresh-trigger'
      - '.github/workflows/region-daily.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Samo jedan kanal (prazno = jedna ograničena grupa)'
        required: false
        type: string
      force:
        description: 'Zanemari kill-switch (samo za ručnu provjeru)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: gnk-asg-main-mutation
  cancel-in-progress: false

jobs:
  daily:
    if: vars.GNK_ASG_RELEASE_FENCE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Zagreb
    steps:
      - name: Checkout pokrenute grane
        uses: actions/checkout@v4
        with:
          # Ne hardkodiraj main: push okidač mora raditi na grani na kojoj je pokrenut.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Zapamti polazni SHA
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dnevni ciklus (feedovi → osvrti → stranice → hub)
        shell: bash
        env:
          REGION_CHANNEL: ${{ inputs.channel }}
          REGION_FORCE: ${{ inputs.force }}
          REGION_CRON: ${{ github.event.schedule }}
        run: |-
          set -euo pipefail
          ARGS=()
          if [ -n "${REGION_CHANNEL:-}" ]; then
            ARGS+=(--channel "$REGION_CHANNEL")
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            case "$REGION_CRON" in
              '7 0,4,8,12,16,20 * * *') ARGS+=(--batch 0) ;;
              '7 2,6,10,14,18,22 * * *') ARGS+=(--batch 1) ;;
              *) echo "::error::Unknown REGION schedule — refusing unbounded 17-channel run"; exit 1 ;;
            esac
          else
            # Manual and workflow-file push triggers must also be bounded.
            ARGS+=(--batch "$((GITHUB_RUN_NUMBER % 2))")
          fi
          if [ "${REGION_FORCE:-false}" = "true" ]; then ARGS+=(--force); fi
          node apps/region/engine/daily.mjs "${ARGS[@]}"
          test -f apps/portal/kanal/zagreb/index.html
          node -e 'const fs=require("fs");const f=JSON.parse(fs.readFileSync("apps/region/data/_status.json","utf8"));const r=f.lastRun;const ch=Object.values(r.channels);const ok=ch.reduce((a,c)=>a+c.sourcesOk,0);const all=ch.reduce((a,c)=>a+c.sourcesTotal,0);console.log("REGION kanala:",ch.length,"izvori:",ok+"/"+all);if(!ch.length)process.exit(1);if(ok<all)console.log("::warning title=Partial source coverage::"+(all-ok)+" source feeds unavailable; archived pages remain linked to originals.")'

      - name: Galerija i matična stranica izdanja
        shell: bash
        run: |-
          set -euo pipefail
          node apps/portal/scripts/album-nermin-sefic-v1.mjs
          node scripts/build-brand-gallery-v1.mjs || echo "::warning::Galerija znakova nije dovršena — provjeri manifest i naslovnicu."
          node scripts/build-top-teme-v1.mjs
          node scripts/audit-top-teme-v1.mjs
          node apps/region/engine/hub.mjs
          # Tvornica: standard (nazivi, hashtagovi, meta duljina) nakon generatora
          python3 scripts/factory/apply_standard.py
          # Slojevi (entitet, traka, znak, tokeni, oznake Nermina, osvježavanje…) iz jedinog popisa;
          # bez ovoga svaki generator izbriše sloj koji je prije primijenjen.
          node scripts/sync-all-v1.mjs --group=layers
          # Standard (hashtagovi, meta) ponovno nakon slojeva: sloj ne smije vratiti stari meta opis.
          python3 scripts/factory/apply_standard.py
          node scripts/knowledge-center-hr-sync-v1.mjs --apply
          node apps/region/engine/audit.mjs
          node scripts/audit-aktual-brand-indexability-v1.mjs --strict
          test -f apps/portal/izdanja/index.html
          test -f apps/portal/data/izdanja.json

      - name: Zapiši izdanja
        id: commit
        shell: bash
        run: |-
          set -euo pipefail
          git config user.name "AKTUAL MEDIA REGION"
          git config user.email "info@gnk-asg.hr"
          git add apps/region/data apps/region/site apps/portal/kanal apps/portal/usa apps/portal/izdanja apps/portal/gnk-aktual apps/portal/en/gnk-aktual apps/portal/top-teme apps/portal/data/izdanja.json apps/portal/data/izdanja-sport.json apps/portal/data/nermin-sefic-gallery.json apps/portal/data/top-teme.json apps/portal/galerija apps/portal/aktual-media apps/portal/en/aktual-media apps/portal/knowledge-center apps/portal/data/aktual-data-desk-v1.json apps/portal/data/knowledge-base.json apps/portal/sitemap.xml apps/portal/sitemap-index.xml
          if git diff --cached --quiet; then
            echo "Nema novih zapisa — stanje je već objavljeno."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "REGION: ciklus $(date +%F) $(date +%H):00 — sedamnaest gradskih izdanja i galerija" -m "Automatski sastavljeni osvrti na način izvještavanja iz javnih feedova. Izvornici su povezani, tekstovi nisu preuzeti. Nije pojedinačno urednički pregledano."
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # 22. 10. 2026.: ciklus je izgrađen na 9d93455, a main se u međuvremenu
      # pomaknuo na 07628d2a (merge PR-a #339) — stari kod je tada samo ispisao
      # upozorenje i ODBACIO gotovo izdanje. Zato sada: rebase na svježi main i
      # do tri pokušaja pusha. Ako rebase ne prođe (netko je dirao iste datoteke),
      # izdanje se ne gubi tiho — pokreće se novi ciklus odmah, ne za dva sata.
      - name: Push na granu iz koje je pokrenut (rebase, do tri pokušaja)
        id: push
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          set -uo pipefail
          ref="${{ github.ref_name }}"
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin "$ref" --no-tags
            # Build regenerira i datoteke koje nisu u commit popisu (index,
            # mreza, jsonld). Git rebase odbija raditi s necommitanim
            # promjenama, pa je do 22. 10. 2026. svaki ciklus tiho padao na
            # prvom rebaseu i izdanje se gubilo. Artifakti se stashaju prije
            # rebasea; ako se ne vrate, sljedeći ciklus ih ionako ponovno
            # generira — važnije je da zapis izađe.
            git stash push -u -m "region-artifacts-$attempt" >/dev/null 2>&1 || true
            if ! git rebase "origin/$ref"; then
              echo "::warning::Rebase na origin/$ref nije prošao (pokušaj $attempt) — izdanje ostaje za sljedeći ciklus."
              git rebase --abort || true
              git stash drop >/dev/null 2>&1 || true
              break
            fi
            if git push origin "HEAD:$ref"; then
              pushed=true
              git stash drop >/dev/null 2>&1 || true
              break
            fi
            echo "::warning::Push odbijen (pokušaj $attempt) — ponavljam nakon rebasea."
            git stash drop >/dev/null 2>&1 || true
            sleep 5
          done
          echo "pushed=$pushed" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$pushed" != "true" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "::warning::Izdanje nije zapisano — pokrećem novi ciklus odmah."
            gh workflow run region-daily.yml --repo "$GITHUB_REPOSITORY" --ref "$ref" || true
          fi

      - name: Provjeri preusmjerenja za obrađene kanale
        if: steps.push.outputs.pushed == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        run: |-
          set -euo pipefail
          # Site/<city> projects are static 301 redirect stubs, not the
          # canonical content deployment. Changes to those stubs are handled
          # by region-deploy.yml; do not redeploy 17 satellites every cycle.
          ids="$(node -e 'const r=require("./apps/region/data/_status.json").lastRun.channels;const ids=Object.keys(r);if(!ids.length||ids.some(id=>!/^[a-z]+$/.test(id)))process.exit(1);process.stdout.write(ids.join(" "))')"
          for id in $ids; do
            test -f "apps/region/site/$id/index.html"
            grep -q '301' "apps/region/site/$id/_redirects"
          done
          echo "Canonical portal content is deployed by exact-SHA workflow; checked redirect stubs: $ids" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail visibly if a generated edition did not reach git
        if: steps.commit.outputs.changed == 'true' && steps.push.outputs.pushed != 'true'
        shell: bash
        run: |
          echo "::error::REGION generated an editorial package but did not push it; publication incomplete."
          exit 1

      - name: Objavi AKTUAL MEDIA (točan SHA)
        if: steps.push.outputs.pushed == 'true' && github.ref == 'refs/heads/main' && vars.REGION_PORTAL_DEPLOY != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ steps.push.outputs.sha }}
        run: |-
          set -euo pipefail
          gh workflow run deploy-admin-auth-v6.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f confirm_production_deploy=DEPLOY_ADMIN_AUTH_V6 \
            -f approved_sha="$APPROVED_SHA" \
            -f notify_search_engines=false

      - name: Provjeri javni hub
        if: steps.push.outputs.pushed == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        run: |-
          set -uo pipefail
          for i in $(seq 1 12); do
            if curl -fsS "https://gnk-asg.hr/izdanja/" -o /tmp/izdanja.html && grep -q "KANAL BEOGRAD" /tmp/izdanja.html; then
              echo "Hub je javan i sadrži regionalna izdanja."
              exit 0
            fi
            echo "Čekam propagaciju ($i/12)..."
            sleep 10
          done
          echo "::warning::Hub još nije potvrđen na javnoj adresi (portal se objavljuje zasebnim exact-SHA deployem)."

      - name: Sažetak
        if: always()
        shell: bash
        run: |-
          {
            echo "## REGION — dnevni ciklus"
            echo "- Datum: $(date +%F)"
            echo "- Promjena: ${{ steps.commit.outputs.changed }}"
            echo "- Zapis na main: ${{ steps.push.outputs.pushed || 'nije bilo promjene' }}"
            echo "- Hub: https://gnk-asg.hr/izdanja/"
            echo "- Kanali: 17, dvije rotirajuće grupe (svaki kanal jednom u 4 sata)"
            echo "- Galerija: https://gnk-asg.hr/galerija/"
            echo "- Status: automatski osvrti, nije pojedinačno urednički pregledano"
          } >> "$GITHUB_STEP_SUMMARY"
