name: REGION — dnevni ciklus izdanja

# Sedamnaest gradskih kanala AKTUAL MEDIA — osam regionalnih (Zagreb, Beograd,
# Sarajevo, Budimpešta, Ljubljana, Rim, Sofija, Bukurešt) i devet svjetskih
# (Nairobi, Jakarta, New York, São Paulo, Sydney, Singapur, Kairo, Tokio,
# Peking): čitanje javnih feedova, osvrti, build, commit na main i deploy —
# svaka 2 sata, automatski. Ciklus je inkrementalan: novi zapisi ulaze u
# arhivu, stranice se grade za sve kanale, a commit ide samo ako se sadržaj
# stvarno promijenio.
#
# Registrirano u ops/automation-control-v1.json (knownCurrentSchedules) i
# ops/automation-kill-switches.json (regionPublish).
# Ručno: Actions → "REGION — dnevni ciklus izdanja" → Run workflow.

on:
  schedule:
    # Svaka 2 sata, cijeli dan: 12 ciklusa dnevno. Minuta je namjerno 7, ne 0 —
    # GitHub odbacuje dio rasporeda na puni sat zbog opterećenja, pa je ciklus
    # 19. i 20. 10. preskočen i izdanja su ostala na 19. 10.
    - cron: '7 */2 * * *'
  # Ručno osvježavanje: izmjena ove datoteke pokreće ciklus i na grani.
  push:
    paths:
      - '.github/region-refresh-trigger'
      - '.github/workflows/region-daily.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Samo jedan kanal (prazno = svi)'
        required: false
        type: string
      force:
        description: 'Zanemari kill-switch (samo za ručnu provjeru)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: gnk-asg-main-mutation
  cancel-in-progress: false

jobs:
  daily:
    if: vars.GNK_ASG_RELEASE_FENCE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Zagreb
    steps:
      - name: Checkout pokrenute grane
        uses: actions/checkout@v4
        with:
          # Ne hardkodiraj main: push okidač mora raditi na grani na kojoj je pokrenut.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Zapamti polazni SHA
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dnevni ciklus (feedovi → osvrti → stranice → hub)
        shell: bash
        run: |-
          set -uo pipefail
          ARGS=""
          if [ -n "${{ inputs.channel }}" ]; then ARGS="$ARGS --channel ${{ inputs.channel }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          node apps/region/engine/daily.mjs $ARGS || echo "::warning::Dio izvora nije dostupan — izdanja se grade iz postojeće arhive."
          test -f apps/portal/kanal/zagreb/index.html
          node -e "const fs=require('fs');const f=JSON.parse(fs.readFileSync('apps/region/data/_status.json','utf8'));const r=f.lastRun;console.log('kanala:',Object.keys(r.channels).length);const ok=Object.values(r.channels).reduce((a,c)=>a+c.sourcesOk,0);const all=Object.values(r.channels).reduce((a,c)=>a+c.sourcesTotal,0);console.log('izvori:',ok+'/'+all);if(!Object.keys(r.channels).length)process.exit(1)"

      # Arhiva svjetskih izdanja zaostaje za regionalnima jer dnevni ciklus
      # uzima samo nekoliko najnovijih zapisa po izvoru. Ovaj korak dopunjuje
      # samo kanale ispod 300 tekstova, dok ostali nisu dirani.
      - name: Dopuni arhivu izdanja ispod cilja (300 tekstova)
        shell: bash
        run: |-
          set -uo pipefail
          node apps/region/engine/backfill.mjs --below 300 --target 320 --store 420 --days 400 --max-pages 6 --pause 80 \
            || echo "::warning::Dopuna arhive nije dovršena — izdanja ostaju na postojećim zapisima."

      # Redoslijed koraka živi u JEDNOM popisu: scripts/sync-all-v1.mjs.
      # Prije su dvije kopije (workflow i čovjek) znale se razići, pa je
      # generator prepisao sloj primijenjen prije njega — /status/ je tako
      # ostao bez znaka kuće, a Knowledge Center bez entity:v1 bloka.
      # Gate tests/test-sync-pipeline-v1.mjs pada ako se popis raziđe.
      - name: Sinkronizacija (generatori → slojevi → provjere)
        shell: bash
        run: |-
          set -euo pipefail
          node apps/portal/scripts/album-nermin-sefic-v1.mjs
          node scripts/sync-all-v1.mjs
          test -f apps/portal/izdanja/index.html
          test -f apps/portal/data/izdanja.json

      - name: Zapiši izdanja
        id: commit
        shell: bash
        run: |-
          set -euo pipefail
          git config user.name "AKTUAL MEDIA REGION"
          git config user.email "info@gnk-asg.hr"
          # Ciklus regenerira cijeli javni sloj portala, mreže i izdanja. Popis
          # pojedinih datoteka ostavljao je zaostatak: generator je mijenjao
          # stranicu koju commit nije uključivao, pa su gateovi na mainu padali
          # (sites-deploy, društvene kartice, meta higijena). Zato se dodaje
          # sve što ciklus izgradi — u tri stabla koja su njegovo vlasništvo.
          git add -A apps/portal apps/sites apps/region
          if git diff --cached --quiet; then
            echo "Nema novih zapisa — stanje je već objavljeno."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "REGION: ciklus $(date +%F) $(date +%H):00 — sedamnaest gradskih izdanja i galerija" -m "Automatski sastavljeni osvrti na način izvještavanja iz javnih feedova. Izvornici su povezani, tekstovi nisu preuzeti. Nije pojedinačno urednički pregledano."
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # 22. 10. 2026.: ciklus je izgrađen na 9d93455, a main se u međuvremenu
      # pomaknuo na 07628d2a (merge PR-a #339) — stari kod je tada samo ispisao
      # upozorenje i ODBACIO gotovo izdanje. Zato sada: rebase na svježi main i
      # do tri pokušaja pusha. Ako rebase ne prođe (netko je dirao iste datoteke),
      # izdanje se ne gubi tiho — pokreće se novi ciklus odmah, ne za dva sata.
      - name: Push na granu iz koje je pokrenut (rebase, do tri pokušaja)
        id: push
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          set -uo pipefail
          ref="${{ github.ref_name }}"
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin "$ref" --no-tags
            # Build regenerira i datoteke koje nisu u commit popisu (index,
            # mreza, jsonld). Git rebase odbija raditi s necommitanim
            # promjenama, pa je do 22. 10. 2026. svaki ciklus tiho padao na
            # prvom rebaseu i izdanje se gubilo. Artifakti se stashaju prije
            # rebasea; ako se ne vrate, sljedeći ciklus ih ionako ponovno
            # generira — važnije je da zapis izađe.
            git stash push -u -m "region-artifacts-$attempt" >/dev/null 2>&1 || true
            if ! git rebase "origin/$ref"; then
              echo "::warning::Rebase na origin/$ref nije prošao (pokušaj $attempt) — izdanje ostaje za sljedeći ciklus."
              git rebase --abort || true
              git stash drop >/dev/null 2>&1 || true
              break
            fi
            if git push origin "HEAD:$ref"; then
              pushed=true
              git stash drop >/dev/null 2>&1 || true
              break
            fi
            echo "::warning::Push odbijen (pokušaj $attempt) — ponavljam nakon rebasea."
            git stash drop >/dev/null 2>&1 || true
            sleep 5
          done
          echo "pushed=$pushed" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$pushed" != "true" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "::warning::Izdanje nije zapisano — pokrećem novi ciklus odmah."
            gh workflow run region-daily.yml --repo "$GITHUB_REPOSITORY" --ref "$ref" || true
          fi

      - name: Deploy na Cloudflare Pages (svaki kanal svoj projekt)
        if: steps.push.outputs.pushed == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |-
          set -uo pipefail
          if [ -z "${CF_TOKEN:-}" ] || [ -z "${CF_ACCOUNT:-}" ]; then
            echo "::warning::Cloudflare secrets nisu dostupni — deploy preskočen."
            exit 0
          fi
          for dir in apps/region/site/*/; do
            id=$(basename "$dir")
            project="gnk-asg-kanal-$id"
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$project")
            if [ "$code" != "200" ]; then
              curl -s -o /dev/null -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
                --data "{\"name\":\"$project\",\"production_branch\":\"main\"}" \
                "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects" || true
            fi
            npx --yes wrangler@4 pages deploy "$dir" --project-name="$project" --branch=main --commit-dirty=true \
              || echo "::warning::Deploy projekta $project nije uspio."
          done

      - name: Objavi AKTUAL MEDIA (točan SHA)
        if: steps.push.outputs.pushed == 'true' && github.ref == 'refs/heads/main' && vars.REGION_PORTAL_DEPLOY != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ steps.push.outputs.sha }}
        run: |-
          set -euo pipefail
          gh workflow run deploy-admin-auth-v6.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f confirm_production_deploy=DEPLOY_ADMIN_AUTH_V6 \
            -f approved_sha="$APPROVED_SHA" \
            -f notify_search_engines=false

      - name: Provjeri javni hub
        if: steps.push.outputs.pushed == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        run: |-
          set -uo pipefail
          for i in $(seq 1 12); do
            if curl -fsS "https://gnk-asg.hr/izdanja/" -o /tmp/izdanja.html && grep -q "KANAL BEOGRAD" /tmp/izdanja.html; then
              echo "Hub je javan i sadrži regionalna izdanja."
              exit 0
            fi
            echo "Čekam propagaciju ($i/12)..."
            sleep 10
          done
          echo "::warning::Hub još nije potvrđen na javnoj adresi (portal se objavljuje zasebnim exact-SHA deployem)."

      - name: Sažetak
        if: always()
        shell: bash
        run: |-
          {
            echo "## REGION — dnevni ciklus"
            echo "- Datum: $(date +%F)"
            echo "- Promjena: ${{ steps.commit.outputs.changed }}"
            echo "- Zapis na main: ${{ steps.push.outputs.pushed || 'nije bilo promjene' }}"
            echo "- Hub: https://gnk-asg.hr/izdanja/"
            echo "- Izdanja: Zagreb, Beograd, Sarajevo, Budimpešta, Ljubljana, Rim, Sofija, Bukurešt"
            echo "- Galerija: https://gnk-asg.hr/galerija/"
            echo "- Status: automatski osvrti, nije pojedinačno urednički pregledano"
          } >> "$GITHUB_STEP_SUMMARY"
