name: Health Sentinel Persistent Ledger

on:
  pull_request:
    paths:
      - 'config/health-sentinel-persistent-ledger-v1.json'
      - 'scripts/validate-health-sentinel-persistent-ledger.mjs'
      - '.github/workflows/health-sentinel-persistent-ledger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/validate-health-sentinel-persistent-ledger.mjs