name: HR NEWS — 10-minute approved publication fast lane
# Article-only on-demand publisher. NO new cron or competing background writer.
on:
  workflow_dispatch:
    inputs:
      article_path:
        description: 'Approved single original JSON e.g. content/hr-news/approved/example.json'
        type: string
        required: true
      confirm_publication:
        description: 'Type PUBLISH_APPROVED_HR_NEWS after independent editorial review'
        type: string
        required: true
      notify_search_engines:
        description: 'Forward sitemap notifications to the protected Cloudflare deploy'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  prepare-and-dispatch:
    concurrency:
      group: gnk-asg-main-mutation
      cancel-in-progress: false
    outputs:
      approved_sha: ${{ steps.publication.outputs.sha }}
      slug: ${{ steps.article.outputs.slug }}
      approved_at: ${{ steps.article.outputs.approved_at }}
      dispatch_utc: ${{ steps.release.outputs.sent_at }}
    if: github.ref == 'refs/heads/main' && inputs.confirm_publication == 'PUBLISH_APPROVED_HR_NEWS' && vars.GNK_ASG_RELEASE_FENCE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: write
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          fetch-tags: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fail closed on HR-News-only publication switch, fence, stale main or unsafe event
        shell: bash
        env:
          APPROVAL: ${{ inputs.confirm_publication }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$APPROVAL" = 'PUBLISH_APPROVED_HR_NEWS'
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain)"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const state=JSON.parse(fs.readFileSync('ops/automation-kill-switches.json','utf8'));
          if(state.releaseFence?.enabled!==false)throw Error('Production release fence is active or unknown');
          if(state.channels?.hrNewsFastlanePublish?.enabled!==true)throw Error('Approved HR News fast-lane switch is OFF; no release');
          if(state.releaseRules?.requireGreenPremiumContract!==true)throw Error('Required quality gate cannot be disabled');
          console.log('Publication switch and quality policy authorized.');
          NODE
      - name: Run article-only legal/editorial preflight
        id: article
        shell: bash
        env:
          ARTICLE_PATH: ${{ inputs.article_path }}
        run: |
          set -euo pipefail
          node scripts/hr-news-fastlane-preflight-v1.mjs "$ARTICLE_PATH" > /tmp/hr-fastlane-preflight.json
          slug="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/hr-fastlane-preflight.json','utf8')).slug")"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          approved_at="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/hr-fastlane-preflight.json','utf8')).approvedAt")"
          echo "approved_at=$approved_at" >> "$GITHUB_OUTPUT"
          echo 'Source-checked original article approved for controlled build, NOT LIVE.'
      - name: Build original article, original SVG, metadata and sitemap
        env:
          ARTICLE_PATH: ${{ inputs.article_path }}
        run: |
          set -euo pipefail
          node scripts/hr-news-one-command-v1.mjs "$ARTICLE_PATH"
          node scripts/hr-news-sitemap-v1.mjs
          node --test tests/test-hr-news-fastlane-v1.mjs
          node scripts/test-hr-news-v1.mjs
      - name: Commit exactly the reviewed article artifacts, without force
        id: publication
        shell: bash
        env:
          SLUG: ${{ steps.article.outputs.slug }}
        run: |
          set -euo pipefail
          git config user.name 'aktual-reviewed-publisher'
          git config user.email 'actions@github.com'
          git add "apps/portal/news/clanci/$SLUG/index.html" \
            "apps/portal/assets/editorial/hr-news/$SLUG.svg" \
            apps/portal/data/hr-news-original-v1.json \
            apps/portal/news/sitemap.xml
          test -n "$(git diff --cached --name-only)"
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo '::error::main changed during validation: refuse stale push'; exit 1;
          }
          git commit -m "Publish reviewed HR NEWS original: $SLUG"
          sha="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Main writer SHA $sha created; NOT YET LIVE."
      - name: Explicitly dispatch both read-only required CI workflows on token-authored exact SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.publication.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$SHA" || {
            echo '::error::Main advanced before CI dispatch: refuse stale release'; exit 1;
          }
          # A GITHUB_TOKEN-authored push does not recursively fire other push workflows.
          # workflow_dispatch is an explicitly supported trigger. Both runs stay read-only.
          gh workflow run all-gates-v1.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run site-functional-readiness.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Wait for required full CI before permitting exact-SHA deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.publication.outputs.sha }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1200 ))
          for workflow in all-gates-v1.yml site-functional-readiness.yml; do
            while true; do
              result="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
                --commit "$SHA" --limit 2 --json headSha,status,conclusion 2>/dev/null || echo '[]')"
              conclusion="$(printf '%s' "$result" | jq -r --arg sha "$SHA" '[.[] | select(.headSha==$sha)] | first | .conclusion // "missing"')"
              status="$(printf '%s' "$result" | jq -r --arg sha "$SHA" '[.[] | select(.headSha==$sha)] | first | .status // "missing"')"
              if [ "$conclusion" = 'success' ]; then
                echo "$workflow: success on $SHA"
                break
              fi
              if [ "$status" = 'completed' ]; then
                echo "::error::$workflow concluded $conclusion; deployment BLOCKED"
                exit 1
              fi
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::$workflow not proven successful before gate deadline; deployment BLOCKED"
                exit 1
              fi
              sleep 15
            done
          done
      - name: Dispatch existing protected Cloudflare exact-SHA deployment only after gates
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.publication.outputs.sha }}
          NOTIFY: ${{ inputs.notify_search_engines }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$SHA" || {
            echo '::error::Main advanced: refuse wrong-SHA production dispatch'; exit 1;
          }
          sent_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          gh workflow run deploy-admin-auth-v6.yml \
            --repo "$GITHUB_REPOSITORY" --ref main \
            -f confirm_production_deploy=DEPLOY_ADMIN_AUTH_V6 \
            -f approved_sha="$SHA" \
            -f notify_search_engines="$NOTIFY"
          echo "Deployment requested for exact $SHA; NOT LIVE until protected deploy and public HTTPS verification succeed."
          echo "sent_at=$sent_at" >> "$GITHUB_OUTPUT"
          {
            echo '## HR NEWS fast lane'
            echo "**Article:** /news/clanci/${{ steps.article.outputs.slug }}/"
            echo "**Exact SHA:** $SHA"
            echo '**State:** Cloudflare deploy dispatched, LIVE not yet verified'
            echo '**Target:** 10 minutes after documented editorial approval; no SLA promise while gates are queued or failing'
          } >> "$GITHUB_STEP_SUMMARY"

  verify-public-article:
    name: Independently verify live article on exact Cloudflare release SHA
    needs: prepare-and-dispatch
    if: needs.prepare-and-dispatch.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.prepare-and-dispatch.outputs.approved_sha }}
      SLUG: ${{ needs.prepare-and-dispatch.outputs.slug }}
      APPROVED_AT: ${{ needs.prepare-and-dispatch.outputs.approved_at }}
      DISPATCHED_AT: ${{ needs.prepare-and-dispatch.outputs.dispatch_utc }}
    steps:
      - name: Require successful protected production deploy for exactly the approved SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]
          test -n "$DISPATCHED_AT"
          deadline=$(( $(date +%s) + 840 ))
          run_id=''
          while [ "$(date +%s)" -lt "$deadline" ]; do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow deploy-admin-auth-v6.yml --limit 50 \
              --json databaseId,headSha,createdAt,event,status,conclusion)"
            run_id="$(printf '%s' "$runs" | jq -r \
              --arg sha "$SHA" --arg cutoff "$DISPATCHED_AT" \
              '[.[] | select(.headSha==$sha and .event=="workflow_dispatch" and .createdAt>=$cutoff)] | sort_by(.createdAt) | last | .databaseId // empty')"
            if [ -n "$run_id" ]; then
              state="$(printf '%s' "$runs" | jq -r --argjson id "$run_id" \
                '[.[] | select(.databaseId==$id)] | first | .status // "missing"')"
              conclusion="$(printf '%s' "$runs" | jq -r --argjson id "$run_id" \
                '[.[] | select(.databaseId==$id)] | first | .conclusion // "missing"')"
              if [ "$state" = 'completed' ]; then
                if [ "$conclusion" = 'success' ]; then
                  echo "Protected deployment run $run_id succeeded for $SHA."
                  break
                fi
                echo "::error::Protected deployment $run_id completed as $conclusion; NOT LIVE"
                exit 1
              fi
            fi
            sleep 15
          done
          if [ -z "$run_id" ] || [ "$(date +%s)" -ge "$deadline" ]; then
            echo '::error::No timely successful protected deployment; NOT LIVE'
            exit 1
          fi
      - name: Verify independent public HTTP, canonical article and exact production SHA
        shell: bash
        run: |
          set -euo pipefail
          page="https://gnk-asg.hr/news/clanci/$SLUG/"
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT
          deadline=$(( $(date +%s) + 100 ))
          verified=false
          while [ "$(date +%s)" -lt "$deadline" ]; do
            code="$(curl --silent --show-error --max-time 15 --max-redirs 0 \
              --dump-header "$headers" --output "$body" --write-out '%{http_code}' \
              "$page?exact-sha=$SHA" || true)"
            if [ "$code" = '200' ] &&
               grep -Fiq "x-gnk-deploy-revision: $SHA" "$headers" &&
               grep -Fq "<link rel=\"canonical\" href=\"$page\">" "$body" &&
               grep -Fq '<script type="application/ld+json">' "$body"; then
              verified=true
              break
            fi
            sleep 8
          done
          if [ "$verified" != true ]; then
            echo '::error::Missing article HTTP 200, canonical metadata or exact production SHA; NOT LIVE'
            exit 1
          fi
          export VERIFIED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node --input-type=module - <<'NODE'
          const from=Date.parse(process.env.APPROVED_AT);
          const at=Date.parse(process.env.VERIFIED_AT);
          const elapsed=Number.isFinite(from)&&Number.isFinite(at)?Math.max(0,Math.round((at-from)/1000)):null;
          console.log(JSON.stringify({verdict:'VERIFIED_LIVE',url:'https://gnk-asg.hr/news/clanci/'+process.env.SLUG+'/',sha:process.env.SHA,verifiedAt:process.env.VERIFIED_AT,secondsAfterApproval:elapsed,tenMinuteGoalAchieved:elapsed!==null&&elapsed<=600}));
          NODE
          {
            echo '## Verified original HR NEWS article'
            echo "**Public URL:** $page"
            echo "**Production SHA:** $SHA"
            echo '**Proof:** HTTP 200 + canonical article metadata + exact release header'
            echo "**Verified UTC:** $VERIFIED_AT"
          } >> "$GITHUB_STEP_SUMMARY"
