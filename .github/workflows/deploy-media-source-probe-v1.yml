name: Deploy Media Source Probe V1

on:
  push:
    branches: [main]
    paths:
      - "workers/gnk-asg-direct-operator/src/media-project-source-probe-v1.js"
      - "workers/gnk-asg-direct-operator/src/index-final-admin-gateway-projects-v1.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-media-source-probe-v1
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate temporary locked probe
        run: |
          set -euo pipefail
          node --check workers/gnk-asg-direct-operator/src/media-project-source-probe-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-final-admin-gateway-projects-v1.js
          grep -q "MEDIA_OUTREACH_LIVE.*false" workers/gnk-asg-direct-operator/src/index-final-admin-gateway-projects-v1.js
          grep -q "media-outreach-build-lock" workers/gnk-asg-direct-operator/src/index-final-admin-gateway-projects-v1.js
          ! grep -q "EMAIL.send" workers/gnk-asg-direct-operator/src/media-project-source-probe-v1.js
      - name: Deploy locked Worker
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator
