name: Report IQ200 deploy result

on:
  workflow_run:
    workflows: ["Deploy public portal"]
    types: [completed]

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Record deploy result
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          failed=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" --jq '[.jobs[] | .name as $job | .steps[] | select(.conclusion == "failure") | ($job + " — " + .name)] | join("; ")')
          if [ -z "$failed" ]; then failed="nema neuspjelog koraka"; fi
          body=$(printf '## IQ200 deploy #%s — %s\n\n- Commit: `%s`\n- Neuspjeli korak: **%s**\n- Run: %s\n' "$RUN_NUMBER" "$CONCLUSION" "$HEAD_SHA" "$failed" "$RUN_URL")
          gh api "repos/${GITHUB_REPOSITORY}/issues/83/comments" -f body="$body"
