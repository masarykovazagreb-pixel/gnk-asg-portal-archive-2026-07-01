name: Dijagnostika index live data (jednokratno)
on: workflow_dispatch
jobs:
  dijag:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
      - run: |
          mkdir -p apps/portal/data/tmp-index-diag
          python scripts/refresh_index_live_data.py > /dev/null 2>&1
          python << 'PYEOF' > apps/portal/data/tmp-index-diag/losi2.txt
          import json
          news = json.load(open("apps/portal/data/news.json"))
          archive = json.load(open("apps/portal/data/news_archive.json"))
          n=0
          for item in news + archive:
              item_id = str(item.get("id","")).strip()
              title = str(item.get("title","")).strip()
              if not item_id or len(item_id) < 12 or not title or len(title) < 8:
                  n+=1
                  print("LOS ZAPIS:", json.dumps(item, ensure_ascii=False)[:300])
          print("UKUPNO LOSIH:", n)
          PYEOF
          cat apps/portal/data/tmp-index-diag/losi2.txt
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          BRANCH="index-diag4-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-index-diag
          git commit -m "diag4"
          git push origin "$BRANCH"
