name: Deploy Firefox Admin auth isolation via issue 93

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: gnk-asg-canonical-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.issue.number == 93 && github.event.comment.body == '/deploy-firefox-auth-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Verify auth isolation package
        shell: bash
        run: |
          set -euxo pipefail
          node --check workers/gnk-asg-direct-operator/src/index-unified-auth-v15.js
          node --check workers/gnk-asg-direct-operator/src/index-mail-studio-bridge-v15.js
          node --check apps/portal/assets/admin-unified-shell-v7.js
          grep -q 'GNK_ASG_UNIFIED_AUTH_V15_20260626_LOGIN_ISOLATION' workers/gnk-asg-direct-operator/src/index-unified-auth-v15.js
          grep -q "import app from './index-unified-auth-v15.js'" workers/gnk-asg-direct-operator/src/index-mail-studio-bridge-v15.js
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator

      - name: Deploy to Cloudflare
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator

      - name: Verify unauthenticated Firefox contract
        shell: bash
        run: |
          set -euo pipefail
          sleep 60
          base='https://gnk-asg.hr'; cb=$(date +%s)
          curl -sS -D /tmp/login.headers -H 'Cache-Control: no-cache' -H 'User-Agent: Mozilla/5.0 Firefox/128.0' "$base/admin-center/?cb=$cb" -o /tmp/login.html
          curl -sS -D /tmp/legacy.headers -o /tmp/legacy.out --max-redirs 0 "$base/operator-dashboard/?cb=$cb" || true
          node <<'JS'
          const fs=require('node:fs');
          const loginHeaders=fs.readFileSync('/tmp/login.headers','utf8');
          const legacyHeaders=fs.readFileSync('/tmp/legacy.headers','utf8');
          const html=fs.readFileSync('/tmp/login.html','utf8');
          const first=text=>String(text).split(/\r?\n/)[0]||'';
          const header=(text,name)=>((text.match(new RegExp(`^${name}:\\s*(.+)$`,'im'))||[])[1]||'').trim();
          const failures=[];
          if(!/\s401\s/.test(first(loginHeaders)))failures.push(`login_status=${first(loginHeaders)}`);
          if(header(loginHeaders,'x-gnk-asg-auth-isolation')!=='GNK_ASG_UNIFIED_AUTH_V15_20260626_LOGIN_ISOLATION')failures.push(`auth_isolation=${header(loginHeaders,'x-gnk-asg-auth-isolation')}`);
          if(!html.includes('data-gnk-auth-login="1"'))failures.push('login_marker_missing');
          if(!/<input[^>]+name=["']token["']/i.test(html))failures.push('token_form_missing');
          if(/<header[^>]+id=["']gnk-backend-shell["']/i.test(html))failures.push('admin_header_rendered');
          if(/<nav[^>]+class=["'][^"']*gnk-shell-nav/i.test(html))failures.push('admin_nav_rendered');
          if(/<script[^>]+src=["'][^"']*(?:admin-unified-shell|backend-ui-shell|admin-session-fallback)/i.test(html))failures.push('admin_script_injected');
          if(!/\s303\s/.test(first(legacyHeaders)))failures.push(`legacy_status=${first(legacyHeaders)}`);
          if(!header(legacyHeaders,'location').includes('/admin-center/?module=operator'))failures.push(`legacy_location=${header(legacyHeaders,'location')}`);
          const result={checkedAt:new Date().toISOString(),failures,loginStatus:first(loginHeaders),authIsolation:header(loginHeaders,'x-gnk-asg-auth-isolation'),legacyStatus:first(legacyHeaders),legacyLocation:header(legacyHeaders,'location'),loginBytes:html.length};
          fs.writeFileSync('/tmp/result.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          if(failures.length)process.exit(1);
          JS

      - name: Report Firefox auth result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          result=$(cat /tmp/result.json 2>/dev/null || printf '{"error":"verification_not_reached"}')
          gh issue comment 93 --body "Firefox Admin auth deploy **${JOB_STATUS}** · commit \`${RUN_SHA}\` · ${RUN_URL}\n\n\`\`\`json\n${result}\n\`\`\`"
