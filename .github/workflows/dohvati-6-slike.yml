name: Dohvati 2 slike v5 (jednokratno)
on: workflow_dispatch
jobs:
  dohvati:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p apps/portal/data/tmp-6s
          curl -s "https://gnk-asg.hr/api/slike?upit=cloud+computing+data+center+servers" -o apps/portal/data/tmp-6s/oblak.json
          curl -s "https://gnk-asg.hr/api/slike?upit=senior+mentor+teaching+younger+colleague+office" -o apps/portal/data/tmp-6s/znanje.json
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          BRANCH="slike6-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-6s
          git commit -m "slike"
          git push origin "$BRANCH"
