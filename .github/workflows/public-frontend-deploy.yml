name: Deploy public GNK ASG portal

on:
  push:
    branches: [main]
    paths:
      - 'apps/portal/**'
      - 'scripts/generate_media_kit_pdfs.py'
      - 'scripts/generate_media_kit_pdfs_v2.py'
      - '.github/workflows/public-frontend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnk-asg-public-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate public Media Kits
        run: |
          if [ -f scripts/generate_media_kit_pdfs_v2.py ]; then
            python scripts/generate_media_kit_pdfs_v2.py
          else
            python scripts/generate_media_kit_pdfs.py
          fi
          test -s apps/portal/downloads/GNK_ASG_GNK_DINAMO_Ltd_Media_Kit_2_HR.pdf
          test -s apps/portal/downloads/GNK_ASG_GNK_DINAMO_LTD_MEDIA_KIT_EN.pdf
          head -c 5 apps/portal/downloads/GNK_ASG_GNK_DINAMO_Ltd_Media_Kit_2_HR.pdf | grep -q '%PDF-'
          head -c 5 apps/portal/downloads/GNK_ASG_GNK_DINAMO_LTD_MEDIA_KIT_EN.pdf | grep -q '%PDF-'

      - name: Validate centred public navigation
        run: |
          grep -q 'justify-content:center' apps/portal/assets/brand/gnk-asg-centered-public-menu.css
          grep -q 'gnk-asg-centered-public-menu.css' apps/portal/assets/brand/gnk-asg-global-layer.css
          grep -q 'gnk-asg-centered-public-menu.css' apps/portal/assets/index-redesign-production.css

      - name: Deploy public portal
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy src/index-ui-harmonizer.js --config wrangler.dark-market.toml --name gnk-asg-direct-operator

      - name: Production smoke test
        run: |
          sleep 15
          curl --fail --silent --show-error --location https://gnk-asg.hr/assets/brand/gnk-asg-centered-public-menu.css | grep -q 'CENTERED PUBLIC MENU'
          curl --fail --silent --show-error --location https://gnk-asg.hr/ > /tmp/hr.html
          curl --fail --silent --show-error --location https://gnk-asg.hr/en/ > /tmp/en.html
          curl --fail --silent --show-error --location https://gnk-asg.hr/objave/ > /tmp/objave.html
          test -s /tmp/hr.html
          test -s /tmp/en.html
          test -s /tmp/objave.html
