name: Production Index and Content Automation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/portal/index.html"
      - "apps/portal/en/index.html"
      - "apps/portal/app/index.html"
      - "apps/portal/operator-mobile/index.html"
      - "apps/portal/assets/index-redesign-production.css"
      - "apps/portal/assets/index-redesign-production.js"
      - "apps/portal/assets/index-iq200.css"
      - "apps/portal/assets/index-iq200.js"
      - "apps/portal/assets/backend-ui-shell.css"
      - "apps/portal/assets/backend-ui-shell.js"
      - "apps/portal/assets/gnk-asg-ai-layer.css"
      - "workers/gnk-asg-direct-operator/src/index-ui-harmonizer.js"
      - "workers/gnk-asg-direct-operator/src/index-news-quality-v2.js"
      - "workers/gnk-asg-direct-operator/src/index-dark-market-recovery.js"
      - "workers/gnk-asg-direct-operator/src/index-publication-news-hotfix.js"
      - "workers/gnk-asg-direct-operator/wrangler.dark-market.toml"
      - ".github/workflows/dark-menu-market-recovery.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/portal/index.html"
      - "apps/portal/en/index.html"
      - "apps/portal/app/index.html"
      - "apps/portal/operator-mobile/index.html"
      - "apps/portal/assets/index-redesign-production.css"
      - "apps/portal/assets/index-redesign-production.js"
      - "apps/portal/assets/index-iq200.css"
      - "apps/portal/assets/index-iq200.js"
      - "apps/portal/assets/backend-ui-shell.css"
      - "apps/portal/assets/backend-ui-shell.js"
      - "apps/portal/assets/gnk-asg-ai-layer.css"
      - "workers/gnk-asg-direct-operator/src/index-ui-harmonizer.js"
      - "workers/gnk-asg-direct-operator/src/index-news-quality-v2.js"
      - "workers/gnk-asg-direct-operator/src/index-dark-market-recovery.js"
      - "workers/gnk-asg-direct-operator/src/index-publication-news-hotfix.js"
      - "workers/gnk-asg-direct-operator/wrangler.dark-market.toml"
      - ".github/workflows/dark-menu-market-recovery.yml"

concurrency:
  group: gnk-asg-production-index-and-content
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate production index package
        working-directory: workers/gnk-asg-direct-operator
        run: |
          node --check ../../apps/portal/assets/index-redesign-production.js
          node --check ../../apps/portal/assets/index-iq200.js
          node --check ../../apps/portal/assets/backend-ui-shell.js
          node --check src/index-ui-harmonizer.js
          test -f ../../apps/portal/assets/index-redesign-production.css
          test -f ../../apps/portal/assets/index-iq200.css
          test -f ../../apps/portal/assets/backend-ui-shell.css
          test -f ../../apps/portal/assets/gnk-asg-ai-layer.css
          test -f ../../apps/portal/app/index.html
          test -f ../../apps/portal/operator-mobile/index.html
          grep -q 'Korporativni portal GNK ASG' ../../apps/portal/index.html
          grep -q 'Corporate portal for GNK ASG' ../../apps/portal/en/index.html
          grep -q '33 postojeće' ../../apps/portal/index.html
          grep -q '12 pozicija' ../../apps/portal/index.html
          grep -q 'PDF i Download centar' ../../apps/portal/index.html
          grep -q 'Media Kit' ../../apps/portal/index.html
          grep -q '/operator-dashboard/' ../../apps/portal/index.html
          grep -q '/mail-studio/' ../../apps/portal/index.html
          grep -q '/contact/' ../../apps/portal/index.html
          grep -q '/api/market' ../../apps/portal/assets/index-redesign-production.js
          grep -q '/data/news.json' ../../apps/portal/assets/index-redesign-production.js
          grep -q '/data/group_network.json' ../../apps/portal/assets/index-redesign-production.js
          grep -q '/data/auto-editor.json' ../../apps/portal/assets/index-redesign-production.js
          grep -q 'Korporativni <span>ekosustav</span>' src/index-ui-harmonizer.js
          grep -q 'Corporate <span>ecosystem</span>' src/index-ui-harmonizer.js
          grep -q 'hero-network-canvas' ../../apps/portal/assets/index-iq200.js
          grep -q 'gnk-backend-shell' ../../apps/portal/assets/backend-ui-shell.js
          grep -q 'backend-ui-shell.css' ../../apps/portal/assets/gnk-asg-ai-layer.css
          if grep -q 'noindex,nofollow' ../../apps/portal/index.html; then exit 1; fi
          if grep -q 'Živa probna verzija' ../../apps/portal/index.html; then exit 1; fi

      - name: Validate content automation package
        working-directory: workers/gnk-asg-direct-operator
        run: |
          node --check src/index-news-quality-v2.js
          node --check src/index-dark-market-recovery.js
          node --check src/index-publication-news-hotfix.js
          grep -q 'crons = \["0 \* \* \* \*"\]' wrangler.dark-market.toml
          grep -q 'hour%3===0' src/index-publication-news-hotfix.js
          grep -q 'async function refreshNews' src/index-publication-news-hotfix.js
          grep -q 'async function autoEditor' src/index-publication-news-hotfix.js
          grep -q 'cleanPublications' src/index-news-quality-v2.js
          grep -q 'quality:quarantine:articles' src/index-news-quality-v2.js

      - name: Deploy production portal and UI harmonizer
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy src/index-ui-harmonizer.js --config wrangler.dark-market.toml --name gnk-asg-direct-operator

      - name: Refresh public news immediately
        continue-on-error: true
        run: |
          sleep 12
          BASE="https://gnk-asg-direct-operator.beckuphome.workers.dev"
          code=$(curl --silent --show-error --location --request POST --output /tmp/news-refresh.json --write-out '%{http_code}' "$BASE/api/news-refresh")
          cat /tmp/news-refresh.json
          test "$code" = "200" -o "$code" = "429"

      - name: Verify Croatian and English production index
        run: |
          curl --fail --silent --show-error --location https://gnk-asg.hr/ > /tmp/index-hr.html
          curl --fail --silent --show-error --location https://gnk-asg.hr/en/ > /tmp/index-en.html
          grep -q 'Korporativni <span>ekosustav</span>' /tmp/index-hr.html
          grep -q 'Corporate <span>ecosystem</span>' /tmp/index-en.html
          grep -q 'PDF i Download centar' /tmp/index-hr.html
          grep -q 'PDF and Download centre' /tmp/index-en.html
          grep -q '33' /tmp/index-hr.html
          grep -q '12' /tmp/index-hr.html
          if grep -q 'Index /' /tmp/index-hr.html; then exit 1; fi
          if grep -q 'početna stranica' /tmp/index-hr.html; then exit 1; fi
          if grep -q 'Index /' /tmp/index-en.html; then exit 1; fi
          if grep -q 'home page' /tmp/index-en.html; then exit 1; fi
          if grep -q 'Živa probna verzija' /tmp/index-hr.html; then exit 1; fi
          if grep -q 'noindex,nofollow' /tmp/index-hr.html; then exit 1; fi

      - name: Verify base redesign asset
        if: always()
        run: curl --fail --silent --show-error --location https://gnk-asg.hr/assets/index-redesign-production.css | grep -q 'quick-grid'

      - name: Verify IQ200 index assets
        if: always()
        run: |
          curl --fail --silent --show-error --location https://gnk-asg.hr/assets/index-iq200.css | grep -q 'GNK ASG INDEX IQ200'
          curl --fail --silent --show-error --location https://gnk-asg.hr/assets/index-iq200.js | grep -q 'hero-network-canvas'

      - name: Verify backend shell assets
        if: always()
        run: |
          curl --fail --silent --show-error --location https://gnk-asg.hr/assets/backend-ui-shell.css | grep -q 'SHARED BACKEND UI SHELL'
          curl --fail --silent --show-error --location https://gnk-asg.hr/assets/backend-ui-shell.js | grep -q 'gnk-backend-shell'
          curl --fail --silent --show-error --location https://gnk-asg.hr/assets/gnk-asg-ai-layer.css | grep -q 'backend-ui-shell.css'

      - name: Verify data endpoints
        if: always()
        run: |
          curl --fail --silent --show-error --location https://gnk-asg.hr/data/group_network.json | python -m json.tool > /dev/null
          curl --fail --silent --show-error --location https://gnk-asg.hr/api/market | python -m json.tool > /dev/null

      - name: Verify Operator Dashboard premium design chain
        if: always()
        run: |
          curl --fail --silent --show-error --location https://gnk-asg.hr/operator-dashboard/ > /tmp/operator-dashboard.html
          grep -q 'gnk-asg-ai-layer.css' /tmp/operator-dashboard.html
          grep -q 'gnk-asg-global-layer.css' /tmp/operator-dashboard.html
          grep -q 'gnk-asg-global-layer.js' /tmp/operator-dashboard.html

      - name: Verify Mobile Admin shell
        if: always()
        run: curl --fail --silent --show-error --location https://gnk-asg.hr/operator-mobile/ | grep -q 'backend-ui-shell.css'

      - name: Verify Mail Studio shell
        if: always()
        run: curl --fail --silent --show-error --location https://gnk-asg.hr/mail-studio/ | grep -q 'backend-ui-shell.css'

      - name: Verify public routes and protected modules remain available
        if: always()
        run: |
          for url in \
            https://gnk-asg.hr/trzista/ \
            https://gnk-asg.hr/markets/ \
            https://gnk-asg.hr/objave/ \
            https://gnk-asg.hr/publications/ \
            https://gnk-asg.hr/vijesti/ \
            https://gnk-asg.hr/news/ \
            https://gnk-asg.hr/visual-index/ \
            https://gnk-asg.hr/assistant/ \
            https://gnk-asg.hr/en/assistant/ \
            https://gnk-asg.hr/legal/ \
            https://gnk-asg.hr/en/legal/ \
            https://gnk-asg.hr/contact/ \
            https://gnk-asg.hr/app/ \
            https://gnk-asg.hr/operator-dashboard/ \
            https://gnk-asg.hr/operator-mobile/ \
            https://gnk-asg.hr/mail-studio/
          do
            code=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --retry 3 --retry-all-errors "$url")
            echo "$code $url"
            test "$code" = "200"
          done

# IQ200 graphics and unified backend visual standard. Backend business logic remains unchanged.
