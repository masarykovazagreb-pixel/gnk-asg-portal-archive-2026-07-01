name: Dark Menu and Market Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "workers/gnk-asg-direct-operator/src/index-dark-market-recovery.js"
      - "workers/gnk-asg-direct-operator/src/index-public-page-routes.js"
      - "workers/gnk-asg-direct-operator/wrangler.dark-market.toml"
      - "apps/portal/trzista/index.html"
      - "apps/portal/assets/app.js"
      - "apps/portal/assets/menu-deduplicate.js"
      - "apps/portal/auto-editor/index.html"
      - "apps/portal/media-kit/index.html"
      - ".github/workflows/dark-menu-market-recovery.yml"
  pull_request:
    branches:
      - main
    paths:
      - "workers/gnk-asg-direct-operator/src/index-dark-market-recovery.js"
      - "workers/gnk-asg-direct-operator/src/index-public-page-routes.js"
      - "workers/gnk-asg-direct-operator/wrangler.dark-market.toml"
      - "apps/portal/trzista/index.html"
      - "apps/portal/assets/app.js"
      - "apps/portal/assets/menu-deduplicate.js"
      - "apps/portal/auto-editor/index.html"
      - "apps/portal/media-kit/index.html"
      - ".github/workflows/dark-menu-market-recovery.yml"

concurrency:
  group: gnk-asg-dark-menu-market-recovery
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate portal package and limited routes
        working-directory: workers/gnk-asg-direct-operator
        run: |
          node --check src/index-dark-market-recovery.js
          node --check src/index-public-page-routes.js
          grep -q 'main = "src/index-public-page-routes.js"' wrangler.dark-market.toml
          grep -q 'assets/app.js' ../../apps/portal/index.html
          grep -q 'assets/app.js' ../../apps/portal/en/index.html
          grep -q 'menu-deduplicate.js' ../../apps/portal/assets/app.js
          grep -q 'AUTO_EDITOR_HTML' src/index-public-page-routes.js
          grep -q 'MEDIA_KIT_HTML' src/index-public-page-routes.js
          grep -q 'Auto Editor feeda' src/index-public-page-routes.js
          grep -q 'Službeni medijski resursi' src/index-public-page-routes.js
          grep -q 'isInstallDuplicate' ../../apps/portal/assets/menu-deduplicate.js
          grep -q 'isMediaKit' ../../apps/portal/assets/menu-deduplicate.js
          node --check ../../apps/portal/assets/app.js
          node --check ../../apps/portal/assets/menu-deduplicate.js

      - name: Deploy direct operator only
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.dark-market.toml

      - name: Verify menu cleanup assets
        run: |
          sleep 12
          curl --fail --silent --show-error --location https://gnk-asg.hr/assets/app.js | grep -q 'menu-deduplicate.js'
          curl --fail --silent --show-error --location https://gnk-asg.hr/assets/menu-deduplicate.js | grep -q 'isInstallDuplicate'
          curl --fail --silent --show-error --location https://gnk-asg.hr/assets/menu-deduplicate.js | grep -q 'isMediaKit'

      - name: Auto Editor HTTP 200
        if: always()
        run: |
          code=$(curl --silent --show-error --location --output /tmp/auto-editor.html --dump-header /tmp/auto-editor.headers --write-out '%{http_code}' https://gnk-asg.hr/auto-editor/)
          echo "$code"
          test "$code" = "200"

      - name: Auto Editor wrapper header
        if: always()
        run: grep -qi '^x-gnk-asg-public-page-routes: GNK_ASG_PUBLIC_PAGE_ROUTES_V4' /tmp/auto-editor.headers

      - name: Auto Editor content marker
        if: always()
        run: grep -q 'Auto Editor feeda' /tmp/auto-editor.html

      - name: Media Kit HTTP 200
        if: always()
        run: |
          code=$(curl --silent --show-error --location --output /tmp/media-kit.html --dump-header /tmp/media-kit.headers --write-out '%{http_code}' https://gnk-asg.hr/media-kit/)
          echo "$code"
          test "$code" = "200"

      - name: Media Kit wrapper header
        if: always()
        run: grep -qi '^x-gnk-asg-public-page-routes: GNK_ASG_PUBLIC_PAGE_ROUTES_V4' /tmp/media-kit.headers

      - name: Media Kit content marker
        if: always()
        run: grep -q 'Službeni medijski resursi' /tmp/media-kit.html

      - name: Auto Editor feed
        if: always()
        run: |
          code=$(curl --silent --show-error --location --output /tmp/auto-editor.json --write-out '%{http_code}' https://gnk-asg.hr/data/auto-editor.json)
          echo "$code"
          test "$code" = "200"
          grep -q 'articles' /tmp/auto-editor.json

      - name: Core public routes
        if: always()
        run: |
          for url in \
            https://gnk-asg.hr/ \
            https://gnk-asg.hr/en/ \
            https://gnk-asg.hr/trzista/ \
            https://gnk-asg.hr/markets/ \
            https://gnk-asg.hr/vijesti/ \
            https://gnk-asg.hr/news/ \
            https://gnk-asg.hr/objave/ \
            https://gnk-asg.hr/publications/ \
            https://gnk-asg.hr/assistant/ \
            https://gnk-asg.hr/legal/ \
            https://gnk-asg.hr/contact/ \
            https://gnk-asg.hr/operator-dashboard/ \
            https://gnk-asg.hr/api/market
          do
            code=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --retry 3 --retry-all-errors "$url")
            echo "$code $url"
            test "$code" = "200"
          done

# Split diagnostics for public menu routes: 2026-06-23
