name: Dark Menu and Market Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "workers/gnk-asg-direct-operator/src/index-dark-market-recovery.js"
      - "workers/gnk-asg-direct-operator/wrangler.dark-market.toml"
      - "apps/portal/trzista/index.html"
      - ".github/workflows/dark-menu-market-recovery.yml"
  pull_request:
    branches:
      - main
    paths:
      - "workers/gnk-asg-direct-operator/src/index-dark-market-recovery.js"
      - "workers/gnk-asg-direct-operator/wrangler.dark-market.toml"
      - "apps/portal/trzista/index.html"
      - ".github/workflows/dark-menu-market-recovery.yml"

concurrency:
  group: gnk-asg-dark-menu-market-recovery
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate full globe portal package
        working-directory: workers/gnk-asg-direct-operator
        run: |
          node --check src/index-dark-market-recovery.js
          grep -q 'main = "src/index-dark-market-recovery.js"' wrangler.dark-market.toml
          grep -q 'assets/app.js' ../../apps/portal/index.html
          grep -q 'assets/app.js' ../../apps/portal/en/index.html
          grep -q 'group-network.js' ../../apps/portal/assets/app.js
          grep -q 'group-globe-3d.js' ../../apps/portal/assets/app.js
          grep -q 'Tržišta i referentna imovina' ../../apps/portal/trzista/index.html
          node --check ../../apps/portal/assets/app.js
          node --check ../../apps/portal/assets/group-network.js
          node --check ../../apps/portal/assets/group-globe-3d.js

      - name: Deploy direct operator only
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.dark-market.toml

      - name: Verify globe portal and public routes
        run: |
          sleep 12
          curl --silent --show-error --location https://gnk-asg.hr/ | grep -q 'assets/app.js'
          curl --silent --show-error --location https://gnk-asg.hr/en/ | grep -q 'assets/app.js'
          curl --silent --show-error --location https://gnk-asg.hr/assets/app.js | grep -q 'group-network.js'
          curl --silent --show-error --location https://gnk-asg.hr/assets/app.js | grep -q 'group-globe-3d.js'
          curl --silent --show-error --location https://gnk-asg.hr/assets/group-network.js | grep -q 'global-network'
          curl --silent --show-error --location https://gnk-asg.hr/assets/group-globe-3d.js | grep -q 'globe-panel'
          curl --silent --show-error --location https://gnk-asg.hr/trzista/ | grep -q 'Tržišta i referentna imovina'
          if curl --silent --show-error --location https://gnk-asg.hr/trzista/ | grep -Eq 'TrÅ|PoÄ|RuÄ|UÄ|AÅ|GreÅ|â€¦|â€”'; then
            echo "Oštećeni UTF-8 znakovi još su prisutni na /trzista/."
            exit 1
          fi
          for url in \
            https://gnk-asg.hr/ \
            https://gnk-asg.hr/en/ \
            https://gnk-asg.hr/trzista/ \
            https://gnk-asg.hr/markets/ \
            https://gnk-asg.hr/vijesti/ \
            https://gnk-asg.hr/news/ \
            https://gnk-asg.hr/objave/ \
            https://gnk-asg.hr/publications/ \
            https://gnk-asg.hr/assistant/ \
            https://gnk-asg.hr/en/assistant/ \
            https://gnk-asg.hr/legal/ \
            https://gnk-asg.hr/en/legal/ \
            https://gnk-asg.hr/contact/ \
            https://gnk-asg.hr/operator-dashboard/ \
            https://gnk-asg.hr/api/market
          do
            code=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --retry 3 --retry-all-errors "$url")
            echo "$code $url"
            test "$code" = "200"
          done

# Frontend UTF-8 deploy trigger for /trzista/: 2026-06-23
