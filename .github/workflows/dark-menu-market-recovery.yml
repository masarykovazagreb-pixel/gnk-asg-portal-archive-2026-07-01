name: Dark Menu and Market Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "workers/gnk-asg-direct-operator/src/index-dark-market-recovery.js"
      - "workers/gnk-asg-direct-operator/wrangler.dark-market.toml"
      - ".github/workflows/dark-menu-market-recovery.yml"
  pull_request:
    branches:
      - main
    paths:
      - "workers/gnk-asg-direct-operator/src/index-dark-market-recovery.js"
      - "workers/gnk-asg-direct-operator/wrangler.dark-market.toml"
      - ".github/workflows/dark-menu-market-recovery.yml"

concurrency:
  group: gnk-asg-dark-menu-market-recovery
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate isolated recovery entry
        run: |
          node --check workers/gnk-asg-direct-operator/src/index-dark-market-recovery.js
          grep -q 'main = "src/index-dark-market-recovery.js"' workers/gnk-asg-direct-operator/wrangler.dark-market.toml

      - name: Deploy stable direct operator
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.dark-market.toml

  diagnose:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect active public routing
        shell: bash
        run: |
          set -euo pipefail
          sleep 12
          curl --silent --show-error --location --dump-header en.headers --output en.html https://gnk-asg.hr/en/
          echo '--- RESPONSE HEADERS ---'
          cat en.headers
          echo '--- MENU TARGETS ---'
          grep -oE 'href="[^"]+"[^>]*>[^<]*(Markets|Insights|News|AI Help|Legal|Contact|Admin)' en.html | head -n 20 || true
          echo '--- OBJAVE/PUBLICATIONS REFERENCES ---'
          grep -oE 'https://gnk-asg.hr/(objave|publications)/|href="/(objave|publications)/"|value="/(objave|publications)/"' en.html | sort -u || true
          echo '--- ROUTE STATUS ---'
          for url in \
            https://gnk-asg.hr/markets/ \
            https://gnk-asg.hr/news/ \
            https://gnk-asg.hr/en/assistant/ \
            https://gnk-asg.hr/en/legal/ \
            https://gnk-asg.hr/publications/ \
            https://gnk-asg.hr/api/market
          do
            code=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "$url")
            echo "$code $url"
          done
