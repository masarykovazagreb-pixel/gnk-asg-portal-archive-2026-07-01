name: Production Index and Content Automation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/portal/**"
      - "scripts/generate_media_kit_pdfs.py"
      - "workers/gnk-asg-direct-operator/src/index-ui-harmonizer.js"
      - "workers/gnk-asg-direct-operator/src/index-news-quality-v2.js"
      - "workers/gnk-asg-direct-operator/src/index-dark-market-recovery.js"
      - "workers/gnk-asg-direct-operator/src/index-publication-news-hotfix.js"
      - "workers/gnk-asg-direct-operator/wrangler.dark-market.toml"
      - ".github/workflows/dark-menu-market-recovery.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/portal/**"
      - "scripts/generate_media_kit_pdfs.py"
      - "workers/gnk-asg-direct-operator/src/index-ui-harmonizer.js"
      - "workers/gnk-asg-direct-operator/src/index-news-quality-v2.js"
      - "workers/gnk-asg-direct-operator/src/index-dark-market-recovery.js"
      - "workers/gnk-asg-direct-operator/src/index-publication-news-hotfix.js"
      - "workers/gnk-asg-direct-operator/wrangler.dark-market.toml"
      - ".github/workflows/dark-menu-market-recovery.yml"

concurrency:
  group: gnk-asg-production-index-and-content
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate and validate public PDF package
        run: |
          python -m py_compile scripts/generate_media_kit_pdfs.py
          python scripts/generate_media_kit_pdfs.py
          test -s apps/portal/downloads/GNK_ASG_GNK_DINAMO_Ltd_Media_Kit_2_HR.pdf
          test -s apps/portal/downloads/GNK_ASG_GNK_DINAMO_LTD_MEDIA_KIT_EN.pdf
          head -c 8 apps/portal/downloads/GNK_ASG_GNK_DINAMO_Ltd_Media_Kit_2_HR.pdf | grep -q '%PDF-1.'
          head -c 8 apps/portal/downloads/GNK_ASG_GNK_DINAMO_LTD_MEDIA_KIT_EN.pdf | grep -q '%PDF-1.'

      - name: Validate production index package
        working-directory: workers/gnk-asg-direct-operator
        run: |
          node --check ../../apps/portal/assets/index-redesign-production.js
          node --check ../../apps/portal/assets/index-iq200.js
          node --check ../../apps/portal/assets/visual-quality-v2.js
          node --check ../../apps/portal/assets/document-center-v2.js
          node --check ../../apps/portal/assets/contact-quality-v2.js
          node --check ../../apps/portal/assets/backend-ui-shell.js
          node --check ../../apps/portal/assets/brand/gnk-asg-global-layer.js
          node --check ../../apps/portal/assets/gallery-bootstrap.js
          node --check ../../apps/portal/the-code/assets/the-code.js
          node --check src/index-ui-harmonizer.js
          test -f ../../apps/portal/assets/index-redesign-production.css
          test -f ../../apps/portal/assets/index-iq200.css
          test -f ../../apps/portal/assets/visual-quality-v2.css
          test -f ../../apps/portal/assets/visual-quality-v2.js
          test -f ../../apps/portal/assets/document-center-v2.js
          test -f ../../apps/portal/assets/contact-quality-v2.css
          test -f ../../apps/portal/assets/contact-quality-v2.js
          test -f ../../apps/portal/assets/backend-ui-shell.css
          test -f ../../apps/portal/assets/gnk-asg-ai-layer.css
          test -f ../../apps/portal/assets/brand/gnk-asg-global-layer.css
          test -f ../../apps/portal/assets/brand/gnk-asg-global-layer.js
          test -f ../../apps/portal/assets/the-code-index-slot.css
          test -s ../../apps/portal/assets/the-code-visual-01.b64
          test -s ../../apps/portal/assets/the-code-visual-02.b64
          test -f ../../apps/portal/the-code/index.html
          test -f ../../apps/portal/the-code/assets/the-code.css
          test -f ../../apps/portal/the-code/assets/the-code.js
          test -f ../../apps/portal/downloads/index.html
          test -f ../../apps/portal/en/downloads/index.html
          test -f ../../apps/portal/contact/index.html
          test -f ../../apps/portal/en/contact/index.html
          test -f ../../apps/portal/app/index.html
          test -f ../../apps/portal/operator-mobile/index.html
          grep -q 'Korporativni portal GNK ASG' ../../apps/portal/index.html
          grep -q 'Corporate portal for GNK ASG' ../../apps/portal/en/index.html
          grep -q '33 postojeće' ../../apps/portal/index.html
          grep -q '12 pozicija' ../../apps/portal/index.html
          grep -q 'PDF i Download centar' ../../apps/portal/index.html
          grep -q 'Media Kit' ../../apps/portal/index.html
          grep -q 'GNK_ASG_GNK_DINAMO_LTD_MEDIA_KIT_EN.pdf' ../../apps/portal/downloads/index.html
          grep -q 'GNK_ASG_GNK_DINAMO_Ltd_Media_Kit_2_HR.pdf' ../../apps/portal/en/downloads/index.html
          grep -q 'Contact and secure communication' ../../apps/portal/en/contact/index.html
          grep -q '/operator-dashboard/' ../../apps/portal/index.html
          grep -q '/mail-studio/' ../../apps/portal/index.html
          grep -q '/contact/' ../../apps/portal/index.html
          grep -q '/api/market' ../../apps/portal/assets/index-redesign-production.js
          grep -q '/data/news.json' ../../apps/portal/assets/index-redesign-production.js
          grep -q '/data/group_network.json' ../../apps/portal/assets/index-redesign-production.js
          grep -q '/data/auto-editor.json' ../../apps/portal/assets/index-redesign-production.js
          grep -q 'the-code-visual-01.b64' ../../apps/portal/assets/gallery-bootstrap.js
          grep -q 'the-code-visual-02.b64' ../../apps/portal/assets/gallery-bootstrap.js
          grep -q 'gnkCodeVisualOne' ../../apps/portal/assets/the-code-index-slot.css
          grep -q 'data-gnk-code-enter' ../../apps/portal/the-code/index.html
          grep -q 'targetUtc' ../../apps/portal/the-code/assets/the-code.js
          grep -q 'visual-quality-v2.js' src/index-ui-harmonizer.js
          grep -q 'contact-quality-v2.js' src/index-ui-harmonizer.js
          grep -q '__GNK_ASG_VISUAL_QUALITY_V2__' ../../apps/portal/assets/visual-quality-v2.js
          grep -q '__GNK_ASG_DOCUMENT_CENTER_V2__' ../../apps/portal/assets/document-center-v2.js
          grep -q '__GNK_ASG_CONTACT_V2__' ../../apps/portal/assets/contact-quality-v2.js
          grep -q 'hero-network-canvas' ../../apps/portal/assets/index-iq200.js
          grep -q 'iq-globe-canvas' ../../apps/portal/assets/visual-quality-v2.js
          grep -q 'PDF / Media' ../../apps/portal/assets/backend-ui-shell.js
          grep -q 'gnk-backend-shell' ../../apps/portal/assets/backend-ui-shell.js
          grep -q 'backend-ui-shell.css' ../../apps/portal/assets/gnk-asg-ai-layer.css
          grep -q '__GNK_ASG_PREMIUM_V3__' ../../apps/portal/assets/brand/gnk-asg-global-layer.js
          grep -q 'BACKEND_ASSETS' src/index-ui-harmonizer.js
          grep -q 'CONTACT_ASSETS' src/index-ui-harmonizer.js
          if grep -q 'noindex,nofollow' ../../apps/portal/index.html; then exit 1; fi
          if grep -q 'Živa probna verzija' ../../apps/portal/index.html; then exit 1; fi

      - name: Validate content automation package
        working-directory: workers/gnk-asg-direct-operator
        run: |
          node --check src/index-news-quality-v2.js
          node --check src/index-dark-market-recovery.js
          node --check src/index-publication-news-hotfix.js
          grep -q 'crons = \["0 \* \* \* \*"\]' wrangler.dark-market.toml
          grep -q 'hour%3===0' src/index-publication-news-hotfix.js
          grep -q 'async function refreshNews' src/index-publication-news-hotfix.js
          grep -q 'async function autoEditor' src/index-publication-news-hotfix.js
          grep -q 'cleanPublications' src/index-news-quality-v2.js
          grep -q 'quality:quarantine:articles' src/index-news-quality-v2.js

      - name: Deploy production portal and UI harmonizer
        if: github.event_name != 'pull_request'
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy src/index-ui-harmonizer.js --config wrangler.dark-market.toml --name gnk-asg-direct-operator

      - name: Refresh public news immediately
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          sleep 12
          BASE="https://gnk-asg-direct-operator.beckuphome.workers.dev"
          code=$(curl --silent --show-error --location --request POST --output /tmp/news-refresh.json --write-out '%{http_code}' "$BASE/api/news-refresh")
          cat /tmp/news-refresh.json
          test "$code" = "200" -o "$code" = "429"

      - name: Verify Croatian and English production index
        if: github.event_name != 'pull_request'
        run: |
          curl --fail --silent --show-error --location https://gnk-asg.hr/ > /tmp/index-hr.html
          curl --fail --silent --show-error --location https://gnk-asg.hr/en/ > /tmp/index-en.html
          grep -q 'visual-quality-v2.js' /tmp/index-hr.html
          grep -q 'visual-quality-v2.js' /tmp/index-en.html
          grep -q 'gallery-bootstrap.js' /tmp/index-hr.html
          grep -q 'gallery-bootstrap.js' /tmp/index-en.html
          grep -q 'PDF i Download centar' /tmp/index-hr.html
          grep -q 'PDF and Download centre' /tmp/index-en.html
          if grep -q 'Index /' /tmp/index-hr.html; then exit 1; fi
          if grep -q 'početna stranica' /tmp/index-hr.html; then exit 1; fi
          if grep -q 'Index /' /tmp/index-en.html; then exit 1; fi
          if grep -q 'home page' /tmp/index-en.html; then exit 1; fi
          if grep -q 'Živa probna verzija' /tmp/index-hr.html; then exit 1; fi
          if grep -q 'noindex,nofollow' /tmp/index-hr.html; then exit 1; fi

      - name: Verify visual, backend, contact and THE CODE assets
        if: ${{ github.event_name != 'pull_request' && always() }}
        run: |
          curl --fail --silent --show-error --location https://gnk-asg.hr/assets/index-iq200.css | grep -q 'GNK ASG INDEX IQ200'
          curl --fail --silent --show-error --location https://gnk-asg.hr/assets/visual-quality-v2.js | grep -q '__GNK_ASG_VISUAL_QUALITY_V2__'
          curl --fail --silent --show-error --location https://gnk-asg.hr/assets/document-center-v2.js | grep -q '__GNK_ASG_DOCUMENT_CENTER_V2__'
          curl --fail --silent --show-error --location https://gnk-asg.hr/assets/contact-quality-v2.js | grep -q '__GNK_ASG_CONTACT_V2__'
          curl --fail --silent --show-error --location https://gnk-asg.hr/assets/backend-ui-shell.css | grep -q 'SHARED BACKEND UI SHELL V2'
          curl --fail --silent --show-error --location https://gnk-asg.hr/assets/backend-ui-shell.js | grep -q '__GNK_ASG_BACKEND_SHELL_V2__'
          curl --fail --silent --show-error --location https://gnk-asg.hr/assets/gnk-asg-ai-layer.css | grep -q 'backend-ui-shell.css'
          curl --fail --silent --show-error --location https://gnk-asg.hr/assets/brand/gnk-asg-global-layer.js | grep -q '__GNK_ASG_PREMIUM_V3__'
          curl --fail --silent --show-error --location "https://gnk-asg.hr/assets/gallery-bootstrap.js?cb=${{ github.run_id }}" | grep -q 'the-code-visual-02.b64'
          curl --fail --silent --show-error --location "https://gnk-asg.hr/assets/the-code-index-slot.css?cb=${{ github.run_id }}" | grep -q 'gnkCodeVisualTwo'
          curl --fail --silent --show-error --location "https://gnk-asg.hr/the-code/?cb=${{ github.run_id }}" | grep -q 'data-gnk-code-enter'
          curl --fail --silent --show-error --location "https://gnk-asg.hr/the-code/assets/the-code.js?cb=${{ github.run_id }}" | grep -q 'targetUtc'
          test "$(curl --fail --silent --show-error --location "https://gnk-asg.hr/assets/the-code-visual-01.b64?cb=${{ github.run_id }}" | head -c 5)" = "UklGR"
          test "$(curl --fail --silent --show-error --location "https://gnk-asg.hr/assets/the-code-visual-02.b64?cb=${{ github.run_id }}" | head -c 5)" = "UklGR"

      - name: Verify data endpoints
        if: ${{ github.event_name != 'pull_request' && always() }}
        run: |
          curl --fail --silent --show-error --location https://gnk-asg.hr/data/group_network.json | python -m json.tool > /dev/null
          curl --fail --silent --show-error --location https://gnk-asg.hr/api/market | python -m json.tool > /dev/null

      - name: Verify Operator Dashboard premium design chain
        if: ${{ github.event_name != 'pull_request' && always() }}
        run: |
          curl --fail --silent --show-error --location "https://gnk-asg.hr/operator-dashboard/?cb=${{ github.run_id }}" > /tmp/operator-dashboard.html
          grep -q 'gnk-asg-ai-layer.css' /tmp/operator-dashboard.html
          grep -q 'gnk-asg-global-layer.css' /tmp/operator-dashboard.html
          grep -q 'gnk-asg-global-layer.js' /tmp/operator-dashboard.html
          grep -q 'backend-ui-shell.js' /tmp/operator-dashboard.html

      - name: Verify contact and download centre
        if: ${{ github.event_name != 'pull_request' && always() }}
        run: |
          curl --fail --silent --show-error --location "https://gnk-asg.hr/contact/?cb=${{ github.run_id }}" | grep -q 'contact-quality-v2.js'
          curl --fail --silent --show-error --location https://gnk-asg.hr/en/contact/ | grep -q 'Contact and secure communication'
          curl --fail --silent --show-error --location https://gnk-asg.hr/downloads/ | grep -q 'GNK_ASG_GNK_DINAMO_LTD_MEDIA_KIT_EN.pdf'
          curl --fail --silent --show-error --location https://gnk-asg.hr/en/downloads/ | grep -q 'GNK_ASG_GNK_DINAMO_Ltd_Media_Kit_2_HR.pdf'
          curl --fail --silent --show-error --location https://gnk-asg.hr/downloads/GNK_ASG_GNK_DINAMO_Ltd_Media_Kit_2_HR.pdf | head -c 8 | grep -q '%PDF-1.'
          curl --fail --silent --show-error --location https://gnk-asg.hr/downloads/GNK_ASG_GNK_DINAMO_LTD_MEDIA_KIT_EN.pdf | head -c 8 | grep -q '%PDF-1.'

      - name: Verify Mobile Admin shell
        if: ${{ github.event_name != 'pull_request' && always() }}
        run: curl --fail --silent --show-error --location "https://gnk-asg.hr/operator-mobile/?cb=${{ github.run_id }}" | grep -q 'backend-ui-shell.css'

      - name: Verify Mail Studio shell
        if: ${{ github.event_name != 'pull_request' && always() }}
        run: curl --fail --silent --show-error --location "https://gnk-asg.hr/mail-studio/?cb=${{ github.run_id }}" | grep -q 'backend-ui-shell.css'

      - name: Verify public routes and protected modules remain available
        if: ${{ github.event_name != 'pull_request' && always() }}
        run: |
          for url in \
            https://gnk-asg.hr/trzista/ \
            https://gnk-asg.hr/markets/ \
            https://gnk-asg.hr/objave/ \
            https://gnk-asg.hr/publications/ \
            https://gnk-asg.hr/vijesti/ \
            https://gnk-asg.hr/news/ \
            https://gnk-asg.hr/visual-index/ \
            https://gnk-asg.hr/assistant/ \
            https://gnk-asg.hr/en/assistant/ \
            https://gnk-asg.hr/legal/ \
            https://gnk-asg.hr/en/legal/ \
            https://gnk-asg.hr/contact/ \
            https://gnk-asg.hr/en/contact/ \
            https://gnk-asg.hr/downloads/ \
            https://gnk-asg.hr/en/downloads/ \
            https://gnk-asg.hr/app/ \
            https://gnk-asg.hr/the-code/ \
            https://gnk-asg.hr/operator-dashboard/ \
            https://gnk-asg.hr/operator-mobile/ \
            https://gnk-asg.hr/mail-studio/
          do
            code=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --retry 3 --retry-all-errors "$url")
            echo "$code $url"
            test "$code" = "200"
          done

# Pull requests validate only. Production deploy and live smoke tests run on main or workflow_dispatch.
