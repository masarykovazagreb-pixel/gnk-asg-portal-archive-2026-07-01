name: Final IQ200 and Admin Center Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/portal/admin-center/**"
      - "apps/portal/operator-mobile/**"
      - "apps/portal/assets/index-iq200.css"
      - "apps/portal/assets/index-iq200.js"
      - "apps/portal/assets/backend-ui-shell.css"
      - "apps/portal/assets/backend-ui-shell.js"
      - "apps/portal/assets/gnk-asg-ai-layer.css"
      - "apps/portal/assets/admin-route-bridge.js"
      - "workers/gnk-asg-direct-operator/src/index-ui-harmonizer.js"
      - ".github/workflows/dark-menu-market-recovery.yml"

concurrency:
  group: gnk-asg-final-iq200-admin-center
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate source package
        working-directory: workers/gnk-asg-direct-operator
        run: |
          node --check src/index-ui-harmonizer.js
          node --check ../../apps/portal/assets/index-iq200.js
          node --check ../../apps/portal/assets/backend-ui-shell.js
          node --check ../../apps/portal/assets/admin-route-bridge.js
          test -f ../../apps/portal/admin-center/index.html
          test -f ../../apps/portal/assets/index-iq200.css
          test -f ../../apps/portal/assets/backend-ui-shell.css
          test -f ../../apps/portal/assets/gnk-asg-ai-layer.css
          grep -q 'Korporativni <span>ekosustav</span>' src/index-ui-harmonizer.js
          grep -q 'Corporate <span>ecosystem</span>' src/index-ui-harmonizer.js
          grep -q '/assets/admin-route-bridge.js' src/index-ui-harmonizer.js
          grep -q '/admin-center/' ../../apps/portal/assets/backend-ui-shell.js
          grep -q '/admin-center/' ../../apps/portal/operator-mobile/index.html
          grep -q '/operator-dashboard/?embedded=1' ../../apps/portal/admin-center/index.html
          grep -q 'backend-ui-shell.css' ../../apps/portal/assets/gnk-asg-ai-layer.css

      - name: Deploy current portal UI layer
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy src/index-ui-harmonizer.js --config wrangler.dark-market.toml --name gnk-asg-direct-operator

      - name: Verify HR and EN IQ200 index
        run: |
          sleep 12
          curl --fail --silent --show-error --location https://gnk-asg.hr/ > /tmp/hr.html
          curl --fail --silent --show-error --location https://gnk-asg.hr/en/ > /tmp/en.html
          grep -q 'Korporativni <span>ekosustav</span>' /tmp/hr.html
          grep -q 'Corporate <span>ecosystem</span>' /tmp/en.html
          grep -q 'index-iq200.css' /tmp/hr.html
          grep -q 'admin-route-bridge.js' /tmp/hr.html
          ! grep -q 'Index /' /tmp/hr.html
          ! grep -q 'početna stranica' /tmp/hr.html
          ! grep -q 'Index /' /tmp/en.html
          ! grep -q 'home page' /tmp/en.html

      - name: Verify IQ200 and backend assets
        run: |
          curl --fail --silent --show-error --location https://gnk-asg.hr/assets/index-iq200.css | grep -q 'GNK ASG INDEX IQ200'
          curl --fail --silent --show-error --location https://gnk-asg.hr/assets/index-iq200.js | grep -q 'hero-network-canvas'
          curl --fail --silent --show-error --location https://gnk-asg.hr/assets/backend-ui-shell.css | grep -q 'gnk-asg-admin-page'
          curl --fail --silent --show-error --location https://gnk-asg.hr/assets/backend-ui-shell.js | grep -q '/admin-center/'
          curl --fail --silent --show-error --location https://gnk-asg.hr/assets/gnk-asg-ai-layer.css | grep -q 'backend-ui-shell.css'
          curl --fail --silent --show-error --location https://gnk-asg.hr/assets/admin-route-bridge.js | grep -q '/admin-center/'

      - name: Verify unified Admin Center
        run: |
          curl --fail --silent --show-error --location https://gnk-asg.hr/admin-center/ > /tmp/admin-center.html
          grep -q 'GNK ASG Admin Center' /tmp/admin-center.html
          grep -q 'backend-ui-shell.css' /tmp/admin-center.html
          grep -q 'backend-ui-shell.js' /tmp/admin-center.html
          grep -q '/operator-dashboard/?embedded=1' /tmp/admin-center.html
          code=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' https://gnk-asg.hr/operator-dashboard/)
          test "$code" = "200"

      - name: Verify Mobile Admin and Mail Center
        run: |
          curl --fail --silent --show-error --location https://gnk-asg.hr/operator-mobile/ > /tmp/mobile.html
          grep -q '/admin-center/?mobile=1' /tmp/mobile.html
          curl --fail --silent --show-error --location https://gnk-asg.hr/mail-studio/ > /tmp/mail.html
          grep -q 'backend-ui-shell.css' /tmp/mail.html

      - name: Verify protected and public routes
        run: |
          for url in \
            https://gnk-asg.hr/ \
            https://gnk-asg.hr/en/ \
            https://gnk-asg.hr/admin-center/ \
            https://gnk-asg.hr/operator-dashboard/ \
            https://gnk-asg.hr/operator-mobile/ \
            https://gnk-asg.hr/mail-studio/ \
            https://gnk-asg.hr/contact/ \
            https://gnk-asg.hr/objave/ \
            https://gnk-asg.hr/vijesti/ \
            https://gnk-asg.hr/trzista/
          do
            code=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --retry 3 --retry-all-errors "$url")
            echo "$code $url"
            test "$code" = "200"
          done
