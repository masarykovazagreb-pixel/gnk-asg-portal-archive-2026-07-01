name: Visible Mail Session Repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate session worker from main
        working-directory: workers/gnk-asg-direct-operator
        run: |
          node --check src/index-ui-harmonizer.js
          grep -q "operator/session/login" src/index-ui-harmonizer.js
          grep -q "operator/session/status" src/index-ui-harmonizer.js
          grep -q "gnk_asg_admin_session" src/index-ui-harmonizer.js
      - name: Deploy session routes from main
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy src/index-ui-harmonizer.js --config wrangler.dark-market.toml --name gnk-asg-direct-operator
      - name: Verify production session routes
        run: |
          sleep 10
          status_code=$(curl --silent --show-error --output status.json --write-out '%{http_code}' 'https://gnk-asg.hr/operator/session/status')
          login_code=$(curl --silent --show-error --output login.html --write-out '%{http_code}' 'https://gnk-asg.hr/operator/session/login?next=%2Fmail-studio%2F')
          echo "SESSION_STATUS_HTTP=$status_code"
          cat status.json
          echo "SESSION_LOGIN_HTTP=$login_code"
          grep -q 'Operatorski token' login.html
          test "$status_code" = "200"
          test "$login_code" = "401"
