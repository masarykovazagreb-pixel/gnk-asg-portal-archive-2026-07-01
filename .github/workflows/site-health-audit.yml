name: Site Health & Speed Audit
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-health-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run site health audit
        env:
          SITE_BASE: 'https://gnk-asg.hr'
        run: node scripts/site-health-audit-v1.mjs
      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gnk-health-bot"
          git config user.email "actions@github.com"
          git add apps/portal/data/seo-audit
          if git diff --cached --quiet; then
            echo "Nema promjena u reportu."
            exit 0
          fi
          git commit -m "Site Health: refresh health+speed report"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            echo "Push odbijen (pokusaj $attempt) - main se pomaknuo, radim fetch+rebase."
            git fetch origin main
            git rebase origin/main || { echo "Rebase konflikt."; exit 1; }
            sleep $((attempt * 5))
            if [ "$attempt" = "5" ]; then echo "Push nije uspio nakon 5 pokusaja."; exit 1; fi
          done
      - name: Print summary
        if: always()
        run: |
          if [ -f apps/portal/data/seo-audit/health-report.json ]; then
            python3 -c "import json; d=json.load(open('apps/portal/data/seo-audit/health-report.json')); import sys; sys.stdout.write(json.dumps({'totals':d['totals'],'html':d['htmlChecks'],'failed':len(d['failedRoutes'])}, indent=2))"
          fi
