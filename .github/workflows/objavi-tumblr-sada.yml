name: Objavi na Tumblr sada (jednokratno)

on:
  workflow_dispatch:
    inputs:
      consumer_key: { required: true, type: string }
      consumer_secret: { required: true, type: string }
      token: { required: true, type: string }
      token_secret: { required: true, type: string }
      per_run: { required: false, type: string, default: '2' }

permissions:
  contents: write

jobs:
  objavi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Maskiraj
        run: |
          echo "::add-mask::${{ inputs.consumer_key }}"
          echo "::add-mask::${{ inputs.consumer_secret }}"
          echo "::add-mask::${{ inputs.token }}"
          echo "::add-mask::${{ inputs.token_secret }}"
      - name: Objavi
        env:
          TUMBLR_CONSUMER_KEY: ${{ inputs.consumer_key }}
          TUMBLR_CONSUMER_SECRET: ${{ inputs.consumer_secret }}
          TUMBLR_TOKEN: ${{ inputs.token }}
          TUMBLR_TOKEN_SECRET: ${{ inputs.token_secret }}
          TUMBLR_PER_RUN: ${{ inputs.per_run }}
        run: node scripts/tumblr-publish-v1.mjs --live
      - name: Commit evidencije objavljenog
        if: always()
        run: |
          git config user.name "gnk-asg-bot"
          git config user.email "it@gnk-asg.hr"
          git add apps/portal/data/tumblr-content/
          if git diff --cached --quiet; then
            echo "Nema promjena za commit."
            exit 0
          fi
          git commit -m "Tumblr: evidencija objavljenog (uklj. djelomican napredak/greske)"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Push uspio (pokusaj $attempt)."
              exit 0
            fi
            echo "Push odbijen (pokusaj $attempt) - main se pomaknuo, radim fetch+rebase i pokusavam ponovno."
            git fetch origin main
            git rebase origin/main || { echo "Rebase konflikt - zaustavljam se, evidencija ostaje u workflow logu."; exit 1; }
            sleep $((attempt * 5))
          done
          echo "Push nije uspio nakon 5 pokusaja."
          exit 1
