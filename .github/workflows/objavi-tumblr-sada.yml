name: Objavi na Tumblr sada (jednokratno)

on:
  workflow_dispatch:
    inputs:
      consumer_key: { required: true, type: string }
      consumer_secret: { required: true, type: string }
      token: { required: true, type: string }
      token_secret: { required: true, type: string }
      per_run: { required: false, type: string, default: '2' }

permissions:
  contents: write

concurrency:
  group: blog-mirror-publish
  cancel-in-progress: false

jobs:
  objavi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pripremi durable state bez pomicanja production maina
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gnk-asg-bot"
          git config user.email "it@gnk-asg.hr"
          git fetch origin main --no-tags
          git reset --hard origin/main
          git fetch origin automation/blog-mirror-state:refs/remotes/origin/automation/blog-mirror-state --no-tags 2>/dev/null || true
          remote_state_sha="$(git rev-parse refs/remotes/origin/automation/blog-mirror-state 2>/dev/null || true)"
          echo "BLOG_MIRROR_REMOTE_SHA=$remote_state_sha" >> "$GITHUB_ENV"
          git checkout -B automation/blog-mirror-state origin/main
          path='apps/portal/data/tumblr-content/published.json'
          tmp="${path}.state-tmp"
          if git show "refs/remotes/origin/automation/blog-mirror-state:${path}" > "$tmp" 2>/dev/null \
            && node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$tmp" 2>/dev/null; then
            mv "$tmp" "$path"
          else
            rm -f "$tmp"
          fi
      - name: Maskiraj
        run: |
          echo "::add-mask::${{ inputs.consumer_key }}"
          echo "::add-mask::${{ inputs.consumer_secret }}"
          echo "::add-mask::${{ inputs.token }}"
          echo "::add-mask::${{ inputs.token_secret }}"
      - name: Objavi
        env:
          TUMBLR_CONSUMER_KEY: ${{ inputs.consumer_key }}
          TUMBLR_CONSUMER_SECRET: ${{ inputs.consumer_secret }}
          TUMBLR_TOKEN: ${{ inputs.token }}
          TUMBLR_TOKEN_SECRET: ${{ inputs.token_secret }}
          TUMBLR_PER_RUN: ${{ inputs.per_run }}
        run: node scripts/tumblr-publish-v1.mjs --live
      - name: Spremi Tumblr evidenciju na durable state granu
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "automation/blog-mirror-state"
          git add apps/portal/data/tumblr-content/
          if git diff --cached --quiet; then
            echo "Nema promjena za spremanje."
            exit 0
          fi
          git commit -m "Tumblr: durable evidence sync"
          expected="${BLOG_MIRROR_REMOTE_SHA:-}"
          lease="--force-with-lease=refs/heads/automation/blog-mirror-state:${expected}"
          if git push "$lease" origin HEAD:automation/blog-mirror-state; then
            exit 0
          fi
          git fetch origin automation/blog-mirror-state:refs/remotes/origin/automation/blog-mirror-state --force --no-tags
          latest="$(git rev-parse refs/remotes/origin/automation/blog-mirror-state)"
          remote_tmp=/tmp/tumblr-published-remote.json
          if git show "refs/remotes/origin/automation/blog-mirror-state:apps/portal/data/tumblr-content/published.json" > "$remote_tmp" 2>/dev/null; then
            node - "$remote_tmp" apps/portal/data/tumblr-content/published.json <<'NODE'
          const fs=require('fs');
          const [remotePath,localPath]=process.argv.slice(2);
          const read=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return {posted:{}}}};
          const remote=read(remotePath), local=read(localPath);
          const merged={...remote,...local,posted:{...(remote.posted||{}),...(local.posted||{})}};
          fs.writeFileSync(localPath,JSON.stringify(merged,null,2)+'\n');
          NODE
          fi
          git add apps/portal/data/tumblr-content/
          git commit --amend --no-edit
          git push "--force-with-lease=refs/heads/automation/blog-mirror-state:${latest}" origin HEAD:automation/blog-mirror-state
