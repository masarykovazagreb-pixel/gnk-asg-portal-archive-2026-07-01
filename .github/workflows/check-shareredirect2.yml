name: Provjeri popravljeno preusmjeravanje v2
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p apps/portal/data/tmp-shareredirect2
          echo "=== 1 ===" > apps/portal/data/tmp-shareredirect2/r.txt
          curl -sI "https://gnk-asg.hr/podijeli/vijest/636e37167ca020b627/" >> apps/portal/data/tmp-shareredirect2/r.txt
          echo "=== 2 ===" >> apps/portal/data/tmp-shareredirect2/r.txt
          curl -sI "https://gnk-asg.hr/podijeli/vijest/5234604ad727046a92/" >> apps/portal/data/tmp-shareredirect2/r.txt
          cat apps/portal/data/tmp-shareredirect2/r.txt
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          BRANCH="shareredirect2-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-shareredirect2
          git commit -m "check"
          git push origin "$BRANCH"
