name: Deploy V21 Index Preview

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-public-shell-v15.yml'
      - 'apps/portal/assets/public-unified-v21.css'
      - 'apps/portal/assets/public-index-v21.css'
      - 'apps/portal/assets/public-shell-v21.js'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-public-shell-v15.yml'
      - 'apps/portal/assets/public-unified-v21.css'
      - 'apps/portal/assets/public-index-v21.css'
      - 'apps/portal/assets/public-shell-v21.js'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnk-asg-v21-index-preview
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate isolated V21 index preview
        shell: bash
        run: |
          set -euxo pipefail
          node --check apps/portal/assets/public-shell-v21.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js
          test -s apps/portal/assets/public-unified-v21.css
          test -s apps/portal/assets/public-index-v21.css
          grep -q 'GNK_ASG_PUBLIC_SHELL_V21_20260627' apps/portal/assets/public-shell-v21.js
          grep -q "editor:'Auto Editor'" apps/portal/assets/public-shell-v21.js
          grep -q "pdf:'PDF centar'" apps/portal/assets/public-shell-v21.js
          grep -q "'/admin-center/'" apps/portal/assets/public-shell-v21.js
          ! grep -q "gallery:'Galerija'" apps/portal/assets/public-shell-v21.js
          ! grep -q "gallery:'Gallery'" apps/portal/assets/public-shell-v21.js
          grep -q 'GNK_ASG_PUBLIC_V21_INDEX_PREVIEW_20260627' workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js
          grep -q 'public-unified-v21.css' workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js
          grep -q 'public-index-v21.css' workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js
          grep -q 'public-shell-v21.js' workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js
          grep -q 'EXECUTIVE_EDITORIAL_V21' workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js
          grep -q 'body.gnk-public-route-home .hero' apps/portal/assets/public-index-v21.css
          grep -q 'body.gnk-public-route-home .finance-grid' apps/portal/assets/public-index-v21.css
          grep -q 'body.gnk-public-route-home .map-wrap' apps/portal/assets/public-index-v21.css
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Deploy V21 index preview
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator
      - name: Verify live HR and EN index preview
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          const base='https://gnk-asg.hr';
          for(let attempt=1;attempt<=30;attempt++){
            const nonce=`${Date.now()}-${attempt}`;
            const read=async path=>{
              try{
                const response=await fetch(`${base}${path}${path.includes('?')?'&':'?'}cb=${nonce}`,{headers:{'cache-control':'no-cache','pragma':'no-cache'}});
                return {response,text:await response.text()};
              }catch(error){return {response:{status:0,headers:new Headers()},text:''}}
            };
            const [hr,en,shell,unified,indexCss]=await Promise.all([
              read('/'),read('/en/'),read('/assets/public-shell-v21.js'),read('/assets/public-unified-v21.css'),read('/assets/public-index-v21.css')
            ]);
            const failures=[];
            for(const [name,page,anchors,copy] of [
              ['hr',hr,['id="the-code"','id="financije"','id="mreza"'],['Poslovna grupa.','Financijski pokazatelji','Globalna mreža']],
              ['en',en,['id="the-code"','id="financials"','id="network"'],['A business group.','Financial indicators','Global network']]
            ]){
              if(page.response.status!==200)failures.push(`${name}-status:${page.response.status}`);
              if(!page.text.includes('public-unified-v21.css'))failures.push(`${name}-unified-css`);
              if(!page.text.includes('public-index-v21.css'))failures.push(`${name}-index-css`);
              if(!page.text.includes('public-shell-v21.js'))failures.push(`${name}-shell`);
              if(page.text.includes('<nav class="menu">'))failures.push(`${name}-legacy-menu`);
              if(anchors.some(value=>!page.text.includes(value)))failures.push(`${name}-anchors`);
              if(copy.some(value=>!page.text.includes(value)))failures.push(`${name}-content`);
              if(page.response.headers.get('x-gnk-asg-index-design')!=='EXECUTIVE_EDITORIAL_V21')failures.push(`${name}-design-header`);
              if(page.response.headers.get('x-gnk-asg-index-menu')!=='UNIFIED_PUBLIC_SHELL_V21')failures.push(`${name}-menu-header`);
            }
            if(!shell.text.includes('GNK_ASG_PUBLIC_SHELL_V21_20260627')||shell.text.includes("gallery:'Gallery'"))failures.push('shell-asset');
            if(!unified.text.includes('GNK ASG Unified Public Design V21'))failures.push('unified-css-asset');
            if(!indexCss.text.includes('preserves index content'))failures.push('index-css-asset');
            console.log(JSON.stringify({attempt,failures,hrDesign:hr.response.headers.get('x-gnk-asg-index-design'),enDesign:en.response.headers.get('x-gnk-asg-index-design')}));
            if(!failures.length)process.exit(0);
            await sleep(10000);
          }
          process.exit(1);
          JS
