name: Deploy Stable INDEX Rollback 20260628

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-public-shell-v15.yml'
      - 'apps/portal/assets/index-priority-v1.js'
      - 'apps/portal/assets/index-city-white-v1.css'
      - 'apps/portal/downloads/index.html'
      - 'workers/gnk-asg-direct-operator/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnk-asg-index-emergency-rollback-20260628
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate stable INDEX rollback
        shell: bash
        run: |
          set -euxo pipefail
          node --check apps/portal/assets/index-priority-v1.js
          test -s apps/portal/assets/index-city-white-v1.css
          test -s apps/portal/downloads/index.html
          grep -q '__GNK_INDEX_PRIORITY_V4__' apps/portal/assets/index-priority-v1.js
          grep -q 'index-city-white-v1.css?v=20260628-v2' apps/portal/assets/index-priority-v1.js
          grep -q 'location-directory' apps/portal/assets/index-city-white-v1.css
          grep -q 'gnk-downloads-clean-page' apps/portal/downloads/index.html
          test ! -e apps/portal/assets/index-city-directory-v2.js
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Deploy stable INDEX rollback to Cloudflare
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator
      - name: Verify production INDEX and Downloads
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          const base='https://gnk-asg.hr';
          const read=async(path,nonce)=>{
            try{
              const response=await fetch(`${base}${path}${path.includes('?')?'&':'?'}cb=${nonce}`,{headers:{'cache-control':'no-cache','pragma':'no-cache'}});
              return {status:response.status,text:await response.text()};
            }catch(error){return {status:0,text:''};}
          };
          for(let attempt=1;attempt<=30;attempt++){
            const nonce=`${Date.now()}-${attempt}`;
            const [home,en,priority,cityCss,downloads]=await Promise.all([
              read('/',nonce),
              read('/en/',nonce),
              read('/assets/index-priority-v1.js',nonce),
              read('/assets/index-city-white-v1.css',nonce),
              read('/downloads/',nonce)
            ]);
            const failures=[];
            if(home.status!==200)failures.push(`home:${home.status}`);
            if(en.status!==200)failures.push(`en:${en.status}`);
            if(priority.status!==200||!priority.text.includes('__GNK_INDEX_PRIORITY_V4__')||priority.text.includes('index-city-directory-v2.js'))failures.push(`priority:${priority.status}`);
            if(cityCss.status!==200||!cityCss.text.includes('location-directory'))failures.push(`city-css:${cityCss.status}`);
            if(downloads.status!==200||!downloads.text.includes('gnk-downloads-clean-page'))failures.push(`downloads:${downloads.status}`);
            console.log(JSON.stringify({attempt,failures}));
            if(!failures.length)process.exit(0);
            await sleep(10000);
          }
          process.exit(1);
          JS
