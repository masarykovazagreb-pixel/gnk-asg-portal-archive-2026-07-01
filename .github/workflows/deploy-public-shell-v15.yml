name: Generate verified media send allowlist

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-public-shell-v15.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Generate strict allowlist
        run: |
          node <<'NODE'
          const fs=require('fs');
          const source=JSON.parse(fs.readFileSync('apps/portal/data/media-outreach-contacts-v1.json','utf8'));
          const valid=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/i;
          const ready=source.filter(x=>x.automationAllowed===true && valid.test(String(x.email||'').trim())).map(x=>({mailCode:x.mailCode,outlet:x.outlet,country:x.country,email:String(x.email).trim().toLowerCase(),recipientName:x.recipientName||'',language:x.language||'English'}));
          const unique=[]; const seen=new Set();
          for(const row of ready){if(seen.has(row.email))continue;seen.add(row.email);unique.push(row)}
          fs.writeFileSync('apps/portal/data/media-outreach-ready-allowlist.json',JSON.stringify({generatedAt:new Date().toISOString(),sourceCount:source.length,readyCount:unique.length,items:unique},null,2)+'\n');
          console.log(JSON.stringify({sourceCount:source.length,readyCount:unique.length,items:unique},null,2));
          NODE
      - name: Commit generated allowlist
        run: |
          git config user.name 'GNK ASG Automation'
          git config user.email 'automation@gnk-asg.hr'
          git add apps/portal/data/media-outreach-ready-allowlist.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate verified media send allowlist'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            echo "Push odbijen (pokusaj $attempt) - main se pomaknuo, radim fetch+rebase."
            git fetch origin main
            git rebase origin/main || { echo "Rebase konflikt."; exit 1; }
            sleep $((attempt * 5))
            if [ "$attempt" = "5" ]; then echo "Push nije uspio nakon 5 pokusaja."; exit 1; fi
          done
