name: Deploy Mail Studio and Media Center routes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-public-shell-v15.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate active chain
        shell: bash
        run: |
          set -euxo pipefail
          node --check workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v28-news-no-fallback.js
          node --check workers/gnk-asg-direct-operator/src/index-unified-auth-v15-final.js
          node --check workers/gnk-asg-direct-operator/src/index-media-command-center-v21.js
          node --check workers/gnk-asg-direct-operator/src/index-mail-studio-bridge-v15.js
          node --check workers/gnk-asg-direct-operator/src/manual-mail-service-v1.js
          node --check workers/gnk-asg-direct-operator/src/media-registration-v1.js

      - name: Deploy and capture complete Wrangler diagnostics
        id: deploy_worker
        continue-on-error: true
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator 2>&1 | tee /tmp/cloudflare-deploy.log
          mkdir -p /tmp/wrangler-logs
          cp -R "$HOME/.config/.wrangler/logs/." /tmp/wrangler-logs/ 2>/dev/null || true

      - name: Collect Wrangler logs after failure
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/wrangler-logs
          cp -R "$HOME/.config/.wrangler/logs/." /tmp/wrangler-logs/ 2>/dev/null || true
          find /tmp/wrangler-logs -type f -maxdepth 2 -print || true

      - name: Upload full deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-mail-media-full-diagnostics
          path: |
            /tmp/cloudflare-deploy.log
            /tmp/wrangler-logs
          if-no-files-found: warn
          retention-days: 3

      - name: Fail when deployment failed
        if: steps.deploy_worker.outcome != 'success'
        run: exit 1
