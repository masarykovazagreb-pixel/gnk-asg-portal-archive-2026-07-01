name: Deploy Canonical Public Shell V17

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-public-shell-v15.yml'
      - 'apps/portal/publications/index.html'
      - 'apps/portal/assets/public-menu-v10.css'
      - 'apps/portal/assets/public-shell-v15.js'
      - 'apps/portal/assets/editorial-v12.css'
      - 'apps/portal/assets/editorial-v12.js'
      - 'workers/gnk-asg-direct-operator/wrangler.toml'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v26-public-v10-base.js'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-public-shell-v15.yml'
      - 'apps/portal/publications/index.html'
      - 'apps/portal/assets/public-menu-v10.css'
      - 'apps/portal/assets/public-shell-v15.js'
      - 'apps/portal/assets/editorial-v12.css'
      - 'apps/portal/assets/editorial-v12.js'
      - 'workers/gnk-asg-direct-operator/wrangler.toml'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v26-public-v10-base.js'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnk-asg-canonical-public-shell-v17
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate canonical public routes and bilingual pages
        shell: bash
        run: |
          set -euxo pipefail
          node --check apps/portal/assets/public-shell-v15.js
          node --check apps/portal/assets/editorial-v12.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v26-public-v10-base.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js
          test -s apps/portal/assets/public-menu-v10.css
          test -s apps/portal/assets/editorial-v12.css
          test -s apps/portal/publications/index.html
          grep -q 'GNK_ASG_PUBLIC_SHELL_V15_20260627' apps/portal/assets/public-shell-v15.js
          grep -q 'GNK_ASG_ADMIN_HUB_V26_PUBLIC_SHELL_V17_CANONICAL_ROUTES_20260627' workers/gnk-asg-direct-operator/src/index-admin-hub-v26-public-v10-base.js
          grep -q 'GNK_ASG_PUBLIC_V19_CANONICAL_PUBLIC_ROUTES_V17_20260627' workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js
          grep -q 'EN_CONTACT_CANONICAL_V1' workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js
          grep -q "'/publications','/publications/index.html'" workers/gnk-asg-direct-operator/src/index-admin-hub-v26-public-v10-base.js
          grep -q '<html lang="en">' apps/portal/publications/index.html
          grep -q 'Publications and analysis.' apps/portal/publications/index.html
          grep -q 'Open publication' apps/portal/publications/index.html
          grep -q 'gnk-asg.hr/en/\*' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'gnk-asg.hr/publications/\*' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'gnk-asg.hr/contact/\*' workers/gnk-asg-direct-operator/wrangler.toml
          ! grep -q 'new MutationObserver' apps/portal/assets/editorial-v12.js
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Deploy current Worker and canonical public route ownership
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator
      - name: Verify English index, publications and unified public shell
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          const base='https://gnk-asg.hr';
          for(let attempt=1;attempt<=30;attempt++){
            const nonce=`${Date.now()}-${attempt}`;
            const failures=[];
            const read=async path=>{
              try{
                const response=await fetch(`${base}${path}${path.includes('?')?'&':'?'}cb=${nonce}`,{headers:{'cache-control':'no-cache','pragma':'no-cache'}});
                return {response,text:await response.text()};
              }catch(error){return {response:{status:0,headers:new Headers()},text:''}}
            };
            const en=await read('/en/');
            const publications=await read('/publications/');
            const contact=await read('/en/contact/');
            const shell=await read('/assets/public-shell-v15.js');
            if(en.response.status!==200||!en.text.includes('A business group.')||en.text.includes('System active Version 3.0'))failures.push(`en-index:${en.response.status}`);
            if(!en.text.includes('href="/en/contact/"'))failures.push('en-contact-link');
            if(publications.response.status!==200||!publications.text.includes('Publications and analysis.')||!publications.text.includes('Open publication'))failures.push(`publications:${publications.response.status}`);
            if(!publications.text.includes('public-shell-v15.js?v=20260627-v15'))failures.push('publications-shell');
            if(contact.response.status!==200||!contact.text.includes('Contact and secure communication')||!contact.text.includes('public-shell-v15.js?v=20260627-v15'))failures.push(`en-contact:${contact.response.status}`);
            if(!shell.text.includes('GNK_ASG_PUBLIC_SHELL_V15_20260627'))failures.push('shell-asset');
            console.log(JSON.stringify({attempt,failures,enRelease:en.response.headers.get('x-gnk-asg-index-template'),languageLinks:en.response.headers.get('x-gnk-asg-index-language-links'),publicOwner:publications.response.headers.get('x-gnk-asg-public-route-owner')}));
            if(!failures.length)process.exit(0);
            await sleep(10000);
          }
          process.exit(1);
          JS
