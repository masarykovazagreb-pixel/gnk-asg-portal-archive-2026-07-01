name: Restore Stable Index V29

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-public-shell-v15.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnk-asg-public-index-v30
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: f40a0659333b244ca4d127cf4c5dc561e731c4f5
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate
        run: node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v29-index-visual-fix.js
      - name: Deploy
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy src/index-admin-hub-v29-index-visual-fix.js --config wrangler.toml --name gnk-asg-direct-operator
