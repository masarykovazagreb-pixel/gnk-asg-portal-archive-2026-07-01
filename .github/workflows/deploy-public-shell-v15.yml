name: Export full media contacts list

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-public-shell-v15.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Upload full contacts file
        uses: actions/upload-artifact@v4
        with:
          name: full-media-contacts
          path: apps/portal/data/media-outreach-contacts-v1.json
          retention-days: 3
      - name: Mark for operator review
        run: exit 1
