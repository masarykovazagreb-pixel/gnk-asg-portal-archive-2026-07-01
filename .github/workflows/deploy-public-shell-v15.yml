name: EMERGENCY Rollback to Known Good V29

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-public-shell-v15.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnk-asg-emergency-known-good-v29
  cancel-in-progress: true

env:
  ROLLBACK_SHA: f40a0659333b244ca4d127cf4c5dc561e731c4f5

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout last known good production snapshot
        uses: actions/checkout@v5
        with:
          ref: ${{ env.ROLLBACK_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate known good V29 snapshot
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$ROLLBACK_SHA"
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v29-index-visual-fix.js
          node --check apps/portal/assets/index-priority-v1.js
          grep -q 'GNK_ASG_ADMIN_HUB_V29_INDEX_CITY_CODE_LAYOUT_20260628' workers/gnk-asg-direct-operator/src/index-admin-hub-v29-index-visual-fix.js
          grep -q '__GNK_INDEX_PRIORITY_V4__' apps/portal/assets/index-priority-v1.js
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy src/index-admin-hub-v29-index-visual-fix.js --dry-run --config wrangler.toml --name gnk-asg-direct-operator
      - name: Deploy exact known good V29 snapshot
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy src/index-admin-hub-v29-index-visual-fix.js --config wrangler.toml --name gnk-asg-direct-operator
      - name: Verify no Cloudflare 1011 on INDEX routes
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          const paths=['/','/en/','/the-code/?embed=1','/assets/index-priority-v1.js','/assets/index-code-layout-fix-v1.css','/assets/index-city-white-v1.css','/contact/'];
          for(let attempt=1;attempt<=30;attempt++){
            const failures=[];
            for(const path of paths){
              const sep=path.includes('?')?'&':'?';
              try{
                const response=await fetch(`https://gnk-asg.hr${path}${sep}cb=${Date.now()}-${attempt}`,{headers:{'cache-control':'no-cache','pragma':'no-cache'}});
                const text=await response.text();
                if(response.status!==200||text.includes('Error 1011')||text.includes('Worker threw exception'))failures.push(`${path}:${response.status}`);
              }catch(error){failures.push(`${path}:network`);}
            }
            console.log(JSON.stringify({attempt,failures}));
            if(!failures.length)process.exit(0);
            await sleep(10000);
          }
          process.exit(1);
          JS

