name: Deploy corrected controlled media test package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-public-shell-v15.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          show-progress: false
      - name: Assemble and expand PDF
        run: |
          set -euo pipefail
          cat .controlled-media-test-assets/pdf.01 .controlled-media-test-assets/pdf.02 .controlled-media-test-assets/pdf.03 .controlled-media-test-assets/pdf.04 > /tmp/media-pdf.b64
          base64 --decode .controlled-media-test-assets/pdf.05.b2 >> /tmp/media-pdf.b64
          base64 --decode /tmp/media-pdf.b64 > /tmp/media-pdf.gz
          gzip --test /tmp/media-pdf.gz
          gzip --decompress --stdout /tmp/media-pdf.gz > /tmp/final.pdf
      - name: Calculate PDF identity
        id: pdf
        run: |
          echo "sha=$(sha256sum /tmp/final.pdf | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "bytes=$(wc -c < /tmp/final.pdf | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - name: Actual PDF ${{ steps.pdf.outputs.sha }} bytes ${{ steps.pdf.outputs.bytes }}
        run: |
          test "${{ steps.pdf.outputs.sha }}" = '027226b6300c8638f6e2fcfd1774e8c818b14a0360500fadd1b28c64b7f89879'
