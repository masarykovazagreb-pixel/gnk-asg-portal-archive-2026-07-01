name: Audit verified media recipient count

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-public-shell-v15.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Count verified recipients
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          rows=json.loads(Path('apps/portal/data/media-outreach-contacts-v1.json').read_text())
          valid=lambda value: bool(re.fullmatch(r'[^\s@]+@[^\s@]+\.[^\s@]{2,}',str(value or '').strip(),re.I))
          ready=[r for r in rows if valid(r.get('email')) and r.get('automationAllowed') is True]
          approved=[r for r in ready if r.get('approved') is True]
          awaiting=[r for r in ready if r.get('approved') is not True]
          report={'totalContacts':len(rows),'contactsWithValidEmail':sum(valid(r.get('email')) for r in rows),'automationAllowedAndValidEmail':len(ready),'approvedAndReady':len(approved),'awaitingExplicitApproval':len(awaiting),'readyRecipients':[{'mailCode':r.get('mailCode'),'outlet':r.get('outlet'),'country':r.get('country'),'email':r.get('email')} for r in ready]}
          Path('/tmp/media-recipient-audit.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps({k:v for k,v in report.items() if k!='readyRecipients'},ensure_ascii=False,indent=2))
          PY
      - name: Upload recipient audit
        uses: actions/upload-artifact@v4
        with:
          name: media-recipient-audit
          path: /tmp/media-recipient-audit.json
          retention-days: 3
      - name: Mark audit for operator review
        run: exit 1
