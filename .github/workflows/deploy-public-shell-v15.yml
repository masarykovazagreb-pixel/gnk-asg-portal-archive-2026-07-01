name: Upload verified final English PDF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-public-shell-v15.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Reconstruct and verify PDF
        shell: bash
        run: |
          set -euo pipefail
          cat .controlled-media-test-assets/pdf.01 .controlled-media-test-assets/pdf.02 .controlled-media-test-assets/pdf.03 .controlled-media-test-assets/pdf.04 > /tmp/media-pdf.b64
          base64 --decode .controlled-media-test-assets/pdf.05.b2 >> /tmp/media-pdf.b64
          base64 --decode /tmp/media-pdf.b64 > /tmp/media-pdf.gz
          gzip --test /tmp/media-pdf.gz
          gzip --decompress --stdout /tmp/media-pdf.gz > /tmp/final.pdf
          sha="$(sha256sum /tmp/final.pdf | awk '{print $1}')"
          pages="$(pdfinfo /tmp/final.pdf | awk '/^Pages:/ {print $2}')"
          test "$sha" = '027226b6300c8638f6e2fcfd1774e8c818b14a0360500fadd1b28c64b7f89879'
          test "$pages" = '12'
          test "$(head -c 5 /tmp/final.pdf)" = '%PDF-'
          printf '{"sha256":"%s","pages":%s,"bytes":%s}\n' "$sha" "$pages" "$(wc -c < /tmp/final.pdf)" > /tmp/pdf-verification.json

      - name: Upload PDF to R2
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          npx --yes wrangler@4 r2 object put 'gnk-asg-media-assets/media-registration/final/GNK_DINAMO_THE_CODE_MEDIA_INVITATION_AND_ACCREDITATION_EN_FINAL.pdf' --file=/tmp/final.pdf --content-type='application/pdf' --remote

      - name: Upload verification result
        uses: actions/upload-artifact@v4
        with:
          name: final-english-pdf-verification
          path: /tmp/pdf-verification.json
          retention-days: 3
