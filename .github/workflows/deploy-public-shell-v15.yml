name: Send controlled final English media test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-public-shell-v15.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Trigger locked controlled test
        shell: bash
        run: |
          set -euo pipefail
          key="$(python - <<'PY'
          import re
          from pathlib import Path
          source=Path('workers/gnk-asg-direct-operator/src/media-registration-controlled-test-once-v1.js').read_text()
          match=re.search(r"const KEY='([^']+)'",source)
          if not match:
              raise SystemExit('controlled test key unavailable')
          print(match.group(1))
          PY
          )"
          status="$(curl --silent --show-error --output /tmp/result.json --write-out '%{http_code}' \
            "https://gnk-asg-direct-operator.beckuphome.workers.dev/api/media-registration-controlled-test-once?key=${key}")"
          cat /tmp/result.json
          echo
          echo "HTTP_STATUS=${status}"
          test "$status" -ge 200
          test "$status" -lt 300
          python - <<'PY'
          import json
          data=json.load(open('/tmp/result.json'))
          if not data.get('ok'):
              raise SystemExit(f'controlled test failed: {data}')
          result=data.get('result') or {}
          if not result.get('pdfAttached'):
              raise SystemExit(f'verified PDF not attached: {data}')
          print('CONTROLLED_FINAL_TEST_SENT')
          print('messageId=',result.get('messageId',''))
          print('pdfAttached=',result.get('pdfAttached'))
          print('pdfFilename=',result.get('pdfFilename',''))
          print('pdfSha256=',result.get('pdfSha256',''))
          PY

      - name: Upload controlled test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-final-media-test-result
          path: /tmp/result.json
          if-no-files-found: warn
          retention-days: 3
