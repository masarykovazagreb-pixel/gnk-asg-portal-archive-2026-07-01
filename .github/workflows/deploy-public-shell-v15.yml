name: Deploy Public Shell V15

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-public-shell-v15.yml'
      - 'apps/portal/assets/public-menu-v10.css'
      - 'apps/portal/assets/public-shell-v15.js'
      - 'apps/portal/assets/editorial-v12.js'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v26-public-v10-base.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-public-shell-v15.yml'
      - 'apps/portal/assets/public-menu-v10.css'
      - 'apps/portal/assets/public-shell-v15.js'
      - 'apps/portal/assets/editorial-v12.js'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v26-public-v10-base.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnk-asg-public-shell-v15
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate canonical menu and public routes
        shell: bash
        run: |
          set -euxo pipefail
          node --check apps/portal/assets/public-shell-v15.js
          node --check apps/portal/assets/editorial-v12.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v26-public-v10-base.js
          test -s apps/portal/assets/public-menu-v10.css
          grep -q 'GNK_ASG_PUBLIC_SHELL_V15_20260627' apps/portal/assets/public-shell-v15.js
          grep -q 'UNIFIED_PUBLIC_SHELL_V15' workers/gnk-asg-direct-operator/src/index-admin-hub-v26-public-v10-base.js
          grep -q "'/publications'" workers/gnk-asg-direct-operator/src/index-admin-hub-v26-public-v10-base.js
          grep -q "'/downloads'" workers/gnk-asg-direct-operator/src/index-admin-hub-v26-public-v10-base.js
          grep -q "'/en/downloads'" workers/gnk-asg-direct-operator/src/index-admin-hub-v26-public-v10-base.js
          ! grep -q 'new MutationObserver' apps/portal/assets/editorial-v12.js
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Deploy Cloudflare Worker and assets
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator
      - name: Verify public shell routes
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const routes=['/vijesti/','/news/','/objave/','/publications/','/trzista/','/markets/','/visual-index/','/media-kit/','/downloads/','/en/downloads/','/contact/','/assistant/','/en/assistant/'];
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          for(let attempt=1;attempt<=24;attempt++){
            const failures=[];
            for(const path of routes){
              try{
                const response=await fetch(`https://gnk-asg.hr${path}?cb=${Date.now()}`,{headers:{'cache-control':'no-cache'}});
                const text=await response.text();
                if(response.status!==200||!text.includes('public-shell-v15.js?v=20260627-v15'))failures.push(`${path}:${response.status}`);
              }catch(error){failures.push(`${path}:0`)}
            }
            const js=await fetch(`https://gnk-asg.hr/assets/public-shell-v15.js?cb=${Date.now()}`).then(r=>r.text()).catch(()=>"");
            if(!js.includes('GNK_ASG_PUBLIC_SHELL_V15_20260627'))failures.push('asset:public-shell-v15');
            console.log(JSON.stringify({attempt,failures}));
            if(!failures.length)process.exit(0);
            await sleep(10000);
          }
          process.exit(1);
          JS
