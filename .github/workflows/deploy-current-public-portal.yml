name: Deploy current public portal

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: gnk-asg-current-public-portal-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.number == 225 &&
       github.event.comment.body == '/deploy-current-public-portal' &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Reconstruct verified English media assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p apps/portal/data apps/portal/assets

          cat \
            .controlled-media-test-assets/pdf.01 \
            .controlled-media-test-assets/pdf.02 \
            .controlled-media-test-assets/pdf.03 \
            .controlled-media-test-assets/pdf.04 > /tmp/media-pdf.b64
          base64 --decode .controlled-media-test-assets/pdf.05.b2 > /tmp/media-pdf-final-chunk.b64
          cat /tmp/media-pdf-final-chunk.b64 >> /tmp/media-pdf.b64
          base64 --decode /tmp/media-pdf.b64 > /tmp/media-pdf.gz
          gzip --decompress --stdout /tmp/media-pdf.gz > apps/portal/data/GNK_DINAMO_THE_CODE_MEDIA_INVITATION_AND_ACCREDITATION_EN_FINAL.pdf
          printf '%s  %s\n' \
            '027226b6300c8638f6e2fcfd1774e8c818b14a0360500fadd1b28c64b7f89879' \
            'apps/portal/data/GNK_DINAMO_THE_CODE_MEDIA_INVITATION_AND_ACCREDITATION_EN_FINAL.pdf' | sha256sum --check --strict

          base64 --decode .controlled-media-test-assets/logo-asg.b64 > apps/portal/assets/gnk-asg-email-logo-final-v2.png
          printf '%s  %s\n' \
            '72789420e777888198bb8143a07dfbb392ec3b3cb3515bed259060da829a1648' \
            'apps/portal/assets/gnk-asg-email-logo-final-v2.png' | sha256sum --check --strict

          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/beckuphome-gnk/gnk-asg-portal/git/blobs/fd2121e1bc1da00cb690b8b480f4c778eb56fc50' \
            --output /tmp/group-logo-blob.json
          python - <<'PY'
          import base64, json, pathlib
          data=json.loads(pathlib.Path('/tmp/group-logo-blob.json').read_text())
          pathlib.Path('apps/portal/assets/gnk-group-email-logo-final.png').write_bytes(base64.b64decode(data['content']))
          PY
          printf '%s  %s\n' \
            '338d9acd9c1c961862f90d6730ce8fc5962b68e551892852043b93174e2a911e' \
            'apps/portal/assets/gnk-group-email-logo-final.png' | sha256sum --check --strict

      - name: Validate current release
        shell: bash
        run: |
          set -euxo pipefail
          node --check workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v28-news-no-fallback.js
          node --check workers/gnk-asg-direct-operator/src/index-media-command-center-v20.js
          node --check workers/gnk-asg-direct-operator/src/media-registration-controlled-test-v1.js
          test -s apps/portal/index.html
          test -s apps/portal/en/index.html
          test -s apps/portal/media-application/index.html
          test -s apps/portal/data/GNK_DINAMO_THE_CODE_MEDIA_INVITATION_AND_ACCREDITATION_EN_FINAL.pdf
          test -s apps/portal/assets/gnk-asg-email-logo-final-v2.png
          test -s apps/portal/assets/gnk-group-email-logo-final.png
          grep -q 'main = "src/index-final-admin-gateway-v1.js"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'production_sending_locked' workers/gnk-asg-direct-operator/src/index-media-command-center-v20.js
          grep -q 'GNK_ASG_MEDIA_REGISTRATION_CONTROLLED_TEST_V2_20260629' workers/gnk-asg-direct-operator/src/media-registration-controlled-test-v1.js
          grep -q '10 July 2026 at 23:59 CEST' workers/gnk-asg-direct-operator/src/media-registration-controlled-test-v1.js
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator

      - name: Deploy current main to Cloudflare
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator

      - name: Verify deployed English assets and application routes
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            pdf_status="$(curl --silent --output /tmp/media.pdf --write-out '%{http_code}' "https://gnk-asg.hr/data/GNK_DINAMO_THE_CODE_MEDIA_INVITATION_AND_ACCREDITATION_EN_FINAL.pdf?cb=${RANDOM}${RANDOM}")"
            asg_status="$(curl --silent --output /tmp/asg.png --write-out '%{http_code}' "https://gnk-asg.hr/assets/gnk-asg-email-logo-final-v2.png?cb=${RANDOM}${RANDOM}")"
            group_status="$(curl --silent --output /tmp/group.png --write-out '%{http_code}' "https://gnk-asg.hr/assets/gnk-group-email-logo-final.png?cb=${RANDOM}${RANDOM}")"
            application_status="$(curl --silent --output /tmp/application.html --write-out '%{http_code}' "https://gnk-asg.hr/media-application/?lang=en&code=GNK-MEDIA-20260629-GB-TEST-001&cb=${RANDOM}${RANDOM}")"
            if [ "$pdf_status" = 200 ] && [ "$asg_status" = 200 ] && [ "$group_status" = 200 ] && [ "$application_status" = 200 ]; then
              printf '%s  %s\n' '027226b6300c8638f6e2fcfd1774e8c818b14a0360500fadd1b28c64b7f89879' '/tmp/media.pdf' | sha256sum --check --strict
              printf '%s  %s\n' '72789420e777888198bb8143a07dfbb392ec3b3cb3515bed259060da829a1648' '/tmp/asg.png' | sha256sum --check --strict
              printf '%s  %s\n' '338d9acd9c1c961862f90d6730ce8fc5962b68e551892852043b93174e2a911e' '/tmp/group.png' | sha256sum --check --strict
              exit 0
            fi
            echo "attempt=${attempt} pdf=${pdf_status} asg=${asg_status} group=${group_status} application=${application_status}"
            sleep 10
          done
          exit 1

      - name: Send exactly one corrected controlled test
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s%s%s%s' '1' '2' '0' '3')"
          echo "::add-mask::$TOKEN"
          cat > /tmp/send-test.json <<'JSON'
          {
            "confirm": "SEND_PERSONALIZED_TEST",
            "email": "beckuphome@gmail.com",
            "outlet": "GNK ASG TEST NEWSROOM",
            "recipientName": "Editorial Team"
          }
          JSON
          status="$(curl --silent --show-error --output /tmp/send-test-response.json --write-out '%{http_code}' \
            --request POST 'https://gnk-asg.hr/api/media-registration-admin/send-test' \
            --header "Authorization: Bearer ${TOKEN}" \
            --header "X-Operator-Token: ${TOKEN}" \
            --header 'Content-Type: application/json' \
            --data-binary '@/tmp/send-test.json')"
          cat /tmp/send-test-response.json
          test "$status" -ge 200 -a "$status" -lt 300
          node <<'JS'
          const fs=require('node:fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/send-test-response.json','utf8'));
          if(payload.ok!==true)throw new Error(JSON.stringify(payload));
          if(payload.result?.to!=='beckuphome@gmail.com')throw new Error('unexpected recipient');
          if(payload.result?.pdfAttached!==true)throw new Error('verified PDF not attached');
          JS

      - name: Report deployment result
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_STATUS: ${{ job.status }}
        with:
          script: |
            const status = String(process.env.DEPLOY_STATUS || 'unknown').toUpperCase();
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 225,
              body: `DEPLOY_CURRENT_PUBLIC_PORTAL_${status}\nRun: ${context.runId}\nSHA: ${context.sha}\nControlled test recipient: beckuphome@gmail.com`
            });
