name: Build Adria Bank Demo Windows Installer

on:
  push:
    paths:
      - 'apps/adria-bank-demo/**'
      - '.github/workflows/adria-bank-demo-windows-installer.yml'
  pull_request:
    paths:
      - 'apps/adria-bank-demo/**'
      - '.github/workflows/adria-bank-demo-windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    name: Build and package Windows 11 x64 installer
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/adria-bank-demo
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: apps/adria-bank-demo/package-lock.json

      - name: Set up Python for ZIP packaging
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run demo regression suite
        run: npm test

      - name: Build the per-user x64 NSIS installer
        run: npm run dist:win

      - name: Package and verify the installer ZIP
        run: npm run package:windows-installer-zip

      - name: Upload the Windows installer bundle
        uses: actions/upload-artifact@v4
        with:
          name: Adria-Bank-Demo-Windows-Setup
          path: apps/adria-bank-demo/release/Adria-Bank-Demo-Windows-Setup-*-x64.zip
          if-no-files-found: error
          retention-days: 90
