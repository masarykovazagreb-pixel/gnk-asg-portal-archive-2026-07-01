name: Production Writer Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-writer-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-production-write:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Enforce production writer contract
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BEFORE="${{ github.event.pull_request.base.sha }}"
            AFTER="${{ github.event.pull_request.head.sha }}"
          elif [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            BEFORE="$AFTER^"
          fi

          git diff --name-only "$BEFORE" "$AFTER" > /tmp/changed.txt
          echo "Changed paths:"
          cat /tmp/changed.txt

          # Mail is intentionally outside this contract. Never authorize or validate
          # mail, SMTP/IMAP, Mail Studio, DNS/MX, mail workers or mail transport here.
          if grep -Eqi '(^|/)(mail|mailbox|mail-studio|smtp|imap)(/|$)|(^|/)(dns|mx)(/|$)|mail[-_].*(workflow|worker|transport)|contact.*(mail|transport)' /tmp/changed.txt; then
            echo "::error::Mail/DNS transport path detected: OUT OF SCOPE for MASTER ASG."
            exit 1
          fi

          # Direct pushes to main are data-only. Code, workflows, editorial,
          # deployment and control-plane changes must use PRs.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            bad=0
            while IFS= read -r path; do
              [[ -z "$path" ]] && continue
              case "$path" in
                apps/portal/data/*|apps/portal/public/data/*|data/*) ;;
                *) echo "::error file=$path::Direct main push is not an allowlisted data path"; bad=1 ;;
              esac
            done < /tmp/changed.txt
            [[ "$bad" -eq 0 ]] || exit 1
          fi

          # Prevent executable/config payloads from being disguised as data.
          if grep -Ei '\.(ya?ml|js|mjs|cjs|ts|tsx|jsx|sh|py|rb|php|go|rs|java|class|jar|exe|dll)$' /tmp/changed.txt; then
            echo "::error::Executable/config file detected in data-only writer path."
            exit 1
          fi

          echo "Production writer contract: PASS"
