name: Site Health Check (2x daily Zagreb)
on:
  schedule:
    # Staggered against the 05:42/17:42 UTC SLA watchdog to retain four daily health windows.
    - cron: '0 0,12 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
concurrency:
  group: site-health-check
  cancel-in-progress: false
jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run end-to-end health and freshness check
        id: check
        run: node scripts/site-health-check-v1.mjs
        continue-on-error: true
      - name: Post report as GitHub issue only on failure
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="PRODUCTION DEGRADED — $(date -u +%Y-%m-%d\ %H:%M) UTC"
          gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file /tmp/health-check-report.md --label "health-check" || \
          gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file /tmp/health-check-report.md
      - name: Upload health report
        uses: actions/upload-artifact@v4
        with:
          name: site-health-report-${{ github.run_id }}
          path: /tmp/health-check-report.md
          retention-days: 30
      - name: Fail the job if checks failed
        if: steps.check.outcome == 'failure'
        run: exit 1
