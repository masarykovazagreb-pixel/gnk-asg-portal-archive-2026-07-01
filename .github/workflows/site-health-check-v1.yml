name: Site Health Check (06:00 / 12:00 / 18:00 Zagreb)
on:
  schedule:
    # Zagreb is UTC+2 in summer (CEST). 06:00/12:00/18:00 local = 04:00/10:00/16:00 UTC.
    - cron: '0 4,16 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
concurrency:
  group: site-health-check
  cancel-in-progress: false
jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run health check
        id: check
        run: node scripts/site-health-check-v1.mjs
        continue-on-error: true
      - name: Post report as GitHub issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS="${{ steps.check.outcome }}"
          TITLE="Provjera sustava — $(date -u +%Y-%m-%d\ %H:%M) UTC ($STATUS)"
          gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file /tmp/health-check-report.md --label "health-check" || \
          gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file /tmp/health-check-report.md
      - name: Fail the job if checks failed
        if: steps.check.outcome == 'failure'
        run: exit 1
