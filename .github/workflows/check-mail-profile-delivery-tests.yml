name: Check Mail Profile Delivery Tests

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/check-mail-profile-delivery-tests.yml'
      - 'apps/portal/assets/mail-studio-profile-test-v1.js'
      - 'workers/gnk-asg-direct-operator/src/email-signature-contract-v1.js'
      - 'workers/gnk-asg-direct-operator/src/index-mail-studio-bridge-v15.js'
      - 'workers/gnk-asg-direct-operator/src/mail-profile-delivery-test-v1.js'
      - 'workers/gnk-asg-direct-operator/wrangler.toml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euxo pipefail
          node --check apps/portal/assets/mail-studio-profile-test-v1.js
          node --check workers/gnk-asg-direct-operator/src/email-signature-contract-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-mail-studio-bridge-v15.js
          node --check workers/gnk-asg-direct-operator/src/mail-profile-delivery-test-v1.js

      - name: Verify generated server signatures and control copy
        shell: bash
        run: |
          set -euxo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {enforceRequiredSignature,MANDATORY_BCC,VERSION} from './workers/gnk-asg-direct-operator/src/email-signature-contract-v1.js';

          const newMessage=enforceRequiredSignature({
            from:{name:'GNK ASG Office',email:'office@gnk-asg.hr'},
            to:'recipient@example.test',
            text:'Internal test message.',
            html:'<p>Internal test message.</p>'
          });
          const legacyMessage=enforceRequiredSignature({
            from:{name:'GNK ASG Legal',email:'legal@gnk-asg.hr'},
            to:'recipient@example.test',
            text:'GNK ASG d.o.o.\nOIB: 75227917632\nTelefon: +385 91 535 8365\nWeb: https://gnk-asg.hr',
            html:'<div>GNK ASG d.o.o.</div><div>Telefon: 091 535 8365</div><div>Web: https://gnk-asg.hr</div>'
          });
          assert.equal(MANDATORY_BCC,'beckuphome@gmail.com');
          for(const [name,payload] of Object.entries({newMessage,legacyMessage})){
            assert.doesNotMatch(payload.text,/(?:\+385|091|Telefon:|Phone:|WhatsApp|wa\.me)/i,`${name} text phone-free`);
            assert.doesNotMatch(payload.html,/(?:\+385|091|Telefon:|Phone:|WhatsApp|wa\.me)/i,`${name} html phone-free`);
            assert.match(payload.text,/GNK ASG d\.o\.o\./,`${name} institutional identity`);
            assert.equal(payload.bcc,MANDATORY_BCC,`${name} control copy`);
            assert.equal(payload.headers['X-GNK-ASG-Signature-Contract'],VERSION);
            assert.equal(payload.headers['X-GNK-ASG-Mandatory-Copy'],'ENFORCED');
          }
          console.log(JSON.stringify({ok:true,version:VERSION,controlCopy:MANDATORY_BCC,phoneFree:true}));
          JS

      - name: Verify delivery safety gates
        shell: bash
        run: |
          set -euxo pipefail
          grep -q "SEND_PROFILE_TESTS" workers/gnk-asg-direct-operator/src/mail-profile-delivery-test-v1.js
          grep -q "profile_test_sending_locked" workers/gnk-asg-direct-operator/src/mail-profile-delivery-test-v1.js
          grep -q "recipient_not_allowlisted" workers/gnk-asg-direct-operator/src/mail-profile-delivery-test-v1.js
          grep -q "MAIL_PROFILE_TEST_RECIPIENTS" workers/gnk-asg-direct-operator/src/mail-profile-delivery-test-v1.js
          grep -q "profileAuth" workers/gnk-asg-direct-operator/src/index-mail-studio-bridge-v15.js
          grep -q "/api/operator-auth-check" workers/gnk-asg-direct-operator/src/index-mail-studio-bridge-v15.js
          grep -q "Potvrđujem slanje pet zasebnih internih testnih poruka" apps/portal/assets/mail-studio-profile-test-v1.js
          grep -q 'MAIL_PROFILE_TEST_LIVE = "false"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'MAIL_PROFILE_TEST_RECIPIENTS = "beckuphome@gmail.com"' workers/gnk-asg-direct-operator/wrangler.toml

      - name: Verify route-less review configuration
        shell: bash
        run: |
          set -euxo pipefail
          grep -Eq 'main = "src/(index-unified-auth-v14|index-enterprise-projects-runtime-v1)\.js"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'PUBLIC_ENVIRONMENT = "review-direct-operator"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'MAIL_MANUAL_LIVE = "false"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'MEDIA_OUTREACH_LIVE = "false"' workers/gnk-asg-direct-operator/wrangler.toml
          ! grep -Eq '^[[:space:]]*(routes|route|zone_name)[[:space:]]*=' workers/gnk-asg-direct-operator/wrangler.toml
