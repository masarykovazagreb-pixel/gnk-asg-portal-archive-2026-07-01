name: Deploy Fresh Media Center

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/portal/media-command-center/index.html"
      - "apps/portal/assets/media-center-fresh-v1.js"
      - "apps/portal/assets/media-center-fresh-v1.css"
      - "apps/portal/assets/media-center-delivery-history-v2.js"
      - "apps/portal/assets/media-center-delivery-history-v2.css"
      - "workers/gnk-asg-direct-operator/src/media-fresh-admin-v1.js"
      - "workers/gnk-asg-direct-operator/src/media-outreach-delivery-v5.js"
      - "workers/gnk-asg-direct-operator/src/media-outreach-english-guard-v1.js"
      - "workers/gnk-asg-direct-operator/src/media-bootstrap-email-v1.js"
      - "workers/gnk-asg-direct-operator/src/media-bootstrap-html-v1.js"
      - "workers/gnk-asg-direct-operator/src/media-bootstrap-html-forward-v1.js"
      - "workers/gnk-asg-direct-operator/src/index-final-admin-gateway-projects-v1.js"
      - "workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v1.js"
      - ".github/workflows/deploy-media-projects-v1.yml"
  push:
    branches: [main]
    paths:
      - ".github/media-projects-v1.trigger"
      - "apps/portal/media-command-center/index.html"
      - "apps/portal/assets/media-center-fresh-v1.js"
      - "apps/portal/assets/media-center-fresh-v1.css"
      - "apps/portal/assets/media-center-delivery-history-v2.js"
      - "apps/portal/assets/media-center-delivery-history-v2.css"
      - "workers/gnk-asg-direct-operator/src/media-fresh-admin-v1.js"
      - "workers/gnk-asg-direct-operator/src/media-outreach-delivery-v5.js"
      - "workers/gnk-asg-direct-operator/src/media-outreach-english-guard-v1.js"
      - "workers/gnk-asg-direct-operator/src/media-bootstrap-email-v1.js"
      - "workers/gnk-asg-direct-operator/src/media-bootstrap-html-v1.js"
      - "workers/gnk-asg-direct-operator/src/media-bootstrap-html-forward-v1.js"
      - "workers/gnk-asg-direct-operator/src/index-final-admin-gateway-projects-v1.js"
      - "workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v1.js"
      - ".github/workflows/deploy-media-projects-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-fresh-media-center-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate fresh Media Center
        run: |
          set -euo pipefail
          node --check workers/gnk-asg-direct-operator/src/media-fresh-admin-v1.js
          node --check workers/gnk-asg-direct-operator/src/media-outreach-delivery-v5.js
          node --check workers/gnk-asg-direct-operator/src/media-outreach-english-guard-v1.js
          node --check workers/gnk-asg-direct-operator/src/media-bootstrap-email-v1.js
          node --check workers/gnk-asg-direct-operator/src/media-bootstrap-html-v1.js
          node --check workers/gnk-asg-direct-operator/src/media-bootstrap-html-forward-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-final-admin-gateway-projects-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v1.js
          node --check apps/portal/assets/media-center-fresh-v1.js
          node --check apps/portal/assets/media-center-delivery-history-v2.js
          grep -q 'id="messagePreview"' apps/portal/media-command-center/index.html
          grep -q 'id="deliveryHistoryBody"' apps/portal/media-command-center/index.html
          grep -q "fresh-reset" workers/gnk-asg-direct-operator/src/media-fresh-admin-v1.js
          grep -q "delivery-history" workers/gnk-asg-direct-operator/src/media-outreach-delivery-v5.js
          grep -q "withEnglishGreetingGuard" workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v1.js
          grep -q "campaign-html" workers/gnk-asg-direct-operator/src/index-final-admin-gateway-projects-v1.js
          grep -q "handleMediaBootstrapEmail" workers/gnk-asg-direct-operator/src/index-final-admin-gateway-projects-v1.js
          grep -q "handleMediaBootstrapHtmlForwardEmail" workers/gnk-asg-direct-operator/src/index-final-admin-gateway-projects-v1.js
          grep -q "index-media-command-center-v20.js" workers/gnk-asg-direct-operator/src/index-final-admin-gateway-projects-v1.js
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy Cloudflare Worker and assets
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator 2>&1 | tee ../../deploy-media-center-fresh-v1.log
      - name: Verify fresh Media Center deployment
        run: |
          set -euo pipefail
          base="https://gnk-asg.hr"
          ready=false
          for attempt in $(seq 1 30); do
            stamp=$(date +%s%N)
            version_code=$(curl -sSL -o version.json -w '%{http_code}' "$base/data/portal-version.json?cb=$stamp" || true)
            js_code=$(curl -sSL -o fresh.js -w '%{http_code}' "$base/assets/media-center-fresh-v1.js?cb=$stamp" || true)
            css_code=$(curl -sSL -o fresh.css -w '%{http_code}' "$base/assets/media-center-fresh-v1.css?cb=$stamp" || true)
            history_js_code=$(curl -sSL -o history.js -w '%{http_code}' "$base/assets/media-center-delivery-history-v2.js?cb=$stamp" || true)
            history_css_code=$(curl -sSL -o history.css -w '%{http_code}' "$base/assets/media-center-delivery-history-v2.css?cb=$stamp" || true)
            api_code=$(curl -sS -o api.json -w '%{http_code}' "$base/api/media-command-center/fresh-status?cb=$stamp" || true)
            history_api_code=$(curl -sS -o history-api.json -w '%{http_code}' "$base/api/media-command-center/delivery-history?cb=$stamp" || true)
            if [ "$version_code" = "200" ] && [ "$js_code" = "200" ] && [ "$css_code" = "200" ] && [ "$history_js_code" = "200" ] && [ "$history_css_code" = "200" ] && grep -q 'mediaBootstrapHtml' version.json && grep -q 'fresh-message-preview' fresh.js && grep -q 'delivery-history' history.js && { [ "$api_code" = "401" ] || [ "$api_code" = "403" ]; } && { [ "$history_api_code" = "401" ] || [ "$history_api_code" = "403" ]; }; then ready=true; break; fi
            sleep 8
          done
          printf 'VERSION=%s JS=%s CSS=%s HISTORY_JS=%s HISTORY_CSS=%s API=%s HISTORY_API=%s READY=%s\n' "$version_code" "$js_code" "$css_code" "$history_js_code" "$history_css_code" "$api_code" "$history_api_code" "$ready"
          cat version.json
          test "$ready" = "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-center-fresh-deployment
          path: |
            deploy-media-center-fresh-v1.log
            version.json
            fresh.js
            fresh.css
            history.js
            history.css
            api.json
            history-api.json
          retention-days: 14
