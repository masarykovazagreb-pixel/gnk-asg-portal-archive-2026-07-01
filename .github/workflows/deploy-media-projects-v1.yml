name: Deploy Media Projects V1

on:
  push:
    branches: [main]
    paths:
      - ".github/media-projects-v1.trigger"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-media-projects-v1
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate locked project chain
        run: |
          set -euo pipefail
          node --check workers/gnk-asg-direct-operator/src/media-projects-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-final-admin-gateway-projects-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v1.js
          node --check apps/portal/assets/media-projects-ui-v1.js
          node --check apps/portal/assets/media-projects-ui-core-v1.js
          node --check apps/portal/assets/media-projects-ui-projects-v1.js
          node --check apps/portal/assets/media-projects-ui-contacts-v1.js
          node --check apps/portal/assets/media-projects-ui-xlsx-v1.js
          node --check apps/portal/assets/media-projects-ui-files-v1.js
          grep -q "index-final-admin-gateway-projects-v1.js" workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v1.js
          grep -q "MEDIA_OUTREACH_LIVE.*false" workers/gnk-asg-direct-operator/src/index-final-admin-gateway-projects-v1.js
          grep -q "media-outreach-build-lock" workers/gnk-asg-direct-operator/src/index-final-admin-gateway-projects-v1.js
          ! grep -q "EMAIL.send" workers/gnk-asg-direct-operator/src/media-projects-v1.js
      - name: Deploy Cloudflare Worker
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator 2>&1 | tee ../../deploy-media-projects-v1.log
      - name: Verify production lock and assets
        run: |
          set -euo pipefail
          base="https://gnk-asg.hr"
          ready=false
          for attempt in $(seq 1 24); do
            stamp=$(date +%s%N)
            version_code=$(curl -sSL -o version.json -w '%{http_code}' "$base/data/portal-version.json?cb=$stamp" || true)
            loader_code=$(curl -sSL -o loader.js -w '%{http_code}' "$base/assets/media-projects-ui-v1.js?cb=$stamp" || true)
            panel_code=$(curl -sSL -o panel.html -w '%{http_code}' "$base/assets/media-projects-panel-v1.html?cb=$stamp" || true)
            api_code=$(curl -sS -o api.json -w '%{http_code}' "$base/api/media-command-center/projects?cb=$stamp" || true)
            if [ "$version_code" = "200" ] && [ "$loader_code" = "200" ] && [ "$panel_code" = "200" ] && grep -q 'finalProjectsGateway' version.json && grep -q 'mediaOutreachBuildLock' version.json && grep -q '__GNK_ASG_MEDIA_PROJECTS_UI_V1__' loader.js && grep -q 'mpHtmlPreview' panel.html && { [ "$api_code" = "401" ] || [ "$api_code" = "403" ]; }; then
              ready=true
              break
            fi
            sleep 10
          done
          printf 'VERSION=%s LOADER=%s PANEL=%s API=%s READY=%s\n' "$version_code" "$loader_code" "$panel_code" "$api_code" "$ready"
          test "$ready" = "true"
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-projects-v1-deployment
          path: |
            deploy-media-projects-v1.log
            version.json
            loader.js
            panel.html
            api.json
          retention-days: 14
