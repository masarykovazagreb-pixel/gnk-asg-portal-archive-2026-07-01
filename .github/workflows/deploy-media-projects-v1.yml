name: Deploy Fresh Media Center

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/portal/media-command-center/**'
      - 'apps/portal/assets/media-center-**'
      - 'apps/portal/assets/delivery-history-dashboard-v3.js'
      - 'workers/gnk-asg-direct-operator/src/media-**'
      - 'workers/gnk-asg-direct-operator/src/index-final-admin-gateway-**'
      - 'workers/gnk-asg-direct-operator/src/index-media-command-center-v20.js'
      - '.github/workflows/deploy-media-projects-v1.yml'

permissions:
  contents: read

concurrency:
  group: validate-fresh-media-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate current Fresh Media review contract
        run: |
          set -euxo pipefail
          node --check workers/gnk-asg-direct-operator/src/media-fresh-admin-v1.js
          node --check workers/gnk-asg-direct-operator/src/media-outreach-delivery-v5.js
          node --check workers/gnk-asg-direct-operator/src/media-bootstrap-email-v1.js
          node --check workers/gnk-asg-direct-operator/src/media-bootstrap-html-forward-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-final-admin-gateway-projects-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js
          node --check workers/gnk-asg-direct-operator/src/index-media-command-center-v20.js
          node --check apps/portal/assets/media-center-fresh-v1.js
          node --check apps/portal/assets/media-center-delivery-history-v2.js
          node --check apps/portal/assets/delivery-history-dashboard-v3.js
          grep -q 'id="messagePreview"' apps/portal/media-command-center/index.html
          grep -q 'id="deliveryHistoryBody"' apps/portal/media-command-center/index.html
          grep -q 'fresh-reset' workers/gnk-asg-direct-operator/src/media-fresh-admin-v1.js
          grep -q 'delivery-history' workers/gnk-asg-direct-operator/src/media-outreach-delivery-v5.js
          grep -q 'campaign-html' workers/gnk-asg-direct-operator/src/index-final-admin-gateway-projects-v1.js
          grep -q "from './index-final-admin-gateway-projects-v1.js'" workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js
          grep -q "from './index-media-command-center-v20.js'" workers/gnk-asg-direct-operator/src/index-final-admin-gateway-projects-v1.js
          grep -q "from './index-mail-studio-bridge-v17.js'" workers/gnk-asg-direct-operator/src/index-media-command-center-v20.js
          grep -q 'MEDIA_OUTREACH_LIVE = "false"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'MAIL_MANUAL_LIVE = "false"' workers/gnk-asg-direct-operator/wrangler.toml
      - name: Confirm validation-only behavior
        run: |
          set -euxo pipefail
          ! grep -q 'wrangler deploy' .github/workflows/deploy-media-projects-v1.yml
          ! grep -q 'CLOUDFLARE_API_TOKEN' .github/workflows/deploy-media-projects-v1.yml
          echo 'Fresh Media review validation completed without deployment.'
