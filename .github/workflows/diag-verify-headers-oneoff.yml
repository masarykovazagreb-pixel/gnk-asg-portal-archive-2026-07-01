name: Quick live CSS verification (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live CSS files for the 50% glass rules
        run: |
          echo "# Live header verification $(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/verify.md
          for f in style.css digital-headquarters-v1.css digital-workforce-suite-v1.css market-centre.css media-registration-v1.css public-sections-v1.css; do
            curl -s "https://gnk-asg.hr/assets/${f}?vb=$(date +%s)" -o /tmp/f.css
            echo "" >> /tmp/verify.md
            echo "## ${f}" >> /tmp/verify.md
            if grep -q ',\.5)' /tmp/f.css; then
              echo "50%% alpha present: YES" >> /tmp/verify.md
            else
              echo "50%% alpha present: NO" >> /tmp/verify.md
            fi
            grep -oE '\.(site-header|dhq-top|dw-tabs|centre-nav|masthead|top)\{[^}]*\}' /tmp/f.css | head -3 >> /tmp/verify.md
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" --title "Live header verification $(date -u +%Y-%m-%dT%H:%M:%SZ)" --body-file /tmp/verify.md
