name: Check Strategy Performance Review

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/portal/assets/data/operator-os-config.json'
      - 'config/master-asg-worker-fleet-v1.json'
      - 'apps/portal/data/master-asg-capability-registry-v1.json'
      - '.github/workflows/check-strategy-performance-review.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate current strategy governance contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const operator = JSON.parse(fs.readFileSync('apps/portal/assets/data/operator-os-config.json','utf8'));
          const fleet = JSON.parse(fs.readFileSync('config/master-asg-worker-fleet-v1.json','utf8'));
          const capabilities = JSON.parse(fs.readFileSync('apps/portal/data/master-asg-capability-registry-v1.json','utf8'));

          if (operator.status !== 'controlled-review') throw new Error('operator must remain controlled-review');

          const gates = operator.safetyGates || {};
          if (gates.productionDeploy !== 'disabled-until-explicit-approval') throw new Error('production deploy approval gate missing');
          if (gates.mergeToProduction !== 'disabled-until-explicit-approval') throw new Error('merge approval gate missing');
          if (gates.massEmailSending !== 'disabled-until-explicit-approval') throw new Error('mass-email approval gate missing');
          if (gates.dnsChanges !== 'forbidden-in-build-window') throw new Error('DNS build-window lock missing');
          if (gates.cloudflareRouteChanges !== 'forbidden-in-build-window') throw new Error('Cloudflare route build-window lock missing');
          if (gates.secretsChanges !== 'forbidden-in-build-window') throw new Error('secrets build-window lock missing');

          const requiredFor = operator.approvalQueue?.requiredFor || [];
          for (const item of ['strategic-kpi-publication','deployment','dns-or-cloudflare-change']) {
            if (!requiredFor.includes(item)) throw new Error(`approval queue missing ${item}`);
          }

          const cards = operator.missionControl?.dashboardCards || [];
          if (!cards.includes('strategy-performance')) throw new Error('strategy-performance dashboard card missing');

          const premium = operator.premiumRedesign?.components || [];
          if (!premium.includes('strategy-performance-panel')) throw new Error('strategy-performance panel contract missing');

          const modules = operator.monitoredModules || [];
          const liveIds = new Set(modules.map(item => item.id));
          for (const id of ['projects','reports','intelligence-desk','digital-workforce']) {
            if (!liveIds.has(id)) throw new Error(`current strategic evidence module missing: ${id}`);
          }
          if (modules.some(item => item.route === '/strategy-performance/')) {
            throw new Error('retired strategy-performance route must not be reintroduced as a phantom live module');
          }

          const serialized = JSON.stringify({fleet, capabilities});
          for (const forbidden of ['spendingAuthority":true','contractAuthority":true','paymentAuthority":true']) {
            if (serialized.includes(forbidden)) throw new Error(`autonomous authority escalation detected: ${forbidden}`);
          }

          console.log('STRATEGY_GOVERNANCE_CONTRACT=PASS');
          NODE

      - name: Preserve review-only autonomy boundary
        run: |
          set -euxo pipefail
          grep -q 'controlled-review' apps/portal/assets/data/operator-os-config.json
          grep -q 'strategic-kpi-publication' apps/portal/assets/data/operator-os-config.json
          grep -q 'disabled-until-explicit-approval' apps/portal/assets/data/operator-os-config.json
          ! grep -q '"productionDeploy"[[:space:]]*:[[:space:]]*"enabled"' apps/portal/assets/data/operator-os-config.json
          ! grep -q '"mergeToProduction"[[:space:]]*:[[:space:]]*"enabled"' apps/portal/assets/data/operator-os-config.json
