name: Check SEO Attribution V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/portal/scripts/generate_sitewide_seo.py'
      - 'apps/portal/scripts/finalize_sitewide_seo.py'
      - 'apps/portal/scripts/generate_seo.py'
      - 'apps/portal/sitemap.xml'
      - 'apps/portal/image-sitemap.xml'
      - 'apps/portal/robots.txt'
      - 'apps/portal/**/index.html'
      - '.github/workflows/check-seo-attribution-v1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile current SEO generators
        run: |
          set -euxo pipefail
          python -m py_compile \
            apps/portal/scripts/generate_sitewide_seo.py \
            apps/portal/scripts/finalize_sitewide_seo.py \
            apps/portal/scripts/generate_seo.py

      - name: Validate deterministic sitewide SEO source of truth
        run: |
          set -euxo pipefail
          python apps/portal/scripts/generate_sitewide_seo.py
          git diff --exit-code -- apps/portal/sitemap.xml
          python apps/portal/scripts/finalize_sitewide_seo.py

      - name: Validate attribution and indexability invariants
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          portal = Path('apps/portal')
          required = (
              'index.html',
              'en/index.html',
              'nermin-sefic/index.html',
              'the-code/index.html',
              'digital-workforce/index.html',
          )

          for relative in required:
              path = portal / relative
              assert path.is_file(), f'missing required SEO surface: {path}'
              text = path.read_text(encoding='utf-8', errors='replace')
              lower = text.lower()
              assert '<title' in lower, f'{path}: missing title'
              assert re.search(r'<meta[^>]+name=["\']description["\']', text, re.I), f'{path}: missing meta description'
              assert re.search(r'<link[^>]+rel=["\']canonical["\']', text, re.I), f'{path}: missing canonical'

          person = (portal / 'nermin-sefic/index.html').read_text(encoding='utf-8', errors='replace')
          assert 'Nermin Sefić' in person or 'Nermin Sefic' in person, 'person page lost Nermin Sefic entity attribution'

          code = (portal / 'the-code/index.html').read_text(encoding='utf-8', errors='replace')
          assert 'GNK ASG' in code, 'THE CODE page lost GNK ASG entity attribution'

          workforce = (portal / 'digital-workforce/index.html').read_text(encoding='utf-8', errors='replace')
          assert 'noindex' not in workforce.lower(), 'Digital Workforce unexpectedly became noindex'
          PY
