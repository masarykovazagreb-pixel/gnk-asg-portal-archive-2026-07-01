name: Check SEO Attribution V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/portal/**/index.html'
      - '.github/workflows/check-seo-attribution-v1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate committed SEO attribution contract
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          checks = {
              'apps/portal/index.html': [
                  'SEO-ATTRIBUTION:BEGIN',
                  'name="author" content="GNK ASG d.o.o."',
                  'name="editor" content="Nermin Sefić"',
                  'Direktor i odgovorna izvršna osoba',
              ],
              'apps/portal/objave/povjerenje-investitora-kroz-transparentnost/index.html': [
                  'name="author" content="Nermin Sefić"',
                  'Autor i urednik',
              ],
              'apps/portal/the-code/index.html': [
                  'Direktor i odgovorna izvršna osoba projekta',
              ],
              'apps/portal/nermin-sefic/index.html': [
                  'Direktor GNK ASG d.o.o. i ovlašteni predstavnik GNK DINAMO Ltd.',
              ],
          }

          failures = []
          for raw_path, required in checks.items():
              path = Path(raw_path)
              if not path.is_file():
                  failures.append(f'missing file: {raw_path}')
                  continue
              text = path.read_text(encoding='utf-8')
              for needle in required:
                  if needle not in text:
                      failures.append(f'{raw_path}: missing {needle!r}')

          admin = Path('apps/portal/admin-center/index.html')
          if not admin.is_file():
              failures.append('missing file: apps/portal/admin-center/index.html')
          elif 'SEO-ATTRIBUTION:BEGIN' in admin.read_text(encoding='utf-8'):
              failures.append('apps/portal/admin-center/index.html: public SEO attribution marker must not be present')

          if failures:
              raise SystemExit('SEO attribution contract failed:\n- ' + '\n- '.join(failures))

          print('SEO attribution contract: PASS')
          PY
