name: AKTUAL Approved Columns Batch Publish

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7,13,17 * * *'
  push:
    branches: [main]
    paths:
      - 'apps/portal/data/kolumne-red/**'
      - 'scripts/kolumne-publish-v1.mjs'
      - 'scripts/generate-kolumna-page.mjs'
      - '.github/workflows/aktual-approved-columns-publish.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: gnk-asg-main-mutation
  cancel-in-progress: false

jobs:
  publish-approved-only:
    if: vars.GNK_ASG_RELEASE_FENCE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture exact main revision
        id: baseline
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Process approved source manuscripts and skip duplicates
        run: node scripts/kolumne-publish-v1.mjs --sve --uzivo
      - name: Detect newly materialized columns
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/portal/data/kolumne.json apps/portal/gnk-aktual/kolumne apps/portal/en/gnk-aktual/columns; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Regenerate registry, imagery, index and sitemap
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          node scripts/editorial-registry-v1.mjs
          node scripts/generate-editorial-cover-assets-v1.mjs
          node scripts/build-aktual-columns-index-v1.mjs --write
          node scripts/generate-editorial-sitemap-v2.mjs
      - name: Validate all published columns and editorial contract
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 scripts/validate_aktual_columns.py
          node scripts/test-editorial-publish-seo-v1.mjs
      - name: Push exact source SHA and dispatch reviewed deployment
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.baseline.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gnk-asg-columns-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/portal/data/kolumne.json apps/portal/data/editorial-registry.json apps/portal/data/editorial-image-manifest.json apps/portal/assets/editorial/generated apps/portal/gnk-aktual/kolumne apps/portal/en/gnk-aktual/columns apps/portal/editorial-sitemap.xml apps/portal/sitemap-index.xml
          git diff --cached --quiet && exit 0
          git commit -m "AKTUAL: publish newly approved original columns"
          git fetch origin main --no-tags
          [ "$(git rev-parse origin/main)" = "$EXPECTED_SHA" ] || { echo "Main moved; stop without rebase or deploy."; exit 75; }
          git push origin HEAD:main
          published_sha="$(git rev-parse HEAD)"
          gh workflow run deploy-admin-auth-v6.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f confirm_production_deploy=DEPLOY_ADMIN_AUTH_V6 \
            -f approved_sha="$published_sha" \
            -f notify_search_engines=false
