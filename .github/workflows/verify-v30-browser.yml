name: Verify clean index V30 in browser

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-v30-browser.yml'
      - '.github/verify-v30-browser.trigger'

permissions:
  contents: read
  issues: write

concurrency:
  group: gnk-asg-v30-browser-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Audit HR and EN desktop and mobile
        shell: bash
        run: |
          mkdir -p artifacts
          node <<'JS'
          const fs=require('node:fs');
          const {chromium}=require('playwright');
          const base='https://gnk-asg.hr';
          const cases=[
            {name:'hr-desktop',path:'/',viewport:{width:1440,height:1100}},
            {name:'hr-mobile',path:'/',viewport:{width:390,height:844}},
            {name:'en-desktop',path:'/en/',viewport:{width:1440,height:1100}},
            {name:'en-mobile',path:'/en/',viewport:{width:390,height:844}}
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const results=[];
            for(const item of cases){
              const page=await browser.newPage({viewport:item.viewport});
              const errors=[];
              page.on('pageerror',error=>errors.push(`pageerror:${error.message}`));
              page.on('console',message=>{if(message.type()==='error')errors.push(`console:${message.text()}`)});
              const response=await page.goto(`${base}${item.path}?v30browser=${Date.now()}`,{waitUntil:'networkidle',timeout:60000});
              await page.waitForTimeout(4500);
              const audit=await page.evaluate(()=>{
                const visible=element=>{
                  const style=getComputedStyle(element),rect=element.getBoundingClientRect();
                  return style.display!=='none'&&style.visibility!=='hidden'&&Number(style.opacity)!==0&&rect.width>0&&rect.height>0;
                };
                const visibleCount=selector=>[...document.querySelectorAll(selector)].filter(visible).length;
                const text=id=>(document.getElementById(id)?.innerText||'').replace(/\s+/g,' ').trim();
                const styles=[...document.querySelectorAll('link[rel="stylesheet"]')].map(link=>link.href);
                return {
                  title:document.title,
                  lang:document.documentElement.lang,
                  viewportWidth:innerWidth,
                  documentWidth:document.documentElement.scrollWidth,
                  horizontalOverflow:Math.max(0,document.documentElement.scrollWidth-innerWidth),
                  visiblePremiumHeaders:visibleCount('#gnk-asg-premium-header'),
                  visibleLegacyHeaders:visibleCount('.brand-head,.top-nav'),
                  visibleMain:visibleCount('main'),
                  visibleHero:visibleCount('main .hero'),
                  stableIndexCss:styles.filter(url=>url.includes('index-redesign-production.css')&&url.includes('stable-v30')),
                  stablePolishLoaded:styles.some(url=>url.includes('index-redesign-production.css')&&url.includes('stable-v30')),
                  legacyPolishLoaded:styles.some(url=>url.includes('index-polish-v1.css')),
                  latestNews:text('latestNews'),
                  locationList:text('locationList'),
                  marketRows:text('marketRows'),
                  publicationRows:text('publicationRows'),
                  bodyClass:document.body.className
                };
              });
              const failures=[];
              if(!response||response.status()!==200)failures.push(`http=${response?.status()||0}`);
              if(audit.horizontalOverflow>2)failures.push(`horizontalOverflow=${audit.horizontalOverflow}`);
              if(audit.visiblePremiumHeaders!==1)failures.push(`visiblePremiumHeaders=${audit.visiblePremiumHeaders}`);
              if(audit.visibleLegacyHeaders!==0)failures.push(`visibleLegacyHeaders=${audit.visibleLegacyHeaders}`);
              if(audit.visibleMain!==1||audit.visibleHero!==1)failures.push('main_or_hero_not_visible');
              if(!audit.stablePolishLoaded)failures.push('stable_v30_css_missing');
              if(audit.legacyPolishLoaded)failures.push('legacy_polish_loaded');
              for(const [key,value] of Object.entries({latestNews:audit.latestNews,locationList:audit.locationList,marketRows:audit.marketRows,publicationRows:audit.publicationRows})){
                if(!value||/Učitavanje|Loading/i.test(value))failures.push(`${key}=placeholder_or_empty`);
              }
              if(errors.length)failures.push(...errors.slice(0,8));
              await page.screenshot({path:`artifacts/${item.name}.png`,fullPage:true});
              results.push({...item,http:response?.status()||0,audit,errors,failures});
              await page.close();
            }
            await browser.close();
            const report={checkedAt:new Date().toISOString(),commit:process.env.GITHUB_SHA,ok:results.every(result=>result.failures.length===0),results};
            fs.writeFileSync('artifacts/report.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report,null,2));
            if(!report.ok)process.exit(1);
          })().catch(error=>{console.error(error);process.exit(1)});
          JS

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-index-v30-browser-audit
          path: artifacts
          if-no-files-found: error

      - name: Report browser result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          summary=$(node -e "const fs=require('fs');try{const r=JSON.parse(fs.readFileSync('artifacts/report.json','utf8'));console.log(JSON.stringify({ok:r.ok,checkedAt:r.checkedAt,results:r.results.map(x=>({name:x.name,http:x.http,failures:x.failures,audit:x.audit}))},null,2))}catch(e){console.log(JSON.stringify({error:'report unavailable'},null,2))}")
          gh issue comment 101 --body "V30 browser audit **${JOB_STATUS}** · commit \`${RUN_SHA}\` · ${RUN_URL}\n\n\`\`\`json\n${summary}\n\`\`\`"
