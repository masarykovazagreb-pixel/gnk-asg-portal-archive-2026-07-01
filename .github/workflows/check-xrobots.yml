name: Provjeri X-Robots-Tag na API
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p apps/portal/data/tmp-xrobots
          curl -sD - -o /dev/null "https://gnk-asg.hr/api/public-operations/catalog" > apps/portal/data/tmp-xrobots/r.txt
          curl -sD - -o /dev/null "https://gnk-asg.hr/api/v1/products" >> apps/portal/data/tmp-xrobots/r.txt
          cat apps/portal/data/tmp-xrobots/r.txt
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          BRANCH="xrobots-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-xrobots
          git commit -m "xrobots check"
          git push origin "$BRANCH"
