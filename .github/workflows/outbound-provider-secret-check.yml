name: Outbound Provider Secret Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      POSTMARK_API_KEY: ${{ secrets.POSTMARK_API_KEY }}
      MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
      - name: Report provider availability without values
        shell: bash
        run: |
          [ -n "$RESEND_API_KEY" ] && echo 'RESEND_AVAILABLE=true' || echo 'RESEND_AVAILABLE=false'
          [ -n "$BREVO_API_KEY" ] && echo 'BREVO_AVAILABLE=true' || echo 'BREVO_AVAILABLE=false'
          [ -n "$SENDGRID_API_KEY" ] && echo 'SENDGRID_AVAILABLE=true' || echo 'SENDGRID_AVAILABLE=false'
          [ -n "$POSTMARK_API_KEY" ] && echo 'POSTMARK_AVAILABLE=true' || echo 'POSTMARK_AVAILABLE=false'
          [ -n "$MAILGUN_API_KEY" ] && echo 'MAILGUN_AVAILABLE=true' || echo 'MAILGUN_AVAILABLE=false'
          if [ -n "$SMTP_USERNAME" ] && [ -n "$SMTP_PASSWORD" ]; then echo 'SMTP_AVAILABLE=true'; else echo 'SMTP_AVAILABLE=false'; fi
