name: Check Editorial Publication Completeness V1
on:
  pull_request:
    paths:
      - 'apps/portal/data/editorial-registry.json'
      - 'apps/portal/objave/**'
      - 'apps/portal/komentari/**'
      - 'apps/portal/analize/**'
      - 'apps/portal/editorial-sitemap.xml'
      - 'scripts/sync-editorial-collection-indexes-v1.mjs'
      - 'scripts/audit-editorial-publication-completeness-v1.mjs'
      - '.github/workflows/check-editorial-publication-completeness-v1.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  completeness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/audit-editorial-publication-completeness-v1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-publication-completeness-v1
          path: artifacts/editorial/publication-completeness-v1.json
          retention-days: 14
