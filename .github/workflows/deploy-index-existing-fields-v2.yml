name: Deploy Index Existing Fields V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-index-existing-fields-v2.yml'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v22-news.js'
      - 'apps/portal/assets/index-existing-media-slots-v2.css'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnk-asg-canonical-production
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate package
        run: |
          set -euxo pipefail
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v22-news.js
          test -s apps/portal/assets/index-existing-media-slots-v2.css
          grep -q 'GNK_ASG_INDEX_EXISTING_FIELDS_V2_20260627' workers/gnk-asg-direct-operator/src/index-admin-hub-v22-news.js
          grep -q 'gnkExistingVisualOne 20s' apps/portal/assets/index-existing-media-slots-v2.css
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator
      - name: Deploy canonical Worker
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator
      - name: Verify live placement
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function get(path){
            const response=await fetch(`https://gnk-asg.hr${path}${path.includes('?')?'&':'?'}cb=${Date.now()}`,{headers:{'cache-control':'no-cache'}});
            return{status:response.status,text:await response.text(),headers:Object.fromEntries(response.headers)};
          }
          (async()=>{
            let last;
            for(let attempt=1;attempt<=18;attempt++){
              const [hr,en,code]=await Promise.all([get('/'),get('/en/'),get('/the-code/')]);
              const failures=[];
              for(const [name,result] of Object.entries({hr,en})){
                const map=result.text.indexOf('<article class="map-card"');
                const visual=result.text.indexOf('data-gnk-existing-field="visuals"');
                const locations=result.text.indexOf('<article class="locations"');
                const codeField=result.text.indexOf('data-gnk-existing-field="the-code"');
                const expansion=result.text.indexOf('<aside class="expansion"');
                if(result.status!==200)failures.push(`${name}_status_${result.status}`);
                if(!(map>=0&&map<visual&&visual<locations&&locations<codeField&&codeField<expansion))failures.push(`${name}_placement`);
                if((result.text.match(/data:image\/webp;base64,/g)||[]).length!==2)failures.push(`${name}_images`);
                if(!result.text.includes('index-existing-media-slots-v2.css'))failures.push(`${name}_css`);
                if(!result.text.includes('/the-code/?v=20260627-existing-v2'))failures.push(`${name}_iframe`);
                if(result.text.includes('gnk-code-slot')||result.text.includes('gnk-activation'))failures.push(`${name}_standalone`);
                if(result.headers['x-gnk-asg-index-existing-fields']!=='GNK_ASG_INDEX_EXISTING_FIELDS_V2_20260627')failures.push(`${name}_header`);
              }
              if(code.status!==200)failures.push(`the_code_${code.status}`);
              last={attempt,failures,codes:{hr:hr.status,en:en.status,code:code.status}};
              console.log(JSON.stringify(last));
              if(!failures.length)return;
              await sleep(10000);
            }
            throw new Error(JSON.stringify(last));
          })().catch(error=>{console.error(error);process.exitCode=1});
          JS
