name: Deploy Final Functional Clean

on:
  push:
    branches: [final-functional-clean-20260628-v2]
    paths:
      - '.github/workflows/deploy-final-functional-clean.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-final-functional-clean.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnk-asg-final-functional-production-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validate-deploy-verify:
    if: github.event_name != 'pull_request' || github.head_ref == 'final-functional-clean-20260628-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate final functionality
        shell: bash
        run: |
          set -euo pipefail
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v28-news-no-fallback.js
          node --check workers/gnk-asg-direct-operator/src/contact-submit-v1.js
          node --check apps/portal/assets/index-priority-v1.js
          grep -q 'AUTO_CYCLE_MS' apps/portal/assets/index-priority-v1.js
          grep -q 'location-directory' apps/portal/assets/index-priority-v1.css
          grep -q 'FULL_AUTO_LOOP_WITH_COUNTDOWN' workers/gnk-asg-direct-operator/src/index-admin-hub-v28-news-no-fallback.js
          grep -q '/api/contact-submit' apps/portal/contact/index.html
          grep -q 'index-media-command-center-v21.js' workers/gnk-asg-direct-operator/src/index-admin-hub-v28-news-no-fallback.js
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator
      - name: Deploy Worker and assets
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator
      - name: Verify Index full cycle and network
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          curl -fsS "https://gnk-asg.hr/?cb=${GITHUB_RUN_ID}" -o /tmp/index.html
          grep -q 'index-priority-v1.js?v=20260628-v3' /tmp/index.html
          grep -q 'locationDirectory' /tmp/index.html
          grep -q 'GNK ASG d.o.o.' /tmp/index.html
          grep -q 'GNK DINAMO Ltd.' /tmp/index.html
      - name: Verify Contact page and endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://gnk-asg.hr/contact/?cb=${GITHUB_RUN_ID}" -o /tmp/contact.html
          grep -q 'contact-quality-v2.css?v=20260628-v5' /tmp/contact.html
          grep -q '/api/contact-submit' /tmp/contact.html
          CODE=$(curl -sS -o /tmp/contact-api.json -w '%{http_code}' "https://gnk-asg.hr/api/contact-submit?cb=${GITHUB_RUN_ID}")
          echo "Contact GET status: $CODE"
          [ "$CODE" = '405' ]
      - name: Verify one-token Admin entry
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o /tmp/admin.html -w '%{http_code}' "https://gnk-asg.hr/admin-center/?cb=${GITHUB_RUN_ID}")
          echo "Admin status: $CODE"
          case "$CODE" in 200|401|403) ;; *) exit 1 ;; esac
          grep -Eqi 'operatorski token|Admin prijava|Operator token' /tmp/admin.html
      - name: Verify Mail Studio protection
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o /tmp/mail.json -w '%{http_code}' "https://gnk-asg.hr/api/mail-center/send-readiness?cb=${GITHUB_RUN_ID}")
          echo "Mail readiness status: $CODE"
          case "$CODE" in 401|403) ;; *) exit 1 ;; esac
      - name: Verify Media Sender protection
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o /tmp/media.json -w '%{http_code}' "https://gnk-asg.hr/api/media-command-center/delivery-status?cb=${GITHUB_RUN_ID}")
          echo "Media delivery status: $CODE"
          case "$CODE" in 401|403) ;; *) exit 1 ;; esac
