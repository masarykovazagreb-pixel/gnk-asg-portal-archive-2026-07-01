name: Deploy Final Functional Clean

on:
  push:
    branches: [final-functional-clean-20260628-v2]
    paths:
      - '.github/workflows/deploy-final-functional-clean.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnk-asg-final-functional-production
  cancel-in-progress: false

jobs:
  validate-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate final functionality
        shell: bash
        run: |
          set -euo pipefail
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v28-news-no-fallback.js
          node --check workers/gnk-asg-direct-operator/src/contact-submit-v1.js
          node --check apps/portal/assets/index-priority-v1.js
          grep -q 'AUTO_CYCLE_MS' apps/portal/assets/index-priority-v1.js
          grep -q 'location-directory' apps/portal/assets/index-priority-v1.css
          grep -q 'FULL_AUTO_LOOP_WITH_COUNTDOWN' workers/gnk-asg-direct-operator/src/index-admin-hub-v28-news-no-fallback.js
          grep -q '/api/contact-submit' apps/portal/contact/index.html
          grep -q 'index-media-command-center-v21.js' workers/gnk-asg-direct-operator/src/index-admin-hub-v28-news-no-fallback.js
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator
      - name: Deploy Worker and assets
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator
      - name: Verify production without sending mail
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 24); do
            CB="${GITHUB_RUN_ID}-${n}"
            HR=$(curl -fsS "https://gnk-asg.hr/?cb=${CB}" || true)
            CONTACT=$(curl -fsS "https://gnk-asg.hr/contact/?cb=${CB}" || true)
            ADMIN_CODE=$(curl -sS -o /tmp/admin.html -w '%{http_code}' "https://gnk-asg.hr/admin-center/?cb=${CB}" || true)
            MAIL_CODE=$(curl -sS -o /tmp/mail.json -w '%{http_code}' "https://gnk-asg.hr/api/mail-center/send-readiness?cb=${CB}" || true)
            MEDIA_CODE=$(curl -sS -o /tmp/media.json -w '%{http_code}' "https://gnk-asg.hr/api/media-command-center/delivery-status?cb=${CB}" || true)
            CONTACT_API_CODE=$(curl -sS -o /tmp/contact-api.json -w '%{http_code}' "https://gnk-asg.hr/api/contact-submit?cb=${CB}" || true)
            if printf '%s' "$HR" | grep -q 'index-priority-v1.js?v=20260628-v3' \
              && printf '%s' "$HR" | grep -q 'locationDirectory' \
              && printf '%s' "$CONTACT" | grep -q 'contact-quality-v2.css?v=20260628-v5' \
              && printf '%s' "$CONTACT" | grep -q '/api/contact-submit' \
              && [ "$ADMIN_CODE" = '401' ] \
              && grep -qi 'operatorski token\|Admin prijava' /tmp/admin.html \
              && [ "$MAIL_CODE" = '401' ] \
              && [ "$MEDIA_CODE" = '401' ] \
              && [ "$CONTACT_API_CODE" = '405' ]; then
              echo 'Final functional production verification passed.'
              exit 0
            fi
            sleep 10
          done
          echo 'Final functional production verification failed.' >&2
          exit 1
