name: Temporary editorial parity patch 1230

on:
  push:
    branches:
      - agent/fix-i18n-editorial-en-indexes-20260809
    paths:
      - '.github/workflows/temp-editorial-parity-patch-1230.yml'

permissions:
  contents: write

concurrency:
  group: temp-editorial-parity-patch-1230
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-i18n-editorial-en-indexes-20260809
          fetch-depth: 0
      - name: Patch reciprocal HR hreflang metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = [
              (
                  Path('apps/portal/komentari/index.html'),
                  '<link rel="alternate" hreflang="en" href="https://gnk-asg.hr/en/commentary/">',
                  '<link rel="alternate" hreflang="en" href="https://gnk-asg.hr/en/commentary/"><link rel="alternate" hreflang="x-default" href="https://gnk-asg.hr/komentari/">',
              ),
              (
                  Path('apps/portal/objave/index.html'),
                  '<link rel="alternate" hreflang="hr" href="https://gnk-asg.hr/objave/"><link rel="alternate" hreflang="x-default" href="https://gnk-asg.hr/objave/">',
                  '<link rel="alternate" hreflang="hr" href="https://gnk-asg.hr/objave/"><link rel="alternate" hreflang="en" href="https://gnk-asg.hr/en/publications/"><link rel="alternate" hreflang="x-default" href="https://gnk-asg.hr/objave/">',
              ),
          ]
          for path, old, new in changes:
              text = path.read_text(encoding='utf-8')
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one target, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          grep -q 'hreflang="x-default" href="https://gnk-asg.hr/komentari/"' apps/portal/komentari/index.html
          grep -q 'hreflang="en" href="https://gnk-asg.hr/en/publications/"' apps/portal/objave/index.html
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'gnk-editorial-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/temp-editorial-parity-patch-1230.yml
          git add apps/portal/komentari/index.html apps/portal/objave/index.html
          git diff --cached --check
          git commit -m 'fix(i18n): complete reciprocal editorial index parity'
          git push origin HEAD:agent/fix-i18n-editorial-en-indexes-20260809
