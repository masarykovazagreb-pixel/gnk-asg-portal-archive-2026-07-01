name: Public Portal Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-portal-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium visual-audit runtime
        working-directory: apps/portal
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --no-package-lock --no-save @playwright/test@1.52.0
          npx playwright install --with-deps chromium

      - name: Syntax checks
        run: |
          set -euo pipefail
          bash -n scripts/verify-production-route.sh
          bash -n scripts/check-newsroom-route-readiness.sh
          for file in \
            scripts/audit-public-portal-v1.mjs \
            scripts/audit-all-pages-detailed-v1.mjs \
            scripts/audit-worker-route-ownership.mjs \
            scripts/audit-seo-entity-integrity-v1.mjs \
            scripts/predeploy-release-v6.mjs \
            scripts/prepare-approved-deploy-v1.mjs \
            scripts/assert-production-news-fallback.mjs \
            scripts/validate-visual-contrast-results-v1.mjs \
            scripts/clear-homepage-contrast-retry-evidence-v1.mjs \
            scripts/test-deploy-approval-guardrails.mjs \
            scripts/test-index-runtime-ownership.mjs \
            scripts/test-public-design-contract.mjs \
            scripts/test-unified-shell-contract.mjs \
            scripts/test-visible-menu-logo-content-v1.mjs \
            scripts/test-final-release-v31.mjs \
            scripts/test-worker-directory-1573.mjs \
            scripts/test-admin-session-login-v1.mjs \
            scripts/test-digital-workforce-api-contract.mjs \
            scripts/test-operator-center-session-contract.mjs \
            scripts/test-protected-operations-session-contract.mjs \
            scripts/test-contact-form-contract.mjs \
            scripts/test-the-code-index-contract.mjs \
            scripts/test-index-content-contract.mjs \
            scripts/test-data-fallback-contract.mjs \
            scripts/test-email-signature-contract.mjs \
            scripts/test-mail-transport-guardrails.mjs \
            scripts/test-email-mime-guardrails.mjs \
            scripts/test-autoreply-guardrails.mjs \
            scripts/test-autoreply-all-addresses.mjs \
            scripts/test-news-queue-guardrails.mjs \
            scripts/test-public-editorial-asset-routes-v1.mjs \
            apps/portal/tests/all-pages-visual-contrast.spec.js \
            apps/portal/assets/public-compact-menu-v1.js \
            apps/portal/assets/public-design-runtime-v1.js \
            apps/portal/assets/public-unified-menu-v5.js \
            apps/portal/assets/public-unified-design-v3.js \
            apps/portal/assets/index-editorial-order-v5.js \
            apps/portal/assets/public-unified-menu-v6.js \
            apps/portal/assets/public-contrast-hardening-v1.js \
            apps/portal/assets/index-editorial-order-v6.js \
            apps/portal/assets/index-editorial-cleanup-v1.js \
            apps/portal/assets/mail-studio-ui-v28.js \
            apps/portal/assets/workers-directory-v1.js \
            apps/portal/assets/protected-operations-v1.js \
            apps/portal/assets/contact-form-v2.js \
            apps/portal/assets/release-completion-v1.js \
            apps/portal/assets/index-data-resilience-v1.js \
            apps/portal/assets/index-editorial-order-v1.js \
            apps/portal/assets/newsroom-live-v1.js \
            apps/portal/assets/public-market-live-v1.js \
            apps/portal/assets/market-centre-data.js \
            workers/gnk-asg-contact-api-worker/src/index-session-cookie-v1.js \
            workers/gnk-asg-direct-operator/src/news-auto-publication-v1.js \
            workers/gnk-asg-direct-operator/src/outbound-mail-transport-v1.js \
            workers/gnk-asg-direct-operator/src/contact-studio-mail-v1.js \
            workers/gnk-asg-direct-operator/src/email-logo-endpoint-v1.js \
            workers/gnk-asg-direct-operator/src/email-brand-signature-v1.js \
            workers/gnk-asg-direct-operator/src/email-brand-mime-v1.js \
            workers/gnk-asg-direct-operator/src/email-brand-mime-safe-v2.js \
            workers/gnk-asg-direct-operator/src/email-signature-contract-v1.js \
            workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js \
            workers/gnk-asg-direct-operator/src/mail-identity-autoreply-all-v1.js \
            workers/gnk-asg-direct-operator/src/index-unified-auth-v17.js \
            workers/gnk-asg-direct-operator/src/index-unified-auth-v18.js \
            workers/gnk-asg-direct-operator/src/index-unified-auth-v19.js \
            workers/gnk-asg-direct-operator/src/index-unified-auth-v20.js \
            workers/gnk-asg-direct-operator/src/index-unified-auth-v21.js \
            workers/gnk-asg-direct-operator/src/index-unified-auth-v22.js \
            workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js \
            workers/gnk-asg-direct-operator/src/dynamic-editorial-image-v1.js \
            workers/gnk-asg-direct-operator/src/public-market-data-v1.js \
            workers/gnk-asg-ai-newsroom-writer/src/index.js \
            workers/gnk-asg-direct-operator/src/digital-workforce-api-v1.js \
            workers/gnk-asg-operator-center/src/index.js \
            workers/gnk-asg-direct-operator/src/public-editorial-asset-router-v1.js
          do
            echo "CHECK $file"
            node --check "$file"
          done

      - name: Deploy approval contract
        run: node scripts/test-deploy-approval-guardrails.mjs

      - name: Index runtime ownership contract
        run: node scripts/test-index-runtime-ownership.mjs

      - name: Public design contract
        run: node scripts/test-public-design-contract.mjs

      - name: Unified shell contract
        run: node scripts/test-unified-shell-contract.mjs

      - name: Visible menu, standard logo and content contract
        run: node scripts/test-visible-menu-logo-content-v1.mjs

      - name: V31 final release contract
        run: node scripts/test-final-release-v31.mjs

      - name: Exact 1573 worker directory contract
        run: node scripts/test-worker-directory-1573.mjs

      - name: Secure admin session contract
        run: node scripts/test-admin-session-login-v1.mjs

      - name: Digital workforce API contract
        run: node scripts/test-digital-workforce-api-contract.mjs

      - name: Operator center session contract
        run: node scripts/test-operator-center-session-contract.mjs

      - name: Protected operations session contract
        run: node scripts/test-protected-operations-session-contract.mjs

      - name: Contact form contract
        run: node scripts/test-contact-form-contract.mjs

      - name: THE CODE index contract
        run: node scripts/test-the-code-index-contract.mjs

      - name: Index content contract
        run: node scripts/test-index-content-contract.mjs

      - name: Email signature contract
        run: node scripts/test-email-signature-contract.mjs

      - name: Mail transport contract
        run: node scripts/test-mail-transport-guardrails.mjs

      - name: Email MIME contract
        run: node scripts/test-email-mime-guardrails.mjs

      - name: Auto-reply loop contract
        run: node scripts/test-autoreply-guardrails.mjs

      - name: Auto-reply all-address contract
        run: node scripts/test-autoreply-all-addresses.mjs

      - name: News queue contract
        run: |
          node scripts/test-news-queue-guardrails.mjs
          node scripts/test-news-publication-seo-contract.mjs

      - name: SEO entity and sitemap integrity
        run: node scripts/audit-seo-entity-integrity-v1.mjs

      - name: Detailed page-by-page audit
        run: node scripts/audit-all-pages-detailed-v1.mjs

      - name: Homepage contrast evidence (deterministic, runs before full audit)
        timeout-minutes: 5
        working-directory: apps/portal
        run: |
          set -euo pipefail
          mkdir -p test-results/visual-contrast
          fuser -k 4173/tcp 2>/dev/null || true
          sleep 1
          npx playwright test tests/all-pages-visual-contrast.spec.js \
            --project=chromium-desktop \
            --project=chromium-mobile \
            --workers=1 \
            --grep 'rendered contrast /$|rendered contrast /en/$' \
            --output=test-results/playwright-homepage-first \
            --reporter=line

      - name: Browser-rendered desktop and mobile contrast audit
        id: playwright
        continue-on-error: true
        timeout-minutes: 70
        working-directory: apps/portal
        run: |
          set -euo pipefail
          mkdir -p test-results/visual-contrast
          set +e
          overall_status=0
          for shard in 1 2 3 4; do
            echo "=== Shard ${shard}/4 ==="
            fuser -k 4173/tcp 2>/dev/null || true
            sleep 1
            timeout --signal=TERM --kill-after=30s 15m \
              npx playwright test tests/all-pages-visual-contrast.spec.js \
                --project=chromium-desktop \
                --project=chromium-mobile \
                --workers=8 \
                --shard=${shard}/4 \
                --reporter=line \
              2>&1 | tee -a test-results/visual-contrast/playwright-output.log
            shard_status=${PIPESTATUS[0]}
            if [ "$shard_status" -ne 0 ]; then
              echo "WARNING: shard ${shard}/4 exited with status ${shard_status} (continuing to next shard)." | tee -a test-results/visual-contrast/playwright-output.log
              overall_status=1
            fi
          done
          set -e
          exit "$overall_status"

      - name: Ensure homepage contrast evidence
        timeout-minutes: 5
        working-directory: apps/portal
        run: |
          set -euo pipefail
          node ../../scripts/clear-homepage-contrast-retry-evidence-v1.mjs

      - name: Validate browser contrast evidence
        env:
          PLAYWRIGHT_RAW_OUTCOME: ${{ steps.playwright.outcome }}
        run: |
          set -euo pipefail
          echo "Raw Playwright outcome: ${PLAYWRIGHT_RAW_OUTCOME}"
          node scripts/validate-visual-contrast-results-v1.mjs

      - name: Public portal and infrastructure audits
        run: |
          set -euo pipefail
          node scripts/audit-public-portal-v1.mjs
          node scripts/audit-worker-route-ownership.mjs

      - name: Fallback data contract
        run: node scripts/test-data-fallback-contract.mjs

      - name: Full predeploy gate
        run: node scripts/predeploy-release-v6.mjs

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-portal-audit-${{ github.sha }}
          path: |
            artifacts/public-portal-audit.json
            artifacts/all-pages-detailed-audit.json
            artifacts/worker-route-ownership.json
            apps/portal/test-results/visual-contrast/**
            apps/portal/test-results/**/*.png
            apps/portal/test-results/**/*.jpg
          if-no-files-found: warn
          retention-days: 14
