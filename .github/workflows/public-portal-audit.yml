name: Public Portal Audit

on:
  pull_request:
    paths:
      - 'apps/portal/**'
      - 'workers/**'
      - 'scripts/audit-public-portal-v1.mjs'
      - 'scripts/audit-worker-route-ownership.mjs'
      - 'scripts/predeploy-release-v6.mjs'
      - 'scripts/prepare-approved-deploy-v1.mjs'
      - 'scripts/test-deploy-approval-guardrails.mjs'
      - 'scripts/test-email-signature-contract.mjs'
      - 'scripts/test-mail-transport-guardrails.mjs'
      - 'scripts/test-email-mime-guardrails.mjs'
      - 'scripts/test-autoreply-guardrails.mjs'
      - 'scripts/test-news-queue-guardrails.mjs'
      - 'scripts/verify-production-route.sh'
      - '.github/workflows/deploy-admin-auth-v6.yml'
      - '.github/workflows/public-portal-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-portal-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and structural audit
        run: |
          set -euo pipefail
          bash -n scripts/verify-production-route.sh
          node --check scripts/audit-public-portal-v1.mjs
          node --check scripts/audit-worker-route-ownership.mjs
          node --check scripts/predeploy-release-v6.mjs
          node --check scripts/prepare-approved-deploy-v1.mjs
          node --check scripts/test-deploy-approval-guardrails.mjs
          node --check scripts/test-email-signature-contract.mjs
          node --check scripts/test-mail-transport-guardrails.mjs
          node --check scripts/test-email-mime-guardrails.mjs
          node --check scripts/test-autoreply-guardrails.mjs
          node --check scripts/test-news-queue-guardrails.mjs
          node --check apps/portal/assets/public-compact-menu-v1.js
          node --check apps/portal/assets/newsroom-live-v1.js
          node --check apps/portal/assets/public-market-live-v1.js
          node --check apps/portal/assets/market-centre-data.js
          node --check workers/gnk-asg-direct-operator/src/news-auto-publication-v1.js
          node --check workers/gnk-asg-direct-operator/src/email-brand-signature-v1.js
          node --check workers/gnk-asg-direct-operator/src/email-brand-mime-v1.js
          node --check workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js
          node --check workers/gnk-asg-direct-operator/src/index-unified-auth-v17.js
          node --check workers/gnk-asg-direct-operator/src/index-unified-auth-v18.js
          node --check workers/gnk-asg-direct-operator/src/index-unified-auth-v19.js
          node scripts/test-deploy-approval-guardrails.mjs
          node scripts/test-email-signature-contract.mjs
          node scripts/test-mail-transport-guardrails.mjs
          node scripts/test-email-mime-guardrails.mjs
          node scripts/test-autoreply-guardrails.mjs
          node scripts/test-news-queue-guardrails.mjs
          node scripts/predeploy-release-v6.mjs
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-portal-audit
          path: |
            artifacts/public-portal-audit.json
            artifacts/worker-route-ownership.json
          if-no-files-found: warn
          retention-days: 14
