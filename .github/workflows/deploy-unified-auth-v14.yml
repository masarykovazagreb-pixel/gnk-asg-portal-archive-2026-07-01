name: Deploy Unified Auth V14

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-unified-auth-v14.yml"
      - "workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js"
      - "workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v1.js"
  workflow_run:
    workflows: ["Deploy public portal"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unified-auth-v14-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Verify unified authentication gateway
        working-directory: workers/gnk-asg-direct-operator
        shell: bash
        run: |
          set -euo pipefail
          test -s src/index-unified-auth-v14.js
          test -s src/index-final-admin-gateway-v1.js
          node --check src/index-unified-auth-v14.js
          node --check src/index-final-admin-gateway-v1.js
          grep -q 'MAIL STUDIO' src/index-final-admin-gateway-v1.js
          grep -q 'MEDIA CENTAR' src/index-final-admin-gateway-v1.js
          grep -q '/admin-center/' src/index-final-admin-gateway-v1.js
          npx --yes wrangler@4 deploy src/index-final-admin-gateway-v1.js --dry-run --config wrangler.toml --name gnk-asg-direct-operator

      - name: Deploy unified authentication gateway
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy src/index-final-admin-gateway-v1.js --config wrangler.toml --name gnk-asg-direct-operator

      - name: Verify authentication and final ADMIN flow
        shell: bash
        run: |
          set -euo pipefail
          base="https://gnk-asg.hr"
          success=false
          for attempt in $(seq 1 18); do
            stamp=$(date +%s)
            auth_code=$(curl -sS -o auth.json -w '%{http_code}' "$base/api/operator-auth-check?cb=$stamp" || true)
            admin_code=$(curl -sS -o admin.html -w '%{http_code}' "$base/admin-center/?cb=$stamp" || true)
            root_code=$(curl -sS -D root.headers -o root.html -w '%{http_code}' "$base/?cb=$stamp" || true)
            en_code=$(curl -sS -o en.html -w '%{http_code}' "$base/en/?cb=$stamp" || true)
            pdf_code=$(curl -sS -o pdf.html -w '%{http_code}' "$base/downloads/?cb=$stamp" || true)
            if [ "$auth_code" = "401" ] \
              && [ "$admin_code" = "401" ] \
              && [ "$root_code" = "200" ] \
              && [ "$en_code" = "200" ] \
              && [ "$pdf_code" = "200" ] \
              && grep -q 'GNK ASG sigurna prijava' admin.html \
              && grep -q 'href="/admin-center/"' root.html \
              && grep -q 'PDF CENTAR' root.html \
              && grep -q 'PDF CENTRE' en.html \
              && ! grep -q '>Markets<' en.html \
              && grep -qi '^x-gnk-asg-final-admin-gateway:' root.headers; then
              success=true
              break
            fi
            sleep 10
          done
          if [ "$success" != "true" ]; then
            echo "AUTH_HTTP=$auth_code ADMIN_HTTP=$admin_code ROOT_HTTP=$root_code EN_HTTP=$en_code PDF_HTTP=$pdf_code"
            exit 1
          fi
          echo "GNK_ASG_FINAL_AUTH_GATEWAY_OK=true"
