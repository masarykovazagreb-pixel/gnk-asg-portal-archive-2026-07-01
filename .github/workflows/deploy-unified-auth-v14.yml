name: Deploy Unified Auth V14

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-unified-auth-v14.yml"
      - "workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js"
  workflow_run:
    workflows: ["Deploy public portal"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unified-auth-v14-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify unified authentication source
        working-directory: workers/gnk-asg-direct-operator
        shell: bash
        run: |
          set -euo pipefail
          test -s src/index-unified-auth-v14.js
          test -s src/index-portal-final-v13.js
          node --check src/index-unified-auth-v14.js
          npx --yes wrangler@4 deploy src/index-unified-auth-v14.js --dry-run --config wrangler.toml

      - name: Deploy unified authentication
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy src/index-unified-auth-v14.js --config wrangler.toml --name gnk-asg-direct-operator

      - name: Verify authentication and backend bindings
        shell: bash
        run: |
          set -euo pipefail
          base="https://gnk-asg.hr"
          success=false
          for attempt in $(seq 1 18); do
            stamp=$(date +%s)
            version_code=$(curl -sSL -o version.json -w '%{http_code}' "$base/data/portal-version.json?cb=$stamp" || true)
            auth_code=$(curl -sSL -o auth.json -w '%{http_code}' "$base/api/operator-auth-check?cb=$stamp" || true)
            admin_code=$(curl -sSL -o admin.html -w '%{http_code}' "$base/operator-dashboard/?cb=$stamp" || true)
            root_code=$(curl -sSL -o root.html -w '%{http_code}' "$base/?cb=$stamp" || true)
            if [ "$version_code" = "200" ] && [ "$auth_code" = "401" ] && [ "$admin_code" = "401" ] && [ "$root_code" = "200" ] && grep -q 'GNK_ASG_UNIFIED_AUTH_V14_20260626' version.json && grep -q 'src/index-unified-auth-v14.js' version.json && grep -q '"configured": true' auth.json && grep -q 'GNK ASG sigurna prijava' admin.html; then
              success=true
              break
            fi
            sleep 10
          done
          if [ "$success" != "true" ]; then
            echo "VERSION_HTTP=$version_code AUTH_HTTP=$auth_code ADMIN_HTTP=$admin_code ROOT_HTTP=$root_code"
            cat version.json || true
            cat auth.json || true
            exit 1
          fi
          echo "GNK_ASG_UNIFIED_AUTH_V14_OK=true"
