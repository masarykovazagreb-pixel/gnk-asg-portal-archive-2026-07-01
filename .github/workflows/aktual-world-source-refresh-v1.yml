name: AKTUAL World — source headline refresh PR
on:
  workflow_dispatch:
    inputs:
      country:
        description: 'Optional existing country slug, e.g. hrvatska; empty refreshes all'
        required: false
        type: string
  schedule:
    - cron: '23 */3 * * *'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: aktual-world-source-refresh
  cancel-in-progress: false
jobs:
  refresh-pr:
    if: vars.GNK_ASG_RELEASE_FENCE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test registry and builder
        run: node --test tests/test-aktual-world-v1.mjs
      - name: Fetch external headlines as links only
        id: fetch_headlines
        env:
          AKTUAL_WORLD_RUN_REPORT: ${{ runner.temp }}/world-refresh-run.json
          AKTUAL_FEEDS_PER_COUNTRY: '10'
          AKTUAL_FETCH_CONCURRENCY: '12'
          AKTUAL_ITEMS_PER_COUNTRY: '30'
          COUNTRY: ${{ inputs.country }}
        shell: bash
        run: |
          args=()
          if [ -n "$COUNTRY" ]; then args+=(--country "$COUNTRY"); fi
          node scripts/refresh-aktual-world-headlines-v1.mjs "${args[@]}"
      - name: Save fetch diagnostics even when refresh fails
        if: ${{ !cancelled() && steps.fetch_headlines.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: world-refresh-run-${{ github.run_id }}
          path: ${{ runner.temp }}/world-refresh-run.json
          if-no-files-found: warn
          retention-days: 7
      - name: Prepare country-agent source briefs (not articles or approval)
        env:
          COUNTRY: ${{ inputs.country }}
        shell: bash
        run: |
          args=()
          if [ -n "$COUNTRY" ]; then args+=(--country "$COUNTRY"); fi
          node apps/agents/world201/run-v1.mjs "${args[@]}" > "$RUNNER_TEMP/world201-briefs.json"
      - name: Run country and network agents (source-linked leads only)
        env:
          COUNTRY: ${{ inputs.country }}
        shell: bash
        run: |
          args=()
          if [ -n "$COUNTRY" ]; then args+=(--country "$COUNTRY"); fi
          node apps/agents/world201/fleet-run-v1.mjs "${args[@]}" > "$RUNNER_TEMP/world210-fleet.json"
      - name: Check editorial kill switch
        id: writer_switch
        run: |
          node --input-type=module -e 'import {killSwitchState} from "./apps/agents/lib/policy-v1.mjs"; import {appendFileSync} from "node:fs"; const s=killSwitchState(); appendFileSync(process.env.GITHUB_OUTPUT, `enabled=${s.enabled ? "true" : "false"}\n`); console.log(s.enabled ? "Writer enabled" : "Writer paused: " + s.reason);'
      - name: Write attributed bilingual roundup drafts (not articles or publication)
        if: ${{ steps.writer_switch.outputs.enabled == 'true' }}
        env:
          COUNTRY: ${{ inputs.country }}
        shell: bash
        run: |
          args=()
          if [ -n "$COUNTRY" ]; then args+=(--country "$COUNTRY"); fi
          node apps/agents/world201/writer-run-v1.mjs "${args[@]}" > "$RUNNER_TEMP/world-roundups.json"
          node apps/agents/world201/writer-run-v1.mjs "${args[@]}" --format html > "$RUNNER_TEMP/world-roundups-preview.html"
      - name: Save unpublished drafts and preview
        if: ${{ steps.writer_switch.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: world-roundups-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/world-roundups.json
            ${{ runner.temp }}/world-roundups-preview.html
          retention-days: 7
      - name: Save fleet report for review
        uses: actions/upload-artifact@v4
        with:
          name: world210-fleet-${{ github.run_id }}
          path: ${{ runner.temp }}/world210-fleet.json
          retention-days: 7
      - name: Save country-agent briefs for review
        uses: actions/upload-artifact@v4
        with:
          name: world201-briefs-${{ github.run_id }}
          path: ${{ runner.temp }}/world201-briefs.json
          retention-days: 7
      - name: Regenerate static pages and RSS without copying article bodies
        env:
          AKTUAL_WORLD_OUT: apps/portal/gnk-aktual
          COUNTRY: ${{ inputs.country }}
        shell: bash
        run: |
          args=()
          if [ -n "$COUNTRY" ]; then args+=(--country "$COUNTRY"); fi
          node scripts/build-aktual-world-v1.mjs --base https://gnk-asg.hr/gnk-aktual/ "${args[@]}"
          node --test tests/test-aktual-world-v1.mjs
      - name: Preserve update patch if PR creation fails
        shell: bash
        run: |
          git add apps/portal/data/aktual-world-headlines-v1.json apps/portal/gnk-aktual/media apps/portal/gnk-aktual/grad
          git diff --cached --binary -- apps/portal/data/aktual-world-headlines-v1.json apps/portal/gnk-aktual/media apps/portal/gnk-aktual/grad > "$RUNNER_TEMP/world-source-update.patch"
      - name: Save update patch for recovery
        uses: actions/upload-artifact@v4
        with:
          name: world-source-update-${{ github.run_id }}
          path: ${{ runner.temp }}/world-source-update.patch
          retention-days: 7
      - name: Prepare source-update commit
        id: prepare_pr
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo 'No acceptable updated headlines.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A rerun gets a separate branch, avoiding collisions with its earlier attempt.
          branch="auto/aktual-world-refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git commit -m 'chore(aktual-world): refresh external headline links'
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Push source-update branch
        if: ${{ steps.prepare_pr.outputs.changed == 'true' }}
        env:
          UPDATE_BRANCH: ${{ steps.prepare_pr.outputs.branch }}
        run: git push origin "$UPDATE_BRANCH"
      - name: Open source-update PR, never deploy or auto-merge
        if: ${{ steps.prepare_pr.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: ${{ steps.prepare_pr.outputs.branch }}
        run: |
          gh pr create --base main --head "$UPDATE_BRANCH" --title 'AKTUAL World: osvježi poveznice na izvorne naslove' --body 'Automatski pripremljen skup poveznica i naslova vanjskih izvora. Bez kopiranja članaka i bez automatskog mergea/deploya. Provjeriti prava, svježinu, točnost naslova i CI prije objave.'