name: One-Time Editorial 10 Plus 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-editorial-10-plus-2-20260715.yml'

permissions:
  contents: write

concurrency:
  group: one-time-editorial-10-plus-2-20260715
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 3

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Stop if correction already exists
        id: guard
        shell: bash
        run: |
          if [ -f artifacts/editorial-commentary-reserve-20260714-15.json ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Correct source plan to 10 plus 2
        if: steps.guard.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const root='apps/portal/data/editorial-plan';
          const dates=['20260714','20260715'];
          const reserve=[];
          for(const date of dates){
            const file=path.join(root,`${date}-commentaries.json`);
            const items=JSON.parse(fs.readFileSync(file,'utf8'));
            if(items.length<2)throw new Error(`${file} has fewer than two commentaries`);
            if(items.length>2)reserve.push({date,item:items[2]});
            fs.writeFileSync(file,JSON.stringify(items.slice(0,2))+'\n');
          }
          fs.mkdirSync('artifacts',{recursive:true});
          fs.writeFileSync('artifacts/editorial-commentary-reserve-20260714-15.json',JSON.stringify({status:'not-published-reserve',createdAt:'2026-07-15',items:reserve},null,2)+'\n');
          const test='scripts/test-editorial-publish-seo-v1.mjs';
          let source=fs.readFileSync(test,'utf8');
          source=source.replace("assert.equal(pack.items.filter(x=>x.type==='komentar').length,3,`${pack.id} commentaries`);","assert.equal(pack.items.filter(x=>x.type==='komentar').length,2,`${pack.id} commentaries`);");
          source=source.replace(/commentaries:3/g,'commentaries:2');
          fs.writeFileSync(test,source);
          NODE
          node scripts/test-editorial-publish-seo-v1.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/portal/data/editorial-plan/20260714-commentaries.json apps/portal/data/editorial-plan/20260715-commentaries.json scripts/test-editorial-publish-seo-v1.mjs artifacts/editorial-commentary-reserve-20260714-15.json
          git commit -m "Set editorial packages to 10 publications and 2 commentaries"
          git push origin HEAD:main

      - name: Remove only the two reserve routes from public assets
        if: steps.guard.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const routes=[
            '/komentari/sastanak-bez-odluke-je-skupi-razgovor/',
            '/komentari/najskuplji-rizik-je-onaj-bez-vlasnika/'
          ];
          const manifestFile='apps/portal/data/editorial-plan/manifest.json';
          const manifest=JSON.parse(fs.readFileSync(manifestFile,'utf8'));
          manifest.version='GNK_ASG_EDITORIAL_PUBLICATION_PLAN_V3_20260715_10_PLUS_2';
          for(const pack of manifest.packages||[])pack.publishedRoutes=(pack.publishedRoutes||[]).filter(route=>!routes.includes(route));
          fs.writeFileSync(manifestFile,JSON.stringify(manifest,null,2)+'\n');

          const indexFile='apps/portal/komentari/index.html';
          let index=fs.readFileSync(indexFile,'utf8');
          for(const route of routes){
            const escaped=route.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
            const card=new RegExp(`<article class="editorial-card">(?:(?!<article class="editorial-card">)[\\s\\S])*?<a href="${escaped}">(?:(?!<article class="editorial-card">)[\\s\\S])*?<\\/article>`,'g');
            index=index.replace(card,'');
          }
          fs.writeFileSync(indexFile,index);

          const sitemapFile='apps/portal/editorial-sitemap.xml';
          let sitemap=fs.readFileSync(sitemapFile,'utf8');
          for(const route of routes){
            const url=`https://gnk-asg.hr${route}`.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
            sitemap=sitemap.replace(new RegExp(`\\s*<url>\\s*<loc>${url}<\\/loc>[\\s\\S]*?<\\/url>`,'g'),'');
          }
          fs.writeFileSync(sitemapFile,sitemap);
          for(const route of routes){
            const file=`apps/portal${route}index.html`;
            if(fs.existsSync(file))fs.rmSync(file);
          }
          NODE
          git add apps/portal/data/editorial-plan/manifest.json apps/portal/komentari/index.html apps/portal/editorial-sitemap.xml apps/portal/komentari/sastanak-bez-odluke-je-skupi-razgovor/index.html apps/portal/komentari/najskuplji-rizik-je-onaj-bez-vlasnika/index.html
          git commit -m "Publish exact 10 plus 2 editorial packages"
          git push origin HEAD:main

      - name: Remove one-time workflow
        if: steps.guard.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-time-editorial-10-plus-2-20260715.yml
          git commit -m "Remove completed one-time editorial correction"
          git push origin HEAD:main
