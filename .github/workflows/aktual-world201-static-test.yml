name: AKTUAL WORLD 201 static routes validation
on:
  pull_request:
    paths:
      - 'apps/portal/world/**'
      - 'scripts/test-aktual-world201-static-v1.mjs'
      - 'scripts/test-aktual-world-fast-news-v1.mjs'
      - 'apps/portal/assets/am-refresh-v1.js'
      - 'apps/portal/assets/aktual-world-choices-v1.js'
      - 'apps/portal/assets/aktual-world-live-brief-v1.js'
      - '.github/workflows/aktual-world201-static-test.yml'
permissions:
  contents: read
jobs:
  validate-world201:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 201 static editions and search
        run: |
          node --test scripts/test-aktual-world201-static-v1.mjs
          node scripts/test-aktual-world-fast-news-v1.mjs
