name: LinkedIn Daily Post Rotation (preview queue)
on:
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency:
  group: editorial-main-writer
  cancel-in-progress: false
jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install image generation dependency
        run: npm install sharp@0.33 --no-save
      - name: Generate today's post
        run: node scripts/linkedin-daily-rotation.mjs
      - name: Generate today's image
        run: node scripts/linkedin-daily-image.mjs
      - name: Commit the queue file and image
        run: |
          git config user.name "gnk-asg-bot"
          git config user.email "beckuphome@gmail.com"
          git add apps/portal/data/linkedin-content/today.json apps/portal/data/linkedin-content/today-image.png apps/portal/data/linkedin-content/archive/
          git diff --cached --quiet && echo "no changes" || git commit -m "chore: today's LinkedIn post + image preview [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            echo "Push odbijen (pokusaj $attempt) - main se pomaknuo, radim fetch+rebase."
            git fetch origin main
            git rebase origin/main || { echo "Rebase konflikt."; exit 1; }
            sleep $((attempt * 5))
            if [ "$attempt" = "5" ]; then echo "Push nije uspio nakon 5 pokusaja."; exit 1; fi
          done
      - name: Post preview as GitHub issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          POST_TEXT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('apps/portal/data/linkedin-content/today.json','utf8')).postText)")
          PROJECT_ID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('apps/portal/data/linkedin-content/today.json','utf8')).projectId)")
          {
            echo "# LinkedIn prijedlog objave — $(date -u +%Y-%m-%d)"
            echo ""
            echo "**Projekt:** $PROJECT_ID"
            echo ""
            echo "**Slika za objavu:** https://gnk-asg.hr/data/linkedin-content/today-image.png"
            echo ""
            echo '```'
            echo "$POST_TEXT"
            echo '```'
            echo ""
            echo "Preuzmite sliku s gornjeg linka, kopirajte tekst, i objavite ručno na LinkedIn stranici GNK ASG / GNK DINAMO Ltd. (ili osobnom profilu) dok automatsko objavljivanje nije aktivno (čeka se LinkedIn API pristup)."
          } > /tmp/linkedin-issue.md
          gh issue create --repo "${{ github.repository }}" --title "LinkedIn prijedlog objave — $(date -u +%Y-%m-%d)" --body-file /tmp/linkedin-issue.md --label "linkedin-queue" || \
          gh issue create --repo "${{ github.repository }}" --title "LinkedIn prijedlog objave — $(date -u +%Y-%m-%d)" --body-file /tmp/linkedin-issue.md
