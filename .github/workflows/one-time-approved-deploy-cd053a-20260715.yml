name: One-Time Approved Deploy cd053a

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-approved-deploy-cd053a-20260715.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: one-time-approved-deploy-cd053a-20260715
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exact approved production SHA
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: cd053a4514b2c322e25baa90cf06e77b7ca19b75
        run: |
          set -euo pipefail
          test "$APPROVED_SHA" = "cd053a4514b2c322e25baa90cf06e77b7ca19b75"
          gh workflow run deploy-admin-auth-v6.yml \
            --repo beckuphome-gnk/gnk-asg-portal \
            --ref main \
            -f confirm_production_deploy=DEPLOY_ADMIN_AUTH_V6 \
            -f approved_sha="$APPROVED_SHA"
          echo "Dispatched one-time approved production deploy for $APPROVED_SHA"
