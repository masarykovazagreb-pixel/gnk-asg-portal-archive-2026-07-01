name: Deploy Email Logo Gateway V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-email-logo-gateway-v1.yml'
      - 'workers/gnk-asg-direct-operator/src/index-final-admin-gateway-logo-v2.js'
      - 'workers/gnk-asg-direct-operator/src/email-signature-contract-v2.js'
      - 'workers/gnk-asg-direct-operator/src/email-inline-logo-v1.js'
      - 'workers/gnk-asg-direct-operator/src/email-brand-mime-v1.js'
      - 'workers/gnk-asg-direct-operator/src/email-raw-logo-v1.js'

permissions:
  contents: read

concurrency:
  group: gnk-asg-email-logo-gateway
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate email logo gateway
        run: |
          set -euo pipefail
          node --check workers/gnk-asg-direct-operator/src/email-brand-mime-v1.js
          node --check workers/gnk-asg-direct-operator/src/email-inline-logo-v1.js
          node --check workers/gnk-asg-direct-operator/src/email-signature-contract-v2.js
          node --check workers/gnk-asg-direct-operator/src/email-raw-logo-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-final-admin-gateway-logo-v2.js
          grep -q 'gnk-asg-email-logo-final.png' workers/gnk-asg-direct-operator/src/email-brand-mime-v1.js
          grep -q 'wrapInboundReply' workers/gnk-asg-direct-operator/src/index-final-admin-gateway-logo-v2.js
      - name: Deploy final logo gateway without route changes
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy src/index-final-admin-gateway-logo-v2.js --config wrangler.mail-proxy-no-routes.toml --name gnk-asg-direct-operator
      - name: Verify active logo gateway on Mail Center route
        run: |
          set -euo pipefail
          sleep 10
          code=$(curl --silent --show-error -D /tmp/logo-headers.txt -o /tmp/logo-body.txt -w '%{http_code}' "https://gnk-asg.hr/api/mail-center/send-readiness?logo=${GITHUB_SHA}" || true)
          cat /tmp/logo-headers.txt
          cat /tmp/logo-body.txt
          echo "HTTP=${code}"
          grep -qi '^x-gnk-asg-email-logo-gateway: GNK_ASG_FINAL_GATEWAY_LOGO_V2' /tmp/logo-headers.txt
          grep -qi '^x-gnk-asg-email-signature-contract:' /tmp/logo-headers.txt
