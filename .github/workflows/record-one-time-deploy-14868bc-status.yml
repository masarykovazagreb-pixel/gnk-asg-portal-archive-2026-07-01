name: Record One-Time Deploy 14868bc Status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/record-one-time-deploy-14868bc-status.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: record-one-time-deploy-14868bc-status
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Find and record approved deploy
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: 14868bc98bd4c9af51a095329c5c226ea3613f36
          NOT_BEFORE: '2026-07-15T07:14:00Z'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          runs_json=$(gh run list \
            --repo beckuphome-gnk/gnk-asg-portal \
            --workflow deploy-admin-auth-v6.yml \
            --event workflow_dispatch \
            --limit 30 \
            --json databaseId,createdAt,status,conclusion,headSha,url,displayTitle)
          run_id=$(printf '%s' "$runs_json" | jq -r --arg not_before "$NOT_BEFORE" '[.[] | select(.createdAt >= $not_before)] | sort_by(.createdAt) | last | .databaseId // empty')
          if [ -z "$run_id" ]; then
            jq -n \
              --arg approvedSha "$APPROVED_SHA" \
              --arg notBefore "$NOT_BEFORE" \
              '{ok:false,state:"no_matching_workflow_dispatch_run",approvedSha:$approvedSha,notBefore:$notBefore}' \
              > artifacts/one-time-deploy-14868bc-status.json
          else
            gh run view "$run_id" \
              --repo beckuphome-gnk/gnk-asg-portal \
              --json databaseId,createdAt,updatedAt,status,conclusion,headSha,url,event,workflowName,jobs \
              | jq --arg approvedSha "$APPROVED_SHA" '. + {approvedSha:$approvedSha,recordedAt:(now|todateiso8601)}' \
              > artifacts/one-time-deploy-14868bc-status.json
          fi

      - name: Commit deploy status evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/one-time-deploy-14868bc-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record one-time deploy 14868bc status"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            echo "Push odbijen (pokusaj $attempt) - main se pomaknuo, radim fetch+rebase."
            git fetch origin main
            git rebase origin/main || { echo "Rebase konflikt."; exit 1; }
            sleep $((attempt * 5))
            if [ "$attempt" = "5" ]; then echo "Push nije uspio nakon 5 pokusaja."; exit 1; fi
          done
