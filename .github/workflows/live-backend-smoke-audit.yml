name: GNK ASG Live Backend Smoke Audit

on:
  pull_request:
    branches:
      - visual-redesign
    paths:
      - 'workers/**'
      - 'contracts/**'
      - 'apps/portal/**'
      - 'scripts/live-backend-smoke-audit.mjs'
      - '.github/workflows/live-backend-smoke-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run read-only live backend audit
        continue-on-error: true
        run: node scripts/live-backend-smoke-audit.mjs

      - name: Publish summary
        if: always()
        run: |
          if [ -f reports/live-backend-audit/live-backend-audit.md ]; then
            cat reports/live-backend-audit/live-backend-audit.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audit report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gnk-asg-live-backend-audit-${{ github.run_id }}
          path: reports/live-backend-audit/
          if-no-files-found: warn
          retention-days: 7
