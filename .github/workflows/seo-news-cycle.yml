name: SEO and News Visibility Audit
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: editorial-seo-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Audit editorial SEO in read-only mode
        run: node scripts/seo-visibility-cycle-v1.mjs
      - name: Assert audit is read-only
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            echo "SEO audit detected deterministic changes, but this workflow is intentionally read-only."
            git status --short
          fi
      - name: Upload SEO audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: seo-visibility-audit-${{ github.sha }}
          path: |
            artifacts/seo-visibility-report.json
            apps/portal/data/seo-visibility-status.json
          if-no-files-found: warn
          retention-days: 1
