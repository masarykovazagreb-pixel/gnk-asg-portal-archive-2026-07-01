name: SEO and News Visibility Cycle
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Deploy the current exact main SHA even when no SEO or news data changed'
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: editorial-main-writer
  cancel-in-progress: false
jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Audit and repair editorial SEO
        run: node scripts/seo-visibility-cycle-v1.mjs
      - name: Commit safe deterministic updates
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/portal/data/update_status.json apps/portal/data/seo-visibility-status.json apps/portal/editorial-sitemap.xml apps/portal/objave apps/portal/komentari apps/portal/analize apps/portal/en/publications apps/portal/en/commentary apps/portal/en/analyses artifacts/seo-visibility-report.json; then
            echo "No public SEO or news value changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/portal/data/update_status.json apps/portal/data/seo-visibility-status.json apps/portal/editorial-sitemap.xml apps/portal/objave apps/portal/komentari apps/portal/analize apps/portal/en/publications apps/portal/en/commentary apps/portal/en/analyses artifacts/seo-visibility-report.json
          git commit -m "Refresh news and editorial SEO visibility"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Dispatch exact-SHA production deploy
        if: steps.commit.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_deploy == true)
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          gh workflow run deploy-admin-auth-v6.yml \
            --repo beckuphome-gnk/gnk-asg-portal \
            --ref main \
            -f confirm_production_deploy=DEPLOY_ADMIN_AUTH_V6 \
            -f approved_sha="$APPROVED_SHA"
