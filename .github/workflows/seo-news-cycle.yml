name: SEO and News Visibility Cycle
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editorial-seo-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Audit editorial SEO in isolated worktree
        run: node scripts/seo-visibility-cycle-v1.mjs
      - name: Report proposed deterministic changes without writing main
        shell: bash
        run: |
          set -euo pipefail
          echo "SEO visibility cycle is read-only. No repository writes or deploy dispatches are permitted."
          git status --short
          git diff --stat -- \
            apps/portal/data/update_status.json \
            apps/portal/data/seo-visibility-status.json \
            apps/portal/editorial-sitemap.xml \
            apps/portal/objave \
            apps/portal/komentari \
            apps/portal/analize \
            apps/portal/en/publications \
            apps/portal/en/commentary \
            apps/portal/en/analyses \
            artifacts/seo-visibility-report.json
      - name: Upload SEO audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-visibility-audit
          path: |
            artifacts/seo-visibility-report.json
            apps/portal/data/seo-visibility-status.json
          if-no-files-found: warn
          retention-days: 7
