name: Provjera profila zavrsna
on: workflow_dispatch
jobs:
  provjeri:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p apps/portal/data/tmp-profil-check
          curl -s "https://gnk-asg.hr/nermin-sefic/" -o /tmp/page.html
          echo "kod: $(curl -s -o /dev/null -w '%{http_code}' https://gnk-asg.hr/nermin-sefic/)" > apps/portal/data/tmp-profil-check/r.txt
          echo "biografija count: $(grep -o 'biografij' /tmp/page.html | wc -l)" >> apps/portal/data/tmp-profil-check/r.txt
          echo "linkedin count: $(grep -o 'hr.linkedin.com' /tmp/page.html | wc -l)" >> apps/portal/data/tmp-profil-check/r.txt
          echo "medijska pokrivenost count: $(grep -o 'Medijska pokrivenost' /tmp/page.html | wc -l)" >> apps/portal/data/tmp-profil-check/r.txt
          echo "FAQPage count: $(grep -o 'FAQPage' /tmp/page.html | wc -l)" >> apps/portal/data/tmp-profil-check/r.txt
          cat apps/portal/data/tmp-profil-check/r.txt
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          BRANCH="profil-check-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-profil-check
          git commit -m "profil check"
          git push origin "$BRANCH"
