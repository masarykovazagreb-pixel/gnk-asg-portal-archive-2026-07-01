name: GNK ASG Mail Agent Preview Check

on:
  pull_request:
    branches:
      - visual-redesign
    paths:
      - 'workers/gnk-asg-mail-agent-worker/**'
      - 'apps/portal/mail-studio-pro/**'
      - 'apps/portal/assets/mail-studio-pro.js'
      - 'apps/portal/assets/mail-studio-pro.css'
      - '.github/workflows/mail-agent-preview-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: JavaScript syntax checks
        run: |
          find workers/gnk-asg-mail-agent-worker/src -name '*.js' -print0 | xargs -0 -n1 node --check
          find workers/gnk-asg-mail-agent-worker/test -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check apps/portal/assets/mail-studio-pro.js

      - name: Mail thread and AI context tests
        run: |
          node workers/gnk-asg-mail-agent-worker/test/thread-context.test.js
          node workers/gnk-asg-mail-agent-worker/test/ai-thread-context.test.js

      - name: Mail campaign regression tests
        run: |
          node workers/gnk-asg-mail-agent-worker/test/media-campaign-window.test.js
          node workers/gnk-asg-mail-agent-worker/test/media-campaign-rate-limit.test.js
          node workers/gnk-asg-mail-agent-worker/test/media-campaign-lease.test.js
          node workers/gnk-asg-mail-agent-worker/test/media-campaign-e2e.test.js
          node workers/gnk-asg-mail-agent-worker/test/media-campaign-service.test.js

      - name: Wrangler route-free dry run
        run: |
          mkdir -p reports/mail-agent-preview
          npx --yes wrangler@4 deploy \
            --dry-run \
            --config workers/gnk-asg-mail-agent-worker/wrangler.preview.toml \
            --outdir reports/mail-agent-preview

      - name: Verify production routes are absent
        run: |
          if grep -E '(^|[[:space:]])routes?[[:space:]]*=' workers/gnk-asg-mail-agent-worker/wrangler.preview.toml; then
            echo 'Production route configuration detected.'
            exit 1
          fi

      - name: Write preview summary
        run: |
          cat > reports/mail-agent-preview/README.txt <<'EOF'
          GNK ASG Mail Agent preview check
          Production route configured: false
          Production deploy performed: false
          Syntax check: completed
          Full thread context up to 20 messages: verified
          AI receives chronological thread and prior answers: verified
          Personalized contextual reply: verified
          100-recipient E2E simulation: completed
          Rate limit 10/min: verified
          Repeated-window lock: verified
          Strict D1 lease: verified
          Scheduling gate: verified
          PDF attachment storage: verified
          Live-send confirmation gate: verified
          Personalisation: verified
          Live sending: disabled
          Wrangler dry run: completed
          EOF

      - name: Publish summary
        if: always()
        run: |
          if [ -f reports/mail-agent-preview/README.txt ]; then
            cat reports/mail-agent-preview/README.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload preview artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gnk-asg-mail-agent-preview-check-${{ github.run_id }}
          path: reports/mail-agent-preview/
          if-no-files-found: warn
          retention-days: 7
