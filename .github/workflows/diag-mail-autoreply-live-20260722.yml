name: Verify live autoreply state after deploy
on:
  push:
    paths:
      - '.github/workflows/diag-mail-autoreply-live-20260722.yml'
permissions:
  contents: read
  issues: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect final external autoreply and D1 status
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo='${{ github.repository }}'
          subject='FINALNI TEST OBIČNOG VANJSKOG MAILA 2026-07-22-03'
          kv_id='a3e9e78c7d554d7fa10996da9a89e7bc'
          d1_id='2116c4e5-1850-4888-91e7-c47deead3ced'
          auth=(-H "Authorization: Bearer $CF_TOKEN")
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/storage/kv/namespaces/$kv_id/values/mail%3Ainbox" "${auth[@]}" > /tmp/inbox.json
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/storage/kv/namespaces/$kv_id/values/mail%3Asent" "${auth[@]}" > /tmp/sent.json
          python3 - <<'PY' > /tmp/d1-request.json
          import json
          print(json.dumps({
            'sql':"SELECT tracking_id,source_system,source_id,recipient,sender,subject,provider_message_id,current_status,provider_status,error_cause,error_detail,accepted_at,delivered_at,failed_at,first_opened_at,last_opened_at,open_count,receipt_confirmed_at,receipt_confirmation_count,created_at,updated_at FROM email_status_records WHERE subject=? ORDER BY datetime(created_at) DESC LIMIT 20",
            'params':['FINALNI TEST OBIČNOG VANJSKOG MAILA 2026-07-22-03']
          }))
          PY
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/d1/database/$d1_id/query" "${auth[@]}" -H 'Content-Type: application/json' --data-binary @/tmp/d1-request.json > /tmp/d1.json
          SUBJECT="$subject" python3 - <<'PY' > /tmp/report.md
          import json,os
          subject=os.environ['SUBJECT']
          inbox=json.load(open('/tmp/inbox.json'))
          sent=json.load(open('/tmp/sent.json'))
          d1=json.load(open('/tmp/d1.json'))
          keys=('id','createdAt','fromEmail','toEmail','subject','status','autoReplyTo','autoReplyFrom','autoReplyFromName','autoReplySubject','messageId','sentAt','error')
          def matches(items):
              return [{k:r.get(k) for k in keys if r.get(k) is not None} for r in items if r.get('subject')==subject]
          d1_rows=[]
          for block in d1.get('result',[]):
              d1_rows.extend(block.get('results',[]) or [])
          print('## Final external autoreply and status verification')
          print('```json')
          print(json.dumps({'matchingInbox':matches(inbox),'matchingSent':matches(sent),'emailStatusRecords':d1_rows},ensure_ascii=False,indent=2))
          print('```')
          PY
          gh issue edit 712 --repo "$repo" --body-file /tmp/report.md
