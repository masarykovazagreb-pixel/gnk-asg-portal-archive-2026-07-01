name: Verify live autoreply state after deploy
on:
  push:
    paths:
      - '.github/workflows/diag-mail-autoreply-live-20260722.yml'
permissions:
  contents: read
  issues: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify final live autoreply record
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo='${{ github.repository }}'
          subject='AUTOREPLY FINAL LIVE TEST 2026-07-22-02'
          service='gnk-asg-mail-center-worker'
          kv_id='a3e9e78c7d554d7fa10996da9a89e7bc'
          auth=(-H "Authorization: Bearer $CF_TOKEN")
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/services/$service/environments/production/settings" "${auth[@]}" > /tmp/settings.json
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/storage/kv/namespaces/$kv_id/values/mail%3Ainbox" "${auth[@]}" > /tmp/inbox.json
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/storage/kv/namespaces/$kv_id/values/mail%3Asent" "${auth[@]}" > /tmp/sent.json
          SUBJECT="$subject" python3 - <<'PY' > /tmp/report.md
          import json, os
          subject=os.environ['SUBJECT']
          settings=json.load(open('/tmp/settings.json'))
          inbox=json.load(open('/tmp/inbox.json'))
          sent=json.load(open('/tmp/sent.json'))
          bindings=[]
          for item in settings.get('result',{}).get('bindings',[]):
              if item.get('name') in {'AI','AI_AUTO_REPLY_DISABLED','EMAIL','GNK_ASG_KV'}:
                  bindings.append({k:item.get(k) for k in ('name','type','text') if item.get(k) is not None})
          def matches(items):
              return [{k:r.get(k) for k in ('id','createdAt','fromEmail','toEmail','subject','status','autoReplyFrom','autoReplyFromName','autoReplySubject','messageId','sentAt','error') if r.get(k) is not None} for r in items if r.get('subject')==subject]
          data={'bindings':bindings,'matchingInbox':matches(inbox),'matchingSent':matches(sent)}
          print('## Final live autoreply verification')
          print('```json')
          print(json.dumps(data,ensure_ascii=False,indent=2))
          print('```')
          PY
          gh issue edit 712 --repo "$repo" --body-file /tmp/report.md
