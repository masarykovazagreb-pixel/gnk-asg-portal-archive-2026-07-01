name: Verify live autoreply state after deploy
on:
  push:
    paths:
      - '.github/workflows/diag-mail-autoreply-live-20260722.yml'
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect live state and emergency workflow failure
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo='${{ github.repository }}'
          subject='AUTOREPLY BCC FIX LIVE TEST 2026-07-22-01'
          service='gnk-asg-mail-center-worker'
          kv_id='a3e9e78c7d554d7fa10996da9a89e7bc'
          cf_auth=(-H "Authorization: Bearer $CF_TOKEN")
          gh_auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/services/$service/environments/production/settings" "${cf_auth[@]}" > /tmp/settings.json
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/storage/kv/namespaces/$kv_id/values/mail%3Ainbox" "${cf_auth[@]}" > /tmp/inbox.json
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/storage/kv/namespaces/$kv_id/values/mail%3Asent" "${cf_auth[@]}" > /tmp/sent.json
          curl -fsS "https://api.github.com/repos/$repo/actions/workflows/emergency-deploy-mail-autoreply-bcc-20260722.yml/runs?per_page=5" "${gh_auth[@]}" > /tmp/runs.json
          run_id=$(python3 - <<'PY'
          import json
          runs=json.load(open('/tmp/runs.json')).get('workflow_runs',[])
          print(runs[0]['id'] if runs else '')
          PY
          )
          if [ -n "$run_id" ]; then
            curl -fsS "https://api.github.com/repos/$repo/actions/runs/$run_id/jobs?per_page=100" "${gh_auth[@]}" > /tmp/jobs.json
          else
            echo '{"jobs":[]}' > /tmp/jobs.json
          fi
          SUBJECT="$subject" RUN_ID="$run_id" python3 - <<'PY' > /tmp/report.md
          import json, os
          subject=os.environ['SUBJECT']
          settings=json.load(open('/tmp/settings.json'))
          inbox=json.load(open('/tmp/inbox.json'))
          sent=json.load(open('/tmp/sent.json'))
          runs=json.load(open('/tmp/runs.json')).get('workflow_runs',[])
          jobs=json.load(open('/tmp/jobs.json')).get('jobs',[])
          bindings=[]
          for item in settings.get('result',{}).get('bindings',[]):
              if item.get('name') in {'AI','AI_AUTO_REPLY_DISABLED','EMAIL','GNK_ASG_KV'}:
                  bindings.append({k:item.get(k) for k in ('name','type','text') if item.get(k) is not None})
          def matches(items):
              return [{k:r.get(k) for k in ('id','createdAt','fromEmail','toEmail','subject','status','autoReplyFrom','autoReplyFromName','autoReplySubject','messageId','error') if r.get(k) is not None} for r in items if r.get('subject')==subject]
          run_summary=[{k:r.get(k) for k in ('id','status','conclusion','head_sha','created_at','updated_at','html_url')} for r in runs[:3]]
          job_summary=[]
          for job in jobs:
              job_summary.append({'id':job.get('id'),'name':job.get('name'),'status':job.get('status'),'conclusion':job.get('conclusion'),'steps':[{k:s.get(k) for k in ('number','name','status','conclusion')} for s in job.get('steps',[])]})
          print('## Exact emergency workflow and live autoreply state')
          print('```json')
          print(json.dumps({'bindings':bindings,'matchingInbox':matches(inbox),'matchingSent':matches(sent),'workflowRuns':run_summary,'jobs':job_summary},ensure_ascii=False,indent=2))
          print('```')
          PY
          gh issue comment 712 --repo "$repo" --body-file /tmp/report.md
