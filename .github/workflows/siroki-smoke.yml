name: Siroki smoke test cijelog sajta
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: siroki-smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Provjeri sve rute
        run: |
          mkdir -p apps/portal/data/tmp-siroki
          RUTE="/ /en/ /kontakt/ /contact/ /en/contact/ /en/contact-channels/ /objave/ /en/publications/ /komentari/ /en/commentary/ /analize/ /projects/ /projects/roadmap/ /financije/ /finance/ /nermin-sefic/ /en/nermin-sefic/ /gnk-aktual/ /en/gnk-aktual/ /gnk-aktual/world-monitor/ /en/gnk-aktual/world-monitor/ /trgovina/ /digital-workforce/ /sitemap.xml /sitemap-index.xml /editorial-sitemap.xml /image-sitemap.xml /visual-sitemap.xml /robots.txt /the-code/ /world-table/ /group-network/ /newsroom/ /intelligence-desk/ /knowledge-center/ /legal/ /about/"
          > apps/portal/data/tmp-siroki/r.txt
          for ruta in $RUTE; do
            kod=$(curl -s -o /dev/null -w "%{http_code}" "https://gnk-asg.hr${ruta}")
            echo "${kod} ${ruta}" >> apps/portal/data/tmp-siroki/r.txt
          done
          cat apps/portal/data/tmp-siroki/r.txt
      - name: Sazetak
        if: always()
        run: |
          ukupno=$(wc -l < apps/portal/data/tmp-siroki/r.txt)
          ok=$(grep -c '^200 ' apps/portal/data/tmp-siroki/r.txt || true)
          fail=$(grep -vc '^200 ' apps/portal/data/tmp-siroki/r.txt || true)
          {
            echo "## Siroki smoke test"
            echo "- Ukupno: **${ukupno}** | OK: **${ok}** | Ne-200: **${fail}**"
            if [ "$fail" -gt 0 ]; then
              echo '```'
              grep -v '^200 ' apps/portal/data/tmp-siroki/r.txt || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit rezultata
        if: always()
        run: |
          git config user.name "gnk-asg-bot"
          git config user.email "it@gnk-asg.hr"
          git add apps/portal/data/tmp-siroki
          if git diff --cached --quiet; then
            echo "Nema promjena za commit."
            exit 0
          fi
          git commit -m "Siroki smoke test: rezultati"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || { echo "Rebase konflikt."; exit 1; }
            sleep $((attempt * 5))
          done
          exit 1
