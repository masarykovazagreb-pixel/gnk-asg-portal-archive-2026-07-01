name: Deploy Luxury Index Now

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-luxury-index-pr.yml'
      - 'apps/portal/data/luxury-index-pr-deploy.json'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js'
      - 'workers/gnk-asg-direct-operator/src/index-activation-wrapper-v1.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnk-asg-luxury-index-now
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate current luxury index
        shell: bash
        run: |
          set -euxo pipefail
          node --check apps/portal/assets/index-white-static-v2.js
          node --check apps/portal/assets/index-white-static-enhance-v2.js
          node --check apps/portal/assets/index-white-static-pdf-state-v2.js
          node --check workers/gnk-asg-direct-operator/src/index-activation-wrapper-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js
          grep -q 'main = "src/index-admin-hub-v26-clean-index.js"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'GNK_ASG_WHITE_STATIC_INDEX_V2_20260627' workers/gnk-asg-direct-operator/src/index-activation-wrapper-v1.js
          grep -q 'new Request(assetUrl)' workers/gnk-asg-direct-operator/src/index-activation-wrapper-v1.js
          grep -q 'data-index-template="white-static-v2"' apps/portal/index-white-static-preview-v2.html
          grep -q 'min-height:820px' apps/portal/assets/index-white-static-v2.css
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator
      - name: Deploy current Worker to Cloudflare
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator
      - name: Capture deployed route diagnostics
        shell: bash
        run: |
          {
            echo '--- DEBUG ENDPOINT ---'
            curl -sS -D - "https://gnk-asg.hr/data/luxury-index-debug.json?cb=${GITHUB_RUN_ID}" || true
            echo
            echo '--- HR ROOT ---'
            curl -sS -D - "https://gnk-asg.hr/?cb=${GITHUB_RUN_ID}-hr" || true
            echo
            echo '--- EN ROOT ---'
            curl -sS -D - "https://gnk-asg.hr/en/?cb=${GITHUB_RUN_ID}-en" || true
          } > luxury-index-diagnostics.txt 2>&1
          cat luxury-index-diagnostics.txt
      - name: Verify luxury index is public
        shell: bash
        run: |
          set -euo pipefail
          HR=$(curl -fsS "https://gnk-asg.hr/?cb=${GITHUB_RUN_ID}-verify-hr")
          EN=$(curl -fsS "https://gnk-asg.hr/en/?cb=${GITHUB_RUN_ID}-verify-en")
          printf '%s' "$HR" | grep -q 'data-index-template="white-static-v2"'
          printf '%s' "$EN" | grep -q 'data-index-template="white-static-v2"'
          printf '%s' "$HR" | grep -q 'Interaktivna prezentacija · puna veličina'
          printf '%s' "$EN" | grep -q 'Interactive presentation · full size'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luxury-index-diagnostics
          path: luxury-index-diagnostics.txt
          if-no-files-found: warn
          retention-days: 1
