name: Validate GNK ASG Portal Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-luxury-index-pr.yml'
      - 'apps/portal/**'
      - 'workers/gnk-asg-direct-operator/**'
      - 'scripts/verify-public-redesign-contract.mjs'
      - 'scripts/validate-minimum-index-contact-admin.mjs'
      - 'scripts/validate-worker-import-graph.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnk-asg-portal-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          # Validate the active unified public menu asset. public-menu-v18.js was retired;
          # keeping this syntax gate pointed at a deleted legacy file created a false P0.
          node --check apps/portal/assets/public-unified-menu-v6.js
          node --check workers/gnk-asg-direct-operator/src/public-shell-v11.js
          node --check workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
          node --check workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js
          node --check workers/gnk-asg-direct-operator/src/campaign-mailer-shell-v2.js
          node --check workers/gnk-asg-direct-operator/src/campaign-mailer-v2.js
          node scripts/validate-minimum-index-contact-admin.mjs
          node scripts/verify-public-redesign-contract.mjs
          grep -q 'main = "src/index-unified-auth-v14.js"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'main = "src/index-final-admin-gateway-v2.js"' workers/gnk-asg-direct-operator/wrangler.runtime.toml
          grep -q "export { default } from './index-final-admin-gateway-v2.js';" workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v1.js

      - name: Validate active Worker import graph
        run: node scripts/validate-worker-import-graph.mjs

      - name: Confirm deployment ownership
        run: |
          echo 'Validation passed. This workflow performs no deployment and no email submission.'
          echo 'Review configuration uses unified auth v14; canonical runtime validation remains gateway v2.'
