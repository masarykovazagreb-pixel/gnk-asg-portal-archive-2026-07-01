name: Validate GNK ASG Portal Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-luxury-index-pr.yml'
      - 'apps/portal/**'
      - 'workers/gnk-asg-direct-operator/**'
      - 'scripts/verify-public-redesign-contract.mjs'
      - 'scripts/validate-minimum-index-contact-admin.mjs'
      - 'scripts/validate-worker-import-graph.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnk-asg-portal-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Resolve active review entrypoint
        id: review_entrypoint
        shell: bash
        run: |
          set -euo pipefail
          review_main="$(awk -F '"' '/^main = "/ { print $2; exit }' workers/gnk-asg-direct-operator/wrangler.toml)"
          test -n "$review_main"
          case "$review_main" in
            src/*.js) ;;
            *) echo "Invalid review Worker entrypoint: $review_main" >&2; exit 1 ;;
          esac
          test -f "workers/gnk-asg-direct-operator/$review_main"
          printf 'review_main=%s\n' "$review_main" >> "$GITHUB_OUTPUT"
          echo "Resolved review entrypoint: $review_main"

      - name: Syntax-check release sources
        shell: bash
        env:
          REVIEW_MAIN: ${{ steps.review_entrypoint.outputs.review_main }}
        run: |
          set -euo pipefail
          for source in \
            workers/gnk-asg-direct-operator/src/public-shell-v11.js \
            "workers/gnk-asg-direct-operator/$REVIEW_MAIN" \
            workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v1.js \
            workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js \
            workers/gnk-asg-direct-operator/src/campaign-mailer-shell-v2.js \
            workers/gnk-asg-direct-operator/src/campaign-mailer-v2.js
          do
            echo "Syntax check: $source"
            node --check "$source"
          done

      - name: Validate index contact admin contract
        run: node scripts/validate-minimum-index-contact-admin.mjs

      - name: Validate public redesign contract
        run: node scripts/verify-public-redesign-contract.mjs

      - name: Validate canonical runtime compatibility
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'main = "src/index-final-admin-gateway-v2.js"' workers/gnk-asg-direct-operator/wrangler.runtime.toml
          grep -q "export { default } from './index-final-admin-gateway-v2.js';" workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v1.js

      - name: Validate active Worker import graph
        run: node scripts/validate-worker-import-graph.mjs

      - name: Confirm deployment ownership
        run: |
          echo 'Validation passed. This workflow performs no deployment and no email submission.'
          echo 'Review entrypoint is derived from wrangler.toml; canonical runtime validation remains gateway v2.'