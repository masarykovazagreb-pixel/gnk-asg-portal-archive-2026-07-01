name: Deploy Public Content V14
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-luxury-index-pr.yml'
      - 'apps/portal/assets/**'
      - 'apps/portal/media-application/**'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-luxury-index-pr.yml'
      - 'apps/portal/assets/**'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gnk-asg-public-v14
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate V14
        run: |
          set -euxo pipefail
          node --check apps/portal/assets/public-menu-v10.js
          node --check apps/portal/assets/assistant-v10.js
          node --check apps/portal/assets/markets-v11.js
          node --check apps/portal/assets/editorial-v12.js
          node --check apps/portal/assets/contact-v13.js
          node --check apps/portal/assets/media-kit-v13.js
          node --check apps/portal/assets/media-application-v14.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js
          grep -q 'GNK_ASG_PUBLIC_V14_CONTENT_MEDIA_APPLICATION_20260627' workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js
          grep -q 'GNK_ASG_logo_gold_transparent.png' apps/portal/assets/media-application-v14.js
          grep -q 'GNK_DINAMO_Ltd_logo_gold_transparent.png' apps/portal/assets/media-application-v14.js
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator
      - name: Deploy Cloudflare Worker
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator
      - name: Verify V14
        run: |
          set -euo pipefail
          for n in $(seq 1 18); do
            NEWS=$(curl -fsS "https://gnk-asg.hr/vijesti/?cb=${GITHUB_RUN_ID}-${n}" || true)
            PUB=$(curl -fsS "https://gnk-asg.hr/objave/?cb=${GITHUB_RUN_ID}-${n}" || true)
            CONTACT=$(curl -fsS "https://gnk-asg.hr/contact/?cb=${GITHUB_RUN_ID}-${n}" || true)
            MEDIA=$(curl -fsS "https://gnk-asg.hr/media-kit/?cb=${GITHUB_RUN_ID}-${n}" || true)
            APP=$(curl -fsS "https://gnk-asg.hr/media-application/?cb=${GITHUB_RUN_ID}-${n}" || true)
            if printf '%s' "$NEWS" | grep -q 'editorial-v12.css' && printf '%s' "$PUB" | grep -q 'editorial-v12.js' && printf '%s' "$CONTACT" | grep -q 'contact-v13.css' && printf '%s' "$MEDIA" | grep -q 'media-kit-v13.css' && printf '%s' "$APP" | grep -q 'media-application-v14.css'; then exit 0; fi
            sleep 10
          done
          exit 1
