name: Deploy Public Index V9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-luxury-index-pr.yml'
      - 'apps/portal/assets/index-finance-v9.css'
      - 'apps/portal/assets/index-public-v7.css'
      - 'apps/portal/assets/index-public-v7.js'
      - 'apps/portal/assets/index-code-cleanup-v8.js'
      - 'apps/portal/assets/brand/gnk-asg-favicon.svg'
      - 'apps/portal/favicon.svg'
      - 'apps/portal/favicon-48.svg'
      - 'apps/portal/site.webmanifest'
      - 'apps/portal/the-code/index.html'
      - 'workers/gnk-asg-direct-operator/src/index-seo-v9.js'
      - 'workers/gnk-asg-direct-operator/src/index-activation-wrapper-v1.js'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-luxury-index-pr.yml'
      - 'apps/portal/assets/index-finance-v9.css'
      - 'apps/portal/assets/index-public-v7.css'
      - 'apps/portal/assets/index-public-v7.js'
      - 'apps/portal/assets/index-code-cleanup-v8.js'
      - 'apps/portal/assets/brand/gnk-asg-favicon.svg'
      - 'apps/portal/favicon.svg'
      - 'apps/portal/favicon-48.svg'
      - 'apps/portal/site.webmanifest'
      - 'apps/portal/the-code/index.html'
      - 'workers/gnk-asg-direct-operator/src/index-seo-v9.js'
      - 'workers/gnk-asg-direct-operator/src/index-activation-wrapper-v1.js'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnk-asg-public-index-v9
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate public index V9
        shell: bash
        run: |
          set -euxo pipefail
          node --check apps/portal/assets/index-public-v7.js
          node --check apps/portal/assets/index-code-cleanup-v8.js
          node --check workers/gnk-asg-direct-operator/src/index-seo-v9.js
          node --check workers/gnk-asg-direct-operator/src/index-activation-wrapper-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js
          test -s apps/portal/assets/index-finance-v9.css
          test -s apps/portal/favicon.svg
          test -s apps/portal/favicon-48.svg
          test -s apps/portal/site.webmanifest
          grep -q 'GNK_ASG_PUBLIC_INDEX_V9_HR_EN_20260627' workers/gnk-asg-direct-operator/src/index-activation-wrapper-v1.js
          grep -q 'index-finance-v9.css' workers/gnk-asg-direct-operator/src/index-activation-wrapper-v1.js
          grep -q 'applyIndexSeo' workers/gnk-asg-direct-operator/src/index-activation-wrapper-v1.js
          grep -q 'data-gnk-seo-v9' workers/gnk-asg-direct-operator/src/index-seo-v9.js
          grep -q 'grid-template-columns:repeat(3' apps/portal/assets/index-finance-v9.css
          grep -q 'font-size:clamp(15px' apps/portal/assets/index-finance-v9.css
          grep -q 'GNK ASG' apps/portal/favicon.svg
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator
      - name: Deploy current Worker to Cloudflare
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator
      - name: Verify public index V9
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 18); do
            HR_HEADERS=$(mktemp)
            EN_HEADERS=$(mktemp)
            HR=$(curl -fsS -D "$HR_HEADERS" "https://gnk-asg.hr/?cb=${GITHUB_RUN_ID}-${n}-hr" || true)
            EN=$(curl -fsS -D "$EN_HEADERS" "https://gnk-asg.hr/en/?cb=${GITHUB_RUN_ID}-${n}-en" || true)
            FINANCE=$(curl -fsS "https://gnk-asg.hr/assets/index-finance-v9.css?cb=${GITHUB_RUN_ID}-${n}" || true)
            FAVICON=$(curl -fsS "https://gnk-asg.hr/favicon.svg?cb=${GITHUB_RUN_ID}-${n}" || true)
            if printf '%s' "$HR" | grep -q 'index-finance-v9.css' \
              && printf '%s' "$HR" | grep -q 'data-gnk-seo-v9' \
              && printf '%s' "$HR" | grep -q '/favicon.svg' \
              && printf '%s' "$EN" | grep -q 'index-finance-v9.css' \
              && printf '%s' "$EN" | grep -q 'data-gnk-seo-v9' \
              && printf '%s' "$FINANCE" | grep -q 'grid-template-columns:repeat(3' \
              && printf '%s' "$FAVICON" | grep -q 'GNK ASG' \
              && grep -qi 'x-gnk-asg-index-template: GNK_ASG_PUBLIC_INDEX_V9_HR_EN_20260627' "$HR_HEADERS" \
              && grep -qi 'x-gnk-asg-seo: BILINGUAL_META_FAVICON_V9' "$HR_HEADERS" \
              && grep -qi 'x-gnk-asg-index-template: GNK_ASG_PUBLIC_INDEX_V9_HR_EN_20260627' "$EN_HEADERS"; then
                exit 0
            fi
            sleep 10
          done
          exit 1
