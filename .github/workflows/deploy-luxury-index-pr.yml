name: Validate GNK ASG Portal Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-luxury-index-pr.yml'
      - 'apps/portal/**'
      - 'workers/gnk-asg-direct-operator/**'
      - 'scripts/verify-public-redesign-contract.mjs'
      - 'scripts/validate-minimum-index-contact-admin.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnk-asg-portal-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/portal/assets/public-menu-v18.js
          node --check workers/gnk-asg-direct-operator/src/public-shell-v11.js
          node --check workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v1.js
          node --check workers/gnk-asg-direct-operator/src/campaign-mailer-shell-v2.js
          node --check workers/gnk-asg-direct-operator/src/campaign-mailer-v2.js
          node scripts/validate-minimum-index-contact-admin.mjs
          node scripts/verify-public-redesign-contract.mjs
          grep -q 'main = "src/index-final-admin-gateway-v1.js"' workers/gnk-asg-direct-operator/wrangler.toml

      - name: Build canonical Worker without deploying
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_ACCOUNT_ID: validation-only
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator

      - name: Confirm deployment ownership
        run: |
          echo 'Validation passed. Production deployment is owned only by deploy-public-portal.yml after merge to main.'
