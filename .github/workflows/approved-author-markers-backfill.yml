name: Approved author marker policy check

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/enforce-approved-author-markers-v1.mjs'
      - 'scripts/editorial-publish-scheduled-v1.mjs'
      - 'apps/portal/data/approved_mentions.json'
      - 'apps/portal/objave/**'
      - 'apps/portal/komentari/**'
      - 'apps/portal/analize/**'
      - 'apps/portal/en/publications/**'
      - 'apps/portal/en/commentary/**'
      - 'apps/portal/en/analyses/**'
      - '.github/workflows/approved-author-markers-backfill.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/enforce-approved-author-markers-v1.mjs'
      - 'scripts/editorial-publish-scheduled-v1.mjs'
      - 'apps/portal/data/approved_mentions.json'
      - 'apps/portal/objave/**'
      - 'apps/portal/komentari/**'
      - 'apps/portal/analize/**'
      - 'apps/portal/en/publications/**'
      - 'apps/portal/en/commentary/**'
      - 'apps/portal/en/analyses/**'
      - '.github/workflows/approved-author-markers-backfill.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reproduce approved author marker policy
        run: node scripts/enforce-approved-author-markers-v1.mjs
      - name: Require reviewed portal output
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- apps/portal; then
            echo "::error::Approved author marker policy would change portal files. Commit those reviewed changes through this PR instead of mutating main." >&2
            exit 1
          fi
          echo "Approved author marker policy is already satisfied."
