name: Validate Production Authorization Contract

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-admin-auth-v6.yml'
      - '.github/workflows/validate-production-authorization-contract.yml'
      - 'scripts/test-production-authorization-mail-contract.mjs'
      - 'workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js'
      - 'workers/gnk-asg-direct-operator/src/email-autoreply-mime-v1.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-admin-auth-v6.yml'
      - '.github/workflows/validate-production-authorization-contract.yml'
      - 'scripts/test-production-authorization-mail-contract.mjs'
      - 'workers/gnk-asg-direct-operator/src/mail-identity-autoreply-v2.js'
      - 'workers/gnk-asg-direct-operator/src/email-autoreply-mime-v1.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-production-authorization-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact authorization and real CID mail contract
        run: node scripts/test-production-authorization-mail-contract.mjs
