name: Market Pulse Refresh
on:
  schedule:
    # Six refresh windows daily; GitHub cron is UTC.
    - cron: '10 2,6,10,14,18,22 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: gnk-asg-main-mutation
  cancel-in-progress: false
jobs:
  refresh:
    if: vars.GNK_ASG_RELEASE_FENCE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run market pulse refresh
        run: node scripts/refresh-market-pulse.mjs
      - name: Commit if changed
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          expected_base="$(git rev-parse HEAD)"
          if git diff --quiet -- apps/portal/data/market-pulse.json && [ -z "$(git status --porcelain -- apps/portal/data/market-pulse.json)" ]; then
            echo "No market pulse change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$expected_base" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/portal/data/market-pulse.json
          git commit -m "Refresh market pulse data"
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          if [ "$current_main" != "$expected_base" ]; then
            echo "Main moved during market-pulse generation: expected $expected_base, found $current_main. Deferring without rebase/push."
            exit 75
          fi
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Dispatch exact-SHA production deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          gh workflow run deploy-admin-auth-v6.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f confirm_production_deploy=DEPLOY_ADMIN_AUTH_V6 \
            -f approved_sha="$APPROVED_SHA"
