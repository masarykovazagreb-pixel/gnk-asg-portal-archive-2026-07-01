name: Puna provjera sitemap URL-ova
on: workflow_dispatch
jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p apps/portal/data/tmp-full-crawl
          chmod +x crawl_script.sh
          ./crawl_script.sh
        env:
          BASH_ENV: /dev/null
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          BRANCH="fullcrawl-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-full-crawl
          git commit -m "full crawl"
          git push origin "$BRANCH"
