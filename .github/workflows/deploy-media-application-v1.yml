name: Deploy Media Application V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-media-application-v1.yml'
      - 'apps/portal/media-application/**'
      - 'apps/portal/assets/media-application-v1.css'
      - 'apps/portal/assets/media-application-v1.js'
      - 'apps/portal/assets/media-notifications-v1.css'
      - 'apps/portal/assets/media-notifications-v1.js'
      - 'workers/gnk-asg-direct-operator/src/media-application-portal-v1.js'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v22-news.js'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v23-aktual.js'
      - 'workers/gnk-asg-direct-operator/wrangler.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnk-asg-media-application-production
  cancel-in-progress: true

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate isolated media application package
        shell: bash
        run: |
          set -euxo pipefail
          node --check apps/portal/assets/media-application-v1.js
          node --check apps/portal/assets/media-notifications-v1.js
          node --check workers/gnk-asg-direct-operator/src/media-application-portal-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v22-news.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v23-aktual.js
          test -s apps/portal/media-application/index.html
          test -s apps/portal/assets/media-application-v1.css
          test -s apps/portal/assets/media-notifications-v1.css
          grep -q 'minimumVisible:10' workers/gnk-asg-direct-operator/src/media-application-portal-v1.js
          grep -q 'refreshIntervalSeconds:1800' workers/gnk-asg-direct-operator/src/media-application-portal-v1.js
          grep -q '30\*60\*1000' apps/portal/assets/media-notifications-v1.js
          grep -q 'Ne kupujte kartu' apps/portal/media-application/index.html
          grep -q 'human verification' apps/portal/media-application/index.html
          grep -q 'main = "src/index-admin-hub-v23-aktual.js"' workers/gnk-asg-direct-operator/wrangler.toml
          git diff --exit-code HEAD^ HEAD -- apps/portal/index.html apps/portal/en/index.html workers/gnk-asg-direct-operator/src/public-shell-v11.js workers/gnk-asg-direct-operator/src/index-lock-v4.js
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator

      - name: Deploy canonical worker
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator

      - name: Verify live application portal
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const base='https://gnk-asg.hr';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function read(path,redirect='follow'){
            try{
              const response=await fetch(`${base}${path}${path.includes('?')?'&':'?'}cb=${Date.now()}`,{redirect,headers:{'cache-control':'no-cache'}});
              return{status:response.status,text:await response.text(),headers:Object.fromEntries(response.headers)};
            }catch(error){return{status:0,text:'',headers:{},error:String(error)}}
          }
          let last;
          for(let attempt=1;attempt<=18;attempt++){
            const [page,config,admin,root]=await Promise.all([
              read('/media-application/'),
              read('/api/media-application/config'),
              read('/media-command-center/','manual'),
              read('/')
            ]);
            let data=null;try{data=JSON.parse(config.text)}catch{}
            const failures=[];
            if(page.status!==200||!page.text.includes('Prijava predstavnika redakcije'))failures.push(`page=${page.status}`);
            if(config.status!==200||!data?.ok)failures.push(`config=${config.status}`);
            if(data?.decision!=='HUMAN_ONLY')failures.push(`decision=${JSON.stringify(data?.decision)}`);
            if(data?.travelPolicy?.ticketPurchaseBeforeApproval!==false)failures.push('ticket_policy_invalid');
            if(data?.travelPolicy?.organizerPaysTravel!==true||data?.travelPolicy?.organizerPaysAccommodation!==true)failures.push('cost_policy_invalid');
            if(![303,401,403].includes(admin.status))failures.push(`admin=${admin.status}`);
            if(root.status!==200)failures.push(`root=${root.status}`);
            if(root.text.includes('media-application-v1.js'))failures.push('public_index_mutated');
            last={attempt,failures,codes:{page:page.status,config:config.status,admin:admin.status,root:root.status},version:data?.version};
            console.log(JSON.stringify(last));
            if(!failures.length){console.log('GNK_ASG_MEDIA_APPLICATION_LIVE=true');process.exit(0)}
            await sleep(10000);
          }
          console.error(JSON.stringify(last,null,2));
          process.exit(1);
          JS
