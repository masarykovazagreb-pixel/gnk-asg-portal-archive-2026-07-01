name: Provjeri stare en-en i en-publications URL-ove
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p apps/portal/data/tmp-legacy404
          for ruta in "/en/en/a-recovery-drill-only-works-if-it-surprises-you/" "/en/en/cyber-resilience-rests-on-the-weakest-link/" "/en/en/investor-trust-is-built-before-its-needed/" "/en/en/short-term-savings-that-create-long-term-cost/" "/en/publications/a-good-decision-needs-time-not-hesitation/" "/en/publications/decision-speed-is-not-decision-quality/" "/en/commentary/a-good-decision-needs-time-not-hesitation/" "/en/commentary/decision-speed-is-not-decision-quality/" "/assistant/" "/downloads/" "/markets/"; do
            kod=$(curl -s -o /dev/null -w "%{http_code}" "https://gnk-asg.hr${ruta}")
            echo "${kod} ${ruta}" >> apps/portal/data/tmp-legacy404/r.txt
          done
          cat apps/portal/data/tmp-legacy404/r.txt
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          BRANCH="legacy404-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-legacy404
          git commit -m "check"
          git push origin "$BRANCH"
