name: Deploy and verify exact public THE CODE memorandum

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-public-memorandum.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Worker dependencies
        working-directory: workers/gnk-asg-direct-operator
        run: npm install --no-audit --no-fund

      - name: Deploy current canonical Worker
        id: deploy
        continue-on-error: true
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy --config wrangler.toml --name gnk-asg-direct-operator 2>&1 | tee /tmp/deploy.log

      - name: Probe exact production memorandum
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          ready=false
          code=0
          size=0
          sha=''
          for attempt in $(seq 1 24); do
            url="https://www.gnk-asg.hr/api/media-registration/memorandum.pdf?cb=${GITHUB_RUN_ID}-${attempt}"
            code=$(curl -L -sS -D /tmp/memo.headers -o /tmp/memo.pdf -w '%{http_code}' "$url" || true)
            file -b --mime-type /tmp/memo.pdf > /tmp/memo.type 2>/dev/null || true
            size=$(wc -c < /tmp/memo.pdf 2>/dev/null || echo 0)
            sha=$(sha256sum /tmp/memo.pdf 2>/dev/null | awk '{print $1}' || true)
            if [ "$code" = '200' ] && [ "$size" = '208207' ] && [ "$sha" = '5c33f1dea158ff8938122c024e857997eb2f156a039c4b76c0cca133f1e0aa95' ] && grep -qi '^content-disposition: attachment' /tmp/memo.headers; then
              ready=true
              break
            fi
            sleep 10
          done
          printf '%s' "$size" > /tmp/memo.size
          printf '%s' "$sha" > /tmp/memo.sha
          printf '%s' "$code" > /tmp/memo.code
          printf '%s' "$ready" > /tmp/memo.ready

      - name: Record deployment diagnostic
        if: always()
        shell: bash
        run: |
          {
            echo "DEPLOY_OUTCOME=${{ steps.deploy.outcome }}"
            echo "VERIFY_OUTCOME=${{ steps.verify.outcome }}"
            echo "READY=$(cat /tmp/memo.ready 2>/dev/null || echo false)"
            echo "HTTP=$(cat /tmp/memo.code 2>/dev/null || echo 0)"
            echo "COMMIT=$GITHUB_SHA"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "RECORDED_AT=$(date -u +%FT%TZ)"
            echo "--- DEPLOY LOG ---"
            cat /tmp/deploy.log 2>/dev/null || true
            echo "--- MEMORANDUM TYPE ---"
            cat /tmp/memo.type 2>/dev/null || true
            echo "--- MEMORANDUM SIZE ---"
            cat /tmp/memo.size 2>/dev/null || true
            echo
            echo "--- MEMORANDUM SHA256 ---"
            cat /tmp/memo.sha 2>/dev/null || true
            echo
            echo "--- MEMORANDUM HEADERS ---"
            cat /tmp/memo.headers 2>/dev/null || true
          } > .github/memorandum-deploy-diagnostic.txt
          cat .github/memorandum-deploy-diagnostic.txt
          git config user.name 'gnk-asg-verification-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/memorandum-deploy-diagnostic.txt
          git commit -m "Record exact memorandum deployment diagnostic" || true
          git pull --rebase origin main
          git push origin HEAD:main
