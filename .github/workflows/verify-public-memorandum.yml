name: Diagnose and deploy public THE CODE memorandum support

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-public-memorandum.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Deploy current canonical Worker
        id: deploy
        continue-on-error: true
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator 2>&1 | tee /tmp/deploy.log

      - name: Probe production memorandum
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          url="https://www.gnk-asg.hr/api/media-registration/memorandum.pdf?cb=${GITHUB_RUN_ID}"
          curl -L -sS -D /tmp/memo.headers -o /tmp/memo.pdf "$url" || true
          file -b --mime-type /tmp/memo.pdf > /tmp/memo.type 2>/dev/null || true
          wc -c < /tmp/memo.pdf > /tmp/memo.size 2>/dev/null || true
          sha256sum /tmp/memo.pdf 2>/dev/null | awk '{print $1}' > /tmp/memo.sha || true

      - name: Record deployment diagnostic
        if: always()
        shell: bash
        run: |
          {
            echo "DEPLOY_OUTCOME=${{ steps.deploy.outcome }}"
            echo "VERIFY_OUTCOME=${{ steps.verify.outcome }}"
            echo "COMMIT=$GITHUB_SHA"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "RECORDED_AT=$(date -u +%FT%TZ)"
            echo "--- DEPLOY LOG ---"
            cat /tmp/deploy.log 2>/dev/null || true
            echo "--- MEMORANDUM TYPE ---"
            cat /tmp/memo.type 2>/dev/null || true
            echo "--- MEMORANDUM SIZE ---"
            cat /tmp/memo.size 2>/dev/null || true
            echo "--- MEMORANDUM SHA256 ---"
            cat /tmp/memo.sha 2>/dev/null || true
            echo "--- MEMORANDUM HEADERS ---"
            cat /tmp/memo.headers 2>/dev/null || true
          } > .github/memorandum-deploy-diagnostic.txt
          cat .github/memorandum-deploy-diagnostic.txt
          git config user.name 'gnk-asg-verification-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/memorandum-deploy-diagnostic.txt
          git commit -m "Record memorandum deploy diagnostic" || true
          git pull --rebase origin main
          git push origin HEAD:main
