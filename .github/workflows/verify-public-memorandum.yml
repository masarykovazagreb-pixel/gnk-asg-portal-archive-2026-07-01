name: Deploy and verify public THE CODE memorandum support

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-public-memorandum.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Deploy current canonical Worker
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator

      - name: Verify deployment and exact public PDF
        shell: bash
        run: |
          set -u
          deploy_ready=false
          for attempt in $(seq 1 36); do
            portal_url="https://www.gnk-asg.hr/data/portal-version.json?cb=${GITHUB_RUN_ID}-${attempt}"
            portal_code=$(curl -sS -D /tmp/portal.headers -o /tmp/portal.json -w '%{http_code}' "$portal_url" || true)
            if [ "$portal_code" = '200' ] && grep -q 'mediaBootstrap' /tmp/portal.json; then
              deploy_ready=true
              break
            fi
            sleep 10
          done

          url="https://www.gnk-asg.hr/api/media-registration/memorandum.pdf?cb=${GITHUB_RUN_ID}"
          code=$(curl -L -sS -D /tmp/memo.headers -o /tmp/memo.pdf -w '%{http_code}' "$url" || true)
          type=$(file -b --mime-type /tmp/memo.pdf 2>/dev/null || true)
          size=$(wc -c </tmp/memo.pdf 2>/dev/null || echo 0)
          sha=$(sha256sum /tmp/memo.pdf 2>/dev/null | awk '{print $1}' || true)
          status=FAIL
          if [ "$code" = '200' ] && [ "$type" = 'application/pdf' ] && [ "$size" = '208207' ] && [ "$sha" = '5c33f1dea158ff8938122c024e857997eb2f156a039c4b76c0cca133f1e0aa95' ]; then status=PASS; fi
          {
            printf 'DEPLOY_READY=%s\nDEPLOYED_COMMIT=%s\nSTATUS=%s\nHTTP=%s\nTYPE=%s\nSIZE=%s\nSHA256=%s\nURL=%s\nRUN_ID=%s\nVERIFIED_AT=%s\n\n' "$deploy_ready" "$GITHUB_SHA" "$status" "$code" "$type" "$size" "$sha" "$url" "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)"
            printf '%s\n' '--- PORTAL VERSION ---'
            cat /tmp/portal.json 2>/dev/null || true
            printf '\n%s\n' '--- MEMORANDUM HEADERS ---'
            cat /tmp/memo.headers 2>/dev/null || true
          } > .github/memorandum-verification-result.txt
          cat .github/memorandum-verification-result.txt
          git config user.name 'gnk-asg-verification-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/memorandum-verification-result.txt
          git commit -m "Record deployed memorandum verification: $status" || true
          git pull --rebase origin main
          git push origin HEAD:main
          test "$deploy_ready" = 'true'
