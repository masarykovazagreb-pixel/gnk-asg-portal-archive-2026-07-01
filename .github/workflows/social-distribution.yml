name: Social Distribution (dry-run → live)

# Priprema objave za Facebook, Instagram, LinkedIn i X. Workflow je manual-only;
# live slanje traži potvrdu za konkretan run, GNK_ASG_EXTERNAL_DISTRIBUTION=true
# i SOCIAL_LIVE=1. Bez SOCIAL_LIVE radi samo dry-run bez vanjskih učinaka.
#
# Kad credentiali stignu: dodati ih kao repo secrets (FB_PAGE_TOKEN,
# IG_BUSINESS_ID, LINKEDIN_ORG_TOKEN, X_API_KEY/SECRET/ACCESS_TOKEN/ACCESS_SECRET),
# postaviti repo variable SOCIAL_LIVE=1, i dopuniti adaptere u
# scripts/social-distribution-v1.mjs (mjesto je već označeno u kodu).

on:
  workflow_dispatch:
    inputs:
      confirm_external_distribution:
        description: 'Confirm owner approval before this run sends social posts; keep false for a preview'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: social-distribution
  cancel-in-progress: false

jobs:
  distribute:
    if: ${{ github.ref == 'refs/heads/main' && (vars.SOCIAL_LIVE != '1' || (inputs.confirm_external_distribution == true && vars.GNK_ASG_EXTERNAL_DISTRIBUTION == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOCIAL_LIVE: ${{ vars.SOCIAL_LIVE || '0' }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
      LINKEDIN_ORG_TOKEN: ${{ secrets.LINKEDIN_ORG_TOKEN }}
      LINKEDIN_ORG_URN: ${{ secrets.LINKEDIN_ORG_URN }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build (and, once live, send) social posts
        run: node scripts/social-distribution-v1.mjs
      - name: Commit plan/state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gnk-social-bot"
          git config user.email "actions@github.com"
          git add apps/portal/data/social-distribution
          if git diff --cached --quiet; then
            echo "Nema promjena."
            exit 0
          fi
          git commit -m "Social distribution: refresh plan ($([ "$SOCIAL_LIVE" = "1" ] && echo live || echo dry-run))"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            echo "Push odbijen (pokusaj $attempt) - main se pomaknuo, radim fetch+rebase."
            git fetch origin main
            git rebase origin/main || { echo "Rebase konflikt."; exit 1; }
            sleep $((attempt * 5))
            if [ "$attempt" = "5" ]; then echo "Push nije uspio nakon 5 pokusaja."; exit 1; fi
          done
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## Social Distribution" >> "$GITHUB_STEP_SUMMARY"
          if [ -f apps/portal/data/social-distribution/plan.json ]; then
            jq '.items[0]' apps/portal/data/social-distribution/plan.json >> "$GITHUB_STEP_SUMMARY" || true
          fi
