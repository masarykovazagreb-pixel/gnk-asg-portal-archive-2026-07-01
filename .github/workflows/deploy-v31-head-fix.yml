name: Deploy V31 portal, verified news and first publication

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v31-head-fix.yml'
      - '.github/deploy-v31-head-fix.trigger'

permissions:
  contents: read
  issues: write

concurrency:
  group: gnk-asg-v31-head-fix
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Check V31 public shell
        run: |
          node --check workers/gnk-asg-direct-operator/src/public-shell-v11.js
          grep -q 'main = "src/index-admin-hub-v23-aktual.js"' workers/gnk-asg-direct-operator/wrangler.toml

      - name: Check central Visual Index
        run: |
          node --check apps/portal/assets/visual-index-central-v7.js
          node --check apps/portal/assets/visual-index-full-gallery.js
          grep -q 'visual-index-central-v7.js' apps/portal/assets/visual-index-full-gallery.js

      - name: Check publication SEO and R2
        run: |
          node --check workers/gnk-asg-direct-operator/src/index-publication-seo-v3.js
          node --check workers/gnk-asg-direct-operator/src/index-public-r2-v1.js
          grep -q 'GNK_ASG_PUBLICATION_SEO_V3_20260626' workers/gnk-asg-direct-operator/src/index-publication-seo-v3.js

      - name: Check editorial automation
        run: |
          node --check workers/gnk-asg-direct-operator/src/index-article-automation-v2.js
          node --check workers/gnk-asg-direct-operator/src/article-visual-v2.js
          node --check workers/gnk-asg-direct-operator/src/article-editorial-qa-v1.js
          grep -q 'GNK_ASG_ARTICLE_EDITORIAL_QA_V2_20260626' workers/gnk-asg-direct-operator/src/article-editorial-qa-v1.js

      - name: Check verified news lifecycle
        run: |
          node --check workers/gnk-asg-direct-operator/src/news-curation-v10.js
          grep -q 'ARCHIVE_PRUNE_AT=900' workers/gnk-asg-direct-operator/src/news-curation-v10.js
          grep -q 'ARCHIVE_RETAIN_AFTER_PRUNE=450' workers/gnk-asg-direct-operator/src/news-curation-v10.js
          grep -q 'NEWS_MINIMUM=15' workers/gnk-asg-direct-operator/src/news-curation-v10.js

      - name: Wrangler package dry run
        working-directory: workers/gnk-asg-direct-operator
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator

      - name: Deploy current canonical Worker
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator

      - name: Run news refresh and first publication
        id: publish
        env:
          GNK_ASG_OPERATOR_TOKEN: ${{ secrets.GNK_ASG_OPERATOR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GNK_ASG_OPERATOR_TOKEN"
          curl -fsS --max-time 720 \
            -H "authorization: Bearer $GNK_ASG_OPERATOR_TOKEN" \
            -H 'content-type: application/json' \
            -d '{}' \
            https://gnk-asg.hr/operator/news-automation/run \
            -o /tmp/result.json
          node <<'JS'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('/tmp/result.json','utf8'));
          const e=p.editor||p.autoEditor||{};
          const post=e.articlePostProcess||p.articlePostProcess||{};
          const a=p.article||post.visual?.article||post.editorialQa?.article||e.article;
          const count=Number(p.news?.count||p.news?.verifiedCount||0);
          if(p.ok===false||!p.news?.ok||count<15)throw new Error(`news_or_automation_failed:${JSON.stringify(p).slice(0,1800)}`);
          if(!a?.slug||!a?.image)throw new Error(`article_missing:${JSON.stringify(p).slice(0,1800)}`);
          if(Number(a.wordCountHr||0)<500||Number(a.wordCountEn||0)<500)throw new Error('word_count_invalid');
          if(a.editorialQa?.ok!==true||a.editorialQa?.version!=='GNK_ASG_ARTICLE_EDITORIAL_QA_V2_20260626')throw new Error(`editorial_qa_v2_missing:${JSON.stringify(a.editorialQa)}`);
          fs.writeFileSync('/tmp/article.json',JSON.stringify(a,null,2));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`slug=${a.slug}\narticle_id=${a.id}\nimage=${a.image}\n`);
          JS

      - name: Verify public result
        env:
          SLUG: ${{ steps.publish.outputs.slug }}
          ARTICLE_ID: ${{ steps.publish.outputs.article_id }}
          IMAGE: ${{ steps.publish.outputs.image }}
        run: |
          set -euo pipefail
          node <<'JS'
          const fs=require('node:fs');
          const base='https://gnk-asg.hr',slug=process.env.SLUG,id=process.env.ARTICLE_ID,image=process.env.IMAGE;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(path){const r=await fetch(`${base}${path}${path.includes('?')?'&':'?'}cb=${Date.now()}`,{headers:{'cache-control':'no-cache'}});return{status:r.status,text:await r.text(),headers:Object.fromEntries(r.headers)}}
          let report;
          for(let attempt=1;attempt<=12;attempt++){
            const [news,status,hrList,enList,hr,en,gallery,visual,img]=await Promise.all([
              get('/data/news.json'),get('/data/news-automation-status.json'),get('/objave/'),get('/publications/'),get(`/objave/${slug}/`),get(`/publications/${slug}/`),get('/data/visual_gallery.json'),get('/visual-index/?lang=en'),get(image.startsWith('http')?image.replace(base,''):image)
            ]);
            let n={},s={},g={};try{n=JSON.parse(news.text)}catch{}try{s=JSON.parse(status.text)}catch{}try{g=JSON.parse(gallery.text)}catch{}
            const items=Array.isArray(n)?n:(n.items||[]),galleryItems=g.items||[],failures=[];
            if(news.status!==200||items.length<15)failures.push(`news=${news.status}:${items.length}`);
            if(items.slice(0,100).some(x=>!x.title||!x.summary||!x.source||!x.url||!x.image||x.imageFallback===true||x.verified!==true))failures.push('news_contract_invalid');
            if(s.archivePruneAt!==900||s.archiveRetainAfterPrune!==450)failures.push('archive_contract_invalid');
            for(const [name,r] of Object.entries({hrList,enList,hr,en,visual,img}))if(r.status!==200)failures.push(`${name}=${r.status}`);
            if(!hrList.text.includes(`/objave/${slug}/`))failures.push('hr_list_missing');
            if(!enList.text.includes(`/publications/${slug}/`))failures.push('en_list_missing');
            for(const [name,r] of Object.entries({hr,en})){
              if(r.headers['x-gnk-asg-publication-seo']!=='GNK_ASG_PUBLICATION_SEO_V3_20260626')failures.push(`${name}_seo_header_missing`);
              for(const marker of ['application/ld+json','twitter:card','og:image','Visual Index'])if(!r.text.includes(marker))failures.push(`${name}_${marker}_missing`);
            }
            if(!galleryItems.some(x=>String(x.article_id||x.articleId||x.id).includes(id)))failures.push('runtime_gallery_missing');
            if(!visual.text.includes('visual-index-full-gallery.js'))failures.push('visual_index_loader_missing');
            report={attempt,failures,article:{slug,id,image},newsCount:items.length,galleryCount:galleryItems.length};
            fs.writeFileSync('/tmp/verification.json',JSON.stringify(report,null,2));
            if(!failures.length)process.exit(0);
            await sleep(10000);
          }
          throw new Error(JSON.stringify(report));
          JS

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          verification=$(cat /tmp/verification.json 2>/dev/null || printf '{"error":"verification_not_reached"}')
          article=$(cat /tmp/article.json 2>/dev/null || printf '{"error":"article_not_reached"}')
          gh issue comment 101 --body "V31 + News + first publication **${JOB_STATUS}** · commit \`${RUN_SHA}\` · ${RUN_URL}\n\n### Verification\n\`\`\`json\n${verification}\n\`\`\`\n\n### Published article\n\`\`\`json\n${article}\n\`\`\`"
