name: IQ200 UI Harmonizer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/portal/assets/index-redesign-production.js"
      - "apps/portal/assets/index-iq200.css"
      - "apps/portal/assets/index-iq200.js"
      - "apps/portal/assets/backend-ui-shell.css"
      - "apps/portal/assets/backend-ui-shell.js"
      - "workers/gnk-asg-direct-operator/src/index-ui-harmonizer.js"
      - ".github/workflows/iq200-ui-harmonizer.yml"

concurrency:
  group: gnk-asg-iq200-ui
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate IQ200 package
        working-directory: workers/gnk-asg-direct-operator
        run: |
          node --check src/index-ui-harmonizer.js
          node --check ../../apps/portal/assets/index-redesign-production.js
          node --check ../../apps/portal/assets/index-iq200.js
          node --check ../../apps/portal/assets/backend-ui-shell.js
          grep -q 'Korporativni <span>ekosustav</span>' src/index-ui-harmonizer.js
          grep -q 'Corporate <span>ecosystem</span>' src/index-ui-harmonizer.js
          grep -q 'hero-network-canvas' ../../apps/portal/assets/index-iq200.js
          grep -q 'gnk-backend-shell' ../../apps/portal/assets/backend-ui-shell.js
      - name: Deploy UI harmonizer
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy src/index-ui-harmonizer.js --config wrangler.dark-market.toml --name gnk-asg-direct-operator
      - name: Verify public index and backend shell
        run: |
          sleep 12
          curl --fail --silent --show-error --location https://gnk-asg.hr/ > /tmp/hr.html
          curl --fail --silent --show-error --location https://gnk-asg.hr/en/ > /tmp/en.html
          grep -q 'Korporativni <span>ekosustav</span>' /tmp/hr.html
          grep -q 'Corporate <span>ecosystem</span>' /tmp/en.html
          ! grep -q 'Index /' /tmp/hr.html
          ! grep -q 'početna stranica' /tmp/hr.html
          ! grep -q 'Index /' /tmp/en.html
          ! grep -q 'home page' /tmp/en.html
          curl --fail --silent --show-error --location https://gnk-asg.hr/assets/index-iq200.css | grep -q 'GNK ASG INDEX IQ200'
          for url in https://gnk-asg.hr/operator-dashboard/ https://gnk-asg.hr/operator-mobile/ https://gnk-asg.hr/mail-studio/; do
            curl --fail --silent --show-error --location "$url" | grep -q 'backend-ui-shell.css'
          done
