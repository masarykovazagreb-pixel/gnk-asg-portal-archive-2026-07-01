name: Devto Popis Treci Pokusaj

on:
  workflow_dispatch:
    inputs:
      devto_key:
        description: "Dev.to API kljuc"
        required: true
        type: string

permissions:
  contents: write

jobs:
  popis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Maskiraj
        run: echo "::add-mask::${{ inputs.devto_key }}"
      - name: Dohvati popis
        env:
          DEVTO_KEY: ${{ inputs.devto_key }}
        run: |
          mkdir -p apps/portal/data/tmp-popis3
          curl -s "https://dev.to/api/articles/me/all?per_page=1000" -H "api-key: $DEVTO_KEY" -o apps/portal/data/tmp-popis3/svi.json
          python3 -c "
import json
d = json.load(open('apps/portal/data/tmp-popis3/svi.json'))
print('ukupno:', len(d))
for a in d:
    print(a['id'], '|', a.get('canonical_url'), '|', a['title'])
" > apps/portal/data/tmp-popis3/rezultat.txt
          cat apps/portal/data/tmp-popis3/rezultat.txt
      - name: Commit
        run: |
          git config user.name "gnk-asg-bot"
          git config user.email "it@gnk-asg.hr"
          BRANCH="popis-devto3-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-popis3/rezultat.txt
          git commit -m "popis3"
          git push origin "$BRANCH"
