name: Editorial Public Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/editorial-public-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print production responses
        shell: bash
        run: |
          set +e
          for url in \
            'https://gnk-asg.hr/api/editorial-public-health' \
            'https://gnk-asg.hr/auto-editor/' \
            'https://gnk-asg.hr/auto-editor/editorial/api/status'; do
            code=$(curl --silent --show-error --output response.txt --write-out '%{http_code}' "$url?cb=$(date +%s)")
            echo "URL=$url HTTP=$code"
            head -c 1000 response.txt
            echo
            echo '---'
          done
          exit 0
