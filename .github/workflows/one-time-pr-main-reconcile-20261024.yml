name: One-time PR main reconciliation 20261024
on:
  push:
    branches: ['fix/aktual-refresh-collision-window-20261024']
    paths:
      - '.github/workflows/one-time-pr-main-reconcile-20261024.yml'
permissions:
  contents: write
concurrency:
  group: one-time-pr-main-reconcile-20261024
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.ref == 'refs/heads/fix/aktual-refresh-collision-window-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/aktual-refresh-collision-window-20261024
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge latest canonical main into PR, regenerate, test, and push PR only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/aktual-refresh-collision-window-20261024'
          git config user.name gnk-asg-repair-bot
          git config user.email actions@users.noreply.github.com
          git fetch origin main --no-tags
          git merge --no-edit origin/main
          node scripts/build-index-parity.mjs
          node apps/sites/build.mjs
          node scripts/build-index-parity.mjs --check
          node tests/test-sites-network-v1.mjs
          git add apps/portal/index.html apps/portal/en/index.html apps/sites/site/izbori-srbija/
          if ! git diff --cached --quiet; then
            git commit -m 'fix: regenerate PR output against latest canonical main'
          fi
          git push origin HEAD:fix/aktual-refresh-collision-window-20261024
