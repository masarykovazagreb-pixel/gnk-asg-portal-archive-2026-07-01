name: Fix Image Dimensions (CLS)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fix-image-dimensions
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Add explicit width/height to local images
        run: node scripts/fix-image-dimensions-v1.mjs
      - name: Commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gnk-cls-bot"
          git config user.email "actions@github.com"
          git add apps/portal
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "CLS: explicit width/height on local images (automated)"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                break
              fi
              echo "Push odbijen (pokusaj $attempt) - main se pomaknuo, radim fetch+rebase."
              git fetch origin main
              git rebase origin/main || { echo "Rebase konflikt."; exit 1; }
              sleep $((attempt * 5))
              if [ "$attempt" = "5" ]; then echo "Push nije uspio nakon 5 pokusaja."; exit 1; fi
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Dispatch exact-SHA production deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          gh workflow run deploy-admin-auth-v6.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f confirm_production_deploy=DEPLOY_ADMIN_AUTH_V6 \
            -f approved_sha="$APPROVED_SHA"
