name: Mail Studio Deploy Locked

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Protect public IQ200 index
        run: |
          echo "MAIL_STUDIO_PUBLIC_WORKER_DEPLOY_DISABLED=true"
          echo "Mail Studio must not deploy gnk-asg-direct-operator while the public IQ200 index uses the same Worker."
          echo "Use a separate private backend Worker and precise private routes before enabling deployment again."
