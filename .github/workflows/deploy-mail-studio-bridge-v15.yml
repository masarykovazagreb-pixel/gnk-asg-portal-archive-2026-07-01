name: Deploy Mail Studio Bridge V15

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-mail-studio-bridge-v15.yml"
      - "apps/portal/assets/mail-studio-auth-bridge-v15.js"
      - "workers/gnk-asg-direct-operator/src/index-mail-studio-bridge-v15.js"
  workflow_run:
    workflows: ["Deploy Unified Auth V14"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: mail-studio-bridge-v15-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Mail Studio bridge source
        id: source
        working-directory: workers/gnk-asg-direct-operator
        shell: bash
        run: |
          set -euo pipefail
          test -s src/index-mail-studio-bridge-v15.js
          test -s src/index-unified-auth-v14.js
          test -s ../../apps/portal/assets/mail-studio-auth-bridge-v15.js
          node --check src/index-mail-studio-bridge-v15.js
          node --check ../../apps/portal/assets/mail-studio-auth-bridge-v15.js
          npx --yes wrangler@4 deploy src/index-mail-studio-bridge-v15.js --dry-run --config wrangler.toml

      - name: Deploy Mail Studio bridge
        id: cloudflare
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy src/index-mail-studio-bridge-v15.js --config wrangler.toml --name gnk-asg-direct-operator

      - name: Verify Mail Studio production
        id: production
        shell: bash
        run: |
          set -euo pipefail
          base="https://gnk-asg.hr"
          success=false
          for attempt in $(seq 1 18); do
            stamp=$(date +%s)
            version_code=$(curl -sSL -o version.json -w '%{http_code}' "$base/data/portal-version.json?cb=$stamp" || true)
            asset_code=$(curl -sSL -o bridge.js -w '%{http_code}' "$base/assets/mail-studio-auth-bridge-v15.js?cb=$stamp" || true)
            studio_code=$(curl -sSL -o studio.html -w '%{http_code}' "$base/mail-studio/?cb=$stamp" || true)
            root_code=$(curl -sSL -o root.html -w '%{http_code}' "$base/?cb=$stamp" || true)
            if [ "$version_code" = "200" ] && [ "$asset_code" = "200" ] && [ "$studio_code" = "401" ] && [ "$root_code" = "200" ] && grep -q 'GNK_ASG_MAIL_STUDIO_BRIDGE_V15_20260626' version.json && grep -q 'src/index-mail-studio-bridge-v15.js' version.json && grep -q 'GNK_ASG_MAIL_STUDIO_AUTH_BRIDGE_V15_20260626' bridge.js && grep -q 'mail-studio-auth-bridge-v15.js' studio.html; then
              success=true
              break
            fi
            sleep 10
          done
          if [ "$success" != "true" ]; then
            echo "VERSION_HTTP=$version_code ASSET_HTTP=$asset_code STUDIO_HTTP=$studio_code ROOT_HTTP=$root_code"
            cat version.json || true
            exit 1
          fi
          echo "GNK_ASG_MAIL_STUDIO_BRIDGE_V15_OK=true"

      - name: Report Mail Studio result
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          CLOUDFLARE_OUTCOME: ${{ steps.cloudflare.outcome }}
          PRODUCTION_OUTCOME: ${{ steps.production.outcome }}
        shell: bash
        run: |
          body=$(printf '## Mail Studio Bridge V15 — %s\n\n- Commit: `%s`\n- Provjera izvora: **%s**\n- Cloudflare deploy: **%s**\n- Produkcijska provjera: **%s**\n- Run: https://github.com/%s/actions/runs/%s\n' "$JOB_STATUS" "$GITHUB_SHA" "$SOURCE_OUTCOME" "$CLOUDFLARE_OUTCOME" "$PRODUCTION_OUTCOME" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh api "repos/${GITHUB_REPOSITORY}/issues/83/comments" -f body="$body"
