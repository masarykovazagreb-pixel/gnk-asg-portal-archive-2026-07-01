name: Check Publication Detail Pages V2

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/portal/objave/**'
      - 'apps/portal/analize/**'
      - 'apps/portal/komentari/**'
      - 'apps/portal/en/publications/**'
      - 'apps/portal/en/analyses/**'
      - 'apps/portal/en/commentary/**'
      - 'apps/portal/editorial-sitemap.xml'
      - 'scripts/test-index-content-contract.mjs'
      - '.github/workflows/check-publication-detail-pages-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify current editorial detail contract
        run: node scripts/test-index-content-contract.mjs
