name: Deploy Unified Public and Admin Menus V16

on:
  push:
    branches:
      - project-50-white-integrated-menu
    paths:
      - '.github/deploy-unified-menu-v16.trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnk-asg-unified-menu-v16-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate unified menu assets and worker
        shell: bash
        run: |
          set -euxo pipefail
          node --check apps/portal/assets/public-shell-v15.js
          node --check apps/portal/assets/public-menu-v10.js
          node --check apps/portal/assets/index-menu-unified-v16.js
          node --check apps/portal/assets/admin-center-extensions-v2.js
          node --check workers/gnk-asg-direct-operator/src/index-project50-v30-unified-menu.js
          node --test workers/gnk-asg-direct-operator/tests/public-menu-parity.test.mjs
          grep -q 'main = "src/index-project50-v30-unified-menu.js"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'GNK_ASG_PUBLIC_SHELL_V16_UNIFIED_NAVIGATION_20260628' apps/portal/assets/public-shell-v15.js
          grep -q 'GNK_ASG_ADMIN_CENTER_EXTENSIONS_V2_20260628' apps/portal/assets/admin-center-extensions-v2.js
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator
      - name: Deploy current branch Worker and assets
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator
      - name: Verify production menus without sending mail or media invitations
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          const base='https://gnk-asg.hr';
          const paths=['/','/en/','/vijesti/','/publications/','/admin-center/','/assets/public-shell-v15.js','/assets/public-menu-v10.css','/assets/admin-center-extensions-v2.js','/data/portal-version.json'];
          for(let attempt=1;attempt<=24;attempt++){
            const nonce=`${Date.now()}-${attempt}`;
            const results={};
            for(const path of paths){
              try{
                const response=await fetch(`${base}${path}${path.includes('?')?'&':'?'}cb=${nonce}`,{headers:{'cache-control':'no-cache','pragma':'no-cache'}});
                results[path]={status:response.status,headers:Object.fromEntries(response.headers),text:await response.text()};
              }catch(error){results[path]={status:0,headers:{},text:'',error:String(error)}}
            }
            const failures=[];
            const hr=results['/'],en=results['/en/'],news=results['/vijesti/'],publications=results['/publications/'],admin=results['/admin-center/'];
            if(hr.status!==200||!hr.text.includes('public-menu-v10.css?v=20260628-v16')||!hr.text.includes('index-menu-unified-v16.js'))failures.push('hr-index');
            if(en.status!==200||!en.text.includes('/en/contact/')||!en.text.includes('/admin-center/'))failures.push('en-index');
            if(news.status!==200||!news.text.includes('public-shell-v15.js?v=20260628-v16'))failures.push('news');
            if(publications.status!==200||!publications.text.includes('public-shell-v15.js?v=20260628-v16'))failures.push('publications');
            if(admin.status!==200||!admin.text.includes('admin-center-extensions-v2.js'))failures.push('admin-center');
            if(!results['/assets/public-shell-v15.js'].text.includes('GNK_ASG_PUBLIC_SHELL_V16_UNIFIED_NAVIGATION_20260628'))failures.push('shell-asset');
            if(!results['/assets/public-menu-v10.css'].text.includes('unified public navigation V16'))failures.push('menu-css');
            if(!results['/assets/admin-center-extensions-v2.js'].text.includes('GNK_ASG_ADMIN_CENTER_EXTENSIONS_V2_20260628'))failures.push('admin-extension');
            if(!results['/data/portal-version.json'].text.includes('GNK_ASG_PROJECT50_V30_UNIFIED_PUBLIC_ADMIN_MENUS_20260628'))failures.push('status');
            console.log(JSON.stringify({attempt,failures,menuHeader:hr.headers['x-gnk-asg-menu-release']||'',adminHeader:admin.headers['x-gnk-asg-admin-menu']||''}));
            if(!failures.length)process.exit(0);
            await sleep(10000);
          }
          process.exit(1);
          JS
