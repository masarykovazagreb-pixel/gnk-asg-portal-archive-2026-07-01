name: Deploy Public Core and Mail Inbox V18

on:
  push:
    branches:
      - project-50-white-integrated-menu
    paths:
      - '.github/deploy-unified-menu-v16.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gnk-asg-public-mail-v18-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate public parity and connected Inbox
        shell: bash
        run: |
          set -euxo pipefail
          node --check apps/portal/assets/public-shell-v15.js
          node --check apps/portal/assets/public-menu-v10.js
          node --check apps/portal/assets/index-menu-unified-v16.js
          node --check apps/portal/assets/contact-v13.js
          node --check apps/portal/assets/contact-parity-v1.js
          node --check apps/portal/assets/admin-center-mail-only-v1.js
          node --check apps/portal/assets/mail-studio-inbox-ui-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-project50-v30-unified-menu.js
          node --check workers/gnk-asg-direct-operator/src/mail-inbox-contact-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-project50-v31-mail-inbox.js
          node --test workers/gnk-asg-direct-operator/tests/public-menu-parity.test.mjs
          node --test workers/gnk-asg-direct-operator/tests/mail-inbox-contact.test.mjs
          grep -q 'main = "src/index-project50-v31-mail-inbox.js"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'GNK_ASG_PUBLIC_SHELL_V17_CORE_NAVIGATION_20260628' apps/portal/assets/public-shell-v15.js
          grep -q 'GNK_ASG_PUBLIC_MENU_V17_CORE_20260628' apps/portal/assets/public-menu-v10.js
          grep -q 'GNK_ASG_INDEX_MENU_V17_CORE_PARITY_20260628' apps/portal/assets/index-menu-unified-v16.js
          grep -q 'GNK_ASG_ADMIN_MAIL_ONLY_V2_20260628' apps/portal/assets/admin-center-mail-only-v1.js
          grep -q 'GNK_ASG_MAIL_STUDIO_INBOX_UI_V1_20260628' apps/portal/assets/mail-studio-inbox-ui-v1.js
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator
      - name: Deploy current branch Worker and assets
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator
      - name: Verify production without sending mail or media invitations
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          const base='https://gnk-asg.hr';
          const paths=['/','/en/','/contact/','/en/contact/','/admin-center/','/assets/public-shell-v15.js','/assets/public-menu-v10.js','/assets/index-menu-unified-v16.js','/assets/admin-center-mail-only-v1.js','/assets/mail-studio-inbox-ui-v1.js','/data/portal-version.json'];
          const requiredHr=['#the-code','#financije','#mreza','/trzista/','/contact/','/admin-center/','/en/'];
          const requiredEn=['#the-code','#financials','#network','/markets/','/en/contact/','/admin-center/','/'];
          const forbiddenIndex=['/vijesti/','/news/','/objave/','/publications/','/visual-index/','/assistant/','/en/assistant/'];
          for(let attempt=1;attempt<=24;attempt++){
            const nonce=`${Date.now()}-${attempt}`;
            const results={};
            for(const path of paths){
              try{
                const response=await fetch(`${base}${path}${path.includes('?')?'&':'?'}cb=${nonce}`,{headers:{'cache-control':'no-cache','pragma':'no-cache'}});
                results[path]={status:response.status,headers:Object.fromEntries(response.headers),text:await response.text()};
              }catch(error){results[path]={status:0,headers:{},text:'',error:String(error)}}
            }
            const failures=[];
            const hr=results['/'],en=results['/en/'],hrContact=results['/contact/'],enContact=results['/en/contact/'],admin=results['/admin-center/'],status=results['/data/portal-version.json'];
            if(hr.status!==200||!hr.text.includes('index-menu-unified-v16.js?v=20260628-v17')||requiredHr.some(item=>!hr.text.includes(item))||forbiddenIndex.some(item=>hr.text.includes(`href="${item}`)))failures.push('hr-index');
            if(en.status!==200||!en.text.includes('index-menu-unified-v16.js?v=20260628-v17')||requiredEn.some(item=>!en.text.includes(item))||forbiddenIndex.some(item=>en.text.includes(`href="${item}`)))failures.push('en-index');
            if(hr.headers['x-gnk-asg-design-parity']!=='HR_EN_IDENTICAL'||en.headers['x-gnk-asg-design-parity']!=='HR_EN_IDENTICAL')failures.push('design-parity');
            if(hrContact.status!==200||enContact.status!==200||!hrContact.text.includes('/api/contact-submit')||!enContact.text.includes('/api/contact-submit'))failures.push('contact');
            if(admin.status!==200||!admin.text.includes('admin-center-mail-only-v1.js?v=20260628-v2'))failures.push('admin-mail-only');
            if(!results['/assets/public-shell-v15.js'].text.includes('GNK_ASG_PUBLIC_SHELL_V17_CORE_NAVIGATION_20260628'))failures.push('shell-asset');
            if(!results['/assets/public-menu-v10.js'].text.includes('GNK_ASG_PUBLIC_MENU_V17_CORE_20260628'))failures.push('menu-asset');
            if(!results['/assets/index-menu-unified-v16.js'].text.includes('GNK_ASG_INDEX_MENU_V17_CORE_PARITY_20260628'))failures.push('index-menu-asset');
            if(!results['/assets/admin-center-mail-only-v1.js'].text.includes('GNK_ASG_ADMIN_MAIL_ONLY_V2_20260628'))failures.push('admin-lock-asset');
            if(!results['/assets/mail-studio-inbox-ui-v1.js'].text.includes('GNK_ASG_MAIL_STUDIO_INBOX_UI_V1_20260628'))failures.push('inbox-ui-asset');
            if(!status.text.includes('src/index-project50-v31-mail-inbox.js')||!status.text.includes('GNK_ASG_MAIL_INBOX_CONTACT_V1_20260628')||!status.text.includes('GNK_ASG_MAIL_STUDIO_INBOX_UI_V1_20260628')||!status.text.includes('"mailInboxConnected": true'))failures.push('mail-inbox-status');
            console.log(JSON.stringify({attempt,failures,entry:status.headers['x-gnk-asg-entry-wrapper']||'',menu:hr.headers['x-gnk-asg-menu-release']||'',parity:hr.headers['x-gnk-asg-design-parity']||''}));
            if(!failures.length)process.exit(0);
            await sleep(10000);
          }
          process.exit(1);
          JS
      - name: Record successful production deployment
        uses: actions/github-script@v7
        with:
          script: |
            const path='docs/deployments/unified-menu-v16-live.json';
            const branch='project-50-white-integrated-menu';
            let sha;
            try {
              const current=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:branch});
              if(!Array.isArray(current.data))sha=current.data.sha;
            } catch(error) { if(error.status!==404)throw error; }
            const payload={ok:true,release:'GNK_ASG_PROJECT50_V31_CONNECTED_MAIL_INBOX_UI_20260628',navigation:'seven-items',designParity:'HR_EN_IDENTICAL',adminMode:'MAIL_ONLY_V2',mailInbox:'CONTACT_FORM_KV',mailInboxUi:'CARDS_REPLY_PREP_ONLY',workflowRunId:context.runId,sourceCommit:context.sha,branch,deployedAt:new Date().toISOString(),mailSent:false,mediaInvitationsSent:false};
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch,sha,message:'Record successful V18 public and Inbox deployment [skip ci]',content:Buffer.from(JSON.stringify(payload,null,2)+'\n').toString('base64')});
