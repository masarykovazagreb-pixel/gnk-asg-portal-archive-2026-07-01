name: Deploy Stable Public V29

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-index-visual-fix-v29.yml'
      - 'apps/portal/assets/index-priority-v1.js'
      - 'apps/portal/assets/index-mail-link-v1.js'
      - 'apps/portal/assets/index-code-layout-fix-v1.css'
      - 'apps/portal/assets/index-city-white-v1.css'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v29-pdf-centre.js'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v29-index-visual-fix.js'
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: deploy-stable-public-v29
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.number == 65 &&
       github.event.comment.body == '/deploy-index-download-centre')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate INDEX package
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/portal/assets/index-priority-v1.js
          node --check apps/portal/assets/index-mail-link-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v29-index-visual-fix.js
          grep -q "Download centar" apps/portal/assets/index-mail-link-v1.js
          grep -q "Download Centre" apps/portal/assets/index-mail-link-v1.js
          grep -q "downloadHref='/downloads/'" apps/portal/assets/index-mail-link-v1.js
          grep -q 'finance-grid>.finance-card:nth-of-type(2)' apps/portal/assets/index-city-white-v1.css
      - name: Deploy stable INDEX V29
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy src/index-admin-hub-v29-index-visual-fix.js --config wrangler.toml --name gnk-asg-direct-operator
      - name: Verify HR and EN INDEX
        shell: bash
        run: |
          set -euo pipefail
          CB="${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5 6 7 8; do
            curl -sS -D /tmp/hr.headers "https://gnk-asg.hr/?cb=${CB}-${attempt}" -o /tmp/hr.html || true
            curl -sS -D /tmp/en.headers "https://gnk-asg.hr/en/?cb=${CB}-${attempt}" -o /tmp/en.html || true
            if grep -qi '^x-gnk-asg-index-menu: DOWNLOAD_CENTRE_SHARED_ADMIN_MAIL_STUDIO' /tmp/hr.headers \
              && grep -qi '^x-gnk-asg-index-menu: DOWNLOAD_CENTRE_SHARED_ADMIN_MAIL_STUDIO' /tmp/en.headers \
              && grep -q 'href="/downloads/"[^>]*>Download centar<' /tmp/hr.html \
              && grep -q 'href="/downloads/"[^>]*>Download Centre<' /tmp/en.html \
              && grep -q 'href="/mail-studio/"[^>]*>ADMIN<' /tmp/hr.html \
              && grep -q 'href="/mail-studio/"[^>]*>ADMIN<' /tmp/en.html \
              && ! grep -q '>Tržišta<' /tmp/hr.html \
              && ! grep -q '>Markets<' /tmp/en.html \
              && ! grep -q 'Error 1011' /tmp/hr.html; then
              echo 'INDEX_MENU_DOWNLOAD_CENTRE_OK=true'
              exit 0
            fi
            sleep 8
          done
          exit 1
