name: Prepare Campaign Mailer Continuation Export

on:
  push:
    branches: [main]
    paths:
      - '.github/campaign-cleanup-remaining.trigger'

permissions:
  contents: write

concurrency:
  group: prepare-campaign-mailer-continuation
  cancel-in-progress: false

jobs:
  export:
    if: vars.GNK_ASG_RELEASE_FENCE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Export contacts after The Australian and exclude entire domain
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p ../../exports

          npx --yes wrangler@4 d1 execute gnk_asg_operator_logs --remote --config wrangler.toml --json --command "SELECT status, next_send_at FROM campaign_mailer_state WHERE id=1;" > ../../exports/continuation-state.json

          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('../../exports/continuation-state.json','utf8'));
          const row=raw?.[0]?.results?.[0]||raw?.results?.[0];
          if(!row) throw new Error('Campaign state was not returned');
          if(row.status==='running') throw new Error('Export refused: campaign is still running');
          NODE

          npx --yes wrangler@4 d1 execute gnk_asg_operator_logs --remote --config wrangler.toml --json --command "SELECT MIN(id) AS cutoff_id FROM campaign_mailer_contacts WHERE LOWER(TRIM(email))='online@theaustralian.com.au';" > ../../exports/continuation-cutoff.json

          cutoff_id=$(node -e "const fs=require('fs');const raw=JSON.parse(fs.readFileSync('../../exports/continuation-cutoff.json','utf8'));const row=raw?.[0]?.results?.[0]||raw?.results?.[0];if(!row?.cutoff_id)process.exit(2);process.stdout.write(String(row.cutoff_id));")

          npx --yes wrangler@4 d1 execute gnk_asg_operator_logs --remote --config wrangler.toml --json --command "SELECT id,email,priority,rang,medij,drzava,regija,jezik,format,kome_ide,koristiti_za,vrsta_kontakta,pouzdanost,ime,prezime,personalizacija,status,error_reason,attempts,sent_at,created_at,updated_at FROM campaign_mailer_contacts ORDER BY id;" > ../../exports/continuation-all-original-order.json

          npx --yes wrangler@4 d1 execute gnk_asg_operator_logs --remote --config wrangler.toml --json --command "SELECT id,email,priority,rang,medij,drzava,regija,jezik,format,kome_ide,koristiti_za,vrsta_kontakta,pouzdanost,ime,prezime,personalizacija,status,error_reason,attempts,sent_at,created_at,updated_at FROM campaign_mailer_contacts WHERE id > ${cutoff_id} AND LOWER(TRIM(email)) NOT LIKE '%@theaustralian.com.au' ORDER BY id;" > ../../exports/continuation-cleaned.json

          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const outDir='../../exports';
          const extract=file=>{
            const raw=JSON.parse(fs.readFileSync(path.join(outDir,file),'utf8'));
            return raw?.[0]?.results||raw?.results||[];
          };
          const cutoffRaw=JSON.parse(fs.readFileSync(path.join(outDir,'continuation-cutoff.json'),'utf8'));
          const cutoff=(cutoffRaw?.[0]?.results||cutoffRaw?.results||[])[0]?.cutoff_id;
          const all=extract('continuation-all-original-order.json');
          const cleaned=extract('continuation-cleaned.json');
          if(!cutoff) throw new Error('The cutoff address was not found');
          if(!cleaned.length) throw new Error('No contacts remain after cutoff');
          if(cleaned.some(r=>String(r.email||'').toLowerCase().endsWith('@theaustralian.com.au'))) throw new Error('Excluded domain still exists in export');
          const headers=['Novi rang','Originalni ID','Originalni rang','Prioritet','Medij','Država/teritorij','Regija','Jezik','Format','Email','Kome ide','Najbolje koristiti za','Vrsta kontakta','Pouzdanost','Ime','Prezime','Personalizacija','Prethodni status'];
          const esc=v=>`"${String(v??'').replace(/"/g,'""')}"`;
          const rows=cleaned.map((r,i)=>[
            i+1,r.id,r.rang,r.priority,r.medij,r.drzava,r.regija,r.jezik,r.format,String(r.email||'').toLowerCase(),r.kome_ide,r.koristiti_za,r.vrsta_kontakta,r.pouzdanost,r.ime,r.prezime,r.personalizacija,r.status
          ]);
          const csv=[headers.map(esc).join(','),...rows.map(row=>row.map(esc).join(','))].join('\n')+'\n';
          fs.writeFileSync(path.join(outDir,'campaign-mailer-nastavak-nakon-the-australian-2026-07-03.csv'),csv);
          fs.writeFileSync(path.join(outDir,'campaign-mailer-nastavak-summary-2026-07-03.json'),JSON.stringify({
            originalCount:all.length,
            cutoffEmail:'online@theaustralian.com.au',
            cutoffId:Number(cutoff),
            removedThroughCutoff:all.filter(r=>Number(r.id)<=Number(cutoff)).length,
            excludedDomain:'theaustralian.com.au',
            remainingCount:cleaned.length,
            firstRemaining:{id:cleaned[0].id,email:cleaned[0].email,media:cleaned[0].medij},
            lastRemaining:{id:cleaned[cleaned.length-1].id,email:cleaned[cleaned.length-1].email,media:cleaned[cleaned.length-1].medij},
            databaseModified:false,
            campaignStarted:false,
            createdAt:new Date().toISOString()
          },null,2)+'\n');
          NODE

      - name: Commit continuation export
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports/campaign-mailer-nastavak-nakon-the-australian-2026-07-03.csv \
                  exports/campaign-mailer-nastavak-summary-2026-07-03.json \
                  exports/continuation-state.json \
                  exports/continuation-cutoff.json
          git commit -m 'Export Campaign Mailer continuation after The Australian'
          git push origin main
