name: Fix Release Static Audit 20260724

on:
  push:
    branches:
      - release/digital-workforce-protected-production-20260724
    paths:
      - '.github/workflows/fix-release-static-audit-20260724.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/digital-workforce-protected-production-20260724
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair exact pre-existing audit blockers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          replacements = {
            'apps/portal/en/autorske-objave/index.html': {
              '../assets/favicon.svg': '/assets/favicon.svg',
              '../assets/style.css': '/assets/style.css',
              'href="poduzetnistvo-u-globalnoj-neizvjesnosti.html"': 'href="/autorske-objave/poduzetnistvo-u-globalnoj-neizvjesnosti.html"',
              'href="business-u-svijetu-manjih-marzi.html"': 'href="/autorske-objave/business-u-svijetu-manjih-marzi.html"',
              'href="ekonomija-i-cijena-vremena.html"': 'href="/autorske-objave/ekonomija-i-cijena-vremena.html"',
              'href="nikkei-225-i-povjerenje-u-japan.html"': 'href="/autorske-objave/nikkei-225-i-povjerenje-u-japan.html"',
              'href="vrijednost-kapital-dokumentacija-povjerenje.html"': 'href="/autorske-objave/vrijednost-kapital-dokumentacija-povjerenje.html"',
              'href="digitalni-portal-mediji-i-osobni-kredibilitet.html"': 'href="/autorske-objave/digitalni-portal-mediji-i-osobni-kredibilitet.html"',
            },
            'apps/portal/en/autorske-objave/kapital-prati-povjerenje.html': {'../assets/style.css':'/assets/style.css','../assets/favicon.svg':'/assets/favicon.svg'},
            'apps/portal/en/autorske-objave/svjetska-ekonomija-i-lokalni-poduzetnik.html': {'../assets/style.css':'/assets/style.css','../assets/favicon.svg':'/assets/favicon.svg'},
            'apps/portal/en/instalacija/index.html': {'../manifest.webmanifest':'/manifest.webmanifest','../assets/style.css':'/assets/style.css'},
            'apps/portal/en/sadrzaj/index.html': {'../assets/style.css':'/assets/style.css','href="/en/tehnologija/"':'href="/en/"'},
            'apps/portal/en/teme/index.html': {'../manifest.webmanifest':'/manifest.webmanifest','../assets/style.css':'/assets/style.css','href="/en/tehnologija/"':'href="/en/"'},
          }
          about_files = [
            'apps/portal/komentari/dobra-odluka-treba-vrijeme-ne-oklijevanje/index.html',
            'apps/portal/komentari/rizik-se-ne-eliminira-nego-upravlja/index.html',
            'apps/portal/komentari/transparentnost-nije-teret-nego-prednost/index.html',
            'apps/portal/objave/korporativno-upravljanje-obiteljskih-tvrtki/index.html',
            'apps/portal/objave/planiranje-kljucnih-nasljednih-pozicija/index.html',
            'apps/portal/objave/upravljanje-intelektualnim-kapitalom-tvrtke/index.html',
          ]
          for file, mapping in replacements.items():
            p=Path(file); text=p.read_text(encoding='utf-8')
            for old,new in mapping.items(): text=text.replace(old,new)
            p.write_text(text,encoding='utf-8')
          for file in about_files:
            p=Path(file); text=p.read_text(encoding='utf-8').replace('href="/o-nama/"','href="/about/"')
            p.write_text(text,encoding='utf-8')

          p=Path('apps/portal/nilus-bio/index.html')
          text=p.read_text(encoding='utf-8')
          counter={'input':0,'select':0,'textarea':0}
          def label_tag(match):
            tag=match.group(1).lower(); attrs=match.group(2)
            if re.search(r'\b(aria-label|aria-labelledby|title)\s*=',attrs,re.I): return match.group(0)
            counter[tag]+=1
            label={'input':f'Polje obrasca {counter[tag]}','select':'Odabir opcije','textarea':'Poruka'}[tag]
            return f'<{tag}{attrs} aria-label="{label}">'
          text=re.sub(r'<(input|select|textarea)(\b[^>]*)>',label_tag,text,flags=re.I)
          p.write_text(text,encoding='utf-8')
          PY
          git diff --check
          git status --short
      - name: Commit exact repairs and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-release-static-audit-20260724.yml
          git config user.name 'gnk-asg-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/portal
          git commit -m 'fix(portal): clear pre-existing static audit blockers'
          git push origin HEAD:release/digital-workforce-protected-production-20260724
