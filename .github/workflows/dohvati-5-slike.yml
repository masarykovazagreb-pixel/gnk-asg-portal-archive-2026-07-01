name: Dohvati 2 slike v4 (jednokratno)
on: workflow_dispatch
jobs:
  dohvati:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p apps/portal/data/tmp-5s
          curl -s "https://gnk-asg.hr/api/slike?upit=corporate+treasury+cash+reserves+finance" -o apps/portal/data/tmp-5s/rezerve.json
          curl -s "https://gnk-asg.hr/api/slike?upit=data+quality+server+analytics+screen" -o apps/portal/data/tmp-5s/podaci.json
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          BRANCH="slike5-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-5s
          git commit -m "slike"
          git push origin "$BRANCH"
