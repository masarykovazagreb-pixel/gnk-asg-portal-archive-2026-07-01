name: AKTUAL WORLD 201 — regenerate reviewed pages
on:
  push:
    branches:
      - feature/aktual-media-world-201
    paths:
      - 'scripts/build-aktual-world-v1.mjs'
      - '.github/workflows/aktual-world-regenerate-v1.yml'
permissions:
  contents: write
concurrency:
  group: aktual-world-201-regenerate
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aktual-media-world-201
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and audit 201 countries and 10 cities
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/build-aktual-world-v1.mjs
          AKTUAL_WORLD_OUT=apps/portal/gnk-aktual node scripts/build-aktual-world-v1.mjs --base https://gnk-asg.hr/gnk-aktual/
          node --test tests/test-aktual-world-v1.mjs
          node scripts/audit-aktual-all-pages-v2.mjs
      - name: Commit only generated HTML and XML files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/portal/gnk-aktual/media apps/portal/gnk-aktual/grad
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(aktual-world): align static pages with SEO and editorial gates'
          git push origin HEAD:feature/aktual-media-world-201
