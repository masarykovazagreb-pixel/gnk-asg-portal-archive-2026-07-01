name: Scheduled Production Deploy

# Manual compatibility wrapper for the exact-SHA "Deploy Admin Auth V6"
# release fence. Control Plane V2 forbids scheduled or push-triggered
# production deploys; the verified release workflow remains manual-only.
#
# Ukljucuje retry: automatizirani commitovi mogu pomaknuti main IZMEDU
# authorize i deploy koraka unutar samog deploy pipelinea. To je ispravan
# safety rejection; wrapper tada ponovno cita svjezi origin/main i pokusava
# ponovno, bez gasenja exact-SHA provjera u samom production workflowu.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: scheduled-production-deploy-trigger
  cancel-in-progress: true

jobs:
  maybe-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Provjeri i deployaj (s retry na SHA-race)
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          LAST_DEPLOYED_SHA=$(gh run list --workflow=deploy-admin-auth-v6.yml --status=success --limit=1 --json headSha --jq '.[0].headSha // empty')
          git fetch origin main -q
          CURRENT_SHA=$(git rev-parse origin/main)

          if [ "$LAST_DEPLOYED_SHA" = "$CURRENT_SHA" ] && [ -n "$LAST_DEPLOYED_SHA" ]; then
            echo "Main nepromijenjen od zadnjeg deploya ($CURRENT_SHA) - preskacem."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "final_conclusion=already-current" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

          for attempt in 1 2 3; do
            git fetch origin main -q
            DEPLOY_SHA=$(git rev-parse origin/main)
            echo "Pokusaj ${attempt}: deployam SHA ${DEPLOY_SHA}"

            BEFORE=$(gh run list --workflow=deploy-admin-auth-v6.yml --limit=1 --json databaseId --jq '.[0].databaseId // empty')

            gh workflow run deploy-admin-auth-v6.yml \
              --ref main \
              -f confirm_production_deploy=DEPLOY_ADMIN_AUTH_V6 \
              -f approved_sha="$DEPLOY_SHA"

            NEW_RUN_ID=""
            for i in $(seq 1 20); do
              sleep 6
              CANDIDATE=$(gh run list --workflow=deploy-admin-auth-v6.yml --limit=1 --json databaseId --jq '.[0].databaseId // empty')
              if [ -n "$CANDIDATE" ] && [ "$CANDIDATE" != "$BEFORE" ]; then
                NEW_RUN_ID="$CANDIDATE"
                break
              fi
            done
            if [ -z "$NEW_RUN_ID" ]; then
              echo "Novi run se nije pojavio na vrijeme; ponavljam sa svjezim main SHA-om."
              continue
            fi

            echo "Pratim run $NEW_RUN_ID..."
            if gh run watch "$NEW_RUN_ID" --exit-status; then
              git fetch origin main -q
              AFTER_SHA=$(git rev-parse origin/main)
              if [ "$AFTER_SHA" = "$DEPLOY_SHA" ]; then
                echo "Deploy uspio i main je ostao na ${DEPLOY_SHA}."
                echo "final_conclusion=success" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Deploy je uspio, ali se main u meduvremenu pomaknuo na ${AFTER_SHA}; ponavljam."
            else
              echo "Deploy pao na pokusaju ${attempt}; ponavljam sa svjezim SHA-om."
            fi
            sleep 15
          done

          echo "Deploy nije postigao exact-SHA nakon 3 pokusaja."
          echo "final_conclusion=failure" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Sazetak
        if: always()
        run: |
          {
            echo "## Scheduled Production Deploy"
            echo ""
            echo "- Deploy pokrenut: **${{ steps.check.outputs.should_deploy }}**"
            echo "- Konacni ishod: **${{ steps.check.outputs.final_conclusion || 'n/a' }}**"
          } >> "$GITHUB_STEP_SUMMARY"
