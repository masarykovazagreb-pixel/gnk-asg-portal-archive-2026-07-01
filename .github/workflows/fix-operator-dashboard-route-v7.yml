name: Fix Operator Dashboard Route V7

on:
  push:
    branches: [main]
    paths:
      - ".github/fix-operator-dashboard-route-v7.trigger"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Assign Operator Dashboard routes to final Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('fs');
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const headers={Authorization:`Bearer ${token}`,'Content-Type':'application/json'};
          const desired=[
            'gnk-asg.hr/operator-dashboard*',
            'www.gnk-asg.hr/operator-dashboard*'
          ];
          const targetScript='gnk-asg-direct-operator';
          async function call(url,options={}){
            const response=await fetch(url,{...options,headers:{...headers,...(options.headers||{})}});
            const data=await response.json();
            if(!response.ok||data.success===false)throw new Error(`${response.status} ${JSON.stringify(data.errors||data)}`);
            return data;
          }
          (async()=>{
            const zones=await call('https://api.cloudflare.com/client/v4/zones?name=gnk-asg.hr&status=active');
            const zoneId=zones.result?.[0]?.id;
            if(!zoneId)throw new Error('Zone not found');
            const current=await call(`https://api.cloudflare.com/client/v4/zones/${zoneId}/workers/routes`);
            const actions=[];
            for(const pattern of desired){
              const existing=(current.result||[]).find(route=>route.pattern===pattern);
              if(existing){
                if(existing.script===targetScript){
                  actions.push({pattern,action:'unchanged',script:targetScript});
                }else{
                  await call(`https://api.cloudflare.com/client/v4/zones/${zoneId}/workers/routes/${existing.id}`,{
                    method:'PUT',body:JSON.stringify({pattern,script:targetScript})
                  });
                  actions.push({pattern,action:'updated',from:existing.script||null,to:targetScript});
                }
              }else{
                await call(`https://api.cloudflare.com/client/v4/zones/${zoneId}/workers/routes`,{
                  method:'POST',body:JSON.stringify({pattern,script:targetScript})
                });
                actions.push({pattern,action:'created',script:targetScript});
              }
            }
            fs.writeFileSync('route-fix-result.json',JSON.stringify({checkedAt:new Date().toISOString(),ok:true,targetScript,actions},null,2));
          })().catch(error=>{
            fs.writeFileSync('route-fix-result.json',JSON.stringify({checkedAt:new Date().toISOString(),ok:false,error:error.message},null,2));
            process.exitCode=1;
          });
          JS
          body=$(printf '## Operator Dashboard route repair\n\n```json\n%s\n```\n' "$(cat route-fix-result.json)")
          gh api "repos/${GITHUB_REPOSITORY}/issues/66/comments" -f body="$body"
