name: Check Digital Workforce Public Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/portal/digital-workforce/**'
      - 'apps/portal/en/digital-workforce/**'
      - 'apps/portal/assets/digital-workforce-suite-v1.js'
      - 'workers/gnk-asg-direct-operator/src/digital-workforce-suite-v1.js'
      - 'workers/gnk-asg-direct-operator/src/digital-workforce-public-read-v1.js'
      - 'scripts/test-digital-workforce-public-read-parity-v1.mjs'
      - 'scripts/test-visible-menu-logo-content-v1.mjs'
      - '.github/workflows/check-digital-workforce-public.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          set -euxo pipefail
          node --check apps/portal/assets/digital-workforce-suite-v1.js
          node --check workers/gnk-asg-direct-operator/src/digital-workforce-suite-v1.js
          node --check workers/gnk-asg-direct-operator/src/digital-workforce-public-read-v1.js
          node --check scripts/test-digital-workforce-public-read-parity-v1.mjs
          node --check scripts/test-visible-menu-logo-content-v1.mjs
      - name: Validate public Workforce contract and truthful boundaries
        run: |
          set -euxo pipefail
          node scripts/test-digital-workforce-public-read-parity-v1.mjs
          node scripts/test-visible-menu-logo-content-v1.mjs
      - name: Confirm review-only execution model
        run: |
          set -euxo pipefail
          grep -q 'permissions:' .github/workflows/check-digital-workforce-public.yml
          grep -q 'contents: read' .github/workflows/check-digital-workforce-public.yml
          echo 'Review validation only. This workflow performs no deployment, publication, external posting, DNS, secret, payment, or email action.'
