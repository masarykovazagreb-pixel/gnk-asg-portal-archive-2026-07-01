name: Check Digital Workforce Public Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/portal/digital-workforce/**'
      - 'apps/portal/en/digital-workforce/**'
      - 'apps/portal/assets/digital-workforce-**'
      - 'config/master-asg-worker-fleet-v1.json'
      - 'workers/gnk-asg-direct-operator/src/index-enterprise-projects-runtime-v1.js'
      - 'scripts/validate-digital-workforce-public-v3.mjs'
      - '.github/workflows/check-digital-workforce-public.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check current Workforce JavaScript syntax
        run: |
          set -euxo pipefail
          node --check apps/portal/assets/digital-workforce-suite-v1.js
          node --check apps/portal/assets/digital-workforce-dashboard-v1.js
          node --check apps/portal/assets/digital-workforce-antfarm-v1.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/index-enterprise-projects-runtime-v1.js
          node --check scripts/validate-digital-workforce-public-v3.mjs
      - name: Validate live public Workforce and autonomy guardrails
        run: node scripts/validate-digital-workforce-public-v3.mjs
      - name: Confirm review-only CI execution model
        run: |
          set -euxo pipefail
          grep -q 'permissions:' .github/workflows/check-digital-workforce-public.yml
          grep -q 'contents: read' .github/workflows/check-digital-workforce-public.yml
          ! grep -Eq 'wrangler deploy|git push|curl.+-X[[:space:]]+(POST|PUT|PATCH|DELETE)' .github/workflows/check-digital-workforce-public.yml
          echo 'Workforce contract validation is read-only; deployment and external side effects stay outside this workflow.'
