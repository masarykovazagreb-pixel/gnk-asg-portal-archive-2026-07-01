name: Content Queue Publish

# GNK ASG Content Factory — objavljuje READY stavke po kalendaru (3 slota dnevno, Europe/Zagreb).
# Nakon objave: commit na main -> exact-SHA production deploy (verifikacija + IndexNow),
# a promjena editorial-registry.json automatski okida Blog Mirror Publish (Blogger/Dev.to/Tumblr/Telegraph).

on:
  workflow_dispatch:
  schedule:
    - cron: '20 7,11,15 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: gnk-asg-main-mutation
  cancel-in-progress: false

jobs:
  publish:
    if: vars.GNK_ASG_RELEASE_FENCE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish due calendar items
        id: pub
        shell: bash
        run: |
          set -euo pipefail
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          node scripts/content-queue-publish-v1.mjs | tee /tmp/queue-out.txt
          if grep -Eq '"changed": ?true' /tmp/queue-out.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and dispatch exact-SHA production deploy
        if: steps.pub.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BASE_SHA: ${{ steps.pub.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gnk-content-queue-bot"
          git config user.email "actions@github.com"
          git add apps/portal
          if git diff --cached --quiet; then
            echo "Generator reported changed=true but there is no staged diff; nothing to publish."
            exit 0
          fi
          git commit -m "Content queue: publish scheduled calendar items"

          # Operational Single-Writer / Exact-SHA fence:
          # never rebase a generated mutation onto a moving main. If another
          # writer moved main after generation started, defer to the next run.
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          if [ "$current_main" != "$EXPECTED_BASE_SHA" ]; then
            echo "Main moved during this run: expected $EXPECTED_BASE_SHA, found $current_main. Deferring without rebase/push."
            exit 75
          fi

          # Normal non-force push is the final compare-and-swap guard: if main
          # moves after the check, Git rejects the non-fast-forward update.
          git push origin HEAD:main
          sha="$(git rev-parse HEAD)"
          gh workflow run deploy-admin-auth-v6.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f confirm_production_deploy=DEPLOY_ADMIN_AUTH_V6 \
            -f approved_sha="$sha"
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '## Content Queue' >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,60p' /tmp/queue-out.txt >> "$GITHUB_STEP_SUMMARY" || true
