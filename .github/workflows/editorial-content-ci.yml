name: Editorial Content SEO Audit
on:
  pull_request:
    paths:
      - 'apps/portal/objave/**'
      - 'apps/portal/komentari/**'
      - 'apps/portal/editorial-sitemap.xml'
      - 'apps/portal/data/editorial-plan/**'
      - 'docs/EDITORIAL-CONTENT-DEPTH-RULE.md'
      - 'scripts/editorial-publish-scheduled-v1.mjs'
      - 'scripts/validate-editorial-content-policy-v1.mjs'
      - 'scripts/test-editorial-content-policy-v1.mjs'
      - 'scripts/seo-visibility-cycle-v1.mjs'
      - 'scripts/refresh-public-news-v4.mjs'
      - 'scripts/test-editorial-publish-seo-v1.mjs'
      - '.github/workflows/editorial-*.yml'
      - '.github/workflows/seo-news-cycle.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax checks
        run: |
          node --check scripts/editorial-publish-scheduled-v1.mjs
          node --check scripts/validate-editorial-content-policy-v1.mjs
          node --check scripts/test-editorial-content-policy-v1.mjs
          node --check scripts/seo-visibility-cycle-v1.mjs
          node --check scripts/refresh-public-news-v4.mjs
          node --check scripts/test-editorial-publish-seo-v1.mjs
      - name: Test editorial policy gate
        run: node scripts/test-editorial-content-policy-v1.mjs
      - name: Enforce editorial policy before materialization
        run: node scripts/validate-editorial-content-policy-v1.mjs
      - name: Materialize immediate package in CI workspace
        env:
          EDITORIAL_NOW: '2026-07-14T20:53:00+02:00'
        run: node scripts/editorial-publish-scheduled-v1.mjs
      - name: Editorial and SEO contract
        run: node scripts/test-editorial-publish-seo-v1.mjs
      - name: SEO audit
        run: node scripts/seo-visibility-cycle-v1.mjs
      - name: Prove publisher and SEO idempotency
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp -R apps scripts artifacts "$tmp/"
          cd "$tmp"
          EDITORIAL_NOW='2026-07-14T20:53:00+02:00' node scripts/editorial-publish-scheduled-v1.mjs
          find apps/portal/objave apps/portal/komentari apps/portal/data/editorial-plan artifacts -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/publisher-before.sha
          EDITORIAL_NOW='2026-07-14T20:53:00+02:00' node scripts/editorial-publish-scheduled-v1.mjs
          find apps/portal/objave apps/portal/komentari apps/portal/data/editorial-plan artifacts -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/publisher-after.sha
          diff -u /tmp/publisher-before.sha /tmp/publisher-after.sha
          node scripts/seo-visibility-cycle-v1.mjs
          find apps/portal/objave apps/portal/komentari apps/portal/analize apps/portal/en/publications apps/portal/en/commentary apps/portal/en/analyses apps/portal/data/seo-visibility-status.json apps/portal/editorial-sitemap.xml artifacts/seo-visibility-report.json -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/seo-before.sha
          node scripts/seo-visibility-cycle-v1.mjs
          find apps/portal/objave apps/portal/komentari apps/portal/analize apps/portal/en/publications apps/portal/en/commentary apps/portal/en/analyses apps/portal/data/seo-visibility-status.json apps/portal/editorial-sitemap.xml artifacts/seo-visibility-report.json -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/seo-after.sha
          diff -u /tmp/seo-before.sha /tmp/seo-after.sha
