name: Debug Masarykova Secret Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check secret is non-empty (length only, never the value)
        env:
          MASARYKOVA_MIRROR_TOKEN: ${{ secrets.MASARYKOVA_MIRROR_TOKEN }}
        run: |
          echo "Secret length: ${#MASARYKOVA_MIRROR_TOKEN}"
          if [ -z "$MASARYKOVA_MIRROR_TOKEN" ]; then
            echo "RESULT: secret is EMPTY or not set"
            exit 1
          fi
          echo "RESULT: secret is present, length ${#MASARYKOVA_MIRROR_TOKEN}"

      - name: Test authentication via GitHub API (no push, read-only)
        env:
          MASARYKOVA_MIRROR_TOKEN: ${{ secrets.MASARYKOVA_MIRROR_TOKEN }}
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/api_response.json -w "%{http_code}" -H "Authorization: token $MASARYKOVA_MIRROR_TOKEN" "https://api.github.com/user")
          echo "HTTP status: $HTTP_STATUS"
          echo "Response body:"
          cat /tmp/api_response.json
          echo ""
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "RESULT: authentication FAILED (status $HTTP_STATUS)"
            exit 1
          fi
          LOGIN=$(python3 -c "import json; print(json.load(open('/tmp/api_response.json')).get('login',''))")
          echo "RESULT: authenticated as GitHub user: $LOGIN"

      - name: Test git ls-remote against the target repo
        env:
          MASARYKOVA_MIRROR_TOKEN: ${{ secrets.MASARYKOVA_MIRROR_TOKEN }}
        run: |
          set +e
          OUTPUT=$(git ls-remote "https://x-access-token:${MASARYKOVA_MIRROR_TOKEN}@github.com/masarykovazagreb-pixel/gnk-asg-portal-archive-2026-07-01.git" 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          echo "Exit status: $STATUS"
          if [ $STATUS -ne 0 ]; then
            echo "RESULT: git ls-remote FAILED"
            exit 1
          fi
          echo "RESULT: git ls-remote SUCCEEDED"
