name: NN Constitutional Contract

on:
  pull_request:
    paths:
      - 'config/nn-constitutional-model-v1.json'
      - 'scripts/validate-nn-constitutional-model.mjs'
      - '.github/workflows/nn-constitutional-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate NN authority, memory and promotion invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate NN constitutional model
        run: node scripts/validate-nn-constitutional-model.mjs
