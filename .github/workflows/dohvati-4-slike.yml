name: Dohvati 2 slike v3 (jednokratno)
on: workflow_dispatch
jobs:
  dohvati:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p apps/portal/data/tmp-4s
          curl -s "https://gnk-asg.hr/api/slike?upit=investor+meeting+quarterly+report+presentation" -o apps/portal/data/tmp-4s/investitori.json
          curl -s "https://gnk-asg.hr/api/slike?upit=industrial+control+room+factory+technician" -o apps/portal/data/tmp-4s/ot.json
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          BRANCH="slike4-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-4s
          git commit -m "slike"
          git push origin "$BRANCH"
