name: One-Time Approved Deploy 14868bc

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-approved-deploy-14868bc.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: one-time-approved-deploy-14868bc
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exact approved production SHA
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: 14868bc98bd4c9af51a095329c5c226ea3613f36
        run: |
          set -euo pipefail
          test "$APPROVED_SHA" = "14868bc98bd4c9af51a095329c5c226ea3613f36"
          gh workflow run deploy-admin-auth-v6.yml \
            --repo beckuphome-gnk/gnk-asg-portal \
            --ref main \
            -f confirm_production_deploy=DEPLOY_ADMIN_AUTH_V6 \
            -f approved_sha="$APPROVED_SHA"
          echo "Dispatched one-time approved production deploy for $APPROVED_SHA"
