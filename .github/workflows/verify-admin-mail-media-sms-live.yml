name: Verify Admin Mail Media SMS live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-admin-mail-media-sms-live.yml'
      - '.github/admin-mail-media-sms-live.trigger'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-admin-mail-media-sms-live.yml'
      - '.github/admin-mail-media-sms-live.trigger'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: verify-admin-mail-media-sms-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check production routes and assets
        shell: bash
        run: |
          node <<'JS'
          const fs=require('node:fs');
          const base='https://gnk-asg.hr';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function get(path){
            try{
              const response=await fetch(`${base}${path}${path.includes('?')?'&':'?'}cb=${Date.now()}`,{redirect:'manual',headers:{'cache-control':'no-cache','accept':'text/html,application/json,*/*'}});
              return{status:response.status,text:await response.text(),headers:Object.fromEntries(response.headers)};
            }catch(error){return{status:0,text:'',headers:{},error:String(error)}}
          }
          async function attempt(number){
            const [admin,mail,media,adminHealth,mailTest,smsUi,smsCss,smsStatus,mailStatus,deliveryStatus,version,root]=await Promise.all([
              get('/admin-center/'),get('/mail-studio/'),get('/media-command-center/'),
              get('/assets/admin-center-health-v1.js'),get('/assets/mail-studio-profile-test-v1.js'),
              get('/assets/media-sms-ui-v1.js'),get('/assets/media-sms-ui-v1.css'),
              get('/api/media-command-center/sms-status'),get('/api/mail-center/status'),
              get('/api/media-command-center/delivery-status'),get('/data/portal-version.json'),get('/')
            ]);
            const failures=[];
            const privateOk=response=>[200,303,401,403].includes(response.status);
            if(!privateOk(admin))failures.push(`admin_http_${admin.status}`);
            if(admin.status===200&&!admin.text.includes('Svi ključni alati bez duplih izbornika'))failures.push('admin_single_dashboard_marker_missing');
            if(!privateOk(mail))failures.push(`mail_http_${mail.status}`);
            if(!privateOk(media))failures.push(`media_http_${media.status}`);
            for(const [name,response,marker] of [
              ['adminHealth',adminHealth,'GNK_ASG_ADMIN_HEALTH_V1'],
              ['mailTest',mailTest,'GNK_ASG_MAIL_PROFILE_TEST_V1'],
              ['smsUi',smsUi,'GNK_ASG_MEDIA_SMS_UI_V1']
            ]){
              if(response.status!==200)failures.push(`${name}_http_${response.status}`);
              else if(!response.text.includes(marker))failures.push(`${name}_marker_missing`);
            }
            if(smsCss.status!==200)failures.push(`smsCss_http_${smsCss.status}`);
            for(const [name,response] of [['smsStatus',smsStatus],['mailStatus',mailStatus],['deliveryStatus',deliveryStatus]]){
              if(![200,401,403].includes(response.status))failures.push(`${name}_http_${response.status}`);
            }
            if(version.status!==200)failures.push(`version_http_${version.status}`);
            else{
              if(!version.text.includes('mediaSms'))failures.push('version_mediaSms_missing');
              if(!version.text.includes('mailProfileTest'))failures.push('version_mailProfileTest_missing');
            }
            if(root.status!==200)failures.push(`root_http_${root.status}`);
            if(!root.text.includes('public-menu-v13.js?v=20260626-stable-v28'))failures.push('root_v28_menu_missing');
            const result={checkedAt:new Date().toISOString(),attempt:number,failures,codes:{admin:admin.status,mail:mail.status,media:media.status,adminHealth:adminHealth.status,mailTest:mailTest.status,smsUi:smsUi.status,smsCss:smsCss.status,smsStatus:smsStatus.status,mailStatus:mailStatus.status,deliveryStatus:deliveryStatus.status,version:version.status,root:root.status}};
            fs.writeFileSync('/tmp/admin-mail-media-sms-live.json',JSON.stringify(result,null,2));
            console.log(JSON.stringify(result));
            return failures.length===0;
          }
          (async()=>{
            for(let i=1;i<=24;i++){
              if(await attempt(i))return;
              await sleep(10000);
            }
            process.exit(1);
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          {
            echo "## Admin Mail Media SMS live — ${RESULT}"
            echo
            echo "Run: ${RUN_URL}"
            echo
            echo '```json'
            cat /tmp/admin-mail-media-sms-live.json 2>/dev/null || echo '{"error":"verification_not_reached"}'
            echo '```'
          } > /tmp/admin-mail-media-sms-report.md
          gh issue comment 131 --repo "$GITHUB_REPOSITORY" --body-file /tmp/admin-mail-media-sms-report.md
