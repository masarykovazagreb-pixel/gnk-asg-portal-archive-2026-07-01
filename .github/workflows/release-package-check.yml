name: GNK ASG Release Package Check

on:
  pull_request:
    branches:
      - visual-redesign
    paths:
      - 'scripts/build-release-package.mjs'
      - 'scripts/release-candidate-audit.mjs'
      - 'scripts/backup-restore-rehearsal.mjs'
      - 'scripts/hr-en-public-route-audit.mjs'
      - 'config/project-completion-backlog.json'
      - 'config/phase1-critical-checks.json'
      - 'contracts/**'
      - 'apps/portal/data/**'
      - 'workers/gnk-asg-direct-operator/wrangler.toml'
      - 'workers/gnk-asg-mail-agent-worker/wrangler.release.toml'
      - 'workers/gnk-asg-mail-agent-worker/src/rollback-manifest.js'
      - 'workers/gnk-asg-public-pages-live/wrangler.live.toml'
      - '.github/workflows/production-live-sync.yml'
      - '.github/workflows/release-package-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate release, restore and route audit generators
        run: |
          node --check scripts/build-release-package.mjs
          node --check scripts/backup-restore-rehearsal.mjs
          node --check scripts/hr-en-public-route-audit.mjs

      - name: Run HR EN public route audit
        id: hr_en_route_audit
        continue-on-error: true
        run: node scripts/hr-en-public-route-audit.mjs

      - name: Upload HR EN route audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnk-asg-hr-en-route-audit-${{ github.run_id }}
          path: reports/hr-en-public-route-audit/
          if-no-files-found: error
          retention-days: 14

      - name: Validate HR EN public route evidence
        run: |
          set -euo pipefail
          test "${{ steps.hr_en_route_audit.outcome }}" = "success"
          node -e "const p=require('./reports/hr-en-public-route-audit/route-audit.json'); if(p.status!=='PASS'||p.failed!==0||p.productionTouched!==false||p.productionDeployPerformed!==false||!p.publicRouteCount) process.exit(1)"
          test -s reports/hr-en-public-route-audit/route-audit.md

      - name: Run backup and restore rehearsal
        run: node scripts/backup-restore-rehearsal.mjs

      - name: Validate restore proof
        run: |
          set -euo pipefail
          node -e "const p=require('./reports/backup-restore-rehearsal/backup-manifest.json'); if(p.repositoryManagedState!=='PASS'||p.productionTouched!==false||p.managedFileCount!==p.restoredFileCount||p.failedFileCount!==0) process.exit(1)"
          test -s reports/backup-restore-rehearsal/restore-proof.md

      - name: Build release package
        run: node scripts/build-release-package.mjs

      - name: Validate generated manifest
        run: |
          set -euo pipefail
          node -e "const p=require('./reports/release-package/release-manifest.json'); if(p.releaseStatus!=='READY_FOR_MANUAL_APPROVAL'||p.productionWrites!==false||p.fullProductionReleaseExecuted!==false||p.limitedEmergencyHotfixesExecuted!==true||!p.components?.length||!p.publicRoutes?.length||!p.protectedRoutes?.length||p.sourceCommit!==process.env.RELEASE_SOURCE_COMMIT||p.sourceCommitInput!=='RELEASE_SOURCE_COMMIT') process.exit(1)"
          test -s reports/release-package/release-summary.md
          test -s reports/release-package/rollback-plan.md

      - name: Publish release, route and restore summaries
        run: |
          cat reports/hr-en-public-route-audit/route-audit.md >> "$GITHUB_STEP_SUMMARY"
          cat reports/backup-restore-rehearsal/restore-proof.md >> "$GITHUB_STEP_SUMMARY"
          cat reports/release-package/release-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: gnk-asg-release-package-${{ github.run_id }}
          path: |
            reports/release-package/
            reports/hr-en-public-route-audit/route-audit.json
            reports/hr-en-public-route-audit/route-audit.md
            reports/backup-restore-rehearsal/backup-manifest.json
            reports/backup-restore-rehearsal/restore-proof.md
          if-no-files-found: error
          retention-days: 14
