name: Diagnose direct inbound autoreply patch
on:
  push:
    paths:
      - '.github/workflows/diag-direct-inbound-patch-20260722.yml'
permissions:
  contents: read
  issues: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute exact embedded patch and compact checks
        id: diagnose
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python3 - <<'PY'
          import base64,re
          from pathlib import Path
          text=Path('.github/workflows/fix-deploy-mail-autoreply-mime-20260722.yml').read_text()
          patterns={
            '/tmp/patch-direct-inbound.py':r"echo '([A-Za-z0-9+/=]+)' \| base64 -d > /tmp/patch-direct-inbound\.py",
            'workers/gnk-asg-mail-center-worker/wrangler.toml':r"echo '([A-Za-z0-9+/=]+)' \| base64 -d > workers/gnk-asg-mail-center-worker/wrangler\.toml"
          }
          for target,pattern in patterns.items():
              match=re.search(pattern,text)
              if not match: raise SystemExit(f'embedded payload not found: {target}')
              path=Path(target);path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(base64.b64decode(match.group(1)))
              print('extracted',target,path.stat().st_size)
          PY
            python3 /tmp/patch-direct-inbound.py
            node --check workers/gnk-asg-mail-center-worker/src/index.js
            node --check workers/gnk-asg-direct-operator/src/outbound-mail-transport-v1.js
            node --check workers/gnk-asg-direct-operator/src/email-status-tracking-v1.js
            python3 - <<'PY'
          from pathlib import Path
          mail=Path('workers/gnk-asg-mail-center-worker/src/index.js').read_text()
          transport=Path('workers/gnk-asg-direct-operator/src/outbound-mail-transport-v1.js').read_text()
          status=Path('workers/gnk-asg-direct-operator/src/email-status-tracking-v1.js').read_text()
          config=Path('workers/gnk-asg-mail-center-worker/wrangler.toml').read_text()
          checks={
            'wrapper_order': "withEmailStatusTracking(withBrandedMimeTransport(env), 'direct-inbound-auto-reply')" in mail,
            'ai_runtime_env': 'target = prepareAiAutoReply(message, runtimeEnv)' in mail,
            'mime_transport': 'return sendBrandedEmail(env, payload)' in mail,
            'reference_header': "'X-GNK-ASG-Reference': id" in mail,
            'message_id_reserved': 'const messageId=`<${crypto.randomUUID()}@gnk-asg.hr>`' in transport,
            'message_id_header': '`Message-ID: ${messageId}`' in transport,
            'message_id_returned': 'messageId:prepared.messageId' in transport,
            'normalized_provider_match_twice': status.count("REPLACE(REPLACE(provider_message_id,'<',''),'>','')") >= 2,
            'd1_binding': 'binding = "GNK_ASG_D1"' in config,
            'open_tracking': 'EMAIL_OPEN_TRACKING_ENABLED = "true"' in config,
            'receipt_tracking': 'EMAIL_RECEIPT_CONFIRMATION_ENABLED = "true"' in config
          }
          for name,value in checks.items(): print(f'{name}={str(value).lower()}')
          failed=[name for name,value in checks.items() if not value]
          if failed: raise SystemExit('failed_contracts=' + ','.join(failed))
          print('all_contracts=true')
          PY
          } 2>&1 | tee /tmp/diag.log
      - name: Publish compact diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '## Compact direct inbound patch diagnostic'
            echo
            echo "Outcome: ${{ steps.diagnose.outcome }}"
            echo
            echo '```'
            tail -n 80 /tmp/diag.log 2>/dev/null || true
            echo '```'
          } > /tmp/report.md
          gh issue edit 712 --repo "${{ github.repository }}" --body-file /tmp/report.md
      - name: Fail after publishing diagnostic
        if: steps.diagnose.outcome != 'success'
        run: exit 1
