name: Direct Static Editorial Policy V1

on:
  pull_request:
    paths:
      - 'apps/portal/objave/**/index.html'
      - 'apps/portal/publications/**/index.html'
      - 'apps/portal/komentari/**/index.html'
      - 'apps/portal/comments/**/index.html'
      - 'apps/portal/analize/**/index.html'
      - 'apps/portal/analysis/**/index.html'
      - 'apps/portal/autorske-objave/hrvatski-softver-izvoz-nevidljivi-lider.html'
      - 'scripts/validate-direct-static-editorial-v1.mjs'
      - 'scripts/test-direct-static-editorial-v1.mjs'
      - 'scripts/test-canonical-editorial-aliases-v1.mjs'
      - '.github/workflows/direct-static-editorial-policy-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: direct-static-editorial-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run policy regression tests
        run: node scripts/test-direct-static-editorial-v1.mjs

      - name: Verify canonical mirror metadata and registry exclusion
        run: node scripts/test-canonical-editorial-aliases-v1.mjs

      - name: Validate changed direct static editorial pages
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIRECT_EDITORIAL_MIN_WORDS: '3000'
          DIRECT_EDITORIAL_MIN_WORDS_COMMENTARY: '300'
          DIRECT_EDITORIAL_MIN_WORDS_PUBLICATION: '500'
          DIRECT_EDITORIAL_MIN_WORDS_ANALYSIS: '1500'
          DIRECT_EDITORIAL_MIN_INTERNAL_LINKS: '5'
        run: |
          if [ -z "$GITHUB_BASE_SHA" ] || [ "$GITHUB_BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            GITHUB_BASE_SHA="$(git rev-parse HEAD^)"
            export GITHUB_BASE_SHA
          fi
          set +e
          node scripts/validate-direct-static-editorial-v1.mjs > /tmp/direct-static-editorial-policy.json 2>&1
          result=$?
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path
          content=Path('/tmp/direct-static-editorial-policy.json').read_text(encoding='utf-8',errors='replace')
          try:
              data=json.loads(content.replace('\nDIRECT_STATIC_EDITORIAL_POLICY_OK\n','\n'))
          except Exception as exc:
              print('Policy diagnostics could not be parsed:',exc)
              print(content[-5000:])
              raise SystemExit(1)
          print(json.dumps({
              'ok':data.get('ok'),
              'candidateCount':data.get('candidateCount'),
              'checkedCount':data.get('checkedCount'),
              'skippedCount':data.get('skippedCount'),
              'errors':data.get('errors',[]),
          },ensure_ascii=False,indent=2))
          PY
          exit "$result"
