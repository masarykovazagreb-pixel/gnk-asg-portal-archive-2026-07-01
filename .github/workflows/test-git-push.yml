name: Test git push (dijagnostika)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Node verzija
        run: node --version
      - name: Napravi test datoteku
        run: |
          mkdir -p apps/portal/data/tmp-test
          echo "test $(date)" > apps/portal/data/tmp-test/probaj.txt
      - name: Commit na jedinstvenu granu
        run: |
          git config user.name "gnk-asg-bot"
          git config user.email "it@gnk-asg.hr"
          BRANCH="test-grana-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-test
          git status
          git commit -m "Test"
          git push origin "$BRANCH"
