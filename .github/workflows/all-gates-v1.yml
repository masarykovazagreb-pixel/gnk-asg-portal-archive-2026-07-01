name: All gates (portal)
# PR394: verify regenerated branch output after bot-generated commit.

# Jedan obavezni prag za svaki PR: iste provjere koje dnevni self-heal
# pokreće lokalno. Cilj je da "zeleno" znači isto svugdje — u PR-u, na
# mainu i na dnevnoj provjeri — bez sjećanja koji se skript još treba
# pokrenuti. Workflow je samo za čitanje: ne piše u repozitorij.

on:
  pull_request:
    paths:
      - 'apps/portal/**'
      - 'apps/region/**'
      - 'apps/kanal/**'
      - 'apps/tjednik/**'
      - 'apps/sites/**'
      - 'apps/satellites/**'
      - 'apps/world/**'
      - 'apps/arhiva/**'
      - 'apps/dnevnik/**'
      - 'tests/**'
      - 'scripts/**'
      - 'ops/**'
      - '.github/workflows/**'
  workflow_dispatch:
  push:
    branches:
      - 'arena/0ba72079-gnk-asg-portal-archive-2026-07'
    paths:
      - '.github/workflows/all-gates-v1.yml'
      # Bot-generated commits update these outputs; validate their actual SHA
      # instead of accepting a cancelled pre-regeneration PR run.
      - 'apps/portal/data/public_service_status.json'
      - 'apps/kanal/site/**'
      - 'apps/tjednik/**'
      - 'apps/sites/site/**'

permissions:
  contents: read

concurrency:
  group: all-gates-${{ github.event.pull_request.number || github.ref }}
  # Keep the current gate run alive while regeneration or PR metadata changes.
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dohvati granu
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python 3 (za allowlist gate)
        run: python3 --version

      - name: Sastavi samostalne portale za gate (arhiva, dnevnik)
        run: |
          set -euo pipefail
          node apps/kanal/build.mjs
          node apps/tjednik/build.mjs
          node apps/arhiva/engine/build.mjs
          node apps/dnevnik/engine/build.mjs

      - name: Alati za slike (ImageMagick + WebP delegat, za test slika izdanja)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick webp
          convert -version | head -1
          convert -list format | grep -i webp

      - name: Pillow (za provjeru kvalitete fotografija, tvornica faza 5)
        run: python3 -m pip install --disable-pip-version-check --quiet -r requirements-factory.txt

      - name: Sve provjere
        run: node scripts/test-all-v1.mjs

  repair_pr394:
    name: Regenerate PR394 outputs (branch-only)
    if: ((github.event_name == 'pull_request' && github.event.pull_request.number == 394 && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/arena/0ba72079-gnk-asg-portal-archive-2026-07')) && vars.GNK_ASG_RELEASE_FENCE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: gnk-asg-main-mutation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate and standardize generated pages
        run: |
          set -euo pipefail
          node apps/sites/build.mjs
          node scripts/build-prenos-hub-v1.mjs
          node scripts/apply-refresh-v1.mjs
          python3 scripts/factory/apply_standard.py
      - name: Stage generated outputs without archival news
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for dir in apps/sites/site apps/portal/prenos apps/portal/en/prenos apps/portal/assets apps/kanal/site; do
            if test -d "$dir"; then git add -A -- "$dir"; fi
          done
          git add -u -- apps/portal/
          # Preserve archival article bodies; stage only refresh-tag updates from the idempotent updater.
          # The refresh script replaces one script tag and leaves the article HTML otherwise intact.
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git fetch origin "${{ github.head_ref || github.ref_name }}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          git commit -m 'build(network): regenerate PR394 output and metadata'
          git push origin "HEAD:refs/heads/${{ github.head_ref || github.ref_name }}"
