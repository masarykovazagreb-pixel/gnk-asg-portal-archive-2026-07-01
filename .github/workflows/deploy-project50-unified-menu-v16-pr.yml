name: Execute Project 50 Unified Menu V16

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/deploy-project50-unified-menu-v16.trigger'

permissions:
  contents: write

jobs:
  deploy-v16:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: project-50-white-integrated-menu
          fetch-depth: 1
      - id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate source branch
        shell: bash
        run: |
          set -euxo pipefail
          node --check apps/portal/assets/public-shell-v15.js
          node --check apps/portal/assets/public-menu-v10.js
          node --check apps/portal/assets/index-menu-unified-v16.js
          node --check apps/portal/assets/admin-center-extensions-v2.js
          node --check workers/gnk-asg-direct-operator/src/index-project50-v30-unified-menu.js
          node --test workers/gnk-asg-direct-operator/tests/public-menu-parity.test.mjs
          grep -q 'main = "src/index-project50-v30-unified-menu.js"' workers/gnk-asg-direct-operator/wrangler.toml
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator
      - name: Deploy to Cloudflare
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator
      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const base='https://gnk-asg.hr';
          const paths=['/','/en/','/vijesti/','/publications/','/admin-center/','/assets/public-shell-v15.js','/assets/public-menu-v10.css','/assets/admin-center-extensions-v2.js','/data/portal-version.json'];
          for(let attempt=1;attempt<=12;attempt++){
            const data={};
            for(const path of paths){const response=await fetch(`${base}${path}?cb=${Date.now()}-${attempt}`,{headers:{'cache-control':'no-cache','pragma':'no-cache'}});data[path]={status:response.status,text:await response.text(),headers:Object.fromEntries(response.headers)};}
            const failures=[];
            const admin=data['/admin-center/'];
            const protectedAdmin=admin.status===401&&(admin.headers['x-gnk-asg-auth-page-isolation']==='ENABLED'||admin.text.includes('data-gnk-auth-login="1"'));
            if(data['/'].status!==200||!data['/'].text.includes('/admin-center/')||!data['/'].text.includes('index-menu-unified-v16.js'))failures.push('hr');
            if(data['/en/'].status!==200||!data['/en/'].text.includes('/en/contact/')||!data['/en/'].text.includes('/admin-center/'))failures.push('en');
            if(!data['/vijesti/'].text.includes('public-shell-v15.js?v=20260628-v16'))failures.push('news');
            if(!data['/publications/'].text.includes('public-shell-v15.js?v=20260628-v16'))failures.push('publications');
            if(!protectedAdmin)failures.push('admin-auth');
            if(!data['/assets/public-shell-v15.js'].text.includes('GNK_ASG_PUBLIC_SHELL_V16_UNIFIED_NAVIGATION_20260628'))failures.push('shell');
            if(!data['/assets/public-menu-v10.css'].text.includes('unified public navigation V16'))failures.push('css');
            if(data['/assets/admin-center-extensions-v2.js'].status!==200||!data['/assets/admin-center-extensions-v2.js'].text.includes('GNK_ASG_ADMIN_CENTER_EXTENSIONS_V2_20260628'))failures.push('admin-asset');
            if(!data['/data/portal-version.json'].text.includes('GNK_ASG_PROJECT50_V30_UNIFIED_PUBLIC_ADMIN_MENUS_20260628'))failures.push('status');
            console.log(JSON.stringify({attempt,failures,release:data['/'].headers['x-gnk-asg-menu-release']||'',adminStatus:admin.status,adminIsolation:admin.headers['x-gnk-asg-auth-page-isolation']||''}));
            if(!failures.length)process.exit(0);
            await sleep(10000);
          }
          process.exit(1);
          JS
      - name: Record success on project branch
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        with:
          script: |
            const path='docs/deployments/unified-menu-v16-live.json';
            const branch='project-50-white-integrated-menu';
            let sha;
            try { const current=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:branch}); if(!Array.isArray(current.data))sha=current.data.sha; }
            catch(error){ if(error.status!==404)throw error; }
            const payload={ok:true,release:'GNK_ASG_PROJECT50_V30_UNIFIED_PUBLIC_ADMIN_MENUS_20260628',workflowRunId:context.runId,sourceCommit:process.env.SOURCE_SHA,branch,deployedAt:new Date().toISOString(),validation:'5 menu and route tests, Wrangler dry-run, Cloudflare deploy and production GET verification',adminVerification:'401 protected login plus live Admin extension asset',mailSent:false,mediaInvitationsSent:false};
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch,sha,message:'Record successful V16 menu deployment [skip ci]',content:Buffer.from(JSON.stringify(payload,null,2)+'\n').toString('base64')});
