name: One-Time Public Content Repair V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-public-content-repair-v1.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: one-time-public-content-repair-v1
  cancel-in-progress: false

jobs:
  repair-and-deploy:
    if: vars.GNK_ASG_RELEASE_FENCE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Add latest editorial index runtime
        shell: bash
        run: |
          set -euo pipefail
          cat > apps/portal/assets/editorial-latest-index-v1.js <<'JS'
          (()=>{
          'use strict';
          const VERSION='GNK_EDITORIAL_LATEST_INDEX_V1_20260715';
          if(window.__GNK_EDITORIAL_LATEST_INDEX_V1__)return;
          window.__GNK_EDITORIAL_LATEST_INDEX_V1__=true;
          const route=location.pathname.replace(/\/+$/,'')||'/';
          const type=route==='/objave'?'objava':route==='/komentari'?'komentar':'';
          if(!type)return;
          const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          const read=async url=>{const r=await fetch(`${url}?v=${Date.now()}`,{cache:'no-store',headers:{accept:'application/json'}});if(!r.ok)throw new Error(`${url}:${r.status}`);return r.json()};
          const date=value=>{try{return new Intl.DateTimeFormat('hr-HR',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(value))}catch{return''}};
          async function run(){
            const main=document.querySelector('main')||document.body;
            if(!main||document.getElementById('gnk-latest-editorial'))return;
            const manifest=await read('/data/editorial-plan/manifest.json');
            const packages=(manifest.packages||[]).filter(p=>p.status==='published').sort((a,b)=>Date.parse(b.publishedAt||b.publishAt||0)-Date.parse(a.publishedAt||a.publishAt||0));
            const rows=[];
            for(const pkg of packages){
              for(const file of (pkg.files||[])){
                const items=await read(`/data/editorial-plan/${file}`);
                for(const item of (Array.isArray(items)?items:[]))if(item.type===type)rows.push({...item,publishedAt:pkg.publishedAt||pkg.publishAt});
              }
            }
            const seen=new Set();
            const items=rows.filter(item=>{if(!item.slug||seen.has(item.slug))return false;seen.add(item.slug);return true}).slice(0,24);
            if(!items.length)return;
            const section=document.createElement('section');
            section.id='gnk-latest-editorial';
            section.setAttribute('data-version',VERSION);
            section.style.cssText='margin:24px auto 34px;padding:22px;border:1px solid rgba(184,138,47,.35);border-radius:18px;background:#fff;max-width:1180px';
            section.innerHTML=`<p style="margin:0 0 7px;font-weight:800;color:#8c641f;letter-spacing:.08em;text-transform:uppercase">Najnovije</p><h2 style="margin:0 0 18px;color:#071a38">${type==='objava'?'Najnovije objave':'Najnoviji komentari'}</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px">${items.map(item=>`<a href="/${type==='objava'?'objave':'komentari'}/${encodeURIComponent(item.slug)}/" style="display:block;padding:16px;border:1px solid #e5e7eb;border-radius:14px;color:#111827;text-decoration:none;background:#fff"><small style="font-weight:800;color:#8c641f">${esc(item.section||type)} · ${esc(date(item.publishedAt))}</small><h3 style="margin:8px 0;font-size:18px;line-height:1.3">${esc(item.title)}</h3><p style="margin:0;color:#526071;line-height:1.55">${esc(item.summary||item.description||'')}</p></a>`).join('')}</div>`;
            const anchor=main.querySelector('h1')?.closest('section,header,div');
            if(anchor&&anchor.parentNode)anchor.insertAdjacentElement('afterend',section);else main.prepend(section);
          }
          run().catch(error=>{document.documentElement.dataset.gnkEditorialLatestError=String(error?.message||error).slice(0,120)});
          })();
          JS
          node --check apps/portal/assets/editorial-latest-index-v1.js

      - name: Inject latest editorial runtime into collection pages
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('fs');
          for(const path of ['apps/portal/objave/index.html','apps/portal/komentari/index.html']){
            let html=fs.readFileSync(path,'utf8');
            html=html.replace(/<script[^>]+editorial-latest-index-v1\.js[^>]*><\/script>/gi,'');
            const tag='<script defer src="/assets/editorial-latest-index-v1.js?v=20260715-v1"></script>';
            html=html.includes('</body>')?html.replace('</body>',`${tag}</body>`):`${html}${tag}`;
            fs.writeFileSync(path,html);
          }
          JS
          grep -Fq 'editorial-latest-index-v1.js?v=20260715-v1' apps/portal/objave/index.html
          grep -Fq 'editorial-latest-index-v1.js?v=20260715-v1' apps/portal/komentari/index.html

      - name: Serve home assets before legacy redirect handlers
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('fs');
          const path='workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js';
          let source=fs.readFileSync(path,'utf8');
          if(!source.includes('async function serveHomeAsset')){
            source=source.replace("export const VERSION=`GNK_ASG_UNIFIED_AUTH_V34_PUBLIC_EDITORIAL_ASSETS_${EDITORIAL_ASSET_VERSION}_${BASE_VERSION}`;", "export const VERSION=`GNK_ASG_UNIFIED_AUTH_V35_HOME_AND_EDITORIAL_INDEX_${EDITORIAL_ASSET_VERSION}_${BASE_VERSION}`;\nconst pathOf=request=>new URL(request.url).pathname.replace(/\\/+$/,'')||'/';\nasync function serveHomeAsset(request,env){if(!['GET','HEAD'].includes(request.method)||!env.ASSETS?.fetch)return null;const path=pathOf(request);const targetPath=path==='/'?'/index.html':path==='/en'?'/en/index.html':'';if(!targetPath)return null;try{const response=await env.ASSETS.fetch(new Request(new URL(targetPath,'https://assets.local'),{method:request.method,headers:request.headers,redirect:'follow'}));if(response.status!==200)return null;const headers=new Headers(response.headers);for(const name of ['content-length','content-encoding','location','etag','last-modified'])headers.delete(name);headers.set('content-type','text/html; charset=utf-8');headers.set('cache-control','no-store, max-age=0');headers.set('x-gnk-home-direct-asset',targetPath);headers.set('x-gnk-route-owner',VERSION);return new Response(request.method==='HEAD'?null:response.body,{status:200,headers})}catch{return null}}" );
            source=source.replace("  async fetch(request,env,ctx){\n   const editorial=await servePublicEditorialAsset(request,env,VERSION);", "  async fetch(request,env,ctx){\n   const home=await serveHomeAsset(request,env);\n   if(home)return home;\n   const editorial=await servePublicEditorialAsset(request,env,VERSION);");
          }
          fs.writeFileSync(path,source);
          JS
          node --check workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          grep -Fq 'GNK_ASG_UNIFIED_AUTH_V35_HOME_AND_EDITORIAL_INDEX' workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          grep -Fq 'x-gnk-home-direct-asset' workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js

      - name: Validate public content package
        run: |
          set -euo pipefail
          node --check apps/portal/assets/index-editorial-order-v1.js
          node --check apps/portal/assets/editorial-latest-index-v1.js
          test -f apps/portal/data/editorial-plan/20260714-publications-a.json
          test -f apps/portal/data/editorial-plan/20260714-commentaries.json
          test -f apps/portal/data/editorial-plan/20260715-publications-a.json
          test -f apps/portal/data/editorial-plan/20260715-commentaries.json
          grep -Fq '"status": "published"' apps/portal/data/editorial-plan/manifest.json

      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/portal/assets/editorial-latest-index-v1.js apps/portal/objave/index.html apps/portal/komentari/index.html workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          git commit -m 'fix(public): restore home and surface latest editorial content'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            echo "Push odbijen (pokusaj $attempt) - main se pomaknuo, radim fetch+rebase."
            git fetch origin main
            git rebase origin/main || { echo "Rebase konflikt."; exit 1; }
            sleep $((attempt * 5))
            if [ "$attempt" = "5" ]; then echo "Push nije uspio nakon 5 pokusaja."; exit 1; fi
          done

      - name: Dispatch exact-SHA production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          approved_sha=$(git rev-parse HEAD)
          gh workflow run deploy-admin-auth-v6.yml --repo "$GITHUB_REPOSITORY" --ref main -f confirm_production_deploy=DEPLOY_ADMIN_AUTH_V6 -f approved_sha="$approved_sha"
          printf '{"ok":true,"approvedSha":"%s","scope":"home-news-editorial-index-contact-readiness"}\n' "$approved_sha" > public-content-repair-dispatch.json

      - uses: actions/upload-artifact@v4
        with:
          name: public-content-repair-dispatch
          path: public-content-repair-dispatch.json
          retention-days: 2
