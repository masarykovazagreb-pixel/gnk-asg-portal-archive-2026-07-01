name: Publish first validated QA V3 article

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-first-validated-qa-v3.yml'
      - '.github/publish-first-validated-qa-v3.trigger'

permissions:
  contents: read
  issues: write

concurrency:
  group: gnk-asg-first-validated-publication
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate trusted QA V3 bootstrap package
        run: |
          set -euxo pipefail
          node --check workers/gnk-asg-direct-operator/src/article-editorial-qa-v1.js
          node --check workers/gnk-asg-direct-operator/src/article-editorial-repair-v1.js
          node --check workers/gnk-asg-direct-operator/src/article-visual-v2.js
          node --check workers/gnk-asg-direct-operator/src/index-first-publication-bootstrap-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-public-r2-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-publication-seo-v3.js
          node --check apps/portal/assets/visual-index-central-v8.js
          grep -q 'GNK_ASG_ARTICLE_EDITORIAL_QA_V3_BUSINESS_BILINGUAL_20260626' workers/gnk-asg-direct-operator/src/article-editorial-qa-v1.js
          grep -q 'GNK_ASG_FIRST_PUBLICATION_BOOTSTRAP_V1_20260626' workers/gnk-asg-direct-operator/src/index-first-publication-bootstrap-v1.js
          grep -q 'GNK_ASG_ARTICLE_VISUAL_V3_R2_CANONICAL_20260626' workers/gnk-asg-direct-operator/src/article-visual-v2.js
          grep -q 'GNK_ASG_PUBLICATION_SEO_V4_R2_VISUALS_20260626' workers/gnk-asg-direct-operator/src/index-publication-seo-v3.js
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator

      - name: Deploy trusted bootstrap package
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator

      - name: Wait for first validated cron publication
        id: publication
        run: |
          set -euo pipefail
          node <<'JS'
          const fs=require('node:fs');
          const base='https://gnk-asg.hr';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function get(path){const response=await fetch(`${base}${path}${path.includes('?')?'&':'?'}cb=${Date.now()}`,{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(60000)});return{status:response.status,text:await response.text()}}
          let last={};
          for(let attempt=1;attempt<=40;attempt++){
            const response=await get('/data/first-publication-status.json');
            let payload={};try{payload=JSON.parse(response.text)}catch{}
            last={attempt,http:response.status,...payload};
            fs.writeFileSync('/tmp/first-publication-status.json',JSON.stringify(last,null,2));
            console.log(JSON.stringify({attempt,http:response.status,completed:payload.completed,lastOk:payload.last?.ok,lastError:payload.last?.error}));
            if(response.status===200&&payload.completed?.ok&&payload.completed?.articleId&&payload.completed?.slug){
              fs.appendFileSync(process.env.GITHUB_OUTPUT,`article_id=${payload.completed.articleId}\nslug=${payload.completed.slug}\n`);
              process.exit(0);
            }
            await sleep(30000);
          }
          throw new Error(JSON.stringify(last));
          JS

      - name: Verify public HR EN article, R2 variants and Visual Index V8
        env:
          ARTICLE_ID: ${{ steps.publication.outputs.article_id }}
          SLUG: ${{ steps.publication.outputs.slug }}
        run: |
          set -euo pipefail
          node <<'JS'
          const fs=require('node:fs');
          const base='https://gnk-asg.hr',id=process.env.ARTICLE_ID,slug=process.env.SLUG;
          const oldSlug='dan-uoci-odlucujuce-utakmice-otpao-jedan-hrvatski-reprezentativac';
          async function get(path){const response=await fetch(`${base}${path}${path.includes('?')?'&':'?'}cb=${Date.now()}`,{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(60000)});return{status:response.status,text:await response.text(),headers:Object.fromEntries(response.headers)}}
          const publications=await get('/data/publications.json');
          let data={};try{data=JSON.parse(publications.text)}catch{}
          const items=data.items||[],article=items.find(item=>item.id===id||item.slug===slug);
          if(!article)throw new Error('validated_article_missing_from_publications');
          const assets=[article.imageGenerated?.cover?.url,article.imageGenerated?.social?.url,article.imageGenerated?.portrait?.url].filter(Boolean);
          const [hrList,enList,hr,en,gallery,visual,...assetResponses]=await Promise.all([get('/objave/'),get('/publications/'),get(`/objave/${slug}/`),get(`/publications/${slug}/`),get('/data/visual_gallery.json'),get('/visual-index/?lang=en'),...assets.map(asset=>get(asset))]);
          let galleryData={};try{galleryData=JSON.parse(gallery.text)}catch{}
          const failures=[];
          if(data.version!=='GNK_ASG_PUBLICATION_SEO_V4_R2_VISUALS_20260626')failures.push(`publication_version=${data.version||'missing'}`);
          if(article.editorialQa?.version!=='GNK_ASG_ARTICLE_EDITORIAL_QA_V3_BUSINESS_BILINGUAL_20260626'||article.editorialQa?.ok!==true)failures.push('qa_v3_missing');
          if(article.titleHr===article.titleEn)failures.push('title_translation_missing');
          if(Number(article.wordCountHr||0)<500||Number(article.wordCountEn||0)<500)failures.push('word_count_invalid');
          if(items.some(item=>item.slug===oldSlug))failures.push('old_non_business_article_still_public');
          for(const [name,response] of Object.entries({hrList,enList,hr,en,gallery,visual}))if(response.status!==200)failures.push(`${name}=${response.status}`);
          if(!hrList.text.includes(`/objave/${slug}/`))failures.push('hr_list_missing');
          if(!enList.text.includes(`/publications/${slug}/`))failures.push('en_list_missing');
          for(const [name,response] of Object.entries({hr,en}))for(const marker of ['application/ld+json','twitter:card','og:image','hreflang','Visual Index'])if(!response.text.includes(marker))failures.push(`${name}_${marker}`);
          assetResponses.forEach((response,index)=>{if(response.status!==200)failures.push(`asset_${index}=${response.status}`)});
          const galleryItems=galleryData.items||[];
          if(!galleryItems.some(item=>String(item.article_id||item.articleId||item.id).includes(id)))failures.push('visual_gallery_missing_article');
          if(!visual.text.includes('visual-index-full-gallery.js'))failures.push('visual_index_loader_missing');
          const report={checkedAt:new Date().toISOString(),failures,article:{id,slug,titleHr:article.titleHr,titleEn:article.titleEn,category:article.category,wordCountHr:article.wordCountHr,wordCountEn:article.wordCountEn,canonical:article.canonical,cover:assets[0],social:assets[1],portrait:assets[2]},publicationsCount:items.length,galleryCount:galleryItems.length,codes:{publications:publications.status,hrList:hrList.status,enList:enList.status,hr:hr.status,en:en.status,gallery:gallery.status,visual:visual.status,assets:assetResponses.map(response=>response.status)}};
          fs.writeFileSync('/tmp/publication-verification.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if(failures.length)process.exit(1);
          JS

      - name: Report Phase 2 result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
        run: |
          status=$(cat /tmp/first-publication-status.json 2>/dev/null || printf '{"error":"status_not_reached"}')
          verification=$(cat /tmp/publication-verification.json 2>/dev/null || printf '{"error":"verification_not_reached"}')
          body=$(printf 'Trusted first QA V3 publication **%s** · commit `%s` · %s\n\n### Verification\n```json\n%s\n```\n\n### Bootstrap status\n```json\n%s\n```' "$JOB_STATUS" "$RUN_SHA" "$RUN_URL" "$verification" "$status")
          gh issue comment 125 --body "$body"
