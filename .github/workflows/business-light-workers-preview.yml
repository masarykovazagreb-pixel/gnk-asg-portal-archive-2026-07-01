name: GNK ASG Business Light Workers Preview

on:
  pull_request:
    branches:
      - visual-redesign
    paths:
      - 'apps/portal/**'
      - 'workers/gnk-asg-preview-portal-worker/**'
      - '.github/workflows/business-light-workers-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify preview safety
        run: |
          set -euo pipefail
          test -f workers/gnk-asg-preview-portal-worker/src/index.js
          test -f workers/gnk-asg-preview-portal-worker/src/video-sitemap.js
          test -f workers/gnk-asg-preview-portal-worker/wrangler.toml
          node --check workers/gnk-asg-preview-portal-worker/src/index.js
          node --check workers/gnk-asg-preview-portal-worker/src/video-sitemap.js
          node workers/gnk-asg-preview-portal-worker/test/video-sitemap.test.js
          if grep -E '(^|[[:space:]])routes?[[:space:]]*=' workers/gnk-asg-preview-portal-worker/wrangler.toml; then
            echo 'Production route configuration detected.'
            exit 1
          fi
          grep -q 'PRODUCTION_WRITE_LOCK = "true"' workers/gnk-asg-preview-portal-worker/wrangler.toml
          grep -q 'preview_write_locked' workers/gnk-asg-preview-portal-worker/src/index.js

      - name: Deploy route-free workers.dev preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/workers-preview
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            printf '%s\n' \
              'Cloudflare preview deploy skipped.' \
              'Reason: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not available to GitHub Actions.' \
              'Production changed: false' \
              > reports/workers-preview/deploy.txt
            echo 'deployed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx --yes wrangler@4 deploy \
            --config workers/gnk-asg-preview-portal-worker/wrangler.toml \
            2>&1 | tee reports/workers-preview/deploy.log
          preview_url=$(grep -Eo 'https://[a-zA-Z0-9._-]+\.workers\.dev' reports/workers-preview/deploy.log | tail -1 || true)
          printf '%s\n' \
            "Preview URL: ${preview_url:-not-detected}" \
            'Production route configured: false' \
            'Production changed: false' \
            'Write actions locked: true' \
            > reports/workers-preview/deploy.txt
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo 'deployed=true' >> "$GITHUB_OUTPUT"

      - name: Wait for workers.dev DNS and test preview
        if: steps.deploy.outputs.deployed == 'true' && steps.deploy.outputs.preview_url != ''
        shell: bash
        run: |
          set -euo pipefail
          url='${{ steps.deploy.outputs.preview_url }}'
          ready=false
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 15 "$url/__preview/status" \
              > reports/workers-preview/status.json; then
              ready=true
              break
            fi
            echo "Waiting for workers.dev DNS/availability: attempt $attempt/24"
            sleep 5
          done
          if [ "$ready" != 'true' ]; then
            echo 'Preview deployment completed, but workers.dev URL did not become reachable within 120 seconds.' \
              | tee reports/workers-preview/availability-error.txt
            exit 1
          fi
          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 3 "$url/" > /dev/null
          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 3 "$url/en/" > /dev/null
          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 3 "$url/trzista/" > /dev/null
          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 3 "$url/mail-studio-pro/" > /dev/null
          sitemap_code=$(curl --silent --output reports/workers-preview/video-sitemap.xml --write-out '%{http_code}' "$url/video-sitemap.xml")
          test "$sitemap_code" = '200' || test "$sitemap_code" = '204'
          code=$(curl --silent --output reports/workers-preview/write-lock.json --write-out '%{http_code}' \
            -X POST -H 'content-type: application/json' -d '{}' "$url/api/operator-send-mail")
          test "$code" = '423'
          printf '\nVerified reachable: true\nWrite lock verified: true\nVideo sitemap gate verified: true\n' >> reports/workers-preview/deploy.txt

      - name: Publish preview summary
        if: always()
        run: |
          if [ -f reports/workers-preview/deploy.txt ]; then
            cat reports/workers-preview/deploy.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload deployment report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gnk-asg-business-light-workers-preview-${{ github.run_id }}
          path: reports/workers-preview/
          if-no-files-found: warn
          retention-days: 7
