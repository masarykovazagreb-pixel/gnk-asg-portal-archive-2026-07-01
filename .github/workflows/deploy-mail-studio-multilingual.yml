name: Deploy GNK ASG production

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-mail-studio-multilingual.yml'
      - 'apps/portal/**'
      - 'workers/gnk-asg-direct-operator/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      approval:
        description: 'Enter the exact executive deploy approval phrase'
        required: true
        type: string
      expected_sha:
        description: 'Enter the exact reviewed main commit SHA to deploy'
        required: true
        type: string

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('gnk-asg-pr-{0}', github.event.pull_request.number) || 'gnk-asg-direct-operator-production' }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install Worker dependencies
        working-directory: workers/gnk-asg-direct-operator
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Generate and validate portal output
        run: |
          set -euo pipefail
          python -m py_compile \
            apps/portal/scripts/sync_publication_indexes.py \
            apps/portal/scripts/generate_sitewide_seo.py \
            apps/portal/scripts/finalize_sitewide_seo.py \
            apps/portal/scripts/harden_internal_routes.py
          python apps/portal/scripts/sync_publication_indexes.py
          python apps/portal/scripts/generate_sitewide_seo.py
          python apps/portal/scripts/finalize_sitewide_seo.py
          python apps/portal/scripts/harden_internal_routes.py
          python - <<'PY'
          import json
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def fail(message: str) -> None:
              print(f'::error::{message}', file=sys.stderr)
              raise SystemExit(1)

          def require(condition: bool, message: str) -> None:
              if not condition:
                  fail(message)

          root = Path('apps/portal')
          report_path = root / 'data/seo-report.json'
          require(report_path.is_file(), f'Missing SEO report: {report_path}')
          try:
              report = json.loads(report_path.read_text(encoding='utf-8'))
          except (OSError, json.JSONDecodeError) as exc:
              fail(f'Cannot read valid SEO report {report_path}: {exc}')

          require(isinstance(report, dict), 'SEO report root must be an object')
          pages = report.get('publicPages')
          require(isinstance(pages, list), 'SEO report publicPages must be an array')
          routes = set()
          for index, page in enumerate(pages):
              require(isinstance(page, dict), f'publicPages[{index}] must be an object')
              route = page.get('route')
              require(isinstance(route, str) and route.startswith('/'), f'publicPages[{index}].route is invalid: {route!r}')
              routes.add(route)

          page_count = report.get('publicPageCount')
          require(isinstance(page_count, int), 'SEO report publicPageCount must be an integer')
          require(page_count == len(pages), f'publicPageCount mismatch: declared {page_count}, actual {len(pages)}')

          internal = {
              '/control/', '/automation-status/', '/admin/', '/operator-dashboard/',
              '/operator-mobile/', '/mail-studio/', '/webmail/', '/campaign-mailer/'
          }
          required = {'/', '/en/', '/contact/', '/media-application/', '/the-code/', '/objave/', '/publications/'}
          missing = sorted(required - routes)
          exposed = sorted(routes & internal)
          require(not missing, f'Missing required public routes: {missing}')
          require(not exposed, f'Internal routes exposed as public: {exposed}')
          require(page_count >= 10, f'Expected at least 10 public pages, found {page_count}')

          for artifact in ('sitemap.xml', 'image-sitemap.xml'):
              artifact_path = root / artifact
              require(artifact_path.is_file(), f'Missing XML artifact: {artifact_path}')
              try:
                  ET.parse(artifact_path)
              except (OSError, ET.ParseError) as exc:
                  fail(f'Invalid XML in {artifact}: {exc}')

          sitemap_path = root / 'sitemap.xml'
          sitemap = sitemap_path.read_text(encoding='utf-8')
          for route in sorted(internal):
              require(f'https://gnk-asg.hr{route}' not in sitemap, f'Canonical sitemap exposes internal route: {route}')
              require(f'https://www.gnk-asg.hr{route}' not in sitemap, f'Legacy-host sitemap exposes internal route: {route}')

          robots_path = root / 'robots.txt'
          require(robots_path.is_file(), f'Missing robots file: {robots_path}')
          robots = robots_path.read_text(encoding='utf-8')
          require('Disallow: /control/' in robots, 'robots.txt does not disallow /control/')
          require('Disallow: /automation-status/' in robots, 'robots.txt does not disallow /automation-status/')
          print('Portal SEO and internal-route contract passed.')
          PY
      - name: Validate canonical production source
        run: |
          set -euo pipefail
          node --check workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js
          node --check workers/gnk-asg-direct-operator/src/enterprise-project-operations-v1.js
          node --check workers/gnk-asg-direct-operator/src/mail-studio-extension-v2.js
          node --check workers/gnk-asg-direct-operator/src/campaign-mailer-v2.js
          node scripts/validate-worker-import-graph.mjs
          grep -q 'main = "src/index-final-admin-gateway-v2.js"' workers/gnk-asg-direct-operator/wrangler.runtime.toml
          grep -q 'MEDIA_OUTREACH_LIVE = "false"' workers/gnk-asg-direct-operator/wrangler.runtime.toml
          grep -q 'MEDIA_OUTREACH_SCHEDULED_LIVE = "false"' workers/gnk-asg-direct-operator/wrangler.runtime.toml
          cd workers/gnk-asg-direct-operator
          npx wrangler deploy --dry-run --config wrangler.runtime.toml --name gnk-asg-direct-operator
      - name: Confirm validation-only pull request behavior
        if: github.event_name == 'pull_request'
        run: echo 'Pull request validated. Production deployment is not permitted from this event.'

  authorize-production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify branch, reviewed SHA and executive approval
        env:
          DEPLOY_APPROVAL: ${{ inputs.approval }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1" >&2; exit 1; }
          require_eq() {
            local actual="$1" expected="$2" label="$3"
            [ "$actual" = "$expected" ] || fail "$label mismatch: expected '$expected', got '$actual'"
          }
          require_nonempty() {
            local value="$1" label="$2"
            [ -n "$value" ] || fail "$label must not be empty"
          }

          require_eq "$GITHUB_EVENT_NAME" 'workflow_dispatch' 'GitHub event'
          require_eq "$GITHUB_REF_TYPE" 'branch' 'Git ref type'
          require_eq "$GITHUB_REF_NAME" 'main' 'Git ref name'
          require_eq "$GITHUB_REF" 'refs/heads/main' 'Full Git ref'
          require_eq "$DEPLOY_APPROVAL" 'Odobravam kontrolirani deploy - token 1203' 'Executive approval phrase'
          require_nonempty "$EXPECTED_SHA" 'Expected SHA'
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "Expected SHA is not a full 40-character lowercase commit SHA: '$EXPECTED_SHA'"
          require_eq "$GITHUB_SHA" "$EXPECTED_SHA" 'Workflow SHA'
          require_eq "$(git rev-parse HEAD)" "$EXPECTED_SHA" 'Checked-out HEAD'
          require_eq "$(git rev-parse origin/main)" "$EXPECTED_SHA" 'origin/main SHA'
          echo "Explicit production approval verified for exact SHA $EXPECTED_SHA."

  deploy-production:
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, authorize-production]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reconfirm exact authorized SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1" >&2; exit 1; }
          require_eq() {
            local actual="$1" expected="$2" label="$3"
            [ "$actual" = "$expected" ] || fail "$label mismatch: expected '$expected', got '$actual'"
          }

          require_eq "$GITHUB_EVENT_NAME" 'workflow_dispatch' 'GitHub event'
          require_eq "$GITHUB_REF_TYPE" 'branch' 'Git ref type'
          require_eq "$GITHUB_REF_NAME" 'main' 'Git ref name'
          require_eq "$GITHUB_REF" 'refs/heads/main' 'Full Git ref'
          require_eq "$GITHUB_SHA" "$EXPECTED_SHA" 'Workflow SHA'
          require_eq "$(git rev-parse HEAD)" "$EXPECTED_SHA" 'Checked-out HEAD'
          require_eq "$(git rev-parse origin/main)" "$EXPECTED_SHA" 'origin/main SHA'
          echo "Authorized SHA reconfirmed immediately before production deployment."
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install Worker dependencies
        working-directory: workers/gnk-asg-direct-operator
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Generate final portal output
        run: |
          set -euo pipefail
          python apps/portal/scripts/sync_publication_indexes.py
          python apps/portal/scripts/generate_sitewide_seo.py
          python apps/portal/scripts/finalize_sitewide_seo.py
          python apps/portal/scripts/harden_internal_routes.py
      - name: Deploy canonical Worker
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.runtime.toml --name gnk-asg-direct-operator
      - name: Verify Worker and protected routes without sending
        run: |
          set -euo pipefail
          fail() { echo "::error::$1" >&2; exit 1; }
          base='https://gnk-asg-direct-operator.beckuphome.workers.dev'
          ready=false
          home=000 contact=000 media=000 mail=000 campaign=000
          for attempt in $(seq 1 30); do
            cb="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            home=$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "$base/?cb=$cb" || true)
            contact=$(curl -sS -L -o /tmp/contact.html -w '%{http_code}' "$base/contact/?cb=$cb" || true)
            media=$(curl -sS -L -o /tmp/media.html -w '%{http_code}' "$base/media-application/?cb=$cb" || true)
            mail=$(curl -sS -o /tmp/mail.html -w '%{http_code}' "$base/mail-studio/?cb=$cb" || true)
            campaign=$(curl -sS -o /tmp/campaign.json -w '%{http_code}' "$base/api/campaign-mailer/health?cb=$cb" || true)
            if [ "$home" = 200 ] && [ "$contact" = 200 ] && [ "$media" = 200 ] \
              && { [ "$mail" = 200 ] || [ "$mail" = 401 ] || [ "$mail" = 403 ]; } \
              && [ "$campaign" = 401 ] \
              && grep -q 'SITEWIDE-SEO:BEGIN' /tmp/home.html \
              && grep -q '/api/contact-submit' /tmp/contact.html \
              && grep -q 'media-registration-v1.js' /tmp/media.html; then
              ready=true
              break
            fi
            sleep 6
          done
          [ "$ready" = true ] || fail "Worker verification failed after 30 attempts: home=$home contact=$contact media=$media mail=$mail campaign=$campaign"
      - name: Verify custom domain
        run: |
          set -euo pipefail
          fail() { echo "::error::$1" >&2; exit 1; }
          base='https://www.gnk-asg.hr'
          for route in / /contact/ /media-application/; do
            code=$(curl -sS -L -o /tmp/public.html -w '%{http_code}' "${base}${route}?cb=${GITHUB_RUN_ID}" || true)
            [ "$code" = 200 ] || fail "Custom domain route ${route} returned HTTP ${code}, expected 200"
          done
      - name: Persist generated portal metadata
        run: |
          set -euo pipefail
          git config user.name 'gnk-asg-deploy-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/portal
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh generated portal and security metadata [skip ci]'
          git push origin HEAD:main
