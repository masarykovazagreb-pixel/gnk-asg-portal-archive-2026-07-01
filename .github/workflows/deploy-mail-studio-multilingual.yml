name: Deploy GNK ASG production

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deploy-mail-studio-multilingual.yml"
      - "apps/portal/**"
      - "workers/gnk-asg-direct-operator/**"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-mail-studio-multilingual.yml"
      - "apps/portal/**"
      - "workers/gnk-asg-direct-operator/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('gnk-asg-pr-{0}', github.event.pull_request.number) || 'gnk-asg-direct-operator-production' }}
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out requested revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Worker dependencies
        working-directory: workers/gnk-asg-direct-operator
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Generate publications and harden internal routes
        run: |
          set -euo pipefail
          python -m py_compile \
            apps/portal/scripts/sync_publication_indexes.py \
            apps/portal/scripts/generate_sitewide_seo.py \
            apps/portal/scripts/finalize_sitewide_seo.py \
            apps/portal/scripts/harden_internal_routes.py
          python apps/portal/scripts/sync_publication_indexes.py
          python apps/portal/scripts/generate_sitewide_seo.py
          python apps/portal/scripts/finalize_sitewide_seo.py
          python apps/portal/scripts/harden_internal_routes.py

      - name: Validate SEO and internal route isolation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path("apps/portal")
          report = json.loads((root / "data/seo-report.json").read_text(encoding="utf-8"))
          routes = {page["route"] for page in report["publicPages"]}
          internal = {
              "/control/", "/automation-status/", "/admin/", "/operator-dashboard/",
              "/operator-mobile/", "/mail-studio/", "/webmail/", "/campaign-mailer/",
          }
          required = {"/", "/en/", "/contact/", "/media-application/", "/the-code/", "/objave/", "/publications/"}
          assert required <= routes, required - routes
          assert not (routes & internal), routes & internal
          assert report["publicPageCount"] >= 10
          ET.parse(root / "sitemap.xml")
          ET.parse(root / "image-sitemap.xml")
          sitemap = (root / "sitemap.xml").read_text(encoding="utf-8")
          for route in internal:
              assert f"https://www.gnk-asg.hr{route}" not in sitemap
          for route in ("/control/", "/automation-status/"):
              page = root / route.strip("/") / "index.html"
              if page.exists():
                  text = page.read_text(encoding="utf-8")
                  assert 'content="noindex,nofollow,noarchive"' in text
          robots = (root / "robots.txt").read_text(encoding="utf-8")
          assert "Disallow: /control/" in robots
          assert "Disallow: /automation-status/" in robots
          print(f"Validated {report['publicPageCount']} public pages and isolated internal routes.")
          PY

      - name: Validate canonical Worker source
        run: |
          set -euo pipefail
          node --check apps/portal/assets/mail-studio-multilingual-v25.js
          node --check apps/portal/campaign-mailer/control-v2.js
          node --check workers/gnk-asg-direct-operator/src/mail-studio-extension-v2.js
          node --check workers/gnk-asg-direct-operator/src/campaign-mailer-v1.js
          node --check workers/gnk-asg-direct-operator/src/campaign-mailer-v2.js
          node --check workers/gnk-asg-direct-operator/src/campaign-mailer-delivery-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js
          grep -q 'main = "src/index-final-admin-gateway-v2.js"' workers/gnk-asg-direct-operator/wrangler.runtime.toml
          grep -q 'MEDIA_OUTREACH_LIVE = "false"' workers/gnk-asg-direct-operator/wrangler.runtime.toml
          grep -q 'MEDIA_OUTREACH_SCHEDULED_LIVE = "false"' workers/gnk-asg-direct-operator/wrangler.runtime.toml
          grep -q 'MAIL_MANUAL_MAX_PER_DAY = "50"' workers/gnk-asg-direct-operator/wrangler.runtime.toml
          grep -q 'CAMPAIGN_MAILER_MAX_PER_DAY = "140"' workers/gnk-asg-direct-operator/wrangler.runtime.toml
          grep -q "x-gnk-asg-scheduled-mail" workers/gnk-asg-direct-operator/src/mail-studio-extension-v2.js
          cd workers/gnk-asg-direct-operator
          npx wrangler deploy --dry-run --config wrangler.runtime.toml --name gnk-asg-direct-operator

      - name: Deploy canonical gateway v2 to Cloudflare
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.runtime.toml --name gnk-asg-direct-operator

      - name: Verify Worker without sending email
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: |
          set -euo pipefail
          base="https://gnk-asg-direct-operator.beckuphome.workers.dev"
          slug="ai-shrinks-security-window-apple-accelerates-patches"
          ready=false
          for attempt in $(seq 1 30); do
            cb="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            home=$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "$base/?cb=$cb" || true)
            english=$(curl -sS -L -o /tmp/en.html -w '%{http_code}' "$base/en/?cb=$cb" || true)
            contact=$(curl -sS -L -o /tmp/contact.html -w '%{http_code}' "$base/contact/?cb=$cb" || true)
            media=$(curl -sS -L -o /tmp/media.html -w '%{http_code}' "$base/media-application/?cb=$cb" || true)
            code=$(curl -sS -L -o /tmp/code.html -w '%{http_code}' "$base/the-code/?cb=$cb" || true)
            article_hr=$(curl -sS -L -o /tmp/article-hr.html -w '%{http_code}' "$base/objave/$slug/?cb=$cb" || true)
            article_en=$(curl -sS -L -o /tmp/article-en.html -w '%{http_code}' "$base/publications/$slug/?cb=$cb" || true)
            sitemap=$(curl -sS -L -o /tmp/sitemap.xml -w '%{http_code}' "$base/sitemap.xml?cb=$cb" || true)
            control=$(curl -sS -L -o /tmp/control.html -w '%{http_code}' "$base/control/?cb=$cb" || true)
            mail=$(curl -sS -D /tmp/mail.headers -o /tmp/mail.html -w '%{http_code}' "$base/mail-studio/?cb=$cb" || true)
            campaign=$(curl -sS -o /tmp/campaign.json -w '%{http_code}' "$base/api/campaign-mailer/health?cb=$cb" || true)
            registration=$(curl -sS -o /tmp/registration.json -w '%{http_code}' "$base/api/media-registration/config?cb=$cb" || true)
            if [ "$home" = 200 ] && [ "$english" = 200 ] && [ "$contact" = 200 ] \
              && [ "$media" = 200 ] && [ "$code" = 200 ] \
              && [ "$article_hr" = 200 ] && [ "$article_en" = 200 ] \
              && [ "$sitemap" = 200 ] && [ "$control" = 200 ] \
              && { [ "$mail" = 200 ] || [ "$mail" = 401 ] || [ "$mail" = 403 ]; } \
              && [ "$campaign" = 401 ] && [ "$registration" = 200 ] \
              && grep -q 'SITEWIDE-SEO:BEGIN' /tmp/home.html \
              && grep -q 'GNK DINAMO Ltd.' /tmp/en.html \
              && grep -q '/api/contact-submit' /tmp/contact.html \
              && grep -q 'media-registration-v1.js' /tmp/media.html \
              && grep -q 'THE CODE' /tmp/code.html \
              && grep -q '"@type":"NewsArticle"' /tmp/article-hr.html \
              && grep -q '"@type":"NewsArticle"' /tmp/article-en.html \
              && grep -q 'noindex,nofollow,noarchive' /tmp/control.html \
              && ! grep -q '<loc>https://www.gnk-asg.hr/control/</loc>' /tmp/sitemap.xml \
              && grep -qi '^x-gnk-asg-mail-studio-extension: GNK_ASG_MAIL_STUDIO_EXTENSION_V5_20260703_MANUAL_NO_INTERVAL' /tmp/mail.headers; then
              ready=true
              break
            fi
            sleep 6
          done
          test "$ready" = true
          echo "Canonical Worker gateway v2 verified; no email was sent."

      - name: Verify custom domain
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: |
          set -euo pipefail
          base="https://www.gnk-asg.hr"
          slug="ai-shrinks-security-window-apple-accelerates-patches"
          ready=false
          for attempt in $(seq 1 20); do
            cb="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            home=$(curl -sS -L -o /tmp/public-home.html -w '%{http_code}' "$base/?cb=$cb" || true)
            contact=$(curl -sS -L -o /tmp/public-contact.html -w '%{http_code}' "$base/contact/?cb=$cb" || true)
            media=$(curl -sS -L -o /tmp/public-media.html -w '%{http_code}' "$base/media-application/?cb=$cb" || true)
            article_hr=$(curl -sS -L -o /tmp/public-hr.html -w '%{http_code}' "$base/objave/$slug/?cb=$cb" || true)
            article_en=$(curl -sS -L -o /tmp/public-en.html -w '%{http_code}' "$base/publications/$slug/?cb=$cb" || true)
            sitemap=$(curl -sS -L -o /tmp/public-sitemap.xml -w '%{http_code}' "$base/sitemap.xml?cb=$cb" || true)
            control=$(curl -sS -L -o /tmp/public-control.html -w '%{http_code}' "$base/control/?cb=$cb" || true)
            if [ "$home" = 200 ] && [ "$contact" = 200 ] && [ "$media" = 200 ] \
              && [ "$article_hr" = 200 ] && [ "$article_en" = 200 ] \
              && [ "$sitemap" = 200 ] && [ "$control" = 200 ] \
              && grep -q 'SITEWIDE-SEO:BEGIN' /tmp/public-home.html \
              && grep -q '/api/contact-submit' /tmp/public-contact.html \
              && grep -q 'media-registration-v1.js' /tmp/public-media.html \
              && grep -q '"@type":"NewsArticle"' /tmp/public-hr.html \
              && grep -q '"@type":"NewsArticle"' /tmp/public-en.html \
              && grep -q 'noindex,nofollow,noarchive' /tmp/public-control.html \
              && ! grep -q '<loc>https://www.gnk-asg.hr/control/</loc>' /tmp/public-sitemap.xml; then
              ready=true
              break
            fi
            sleep 6
          done
          test "$ready" = true
          echo "Public custom domain verified."

      - name: Persist generated SEO output safely
        if: success() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
        run: |
          set -euo pipefail
          git config user.name "gnk-asg-deploy-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in $(seq 1 5); do
            echo "Generated-output persistence attempt ${attempt}/5"
            git fetch origin main
            git checkout -B generated-security-persist origin/main

            python apps/portal/scripts/sync_publication_indexes.py
            python apps/portal/scripts/generate_sitewide_seo.py
            python apps/portal/scripts/finalize_sitewide_seo.py
            python apps/portal/scripts/harden_internal_routes.py

            git add apps/portal
            if git diff --cached --quiet; then
              echo "No generated changes to persist."
              exit 0
            fi

            git commit -m "Refresh generated portal and security metadata [skip ci]"
            if git push origin HEAD:main; then
              echo "Generated portal and security metadata persisted."
              exit 0
            fi

            echo "Main moved during persistence; retrying from the newest main revision." >&2
            sleep $((attempt * 2))
          done

          echo "Unable to persist generated portal metadata after five attempts." >&2
          exit 1
