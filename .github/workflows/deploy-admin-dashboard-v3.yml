name: Validate Admin Dashboard V3

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deploy-admin-dashboard-v3.yml"
      - "apps/portal/assets/admin-dashboard-v3.css"
      - "apps/portal/assets/admin-dashboard-v3.js"
      - "apps/portal/assets/admin-center-health-v1.js"
      - "apps/portal/assets/admin-module-loader-v3.js"
      - "apps/portal/assets/index-hero-scale-v13.css"
      - "apps/portal/assets/index-code-cleanup-v8.js"
      - "workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js"
      - "workers/gnk-asg-direct-operator/src/index-admin-hub-v27-news-status.js"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Validate Admin Dashboard and Index refinements
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/portal/assets/admin-dashboard-v3.js
          node --check apps/portal/assets/admin-center-health-v1.js
          node --check apps/portal/assets/admin-module-loader-v3.js
          node --check apps/portal/assets/index-code-cleanup-v8.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v27-news-status.js
          test -s apps/portal/assets/admin-dashboard-v3.css
          test -s apps/portal/assets/index-hero-scale-v13.css
          grep -q "GNK ASG Admin Dashboard V3" apps/portal/assets/admin-dashboard-v3.css
          grep -q "admin-module-loader-v3.js" workers/gnk-asg-direct-operator/src/index-admin-hub-v27-news-status.js
          grep -q "frame-ancestors 'self'" workers/gnk-asg-direct-operator/src/index-admin-hub-v27-news-status.js
          grep -q "ALL_MODULES_WITH_10_SECOND_TIMEOUT" workers/gnk-asg-direct-operator/src/index-admin-hub-v27-news-status.js
          grep -q "50_PERCENT_V13" workers/gnk-asg-direct-operator/src/index-admin-hub-v27-news-status.js
          node scripts/test-deploy-approval-guardrails.mjs
      - name: Dry-run Admin Dashboard Worker package
        working-directory: workers/gnk-asg-direct-operator
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator
      - name: Confirm validation-only boundary
        run: echo "Production deployment is not permitted from this event."
