name: Deploy Admin Dashboard V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-admin-dashboard-v3.yml'
      - 'apps/portal/assets/admin-dashboard-v3.css'
      - 'apps/portal/assets/admin-dashboard-v3.js'
      - 'apps/portal/assets/admin-module-loader-v3.js'
      - 'apps/portal/assets/index-hero-scale-v13.css'
      - 'apps/portal/assets/index-code-cleanup-v8.js'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v27-news-status.js'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-admin-dashboard-v3.yml'
      - 'apps/portal/assets/admin-dashboard-v3.css'
      - 'apps/portal/assets/admin-dashboard-v3.js'
      - 'apps/portal/assets/admin-module-loader-v3.js'
      - 'apps/portal/assets/index-hero-scale-v13.css'
      - 'apps/portal/assets/index-code-cleanup-v8.js'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v27-news-status.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnk-asg-admin-dashboard-v3
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate Admin Dashboard and Index refinements
        shell: bash
        run: |
          set -euxo pipefail
          node --check apps/portal/assets/admin-dashboard-v3.js
          node --check apps/portal/assets/admin-module-loader-v3.js
          node --check apps/portal/assets/index-code-cleanup-v8.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v27-news-status.js
          test -s apps/portal/assets/admin-dashboard-v3.css
          test -s apps/portal/assets/index-hero-scale-v13.css
          grep -q 'GNK ASG Admin Dashboard V3' apps/portal/assets/admin-dashboard-v3.css
          grep -q 'admin-module-loader-v3.js' workers/gnk-asg-direct-operator/src/index-admin-hub-v27-news-status.js
          grep -q "frame-ancestors 'self'" workers/gnk-asg-direct-operator/src/index-admin-hub-v27-news-status.js
          grep -q 'width:50%' apps/portal/assets/index-hero-scale-v13.css
          grep -q '/data/deployment-status.json' apps/portal/assets/admin-dashboard-v3.js
          grep -q '/api/mail-center/send-readiness' apps/portal/assets/admin-dashboard-v3.js
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator
      - name: Deploy Cloudflare Worker
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator
      - name: Verify Admin loader and index scale
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 18); do
            LOADER=$(curl -fsS "https://gnk-asg.hr/assets/admin-module-loader-v3.js?cb=${GITHUB_RUN_ID}-${n}" || true)
            SCALE=$(curl -fsS "https://gnk-asg.hr/assets/index-hero-scale-v13.css?cb=${GITHUB_RUN_ID}-${n}" || true)
            STATUS=$(curl -fsS "https://gnk-asg.hr/data/deployment-status.json?cb=${GITHUB_RUN_ID}-${n}" || true)
            ADMIN=$(curl -fsS "https://gnk-asg.hr/admin-center/?cb=${GITHUB_RUN_ID}-${n}" || true)
            if printf '%s' "$LOADER" | grep -q 'ADMIN_MODULE_LOADER_V3' \
              && printf '%s' "$SCALE" | grep -q 'width:50%' \
              && printf '%s' "$STATUS" | grep -q 'index-admin-hub-v27-news-status.js' \
              && printf '%s' "$ADMIN" | grep -q 'admin-module-loader-v3.js'; then
                exit 0
            fi
            sleep 10
          done
          exit 1
