name: Probe mail delivery health now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-mail-health-now.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Fetch current production health
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gnk-mail
          node <<'JS'
          const fs=require('node:fs');
          (async()=>{
            const url=`https://gnk-asg.hr/data/mail-delivery-health.json?cb=${process.env.GITHUB_RUN_ID}-${Date.now()}`;
            try{
              const response=await fetch(url,{headers:{'cache-control':'no-cache'}});
              const text=await response.text();
              let data={};try{data=JSON.parse(text)}catch{data={ok:false,status:'INVALID_JSON',body:text.slice(0,500)}}
              fs.writeFileSync('/tmp/gnk-mail/probe.json',JSON.stringify({...data,httpStatus:response.status,probedAt:new Date().toISOString(),runId:process.env.GITHUB_RUN_ID,commit:process.env.GITHUB_SHA},null,2));
            }catch(error){
              fs.writeFileSync('/tmp/gnk-mail/probe.json',JSON.stringify({ok:false,status:'FETCH_FAILED',error:String(error),probedAt:new Date().toISOString(),runId:process.env.GITHUB_RUN_ID,commit:process.env.GITHUB_SHA},null,2));
            }
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
      - name: Record probe
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CONTENT=$(base64 -w0 /tmp/gnk-mail/probe.json)
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/docs/deployments/mail-delivery-health-probe.json?ref=main" --jq '.sha' 2>/dev/null || true)
          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/docs/deployments/mail-delivery-health-probe.json" -f message='chore(mail): record immediate health probe [skip ci]' -f content="$CONTENT" -f sha="$CURRENT_SHA" -f branch='main'
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/docs/deployments/mail-delivery-health-probe.json" -f message='chore(mail): record immediate health probe [skip ci]' -f content="$CONTENT" -f branch='main'
          fi
