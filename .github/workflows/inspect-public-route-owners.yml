name: Inspect Public Route Owners

on:
  push:
    branches: [main]
    paths:
      - ".github/inspect-public-route-owners.trigger"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public response headers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://gnk-asg.hr"
          : > report.txt
          for path in /vijesti/ /news/ /app/ /data/portal-version.json; do
            file=$(printf '%s' "$path" | tr '/-' '__' | tr -cd '[:alnum:]_')
            [ -n "$file" ] || file=root
            code=$(curl -sSL -D "${file}.headers" -o "${file}.body" -w '%{http_code}' "$base${path}?cb=$(date +%s%N)" || true)
            menu=false; css=false; favicon=false; bodyClass=false; v12=false
            grep -q 'public-menu-final-v9.js?v=20260625-v12' "${file}.body" && menu=true || true
            grep -q 'public-menu-unified-v12.css?v=20260625-v1' "${file}.body" && css=true || true
            grep -q 'gnk-asg-favicon.svg?v=20260625-v1' "${file}.body" && favicon=true || true
            grep -q 'gnk-public-v12' "${file}.body" && bodyClass=true || true
            grep -q 'GNK_ASG_PORTAL_FINAL_V12_20260625' "${file}.body" && v12=true || true
            printf '%s HTTP=%s MENU=%s CSS=%s FAVICON=%s BODY=%s V12=%s\n' "$path" "$code" "$menu" "$css" "$favicon" "$bodyClass" "$v12" >> report.txt
            grep -Ei '^(content-type|cache-control|x-gnk-asg[^:]*|location):' "${file}.headers" | sed 's/[[:space:]]*$//' >> report.txt || true
            printf '\n' >> report.txt
          done
          body=$(printf 'Privremena produkcijska provjera zajedničkog javnog izbornika i favicona na ključnim HR/EN stranicama.\n\n## Zadnja brza provjera\n\n```text\n%s\n```\n' "$(cat report.txt)")
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/63" -f body="$body"
