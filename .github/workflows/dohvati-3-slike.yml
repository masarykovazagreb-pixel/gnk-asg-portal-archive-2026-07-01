name: Dohvati 2 slike v2 (jednokratno)
on: workflow_dispatch
jobs:
  dohvati:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p apps/portal/data/tmp-3s
          curl -s "https://gnk-asg.hr/api/slike?upit=hybrid+remote+work+office+team" -o apps/portal/data/tmp-3s/rad.json
          curl -s "https://gnk-asg.hr/api/slike?upit=shipping+containers+port+customs+trade" -o apps/portal/data/tmp-3s/carina.json
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          BRANCH="slike3-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-3s
          git commit -m "slike"
          git push origin "$BRANCH"
