name: Dohvati slike b05 (jednokratno)
on: workflow_dispatch
jobs:
  dohvati:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p apps/portal/data/tmp-b05
          curl -s "https://gnk-asg.hr/api/slike?upit=service+level+agreement+contract+business" -o apps/portal/data/tmp-b05/sla.json
          curl -s "https://gnk-asg.hr/api/slike?upit=data+center+servers+capacity" -o apps/portal/data/tmp-b05/podatkovni.json
          curl -s "https://gnk-asg.hr/api/slike?upit=tax+planning+calculator+finance" -o apps/portal/data/tmp-b05/porez.json
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          BRANCH="slikeb05-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-b05
          git commit -m "slike b05"
          git push origin "$BRANCH"
