name: Regeneriraj sitemapove (jednokratno)
on: workflow_dispatch
jobs:
  regeneriraj:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/generate-sitemaps.py
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          git add apps/portal/sitemap.xml apps/portal/editorial-sitemap.xml apps/portal/visual-sitemap.xml apps/portal/sitemap-index.xml
          git diff --cached --stat
          git commit -m "chore(seo): regenerate sitemaps after historical translation backlog (117 new EN pages)" || echo "nema promjena"
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              break
            fi
            echo "Push odbijen (pokusaj $attempt) - main se pomaknuo, radim fetch+rebase."
            git fetch origin main
            git rebase origin/main || { echo "Rebase konflikt."; exit 1; }
            sleep $((attempt * 5))
            if [ "$attempt" = "5" ]; then echo "Push nije uspio nakon 5 pokusaja."; exit 1; fi
          done
