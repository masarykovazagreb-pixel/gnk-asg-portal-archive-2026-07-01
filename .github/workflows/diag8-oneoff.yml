name: Verify newsroom OG tags with vs without cache-bust (one-off)
on:
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare plain vs cache-busted newsroom fetch
        run: |
          echo "# Newsroom OG comparison $(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/d.md
          echo "" >> /tmp/d.md
          echo "## Plain https://gnk-asg.hr/newsroom/" >> /tmp/d.md
          curl -s "https://gnk-asg.hr/newsroom/" -o /tmp/plain.html
          grep -o '<meta property="og:[a-z]*" content="[^"]*">' /tmp/plain.html >> /tmp/d.md || echo "NO OG TAGS FOUND (plain)" >> /tmp/d.md
          wc -c /tmp/plain.html >> /tmp/d.md
          echo "" >> /tmp/d.md
          echo "## Cache-busted https://gnk-asg.hr/newsroom/?cb=TIMESTAMP" >> /tmp/d.md
          curl -s "https://gnk-asg.hr/newsroom/?cb=$(date +%s)" -o /tmp/busted.html
          grep -o '<meta property="og:[a-z]*" content="[^"]*">' /tmp/busted.html >> /tmp/d.md || echo "NO OG TAGS FOUND (busted)" >> /tmp/d.md
          wc -c /tmp/busted.html >> /tmp/d.md
          echo "" >> /tmp/d.md
          echo "## Diff (first 50 lines)" >> /tmp/d.md
          diff /tmp/plain.html /tmp/busted.html | head -50 >> /tmp/d.md || echo "no diff / identical" >> /tmp/d.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" --title "Newsroom OG comparison $(date -u +%Y-%m-%dT%H:%M:%SZ)" --body-file /tmp/d.md
