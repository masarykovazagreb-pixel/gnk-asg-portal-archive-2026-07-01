name: Validate Legacy Bilingual Index Package

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deploy-bilingual-index-activation.yml"
      - "workers/gnk-asg-direct-operator/**"
      - "apps/portal/index.html"
      - "apps/portal/en/index.html"
      - "apps/portal/assets/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Validate current bilingual index package
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/portal/index.html
          test -s apps/portal/en/index.html
          test -s workers/gnk-asg-direct-operator/wrangler.toml
          test -s workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          node --check workers/gnk-asg-direct-operator/src/index-unified-auth-v23.js
          node scripts/test-deploy-approval-guardrails.mjs
      - name: Dry-run bilingual index Worker package
        working-directory: workers/gnk-asg-direct-operator
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator
      - name: Confirm validation-only boundary
        run: echo "Production deployment is not permitted from this event."
