name: Deploy Luxury Static Index V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-bilingual-index-activation.yml'
      - 'workers/gnk-asg-direct-operator/wrangler.toml'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v24-activation.js'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js'
      - 'workers/gnk-asg-direct-operator/src/index-activation-wrapper-v1.js'
      - 'apps/portal/index-white-static-preview-v2.html'
      - 'apps/portal/en/index-white-static-preview-v2.html'
      - 'apps/portal/assets/index-white-static-v2.css'
      - 'apps/portal/assets/index-white-static-v2.js'
      - 'apps/portal/assets/index-white-static-enhance-v2.js'
      - 'apps/portal/the-code/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnk-asg-canonical-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate luxury index package
        shell: bash
        run: |
          set -euxo pipefail
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v24-activation.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js
          node --check workers/gnk-asg-direct-operator/src/index-activation-wrapper-v1.js
          node --check apps/portal/assets/index-white-static-v2.js
          node --check apps/portal/assets/index-white-static-enhance-v2.js
          grep -q 'main = "src/index-admin-hub-v26-clean-index.js"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'GNK_ASG_WHITE_STATIC_INDEX_V2_20260627' workers/gnk-asg-direct-operator/src/index-activation-wrapper-v1.js
          grep -q 'data-index-template="white-static-v2"' apps/portal/index-white-static-preview-v2.html
          grep -q 'data-index-template="white-static-v2"' apps/portal/en/index-white-static-preview-v2.html
          grep -q 'id="codePreview"' apps/portal/index-white-static-preview-v2.html
          grep -q 'min-height:820px' apps/portal/assets/index-white-static-v2.css
          grep -q "\['Perth','Perth'" apps/portal/assets/index-white-static-v2.js
          grep -q 'location-directory' apps/portal/assets/index-white-static-v2.css
          grep -q 'operator-dashboard' apps/portal/index-white-static-preview-v2.html
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator
      - name: Deploy to Cloudflare
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator
      - name: Verify Croatian and English luxury index
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 24); do
            HR_HEADERS=$(mktemp)
            EN_HEADERS=$(mktemp)
            HR=$(curl -fsS -D "$HR_HEADERS" "https://gnk-asg.hr/?cb=${GITHUB_RUN_ID}-${n}" || true)
            EN=$(curl -fsS -D "$EN_HEADERS" "https://gnk-asg.hr/en/?cb=${GITHUB_RUN_ID}-${n}" || true)
            if printf '%s' "$HR" | grep -q 'data-index-template="white-static-v2"' \
              && printf '%s' "$EN" | grep -q 'data-index-template="white-static-v2"' \
              && printf '%s' "$HR" | grep -q 'Interaktivna prezentacija · puna veličina' \
              && printf '%s' "$EN" | grep -q 'Interactive presentation · full size' \
              && printf '%s' "$HR" | grep -q 'Globalna mreža' \
              && printf '%s' "$EN" | grep -q 'Global network' \
              && printf '%s' "$HR" | grep -q 'operator-dashboard' \
              && printf '%s' "$EN" | grep -q 'operator-dashboard' \
              && grep -qi 'x-gnk-asg-index-template: GNK_ASG_WHITE_STATIC_INDEX_V2_20260627' "$HR_HEADERS" \
              && grep -qi 'x-gnk-asg-index-template: GNK_ASG_WHITE_STATIC_INDEX_V2_20260627' "$EN_HEADERS"; then
                exit 0
            fi
            sleep 10
          done
          exit 1
