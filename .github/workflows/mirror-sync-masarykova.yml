name: Mirror Sync to Masarykova Backup

# Full mirror push (all branches + tags) from this repository to the
# owner's private backup repository under a separate GitHub account.
# A successful Deploy Admin Auth V6 run remains the preferred trigger;
# hourly scheduling is only a release-phase fallback so bot/API commits
# cannot leave the backup several hours behind if workflow_run is missed.
#
# Requires a repository secret MASARYKOVA_MIRROR_TOKEN: a classic
# Personal Access Token (scope: repo) issued on the
# masarykovazagreb-pixel GitHub account, with write access to
# masarykovazagreb-pixel/gnk-asg-portal-archive-2026-07-01.
# Set via: Settings > Secrets and variables > Actions > New repository
# secret. This workflow only ever reads that secret to authenticate
# the mirror push -- it is never logged, echoed, or written to any
# file in this repository.

on:
  schedule:
    - cron: '35 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Admin Auth V6"]
    types: [completed]

concurrency:
  group: masarykova-mirror-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Full mirror clone of this repository
        run: |
          git clone --mirror "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mirror.git

      - name: Push full mirror to masarykova backup
        env:
          MASARYKOVA_MIRROR_TOKEN: ${{ secrets.MASARYKOVA_MIRROR_TOKEN }}
        run: |
          set +e
          cd mirror.git
          PUSH_OUTPUT=$(git push --mirror "https://x-access-token:${MASARYKOVA_MIRROR_TOKEN}@github.com/masarykovazagreb-pixel/gnk-asg-portal-archive-2026-07-01.git" 2>&1)
          PUSH_STATUS=$?
          echo "$PUSH_OUTPUT" > /tmp/push_output.txt
          echo "push_status=$PUSH_STATUS" >> "$GITHUB_OUTPUT"
          {
            echo "## Mirror push output"
            echo '```'
            echo "$PUSH_OUTPUT"
            echo '```'
            echo "Exit status: $PUSH_STATUS"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        id: push

      - name: Evaluate push result
        run: |
          PUSH_OUTPUT=$(cat /tmp/push_output.txt)
          STATUS="${{ steps.push.outputs.push_status }}"
          echo "Push exit status was: $STATUS"
          if [ "$STATUS" = "0" ]; then
            echo "Mirror push succeeded cleanly."
            exit 0
          fi
          # GitHub always rejects direct pushes to refs/pull/*/head and
          # refs/pull/*/merge (its own PR-tracking refs) -- expected,
          # not a real failure. Only fail if some OTHER rejection or a
          # genuine auth/connectivity error is present. Note: keyed
          # phrases below are deliberately specific (e.g. "HTTP 403",
          # not bare "403") to avoid false-positiving on PR numbers
          # like refs/pull/403/head that legitimately appear in output.
          NON_HIDDEN_REF_ERRORS=$(echo "$PUSH_OUTPUT" | grep -E '! \[(remote rejected|rejected)\]' | grep -v 'refs/pull/' || true)
          if [ -n "$NON_HIDDEN_REF_ERRORS" ]; then
            echo "Real (non-hidden-ref) push rejections found:"
            echo "$NON_HIDDEN_REF_ERRORS"
            exit 1
          fi
          if echo "$PUSH_OUTPUT" | grep -qi "authentication failed\|HTTP 403\|status: 403\|could not read\|fatal: unable to access\|fatal: repository .* not found"; then
            echo "Authentication or connectivity failure detected."
            exit 1
          fi
          echo "Only expected hidden-ref rejections (refs/pull/*) found; treating as success."

      - name: Clean up
        if: always()
        run: rm -rf mirror.git
