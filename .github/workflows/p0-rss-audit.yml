name: P0 - RSS Audit (jednokratno)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rss-audit:
    name: Provjeri sve RSS izvore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pokreni RSS audit
        run: node scripts/gnk-rss-audit-v1.mjs
      - name: Objavi sažetak
        if: always()
        run: |
          if [ -s artifacts/rss-audit-report.json ]; then
            node -e "
              const r = require('./artifacts/rss-audit-report.json');
              console.log('## RSS Audit — ' + r.generatedAt);
              console.log('');
              console.log('Whitelist: **' + r.whitelist + '/' + r.ukupnoIzvora + '**');
              console.log('Blacklist: **' + r.blacklist + '/' + r.ukupnoIzvora + '**');
              console.log('');
              console.log('| Izvor | Grupa | Status | Razlog |');
              console.log('|---|---|---|---|');
              for (const x of r.rezultati) {
                console.log('| ' + x.source + ' | ' + x.group + ' | ' + (x.prolazi ? '✓' : '✗') + ' | ' + x.razlog + ' |');
              }
            " >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Spremi RSS audit kao Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rss-audit-report
          path: artifacts/rss-audit-report.json
          if-no-files-found: error
          retention-days: 14
