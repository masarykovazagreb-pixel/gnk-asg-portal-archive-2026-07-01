name: Editorial Premium Contract

on:
  pull_request:
    paths:
      - 'apps/portal/data/editorial-plan/**'
      - 'scripts/validate-editorial-premium-contract.mjs'
      - 'scripts/plan-editorial-premium-remediation.mjs'
      - 'scripts/plan-editorial-premium-assets.mjs'
      - 'scripts/migrate-editorial-premium-metadata.mjs'
      - 'ops/automation-control-v1.json'
      - '.github/workflows/editorial-premium-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate premium editorial package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate contract
        run: node scripts/validate-editorial-premium-contract.mjs

      - name: Upload validation report
        if: always()
        run: |
          mkdir -p ops/evidence
          node scripts/validate-editorial-premium-contract.mjs > ops/evidence/editorial-premium-contract.json || true

      - name: Build remediation index
        if: always()
        run: |
          node scripts/plan-editorial-premium-remediation.mjs \
            ops/evidence/editorial-premium-contract.json \
            ops/evidence/editorial-premium-remediation.json \
            ops/evidence/editorial-premium-remediation.md
          cat ops/evidence/editorial-premium-remediation.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build active and future asset plan
        if: always()
        run: |
          node scripts/plan-editorial-premium-assets.mjs \
            ops/evidence/editorial-premium-remediation.json \
            ops/evidence/editorial-premium-assets.json \
            ops/evidence/editorial-premium-assets.md
          cat ops/evidence/editorial-premium-assets.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build deterministic metadata migration preview
        if: always()
        run: |
          node scripts/migrate-editorial-premium-metadata.mjs \
            --scope=active-future \
            > ops/evidence/editorial-premium-metadata-migration.json
          node -e "const r=require('./ops/evidence/editorial-premium-metadata-migration.json'); console.log('## Metadata migration preview\n\n- Eligible files: **'+r.eligibleFiles+'**\n- Files requiring changes: **'+r.changedFiles+'**\n- Items requiring changes: **'+r.changedItems+'**\n- Mode: **'+r.mode+'**\n')" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-premium-contract
          path: |
            ops/evidence/editorial-premium-contract.json
            ops/evidence/editorial-premium-remediation.json
            ops/evidence/editorial-premium-remediation.md
            ops/evidence/editorial-premium-assets.json
            ops/evidence/editorial-premium-assets.md
            ops/evidence/editorial-premium-metadata-migration.json
          if-no-files-found: error
