name: Portal quality gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/portal/**"
      - "workers/**"
      - "packages/**"
      - "contracts/**"
      - "tools/portal-quality-gate.mjs"
      - "tools/build-bpp-domain-patch.mjs"
      - "tools/validate-refresh-backend.mjs"
      - "tools/validate-homepage-final.mjs"
      - "tools/portal-release-readiness.mjs"
      - ".github/workflows/portal-quality-gate.yml"
      - ".quality-gate-enforced"
  push:
    branches:
      - main
    paths:
      - "apps/portal/**"
      - "workers/**"
      - "packages/**"
      - "contracts/**"
      - "tools/portal-quality-gate.mjs"
      - "tools/build-bpp-domain-patch.mjs"
      - "tools/validate-refresh-backend.mjs"
      - "tools/validate-homepage-final.mjs"
      - "tools/portal-release-readiness.mjs"
      - ".github/workflows/portal-quality-gate.yml"
      - ".quality-gate-enforced"

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate audit, homepage and backend
        run: |
          node --check tools/portal-quality-gate.mjs
          node --check tools/build-bpp-domain-patch.mjs
          node --check tools/validate-refresh-backend.mjs
          node --check tools/validate-homepage-final.mjs
          node --check tools/validate-mail-contact.mjs
          node --check tools/portal-release-readiness.mjs
          node --check apps/portal/assets/homepage-polish.js
          node --check workers/gnk-asg-direct-operator/src/runtime-entry.js
          node --check workers/gnk-asg-direct-operator/src/gnk-asg-refresh-backend-v1.js
          node --check workers/gnk-asg-direct-operator/src/gnk-asg-mail-contact-v1.js
          node tools/validate-refresh-backend.mjs
          node tools/validate-homepage-final.mjs
          node tools/validate-mail-contact.mjs

      - name: Audit portal
        shell: bash
        run: |
          MODE=""
          if [[ -f .quality-gate-enforced ]]; then
            MODE="--strict"
          fi
          node tools/portal-quality-gate.mjs \
            --root apps/portal \
            --out reports/portal-quality-gate \
            $MODE

      - name: Validate release readiness
        run: node tools/portal-release-readiness.mjs

      - name: Prepare non-destructive BPP domain patch package
        shell: bash
        run: |
          node tools/build-bpp-domain-patch.mjs \
            --out reports/portal-quality-gate
          test -f reports/portal-quality-gate/bpp-patched/manifest.json
          node - <<'NODE'
          const fs = require('fs');
          const file = 'reports/portal-quality-gate/bpp-patched/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (!Array.isArray(manifest.files)) throw new Error('BPP patch manifest is invalid.');
          console.log(`Prepared ${manifest.files.length} BPP patch file(s).`);
          NODE

      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          if [[ -f reports/portal-quality-gate/audit.md ]]; then
            cat reports/portal-quality-gate/audit.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Portal audit report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f reports/release-readiness/release-readiness.md ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat reports/release-readiness/release-readiness.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Release readiness report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f reports/portal-quality-gate/bpp-patched/manifest.json ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## BPP patch package" >> "$GITHUB_STEP_SUMMARY"
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('reports/portal-quality-gate/bpp-patched/manifest.json', 'utf8'));
          console.log(`- Canonical URL: https://bpp.is/`);
          console.log(`- Prepared files: ${manifest.files.length}`);
          console.log(`- Mode: generated artifact only; repository and production are unchanged`);
          NODE
          fi

      - name: Update pull request audit comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- gnk-asg-portal-quality-gate -->';
            let body = `${marker}\n`;
            if (fs.existsSync('reports/portal-quality-gate/audit.md')) {
              body += fs.readFileSync('reports/portal-quality-gate/audit.md', 'utf8');
            } else {
              body += '# GNK ASG Portal Quality Gate\n\nAudit report was not generated.\n';
            }
            if (fs.existsSync('reports/release-readiness/release-readiness.md')) {
              body += `\n\n${fs.readFileSync('reports/release-readiness/release-readiness.md', 'utf8')}`;
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const existing = comments.find(comment => comment.body && comment.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Upload audit reports and patch package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-quality-gate-${{ github.run_id }}
          path: |
            reports/portal-quality-gate
            reports/release-readiness
          if-no-files-found: warn
          retention-days: 14
