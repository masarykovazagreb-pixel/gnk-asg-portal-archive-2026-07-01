name: Portal quality gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/portal/**"
      - "tools/portal-quality-gate.mjs"
      - ".github/workflows/portal-quality-gate.yml"
      - ".quality-gate-enforced"
  push:
    branches:
      - main
    paths:
      - "apps/portal/**"
      - "tools/portal-quality-gate.mjs"
      - ".github/workflows/portal-quality-gate.yml"
      - ".quality-gate-enforced"

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate audit script syntax
        run: node --check tools/portal-quality-gate.mjs

      - name: Audit portal
        shell: bash
        run: |
          MODE=""
          if [[ -f .quality-gate-enforced ]]; then
            MODE="--strict"
          fi
          node tools/portal-quality-gate.mjs \
            --root apps/portal \
            --out reports/portal-quality-gate \
            $MODE

      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          if [[ -f reports/portal-quality-gate/audit.md ]]; then
            cat reports/portal-quality-gate/audit.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Portal audit report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Update pull request audit comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- gnk-asg-portal-quality-gate -->';
            const reportPath = 'reports/portal-quality-gate/audit.md';
            const report = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8').slice(0, 60000)
              : 'Portal audit report was not generated.';
            const body = `${marker}\n${report}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-quality-gate
          path: reports/portal-quality-gate
          if-no-files-found: warn
          retention-days: 30
