name: Knowledge Center Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/portal/data/knowledge-base.json'
      - 'apps/portal/knowledge-center/**'
      - 'apps/portal/en/knowledge-center/**'
      - 'workers/gnk-asg-operator-center/src/index.js'
      - 'scripts/generate-en-knowledge-center-v1.mjs'
      - 'scripts/knowledge-center-hr-sync-v1.mjs'
      - 'scripts/build-s-chat-context-suggest-v1.mjs'
      - 'apps/portal/data/s-chat-context-suggest-v1.json'
      - 'workers/gnk-asg-direct-operator/src/chat-retrieval-v1.js'
      - 'tests/test-s-chat-context-suggest-v1.mjs'
      - 'scripts/validate-knowledge-center-v1.mjs'
      - '.github/workflows/knowledge-center-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Reproduce EN Knowledge Center
        run: |
          set -euo pipefail
          node scripts/generate-en-knowledge-center-v1.mjs
          # Objavljena stranica nosi iste slojeve kao i ostale stranice, istim redoslijedom kao sync-all-v1 (traka, dizajn, kartice, impresum, osvježavanje, entity).
          node scripts/apply-house-ribbon-v1.mjs
          node scripts/apply-design-tokens-v1.mjs
          node scripts/apply-social-card-meta-v1.mjs
          node scripts/apply-author-band-v1.mjs
          node scripts/apply-impressum-v1.mjs --refresh --icon
          node scripts/apply-refresh-v1.mjs
          node scripts/apply-network-entity-v1.mjs
          # Tvornički standard (vidljivi nazivi, hashtagovi, radio blok) nakon generatora, kao u sync-all i test-all.
          python3 scripts/factory/apply_standard.py
          python3 scripts/factory/radio_promo_v1.py
      - name: Verify generated page is committed
        run: git diff --exit-code -- apps/portal/en/knowledge-center/index.html
      - name: Validate parity, truth and route ownership
        run: node scripts/validate-knowledge-center-v1.mjs
      - name: HR Knowledge Center must carry every question from the base
        run: node scripts/knowledge-center-hr-sync-v1.mjs --check
      - name: Reproduce S+Chat page suggestions
        run: node scripts/build-s-chat-context-suggest-v1.mjs
      - name: Verify page suggestions are committed
        run: git diff --exit-code -- apps/portal/data/s-chat-context-suggest-v1.json
      - name: Validate S+Chat page suggestions
        run: node tests/test-s-chat-context-suggest-v1.mjs
