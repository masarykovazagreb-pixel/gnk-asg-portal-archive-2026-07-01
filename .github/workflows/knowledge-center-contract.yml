name: Knowledge Center Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/portal/data/knowledge-base.json'
      - 'apps/portal/knowledge-center/**'
      - 'apps/portal/en/knowledge-center/**'
      - 'workers/gnk-asg-operator-center/src/index.js'
      - 'scripts/generate-en-knowledge-center-v1.mjs'
      - 'scripts/validate-knowledge-center-v1.mjs'
      - '.github/workflows/knowledge-center-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Reproduce EN Knowledge Center
        run: node scripts/generate-en-knowledge-center-v1.mjs
      - name: Verify generated page is committed
        run: git diff --exit-code -- apps/portal/en/knowledge-center/index.html
      - name: Validate parity, truth and route ownership
        run: node scripts/validate-knowledge-center-v1.mjs
