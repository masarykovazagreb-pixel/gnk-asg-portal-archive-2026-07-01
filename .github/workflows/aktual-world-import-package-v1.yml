name: AKTUAL WORLD 201 — verified source package import
on:
  push:
    branches:
      - feature/aktual-media-world-201
    paths:
      - 'ops/imports/aktual-world-source.tar.xz'
      - '.github/workflows/aktual-world-import-package-v1.yml'
permissions:
  contents: write
concurrency:
  group: aktual-world-201-import
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aktual-media-world-201
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable archive checksum and permitted paths
        run: |
          set -euo pipefail
          archive=ops/imports/aktual-world-source.tar.xz
          if [ ! -f "$archive" ]; then
            echo "Archive already materialized; nothing to do."
            exit 0
          fi
          echo "0bcfd71039dca257242ffc343144cd602bbd3b567518d8da11e0c18b39180790  $archive" | sha256sum --check
          python3 - <<'PY'
          import tarfile
          expected = {
              '.github/workflows/aktual-world-source-refresh-v1.yml',
              'README-AKTUAL-WORLD-201.md',
              'scripts/build-aktual-world-v1.mjs',
              'scripts/generate-world-countries-v1.mjs',
              'scripts/refresh-aktual-world-headlines-v1.mjs',
              'tests/test-aktual-world-v1.mjs',
          }
          with tarfile.open('ops/imports/aktual-world-source.tar.xz','r:xz') as tar:
              members = tar.getmembers()
              assert len(members) == len(expected)
              assert {m.name for m in members} == expected
              assert all(m.isfile() and not m.issym() and not m.islnk() and m.size < 100000 for m in members)
          PY
          for p in .github/workflows/aktual-world-source-refresh-v1.yml README-AKTUAL-WORLD-201.md scripts/build-aktual-world-v1.mjs scripts/generate-world-countries-v1.mjs scripts/refresh-aktual-world-headlines-v1.mjs tests/test-aktual-world-v1.mjs apps/portal/data/world-countries-v1.json; do
            test ! -e "$p" || { echo "::error::Import conflicts with existing file $p"; exit 1; }
          done
      - name: Extract approved sources, generate countries and static site
        run: |
          set -euo pipefail
          if [ ! -f ops/imports/aktual-world-source.tar.xz ]; then exit 0; fi
          tar -xJf ops/imports/aktual-world-source.tar.xz
          node --check scripts/generate-world-countries-v1.mjs
          node --check scripts/build-aktual-world-v1.mjs
          node --check scripts/refresh-aktual-world-headlines-v1.mjs
          node scripts/generate-world-countries-v1.mjs
          AKTUAL_WORLD_OUT=apps/portal/gnk-aktual node scripts/build-aktual-world-v1.mjs --base https://gnk-asg.hr/gnk-aktual/
          node --test tests/test-aktual-world-v1.mjs
          python3 - <<'PY'
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET
          root=Path('apps/portal/gnk-aktual')
          data=json.loads(Path('apps/portal/data/world-countries-v1.json').read_text())
          assert len(data['countries'])==201 and len(data['cities'])==10
          for i in data['countries']:
              p=root/'media'/i['slug']
              assert (p/'index.html').is_file()
              ET.parse(p/'feed.xml')
          for i in data['cities']:
              p=root/'grad'/i['slug']
              assert (p/'index.html').is_file()
              ET.parse(p/'feed.xml')
          ET.parse(root/'media'/'sitemap.xml')
          print('Verified 201 countries, 10 cities, 211 RSS feeds and sitemap.')
          PY
      - name: Commit verified generated files to the feature branch, without deploying
        run: |
          set -euo pipefail
          if [ ! -f ops/imports/aktual-world-source.tar.xz ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The default GITHUB_TOKEN cannot push a newly introduced workflow file.
          # Stage it separately with the authorized GitHub connection after import.
          git add README-AKTUAL-WORLD-201.md scripts/build-aktual-world-v1.mjs scripts/generate-world-countries-v1.mjs scripts/refresh-aktual-world-headlines-v1.mjs tests/test-aktual-world-v1.mjs apps/portal/data/world-countries-v1.json apps/portal/gnk-aktual/media apps/portal/gnk-aktual/grad
          git rm ops/imports/aktual-world-source.tar.xz
          git commit -m 'feat(aktual-media): materialize reviewed 201-country 10-city source index'
          git push origin HEAD:feature/aktual-media-world-201
