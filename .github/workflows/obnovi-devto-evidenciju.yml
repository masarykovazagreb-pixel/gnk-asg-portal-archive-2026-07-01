name: Obnovi evidenciju s Dev.to (jednokratno)

on:
  workflow_dispatch:
    inputs:
      devto_key:
        description: "kljuc"
        required: true
        type: string

permissions:
  contents: write

jobs:
  obnovi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Maskiraj
        run: echo "::add-mask::${{ inputs.devto_key }}"
      - name: Broj i popis
        env:
          DEVTO_KEY: ${{ inputs.devto_key }}
        run: |
          mkdir -p apps/portal/data/tmp-devto-count
          curl -s "https://dev.to/api/articles/me/all?per_page=1000" -H "api-key: $DEVTO_KEY" -o apps/portal/data/tmp-devto-count/svi.json
          python3 << 'PYEOF' > apps/portal/data/tmp-devto-count/broj.txt
          import json
          d = json.load(open("apps/portal/data/tmp-devto-count/svi.json"))
          print("ukupno:", len(d))
          for a in sorted(d, key=lambda x: x["published_at"], reverse=True)[:10]:
              print(a["published_at"], "|", a["title"])
          PYEOF
          cat apps/portal/data/tmp-devto-count/broj.txt
      - name: Commit
        run: |
          git config user.name "gnk-asg-bot"
          git config user.email "it@gnk-asg.hr"
          BRANCH="devto-count-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-devto-count
          git commit -m "count"
          git push origin "$BRANCH"
