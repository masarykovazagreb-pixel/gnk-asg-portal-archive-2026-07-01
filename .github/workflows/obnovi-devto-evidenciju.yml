name: Obnovi evidenciju s Dev.to (jednokratno)

on:
  workflow_dispatch:
    inputs:
      devto_key:
        description: "Dev.to API kljuc - samo za ovo pokretanje"
        required: true
        type: string

permissions:
  contents: write

jobs:
  obnovi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Maskiraj kljuc
        run: echo "::add-mask::${{ inputs.devto_key }}"
      - name: Popis svih objava na racunu
        env:
          DEVTO_KEY: ${{ inputs.devto_key }}
        run: |
          mkdir -p apps/portal/data/tmp-popis-final
          curl -s "https://dev.to/api/articles/me/all?per_page=1000" -H "api-key: $DEVTO_KEY" -o apps/portal/data/tmp-popis-final/svi.json
          python3 << 'PYEOF' > apps/portal/data/tmp-popis-final/rezultat.txt
          import json
          d = json.load(open('apps/portal/data/tmp-popis-final/svi.json'))
          print('ukupno:', len(d))
          for a in d:
              print(a['id'], '|', a.get('canonical_url'), '|', a['title'])
          PYEOF
          cat apps/portal/data/tmp-popis-final/rezultat.txt
      - name: Commit na jedinstvenu granu
        run: |
          git config user.name "gnk-asg-bot"
          git config user.email "it@gnk-asg.hr"
          BRANCH="popis-final2-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-popis-final/rezultat.txt
          git commit -m "popis final 2"
          git push origin "$BRANCH"
