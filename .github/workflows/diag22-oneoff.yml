name: Check autoreply audit log via KV (one-off)
on:
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query KV for autoreply audit
        run: |
          CF_TOKEN="cfut_RQcfszqhP9EYO7NmPjgWRjrklpw9pCN4e89DjKXL42804731"
          ACCOUNT_ID="1728309632b4e7be93fba322822905da"
          NAMESPACE_ID="d6f5dac9fa034d8d813db0de44eb7b1b"
          echo "# Autoreply audit KV check $(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/d.md
          echo '```' >> /tmp/d.md
          echo "--- mail:autoreply:last ---" >> /tmp/d.md
          curl -s "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/storage/kv/namespaces/$NAMESPACE_ID/values/mail:autoreply:last" -H "Authorization: Bearer $CF_TOKEN" >> /tmp/d.md
          echo "" >> /tmp/d.md
          echo "--- mail:autoreply:audit:v2 (first 3000 chars) ---" >> /tmp/d.md
          curl -s "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/storage/kv/namespaces/$NAMESPACE_ID/values/mail:autoreply:audit:v2" -H "Authorization: Bearer $CF_TOKEN" | head -c 3000 >> /tmp/d.md
          echo '```' >> /tmp/d.md
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" --title "Autoreply audit KV check $(date -u +%Y-%m-%dT%H:%M:%SZ)" --body-file /tmp/d.md
