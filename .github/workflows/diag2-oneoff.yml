name: Diagnose live menu script + css (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live index.html for which menu script tag is present
        run: |
          echo "# Live menu diagnostic $(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/d.md
          curl -s "https://gnk-asg.hr/?vb=$(date +%s)" -o /tmp/index.html
          echo "" >> /tmp/d.md
          echo "## script/link tags mentioning menu" >> /tmp/d.md
          grep -oE '<(script|link)[^>]*(menu|app\.js)[^>]*>' /tmp/index.html >> /tmp/d.md || echo "none found" >> /tmp/d.md
          echo "" >> /tmp/d.md
          echo "## header markup snippet" >> /tmp/d.md
          grep -oE '<header[^>]*>.{0,300}' /tmp/index.html | head -c 1200 >> /tmp/d.md

      - name: Check live compact-menu-v1.js content
        run: |
          curl -s "https://gnk-asg.hr/assets/public-compact-menu-v1.js?vb=$(date +%s)" -o /tmp/compact.js
          echo "" >> /tmp/d.md
          echo "## compact-menu-v1.js nav background rule" >> /tmp/d.md
          grep -oE '#gnk-unified-menu nav\{background:[^;]*' /tmp/compact.js >> /tmp/d.md || echo "not found" >> /tmp/d.md
          echo "" >> /tmp/d.md
          echo "## compact-menu-v1.js header background rule" >> /tmp/d.md
          grep -oE '#gnk-unified-header\{[^}]*background:rgba\([^)]*\)' /tmp/compact.js >> /tmp/d.md || echo "not found" >> /tmp/d.md

      - name: Check live public-unified-menu-v6.css nav rule
        run: |
          curl -s "https://gnk-asg.hr/assets/public-unified-menu-v6.css?vb=$(date +%s)" -o /tmp/v6.css
          echo "" >> /tmp/d.md
          echo "## v6.css nav dropdown background" >> /tmp/d.md
          grep -oE '#gnk-unified-menu nav\{background:[^;]*' /tmp/v6.css >> /tmp/d.md || echo "not found" >> /tmp/d.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" --title "Live menu diagnostic $(date -u +%Y-%m-%dT%H:%M:%SZ)" --body-file /tmp/d.md
