name: One-Time Approved Deploy 77de

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-approved-deploy-77de.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: one-time-approved-deploy-77de
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exact approved production SHA
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: 77de10c2c448457c5ef3db7fda42388c4f114ab6
        run: |
          set -euo pipefail
          test "$APPROVED_SHA" = "77de10c2c448457c5ef3db7fda42388c4f114ab6"
          gh workflow run deploy-admin-auth-v6.yml \
            --repo beckuphome-gnk/gnk-asg-portal \
            --ref main \
            -f confirm_production_deploy=DEPLOY_ADMIN_AUTH_V6 \
            -f approved_sha="$APPROVED_SHA"
          echo "Dispatched one-time approved production deploy for $APPROVED_SHA"
