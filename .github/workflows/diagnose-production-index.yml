name: Diagnose Production Index Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/portal/**"
      - "scripts/validate-minimum-index-contact-admin.mjs"
      - ".github/workflows/diagnose-production-index.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate current Index Contact and Admin contract
        run: node scripts/validate-minimum-index-contact-admin.mjs
