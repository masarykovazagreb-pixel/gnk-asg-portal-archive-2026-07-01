name: Diagnose Current Portal Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/portal/**'
      - 'workers/gnk-asg-direct-operator/**'
      - 'scripts/validate-minimum-index-contact-admin.mjs'
      - 'scripts/verify-public-redesign-contract.mjs'
      - '.github/workflows/diagnose-production-index.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate current Index Contact Admin and Campaign Mailer
        run: node scripts/validate-minimum-index-contact-admin.mjs
      - name: Validate protected backend preservation contract
        run: node scripts/verify-public-redesign-contract.mjs
