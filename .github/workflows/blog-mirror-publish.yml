name: Blog Mirror Publish

# GNK ASG je kanonski izvor. Blogger, Dev.to, Tumblr i Telegraph su kontrolirani distribucijski kanali.
# Jedan workflow upravlja sva cetiri izlaza kako bi se izbjegli paralelni writeri,
# duplikati i razlicita stanja evidencije. Svaka platforma zadrzava vlastiti
# published.json i skripta nikad ponovno ne salje vec evidentiranu rutu.
# Durable publish state zivi na automation/blog-mirror-state grani kako bot
# state commitovi ne bi pomicali produkcijski main i rusili exact-SHA deploy prozor.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/portal/data/editorial-featured.json'
      - 'apps/portal/data/editorial-registry.json'
      - 'scripts/lib/publication-gate-v2.mjs'
      - '.github/workflows/blog-mirror-publish.yml'
  schedule:
    - cron: '30 9 * * *'

permissions:
  contents: write

concurrency:
  group: blog-mirror-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Distribute published articles to Blogger, Dev.to, Tumblr and Telegraph
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_PUBLISH_THROUGH: '2026-10-01'
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
      TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
      TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
      TUMBLR_TOKEN: ${{ secrets.TUMBLR_TOKEN }}
      TUMBLR_TOKEN_SECRET: ${{ secrets.TUMBLR_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sync latest main and restore durable mirror state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gnk-blog-bot"
          git config user.email "actions@github.com"
          git fetch origin main --no-tags
          git reset --hard origin/main
          git fetch origin automation/blog-mirror-state:refs/remotes/origin/automation/blog-mirror-state --no-tags 2>/dev/null || true
          remote_state_sha="$(git rev-parse refs/remotes/origin/automation/blog-mirror-state 2>/dev/null || true)"
          echo "BLOG_MIRROR_REMOTE_SHA=$remote_state_sha" >> "$GITHUB_ENV"
          git checkout -B automation/blog-mirror-state origin/main

          restore_state() {
            path="$1"
            tmp="${path}.state-tmp"
            mkdir -p "$(dirname "$path")"
            rm -f "$tmp"
            if git show "refs/remotes/origin/automation/blog-mirror-state:${path}" > "$tmp" 2>/dev/null \
              && node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$tmp" 2>/dev/null; then
              mv "$tmp" "$path"
              echo "Restored durable state: $path"
              return 0
            fi
            rm -f "$tmp"
            if git show "a13f0ba51:${path}" > "$tmp" 2>/dev/null \
              && node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$tmp" 2>/dev/null; then
              mv "$tmp" "$path"
              echo "Recovered durable state from last known-good checkpoint: $path"
              return 0
            fi
            rm -f "$tmp"
            echo "No valid historical state for $path; keeping current-main copy."
          }

          restore_state apps/portal/data/blog-content/published.json
          restore_state apps/portal/data/devto-content/published.json
          restore_state apps/portal/data/tumblr-content/published.json
          restore_state apps/portal/data/telegraph-content/published.json
          restore_state apps/portal/data/telegraph-content/account.json

          echo "Mirror state branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "Release main remains: $(git rev-parse origin/main)"

      - name: Check distribution credentials without exposing values
        shell: bash
        run: |
          set -euo pipefail
          blogger=ok
          devto=ok
          tumblr=ok
          for v in BLOGGER_BLOG_ID BLOGGER_CLIENT_ID BLOGGER_CLIENT_SECRET BLOGGER_REFRESH_TOKEN; do
            [ -n "${!v:-}" ] || blogger=missing
          done
          [ -n "${DEVTO_API_KEY:-}" ] || devto=missing
          for v in TUMBLR_CONSUMER_KEY TUMBLR_CONSUMER_SECRET TUMBLR_TOKEN TUMBLR_TOKEN_SECRET; do
            [ -n "${!v:-}" ] || tumblr=missing
          done
          echo "BLOGGER_CREDENTIAL_STATE=$blogger" >> "$GITHUB_ENV"
          echo "DEVTO_CREDENTIAL_STATE=$devto" >> "$GITHUB_ENV"
          echo "TUMBLR_CREDENTIAL_STATE=$tumblr" >> "$GITHUB_ENV"
          if [ "$blogger" != ok ] || [ "$devto" != ok ] || [ "$tumblr" != ok ]; then
            echo "PARITY_BLOCKED=1" >> "$GITHUB_ENV"
          else
            echo "PARITY_BLOCKED=0" >> "$GITHUB_ENV"
          fi
          printf 'Credential state: Blogger=%s Dev.to=%s Tumblr=%s\n' "$blogger" "$devto" "$tumblr"

      - name: Build unified priority distribution registry overlay
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const registryPath='apps/portal/data/editorial-registry.json';
          const featuredPath='apps/portal/data/editorial-featured.json';
          const read=(p,f)=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return f}};
          const registry=read(registryPath,{items:[]});
          const featured=read(featuredPath,{items:[]});
          const priorityEpoch='1970-01-01T00:00:00.000Z';
          const combined=[];
          const seen=new Set();
          for(const source of [featured.items||[],registry.items||[]]){
            for(const raw of source){
              if(!raw?.path||seen.has(raw.path)) continue;
              seen.add(raw.path);
              const item={...raw};
              if(raw.priority===true){
                item.distributionOriginalPublishedAt=raw.publishedAt||raw.datePublished||null;
                item.publishedAt=priorityEpoch;
              }
              combined.push(item);
            }
          }
          const overlay={...registry,version:String(registry.version||'GNK_ASG_EDITORIAL_REGISTRY')+'+FEATURED_DISTRIBUTION_OVERLAY',distributionOverlay:true,items:combined};
          fs.writeFileSync(registryPath,JSON.stringify(overlay,null,2)+'\n');
          console.log(`Unified distribution overlay: featured=${(featured.items||[]).length}, registry=${(registry.items||[]).length}, deduped=${combined.length}, priority=${combined.filter(x=>x.priority===true).length}`);
          NODE
          # Overlay je samo radni input ovog joba. Git state korak namjerno ne dodaje editorial-registry.json,
          # pa se kanonski publishedAt i registry na mainu ne mijenjaju.

      - name: Blogger mirror - verification / small catch-up
        id: blogger_publish
        if: env.BLOGGER_CREDENTIAL_STATE == 'ok'
        continue-on-error: true
        env:
          BLOG_PER_RUN: '2'
          BLOG_PAUSE_MS: '15000'
          BLOG_MAX_ATTEMPTS: '1'
          BLOG_BACKOFF_MS: '60000'
        run: node scripts/blog-publish-resilient-v1.mjs

      - name: Dev.to mirror - accelerated English catch-up
        id: devto_publish
        if: env.DEVTO_CREDENTIAL_STATE == 'ok'
        continue-on-error: true
        env:
          DEVTO_PER_RUN: '120'
          DEVTO_PAUSE_MS: '10000'
        run: node scripts/devto-publish-v1.mjs --live

      - name: Tumblr mirror - verification / small catch-up
        id: tumblr_publish
        if: env.TUMBLR_CREDENTIAL_STATE == 'ok'
        continue-on-error: true
        env:
          TUMBLR_PER_RUN: '2'
          TUMBLR_PAUSE_MS: '3000'
        run: node scripts/tumblr-publish-v1.mjs --live

      - name: Telegraph mirror - accelerated catch-up
        id: telegraph_publish
        continue-on-error: true
        env:
          TELEGRAPH_PER_RUN: '180'
          TELEGRAPH_PAUSE_MS: '2000'
        run: node scripts/telegraph-publish-v1.mjs

      - name: Write four-channel parity health
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const read=(p,f)=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return f}};
          const registry=read('apps/portal/data/editorial-registry.json',{items:[]});
          const blog=read('apps/portal/data/blog-content/published.json',{posted:{}});
          const devto=read('apps/portal/data/devto-content/published.json',{posted:{}});
          const tumblr=read('apps/portal/data/tumblr-content/published.json',{posted:{}});
          const telegraph=read('apps/portal/data/telegraph-content/published.json',{posted:{}});
          const countState=(v)=>Array.isArray(v)?v.length:(v&&v.posted?Object.keys(v.posted).length:(v&&v.items?Object.keys(v.items).length:Object.keys(v||{}).length));
          const health={
            version:'GNK_ASG_FOUR_BLOG_PARITY_V6_FEATURED_OVERLAY',
            generatedAt:new Date().toISOString(),
            canonicalSource:'https://gnk-asg.hr',
            registryTotal:(registry.items||[]).length,
            channels:{
              blogger:{credentials:process.env.BLOGGER_CREDENTIAL_STATE||'unknown',published:countState(blog)},
              devto:{credentials:process.env.DEVTO_CREDENTIAL_STATE||'unknown',published:countState(devto)},
              tumblr:{credentials:process.env.TUMBLR_CREDENTIAL_STATE||'unknown',published:countState(tumblr)},
              telegraph:{credentials:'self-bootstrap',published:countState(telegraph)}
            },
            policy:{singleWriter:true,dedupeByPlatformState:true,featuredParity:true,priorityFirst:true,canonicalBacklinkRequired:true,stateBranch:'automation/blog-mirror-state',mainWrites:false,stateSync:'validated-overlay-force-with-lease-and-union-retry'}
          };
          const out='apps/portal/data/blog-content/parity.json';
          fs.mkdirSync(path.dirname(out),{recursive:true});
          fs.writeFileSync(out,JSON.stringify(health,null,2)+'\n');
          console.log(JSON.stringify(health,null,2));
          NODE

      - name: Publish distribution summary
        if: always()
        shell: bash
        run: |
          echo '## GNK ASG — Blogger / Dev.to / Tumblr / Telegraph (4/4)' >> "$GITHUB_STEP_SUMMARY"
          echo "- Blogger credentials: **${BLOGGER_CREDENTIAL_STATE:-unknown}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dev.to credentials: **${DEVTO_CREDENTIAL_STATE:-unknown}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tumblr credentials: **${TUMBLR_CREDENTIAL_STATE:-unknown}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Telegraph: **self-bootstrap**" >> "$GITHUB_STEP_SUMMARY"
          if [ -s apps/portal/data/blog-content/health.json ]; then
            node -e "const fs=require('fs'); try { const h=JSON.parse(fs.readFileSync('apps/portal/data/blog-content/health.json','utf8')); console.log('- Blogger pending after run: **'+h.pending+'**') } catch { console.log('- Blogger health JSON: **unavailable**') }" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '- Featured priority overlay: **enabled for all four channels**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Canonical source: **https://gnk-asg.hr**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Durable state branch: **automation/blog-mirror-state**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Direct writes to production main: **disabled**' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit distribution state outside production main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "automation/blog-mirror-state"
          git config user.name "gnk-blog-bot"
          git config user.email "actions@github.com"
          git add apps/portal/data/blog-content/ apps/portal/data/devto-content/ apps/portal/data/tumblr-content/ apps/portal/data/telegraph-content/ || true
          if git diff --cached --quiet; then
            echo "Nema promjena za spremanje."
          else
            git commit -m "Blog distribution state: accelerated four-channel catch-up"
          fi

          expected="${BLOG_MIRROR_REMOTE_SHA:-}"
          lease="--force-with-lease=refs/heads/automation/blog-mirror-state:${expected}"
          if git push "$lease" origin HEAD:automation/blog-mirror-state; then
            echo "Mirror state spremljen uz lease zaštitu."
          else
            echo "Remote state se promijenio tijekom runa; radim union statea i jedan sigurni retry."
            git fetch origin automation/blog-mirror-state:refs/remotes/origin/automation/blog-mirror-state --force --no-tags
            latest="$(git rev-parse refs/remotes/origin/automation/blog-mirror-state)"
            for state in \
              apps/portal/data/blog-content/published.json \
              apps/portal/data/devto-content/published.json \
              apps/portal/data/tumblr-content/published.json \
              apps/portal/data/telegraph-content/published.json; do
              remote_tmp="/tmp/remote-$(echo "$state" | tr '/' '_')"
              if git show "refs/remotes/origin/automation/blog-mirror-state:${state}" > "$remote_tmp" 2>/dev/null; then
                node - "$remote_tmp" "$state" <<'NODE'
          const fs=require('fs');
          const [remotePath,localPath]=process.argv.slice(2);
          const read=(p)=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return {posted:{}}}};
          const remote=read(remotePath), local=read(localPath);
          const merged={...remote,...local,posted:{...(remote.posted||{}),...(local.posted||{})}};
          fs.writeFileSync(localPath,JSON.stringify(merged,null,2)+'\n');
          NODE
              fi
            done
            git add apps/portal/data/blog-content/ apps/portal/data/devto-content/ apps/portal/data/tumblr-content/ apps/portal/data/telegraph-content/ || true
            if git diff --cached --quiet; then
              echo "Union nije dodao promjene."
            else
              git commit --amend --no-edit
            fi
            git push "--force-with-lease=refs/heads/automation/blog-mirror-state:${latest}" origin HEAD:automation/blog-mirror-state
            echo "Mirror state spremljen nakon union retryja."
          fi

          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$remote_main"
          echo "Production main remote je $remote_main; ovaj korak pise iskljucivo na automation/blog-mirror-state."

      - name: Enforce four-channel operational result
        if: always()
        env:
          BLOGGER_OUTCOME: ${{ steps.blogger_publish.outcome }}
          DEVTO_OUTCOME: ${{ steps.devto_publish.outcome }}
          TUMBLR_OUTCOME: ${{ steps.tumblr_publish.outcome }}
          TELEGRAPH_OUTCOME: ${{ steps.telegraph_publish.outcome }}
        shell: bash
        run: |
          if [ "${PARITY_BLOCKED:-1}" = 1 ]; then
            echo "Distribucija nije potpuno automatizirana: najmanje jedan credentialed kanal nema trajne GitHub Actions credentials."
            exit 1
          fi
          failed=0
          for result in "$BLOGGER_OUTCOME" "$DEVTO_OUTCOME" "$TUMBLR_OUTCOME" "$TELEGRAPH_OUTCOME"; do
            [ "$result" = failure ] && failed=1
          done
          if [ "$failed" = 1 ]; then
            echo "Najmanje jedan kanal imao je operativni neuspjeh; ostali kanali su ipak odradjeni i state je sacuvan."
            exit 1
          fi
          echo "Sva četiri kanala odradila su isti publication-gated single-writer ciklus."
