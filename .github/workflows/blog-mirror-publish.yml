name: Blog Mirror Publish

# Svaki objavljeni tekst prenosi se i na blog. Radi u minuti 30, deset minuta
# nakon objave uredničkog sadržaja, pa je red uvijek svjež.
#
# Dok tajne za blog nisu postavljene, radi u načinu pripreme: objave se slože
# i spreme u red, ali se ne šalju. Ništa ne puca i ništa se ne gubi.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 * * * *'

permissions:
  contents: write

concurrency:
  group: blog-mirror-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Mirror published articles to the blog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync with latest main
        run: git pull --rebase --autostash origin main

      - name: Mirror to blog
        continue-on-error: true
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: node scripts/blog-publish-v1.mjs --live

      # Drugi zakazani poslovi commitaju u main gotovo neprekidno, pa jedan
      # pokusaj spremanja redovito zavrsi na zastarjelom SHA. Zato tri pokusaja
      # s ponovnim povlacenjem izmedju.
      - name: Commit queue and state
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "gnk-blog-bot"
          git config user.email "actions@github.com"
          git add apps/portal/data/blog-content/queue.json apps/portal/data/blog-content/published.json || true
          if git diff --cached --quiet; then
            echo "Nema promjena za spremanje."
            exit 0
          fi
          git commit -m "Blog mirror: refresh queue and published state"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Spremljeno iz $i. pokusaja."
              exit 0
            fi
            echo "Push odbijen, povlacim i ponavljam ($i/3)..."
            git pull --rebase --autostash origin main || true
            sleep 5
          done
          echo "Spremanje nije uspjelo nakon tri pokusaja."
          exit 1
