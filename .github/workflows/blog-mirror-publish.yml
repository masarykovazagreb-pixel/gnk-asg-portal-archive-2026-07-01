name: Blog Mirror Publish

# Portal je izvor, Blogger/Aktual Media je kontrolirana preslika.
# Objave se salju u manjim paketima uz pauzu, ogranicen ponovni pokusaj i
# trajni health zapis. HTTP 429 vise nije skriven kao prividno zdravo izvrsenje.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 * * * *'

permissions:
  contents: write

concurrency:
  group: blog-mirror-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Mirror published articles to the blog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sync with latest main
        run: git pull --rebase --autostash origin main

      - name: Mirror to blog with quota-aware backoff
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOG_PER_RUN: '3'
          BLOG_PAUSE_MS: '15000'
          BLOG_MAX_ATTEMPTS: '2'
          BLOG_BACKOFF_MS: '60000'
        run: node scripts/blog-publish-resilient-v1.mjs

      - name: Publish mirror health summary
        if: always()
        run: |
          if [ -s apps/portal/data/blog-content/health.json ]; then
            node -e "const h=require('./apps/portal/data/blog-content/health.json'); console.log('## Aktual Media / Blogger mirror\n\n- Status: **'+h.conclusion+'**\n- Preostali red: **'+h.pending+'**\n- Pokusaji: **'+h.attempts.length+'**\n- Generirano: **'+h.generatedAt+'**\n')" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Aktual Media / Blogger mirror' >> "$GITHUB_STEP_SUMMARY"
            echo 'Health zapis nije proizveden.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit queue, state and health
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "gnk-blog-bot"
          git config user.email "actions@github.com"
          git add \
            apps/portal/data/blog-content/queue.json \
            apps/portal/data/blog-content/published.json \
            apps/portal/data/blog-content/health.json || true
          if git diff --cached --quiet; then
            echo "Nema promjena za spremanje."
            exit 0
          fi
          git commit -m "Blog mirror: refresh queue, state and health"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Spremljeno iz $i. pokusaja."
              exit 0
            fi
            echo "Push odbijen, povlacim i ponavljam ($i/3)..."
            git pull --rebase --autostash origin main || true
            sleep 5
          done
          echo "Spremanje nije uspjelo nakon tri pokusaja."
          exit 1
