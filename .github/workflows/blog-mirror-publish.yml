name: Blog Mirror Publish

# GNK ASG je kanonski izvor. Blogger, Dev.to i Tumblr su kontrolirane preslike.
# Jedan workflow upravlja sva tri izlaza kako bi se izbjegli paralelni writeri,
# duplikati i razlicita stanja evidencije. Svaka platforma zadrzava vlastiti
# published.json i skripta nikad ponovno ne salje vec evidentiranu rutu.
# Durable publish state zivi na automation/blog-mirror-state grani kako bot
# state commitovi ne bi pomicali produkcijski main i rusili exact-SHA deploy prozor.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/portal/data/editorial-featured.json'
      - 'apps/portal/data/editorial-registry.json'
      - '.github/workflows/blog-mirror-publish.yml'
  schedule:
    - cron: '30 9 * * *'

permissions:
  contents: write

concurrency:
  group: blog-mirror-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Mirror published articles to Blogger, Dev.to and Tumblr
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
      TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
      TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
      TUMBLR_TOKEN: ${{ secrets.TUMBLR_TOKEN }}
      TUMBLR_TOKEN_SECRET: ${{ secrets.TUMBLR_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sync latest main and restore durable mirror state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gnk-blog-bot"
          git config user.email "actions@github.com"
          git fetch origin main --no-tags
          git reset --hard origin/main
          git fetch origin automation/blog-mirror-state:refs/remotes/origin/automation/blog-mirror-state --no-tags 2>/dev/null || true
          git checkout -B automation/blog-mirror-state origin/main

          restore_state() {
            path="$1"
            tmp="${path}.state-tmp"
            mkdir -p "$(dirname "$path")"
            rm -f "$tmp"
            if git show "refs/remotes/origin/automation/blog-mirror-state:${path}" > "$tmp" 2>/dev/null \
              && node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$tmp" 2>/dev/null; then
              mv "$tmp" "$path"
              echo "Restored durable state: $path"
              return 0
            fi
            rm -f "$tmp"
            if git show "a13f0ba51:${path}" > "$tmp" 2>/dev/null \
              && node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$tmp" 2>/dev/null; then
              mv "$tmp" "$path"
              echo "Recovered durable state from last known-good checkpoint: $path"
              return 0
            fi
            rm -f "$tmp"
            echo "No valid historical state for $path; keeping current-main copy."
          }

          restore_state apps/portal/data/blog-content/published.json
          restore_state apps/portal/data/devto-content/published.json
          restore_state apps/portal/data/tumblr-content/published.json

          echo "Mirror state branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "Release main remains: $(git rev-parse origin/main)"

      - name: Check distribution credentials without exposing values
        shell: bash
        run: |
          set -euo pipefail
          blogger=ok
          devto=ok
          tumblr=ok
          for v in BLOGGER_BLOG_ID BLOGGER_CLIENT_ID BLOGGER_CLIENT_SECRET BLOGGER_REFRESH_TOKEN; do
            [ -n "${!v:-}" ] || blogger=missing
          done
          [ -n "${DEVTO_API_KEY:-}" ] || devto=missing
          for v in TUMBLR_CONSUMER_KEY TUMBLR_CONSUMER_SECRET TUMBLR_TOKEN TUMBLR_TOKEN_SECRET; do
            [ -n "${!v:-}" ] || tumblr=missing
          done
          echo "BLOGGER_CREDENTIAL_STATE=$blogger" >> "$GITHUB_ENV"
          echo "DEVTO_CREDENTIAL_STATE=$devto" >> "$GITHUB_ENV"
          echo "TUMBLR_CREDENTIAL_STATE=$tumblr" >> "$GITHUB_ENV"
          if [ "$blogger" != ok ] || [ "$devto" != ok ] || [ "$tumblr" != ok ]; then
            echo "PARITY_BLOCKED=1" >> "$GITHUB_ENV"
          else
            echo "PARITY_BLOCKED=0" >> "$GITHUB_ENV"
          fi
          printf 'Credential state: Blogger=%s Dev.to=%s Tumblr=%s\n' "$blogger" "$devto" "$tumblr"

      - name: Blogger mirror - quota aware catch-up
        if: env.BLOGGER_CREDENTIAL_STATE == 'ok'
        env:
          BLOG_PER_RUN: '10'
          BLOG_PAUSE_MS: '15000'
          BLOG_MAX_ATTEMPTS: '2'
          BLOG_BACKOFF_MS: '60000'
        run: node scripts/blog-publish-resilient-v1.mjs

      - name: Dev.to mirror - publish pending English routes
        if: env.DEVTO_CREDENTIAL_STATE == 'ok'
        env:
          DEVTO_PER_RUN: '16'
          DEVTO_PAUSE_MS: '10000'
        run: node scripts/devto-publish-v1.mjs --live

      - name: Tumblr mirror - publish pending English routes
        if: env.TUMBLR_CREDENTIAL_STATE == 'ok'
        env:
          TUMBLR_PER_RUN: '16'
          TUMBLR_PAUSE_MS: '3000'
        run: node scripts/tumblr-publish-v1.mjs --live

      - name: Write three-channel parity health
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const read=(p,f)=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return f}};
          const registry=read('apps/portal/data/editorial-registry.json',{items:[]});
          const blog=read('apps/portal/data/blog-content/published.json',{posted:{}});
          const devto=read('apps/portal/data/devto-content/published.json',{posted:{}});
          const tumblr=read('apps/portal/data/tumblr-content/published.json',{posted:{}});
          const countState=(v)=>Array.isArray(v)?v.length:(v&&v.posted?Object.keys(v.posted).length:(v&&v.items?Object.keys(v.items).length:Object.keys(v||{}).length));
          const health={
            version:'GNK_ASG_THREE_BLOG_PARITY_V3_STATE_OVERLAY',
            generatedAt:new Date().toISOString(),
            canonicalSource:'https://gnk-asg.hr',
            registryTotal:(registry.items||[]).length,
            channels:{
              blogger:{credentials:process.env.BLOGGER_CREDENTIAL_STATE||'unknown',published:countState(blog)},
              devto:{credentials:process.env.DEVTO_CREDENTIAL_STATE||'unknown',published:countState(devto)},
              tumblr:{credentials:process.env.TUMBLR_CREDENTIAL_STATE||'unknown',published:countState(tumblr)}
            },
            policy:{singleWriter:true,dedupeByPlatformState:true,canonicalBacklinkRequired:true,stateBranch:'automation/blog-mirror-state',mainWrites:false,stateSync:'validated-overlay-no-branch-merge'}
          };
          const out='apps/portal/data/blog-content/parity.json';
          fs.mkdirSync(path.dirname(out),{recursive:true});
          fs.writeFileSync(out,JSON.stringify(health,null,2)+'\n');
          console.log(JSON.stringify(health,null,2));
          NODE

      - name: Publish distribution summary
        if: always()
        shell: bash
        run: |
          echo '## GNK ASG — Blogger / Dev.to / Tumblr' >> "$GITHUB_STEP_SUMMARY"
          echo "- Blogger credentials: **${BLOGGER_CREDENTIAL_STATE:-unknown}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dev.to credentials: **${DEVTO_CREDENTIAL_STATE:-unknown}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tumblr credentials: **${TUMBLR_CREDENTIAL_STATE:-unknown}**" >> "$GITHUB_STEP_SUMMARY"
          if [ -s apps/portal/data/blog-content/health.json ]; then
            node -e "const fs=require('fs'); try { const h=JSON.parse(fs.readFileSync('apps/portal/data/blog-content/health.json','utf8')); console.log('- Blogger pending after run: **'+h.pending+'**') } catch { console.log('- Blogger health JSON: **unavailable**') }" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '- Canonical source: **https://gnk-asg.hr**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Durable state branch: **automation/blog-mirror-state**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Direct writes to production main: **disabled**' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit distribution state outside production main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "automation/blog-mirror-state"
          git config user.name "gnk-blog-bot"
          git config user.email "actions@github.com"
          git add apps/portal/data/blog-content/ apps/portal/data/devto-content/ apps/portal/data/tumblr-content/ || true
          if git diff --cached --quiet; then
            echo "Nema promjena za spremanje."
          else
            git commit -m "Blog mirror state: sync Blogger Dev.to Tumblr"
          fi
          git push origin HEAD:automation/blog-mirror-state
          test "$(git rev-parse origin/main)" = "$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "Mirror state spremljen bez pomicanja production main grane."

      - name: Enforce three-channel credential parity
        if: always()
        shell: bash
        run: |
          if [ "${PARITY_BLOCKED:-1}" = 1 ]; then
            echo "Distribucija nije potpuno automatizirana: najmanje jedan od tri kanala nema trajne GitHub Actions credentials."
            exit 1
          fi
          echo "Sva tri kanala imaju trajne credentials i odradila su isti single-writer ciklus."
