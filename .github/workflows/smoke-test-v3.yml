name: Puni smoke test v3 (jednokratno)
on: workflow_dispatch
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p apps/portal/data/tmp-smoke3
          for ruta in "/" "/en/" "/contact/" "/en/contact/" "/kontakt/" "/nermin-sefic/" "/en/nermin-sefic/" "/visual-index/" "/robots.txt" "/sitemap.xml" "/sitemap-index.xml" "/gnk-aktual/" "/objave/" "/komentari/" "/digital-workforce/"; do
            kod=$(curl -s -o /dev/null -w "%{http_code}" "https://gnk-asg.hr${ruta}")
            echo "${kod} ${ruta}" >> apps/portal/data/tmp-smoke3/r.txt
          done
          cat apps/portal/data/tmp-smoke3/r.txt
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          BRANCH="smoke3-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-smoke3
          git commit -m "smoke3"
          git push origin "$BRANCH"
