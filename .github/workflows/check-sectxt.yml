name: Provjeri security.txt
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p apps/portal/data/tmp-sectxt
          curl -s -o /dev/null -w "%{http_code}\n" "https://gnk-asg.hr/.well-known/security.txt" > apps/portal/data/tmp-sectxt/r.txt
          curl -s "https://gnk-asg.hr/.well-known/security.txt" >> apps/portal/data/tmp-sectxt/r.txt
          cat apps/portal/data/tmp-sectxt/r.txt
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          BRANCH="sectxt-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-sectxt
          git commit -m "check"
          git push origin "$BRANCH"
