name: Verify Public Shell V12

on:
  push:
    branches: [main]
    paths:
      - ".github/verify-public-shell-v12.trigger"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate public shell source
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/portal/assets/public-menu-final-v9.js
          node --check workers/gnk-asg-direct-operator/src/public-shell-v11.js
          node --check workers/gnk-asg-direct-operator/src/index-portal-final-v12.js
          test -s apps/portal/assets/gnk-asg-favicon.svg
          test -s apps/portal/assets/public-menu-unified-v12.css
          grep -q 'hideLegacyNavigation' apps/portal/assets/public-menu-final-v9.js
          grep -q 'GNK_ASG_PUBLIC_MENU_FINAL_V12' apps/portal/assets/public-menu-final-v9.js
          grep -q 'public-menu-unified-v12.css' workers/gnk-asg-direct-operator/src/public-shell-v11.js
          grep -q 'gnk-asg-favicon.svg' workers/gnk-asg-direct-operator/src/public-shell-v11.js

      - name: Verify public production shell
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://gnk-asg.hr"
          paths=(
            "/" "/en/" "/objave/" "/publications/" "/vijesti/" "/news/"
            "/trzista/" "/markets/" "/contact/" "/en/contact/" "/legal/" "/en/legal/"
            "/assistant/" "/en/assistant/" "/downloads/" "/en/downloads/" "/visual-index/"
            "/app/" "/status-automatizacije/" "/automation-status/"
          )

          success=false
          for attempt in $(seq 1 18); do
            failed=0
            : > results.tsv
            stamp=$(date +%s)

            version_code=$(curl -sSL -o version.json -w '%{http_code}' "$base/data/portal-version.json?cb=$stamp" || true)
            favicon_code=$(curl -sSL -D favicon.headers -o favicon.svg -w '%{http_code}' "$base/favicon.ico?cb=$stamp" || true)

            if [ "$version_code" != "200" ] || ! grep -q 'GNK_ASG_PUBLIC_MENU_FINAL_V12' version.json || ! grep -q 'GNK_ASG_FAVICON_V1' version.json; then
              failed=1
            fi
            if [ "$favicon_code" != "200" ] || ! grep -qi '^content-type: image/svg+xml' favicon.headers || ! grep -q '<svg' favicon.svg; then
              failed=1
            fi

            for path in "${paths[@]}"; do
              safe=$(printf '%s' "$path" | tr '/-' '__' | tr -cd '[:alnum:]_')
              [ -n "$safe" ] || safe="root"
              file="page-${safe}.html"
              code=$(curl -sSL -o "$file" -w '%{http_code}' "$base${path}?cb=$stamp" || true)
              menu=false; css=false; icon=false; body=false
              grep -q 'public-menu-final-v9.js?v=20260625-v12' "$file" && menu=true || true
              grep -q 'public-menu-unified-v12.css?v=20260625-v1' "$file" && css=true || true
              grep -q 'gnk-asg-favicon.svg?v=20260625-v1' "$file" && icon=true || true
              grep -q 'gnk-public-v12' "$file" && body=true || true
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$path" "$code" "$menu" "$css" "$icon" "$body" >> results.tsv
              if [ "$code" != "200" ] || [ "$menu" != "true" ] || [ "$css" != "true" ] || [ "$icon" != "true" ] || [ "$body" != "true" ]; then
                failed=1
              fi
            done

            if [ "$failed" = "0" ]; then
              success=true
              break
            fi
            sleep 10
          done

          export VERSION_CODE="$version_code" FAVICON_CODE="$favicon_code" SUCCESS="$success"
          node - <<'JS'
          const fs=require('fs');
          const rows=fs.readFileSync('results.tsv','utf8').trim().split('\n').filter(Boolean).map(line=>{
            const [path,http,menu,css,favicon,bodyClass]=line.split('\t');
            return {path,http:Number(http),menu:menu==='true',css:css==='true',favicon:favicon==='true',bodyClass:bodyClass==='true'};
          });
          const version=JSON.parse(fs.readFileSync('version.json','utf8'));
          const report={
            checkedAt:new Date().toISOString(),
            ok:process.env.SUCCESS==='true',
            version:version.version||null,
            publicMenu:version.publicMenu||null,
            faviconVersion:version.favicon||null,
            faviconHttp:Number(process.env.FAVICON_CODE||0),
            pages:rows
          };
          fs.writeFileSync('public-shell-result.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if(!report.ok)process.exit(1);
          JS

      - name: Post verification result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -f public-shell-result.json ]; then
            body=$(printf '## Public shell V12 verification\n\n```json\n%s\n```\n' "$(cat public-shell-result.json)")
          else
            body="## Public shell V12 verification\n\nProvjera nije proizvela strukturirani rezultat. Run: ${GITHUB_RUN_ID}"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/issues/63/comments" -f body="$body"
