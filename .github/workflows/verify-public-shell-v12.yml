name: Verify Public Shell V13

on:
  push:
    branches: [main]
    paths:
      - ".github/verify-public-shell-v12.trigger"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate V13 public shell source
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/portal/assets/public-menu-v13.js
          node --check workers/gnk-asg-direct-operator/src/public-shell-v11.js
          node --check workers/gnk-asg-direct-operator/src/index-portal-final-v12.js
          test -s apps/portal/assets/gnk-asg-favicon.svg
          test -s apps/portal/assets/public-visual-v13.css
          grep -q 'GNK_ASG_PUBLIC_MENU_V13' apps/portal/assets/public-menu-v13.js
          grep -q 'public-visual-v13.css' workers/gnk-asg-direct-operator/src/public-shell-v11.js
          grep -q 'rel="stylesheet" href="/assets/public-ux-v11.css' workers/gnk-asg-direct-operator/src/public-shell-v11.js
          grep -q 'gnk-asg-favicon.svg' workers/gnk-asg-direct-operator/src/public-shell-v11.js

      - name: Verify V13 public production shell
        shell: bash
        run: |
          set -euo pipefail
          base="https://gnk-asg.hr"
          paths=(
            "/" "/en/" "/objave/" "/publications/" "/vijesti/" "/news/"
            "/trzista/" "/markets/" "/contact/" "/en/contact/" "/legal/" "/en/legal/"
            "/assistant/" "/en/assistant/" "/downloads/" "/en/downloads/" "/visual-index/"
            "/app/" "/status-automatizacije/" "/automation-status/"
          )

          success=false
          for attempt in $(seq 1 18); do
            failed=0
            : > results.tsv
            stamp=$(date +%s)
            version_code=$(curl -sSL -o version.json -w '%{http_code}' "$base/data/portal-version.json?cb=$stamp" || true)
            favicon_code=$(curl -sSL -D favicon.headers -o favicon.svg -w '%{http_code}' "$base/favicon.ico?cb=$stamp" || true)

            if [ "$version_code" != "200" ] || ! grep -q 'GNK_ASG_PUBLIC_MENU_V13' version.json || ! grep -q 'GNK_ASG_PUBLIC_VISUAL_V13_20260625' version.json || ! grep -q 'GNK_ASG_FAVICON_V1' version.json; then
              failed=1
            fi
            if [ "$favicon_code" != "200" ] || ! grep -qi '^content-type: image/svg+xml' favicon.headers || ! grep -q '<svg' favicon.svg; then
              failed=1
            fi

            for path in "${paths[@]}"; do
              safe=$(printf '%s' "$path" | tr '/-' '__' | tr -cd '[:alnum:]_')
              [ -n "$safe" ] || safe="root"
              file="page-${safe}.html"
              code=$(curl -sSL -o "$file" -w '%{http_code}' "$base${path}?cb=$stamp" || true)
              menu=false; visual=false; ux=false; icon=false
              grep -q 'public-menu-v13.js?v=20260625-v13' "$file" && menu=true || true
              grep -q 'public-visual-v13.css?v=20260625-v13' "$file" && visual=true || true
              grep -q 'public-ux-v11.css?v=20260625-v12' "$file" && ux=true || true
              grep -q 'gnk-asg-favicon.svg?v=20260625-v1' "$file" && icon=true || true
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$path" "$code" "$menu" "$visual" "$ux" "$icon" >> results.tsv
              if [ "$code" != "200" ] || [ "$menu" != "true" ] || [ "$visual" != "true" ] || [ "$ux" != "true" ] || [ "$icon" != "true" ]; then
                failed=1
              fi
            done

            if [ "$failed" = "0" ]; then success=true; break; fi
            sleep 10
          done

          export VERSION_CODE="$version_code" FAVICON_CODE="$favicon_code" SUCCESS="$success"
          node - <<'JS'
          const fs=require('fs');
          const rows=fs.readFileSync('results.tsv','utf8').trim().split('\n').filter(Boolean).map(line=>{
            const [path,http,menu,visual,ux,favicon]=line.split('\t');
            return {path,http:Number(http),menu:menu==='true',visual:visual==='true',ux:ux==='true',favicon:favicon==='true'};
          });
          const version=JSON.parse(fs.readFileSync('version.json','utf8'));
          const report={checkedAt:new Date().toISOString(),ok:process.env.SUCCESS==='true',version:version.version||null,publicVisual:version.publicVisual||null,publicMenu:version.publicMenu||null,faviconVersion:version.favicon||null,faviconHttp:Number(process.env.FAVICON_CODE||0),pages:rows,failures:rows.filter(x=>x.http!==200||!x.menu||!x.visual||!x.ux||!x.favicon)};
          fs.writeFileSync('public-shell-result.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if(!report.ok)process.exit(1);
          JS

      - name: Post V13 verification result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -f public-shell-result.json ]; then
            body=$(printf '## Brza produkcijska provjera V13\n\n```json\n%s\n```\n' "$(cat public-shell-result.json)")
          else
            body="## Brza produkcijska provjera V13\n\nProvjera nije proizvela strukturirani rezultat. Run: ${GITHUB_RUN_ID}"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/issues/63/comments" -f body="$body"
