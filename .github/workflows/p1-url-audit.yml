name: P1 URL i redirect audit
on: workflow_dispatch
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p apps/portal/data/tmp-p1audit
          echo "=== HTTP -> HTTPS ===" > apps/portal/data/tmp-p1audit/r.txt
          curl -s -o /dev/null -w "%{http_code} -> %{redirect_url}\n" "http://gnk-asg.hr/" >> apps/portal/data/tmp-p1audit/r.txt
          echo "=== WWW -> non-WWW ===" >> apps/portal/data/tmp-p1audit/r.txt
          curl -s -o /dev/null -w "%{http_code} -> %{redirect_url}\n" "https://www.gnk-asg.hr/" >> apps/portal/data/tmp-p1audit/r.txt
          curl -s -o /dev/null -w "%{http_code} -> %{redirect_url}\n" "http://www.gnk-asg.hr/media-application/?lang=hr" >> apps/portal/data/tmp-p1audit/r.txt
          echo "=== admin (ocekivan 401/403) ===" >> apps/portal/data/tmp-p1audit/r.txt
          curl -s -o /dev/null -w "%{http_code} /admin-center/\n" "https://gnk-asg.hr/admin-center/" >> apps/portal/data/tmp-p1audit/r.txt
          echo "=== kljucne javne rute ===" >> apps/portal/data/tmp-p1audit/r.txt
          for ruta in "/" "/en/" "/objave/" "/en/publications/" "/komentari/" "/en/commentary/" "/gnk-aktual/" "/en/gnk-aktual/" "/gnk-aktual/kolumne/" "/en/gnk-aktual/columns/01-ai-za-male-tvrtke/" "/nermin-sefic/" "/en/nermin-sefic/" "/kontakt/" "/contact/" "/trgovina/" "/financije/" "/digital-workforce/" "/world-table/" "/puls-trzista/" "/trzisne-krize/" "/nilus-bio/" "/digital-solutions/" "/ideje-u-djelovanju/" "/synapse-demo/" "/pulse-demo/" "/projects/" "/group-network/" "/en/group-network/" "/media-application/?lang=hr" "/sitemap-index.xml" "/robots.txt"; do
            kod=$(curl -s -o /dev/null -w "%{http_code}" "https://gnk-asg.hr${ruta}")
            echo "${kod} ${ruta}" >> apps/portal/data/tmp-p1audit/r.txt
          done
          cat apps/portal/data/tmp-p1audit/r.txt
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          BRANCH="p1audit-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-p1audit
          git commit -m "P1 audit"
          git push origin "$BRANCH"
