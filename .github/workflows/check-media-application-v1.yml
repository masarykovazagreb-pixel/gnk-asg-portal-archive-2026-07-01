name: Check Media Application V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/portal/media-application/**'
      - 'apps/portal/assets/media-registration-v1.css'
      - 'apps/portal/assets/media-registration-v1.js'
      - 'workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js'
      - '.github/workflows/check-media-application-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate public press application
        run: |
          set -euxo pipefail
          page=apps/portal/media-application/index.html
          script=apps/portal/assets/media-registration-v1.js
          auth=workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
          node --check "$script"
          node --check "$auth"
          test -s "$page"
          test -s apps/portal/assets/media-registration-v1.css
          grep -Fq '/assets/media-registration-v1.js' "$page"
          grep -Fq 'media-application-language-compatibility' "$page"
          grep -Fq "language==='en'||language==='hr'" "$page"
          grep -Fq 'Secure newsroom portal' "$page"
          grep -Fq 'Newsroom registration and secure access' "$page"
          grep -Fq "const API='/api/media-registration'" "$script"
          grep -Fq "credentials:'same-origin'" "$script"
          grep -Fq "'/media-application'" "$auth"
          grep -Fq "path.startsWith('/api/media-registration-admin')" "$auth"
          ! grep -Eiq 'payment|subscription|paywall|checkout-button|checkout_url|stripe|paypal' "$page"
