name: Patch Visual Index V7 images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-visual-index-v7-images.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch guarded lines
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/portal/assets/visual-index-central-v7.js')
          lines=p.read_text(encoding='utf-8').splitlines()
          found={'absolute':0,'page':0,'image':0,'news':0}
          for i,line in enumerate(lines):
              s=line.strip()
              if s.startswith('const absolute=value=>'):
                  lines[i]="  const absolute=value=>{const raw=clean(value);if(!raw)return'';try{const url=new URL(raw,location.origin);return ['http:','https:'].includes(url.protocol)?url.href:''}catch{return''}};"
                  found['absolute']+=1
              elif s.startswith('const pageValue=item=>'):
                  lines[i]="  const pageValue=item=>item?.pageUrl||item?.publicUrl||item?.hrUrl||item?.enUrl||item?.url||item?.link||item?.sourceUrl||'';"
                  found['page']+=1
              elif s.startswith('const isImage=item=>'):
                  lines[i]="  const isImage=item=>{const src=absolute(imageValue(item));const page=absolute(pageValue(item));return Boolean(src&&item?.imageFallback!==true&&!fallback(src)&&src!==page&&(/\\.(?:avif|gif|jpe?g|png|svg|webp)(?:[?#]|$)/i.test(src)||src.includes('/r2/generated-articles/')))};"
                  found['image']+=1
              elif s.startswith('function mapNews(payload){'):
                  line=line.replace('pageUrl:absolute(item.url||item.sourceUrl)','pageUrl:absolute(item.url||item.link||item.sourceUrl)')
                  line=line.replace('news:true,external:true','imageFallback:item.imageFallback===true,news:true,external:true')
                  line=line.replace('filter(item=>item.pageUrl&&isImage(item))','filter(item=>item.pageUrl&&item.title&&!item.imageFallback&&isImage(item))')
                  lines[i]=line
                  found['news']+=1
          if any(v!=1 for v in found.values()):
              raise SystemExit(f'unexpected targets: {found}')
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print(found)
          PY
          node --check apps/portal/assets/visual-index-central-v7.js
          grep -q 'imageFallback!==true' apps/portal/assets/visual-index-central-v7.js
          grep -q 'src!==page' apps/portal/assets/visual-index-central-v7.js
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/portal/assets/visual-index-central-v7.js
          git commit -m 'Harden Visual Index V7 image filtering'
          git pull --rebase origin main
          node --check apps/portal/assets/visual-index-central-v7.js
          git push origin HEAD:main
