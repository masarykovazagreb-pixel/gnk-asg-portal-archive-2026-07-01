name: Deploy verified public news V22

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-news-v16.yml'
      - '.github/deploy-news-v16.trigger'
      - 'workers/gnk-asg-direct-operator/wrangler.toml'
      - 'workers/gnk-asg-direct-operator/src/news-curation-v10.js'
      - 'workers/gnk-asg-direct-operator/src/index-news-lifecycle-v12.js'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v22-news.js'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v27-news-status.js'
      - 'apps/portal/assets/business-news-v16.js'
      - 'apps/portal/assets/business-news.css'
      - 'apps/portal/vijesti/index.html'
      - 'apps/portal/news/index.html'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: gnk-asg-public-news-v22-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Verify public news package
        shell: bash
        run: |
          set -euxo pipefail
          node --check workers/gnk-asg-direct-operator/src/news-curation-v10.js
          node --check workers/gnk-asg-direct-operator/src/index-news-lifecycle-v12.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v22-news.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v27-news-status.js
          node --check apps/portal/assets/business-news-v16.js
          grep -q 'main = "src/index-admin-hub-v27-news-status.js"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'GNK_ASG_NEWS_LIFECYCLE_V16_VERIFIED_MEDIA_20260626' workers/gnk-asg-direct-operator/src/news-curation-v10.js
          grep -q 'export const NEWS_HOURS_ZAGREB=new Set(\[9,16,21\])' workers/gnk-asg-direct-operator/src/news-curation-v10.js
          grep -q 'export const ACTIVE_NEWS_LIMIT=100' workers/gnk-asg-direct-operator/src/news-curation-v10.js
          grep -q 'export const ARCHIVE_PRUNE_AT=1000' workers/gnk-asg-direct-operator/src/news-curation-v10.js
          grep -q 'export const ARCHIVE_DELETE_COUNT=500' workers/gnk-asg-direct-operator/src/news-curation-v10.js
          grep -q 'export const ARCHIVE_RETAIN_AFTER_PRUNE=500' workers/gnk-asg-direct-operator/src/news-curation-v10.js
          grep -q 'fallbackImagesAllowed:false' workers/gnk-asg-direct-operator/src/news-curation-v10.js
          grep -q 'PUBLIC_NEWS_V22_VERIFIED_100_ARCHIVE_500' workers/gnk-asg-direct-operator/src/index-admin-hub-v22-news.js
          grep -q 'business-news-v16.js' apps/portal/vijesti/index.html
          grep -q 'business-news-v16.js' apps/portal/news/index.html
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator

      - name: Deploy current Worker to Cloudflare
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator

      - name: Warm and verify public news
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node <<'JS' 2>&1 | tee /tmp/news-v22-verify.log
          const fs=require('node:fs');
          const base='https://gnk-asg.hr';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function get(path,timeout=60000){
            try{
              const response=await fetch(`${base}${path}${path.includes('?')?'&':'?'}cb=${Date.now()}`,{
                headers:{'cache-control':'no-cache',accept:'application/json,text/html;q=0.9'},
                signal:AbortSignal.timeout(timeout)
              });
              return {status:response.status,text:await response.text(),headers:Object.fromEntries(response.headers)};
            }catch(error){return {status:0,text:'',headers:{},error:String(error)};}
          }
          function json(response){try{return JSON.parse(response.text)}catch{return null}}
          function validUrl(value){try{return /^https?:$/.test(new URL(String(value||'')).protocol)}catch{return false}}
          function validateItem(item,index){
            const failures=[];
            if(!item?.verified)failures.push(`item_${index}_not_verified`);
            if(item?.verification?.article?.ok!==true)failures.push(`item_${index}_article_unverified`);
            if(item?.verification?.image?.ok!==true)failures.push(`item_${index}_image_unverified`);
            if(!validUrl(item?.url))failures.push(`item_${index}_url_invalid`);
            if(!validUrl(item?.image))failures.push(`item_${index}_image_invalid`);
            if(String(item?.image||'').includes('/assets/news-fallback.svg'))failures.push(`item_${index}_fallback_image`);
            if(String(item?.summary||'').trim().length<60)failures.push(`item_${index}_summary_short`);
            if(!String(item?.source||'').trim())failures.push(`item_${index}_source_missing`);
            return failures;
          }
          (async()=>{
            const warm=await get('/data/news.json?warm=1',240000);
            let last=null;
            for(let attempt=1;attempt<=12;attempt++){
              const responses=await Promise.all([
                get('/data/news.json'),
                get('/data/news-feed.json'),
                get('/data/news-automation-status.json'),
                get('/data/deployment-status.json'),
                get('/data/news-archive.json'),
                get('/data/news_archive.json'),
                get('/vijesti/'),
                get('/news/')
              ]);
              const [feedResponse,feedAliasResponse,statusResponse,deploymentResponse,archiveResponse,archiveAliasResponse,hr,en]=responses;
              const feed=json(feedResponse),feedAlias=json(feedAliasResponse),status=json(statusResponse),deployment=json(deploymentResponse),archive=json(archiveResponse),archiveAlias=json(archiveAliasResponse);
              const failures=[];
              for(const [name,response] of Object.entries({feed:feedResponse,feedAlias:feedAliasResponse,status:statusResponse,deployment:deploymentResponse,archive:archiveResponse,archiveAlias:archiveAliasResponse,hr,en}))if(response.status!==200)failures.push(`${name}_http=${response.status}`);
              if(feed?.version!=='GNK_ASG_NEWS_LIFECYCLE_V16_VERIFIED_MEDIA_20260626')failures.push(`version=${JSON.stringify(feed?.version)}`);
              if(!Array.isArray(feed?.items))failures.push('items_missing');
              else{
                if(feed.items.length<15)failures.push(`items=${feed.items.length}`);
                if(feed.items.length>100)failures.push(`items_over_limit=${feed.items.length}`);
                feed.items.forEach((item,index)=>failures.push(...validateItem(item,index)));
              }
              if(!Array.isArray(feedAlias?.items))failures.push('feed_alias_invalid');
              if(feed?.contentContract?.fallbackImagesAllowed!==false)failures.push('fallback_contract_invalid');
              if(status?.newsRefreshesPerDay!==3||JSON.stringify(status?.newsSchedule)!==JSON.stringify(['09:00','16:00','21:00']))failures.push('schedule_contract_invalid');
              if(status?.activeNewsLimit!==100)failures.push(`active_limit=${status?.activeNewsLimit}`);
              if(status?.archivePruneAt!==1000||status?.archiveDeleteCount!==500||status?.archiveRetainAfterPrune!==500||status?.archiveHardLimit!==1000)failures.push('archive_contract_invalid');
              if(Number(archive?.count||0)>1000||Number(archiveAlias?.count||0)>1000)failures.push('archive_over_hard_limit');
              if(deployment?.entryPoint!=='src/index-admin-hub-v27-news-status.js')failures.push(`entrypoint=${JSON.stringify(deployment?.entryPoint)}`);
              if(!hr.text.includes('business-news-v16.js?v=20260627-news-v22'))failures.push('hr_runtime_missing');
              if(!en.text.includes('business-news-v16.js?v=20260627-news-v22'))failures.push('en_runtime_missing');
              if(hr.headers['x-gnk-asg-news-runtime']!=='PUBLIC_NEWS_V22_VERIFIED_100_ARCHIVE_500')failures.push(`hr_header=${JSON.stringify(hr.headers['x-gnk-asg-news-runtime'])}`);
              if(en.headers['x-gnk-asg-news-runtime']!=='PUBLIC_NEWS_V22_VERIFIED_100_ARCHIVE_500')failures.push(`en_header=${JSON.stringify(en.headers['x-gnk-asg-news-runtime'])}`);
              last={checkedAt:new Date().toISOString(),attempt,warmStatus:warm.status,failures,feed:{count:feed?.count,items:Array.isArray(feed?.items)?feed.items.length:null,updatedAt:feed?.updatedAt,archiveCount:feed?.archiveCount},automation:{schedule:status?.newsSchedule,activeNewsLimit:status?.activeNewsLimit,archivePruneAt:status?.archivePruneAt,archiveDeleteCount:status?.archiveDeleteCount,archiveRetainAfterPrune:status?.archiveRetainAfterPrune},deployment:{entryPoint:deployment?.entryPoint,newsRuntime:deployment?.newsRuntime},archive:{count:archive?.count},codes:{feed:feedResponse.status,feedAlias:feedAliasResponse.status,status:statusResponse.status,deployment:deploymentResponse.status,archive:archiveResponse.status,archiveAlias:archiveAliasResponse.status,hr:hr.status,en:en.status}};
              fs.writeFileSync('/tmp/news-v22-diagnostic.json',JSON.stringify(last,null,2));
              console.log(JSON.stringify(last));
              if(!failures.length)process.exit(0);
              await sleep(15000);
            }
            process.exit(1);
          })().catch(error=>{console.error(error);process.exit(1)});
          JS

      - name: Report public news result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
        run: |
          diagnostic=$(cat /tmp/news-v22-diagnostic.json 2>/dev/null || printf '{"error":"verification_not_reached"}')
          log_tail=$(tail -n 30 /tmp/news-v22-verify.log 2>/dev/null || true)
          gh issue comment 120 --body "Public News V22 deploy · verification **${VERIFY_OUTCOME}** · commit \`${RUN_SHA}\` · ${RUN_URL}\n\n### Diagnostic\n\`\`\`json\n${diagnostic}\n\`\`\`\n\n### Log tail\n\`\`\`text\n${log_tail}\n\`\`\`"

      - name: Enforce public news contract
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: test "$VERIFY_OUTCOME" = success
