name: Pre-campaign read-only audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnk-asg-pre-campaign-readonly-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Worker dependencies
        working-directory: workers/gnk-asg-direct-operator
        run: npm install --no-audit --no-fund

      - name: Validate source without deployment or email
        shell: bash
        run: |
          set -euo pipefail
          node --check workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js
          node --check workers/gnk-asg-direct-operator/src/mail-studio-extension-v1.js
          node --check workers/gnk-asg-direct-operator/src/mail-studio-extension-v2.js
          node --check workers/gnk-asg-direct-operator/src/campaign-mailer-v1.js
          node --check workers/gnk-asg-direct-operator/src/campaign-mailer-v2.js
          node --check workers/gnk-asg-direct-operator/src/campaign-mailer-delivery-v1.js
          node --check apps/portal/assets/media-registration-v1.js
          node --check apps/portal/assets/mail-studio-multilingual-v25.js
          node --check apps/portal/campaign-mailer/control-v2.js

      - name: Run Wrangler bundle dry-run only
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.runtime.toml --name gnk-asg-direct-operator

      - name: Verify public GET and protected-route behaviour without sending mail
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.gnk-asg.hr'
          check_200() {
            local path="$1"
            local code
            code=$(curl -sS -L -o /dev/null -w '%{http_code}' "$base$path?audit=${GITHUB_RUN_ID}" || true)
            printf '%s %s\n' "$code" "$path"
            test "$code" = '200'
          }
          check_protected() {
            local path="$1"
            local code
            code=$(curl -sS -L -o /dev/null -w '%{http_code}' "$base$path?audit=${GITHUB_RUN_ID}" || true)
            printf '%s %s\n' "$code" "$path"
            case "$code" in 200|303|401|403) ;; *) return 1 ;; esac
          }
          check_200 '/'
          check_200 '/en/'
          check_200 '/contact/'
          check_200 '/media-application/'
          check_200 '/the-code/'
          check_200 '/objave/'
          check_200 '/publications/'
          check_200 '/robots.txt'
          check_200 '/sitemap.xml'
          check_protected '/mail-studio/'
          check_protected '/campaign-mailer/'
          check_protected '/operator-dashboard/'

      - name: Confirm the audit did not contain write actions
        run: |
          echo 'This workflow performs no deployment, no email submission, no campaign dispatch and no repository write.'
