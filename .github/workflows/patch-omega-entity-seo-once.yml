name: Patch Omega Entity SEO Once
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/patch-omega-entity-seo-once.yml]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: seo/omega-entity-signals-20260808
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strengthen entity SEO without touching authored body
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('apps/portal/objave/osvrt-na-2013-omega-factoring-nermin-sefic/index.html')
          s=p.read_text(encoding='utf-8')
          old='<meta name="keywords" content="Nermin Sefić, Omega factoring, Drago Munjiza, Marko Kolaković, GNK ASG">'
          new='<meta name="keywords" content="Nermin Sefić, Nermin Sefic, Omega factoring, Dragan Munjiza, Marko Kolaković, Poslovni dnevnik, GNK ASG">'
          if old not in s: raise SystemExit('expected keywords meta not found')
          s=s.replace(old,new,1)
          old_schema='''{"@context":"https://schema.org","@type":"Article","headline":"Osvrt na 2013. — moja strana priče o Omega factoringu","description":"Osobna izjava Nermina Sefića povodom članka Poslovnog dnevnika iz 2013. o Omega factoringu — o vlasništvu, odluci o raspuštanju Nadzornog odbora i izostanku izravnog razgovora s novinarom.","datePublished":"2026-08-07T14:00:00+02:00","dateModified":"2026-08-07T14:00:00+02:00","image":"https://gnk-asg.hr/assets/people/nermin-sefic/nermin-sefic-omega-2013-odgovor.webp","mainEntityOfPage":{"@type":"WebPage","@id":"https://gnk-asg.hr/objave/osvrt-na-2013-omega-factoring-nermin-sefic/"},"author":{"@type":"Person","name":"Nermin Sefić"},"publisher":{"@type":"Organization","name":"GNK ASG d.o.o.","url":"https://gnk-asg.hr/","logo":{"@type":"ImageObject","url":"https://gnk-asg.hr/assets/logo-gnk-asg-canonical.svg"}}}'''
          schema={'@context':'https://schema.org','@type':'Article','headline':'Osvrt na 2013. — moja strana priče o Omega factoringu','description':'Osobna izjava Nermina Sefića povodom članka Poslovnog dnevnika iz 2013. o Omega factoringu — o vlasništvu, Draganu Munjizi, Marku Kolakoviću, odluci o raspuštanju Nadzornog odbora i izostanku izravnog razgovora s novinarom.','datePublished':'2026-08-07T14:00:00+02:00','dateModified':'2026-08-08T02:00:00+02:00','image':{'@type':'ImageObject','url':'https://gnk-asg.hr/assets/people/nermin-sefic/nermin-sefic-omega-2013-odgovor.webp','caption':'Nermin Sefić — osobna izjava o Omega factoringu i događajima iz 2013.'},'mainEntityOfPage':{'@type':'WebPage','@id':'https://gnk-asg.hr/objave/osvrt-na-2013-omega-factoring-nermin-sefic/'},'author':{'@type':'Person','@id':'https://gnk-asg.hr/#nermin-sefic','name':'Nermin Sefić','url':'https://gnk-asg.hr/nermin-sefic/'},'about':[{'@type':'Organization','name':'Omega factoring'},{'@type':'Person','name':'Dragan Munjiza'},{'@type':'Person','name':'Marko Kolaković'}],'mentions':[{'@type':'Organization','name':'Poslovni dnevnik'}],'publisher':{'@type':'Organization','@id':'https://gnk-asg.hr/#organization','name':'GNK ASG d.o.o.','url':'https://gnk-asg.hr/','logo':{'@type':'ImageObject','url':'https://gnk-asg.hr/assets/logo-gnk-asg-canonical.svg'}}}
          new_schema=json.dumps(schema,ensure_ascii=False,separators=(',',':'))
          if old_schema not in s: raise SystemExit('expected Article schema not found')
          s=s.replace(old_schema,new_schema,1)
          s=s.replace('alt="Ilustracija uz osobnu izjavu Nermina Sefića o Omega factoringu"','alt="Nermin Sefić — osobna izjava o Omega factoringu, Draganu Munjizi i Marku Kolakoviću"',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate locked body and SEO entities
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('apps/portal/objave/osvrt-na-2013-omega-factoring-nermin-sefic/index.html').read_text(encoding='utf-8')
          required=['Dragan Munjiza','Marko Kolaković','Omega factoring','Poslovni dnevnik','https://gnk-asg.hr/#nermin-sefic','Trinaest godina je dug period','To nije bio bijeg s njihove strane. To je bila moja odluka']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('missing: '+repr(missing))
          print('Omega authored body preserved; entity SEO strengthened')
          PY
      - name: Commit patch and remove one-time workflow
        run: |
          rm .github/workflows/patch-omega-entity-seo-once.yml
          git config user.name 'gnk-asg-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/portal/objave/osvrt-na-2013-omega-factoring-nermin-sefic/index.html .github/workflows/patch-omega-entity-seo-once.yml
          git commit -m 'seo(omega): strengthen named entity signals without body edits'
          git push origin HEAD:seo/omega-entity-signals-20260808
