name: Verify Floating Home V16 Targeted

on:
  push:
    branches: [main]
    paths:
      - ".github/verify-floating-home-v16-targeted.trigger"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium
        run: |
          npm install --no-package-lock --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Verify remaining routes
        shell: bash
        run: |
          node - <<'JS'
          const fs=require('fs');
          const {chromium}=require('playwright');
          const targets=[
            ['/vijesti/','/'],['/news/','/en/'],['/app/','/'],['/contact/','/'],['/en/contact/','/en/']
          ];
          const views=[['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const results=[];
            for(const [view,viewport] of views){
              for(const [route,href] of targets){
                const page=await browser.newPage({viewport,deviceScaleFactor:1});
                let http=0;
                try{
                  const response=await page.goto(`https://gnk-asg.hr${route}?cb=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:45000});
                  http=response?.status()||0;
                  await page.waitForTimeout(1200);
                  const data=await page.evaluate(()=>{
                    const home=document.getElementById('gnk-floating-home-v16');
                    const ai=document.getElementById('gnk-ai-badge-v13');
                    const hr=home?.getBoundingClientRect();
                    const ar=ai?.getBoundingClientRect();
                    return {
                      visible:Boolean(home&&getComputedStyle(home).display!=='none'&&hr&&hr.width>4&&hr.height>4),
                      href:home?.getAttribute('href')||null,
                      script:[...document.scripts].some(s=>String(s.src||'').includes('public-floating-home-v16.js?v=20260625-v16')),
                      left:hr?Number(hr.left.toFixed(2)):null,
                      bottom:hr?Number((window.innerHeight-hr.bottom).toFixed(2)):null,
                      aiVisible:Boolean(ai&&getComputedStyle(ai).display!=='none'&&ar&&ar.width>4&&ar.height>4),
                      overlap:hr&&ar?!(hr.right<ar.left||ar.right<hr.left||hr.bottom<ar.top||ar.bottom<hr.top):false,
                      overflow:document.documentElement.scrollWidth>window.innerWidth+2,
                      scrollWidth:document.documentElement.scrollWidth,
                      viewportWidth:window.innerWidth
                    };
                  });
                  const ok=http===200&&data.visible&&data.href===href&&data.script&&data.aiVisible&&!data.overlap&&!data.overflow;
                  results.push({route,view,http,expectedHref:href,...data,ok});
                }catch(error){results.push({route,view,http,error:error.message,ok:false});}
                await page.close();
              }
            }
            await browser.close();
            const failures=results.filter(x=>!x.ok);
            const report={checkedAt:new Date().toISOString(),ok:failures.length===0,total:results.length,passed:results.length-failures.length,failures,results};
            fs.writeFileSync('targeted-v16-report.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report,null,2));
            if(!report.ok)process.exitCode=1;
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
      - name: Publish targeted result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -f targeted-v16-report.json ]; then
            body=$(printf 'Ciljana završna produkcijska provjera V16.\n\n```json\n%s\n```\n' "$(cat targeted-v16-report.json)")
            ok=$(node -e "const r=require('./targeted-v16-report.json');process.stdout.write(String(r.ok))")
          else
            body="Ciljana V16 provjera nije proizvela rezultat. Run: ${GITHUB_RUN_ID}"
            ok=false
          fi
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/67" -f body="$body"
          if [ "$ok" = "true" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/67" -f state=closed -f state_reason=completed
          fi
