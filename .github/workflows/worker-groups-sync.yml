name: Worker groups — sync

# Grupira stvarne workflowe u šest radnih skupina i objavljuje
# /workers/grupacije/ (hr + en). Pokreće se kad se popis automatizacija
# promijeni ili ručno. Commit dira samo izlazne datoteke, pa paths
# filtar sprječava petlju.

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'scripts/build-worker-groups-v1.mjs'
  workflow_dispatch:

concurrency:
  group: gnk-asg-main-mutation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: vars.GNK_ASG_RELEASE_FENCE != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build groups
        run: node scripts/build-worker-groups-v1.mjs
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain apps/portal/workers/grupacije apps/portal/data/worker-groups.json)" ]; then
            echo "Bez promjena."
            exit 0
          fi
          git config user.name "aktual-bot"
          git config user.email "aktual-bot@users.noreply.github.com"
          git add apps/portal/workers/grupacije apps/portal/data/worker-groups.json
          git commit -m "Worker groups: sync s popisom automatizacija"
          git push
