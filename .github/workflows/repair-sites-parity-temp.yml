name: Repair generated sites parity (temporary)
on:
  push:
    branches:
      - repair/generated-sites-build-parity-20261108
    paths:
      - '.github/workflows/repair-sites-parity-temp.yml'
permissions:
  contents: write
concurrency:
  group: repair-sites-parity-once
  cancel-in-progress: false
jobs:
  regenerate:
    if: github.ref == 'refs/heads/repair/generated-sites-build-parity-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild canonical generated site files
        shell: bash
        run: |
          set -euo pipefail
          node apps/sites/build.mjs
          if git diff --name-only --diff-filter=D -- apps/sites/site/ | grep -q .; then
            echo '::error::Unexpected deletions in generated site outputs'
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all -- ':!apps/sites/site/**')" ]; then
            echo '::error::Generator changed files outside apps/sites/site/'
            git status --short | head -60
            exit 1
          fi
          git add -- apps/sites/site/
          git diff --cached --check
          echo 'Generated file summary:'
          git diff --cached --stat | tail -20
          if git diff --cached --quiet; then
            echo '::notice::Generated outputs already match; no commit required.'
            exit 0
          fi
          git config user.name "GNK ASG Generator Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(sites): regenerate canonical static outputs without deletions"
          git push origin "HEAD:refs/heads/repair/generated-sites-build-parity-20261108"
