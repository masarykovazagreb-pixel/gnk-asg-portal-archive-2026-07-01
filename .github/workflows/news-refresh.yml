name: GNK ASG News Refresh

# Recovery entrypoint only.
# Canonical scheduled/writer implementation: .github/workflows/gnk-news-refresh-v2.yml
# This workflow MUST NOT maintain a second parser, archive schema or publication writer.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: gnk-asg-news-recovery
  cancel-in-progress: false

jobs:
  recover-news:
    name: Dispatch canonical AKTUAL refresh
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical single writer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run gnk-news-refresh-v2.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
          echo "Canonical GNK News Refresh V2 dispatched. Legacy Python writer is disabled."
