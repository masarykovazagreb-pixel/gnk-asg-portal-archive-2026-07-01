name: GNK ASG News Refresh

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/news-refresh.yml'
      - 'apps/portal/scripts/refresh_news.py'
      - 'apps/portal/scripts/refresh_news_policy.py'
      - 'apps/portal/data/news.json'
      - 'apps/portal/data/news_archive.json'
      - 'apps/portal/data/update_status.json'
  schedule:
    # GitHub cron is UTC. These six slots cover 09:00, 16:00 and 21:00
    # Europe/Zagreb in both CET and CEST; the local-time guard below keeps
    # scheduled refreshes limited to the intended local hours.
    - cron: '0 7,8,14,15,19,20 * * *'

permissions:
  contents: write

concurrency:
  group: gnk-asg-news-refresh
  cancel-in-progress: false

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check Europe/Zagreb schedule guard
        id: schedule_guard
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          local_hour="$(TZ=Europe/Zagreb date +%H)"
          case "$local_hour" in
            09|16|21) echo "run_refresh=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "run_refresh=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Checkout repository
        if: steps.schedule_guard.outputs.run_refresh == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.schedule_guard.outputs.run_refresh == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh public business news feed
        if: steps.schedule_guard.outputs.run_refresh == 'true'
        run: python apps/portal/scripts/refresh_news_policy.py

      - name: Validate refreshed feed and retention policy
        if: steps.schedule_guard.outputs.run_refresh == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          news = json.loads(Path('apps/portal/data/news.json').read_text(encoding='utf-8'))
          archive = json.loads(Path('apps/portal/data/news_archive.json').read_text(encoding='utf-8'))
          status = json.loads(Path('apps/portal/data/update_status.json').read_text(encoding='utf-8'))
          news_status = status.get('news', {})

          assert isinstance(news, list) and 0 < len(news) <= 100, 'news.json must contain 1-100 items'
          assert isinstance(archive, list), 'news_archive.json must be a list'
          assert news_status.get('status') in {'ok', 'degraded'}, 'news refresh status failed'
          assert news_status.get('max_public_items') == 100, 'public limit is not 100'
          assert news_status.get('archive_prune_trigger') == 1000, 'archive trigger is not 1000'
          assert news_status.get('archive_delete_oldest_batch') == 500, 'archive prune batch is not 500'
          assert len(archive) <= 1000, 'archive remains above 1000 after pruning'
          print(f'validated public={len(news)}, archive={len(archive)}')
          PY

      - name: Commit refreshed feed
        if: steps.schedule_guard.outputs.run_refresh == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Refresh public business news feed'
          file_pattern: 'apps/portal/data/news.json apps/portal/data/news_archive.json apps/portal/data/update_status.json'
