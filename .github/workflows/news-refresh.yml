name: GNK ASG News Refresh

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/news-refresh.yml'
      - 'apps/portal/scripts/refresh-news.mjs'
      - 'apps/portal/data/news-automation-status.json'
  schedule:
    # Europe/Zagreb local schedule approximation.
    # UTC times cover 09:00, 16:00 and 21:00 during summer time.
    - cron: '0 7,14,19 * * *'

permissions:
  contents: write

concurrency:
  group: gnk-asg-news-refresh
  cancel-in-progress: false

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh public news feed
        run: node apps/portal/scripts/refresh-news.mjs

      - name: Commit refreshed feed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Refresh public news feed'
          file_pattern: 'apps/portal/data/news.json apps/portal/data/news_archive.json apps/portal/data/news-automation-status.json'
