name: GNK ASG News Refresh

on:
  workflow_dispatch:
  schedule:
    # GitHub cron je UTC. Do 31.08.2026. Zagreb je CEST (UTC+2), pa 07:00/15:00 UTC
    # daje kanonske cikluse u 09:00 i 17:00 Europe/Zagreb bez dodatnih cron poziva.
    - cron: '0 7,15 * * *'

permissions:
  contents: write

concurrency:
  group: gnk-asg-news-refresh
  cancel-in-progress: false

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync with latest main before running (reduces race with other auto-commit workflows)
        run: git pull --ff-only origin main

      - name: Normalize archive schema for canonical refresh
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('apps/portal/data/news_archive.json')
          if not path.exists():
              raise SystemExit(0)

          payload = json.loads(path.read_text(encoding='utf-8'))
          if isinstance(payload, list):
              raise SystemExit(0)

          if isinstance(payload, dict) and isinstance(payload.get('items'), list):
              path.write_text(
                  json.dumps(payload['items'], ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
              print(f"normalized archive wrapper to list: {len(payload['items'])} items")
              raise SystemExit(0)

          raise SystemExit('unsupported news_archive.json schema')
          PY

      - name: Refresh public business news feed
        run: python apps/portal/scripts/refresh_news_policy.py

      - name: Validate refreshed feed and retention policy
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          news = json.loads(Path('apps/portal/data/news.json').read_text(encoding='utf-8'))
          archive = json.loads(Path('apps/portal/data/news_archive.json').read_text(encoding='utf-8'))
          status = json.loads(Path('apps/portal/data/update_status.json').read_text(encoding='utf-8'))
          news_status = status.get('news', {})

          assert isinstance(news, list) and 0 < len(news) <= 150, 'news.json must contain 1-150 items'
          assert isinstance(archive, list), 'news_archive.json must be a list'
          assert news_status.get('status') in {'ok', 'degraded'}, 'news refresh status failed'
          assert news_status.get('max_public_items') == 150, 'public limit is not 150'
          assert news_status.get('archive_prune_trigger') == 2000, 'archive trigger is not 2000'
          assert news_status.get('archive_delete_oldest_batch') == 1000, 'archive prune batch is not 1000'
          assert len(archive) <= 2000, 'archive remains above 2000 after pruning'
          print(f'validated public={len(news)}, archive={len(archive)}')
          PY

      - name: Commit refreshed feed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Refresh public business news feed'
          file_pattern: 'apps/portal/data/news.json apps/portal/data/news_archive.json apps/portal/data/update_status.json'