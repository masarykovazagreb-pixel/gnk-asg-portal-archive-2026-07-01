name: GNK ASG News Refresh

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/news-refresh.yml'
      - 'apps/portal/scripts/refresh-news.mjs'
      - 'apps/portal/data/news_manual_seed.json'
      - 'apps/portal/data/news.json'
      - 'apps/portal/data/news_archive.json'
      - 'apps/portal/data/news-automation-status.json'
  schedule:
    # GitHub cron is UTC. These six slots cover 09:00, 16:00 and 21:00
    # Europe/Zagreb in both CET and CEST; the local-time guard below keeps
    # scheduled refreshes limited to the intended local hours.
    - cron: '0 7,8,14,15,19,20 * * *'

permissions:
  contents: write

concurrency:
  group: gnk-asg-news-refresh
  cancel-in-progress: false

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check Europe/Zagreb schedule guard
        id: schedule_guard
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          local_hour="$(TZ=Europe/Zagreb date +%H)"
          case "$local_hour" in
            09|16|21) echo "run_refresh=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "run_refresh=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Checkout repository
        if: steps.schedule_guard.outputs.run_refresh == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.schedule_guard.outputs.run_refresh == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh public news feed
        if: steps.schedule_guard.outputs.run_refresh == 'true'
        run: node apps/portal/scripts/refresh-news.mjs

      - name: Commit refreshed feed
        if: steps.schedule_guard.outputs.run_refresh == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Refresh public news feed'
          file_pattern: 'apps/portal/data/news.json apps/portal/data/news_archive.json apps/portal/data/news-automation-status.json'
