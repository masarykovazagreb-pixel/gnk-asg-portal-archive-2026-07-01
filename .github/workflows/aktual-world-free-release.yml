name: AKTUAL WORLD — FREE 12-portal staging release

# Existing free static drafts only. No cron, no direct main writes, no paid APIs.
on:
  workflow_dispatch:
    inputs:
      confirm_free_release:
        description: 'Enter DEPLOY_AKTUAL_FREE_12 only after checking Cloudflare free tier capacity'
        required: true
        type: string
      expected_main_sha:
        description: 'Exact 40-character main source SHA'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aktual-world-free-manual-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && inputs.confirm_free_release == 'DEPLOY_AKTUAL_FREE_12' && vars.GNK_ASG_GLOBAL_FREE_LAUNCH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_SHA: ${{ inputs.expected_main_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Free-tier and exact-SHA preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN" && test -n "$CF_ACCOUNT" || { echo "::error::Cloudflare credentials not configured"; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Invalid 40-digit main SHA"; exit 1; }
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || { echo "::error::Main changed; do not deploy"; exit 1; }
          node -e "const x=require('./config/control-plane/world-free-portal-network-v1.json');if(x.sites.length!==12||!x.noPaidServices||x.release.state!=='STAGING_ONLY'||x.release.publishDefault!==false)process.exit(1)"
          jq -r '.sites[] | [.id,.projectName,.outputDirectory] | @tsv' config/control-plane/world-free-portal-network-v1.json |
            while IFS=$'\t' read -r id project folder; do
              test -f "$folder/index.html" || exit 1
              grep -qi 'noindex,nofollow,noarchive' "$folder/index.html" || exit 1
              grep -q 'https://gnk-asg.hr/gnk-aktual/' "$folder/index.html" || exit 1
            done
          mkdir -p artifacts/aktual-world-free-release
      - name: Create free Pages projects where missing and deploy noindex previews
        shell: bash
        run: |
          set -euo pipefail
          echo -e 'id\tproject\turl\thttp\tstatus\twriter_sha' > artifacts/aktual-world-free-release/receipts.tsv
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects"
          jq -r '.sites[] | [.id,.projectName,.outputDirectory] | @tsv' config/control-plane/world-free-portal-network-v1.json |
            while IFS=$'\t' read -r id project folder; do
              code=$(curl -sS -o /tmp/aktual-project.json -w '%{http_code}' --max-time 15 -H "Authorization: Bearer $CF_TOKEN" "$API/$project")
              if [ "$code" = "404" ]; then
                curl -fsS --max-time 30 -X POST -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' --data "{\"name\":\"$project\",\"production_branch\":\"main\"}" "$API" >/tmp/aktual-create.json
                jq -e '.success == true' /tmp/aktual-create.json >/dev/null
              elif [ "$code" != "200" ]; then
                echo "::error::Project lookup HTTP $code ($project)"
                exit 1
              fi
              npx --yes wrangler@4 pages deploy "$folder" --project-name="$project" --branch=main --commit-hash="$EXPECTED_SHA" \
                >/tmp/aktual-world-deploy.log 2>&1 || { tail -50 /tmp/aktual-world-deploy.log; exit 1; }
              curl -fsS --max-time 20 -H "Authorization: Bearer $CF_TOKEN" "$API/$project" >/tmp/aktual-live-project.json
              host=$(jq -r '.result.subdomain // empty' /tmp/aktual-live-project.json)
              [[ "$host" =~ ^[a-z0-9.-]+\.pages\.dev$ ]] || { echo "::error::Subdomain not confirmed"; exit 1; }
              code=$(curl -LsS -o /tmp/aktual-live-site.html -w '%{http_code}' --max-time 25 "https://$host/")
              if [ "$code" != "200" ] || ! grep -q 'AKTUAL MEDIA' /tmp/aktual-live-site.html || ! grep -q 'noindex,nofollow,noarchive' /tmp/aktual-live-site.html; then
                echo "::error::Staging HTTP verification failed for $id: $code"
                exit 1
              fi
              echo -e "$id\t$project\thttps://$host/\t$code\tSTAGING_HTTP_VERIFIED_NOT_INDEXABLE\t$EXPECTED_SHA" \
                >> artifacts/aktual-world-free-release/receipts.tsv
            done
      - name: Write evidence, not a false indexed-publication claim
        if: always()
        shell: bash
        run: |
          {
            echo '## AKTUAL WORLD — FREE staging results'
            echo "- Requested writer SHA: $EXPECTED_SHA"
            echo '- Deploying a preview is not editorial or indexed publication'
            if [ -f artifacts/aktual-world-free-release/receipts.tsv ]; then
              cat artifacts/aktual-world-free-release/receipts.tsv
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aktual-world-free-receipts-${{ github.run_id }}
          path: artifacts/aktual-world-free-release/
          retention-days: 30
