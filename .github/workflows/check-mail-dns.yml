name: Provjeri SPF DKIM DMARC
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p apps/portal/data/tmp-mailcheck
          echo "=== SPF ===" > apps/portal/data/tmp-mailcheck/r.txt
          dig +short TXT gnk-asg.hr | grep -i spf >> apps/portal/data/tmp-mailcheck/r.txt || echo "NEMA SPF" >> apps/portal/data/tmp-mailcheck/r.txt
          echo "=== DMARC ===" >> apps/portal/data/tmp-mailcheck/r.txt
          dig +short TXT _dmarc.gnk-asg.hr >> apps/portal/data/tmp-mailcheck/r.txt
          echo "=== svi TXT zapisi ===" >> apps/portal/data/tmp-mailcheck/r.txt
          dig +short TXT gnk-asg.hr >> apps/portal/data/tmp-mailcheck/r.txt
          echo "=== MX ===" >> apps/portal/data/tmp-mailcheck/r.txt
          dig +short MX gnk-asg.hr >> apps/portal/data/tmp-mailcheck/r.txt
          cat apps/portal/data/tmp-mailcheck/r.txt
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          BRANCH="mailcheck-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-mailcheck
          git commit -m "mail dns check"
          git push origin "$BRANCH"
