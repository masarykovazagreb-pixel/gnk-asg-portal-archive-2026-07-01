name: Verify AI binding added (one-off)
on:
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check bindings and status
        run: |
          CF_TOKEN="cfut_RQcfszqhP9EYO7NmPjgWRjrklpw9pCN4e89DjKXL42804731"
          ACCOUNT_ID="1728309632b4e7be93fba322822905da"
          echo "# AI binding verify" > /tmp/d.md
          echo '```' >> /tmp/d.md
          curl -s "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/services/gnk-asg-mail-center-worker/environments/production/settings" -H "Authorization: Bearer $CF_TOKEN" >> /tmp/d.md
          echo "" >> /tmp/d.md
          echo "--- status endpoint ---" >> /tmp/d.md
          curl -s "https://gnk-asg-mail-center-worker.beckuphome.workers.dev/api/mail-center/status" >> /tmp/d.md
          echo '```' >> /tmp/d.md
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" --title "AI binding verify" --body-file /tmp/d.md
