name: GNK News Refresh V2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gnk-news-refresh-v2.yml'
      - 'scripts/normalize-aktual-hourly-contract.mjs'
      - 'ops/automation-kill-switches.json'
  schedule:
    # Canonical AKTUAL owner: refresh every hour at minute 12 UTC.
    # Operational watchdog separately verifies the result and can redispatch this writer.
    - cron: '12 * * * *'

permissions:
  contents: write

concurrency:
  group: gnk-news-refresh
  cancel-in-progress: false

jobs:
  refresh-news:
    name: Refresh public news feed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enforce automation control plane
        id: control
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const switches = JSON.parse(fs.readFileSync('ops/automation-kill-switches.json', 'utf8'));
          const newsEnabled = switches.channels?.newsWrite?.enabled === true;
          const releaseFence = switches.releaseFence?.enabled === true;
          const onMain = process.env.GITHUB_REF === 'refs/heads/main';
          const shouldRun = newsEnabled && !releaseFence && onMain;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `should_run=${shouldRun}\n`);
          if (!onMain) console.log(`GNK News Refresh V2 held: writer is main-only (current ref: ${process.env.GITHUB_REF}).`);
          else if (!newsEnabled) console.log('GNK News Refresh V2 held: newsWrite kill-switch is disabled.');
          else if (releaseFence) console.log('GNK News Refresh V2 held: exact-SHA production release fence is active.');
          else console.log('GNK News Refresh V2 authorized by central automation control plane.');
          NODE

      - name: Refresh GNK ASG news data
        if: steps.control.outputs.should_run == 'true'
        run: node scripts/gnk-news-refresh.mjs

      - name: Normalize public hourly contract
        if: steps.control.outputs.should_run == 'true'
        run: |
          node scripts/normalize-aktual-hourly-contract.mjs
          node scripts/freshness-status-v2.mjs

      - name: Validate AKTUAL output before commit
        if: steps.control.outputs.should_run == 'true'
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const status = JSON.parse(fs.readFileSync('apps/portal/data/news-automation-status.json','utf8'));
          const news = JSON.parse(fs.readFileSync('apps/portal/data/news.json','utf8'));
          if (!status.ok) throw new Error('AKTUAL status is not OK');
          if (status.scheduled_interval_hours !== 1) throw new Error('AKTUAL cadence contract is not hourly');
          if (!Array.isArray(news) || news.length < 50) throw new Error(`AKTUAL public feed too small: ${news.length}`);
          console.log(`AKTUAL validated: ${news.length} items, hourly contract active.`);
          NODE

      - name: Commit refreshed news data
        if: steps.control.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          git config user.name "gnk-news-bot"
          git config user.email "actions@github.com"
          git add \
            apps/portal/data/news.json \
            apps/portal/data/news_archive.json \
            apps/portal/data/news-automation-status.json \
            apps/portal/data/freshness-status.json \
            apps/portal/gnk-aktual/index.html
          if git diff --cached --quiet; then
            echo "No news data changes to commit."
          else
            git commit -m "Refresh GNK ASG news feed"
            for i in 1 2 3; do
              if git push; then break; fi
              echo "Push rejected (main moved) - rebase retry $i"
              git pull --rebase origin main
              sleep $((i*5))
            done
          fi
