name: Install Generated Gallery 30

on:
  push:
    branches: [experience-ai-live-overview]
    paths: ['staging/generated-gallery/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/install-generated-gallery-assets.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install 30 generated editorial gallery images" || exit 0
          git push origin HEAD:${{ github.ref_name }}
