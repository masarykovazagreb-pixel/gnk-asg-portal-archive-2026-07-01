name: Validate Mail Security Abuse Guard

on:
  pull_request:
    branches: [main]
    paths:
      - 'workers/gnk-asg-mail-center-worker/src/index.js'
      - 'scripts/test-mail-security-abuse-guard-v1.mjs'
      - '.github/workflows/validate-mail-security-abuse-guard.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check mail security source
        run: node --check workers/gnk-asg-mail-center-worker/src/index.js
      - name: Validate abuse guard regression
        run: node scripts/test-mail-security-abuse-guard-v1.mjs
