name: Dohvati 2 slike v7 (jednokratno)
on: workflow_dispatch
jobs:
  dohvati:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p apps/portal/data/tmp-8s
          curl -s "https://gnk-asg.hr/api/slike?upit=long+term+business+consistency+trust" -o apps/portal/data/tmp-8s/kontinuitet.json
          curl -s "https://gnk-asg.hr/api/slike?upit=credit+risk+assessment+business+finance" -o apps/portal/data/tmp-8s/kredit.json
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          BRANCH="slike8-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-8s
          git commit -m "slike"
          git push origin "$BRANCH"
