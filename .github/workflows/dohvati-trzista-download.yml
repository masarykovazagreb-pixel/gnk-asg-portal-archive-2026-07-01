name: Dohvati sliku trzista za preuzimanje (jednokratno)
on: workflow_dispatch
jobs:
  dohvati:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p apps/portal/data/tmp-download
          curl -sL "https://images.pexels.com/photos/35118208/pexels-photo-35118208.jpeg?auto=compress&cs=tinysrgb&h=1600&w=2400" -o apps/portal/data/tmp-download/trziste.jpg
          ls -la apps/portal/data/tmp-download/
      - run: |
          git config user.name "gnk-asg-bot"
          git config user.email "it@gnk-asg.hr"
          git add apps/portal/data/tmp-download
          git diff --cached --quiet || git commit -m "Privremeno: slika trzista za preuzimanje"
          git push
