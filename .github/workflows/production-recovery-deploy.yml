name: Production Recovery Deploy
on:
  workflow_dispatch:
  push:
    branches: [experience-ai-live-overview]
    paths:
      - workers/gnk-asg-direct-operator/**
      - apps/portal/**
      - .github/workflows/production-recovery-deploy.yml
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check src/index-production-recovery.js
        working-directory: workers/gnk-asg-direct-operator
      - run: npx --yes wrangler@4 deploy --config wrangler.toml
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
