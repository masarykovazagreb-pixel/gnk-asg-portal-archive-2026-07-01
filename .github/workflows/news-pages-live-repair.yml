name: GNK ASG News Pages Live Repair

on:
  workflow_dispatch:
    inputs:
      approval:
        description: Type NEWS_LIVE_REPAIR_APPROVED
        required: true
        type: string
      source_commit:
        description: Exact 40-character commit SHA to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gnk-asg-news-pages-live-repair
  cancel-in-progress: false

jobs:
  deploy-and-test:
    if: github.event.inputs.approval == 'NEWS_LIVE_REPAIR_APPROVED'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate typed approval and source SHA
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.event.inputs.approval }}' = 'NEWS_LIVE_REPAIR_APPROVED'
          printf '%s' '${{ github.event.inputs.source_commit }}' | grep -Eq '^[0-9a-fA-F]{40}$'

      - name: Checkout exact approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_commit }}
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate isolated news worker
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.inputs.source_commit }}'
          node --check workers/gnk-asg-news-pages-live/src/index.js
          test -s apps/portal/vijesti/index.html
          test -s apps/portal/news/index.html
          grep -Fxq 'pattern = "gnk-asg.hr/vijesti/*"' workers/gnk-asg-news-pages-live/wrangler.toml
          grep -Fxq 'pattern = "gnk-asg.hr/news/*"' workers/gnk-asg-news-pages-live/wrangler.toml
          grep -q 'gnk-functional-repair-css' apps/portal/vijesti/index.html
          grep -q 'gnk-functional-repair-css' apps/portal/news/index.html

      - name: Deploy approved repaired news routes
        run: npx --yes wrangler@4 deploy --config workers/gnk-asg-news-pages-live/wrangler.toml

      - name: Wait for propagation
        run: sleep 15

      - name: Verify HR and EN news pages
        shell: bash
        run: |
          set -euo pipefail
          for path in /vijesti/ /news/; do
            file="news$(echo "$path" | tr '/' '_').html"
            headers="news$(echo "$path" | tr '/' '_').headers"
            code=$(curl --silent --show-error --location --dump-header "$headers" --output "$file" --write-out '%{http_code}' --retry 5 --retry-all-errors --retry-delay 3 "https://gnk-asg.hr${path}")
            echo "$code https://gnk-asg.hr${path}"
            test "$code" = '200'
            grep -qi 'GNK ASG' "$file"
            grep -q 'gnk-functional-repair-css' "$file"
            grep -qi 'x-gnk-asg-news-pages-live: true' "$headers"
            ! grep -qiE '>App<|>Mobilni portal<' "$file"
          done

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnk-asg-news-pages-live-${{ github.run_id }}
          path: |
            news*.html
            news*.headers
          if-no-files-found: warn
          retention-days: 7
