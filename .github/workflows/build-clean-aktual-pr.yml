name: Build clean Aktual Media PR
on:
  push:
    branches: [agent/aktual-media-clean-final2-20260803]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-clean-aktual-pr-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aktual-media-clean-final2-20260803
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore approved archive only
        run: |
          git fetch origin agent/column-seo-generator-20260803
          git checkout origin/agent/column-seo-generator-20260803 -- apps/portal/gnk-aktual/kolumne/index.html
      - name: Generate and validate formal column pages
        run: |
          python scripts/generate_aktual_columns.py
          python scripts/validate_aktual_columns.py
      - name: Commit clean Aktual package
        run: |
          git config user.name 'gnk-asg-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/portal/gnk-aktual/kolumne apps/portal/en/gnk-aktual/columns
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(aktual): finalize columnist archive and SEO pages [skip ci]'
          git push origin HEAD:agent/aktual-media-clean-final2-20260803
