name: HR EN Parity Gate

on:
  pull_request:
    paths:
      - 'apps/portal/**'
      - 'scripts/validate-hr-en-parity-v1.mjs'
      - '.github/workflows/hr-en-parity-gate.yml'
  push:
    branches: [main]
    paths:
      - 'apps/portal/**'
      - 'scripts/validate-hr-en-parity-v1.mjs'
      - '.github/workflows/hr-en-parity-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hr-en-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check parity validator
        run: node --check scripts/validate-hr-en-parity-v1.mjs
      - name: Enforce reciprocal HR EN parity
        run: node scripts/validate-hr-en-parity-v1.mjs
      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hr-en-parity-${{ github.sha }}
          path: artifacts/hr-en-parity-audit.json
          if-no-files-found: error
          retention-days: 14
