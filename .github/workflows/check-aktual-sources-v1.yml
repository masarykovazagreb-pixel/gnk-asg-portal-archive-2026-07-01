name: Check AKTUAL Sources V1

on:
  pull_request:
    paths:
      - 'apps/portal/gnk-aktual/izvori/**'
      - 'apps/portal/en/gnk-aktual/sources/**'
      - 'apps/portal/gnk-aktual/index.html'
      - 'apps/portal/en/gnk-aktual/index.html'
      - 'apps/portal/gnk-aktual/radar/**'
      - 'apps/portal/en/gnk-aktual/radar/**'
      - 'apps/portal/assets/aktual-sources-v1.css'
      - 'apps/portal/assets/aktual-sources-v1.js'
      - 'apps/portal/assets/aktual-media-world-v1.js'
      - 'apps/portal/sitemap.xml'
      - 'config/control-plane/workforce-bot-taskboard-v1.json'
      - 'scripts/test-aktual-sources-v1.mjs'
      - '.github/workflows/check-aktual-sources-v1.yml'
  push:
    branches: [main]
    paths:
      - 'apps/portal/gnk-aktual/izvori/**'
      - 'apps/portal/en/gnk-aktual/sources/**'
      - 'apps/portal/gnk-aktual/index.html'
      - 'apps/portal/en/gnk-aktual/index.html'
      - 'apps/portal/gnk-aktual/radar/**'
      - 'apps/portal/en/gnk-aktual/radar/**'
      - 'apps/portal/assets/aktual-sources-v1.css'
      - 'apps/portal/assets/aktual-sources-v1.js'
      - 'apps/portal/assets/aktual-media-world-v1.js'
      - 'apps/portal/sitemap.xml'
      - 'config/control-plane/workforce-bot-taskboard-v1.json'
      - 'scripts/test-aktual-sources-v1.mjs'
      - '.github/workflows/check-aktual-sources-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate AKTUAL source-transparency contract
        run: node scripts/test-aktual-sources-v1.mjs
