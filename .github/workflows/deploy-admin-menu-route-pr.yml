name: Validate Admin Menu Route PR

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/portal/assets/public-menu-final-v9.js"
      - "workers/gnk-asg-public-menu-fix/src/index.js"
      - "workers/gnk-asg-public-menu-fix/wrangler.toml"
      - ".github/workflows/deploy-admin-menu-route-pr.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate menu assets
        shell: bash
        run: |
          set -euo pipefail
          node --check workers/gnk-asg-public-menu-fix/src/index.js
          node --check apps/portal/assets/public-menu-final-v9.js
          grep -Fq "['Admin', '/operator-dashboard/', 'nofollow']" apps/portal/assets/public-menu-final-v9.js
          grep -Fq "GNK_ASG_PUBLIC_MENU_ROUTE_V2_20260625" workers/gnk-asg-public-menu-fix/src/index.js
          ! grep -Fq "/operator/session/login?next=/operator-dashboard" apps/portal/assets/public-menu-final-v9.js
          node scripts/test-deploy-approval-guardrails.mjs
      - name: Wrangler dry run
        working-directory: workers/gnk-asg-public-menu-fix
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.toml
      - name: Confirm validation-only boundary
        run: echo "Production deployment is not permitted from this event."
