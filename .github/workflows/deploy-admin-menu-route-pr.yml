name: Validate Admin Menu Route PR

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/portal/assets/public-menu-final-v9.js"
      - "workers/gnk-asg-public-menu-fix/src/index.js"
      - "workers/gnk-asg-public-menu-fix/wrangler.toml"
      - ".github/workflows/deploy-admin-menu-route-pr.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Izričito odobren produkcijski deploy menu asset Workera"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate menu assets
        shell: bash
        run: |
          set -euo pipefail
          node --check workers/gnk-asg-public-menu-fix/src/index.js
          node --check apps/portal/assets/public-menu-final-v9.js
          grep -Fq "['Admin', '/operator-dashboard/', 'nofollow']" apps/portal/assets/public-menu-final-v9.js
          grep -Fq "GNK_ASG_PUBLIC_MENU_ROUTE_V2_20260625" workers/gnk-asg-public-menu-fix/src/index.js
          ! grep -Fq "/operator/session/login?next=/operator-dashboard" apps/portal/assets/public-menu-final-v9.js
      - name: Wrangler dry run
        working-directory: workers/gnk-asg-public-menu-fix
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.toml

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy explicitly approved menu asset worker
        working-directory: workers/gnk-asg-public-menu-fix
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-public-menu-fix
      - name: Verify production menu asset
        shell: bash
        run: |
          set -euo pipefail
          sleep 15
          code=$(curl --silent --show-error --dump-header asset.headers --output menu.js --write-out '%{http_code}' "https://gnk-asg.hr/assets/public-menu-final-v9.js?cb=$(date +%s)")
          test "$code" = "200"
          grep -qi '^x-gnk-asg-menu-fix: GNK_ASG_PUBLIC_MENU_ROUTE_V2_20260625' asset.headers
          node --check menu.js
          grep -Fq "['Admin', '/operator-dashboard/', 'nofollow']" menu.js
          ! grep -Fq "/operator/session/login?next=/operator-dashboard" menu.js
