name: REGION — deploy izdanja

# Objavljuje samo Cloudflare Pages preusmjeravanja (gnk-asg-kanal-<id>).
# Kanonski gradski sadržaj /kanal/<id>/ objavljuje exact-SHA portal deploy.
# Ne pokreće se na svako ažuriranje regionalne arhive ili galerije.

on:
  push:
    branches: [main]
    paths:
      # Satellite Cloudflare Pages projects are redirect stubs only.
      # Feed, archive, gallery and canonical portal changes are deployed
      # separately by the exact-SHA portal workflow.
      - 'apps/region/site/**'
      - 'apps/region/channels.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: region-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sastavi izdanja i hub
        shell: bash
        run: |-
          set -euo pipefail
          node apps/region/engine/build.mjs
          node apps/region/engine/hub.mjs
          # Tvornica: standard (nazivi, hashtagovi, meta duljina) nakon generatora
          python3 scripts/factory/apply_standard.py
          # Slojevi (entitet, traka, znak, tokeni, oznake Nermina, osvježavanje…) iz jedinog popisa;
          # bez ovoga svaki generator izbriše sloj koji je prije primijenjen.
          node scripts/sync-all-v1.mjs --group=layers
          # Standard (hashtagovi, meta) ponovno nakon slojeva: sloj ne smije vratiti stari meta opis.
          python3 scripts/factory/apply_standard.py
          node apps/region/engine/audit.mjs
          node scripts/audit-aktual-brand-indexability-v1.mjs --strict
          # Kanali su sada pod glavnom domenom: apps/portal/kanal/<id>/ ; apps/region/site/<id>/ je samo 301 stub.
          test -f apps/region/site/zagreb/index.html
          grep -q '301' apps/region/site/zagreb/_redirects
          test -f apps/portal/izdanja/index.html
          test -f apps/portal/kanal/index.html
          test -f apps/portal/kanal/zagreb/sitemap.xml
          # Popis izdanja se čita iz channels.json — novo izdanje ne smije
          # proći deploy bez svoje stranice, a ni gate ne smije ostati na
          # starom popisu od osam gradova.
          for id in $(node -e "console.log(JSON.parse(require('fs').readFileSync('apps/region/channels.json','utf8')).channels.map(c=>c.id).join(' '))"); do
            test -f "apps/portal/kanal/$id/index.html" || { echo "::error::nedostaje kanal $id"; exit 1; }
          done
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('apps/portal/kanal/zagreb/feed.json','utf8'));console.log('feed items:',d.items.length)"
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('apps/region/data/zagreb.json','utf8'));console.log('stored items:',d.items.length);if(d.items.length<300)process.exit(1)"
          test -f apps/portal/kanal/zagreb/en/index.html

      - name: Pripremi Cloudflare projekte
        id: cf
        shell: bash
        run: |-
          set -uo pipefail
          if [ -z "${CF_TOKEN:-}" ] || [ -z "${CF_ACCOUNT:-}" ]; then
            echo "::error::Cloudflare credentials unavailable; satellite redirects were NOT deployed."
            exit 1
          fi
          ready=false
          for dir in apps/region/site/*/; do
            id=$(basename "$dir")
            project="gnk-asg-kanal-$id"
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$project")
            if [ "$code" != "200" ]; then
              curl -s -o /dev/null -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
                --data "{\"name\":\"$project\",\"production_branch\":\"main\"}" \
                "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects" || true
            fi
            if curl -fsS -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$project" >/dev/null; then
              ready=true
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Objavi sve satelitske 301 preusmjerivače
        if: steps.cf.outputs.ready == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |-
          set -euo pipefail
          failed=0
          for dir in apps/region/site/*/; do
            id=$(basename "$dir")
            test -f "$dir/_redirects"
            grep -q '301' "$dir/_redirects"
            if ! npx --yes wrangler@4 pages deploy "$dir" --project-name="gnk-asg-kanal-$id" --branch=main --commit-dirty=true; then
              echo "::error::Cloudflare Pages redirect deployment failed: gnk-asg-kanal-$id"
              failed=$((failed+1))
            fi
          done
          echo "Satellite redirect deployment failures: $failed" >> "$GITHUB_STEP_SUMMARY"
          test "$failed" -eq 0

      - name: Sažetak
        if: always()
        shell: bash
        run: |-
          {
            echo "## AKTUAL MEDIA REGION"
            echo "- Hub: https://gnk-asg.hr/izdanja/"
            for dir in apps/region/site/*/; do
              id=$(basename "$dir")
              echo "- https://gnk-asg-kanal-$id.pages.dev/"
            done
            echo "- Status: automatski osvrti, izvornici povezani"
          } >> "$GITHUB_STEP_SUMMARY"
