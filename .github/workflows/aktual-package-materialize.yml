name: Materialize sanitized Aktual Media package
on:
  push:
    branches: [feat/aktual-radio-incident-evolution-20261002]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize package safely
        run: |
          set -euo pipefail
          python scripts/materialize-aktual-gallery-v1.py
          python scripts/build_gallery_standalone_pages.py
          python scripts/sync_gallery_links.py
          python scripts/apply-aktual-media-decks-v1.py
          node scripts/autonomous-evolution-engine.mjs
          node scripts/generate-worker-live-reports.mjs
          node scripts/refresh-regional-incident-monitor.mjs

      - name: Validate truth and syntax
        run: |
          set -euo pipefail
          node --check apps/portal/assets/aktual-radio-player-v1.js
          node --check apps/portal/assets/regional-incident-desk-v1.js
          node --check apps/portal/assets/worker-live-desk-v1.js
          node --check apps/portal/assets/workforce-evolution-desk-v1.js
          python -m py_compile             scripts/materialize-aktual-gallery-v1.py             scripts/build_gallery_standalone_pages.py             scripts/sync_gallery_links.py             scripts/apply-aktual-media-decks-v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          vg=json.loads(Path('apps/portal/data/visual_gallery.json').read_text())
          ids={str(x.get('id')) for x in vg.get('items',[])}
          assert len(vg.get('items',[])) == 80, len(vg.get('items',[]))
          assert 'nermin-sefic-33-kk-cibona-zagreb-stratesko-partnerstvo' not in ids
          for p in [
            'apps/portal/data/regional-incident-monitor.json',
            'apps/portal/data/worker-live-reports.json',
            'apps/portal/data/workforce-evolution-log.json',
          ]:
            json.loads(Path(p).read_text())
          assert 'aktualRadioDeck' in Path('apps/portal/gnk-aktual/index.html').read_text()
          assert 'aktualRadioDeck' in Path('apps/portal/en/gnk-aktual/index.html').read_text()
          assert Path('apps/portal/radio/index.html').exists()
          assert Path('apps/portal/en/radio/index.html').exists()
          PY
          test -z "$(git diff --name-only | grep -E '^apps/portal/(en/)?index\.html$' || true)"
          test -z "$(git diff --name-only | grep -iE 'mail|smtp|imap|deploy-admin-auth' || true)"
          ! grep -RniE 'Cibona.{0,100}(partner|partnerstvo)|partner.{0,100}Cibona'             apps/portal/galerija apps/portal/visual-index apps/portal/en/visual-index apps/portal/data/visual_gallery.json
          ! grep -RniE '(^|[^[:alnum:]_])bot(ovi|s)?([^[:alnum:]_]|$)'             apps/portal/gnk-aktual apps/portal/en/gnk-aktual apps/portal/radio apps/portal/en/radio             apps/portal/assets/worker-live-desk-v1.js apps/portal/assets/workforce-evolution-desk-v1.js             apps/portal/data/worker-live-reports.json

      - name: Commit generated branch artifacts
        run: |
          set -euo pipefail
          git config user.name 'aktual-package-materializer'
          git config user.email 'actions@github.com'
          git rm .github/workflows/aktual-package-materialize.yml
          git add apps/portal scripts
          git commit -m 'Aktual Media: materialize sanitized package [materialized]'
          git push origin HEAD:${GITHUB_REF_NAME}
