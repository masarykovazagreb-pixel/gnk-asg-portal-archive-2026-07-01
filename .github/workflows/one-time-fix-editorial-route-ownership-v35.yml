name: One-Time Fix Editorial Route Ownership V35

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fix-editorial-route-ownership-v35.yml'

permissions:
  contents: write

concurrency:
  group: one-time-fix-editorial-route-ownership-v35
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Assign only editorial routes to current operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node - <<'JS'
          const fs=require('fs');
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!token)throw new Error('missing_cloudflare_api_token');
          const headers={Authorization:`Bearer ${token}`,'Content-Type':'application/json'};
          const targetScript='gnk-asg-direct-operator';
          const roots=['/objave','/komentari','/analize','/en/publications','/en/commentary','/en/analyses'];
          const hosts=['gnk-asg.hr','www.gnk-asg.hr'];
          const desired=[];
          for(const host of hosts){
            for(const root of roots){
              desired.push(`${host}${root}`,`${host}${root}/*`);
            }
          }
          async function call(url,options={}){
            const response=await fetch(url,{...options,headers:{...headers,...(options.headers||{})}});
            const data=await response.json();
            if(!response.ok||data.success===false)throw new Error(`${response.status} ${JSON.stringify(data.errors||data)}`);
            return data;
          }
          (async()=>{
            const zones=await call('https://api.cloudflare.com/client/v4/zones?name=gnk-asg.hr&status=active');
            const zoneId=zones.result?.[0]?.id;
            if(!zoneId)throw new Error('zone_not_found');
            const current=await call(`https://api.cloudflare.com/client/v4/zones/${zoneId}/workers/routes`);
            const actions=[];
            for(const pattern of desired){
              const existing=(current.result||[]).find(route=>route.pattern===pattern);
              if(existing){
                if(existing.script===targetScript){
                  actions.push({pattern,action:'unchanged',script:targetScript,routeId:existing.id});
                }else{
                  await call(`https://api.cloudflare.com/client/v4/zones/${zoneId}/workers/routes/${existing.id}`,{
                    method:'PUT',body:JSON.stringify({pattern,script:targetScript})
                  });
                  actions.push({pattern,action:'updated',from:existing.script||null,to:targetScript,routeId:existing.id});
                }
              }else{
                const created=await call(`https://api.cloudflare.com/client/v4/zones/${zoneId}/workers/routes`,{
                  method:'POST',body:JSON.stringify({pattern,script:targetScript})
                });
                actions.push({pattern,action:'created',script:targetScript,routeId:created.result?.id||null});
              }
            }
            const after=await call(`https://api.cloudflare.com/client/v4/zones/${zoneId}/workers/routes`);
            const verified=desired.map(pattern=>{
              const route=(after.result||[]).find(item=>item.pattern===pattern);
              return {pattern,script:route?.script||null,routeId:route?.id||null,ok:route?.script===targetScript};
            });
            if(verified.some(item=>!item.ok))throw new Error(`route_verification_failed ${JSON.stringify(verified.filter(item=>!item.ok))}`);
            fs.writeFileSync('artifacts/editorial-route-ownership-v35.json',JSON.stringify({checkedAt:new Date().toISOString(),ok:true,targetScript,scope:'editorial-routes-only',desiredCount:desired.length,actions,verified},null,2));
          })().catch(error=>{
            fs.writeFileSync('artifacts/editorial-route-ownership-v35.json',JSON.stringify({checkedAt:new Date().toISOString(),ok:false,scope:'editorial-routes-only',error:error.message},null,2));
            process.exitCode=1;
          });
          JS

      - name: Commit route ownership evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/editorial-route-ownership-v35.json
          if git diff --cached --quiet; then
            echo 'No evidence change.'
            exit 0
          fi
          git commit -m 'Record editorial route ownership V35'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            echo "Push odbijen (pokusaj $attempt) - main se pomaknuo, radim fetch+rebase."
            git fetch origin main
            git rebase origin/main || { echo "Rebase konflikt."; exit 1; }
            sleep $((attempt * 5))
            if [ "$attempt" = "5" ]; then echo "Push nije uspio nakon 5 pokusaja."; exit 1; fi
          done
