name: High Throughput Indexability Extension V13

on:
  pull_request:
    paths:
      - 'apps/portal/**'
      - 'ops/high-throughput-capability-extension-v13.json'
      - 'scripts/audit-robots-sitemap-declaration-v1.mjs'
      - 'scripts/audit-indexable-route-self-canonical-v1.mjs'
      - 'scripts/audit-hreflang-reciprocity-v1.mjs'
      - 'scripts/validate-high-throughput-capability-extension-v13.py'
      - '.github/workflows/high-throughput-indexability-extension-v13.yml'
  push:
    branches: [main]
    paths:
      - 'apps/portal/**'
      - 'ops/high-throughput-capability-extension-v13.json'
      - 'scripts/audit-robots-sitemap-declaration-v1.mjs'
      - 'scripts/audit-indexable-route-self-canonical-v1.mjs'
      - 'scripts/audit-hreflang-reciprocity-v1.mjs'
      - 'scripts/validate-high-throughput-capability-extension-v13.py'
      - '.github/workflows/high-throughput-indexability-extension-v13.yml'

permissions:
  contents: read

concurrency:
  group: high-throughput-indexability-v13-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax checks
        run: |
          set -euo pipefail
          node --check scripts/audit-robots-sitemap-declaration-v1.mjs
          node --check scripts/audit-indexable-route-self-canonical-v1.mjs
          node --check scripts/audit-hreflang-reciprocity-v1.mjs
          python -m py_compile scripts/validate-high-throughput-capability-extension-v13.py
      - name: Robots sitemap declaration integrity
        run: node scripts/audit-robots-sitemap-declaration-v1.mjs
      - name: Indexable route self canonical
        run: node scripts/audit-indexable-route-self-canonical-v1.mjs
      - name: Hreflang reciprocity
        run: node scripts/audit-hreflang-reciprocity-v1.mjs
      - name: Workforce capability extension topology
        run: python scripts/validate-high-throughput-capability-extension-v13.py
      - name: Upload V13 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: high-throughput-indexability-v13-${{ github.sha }}
          path: |
            artifacts/robots-sitemap-declaration/**
            artifacts/indexable-route-self-canonical/**
            artifacts/hreflang-reciprocity/**
            artifacts/high-throughput-capability-extension-v13/**
          if-no-files-found: warn
          retention-days: 14
