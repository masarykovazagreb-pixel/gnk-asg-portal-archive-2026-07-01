# 2026-11-20: verified 5-section curated weekly issue, no relaxation of source gates.
name: Materialize WORLD201 PR476 editorial release artifacts
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize-world201-pr476.yml'
permissions:
  contents: write
concurrency:
  group: world201-pr476-materialize-once
  cancel-in-progress: false
jobs:
  materialize:
    if: ${{ github.event.pull_request.number == 476 && github.event.pull_request.head.repo.full_name == 'masarykovazagreb-pixel/gnk-asg-portal-archive-2026-07-01' && github.event.pull_request.head.ref == 'feature/world201-cloudflare-bilingual-20261119' && github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact reviewed feature branch and no uncommitted source
        env:
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          git diff --quiet
          git diff --cached --quiet
          test "$(git ls-remote origin refs/heads/feature/world201-cloudflare-bilingual-20261119 | cut -f1)" = "$REVIEWED_SHA"
      - name: Install ImageMagick WebP renderer for original covers
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y imagemagick
          command -v convert
          convert -version
      - name: Materialize current weekly archive and two canonical editorials
        run: |
          set -euo pipefail
          node scripts/build-aktual-media-weekly-v1.mjs --check
          node scripts/build-aktual-media-weekly-archive-v1.mjs --refresh
          node scripts/editorial-registry-v1.mjs
          node scripts/generate-editorial-cover-assets-v1.mjs
          printf '%s\n' '["/objave/dinamo-rokovi-odgovornost-prema-navijacima/","/en/publications/dinamo-trademark-deadlines-accountability/"]' > "$RUNNER_TEMP/world201-pr476-routes.json"
          node scripts/apply-editorial-publication-completeness-v1.mjs --write --routes-file "$RUNNER_TEMP/world201-pr476-routes.json"
          node scripts/editorial-registry-v1.mjs
          node scripts/generate-editorial-sitemap-v2.mjs
          node scripts/editorial-registry-v1.mjs
          node scripts/build-editorial-archive-listings-v1.mjs --write
          node scripts/editorial-registry-v1.mjs
          node scripts/generate-editorial-sitemap-v2.mjs
          node scripts/editorial-registry-v1.mjs
      - name: Validate full publication gate without reducing any checks
        run: |
          set -euo pipefail
          node scripts/build-aktual-world-en-v1.mjs --check
          node scripts/build-aktual-media-weekly-v1.mjs --check
          node scripts/test-aktual-media-weekly-v1.mjs
          python scripts/validate_publication_sitemap_registry_v1.py
          node scripts/audit-editorial-publication-completeness-v1.mjs
      - name: Commit generated assets ONLY to reviewed PR feature branch
        env:
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          test "$(git ls-remote origin refs/heads/feature/world201-cloudflare-bilingual-20261119 | cut -f1)" = "$REVIEWED_SHA"
          git add -- \
            apps/portal/data/aktual-weekly-archives/2026-11-16.json \
            apps/portal/gnk-aktual/tjedni/2026-11-16/index.html \
            apps/portal/en/gnk-aktual/weekly/2026-11-16/index.html \
            apps/portal/gnk-aktual/tjedni/index.html \
            apps/portal/en/gnk-aktual/weekly/index.html \
            apps/portal/data/editorial-registry.json \
            apps/portal/data/editorial-image-manifest.json \
            apps/portal/editorial-sitemap.xml \
            apps/portal/sitemap-index.xml \
            apps/portal/objave/dinamo-rokovi-odgovornost-prema-navijacima/index.html \
            apps/portal/en/publications/dinamo-trademark-deadlines-accountability/index.html \
            apps/portal/objave/index.html \
            apps/portal/en/publications/index.html
          git add -- apps/portal/assets/editorial/generated/
          if git diff --cached --quiet; then
            echo "Generated artifacts already reproducible. No PR push needed."
            exit 0
          fi
          git diff --cached --name-only | while IFS= read -r p; do
            case "$p" in
              apps/portal/data/aktual-weekly-archives/2026-11-16.json|\
              apps/portal/gnk-aktual/tjedni/2026-11-16/index.html|\
              apps/portal/en/gnk-aktual/weekly/2026-11-16/index.html|\
              apps/portal/gnk-aktual/tjedni/index.html|\
              apps/portal/en/gnk-aktual/weekly/index.html|\
              apps/portal/data/editorial-registry.json|\
              apps/portal/data/editorial-image-manifest.json|\
              apps/portal/editorial-sitemap.xml|\
              apps/portal/sitemap-index.xml|\
              apps/portal/objave/dinamo-rokovi-odgovornost-prema-navijacima/index.html|\
              apps/portal/en/publications/dinamo-trademark-deadlines-accountability/index.html|\
              apps/portal/objave/index.html|\
              apps/portal/en/publications/index.html|\
              apps/portal/assets/editorial/generated/*) ;;
              *) echo "::error::Unapproved generated path $p"; exit 1 ;;
            esac
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(world201): materialize verified weekly archive and bilingual editorial publication"
          git push origin HEAD:refs/heads/feature/world201-cloudflare-bilingual-20261119
          echo "Updated PR #476 feature branch only; production main and Cloudflare unchanged."
