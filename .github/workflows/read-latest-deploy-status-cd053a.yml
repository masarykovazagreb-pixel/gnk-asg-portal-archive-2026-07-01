name: Read Latest Deploy Status cd053a

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/read-latest-deploy-status-cd053a.yml'

permissions:
  actions: read
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Record latest production deploy
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: cd053a4514b2c322e25baa90cf06e77b7ca19b75
          NOT_BEFORE: '2026-07-15T07:20:00Z'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          run_id=''
          for attempt in $(seq 1 12); do
            runs=$(gh run list --repo beckuphome-gnk/gnk-asg-portal --workflow deploy-admin-auth-v6.yml --event workflow_dispatch --limit 20 --json databaseId,createdAt,status,conclusion,headSha,url,displayTitle)
            run_id=$(printf '%s' "$runs" | jq -r --arg nb "$NOT_BEFORE" '[.[] | select(.createdAt >= $nb)] | sort_by(.createdAt) | last | .databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            jq -n --arg approvedSha "$APPROVED_SHA" --arg notBefore "$NOT_BEFORE" '{ok:false,state:"no_deploy_run_found",approvedSha:$approvedSha,notBefore:$notBefore}' > artifacts/latest-deploy-cd053a.json
          else
            set +e
            gh run watch "$run_id" --repo beckuphome-gnk/gnk-asg-portal --exit-status
            watch_exit=$?
            set -e
            gh run view "$run_id" --repo beckuphome-gnk/gnk-asg-portal --json databaseId,createdAt,updatedAt,status,conclusion,headSha,url,event,workflowName,jobs | jq --arg approvedSha "$APPROVED_SHA" --argjson watchExit "$watch_exit" '. + {approvedSha:$approvedSha,watchExit:$watchExit,recordedAt:(now|todateiso8601)}' > artifacts/latest-deploy-cd053a.json
          fi
      - name: Commit evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/latest-deploy-cd053a.json
          git commit -m "Record latest deploy cd053a status" || exit 0
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            echo "Push odbijen (pokusaj $attempt) - main se pomaknuo, radim fetch+rebase."
            git fetch origin main
            git rebase origin/main || { echo "Rebase konflikt."; exit 1; }
            sleep $((attempt * 5))
            if [ "$attempt" = "5" ]; then echo "Push nije uspio nakon 5 pokusaja."; exit 1; fi
          done
