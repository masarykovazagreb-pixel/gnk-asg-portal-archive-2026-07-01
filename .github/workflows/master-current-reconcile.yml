name: MASTER Current Reconcile

on:
  pull_request:
    paths:
      - 'config/nn-constitutional-model-v1.json'
      - 'config/master-asg-intelligence-learning-v1.json'
      - 'config/health-sentinel-persistent-ledger-v1.json'
      - 'config/master-asg-legal-department-v1.json'
      - 'scripts/validate-master-current-reconcile.mjs'
      - '.github/workflows/master-current-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate MASTER reconciled contracts
        run: node scripts/validate-master-current-reconcile.mjs
