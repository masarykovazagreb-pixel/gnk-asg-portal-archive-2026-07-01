name: Validate Current Media Command Center

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/test-media-command-center-v20.yml'
      - '.github/workflows/deploy-public-portal.yml'
      - 'apps/portal/media-command-center/**'
      - 'apps/portal/assets/media-command-center-v1.css'
      - 'apps/portal/assets/media-command-center-v1.js'
      - 'apps/portal/assets/admin-media-command-center-nav-v20.js'
      - 'apps/portal/data/media-outreach-contacts-v1.json'
      - 'workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v1.js'
      - 'workers/gnk-asg-direct-operator/src/media-command-center-v1.js'
      - 'workers/gnk-asg-direct-operator/src/media-outreach-delivery-html-v1.js'
      - 'workers/gnk-asg-direct-operator/wrangler.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-command-center-current-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate current source entrypoint
        shell: bash
        run: |
          set -euo pipefail
          node --check workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v1.js
          node --check workers/gnk-asg-direct-operator/src/media-command-center-v1.js
          node --check workers/gnk-asg-direct-operator/src/media-outreach-delivery-html-v1.js
          node --check apps/portal/assets/media-command-center-v1.js
          node --check apps/portal/assets/admin-media-command-center-nav-v20.js
          grep -q 'main = "src/index-final-admin-gateway-v1.js"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'MEDIA_OUTREACH_LIVE = ' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'MEDIA_OUTREACH_TEST_LIVE = ' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'MEDIA_APPLICATION_AUTO_ACK = "true"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'media@gnk-asg.hr' workers/gnk-asg-direct-operator/src/media-outreach-delivery-html-v1.js
          test -s apps/portal/media-command-center/index.html
          test -s apps/portal/data/media-outreach-contacts-v1.json

      - name: Validate explicit delivery safety gates
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SEND_TEST_EMAIL' workers/gnk-asg-direct-operator/src/media-outreach-delivery-html-v1.js
          grep -q 'QUEUE_APPROVED_MEDIA' workers/gnk-asg-direct-operator/src/media-outreach-delivery-html-v1.js
          grep -q 'DISPATCH_ONE_QUEUED_EMAIL' workers/gnk-asg-direct-operator/src/media-outreach-delivery-html-v1.js
          grep -q 'valid_test_gate_required' workers/gnk-asg-direct-operator/src/media-outreach-delivery-html-v1.js
          grep -q 'processDeliveryQueue' workers/gnk-asg-direct-operator/src/media-outreach-delivery-html-v1.js
          grep -q 'automation_allowed' workers/gnk-asg-direct-operator/src/media-outreach-delivery-html-v1.js
          grep -q 'approved' workers/gnk-asg-direct-operator/src/media-outreach-delivery-html-v1.js
          grep -q 'suppressed' workers/gnk-asg-direct-operator/src/media-outreach-delivery-html-v1.js

      - name: Validate contact registry integrity without fixed historical counts
        run: |
          node - <<'JS'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('apps/portal/data/media-outreach-contacts-v1.json','utf8'));
          if(!Array.isArray(data)||!data.length)throw new Error('Media contact registry is empty or invalid');
          const codes=data.map(item=>String(item.mailCode||'').trim()).filter(Boolean);
          const emails=data.map(item=>String(item.email||'').trim().toLowerCase()).filter(Boolean);
          if(codes.length!==data.length)throw new Error('Every media contact must have a mailCode');
          if(new Set(codes).size!==codes.length)throw new Error('Duplicate media mailCode detected');
          if(data.some(item=>item.approved!==undefined&&typeof item.approved!=='boolean'))throw new Error('Approved must be boolean when specified');
          if(data.some(item=>item.automationAllowed!==undefined&&typeof item.automationAllowed!=='boolean'))throw new Error('AutomationAllowed must be boolean when specified');
          const approved=data.filter(item=>item.approved===true).length;
          const automationAllowed=data.filter(item=>item.automationAllowed===true).length;
          console.log(JSON.stringify({total:data.length,uniqueCodes:new Set(codes).size,emails:emails.length,approved,automationAllowed}));
          JS

      - name: Build canonical Worker without deploying
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_ACCOUNT_ID: 00000000000000000000000000000000
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator

      - name: Confirm no delivery action was executed
        run: echo 'Media Command Center validated without sending, queueing, approving or deploying.'
