name: Zavrsna provjera zadnje stranice
on: workflow_dispatch
jobs:
  provjeri:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p apps/portal/data/tmp-zavrsna
          for ruta in "/" "/en/publications/financial-statement-examples-croatia/" "/objave/primjeri-financijskih-izvjestaja-hrvatska/"; do
            kod=$(curl -s -o /dev/null -w "%{http_code}" "https://gnk-asg.hr${ruta}")
            echo "${kod} ${ruta}" >> apps/portal/data/tmp-zavrsna/r.txt
          done
          cat apps/portal/data/tmp-zavrsna/r.txt
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          BRANCH="zavrsna-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-zavrsna
          git commit -m "zavrsna provjera"
          git push origin "$BRANCH"
