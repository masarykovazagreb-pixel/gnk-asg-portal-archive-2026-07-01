name: Content Queue Backfill (one-time)

# Jednokratni backfill: objavljuje SVE nezapočete queue stavke odmah.
# Namijenjeno pokretati ručno (workflow_dispatch). Blog Mirror ih pokupi
# automatski jer se editorial-registry mijenja.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: content-queue-publish
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Backfill publish all queue items
        run: node scripts/content-queue-backfill-v1.mjs | tee /tmp/backfill-out.txt
      - name: Commit and dispatch exact-SHA production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gnk-content-queue-bot"
          git config user.email "actions@github.com"
          git add apps/portal
          if git diff --cached --quiet; then
            echo "Nema promjena."
            exit 0
          fi
          git commit -m "Content queue backfill: publish all 40-day queue items (scheduled dates preserved)"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            echo "Push odbijen (pokusaj $attempt) - main se pomaknuo, radim fetch+rebase."
            git fetch origin main
            git rebase origin/main || { echo "Rebase konflikt."; exit 1; }
            sleep $((attempt * 5))
            if [ "$attempt" = "5" ]; then echo "Push nije uspio nakon 5 pokusaja."; exit 1; fi
          done
          sha="$(git rev-parse HEAD)"
          gh workflow run deploy-admin-auth-v6.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f confirm_production_deploy=DEPLOY_ADMIN_AUTH_V6 \
            -f approved_sha="$sha"
      - name: Summary
        if: always()
        run: |
          echo '## Backfill' >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,80p' /tmp/backfill-out.txt >> "$GITHUB_STEP_SUMMARY" || true
