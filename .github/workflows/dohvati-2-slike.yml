name: Dohvati 2 slike (jednokratno)
on: workflow_dispatch
jobs:
  dohvati:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p apps/portal/data/tmp-2s
          curl -s "https://gnk-asg.hr/api/slike?upit=financial+auditor+reviewing+reports" -o apps/portal/data/tmp-2s/revizor.json
          curl -s "https://gnk-asg.hr/api/slike?upit=warehouse+supplier+quality+inspection" -o apps/portal/data/tmp-2s/dobavljac.json
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          BRANCH="slike2-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-2s
          git commit -m "slike"
          git push origin "$BRANCH"
