name: Diagnose Media Worker Dry Run

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/probe-dryrun.trigger"

permissions:
  contents: read
  actions: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wrangler dry run with concise error tail
        working-directory: workers/gnk-asg-direct-operator
        shell: bash
        run: |
          set +e
          npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator --dry-run > /tmp/wrangler-dry-run.log 2>&1
          code=$?
          echo "WRANGLER_EXIT_CODE=$code"
          tail -n 100 /tmp/wrangler-dry-run.log
          exit $code
      - name: Capture latest push deploy runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-media-source-push-v2.yml/runs?per_page=10" > push-deploy-runs.json
          jq -r '.workflow_runs[] | [.id,.status,.conclusion,.head_sha,.created_at] | @tsv' push-deploy-runs.json
      - uses: actions/upload-artifact@v4
        with:
          name: media-push-deploy-runs
          path: push-deploy-runs.json
          retention-days: 3
