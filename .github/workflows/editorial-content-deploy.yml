name: Deploy Approved Editorial Content
on:
  push:
    branches: [main]
    paths:
      - 'apps/portal/objave/**'
      - 'apps/portal/komentari/**'
      - 'apps/portal/analize/**'
      - 'apps/portal/en/publications/**'
      - 'apps/portal/en/commentary/**'
      - 'apps/portal/en/analyses/**'
      - 'apps/portal/digital-workforce/newsroom/**'
      - 'apps/portal/en/digital-workforce/newsroom/**'
      - 'apps/portal/editorial-sitemap.xml'
      - 'apps/portal/data/news.json'
      - 'apps/portal/data/news_archive.json'
      - 'apps/portal/data/update_status.json'
      - 'apps/portal/data/seo-visibility-status.json'
permissions:
  contents: read
  actions: write
concurrency:
  group: editorial-production-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify editorial-only change scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          git diff --name-only "$before" "$after" > /tmp/changed.txt
          cat /tmp/changed.txt
          if grep -Ev '^(apps/portal/(objave|komentari|analize|en/publications|en/commentary|en/analyses)/|apps/portal/(en/)?digital-workforce/newsroom/|apps/portal/editorial-sitemap\.xml$|apps/portal/(sitemap\.xml|sitemap-index\.xml|image-sitemap\.xml)$|apps/portal/data/(news\.json|news_archive\.json|update_status\.json|seo-visibility-status\.json)$|apps/portal/data/editorial-plan/manifest\.json$|artifacts/(editorial-scheduled-publish|seo-visibility-report)\.json$)' /tmp/changed.txt | grep -q .; then
            # Push mijesa urednicke i neuredničke promjene. Automatski deploy se
            # NE pokrece, ali posao se ne obiljezava kao pad: lazni padovi su
            # zatrpavali prave greske u povijesti izvodenja.
            echo "Non-editorial change detected; automatic deployment is skipped."
            echo "editorial_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "editorial_only=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch exact-SHA production deploy
        if: steps.scope.outputs.editorial_only == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-admin-auth-v6.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f confirm_production_deploy=DEPLOY_ADMIN_AUTH_V6 \
            -f approved_sha="${{ github.sha }}"
