name: Regeneriraj image-sitemap (jednokratno)
on: workflow_dispatch
jobs:
  regeneriraj:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/generate-image-sitemap.py
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          git add apps/portal/image-sitemap.xml
          git diff --cached --stat
          git commit -m "chore(seo): regenerate image sitemap after historical translation backlog" || echo "nema promjena"
          git push origin main
