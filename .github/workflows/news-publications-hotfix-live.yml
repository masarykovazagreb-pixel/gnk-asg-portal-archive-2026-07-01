name: GNK ASG News Publications Hotfix

on:
  push:
    branches: [main]
    paths:
      - 'workers/gnk-asg-direct-operator/**'
      - 'apps/portal/vijesti/**'
      - 'apps/portal/news/**'
      - 'apps/portal/assets/business-news.css'
      - 'apps/portal/assets/business-news.js'
      - '.github/workflows/news-publications-hotfix-live.yml'
  workflow_dispatch:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: gnk-asg-news-publications-hotfix
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'issues' || contains(github.event.issue.title, 'RUN GNK ASG NEWS PUBLICATIONS HOTFIX')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check workers/gnk-asg-direct-operator/src/index-publication-news-hotfix.js
          node --check apps/portal/assets/business-news.js
          ! grep -qi 'http-equiv="refresh"' apps/portal/vijesti/index.html
          ! grep -qi 'http-equiv="refresh"' apps/portal/news/index.html
      - name: Deploy isolated Worker
        id: deploy
        shell: bash
        run: |
          set +e
          npx --yes wrangler@4 deploy --config workers/gnk-asg-direct-operator/wrangler.toml > deploy.log 2>&1
          code=$?
          cat deploy.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Wait
        if: steps.deploy.outputs.code == '0'
        run: sleep 15
      - name: Refresh and verify
        id: verify
        if: steps.deploy.outputs.code == '0'
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --location --output refresh.json --write-out '%{http_code}' --request POST https://gnk-asg.hr/api/news-refresh)
          cat refresh.json
          test "$code" = '200' -o "$code" = '429'
          for url in https://gnk-asg.hr/data/news.json https://gnk-asg.hr/data/news-automation-status.json https://gnk-asg.hr/vijesti/ https://gnk-asg.hr/news/ https://gnk-asg.hr/objave/ https://gnk-asg.hr/publications/; do
            code=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --retry 5 --retry-all-errors --retry-delay 3 "$url")
            echo "$code $url"
            test "$code" = '200'
          done
          curl --silent --show-error --location --dump-header headers.txt --output news.json 'https://gnk-asg.hr/data/news.json?cb=hotfix'
          grep -qi 'x-gnk-asg-news-automation: hotfix-v1' headers.txt
          grep -q '"items"' news.json
      - name: Report issue-triggered result
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "GNK_ASG_HOTFIX_DEPLOY_CODE=${{ steps.deploy.outputs.code }}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo 'DEPLOY_LOG:'
            echo '```text'
            tail -c 5000 deploy.log 2>/dev/null || true
            echo '```'
          } > issue-report.md
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body-file issue-report.md
      - name: Fail when deployment failed
        if: steps.deploy.outputs.code != '0'
        run: exit 1
