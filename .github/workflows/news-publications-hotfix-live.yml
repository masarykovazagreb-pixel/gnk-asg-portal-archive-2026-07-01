name: GNK ASG News Publications Hotfix

on:
  push:
    branches: [main]
    paths:
      - 'workers/gnk-asg-direct-operator/**'
      - 'apps/portal/vijesti/**'
      - 'apps/portal/news/**'
      - 'apps/portal/visual-index/**'
      - 'apps/portal/assets/business-news.css'
      - 'apps/portal/assets/business-news.js'
      - 'apps/portal/assets/visual-index-full-gallery.js'
      - 'apps/portal/assets/visual-index-central-v7.js'
      - '.github/workflows/news-publications-hotfix-live.yml'
  workflow_dispatch:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: gnk-asg-news-publications-hotfix
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'issues' || contains(github.event.issue.title, 'RUN GNK ASG NEWS PUBLICATIONS HOTFIX')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check workers/gnk-asg-direct-operator/src/index-publication-news-hotfix.js
          node --check workers/gnk-asg-direct-operator/src/news-curation-v10.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v22-news.js
          node --check apps/portal/assets/business-news.js
          node --check apps/portal/assets/visual-index-full-gallery.js
          node --check apps/portal/assets/visual-index-central-v7.js
          grep -q 'cleanVisualCards' apps/portal/assets/visual-index-full-gallery.js
          grep -q 'visual-index-central-v7.js' apps/portal/assets/visual-index-full-gallery.js
          grep -q 'mapNews' apps/portal/assets/visual-index-central-v7.js
          grep -q "getJson('/data/news.json')" apps/portal/assets/visual-index-central-v7.js
          ! grep -qi 'http-equiv="refresh"' apps/portal/vijesti/index.html
          ! grep -qi 'http-equiv="refresh"' apps/portal/news/index.html
      - name: Deploy Worker and assets
        id: deploy
        shell: bash
        run: |
          set +e
          npx --yes wrangler@4 deploy --config workers/gnk-asg-direct-operator/wrangler.toml > deploy.log 2>&1
          code=$?
          cat deploy.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Wait
        if: steps.deploy.outputs.code == '0'
        run: sleep 15
      - name: Refresh and verify
        id: verify
        if: steps.deploy.outputs.code == '0'
        shell: bash
        run: |
          set +e
          : > verify.log
          failed=0

          refresh_code=$(curl --silent --show-error --location --output refresh.json --write-out '%{http_code}' --request POST https://gnk-asg.hr/api/news-refresh)
          echo "REFRESH_HTTP=$refresh_code" >> verify.log
          if [ "$refresh_code" != '200' ] && [ "$refresh_code" != '429' ]; then failed=1; fi

          curl --silent --show-error --location --output news.json 'https://gnk-asg.hr/data/news.json?cb=hotfix'
          curl --silent --show-error --location --output status.json 'https://gnk-asg.hr/data/news-automation-status.json?cb=hotfix'
          curl --silent --show-error --location --output archive.json 'https://gnk-asg.hr/data/news-archive.json?cb=hotfix'
          visual_code=$(curl --silent --show-error --location --output visual.html --write-out '%{http_code}' 'https://gnk-asg.hr/visual-index/?cb=hotfix')
          loader_code=$(curl --silent --show-error --location --output loader.js --write-out '%{http_code}' 'https://gnk-asg.hr/assets/visual-index-full-gallery.js?cb=hotfix')
          central_code=$(curl --silent --show-error --location --output central.js --write-out '%{http_code}' 'https://gnk-asg.hr/assets/visual-index-central-v7.js?cb=hotfix')
          echo "VISUAL_HTTP=$visual_code LOADER_HTTP=$loader_code CENTRAL_HTTP=$central_code" >> verify.log
          [ "$visual_code" = '200' ] || failed=1
          [ "$loader_code" = '200' ] || failed=1
          [ "$central_code" = '200' ] || failed=1
          grep -q 'cleanVisualCards' loader.js || { echo 'VISUAL_CLEANUP_MISSING' >> verify.log; failed=1; }
          grep -q 'mapNews' central.js || { echo 'VISUAL_NEWS_MAPPER_MISSING' >> verify.log; failed=1; }
          grep -q "getJson('/data/news.json')" central.js || { echo 'VISUAL_NEWS_SOURCE_MISSING' >> verify.log; failed=1; }

          node - <<'NODE' >> verify.log 2>&1
          const fs=require('fs');
          let failed=false;
          const read=name=>{try{return JSON.parse(fs.readFileSync(name,'utf8'))}catch(error){console.log(`${name}_PARSE_ERROR=${error.message}`);failed=true;return null}};
          const news=read('news.json');
          const items=Array.isArray(news)?news:(Array.isArray(news?.items)?news.items:[]);
          const imageOf=item=>String(item?.image||item?.imageUrl||'').trim();
          const articleOf=item=>String(item?.url||item?.link||item?.sourceUrl||'').trim();
          const invalid=value=>!value||/news-fallback\.svg|placeholder|favicon|logo|crest|badge|emblem/i.test(value);
          const eligible=items.filter(item=>{
            const image=imageOf(item),article=articleOf(item);
            return !item?.imageFallback&&!invalid(image)&&/^https?:\/\//i.test(image)&&/^https?:\/\//i.test(article)&&image!==article&&/\.(?:avif|gif|jpe?g|png|svg|webp)(?:[?#]|$)/i.test(image);
          });
          console.log(`NEWS_ITEMS=${items.length}`);
          console.log(`VISUAL_ELIGIBLE=${eligible.length}`);
          console.log(`VISUAL_FILTERED_OUT=${items.length-eligible.length}`);
          if(items.length!==100)failed=true;
          if(eligible.length<20)failed=true;

          const status=read('status.json');
          const schedule=status?.newsSchedule||status?.scheduleSlots||status?.scheduled_hours_local||[];
          const normalized=Array.isArray(schedule)?schedule.map(v=>String(v).includes(':')?String(v):`${String(v).padStart(2,'0')}:00`):[];
          console.log(`STATUS_SCHEDULE=${normalized.join(',')}`);
          console.log(`STATUS_ACTIVE_LIMIT=${status?.activeNewsLimit??status?.max_public_items??status?.public_items_target??''}`);
          console.log(`STATUS_ARCHIVE_PRUNE_AT=${status?.archivePruneAt??status?.max_archive_items??''}`);
          console.log(`STATUS_ARCHIVE_RETAIN=${status?.archiveRetainAfterPrune??status?.archive_prune_to??''}`);
          if(normalized.join(',')!=='09:00,16:00,21:00')failed=true;
          if(Number(status?.activeNewsLimit??status?.max_public_items??status?.public_items_target)!==100)failed=true;
          if(Number(status?.archivePruneAt??status?.max_archive_items)!==1000)failed=true;
          if(Number(status?.archiveRetainAfterPrune??status?.archive_prune_to)!==500)failed=true;

          const archive=read('archive.json');
          const archiveItems=Array.isArray(archive)?archive:(Array.isArray(archive?.items)?archive.items:[]);
          console.log(`ARCHIVE_ITEMS=${archiveItems.length}`);
          if(archiveItems.length>500)failed=true;
          process.exitCode=failed?1:0;
          NODE
          if [ $? -ne 0 ]; then failed=1; fi

          cat verify.log
          echo "code=$failed" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Report issue-triggered result
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "GNK_ASG_HOTFIX_DEPLOY_CODE=${{ steps.deploy.outputs.code }}"
            echo "GNK_ASG_HOTFIX_VERIFY_CODE=${{ steps.verify.outputs.code }}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```text'
            cat verify.log 2>/dev/null || true
            echo '```'
          } > issue-report.md
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body-file issue-report.md
      - name: Enforce success
        if: always()
        shell: bash
        run: |
          test "${{ steps.deploy.outputs.code }}" = '0'
          test "${{ steps.verify.outputs.code }}" = '0'
