name: Image Health Scan

# Detektira slomljene / niske-rezolucije slike u editorial-registry + news feedu.
# Read-only scan ostaje u Actions summaryju bez mutacije maina.
# Samo eksplicitni APPLY_FIXES=1 smije mijenjati editorial-registry/report artefakte i deployati.

on:
  workflow_dispatch:
    inputs:
      apply_fixes:
        description: "Primijeni ispravke (zamijeni slomljene URL-ove u editorial-registry)"
        required: false
        default: "false"
        type: choice
        options: ["false","true"]
  schedule:
    - cron: '15 3 * * 0'   # weekly Sunday; Control Plane V2

permissions:
  contents: write
  actions: write

concurrency:
  group: gnk-asg-main-mutation
  cancel-in-progress: false

jobs:
  scan:
    if: vars.GNK_ASG_RELEASE_FENCE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Scan images (and optionally apply fixes)
        env:
          IMAGE_CHECK_CONCURRENCY: '12'
          IMAGE_TIMEOUT_MS: '8000'
          IMAGE_MIN_BYTES: '5000'
          APPLY_FIXES: ${{ inputs.apply_fixes == 'true' && '1' || '0' }}
        run: node scripts/image-health-scanner-v1.mjs
      - name: Commit remediation + dispatch deploy
        if: ${{ inputs.apply_fixes == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY_FIXES: '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gnk-image-health-bot"
          git config user.email "actions@github.com"
          git add apps/portal/data/seo-audit apps/portal/data/editorial-registry.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nema remediation promjena za commit."
            exit 0
          fi
          git commit -m "Image Health: auto-remediation"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            echo "Push odbijen (pokusaj $attempt) - main se pomaknuo, radim fetch+rebase."
            git fetch origin main
            git rebase origin/main || { echo "Rebase konflikt."; exit 1; }
            sleep $((attempt * 5))
            if [ "$attempt" = "5" ]; then echo "Push nije uspio nakon 5 pokusaja."; exit 1; fi
          done
          sha="$(git rev-parse HEAD)"
          gh workflow run deploy-admin-auth-v6.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f confirm_production_deploy=DEPLOY_ADMIN_AUTH_V6 \
            -f approved_sha="$sha"
      - name: Read-only scan policy
        if: ${{ inputs.apply_fixes != 'true' }}
        shell: bash
        run: echo "Read-only scan: report is emitted to this run summary; main is not mutated."
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## Image Health" >> "$GITHUB_STEP_SUMMARY"
          if [ -f apps/portal/data/seo-audit/image-health.json ]; then
            jq . apps/portal/data/seo-audit/image-health.json > "$RUNNER_TEMP/image-health-pretty.json"
            head -40 "$RUNNER_TEMP/image-health-pretty.json" >> "$GITHUB_STEP_SUMMARY"
          fi
