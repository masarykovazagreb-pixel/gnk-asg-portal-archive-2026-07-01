name: Image Health Scan

# Detektira slomljene / niske-rezolucije slike u editorial-registry + news feedu,
# generira JSON+HTML report u apps/portal/data/seo-audit/, i (kad APPLY_FIXES=1)
# automatski zamjenjuje slomljene slike u editorial-registry s fallback-om.

on:
  workflow_dispatch:
    inputs:
      apply_fixes:
        description: "Primijeni ispravke (zamijeni slomljene URL-ove u editorial-registry)"
        required: false
        default: "false"
        type: choice
        options: ["false","true"]
  schedule:
    - cron: '15 3 * * *'   # svaki dan u 03:15 UTC (05:15 Zagreb), prije AEO ciklusa

permissions:
  contents: write
  actions: write

concurrency:
  group: image-health-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Scan images (and optionally apply fixes)
        env:
          IMAGE_CHECK_CONCURRENCY: '12'
          IMAGE_TIMEOUT_MS: '8000'
          IMAGE_MIN_BYTES: '5000'
          APPLY_FIXES: ${{ inputs.apply_fixes == 'true' && '1' || '0' }}
        run: node scripts/image-health-scanner-v1.mjs
      - name: Commit report (and fixes if any) + dispatch deploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gnk-image-health-bot"
          git config user.email "actions@github.com"
          git add apps/portal/data/seo-audit apps/portal/data/editorial-registry.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nema promjena za commit."
            exit 0
          fi
          git commit -m "Image Health: refresh report$([ "${APPLY_FIXES:-0}" = "1" ] && echo ' + auto-remediation')"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            echo "Push odbijen (pokusaj $attempt) - main se pomaknuo, radim fetch+rebase."
            git fetch origin main
            git rebase origin/main || { echo "Rebase konflikt."; exit 1; }
            sleep $((attempt * 5))
            if [ "$attempt" = "5" ]; then echo "Push nije uspio nakon 5 pokusaja."; exit 1; fi
          done
          # Deploy only if we actually mutated production HTML sources (fixes on)
          if [ "${APPLY_FIXES:-0}" = "1" ]; then
            sha="$(git rev-parse HEAD)"
            gh workflow run deploy-admin-auth-v6.yml \
              --repo beckuphome-gnk/gnk-asg-portal \
              --ref main \
              -f confirm_production_deploy=DEPLOY_ADMIN_AUTH_V6 \
              -f approved_sha="$sha"
          fi
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## Image Health" >> "$GITHUB_STEP_SUMMARY"
          if [ -f apps/portal/data/seo-audit/image-health.json ]; then
            jq . apps/portal/data/seo-audit/image-health.json > "$RUNNER_TEMP/image-health-pretty.json"
            head -40 "$RUNNER_TEMP/image-health-pretty.json" >> "$GITHUB_STEP_SUMMARY"
          fi
