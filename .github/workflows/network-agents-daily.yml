name: MREŽA — agenti i sinkronizacija

# Dvadeset i jedan neovisni agent nad istom mrežom: šest samostalnih stranica,
# devet svjetskih portala, arhiva, dnevnik, tjednik i 17 gradskih izdanja pod
# gnk-asg.hr.
#
# Zašto zaseban workflow: agenti moraju pasti zbog sebe, a ne zbog deploya.
# Zato je posao strogo čitljiv (contents: read) — gradi izlazne mape u
# radnom prostoru runnera, provjerava ih i sprema izvještaj kao artifact.
# Ništa se ne commitа i ne pusha, pa ovaj workflow ne može pomaknuti main.
#
# Ručno: Actions → "MREŽA — agenti i sinkronizacija" → Run workflow.
# Popis agenata i vlasnik: ops/network-agents-v1.json.

on:
  schedule:
    # Jednom dnevno, iza noćnog SEO audita (01:15 UTC) i prije jutarnjeg
    # ciklusa izdanja. Minuta 40 je namjerno izvan punog sata.
    - cron: '40 4 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Samo navedeni agenti, odvojeni zarezom (prazno = svi)'
        required: false
        type: string
  push:
    paths:
      - 'apps/satellites/**'
      - 'apps/sites/**'
      - 'apps/world/**'
      - 'apps/region/channels.json'
      - 'apps/region/engine/build.mjs'
      - 'apps/region/engine/hub.mjs'
      - 'apps/arhiva/**'
      - 'apps/dnevnik/**'
      - 'tests/test-network-mesh-v1.mjs'
      - 'tests/test-world-portals-v1.mjs'
      - 'scripts/network-agents-v1.mjs'
      - 'scripts/network-sync-v1.mjs'
      - 'ops/network-agents-v1.json'
      - 'apps/agents/operations/**'
      - 'tests/test-operations-30-v1.mjs'
      - 'tests/test-operations-triage-v1.mjs'
      - '.github/workflows/network-agents-daily.yml'

permissions:
  contents: read

concurrency:
  group: network-agents-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agents:
    name: Mreža — sinkronizacija i agenti
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETWORK_AGENTS_REPORT: artifacts/network-agents-v1.json
    steps:
      - name: Dohvati granu
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Alati za provjeru slika
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick webp
          convert -version | head -1

      - name: Sinkroniziraj stranice, svjetske portale, arhivu i dnevnik
        id: sync
        run: node scripts/network-sync-v1.mjs

      - name: Pokreni agente
        env:
          SELECTED_AGENTS: ${{ inputs.only }}
        run: |
          if [ -n "$SELECTED_AGENTS" ]; then
            node scripts/network-agents-v1.mjs --only "$SELECTED_AGENTS"
          else
            node scripts/network-agents-v1.mjs
          fi

      - name: Provjeri operativne agente
        if: ${{ always() && steps.sync.outcome == 'success' }}
        id: operations_contract
        run: node --test tests/test-operations-30-v1.mjs tests/test-operations-triage-v1.mjs

      - name: Operativni agenti — dijagnostika 30 zadataka
        if: ${{ always() && steps.sync.outcome == 'success' && steps.operations_contract.outcome == 'success' }}
        run: |
          mkdir -p artifacts
          node apps/agents/operations/run-v1.mjs > artifacts/operations-30-v1.json

      - name: Sigurna lista zadataka iz dijagnostike
        if: ${{ always() && steps.sync.outcome == 'success' && steps.operations_contract.outcome == 'success' }}
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          report=missing
          if [ -s artifacts/operations-30-v1.json ]; then report=artifacts/operations-30-v1.json; fi
          node apps/agents/operations/triage-v1.mjs --report "$report" --sha "$SOURCE_SHA" > artifacts/operations-triage-v1.json

      - name: Sažetak dijagnostike 30 agenata
        if: always()
        shell: bash
        run: |
          if [ -s "$NETWORK_AGENTS_REPORT" ]; then
            node -e 'const r=require("./"+process.env.NETWORK_AGENTS_REPORT); for(const a of r.agents.filter(x=>!x.ok && x.required)) console.log("::error::Mreža: " + `${a.id} ${a.tail}`.replace(/[\r\n%]/g," "));'
          fi
          if [ -s artifacts/operations-30-v1.json ]; then
            node -e '
              const r = require("./artifacts/operations-30-v1.json");
              const fs = require("fs");
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Operativni agenti: ${r.passed}/${r.agents.length}\n`);
              for (const a of r.agents.filter(x => x.status === "fail")) {
                const message = `${a.id}: ${a.name} — exit ${a.exitCode}, ${a.error || a.signal || "provjera pala"}`.replace(/[\r\n%]/g, " ");
                console.log(`::error::${message}`);
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- ${message}\n`);
              }
            '
          fi

      - name: Spremi izvještaj 30 agenata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-30-${{ github.run_id }}
          path: |
            artifacts/operations-30-v1.json
            artifacts/operations-triage-v1.json
          if-no-files-found: warn
          retention-days: 30

      - name: Sažetak u summary
        if: always()
        shell: bash
        run: |
          if [ -s "$NETWORK_AGENTS_REPORT" ]; then
            node -e "
              const r = require('./' + process.env.NETWORK_AGENTS_REPORT);
              console.log('## Mreža — agenti ' + r.generatedAt);
              console.log('');
              console.log('Prošlo: **' + r.passed + '/' + r.total + '**');
              if (r.failed.length) console.log('Palo: ' + r.failed.join(', '));
              if (r.advisory.length) console.log('Savjet: ' + r.advisory.join(', '));
              console.log('');
              for (const a of r.agents) console.log('- ' + (a.ok ? 'OK' : 'PAD') + ' · ' + a.name + ' (`' + a.command + '`)');
            " >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Spremi izvještaj agenata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-agents-report-${{ github.run_id }}
          path: artifacts/network-agents-v1.json
          if-no-files-found: warn
          retention-days: 30
