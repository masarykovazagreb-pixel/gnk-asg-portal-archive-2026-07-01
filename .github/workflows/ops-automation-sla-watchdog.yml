name: GNK ASG Automation SLA Watchdog

# Read/verify hourly, then dispatch ONLY the existing canonical writer when stale.
# This workflow never writes content itself and never dispatches third-party publication.
# External distribution is outside this operational self-heal contract.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-automation-sla-watchdog.yml'
  schedule:
    - cron: '42 * * * *'  # hourly self-heal; canonical owners remain the only writers

permissions:
  contents: read
  actions: write

concurrency:
  group: gnk-asg-automation-sla-watchdog
  cancel-in-progress: true

jobs:
  verify-and-heal:
    name: Verify automation SLAs and dispatch canonical recovery
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify live AKTUAL freshness, workflow SLAs and self-heal stale owners
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}'
          now = datetime.now(timezone.utc)
          zagreb = ZoneInfo('Europe/Zagreb')
          now_local = now.astimezone(zagreb)
          failures = []
          recoveries = []
          observations = []

          def request_json(url, method='GET', payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(url, data=data, method=method, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'GNK-ASG-SLA-Watchdog/1.0',
                  'Content-Type': 'application/json',
              })
              with urllib.request.urlopen(req, timeout=20) as res:
                  raw = res.read()
                  return json.loads(raw) if raw else {}

          def completed_runs(workflow):
              workflow_q = urllib.parse.quote(workflow, safe='')
              payload = request_json(f'{api}/actions/workflows/{workflow_q}/runs?status=completed&per_page=20')
              return payload.get('workflow_runs', [])

          def run_stamp(run):
              if not run:
                  return None
              stamp = run.get('updated_at') or run.get('created_at')
              return datetime.fromisoformat(stamp.replace('Z', '+00:00')) if stamp else None

          def latest_success(workflow):
              for run in completed_runs(workflow):
                  if run.get('conclusion') == 'success':
                      stamp = run_stamp(run)
                      if stamp:
                          return stamp, run
              return None, None

          def latest_completed(workflow):
              runs = completed_runs(workflow)
              return runs[0] if runs else None

          _dispatched = set()
          def dispatch(workflow, inputs=None):
              key = (workflow, json.dumps(inputs or {}, sort_keys=True))
              if key in _dispatched:
                  print(f'DEBOUNCE SKIP: {workflow} already dispatched this run')
                  return
              _dispatched.add(key)
              workflow_q = urllib.parse.quote(workflow, safe='')
              body = {'ref': 'main'}
              if inputs:
                  body['inputs'] = inputs
              request_json(f'{api}/actions/workflows/{workflow_q}/dispatches', method='POST', payload=body)
              recoveries.append(workflow)
              print(f'RECOVERY DISPATCHED: {workflow}')

          def ensure_age(workflow, soft_minutes, hard_minutes, label, inputs=None):
              stamp, run = latest_success(workflow)
              latest = latest_completed(workflow)
              if not stamp:
                  dispatch(workflow, inputs)
                  if latest and latest.get('conclusion') not in (None, 'success'):
                      failures.append(f'{label}: no successful run; latest completed run is {latest.get("conclusion")}')
                  else:
                      observations.append(f'{label}: no successful run yet — recovery dispatched')
                  return
              age = (now - stamp).total_seconds() / 60
              observations.append(f'{label}: last success {age:.1f} min ago (run #{run.get("run_number")})')
              if age > hard_minutes:
                  dispatch(workflow, inputs)
                  latest_stamp = run_stamp(latest)
                  if latest and latest.get('conclusion') not in (None, 'success') and latest_stamp and latest_stamp > stamp:
                      failures.append(f'{label}: hard-stale {age:.1f} min and latest recovery is {latest.get("conclusion")}')
                  else:
                      observations.append(f'{label}: hard-stale {age:.1f} min > {hard_minutes} min — recovery dispatched; next run proves recovery')
              elif age > soft_minutes:
                  observations.append(f'{label}: soft-stale {age:.1f} min > {soft_minutes} min — recovery dispatched')
                  dispatch(workflow, inputs)

          # 1) AKTUAL data contract: hard freshness and minimum content.
          status_path = Path('apps/portal/data/news-automation-status.json')
          try:
              status = json.loads(status_path.read_text(encoding='utf-8'))
              stamp = datetime.fromisoformat(str(status.get('updated_at', '')).replace('Z', '+00:00'))
              if stamp.tzinfo is None:
                  stamp = stamp.replace(tzinfo=zagreb)
              age = (now - stamp.astimezone(timezone.utc)).total_seconds() / 60
              observations.append(f'AKTUAL data: {age:.1f} min old, {status.get("public_items_written")} public items')
              if not status.get('ok'):
                  failures.append('AKTUAL data status ok=false')
              if int(status.get('public_items_written') or 0) < 50:
                  failures.append(f'AKTUAL public feed too small: {status.get("public_items_written")}')
              if age > 290:
                  latest = latest_completed('gnk-news-refresh-v2.yml')
                  latest_stamp = run_stamp(latest)
                  dispatch('gnk-news-refresh-v2.yml')
                  if latest and latest.get('conclusion') not in (None, 'success') and latest_stamp and latest_stamp > stamp.astimezone(timezone.utc):
                      failures.append(f'AKTUAL data stale {age:.1f} min and latest canonical run is {latest.get("conclusion")}')
                  else:
                      observations.append(f'AKTUAL data stale {age:.1f} min > 290 min SLA — canonical recovery dispatched')
          except Exception as exc:
              failures.append(f'AKTUAL status unreadable: {exc}')
              dispatch('gnk-news-refresh-v2.yml')

          # 2) Live routes: both language surfaces must answer successfully.
          for label, url in [
              ('AKTUAL HR', 'https://gnk-asg.hr/gnk-aktual/'),
              ('AKTUAL EN', 'https://gnk-asg.hr/en/gnk-aktual/'),
          ]:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'GNK-ASG-SLA-Watchdog/1.0'})
                  with urllib.request.urlopen(req, timeout=20) as res:
                      code = res.getcode()
                  observations.append(f'{label}: HTTP {code}')
                  if code != 200:
                      failures.append(f'{label}: HTTP {code}')
              except Exception as exc:
                  failures.append(f'{label}: live check failed: {exc}')

          # 3) Canonical writer/control SLAs. A stale check dispatches the EXISTING owner only.
          #    First recovery dispatch stays GREEN when the prior known state was valid.
          #    RED is reserved for invalid live/data state or evidence that the latest
          #    canonical recovery already failed after the last success.
          ensure_age('gnk-news-refresh-v2.yml', 350, 430, 'AKTUAL canonical refresh')
          ensure_age('weather-refresh.yml', 390, 480, 'Zagreb weather refresh')
          ensure_age('gnk-seo-nightly-audit.yml', 1740, 2400, 'Nightly SEO/IndexNow audit')

          # 4) Daily editorial must have a successful run today. After 11:00 Europe/Zagreb,
          #    a missing verified success dispatches the existing canonical publisher once.
          editorial_today_success = False
          editorial_observations = []
          for run_url in (f'{api}/actions/workflows/editorial-scheduled-publish.yml/runs?per_page=5',
                          f'{api}/actions/workflows/content-queue-publish.yml/runs?per_page=5'):
              try:
                  for run in request_json(run_url).get('workflow_runs', []):
                      if run.get('conclusion') != 'success':
                          continue
                      stamp = run.get('updated_at') or run.get('created_at')
                      if not stamp:
                          continue
                      day = datetime.fromisoformat(stamp.replace('Z', '+00:00')).astimezone(zagreb).date()
                      if day == now_local.date():
                          editorial_today_success = True
                          editorial_observations.append(f'{run.get("workflow_id")}: success #{run.get("run_number")}')
                          break
                  if editorial_today_success:
                      break
              except Exception:
                  pass
          if editorial_today_success:
              observations.append('Editorial publisher: today success — ' + ', '.join(editorial_observations))
          else:
              observations.append('Editorial publisher: no verified success yet today (publisher schedule: ~10:20 Europe/Zagreb)')
              if now_local.hour >= 11:
                  observations.append('Editorial publisher: recovery dispatch after missed daily success')
                  dispatch('editorial-scheduled-publish.yml')

          print('\nOBSERVATIONS')
          for row in observations:
              print('-', row)
          if recoveries:
              print('\nRECOVERIES')
              for row in sorted(set(recoveries)):
                  print('-', row)
          if failures:
              print('\nSLA FAILURES')
              for row in failures:
                  print('-', row)
              print('\nWatchdog is RED only for invalid live/data state or a canonical owner whose latest recovery already failed.')
              sys.exit(1)

          print('\nALL AUTOMATION SLA CHECKS PASS')
          PY

      - name: Publish watchdog summary
        if: always()
        run: |
          echo '## GNK ASG Automation SLA Watchdog' >> "$GITHUB_STEP_SUMMARY"
          echo '- AKTUAL freshness target: **<= 290 min**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Canonical AKTUAL run: soft **<= 350 min**; stale dispatches recovery; red only after failed recovery/invalid state' >> "$GITHUB_STEP_SUMMARY"
          echo '- Zagreb weather: soft **<= 390 min**; stale dispatches recovery; red only after failed recovery/invalid state' >> "$GITHUB_STEP_SUMMARY"
          echo '- External distribution: **not dispatched by watchdog**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Nightly SEO/IndexNow: soft **<= 1740 min** / hard **> 2400 min**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Editorial: **verified success today**; after 11:00 a missing success dispatches the canonical publisher' >> "$GITHUB_STEP_SUMMARY"
          echo '- Recovery policy: **dispatch canonical owner only, debounced once per run; watchdog never becomes a second writer**' >> "$GITHUB_STEP_SUMMARY"
