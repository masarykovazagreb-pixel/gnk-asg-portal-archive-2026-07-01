name: Deploy stable index V28 via issue 91

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: gnk-asg-canonical-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.issue.number == 91 && github.event.comment.body == '/deploy-stable-index-v28'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Verify locked stable package
        shell: bash
        run: |
          set -euxo pipefail
          node --check workers/gnk-asg-direct-operator/src/public-shell-v11.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v21.js
          node --check workers/gnk-asg-direct-operator/src/index-lock-v4.js
          node --check workers/gnk-asg-direct-operator/src/index-server-hydration-v1.js
          node --check apps/portal/assets/index-content-resilience-v1.js
          node --check apps/portal/assets/index-live-market-chart-v4.js
          grep -q 'GNK_ASG_PUBLIC_VISUAL_V28_STABLE_LAYOUT_RESILIENT_DATA_20260626' workers/gnk-asg-direct-operator/src/public-shell-v11.js
          grep -q 'STABLE_SINGLE_MENU_NO_POLISH' workers/gnk-asg-direct-operator/src/public-shell-v11.js
          if grep -q 'function patchIndexHero' workers/gnk-asg-direct-operator/src/public-shell-v11.js; then exit 1; fi
          if grep -E -q 'const indexHead=.*index-polish-v1\.css' workers/gnk-asg-direct-operator/src/public-shell-v11.js; then exit 1; fi
          grep -q 'main = "src/index-admin-hub-v21.js"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'MEDIA_OUTREACH_LIVE = "false"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'MEDIA_OUTREACH_TEST_LIVE = "false"' workers/gnk-asg-direct-operator/wrangler.toml
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator

      - name: Apply D1 migrations
        id: d1
        continue-on-error: true
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4 d1 migrations apply gnk_asg_operator_logs --remote --config wrangler.toml 2>&1 | tee /tmp/gnk-d1-migration.log

      - name: Deploy to Cloudflare
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator

      - name: Verify live HR and EN index
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs=require('node:fs');
          const base='https://gnk-asg.hr';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function get(path,redirect='follow'){
            try{
              const response=await fetch(`${base}${path}${path.includes('?')?'&':'?'}cb=${Date.now()}`,{redirect,headers:{'cache-control':'no-cache'}});
              return {status:response.status,text:await response.text(),headers:Object.fromEntries(response.headers)};
            }catch(error){return {status:0,text:'',headers:{},error:String(error)};}
          }
          (async()=>{
            let diagnostic=null;
            for(let attempt=1;attempt<=18;attempt++){
              const [statusResponse,healthResponse,root,en,admin]=await Promise.all([
                get('/data/deployment-status.json'),get('/data/platform-health.json'),get('/'),get('/en/'),get('/operator-dashboard/','manual')
              ]);
              let status=null;try{status=JSON.parse(statusResponse.text);}catch{}
              let health=null;try{health=JSON.parse(healthResponse.text);}catch{}
              const failures=[];
              if(statusResponse.status!==200||!status?.ok)failures.push(`deployment=${statusResponse.status}`);
              if(status?.indexLock!=='GNK_ASG_INDEX_LOCK_V4_20260626')failures.push(`indexLock=${JSON.stringify(status?.indexLock)}`);
              if(status?.indexHydration!=='GNK_ASG_INDEX_SERVER_HYDRATION_V1_20260626')failures.push(`indexHydration=${JSON.stringify(status?.indexHydration)}`);
              if(healthResponse.status!==200||!health?.ok)failures.push(`health=${healthResponse.status}`);
              for(const [name,response] of Object.entries({root,en})){
                if(response.status!==200)failures.push(`${name}=${response.status}`);
                if(response.text.includes('/assets/index-polish-v1.css'))failures.push(`${name}_polish_present`);
                if(response.text.includes('class="gnk-index-title"'))failures.push(`${name}_hero_injector_present`);
                if(!response.text.includes('20260626-stable-v28'))failures.push(`${name}_stable_visual_missing`);
                const placeholders=name==='root'
                  ? ['Učitavanje najnovijih vijesti','Učitavanje mreže','Učitavanje objava','class="market-value">Učitavanje']
                  : ['Loading latest news','Loading network','Loading publications','class="market-value">Loading'];
                for(const marker of placeholders)if(response.text.includes(marker))failures.push(`${name}_placeholder=${marker}`);
              }
              if(admin.status!==303||!String(admin.headers.location||'').includes('/admin-center/?module=operator'))failures.push(`admin=${admin.status}:${admin.headers.location||''}`);
              diagnostic={checkedAt:new Date().toISOString(),attempt,failures,status,health,codes:{status:statusResponse.status,health:healthResponse.status,root:root.status,en:en.status,admin:admin.status},headers:{root:root.headers,en:en.headers}};
              fs.writeFileSync('/tmp/live-diagnostic.json',JSON.stringify(diagnostic,null,2));
              console.log(JSON.stringify(diagnostic,null,2));
              if(!failures.length)process.exit(0);
              await sleep(10000);
            }
            process.exit(1);
          })().catch(error=>{console.error(error);process.exit(1)});
          JS

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          D1_OUTCOME: ${{ steps.d1.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          d1_tail=''
          live=''
          if [ -s /tmp/gnk-d1-migration.log ]; then d1_tail=$(tail -n 12 /tmp/gnk-d1-migration.log); fi
          if [ -s /tmp/live-diagnostic.json ]; then live=$(cat /tmp/live-diagnostic.json); fi
          body=$(printf 'Stable index V28 deploy **%s** · D1 migration **%s** · commit `%s` · %s\n\n### Live diagnostic\n```json\n%s\n```\n\n### D1 migration API\n```text\n%s\n```' "$JOB_STATUS" "$D1_OUTCOME" "$RUN_SHA" "$RUN_URL" "$live" "$d1_tail")
          gh issue comment 91 --body "$body"
