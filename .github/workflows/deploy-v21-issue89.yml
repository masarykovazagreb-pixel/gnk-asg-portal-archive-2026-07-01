name: Deploy V21 via issue 89

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: gnk-asg-canonical-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.issue.number == 89 && github.event.comment.body == '/deploy-v21 20260626-89-r3'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Verify package
        shell: bash
        run: |
          set -euxo pipefail
          node --check apps/portal/assets/admin-session-fallback-v17.js
          node --check apps/portal/assets/mail-studio-auth-bridge-v16.js
          node --check apps/portal/assets/media-command-handoff-ui-v3.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v21.js
          node --check workers/gnk-asg-direct-operator/src/index-lock-v4.js
          node --check workers/gnk-asg-direct-operator/src/index-public-r2-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-server-hydration-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-article-automation-v2.js
          node --check workers/gnk-asg-direct-operator/src/index-media-command-center-v21.js
          node --check workers/gnk-asg-direct-operator/src/index-mail-studio-bridge-v15.js
          node --check workers/gnk-asg-direct-operator/src/media-command-center-v2.js
          grep -q 'main = "src/index-admin-hub-v21.js"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'MEDIA_OUTREACH_LIVE = "false"' workers/gnk-asg-direct-operator/wrangler.toml
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator

      - name: Apply D1 migrations
        id: d1
        continue-on-error: true
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4 d1 migrations apply gnk_asg_operator_logs --remote --config wrangler.toml 2>&1 | tee /tmp/gnk-d1-migration.log

      - name: Deploy to Cloudflare
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator

      - name: Verify production after stabilization
        shell: bash
        run: |
          set -euo pipefail
          sleep 75
          cb=$(date +%s)
          base='https://gnk-asg.hr'
          curl -sS -D /tmp/status.headers -H 'Cache-Control: no-cache' "$base/data/deployment-status.json?cb=$cb" -o /tmp/status.json
          curl -sS -D /tmp/root.headers -H 'Cache-Control: no-cache' "$base/?cb=$cb" -o /tmp/root.html
          curl -sS -D /tmp/admin.headers -H 'Cache-Control: no-cache' "$base/operator-dashboard/?cb=$cb" -o /tmp/admin.html
          node <<'JS'
          const fs=require('node:fs');
          const statusText=fs.readFileSync('/tmp/status.json','utf8');
          const root=fs.readFileSync('/tmp/root.html','utf8');
          const rootHeaders=fs.readFileSync('/tmp/root.headers','utf8');
          const adminHeaders=fs.readFileSync('/tmp/admin.headers','utf8');
          const admin=fs.readFileSync('/tmp/admin.html','utf8');
          let status=null;try{status=JSON.parse(statusText);}catch{}
          const expected={
            entryPoint:'src/index-admin-hub-v21.js',
            indexHydration:'GNK_ASG_INDEX_SERVER_HYDRATION_V1_20260626',
            publicR2:'GNK_ASG_PUBLIC_R2_V1_20260626',
            browserTokenStorage:'DISABLED',
            contactImport:'HASH_LOCKED_V3',
            productionSending:'LOCKED'
          };
          const firstLine=value=>String(value).split(/\r?\n/)[0]||'';
          const header=(text,name)=>((text.match(new RegExp(`^${name}:\\s*(.+)$`,'im'))||[])[1]||'').trim();
          const failures=[];
          if(!status?.ok)failures.push('deployment_status_not_ok');
          for(const [key,value] of Object.entries(expected))if(status?.[key]!==value)failures.push(`${key}=${JSON.stringify(status?.[key])}`);
          const placeholders={
            loadingNews:root.includes('Učitavanje najnovijih vijesti'),
            loadingNetwork:root.includes('Učitavanje mreže'),
            loadingPublications:root.includes('Učitavanje objava'),
            loadingMarket:root.includes('class="market-value">Učitavanje')
          };
          for(const [key,value] of Object.entries(placeholders))if(value)failures.push(key);
          const adminStatus=firstLine(adminHeaders);
          const adminLocation=header(adminHeaders,'location');
          if(!/\s303\s/.test(adminStatus))failures.push(`admin_status=${adminStatus}`);
          if(!adminLocation.includes('/admin-center/?module=operator'))failures.push(`admin_location=${adminLocation}`);
          const diagnostic={
            checkedAt:new Date().toISOString(),
            failures,
            deployment:status,
            root:{status:firstLine(rootHeaders),hydration:header(rootHeaders,'x-gnk-asg-index-hydration'),adminHub:header(rootHeaders,'x-gnk-asg-admin-hub'),placeholders},
            admin:{status:adminStatus,location:adminLocation,oldOperatorCenter:admin.includes('Operator Center')}
          };
          fs.writeFileSync('/tmp/live-diagnostic.json',JSON.stringify(diagnostic,null,2));
          console.log(JSON.stringify(diagnostic,null,2));
          if(failures.length)process.exit(1);
          JS

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          D1_OUTCOME: ${{ steps.d1.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          d1_tail=''
          live=''
          if [ -s /tmp/gnk-d1-migration.log ]; then d1_tail=$(tail -n 12 /tmp/gnk-d1-migration.log); fi
          if [ -s /tmp/live-diagnostic.json ]; then live=$(cat /tmp/live-diagnostic.json); fi
          body=$(printf 'Deploy V21 R3 **%s** · D1 **%s** · commit `%s` · %s\n\n### Live diagnostic\n```json\n%s\n```\n\n### D1\n```text\n%s\n```' "$JOB_STATUS" "$D1_OUTCOME" "$RUN_SHA" "$RUN_URL" "$live" "$d1_tail")
          gh issue comment 89 --body "$body"
