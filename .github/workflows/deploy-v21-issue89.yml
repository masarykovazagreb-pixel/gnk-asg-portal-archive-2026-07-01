name: Deploy structured delivery via issue 91

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: gnk-asg-canonical-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.issue.number == 91 && github.event.comment.body == '/deploy-structured-delivery-r6'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Verify package
        shell: bash
        run: |
          set -euxo pipefail
          node --check workers/gnk-asg-direct-operator/src/media-outreach-delivery-v3.js
          node --check workers/gnk-asg-direct-operator/src/index-media-command-center-v21.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v21.js
          node --check apps/portal/assets/media-outreach-delivery-ui-v3.js
          grep -q 'CLOUDFLARE_STRUCTURED_SEND_V1' workers/gnk-asg-direct-operator/src/media-outreach-delivery-v3.js
          grep -q 'MEDIA_OUTREACH_LIVE = "false"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'MEDIA_OUTREACH_TEST_LIVE = "false"' workers/gnk-asg-direct-operator/wrangler.toml
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator

      - name: Deploy to Cloudflare
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator

      - name: Verify live contract
        shell: bash
        run: |
          set -euo pipefail
          sleep 60
          base='https://gnk-asg.hr'
          cb=$(date +%s)
          curl -sS "$base/data/deployment-status.json?cb=$cb" -o /tmp/status.json
          curl -sS -D /tmp/delivery.headers "$base/api/media-command-center/delivery-status?cb=$cb" -o /tmp/delivery.json
          curl -sS "$base/assets/media-outreach-delivery-ui-v3.js?cb=$cb" -o /tmp/ui.js
          node <<'JS'
          const fs=require('node:fs');
          const status=JSON.parse(fs.readFileSync('/tmp/status.json','utf8'));
          const headers=fs.readFileSync('/tmp/delivery.headers','utf8').split(/\r?\n/)[0];
          const ui=fs.readFileSync('/tmp/ui.js','utf8');
          const expected={
            mediaCommandWrapper:'GNK_ASG_MEDIA_COMMAND_CENTER_WRAPPER_V21_20260626_R4_DELIVERY',
            mediaDelivery:'GNK_ASG_MEDIA_OUTREACH_DELIVERY_V3_20260626',
            emailSendApi:'CLOUDFLARE_STRUCTURED_SEND_V1',
            testSending:'LOCKED',
            productionSending:'LOCKED'
          };
          const failures=[];
          for(const [key,value] of Object.entries(expected))if(status?.[key]!==value)failures.push(`${key}=${JSON.stringify(status?.[key])}`);
          if(!/\s(401|403)\s/.test(headers))failures.push(`delivery_auth=${headers}`);
          if(!ui.includes('__GNK_ASG_MEDIA_DELIVERY_UI_V3__'))failures.push('delivery_ui_missing');
          const result={checkedAt:new Date().toISOString(),failures,status,deliveryRoute:headers,uiBytes:ui.length};
          fs.writeFileSync('/tmp/result.json',JSON.stringify(result,null,2));
          if(failures.length)process.exit(1);
          JS

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          result=$(cat /tmp/result.json 2>/dev/null || printf '{"error":"verification_not_reached"}')
          gh issue comment 91 --body "Structured delivery deploy **${JOB_STATUS}** · ${RUN_URL}\n\n\`\`\`json\n${result}\n\`\`\`"
