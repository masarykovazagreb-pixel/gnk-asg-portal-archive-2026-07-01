name: Siroki smoke test v4 (jednokratno)
on: workflow_dispatch
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p apps/portal/data/tmp-smoke4
          for ruta in "/" "/en/" "/objave/" "/en/publications/" "/komentari/" "/en/commentary/" "/analize/" "/en/analyses/" "/gnk-aktual/" "/en/gnk-aktual/" "/digital-workforce/" "/projects/" "/projects/roadmap/" "/nermin-sefic/" "/en/nermin-sefic/" "/kontakt/" "/contact/" "/en/contact/" "/en/contact-channels/" "/trgovina/" "/financije/" "/knowledge-center/" "/newsroom/" "/registri/" "/world-table/" "/the-code/" "/group-network/" "/sitemap-index.xml" "/sitemap.xml" "/editorial-sitemap.xml" "/image-sitemap.xml" "/visual-sitemap.xml" "/robots.txt"; do
            kod=$(curl -s -o /dev/null -w "%{http_code}" "https://gnk-asg.hr${ruta}")
            echo "${kod} ${ruta}" >> apps/portal/data/tmp-smoke4/r.txt
          done
          cat apps/portal/data/tmp-smoke4/r.txt
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          BRANCH="smoke4-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-smoke4
          git commit -m "smoke4"
          git push origin "$BRANCH"
