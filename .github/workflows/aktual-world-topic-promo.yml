name: AKTUAL World Topic Promotion Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate World Topic schedule
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const schedule = JSON.parse(fs.readFileSync('apps/portal/data/aktual-world-topics-schedule.json','utf8'));
          if (!Array.isArray(schedule.schedule) || schedule.schedule.length === 0) {
            throw new Error('World Topic schedule is empty or invalid.');
          }
          const ids = schedule.schedule.map(item => item.id);
          if (new Set(ids).size !== ids.length) throw new Error('Duplicate World Topic IDs.');
          for (const item of schedule.schedule) {
            for (const key of ['id','date','title_hr','title_en','url_hr','url_en']) {
              if (!item[key]) throw new Error('Missing ' + key + ' in ' + (item.id || 'unknown item'));
            }
          }
          console.log('World Topic schedule validated: ' + ids.length + ' entries.');
          console.log('Publication remains behind the canonical AKTUAL writer and human editorial gate.');
          NODE
