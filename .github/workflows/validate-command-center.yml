name: Validate Command Center

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/validate-command-center.yml'
      - 'scripts/test-command-center-current.mjs'
      - 'scripts/validate-worker-import-graph.mjs'
      - 'apps/portal/admin-center/**'
      - 'apps/portal/media-application/**'
      - 'apps/portal/media-registration-admin/**'
      - 'apps/portal/assets/media-registration*'
      - 'apps/portal/assets/public-floating-menu-v2.js'
      - 'apps/portal/assets/public-unified-menu-v6.css'
      - 'apps/portal/assets/app.js'
      - 'apps/portal/assets/style.css'
      - 'apps/portal/data/media-outreach-contacts-v1.json'
      - 'workers/gnk-asg-direct-operator/src/**'
      - 'workers/gnk-asg-direct-operator/package.json'
      - 'workers/gnk-asg-direct-operator/package-lock.json'
      - 'workers/gnk-asg-direct-operator/wrangler.toml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate current assets, authentication and human decision locks
        run: node scripts/test-command-center-current.mjs

      - name: Validate configured Worker import graph
        shell: bash
        run: |
          set -euo pipefail
          entry=$(node --input-type=module -e 'import fs from "node:fs"; const source=fs.readFileSync("workers/gnk-asg-direct-operator/wrangler.toml","utf8"); const entry=source.match(/^main\s*=\s*"([^"]+)"/m)?.[1]; if(!entry)throw new Error("Worker main missing"); console.log(entry);')
          node scripts/validate-worker-import-graph.mjs "workers/gnk-asg-direct-operator/$entry"

      - name: Install locked Worker dependencies
        working-directory: workers/gnk-asg-direct-operator
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Wrangler dry run
        working-directory: workers/gnk-asg-direct-operator
        shell: bash
        run: |
          set +e
          npx wrangler deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator > wrangler-dry-run.log 2>&1
          status=$?
          cat wrangler-dry-run.log
          exit "$status"

      - name: Upload Wrangler diagnostics when available
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-dry-run-log
          path: workers/gnk-asg-direct-operator/wrangler-dry-run.log
          if-no-files-found: ignore
          retention-days: 1
