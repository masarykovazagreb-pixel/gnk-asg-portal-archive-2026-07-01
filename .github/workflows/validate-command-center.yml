name: Validate Command Center

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/validate-command-center.yml'
      - 'apps/portal/admin-center/**'
      - 'apps/portal/media-command-center/**'
      - 'apps/portal/media-application/**'
      - 'apps/portal/media-access/**'
      - 'apps/portal/assets/admin-center-v2.js'
      - 'apps/portal/assets/admin-command-center-primary-v1.js'
      - 'apps/portal/assets/admin-media-applications-entry-v1.js'
      - 'apps/portal/assets/media-command-center-v2.js'
      - 'apps/portal/assets/media-application-v1.js'
      - 'apps/portal/assets/media-access-v1.js'
      - 'apps/portal/data/media-outreach-contacts-v1.json'
      - 'workers/gnk-asg-direct-operator/src/index-admin-hub-v28-news-no-fallback.js'
      - 'workers/gnk-asg-direct-operator/src/index-media-command-center-v20.js'
      - 'workers/gnk-asg-direct-operator/src/media-command-center-v1.js'
      - 'workers/gnk-asg-direct-operator/src/media-application-access-v1.js'
      - 'workers/gnk-asg-direct-operator/src/media-registration-post-code-v2.js'
      - 'workers/gnk-asg-direct-operator/src/media-registration-review-decision-v1.js'
      - 'workers/gnk-asg-direct-operator/wrangler.toml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: JavaScript and required assets
        shell: bash
        run: |
          set -euxo pipefail
          node --check apps/portal/assets/admin-center-v2.js
          node --check apps/portal/assets/admin-command-center-primary-v1.js
          node --check apps/portal/assets/admin-media-applications-entry-v1.js
          node --check apps/portal/assets/media-command-center-v2.js
          node --check apps/portal/assets/media-application-v1.js
          node --check apps/portal/assets/media-access-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v28-news-no-fallback.js
          node --check workers/gnk-asg-direct-operator/src/index-media-command-center-v20.js
          node --check workers/gnk-asg-direct-operator/src/media-command-center-v1.js
          node --check workers/gnk-asg-direct-operator/src/media-application-access-v1.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/media-registration-post-code-v2.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/media-registration-review-decision-v1.js
          test -s apps/portal/admin-center/index.html
          test -s apps/portal/media-command-center/index.html
          test -s apps/portal/media-application/index.html
          test -s apps/portal/media-access/index.html

      - name: Handoff target has 42 recorded emails
        continue-on-error: true
        run: node -e "const x=require('./apps/portal/data/media-outreach-contacts-v1.json'); const n=x.filter(v=>String(v.email||'').trim()).length; console.log('CURRENT_EMAILS='+n+', HANDOFF_TARGET=42, MISSING='+(42-n)); if(n!==42) process.exit(1)"

      - name: Current protected dataset contract
        run: |
          node <<'JS'
          const x=require('./apps/portal/data/media-outreach-contacts-v1.json');
          const emails=x.filter(v=>String(v.email||'').trim()).length;
          const automation=x.filter(v=>v.automationAllowed===true).length;
          const codes=x.map(v=>String(v.mailCode||''));
          if(x.length!==112)throw new Error(`contacts=${x.length}`);
          if(emails!==22)throw new Error(`emails=${emails}`);
          if(automation!==22)throw new Error(`automation=${automation}`);
          if(new Set(codes).size!==112)throw new Error(`unique codes=${new Set(codes).size}`);
          for(const code of codes)if(!/^GNK-MEDIA-\d{8}-[A-Z]{2}-[A-Z0-9]{1,8}-\d{3}$/.test(code))throw new Error(`invalid code: ${code}`);
          console.log(JSON.stringify({contacts:112,emails,automation,handoffTarget:42,missing:20}));
          JS

      - name: Admin order and media application focus
        shell: bash
        run: |
          node <<'JS'
          const fs=require('node:fs');
          const admin=fs.readFileSync('apps/portal/assets/admin-center-v2.js','utf8');
          const mediaEntry=fs.readFileSync('apps/portal/assets/admin-media-applications-entry-v1.js','utf8');
          const order=["label:'Komandni centar'","label:'Media prijave'","label:'Media Portal'","label:'Operator'","label:'Mail Studio'","label:'Auto Editor'"];
          let cursor=-1;
          for(const item of order){const next=admin.indexOf(item);if(next<=cursor)throw new Error(`bad Admin order: ${item}`);cursor=next;}
          if(!admin.includes("const PRIORITIES = ['media','mediaApplications','mediaPortal']"))throw new Error('base media priorities missing');
          for(const marker of ['Pregled media prijava','Javna media prijavnica','grid.prepend(protectedCard)','heroMediaReview'])if(!mediaEntry.includes(marker))throw new Error(`media focus marker missing: ${marker}`);
          console.log('ADMIN_MEDIA_FOCUS=VALID');
          JS

      - name: Locked sending and human decision contract
        shell: bash
        run: |
          set -euxo pipefail
          grep -q "production_sending_locked" workers/gnk-asg-direct-operator/src/index-media-command-center-v20.js
          grep -q "mediaCommandSending:'LOCKED'" workers/gnk-asg-direct-operator/src/index-media-command-center-v20.js
          grep -q "INCOMPLETE_22_OF_42" workers/gnk-asg-direct-operator/src/index-admin-hub-v28-news-no-fallback.js
          grep -q "legacy_code_before_registration_blocked" workers/gnk-asg-direct-operator/src/media-registration-post-code-v2.js
          grep -q "processMediaInvitationQueue(){return{ok:true,skipped:'post_registration_code_policy'}" workers/gnk-asg-direct-operator/src/media-registration-post-code-v2.js
          grep -q "expected_revision_required" workers/gnk-asg-direct-operator/src/media-registration-review-decision-v1.js
          grep -q "decision_reason_required" workers/gnk-asg-direct-operator/src/media-registration-review-decision-v1.js
          grep -q "human_review_status_changed" workers/gnk-asg-direct-operator/src/media-registration-review-decision-v1.js
          grep -q "noNotification:true" workers/gnk-asg-direct-operator/src/media-registration-review-decision-v1.js

      - name: Wrangler dry run
        working-directory: workers/gnk-asg-direct-operator
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator
