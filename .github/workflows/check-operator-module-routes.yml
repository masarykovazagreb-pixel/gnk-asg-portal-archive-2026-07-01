name: Check Operator Module Routes

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/portal/**'
      - 'workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js'
      - 'workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js'
      - 'workers/gnk-asg-direct-operator/src/media-registration-post-code-v2.js'
      - 'workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js'
      - 'workers/gnk-asg-direct-operator/test/unified-auth-enterprise-scope.test.mjs'
      - 'workers/gnk-asg-direct-operator/package.json'
      - 'workers/gnk-asg-direct-operator/wrangler.toml'
      - 'scripts/validate-operator-module-routes.mjs'
      - '.github/workflows/check-operator-module-routes.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check auth route and review syntax
        run: |
          set -euxo pipefail
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/media-registration-post-code-v2.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js
          node --check apps/portal/assets/media-applications-review-v1.js
          node --check workers/gnk-asg-direct-operator/test/unified-auth-enterprise-scope.test.mjs
      - name: Validate all configured module routes
        run: node scripts/validate-operator-module-routes.mjs
      - name: Validate Cloudflare runtime bundle
        working-directory: workers/gnk-asg-direct-operator
        run: |
          set -euxo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir /tmp/gnk-asg-operator-bundle
          test -n "$(find /tmp/gnk-asg-operator-bundle -type f -maxdepth 2 -print -quit)"
      - name: Preserve authentication contract
        run: |
          set -euxo pipefail
          grep -q "const COOKIE='gnk_asg_admin_session'" workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
          grep -q 'const MAX_AGE=43200' workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
          grep -q 'HttpOnly; Secure; SameSite=Strict' workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
          grep -q "'OPERATOR_TOKEN','GNK_ASG_OPERATOR_TOKEN','ADMIN_TOKEN','GNK_ASG_ADMIN_TOKEN'" workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
          grep -q "'/enterprise','/mission-control','/editorial-operations','/registry-center','/deployment'" workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
          grep -q "'/mobile-admin','/seo','/design-review','/language-review','/strategy-performance','/entities'" workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
          grep -q "path.startsWith('/api/media-registration-admin')" workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
          ! grep -R "review-test-token-not-a-secret" workers/gnk-asg-direct-operator/src
      - name: Preserve public media self-registration link
        run: |
          set -euxo pipefail
          grep -q 'const PUBLIC_UI=' workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
          grep -q "'/media-application'" workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
          grep -q "'/media-registration-admin'" workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
          grep -q "const isPublicRegistration=path=>path==='/media-application'" workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js
          grep -q "const REGISTRATION_URL='https://www.gnk-asg.hr/media-application/?lang=en'" workers/gnk-asg-direct-operator/src/media-registration-post-code-v2.js
          grep -q "'SELF_REGISTERED'" workers/gnk-asg-direct-operator/src/media-registration-post-code-v2.js
          grep -q "codePolicy:'ISSUED_AFTER_INITIAL_REGISTRATION'" workers/gnk-asg-direct-operator/src/media-registration-post-code-v2.js
          grep -q 'First, register your newsroom' apps/portal/media-application/index.html
          grep -q 'Create access or continue your application' apps/portal/media-application/index.html
          echo 'Public media application URL and self-registration contract preserved.'
      - name: Verify protected applications review center
        run: |
          set -euxo pipefail
          test -s apps/portal/assets/media-applications-review-v1.css
          test -s apps/portal/assets/media-applications-review-v1.js
          grep -q "const isAdminRegistration=path=>path==='/media-registration-admin'" workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js
          grep -q 'authorizeCampaignMailer' workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js
          grep -q '/api/media-registration-admin/applications' workers/gnk-asg-direct-operator/test/unified-auth-enterprise-scope.test.mjs
          grep -q 'handleMediaRegistrationReviewAdmin' workers/gnk-asg-direct-operator/src/media-registration-post-code-v2.js
          grep -q 'patchMediaRegistrationAdminPage' workers/gnk-asg-direct-operator/src/media-registration-post-code-v2.js
          grep -q 'media-applications-review-v1.js' workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js
          grep -q 'media-applications-review-v1.css' workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js
          grep -q 'media_registration_documents' workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js
          grep -q 'media_registration_audit' workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js
          grep -q 'downloadUrl' workers/gnk-asg-direct-operator/src/media-registration-review-admin-v1.js
          grep -q 'Media Applications Review Center' apps/portal/assets/media-applications-review-v1.js
          grep -q 'Ne šalje automatski masovni e-mail' apps/portal/assets/media-applications-review-v1.js
          echo 'Protected application review center contract verified.'
