name: TEMP Regenerate Editorial Sitemap PR47

on:
  push:
    branches:
      - fix/main-writer-fence-20260826

permissions:
  contents: write

concurrency:
  group: tmp-regenerate-editorial-sitemap-pr47
  cancel-in-progress: false

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[sitemap-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/main-writer-fence-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate canonical editorial sitemap
        run: node scripts/generate-editorial-sitemap-v2.mjs
      - name: Commit canonical sitemap artifacts only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gnk-sitemap-repair-bot"
          git config user.email "actions@github.com"
          git add apps/portal/editorial-sitemap.xml apps/portal/sitemap-index.xml
          if git diff --cached --quiet; then
            echo "Canonical sitemap already matches generator."
            exit 0
          fi
          git commit -m "fix: regenerate canonical editorial sitemap [sitemap-generated]"
          git push origin HEAD:fix/main-writer-fence-20260826
