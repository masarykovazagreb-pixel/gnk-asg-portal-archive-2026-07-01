name: Provjeri 404 ponasanje
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p apps/portal/data/tmp-404check
          curl -sD - -o /tmp/body.html "https://gnk-asg.hr/ovo-sigurno-ne-postoji-xyz-123/" > apps/portal/data/tmp-404check/r.txt
          echo "--- prvih 500 znakova tijela ---" >> apps/portal/data/tmp-404check/r.txt
          head -c 500 /tmp/body.html >> apps/portal/data/tmp-404check/r.txt
          cat apps/portal/data/tmp-404check/r.txt
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          BRANCH="check404-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-404check
          git commit -m "check"
          git push origin "$BRANCH"
