name: Entity SEO Integrity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/portal/nermin-sefic/**'
      - 'apps/portal/en/nermin-sefic/**'
      - 'apps/portal/sitemap.xml'
      - 'scripts/normalize-nermin-entity-seo-v1.mjs'
      - 'scripts/audit-core-entity-seo-v1.mjs'
      - '.github/workflows/entity-seo-integrity.yml'

permissions:
  contents: read

jobs:
  entity-seo:
    if: vars.GNK_ASG_RELEASE_FENCE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Normalize Nermin entity signals
        run: node scripts/normalize-nermin-entity-seo-v1.mjs --write

      - name: Fail if normalization would modify tracked content
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- apps/portal/nermin-sefic/index.html apps/portal/en/nermin-sefic/index.html; then
            echo 'Entity SEO drift detected. Run the normalizer locally and submit the generated changes through a pull request.'
            exit 1
          fi

      - name: Audit GNK ASG and Nermin entity SEO
        run: node scripts/audit-core-entity-seo-v1.mjs
