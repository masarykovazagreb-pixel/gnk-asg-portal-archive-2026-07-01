name: Entity SEO Integrity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/portal/nermin-sefic/**'
      - 'apps/portal/en/nermin-sefic/**'
      - 'apps/portal/sitemap.xml'
      - 'scripts/normalize-nermin-entity-seo-v1.mjs'
      - 'scripts/audit-core-entity-seo-v1.mjs'
      - '.github/workflows/entity-seo-integrity.yml'

permissions:
  contents: read

concurrency:
  group: entity-seo-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  entity-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit GNK ASG and Nermin entity SEO
        run: node scripts/audit-core-entity-seo-v1.mjs

      - name: Verify normalization is already clean
        shell: bash
        run: |
          set -euo pipefail
          node scripts/normalize-nermin-entity-seo-v1.mjs --write
          if ! git diff --exit-code -- apps/portal/nermin-sefic/index.html apps/portal/en/nermin-sefic/index.html; then
            echo "::error::Entity SEO normalization drift detected. Fix through a reviewed PR; this workflow is read-only."
            exit 1
          fi
