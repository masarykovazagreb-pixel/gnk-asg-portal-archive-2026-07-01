name: Dev.to Mirror Preview

on:
  workflow_dispatch:
  schedule:
    - cron: '45 * * * *'

permissions:
  contents: read

concurrency:
  group: devto-mirror-publish
  cancel-in-progress: false

jobs:
  preview:
    name: Preview Dev.to mirror queue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preview queue without secrets
        run: node scripts/devto-publish-resilient-v1.mjs
      - name: Upload preview health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devto-mirror-preview-${{ github.run_id }}
          path: apps/portal/data/devto-content/health.json
          if-no-files-found: warn
          retention-days: 14
