name: Workforce Bot Orchestrator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'config/control-plane/workforce-bot-registry-v1.json'
      - 'scripts/workforce-bot-orchestrator-v1.mjs'
      - '.github/workflows/workforce-bot-orchestrator.yml'
  schedule:
    - cron: '17 */4 * * *'

permissions:
  contents: read

concurrency:
  group: workforce-bot-orchestrator
  cancel-in-progress: true

jobs:
  assign-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bot assignments and enforce complete worker coverage
        run: node scripts/workforce-bot-orchestrator-v1.mjs
      - name: Publish summary
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('artifacts/workforce-bot-orchestrator/assignment.json','utf8'));
          console.log('## GNK ASG Workforce Bot Orchestrator');
          console.log('- Worker directories: **'+r.workers+'**');
          console.log('- Registered bots: **'+r.bots+'**');
          console.log('- Coverage: **'+(r.coverageOk?'PASS':'FAIL')+'**');
          console.log('- Protected observe-only bots: **'+r.summary.protectedObserveOnly+'**');
          console.log('- Cadence: **every 4 hours + scoped push/manual**');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: workforce-bot-assignments-${{ github.run_id }}
          path: artifacts/workforce-bot-orchestrator/assignment.json
          retention-days: 14
