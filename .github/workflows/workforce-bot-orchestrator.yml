name: Workforce Bot Orchestrator

on:
  workflow_dispatch:
    inputs:
      run_ai_research:
        description: 'Paid AI disabled in free-only mode; input ignored'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'workers/**'
      - 'config/control-plane/**'
      - 'scripts/workforce-bot-orchestrator-v1.mjs'
      - 'scripts/worker-agent-swarm-v1.mjs'
      - 'scripts/aktual-world-agent-factory-v1.mjs'
      - 'scripts/aktual-agent-task-scheduler-v1.mjs'
      - 'tests/test-aktual-world-agent-factory-v1.mjs'
      - 'tests/test-aktual-world-canonical-release-boundary-v1.mjs'
      - '.github/workflows/aktual-world-free-release.yml'
      - 'tests/test-aktual-agent-task-scheduler-v1.mjs'
      - 'scripts/aktual-review-window-gate-v1.mjs'
      - 'tests/test-aktual-review-window-gate-v1.mjs'
      - 'ops/aktual-editor-priorities-v1.json'
      - 'scripts/master-asg-agent-network-v2.mjs'
      - 'scripts/swarm-public-research-draft-v1.mjs'
      - 'scripts/aktual-free-editorial-network-v1.mjs'
      - 'scripts/aktual-existing-portals-daily-weekly-v1.mjs'
      - 'tests/test-aktual-existing-portals-daily-weekly-v1.mjs'
      - 'tests/test-aktual-free-editorial-network-v1.mjs'
      - 'tests/test-aktual-regional-seo-identity-v1.mjs'
      - 'scripts/audit-aktual-brand-indexability-v1.mjs'
      - 'tests/test-worker-agent-swarm-v1.mjs'
      - 'apps/region/engine/build.mjs'
      - 'apps/region/engine/theme-art.mjs'
      - 'apps/region/engine/hub.mjs'
      - 'tests/test-regional-original-art-v1.mjs'
      - '.github/workflows/workforce-bot-orchestrator.yml'
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'config/control-plane/**'
      - 'scripts/workforce-bot-orchestrator-v1.mjs'
      - 'scripts/worker-agent-swarm-v1.mjs'
      - 'scripts/aktual-world-agent-factory-v1.mjs'
      - 'scripts/aktual-agent-task-scheduler-v1.mjs'
      - 'tests/test-aktual-world-agent-factory-v1.mjs'
      - 'tests/test-aktual-world-canonical-release-boundary-v1.mjs'
      - '.github/workflows/aktual-world-free-release.yml'
      - 'tests/test-aktual-agent-task-scheduler-v1.mjs'
      - 'scripts/aktual-review-window-gate-v1.mjs'
      - 'tests/test-aktual-review-window-gate-v1.mjs'
      - 'ops/aktual-editor-priorities-v1.json'
      - 'scripts/swarm-public-research-draft-v1.mjs'
      - 'scripts/aktual-free-editorial-network-v1.mjs'
      - 'tests/test-aktual-free-editorial-network-v1.mjs'
      - 'tests/test-aktual-regional-seo-identity-v1.mjs'
      - 'scripts/audit-aktual-brand-indexability-v1.mjs'
      - 'tests/test-worker-agent-swarm-v1.mjs'
      - '.github/workflows/workforce-bot-orchestrator.yml'
  schedule:
    - cron: '17 */4 * * *'

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: workforce-bot-orchestrator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assign-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bot assignments and enforce complete Worker coverage
        run: node scripts/workforce-bot-orchestrator-v1.mjs
      - name: Execute specialized Worker agents and governance tests
        run: node tests/test-worker-agent-swarm-v1.mjs
      - name: Keep 12 canonical international sites isolated from 15-site prototypes
        run: node --test tests/test-aktual-world-canonical-release-boundary-v1.mjs
      - name: Validate AKTUAL MEDIA regional SEO and real author/editor attribution
        run: node tests/test-aktual-regional-seo-identity-v1.mjs
      - name: AKTUAL MEDIA — free-only 8 regional + 15 national editorial desks
        run: node tests/test-aktual-free-editorial-network-v1.mjs
      - name: Observe official national RSS sources on existing four-hour schedule (free, no publication)
        if: github.event_name == 'schedule'
        env:
          AKTUAL_FREE_FEEDS: '1'
        run: node scripts/aktual-free-editorial-network-v1.mjs
      - name: Create ranked daily and weekly source-linked editorial queue (HOLD)
        run: |
          node scripts/aktual-existing-portals-daily-weekly-v1.mjs
          node --test tests/test-aktual-existing-portals-daily-weekly-v1.mjs
      - name: Enforce 30-minute editorial delivery and release decision safety
        run: node --test tests/test-aktual-review-window-gate-v1.mjs
      - name: Execute 150 free scoped agents and allocate prioritized tasks
        env:
          ASG_MONITOR_PUBLIC_FEEDS: '0'
          ASG_AGENT_TASK_BUDGET: '150'
        run: |
          node scripts/aktual-world-agent-factory-v1.mjs
          node --test tests/test-aktual-world-agent-factory-v1.mjs
          node scripts/aktual-agent-task-scheduler-v1.mjs
          node --test tests/test-aktual-agent-task-scheduler-v1.mjs
      - name: Confirm paid editorial APIs remain disabled
        run: |
          echo "Free-tier-only: 0 Exa/OpenAI requests, existing 4h cron, no public publishing."
      - name: Observe canonical MASTER ASG V2 CI and public route evidence
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ENABLE_PUBLIC_RESEARCH: '0'
          ENABLE_AI_WRITING: '0'
        run: node scripts/master-asg-agent-network-v2.mjs
      - name: Summarize agent evidence
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/aktual-agent-task-scheduler/summary.md ]; then
            cat artifacts/aktual-agent-task-scheduler/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/aktual-world-agent-factory/summary.md ]; then
            cat artifacts/aktual-world-agent-factory/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/master-asg-agent-network/summary.md ]; then
            cat artifacts/master-asg-agent-network/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/aktual-editorial-network/daily-weekly-brief.md ]; then
            cat artifacts/aktual-editorial-network/daily-weekly-brief.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/aktual-editorial-network/summary.md ]; then
            cat artifacts/aktual-editorial-network/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/worker-agent-swarm/summary.md ]; then
            cat artifacts/worker-agent-swarm/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/workforce-bot-orchestrator/assignment.json ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('artifacts/workforce-bot-orchestrator/assignment.json','utf8'));
          console.log('\nOrchestration coverage: '+(r.coverageOk?'PASS':'FAIL')+' ('+r.bots+'/'+r.workers+' worker bots)');
          NODE
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workforce-agent-evidence-${{ github.run_id }}
          path: |
            artifacts/workforce-bot-orchestrator/assignment.json
            artifacts/worker-agent-swarm/
            artifacts/master-asg-agent-network/
            artifacts/aktual-editorial-network/
            artifacts/aktual-world-agent-factory/
            artifacts/aktual-agent-task-scheduler/
            apps/global-free/sites/
          if-no-files-found: warn
          retention-days: 14
