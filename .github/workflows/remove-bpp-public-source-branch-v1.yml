name: P0 BPP public source branch sanitizer

on:
  push:
    branches:
      - fix/remove-bpp-public-source-20260813-v2

permissions:
  contents: write

jobs:
  sanitize-public-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: fix/remove-bpp-public-source-20260813-v2
          fetch-depth: 0

      - name: Sanitize public HTML and capture residual report
        shell: bash
        run: |
          set +e
          node scripts/remove-bpp-public-v1.mjs --write > /tmp/bpp-write-report.json
          WRITE_RC=$?
          node scripts/remove-bpp-public-v1.mjs > bpp-public-residual-report.json
          CHECK_RC=$?
          set -e
          echo "write_rc=$WRITE_RC check_rc=$CHECK_RC"
          cat bpp-public-residual-report.json
          git diff --check

      - name: Commit branch-only cleanup evidence
        shell: bash
        run: |
          git config user.name "gnk-asg-bpp-cleanup-bot"
          git config user.email "actions@github.com"
          git add apps/portal scripts/remove-bpp-public-v1.mjs bpp-public-residual-report.json
          if git diff --cached --quiet; then
            echo "No branch changes required."
            exit 0
          fi
          git commit -m "P0: sanitize BPP public source and capture residuals"
          git push origin HEAD:fix/remove-bpp-public-source-20260813-v2
