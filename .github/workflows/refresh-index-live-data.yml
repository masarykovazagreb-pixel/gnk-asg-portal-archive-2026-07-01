name: Refresh index market data

on:
  schedule:
    # Tržišni podatci naslovnice osvježavaju se jednom na sat, u minuti 05 UTC.
    - cron: '5 * * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/refresh-index-live-data.yml'
      - 'scripts/refresh_index_live_data.py'
      - 'scripts/refresh_index_market_only.py'
      - 'scripts/validate_index_market_data.py'
      - 'apps/portal/assets/market.js'
      - 'apps/portal/data/market.json'
      - 'apps/portal/data/market_indices.json'
      - 'apps/portal/data/fast_market_status.json'

permissions:
  contents: read

concurrency:
  group: refresh-index-market-data-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public index market feeds
        run: python scripts/refresh_index_market_only.py
      - name: Confirm market freshness contract
        run: python scripts/validate_index_market_data.py
      - name: Upload refreshed market evidence
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-index-market-data
          path: |
            apps/portal/data/market.json
            apps/portal/data/market_indices.json
            apps/portal/data/fast_market_status.json
          if-no-files-found: error
          retention-days: 3

  refresh-main:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh and validate public index market feeds
        run: |
          python scripts/refresh_index_market_only.py
          python scripts/validate_index_market_data.py
      - name: Commit refreshed public market data
        run: |
          git config user.name 'gnk-asg-live-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/portal/data/market.json apps/portal/data/market_indices.json apps/portal/data/fast_market_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh index market data [skip ci]'
          git push origin HEAD:main
