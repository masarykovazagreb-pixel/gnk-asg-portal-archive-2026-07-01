name: Refresh index live data

on:
  schedule:
    # GitHub cron uses UTC. 07:05 and 15:05 UTC map to 09:05 and 17:05
    # during Croatian summer time and remain within one hour in winter.
    - cron: '5 7,15 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/refresh-index-live-data.yml'
      - 'scripts/refresh_index_live_data.py'
      - 'scripts/refresh_world_market_indices.py'
      - 'scripts/validate_index_live_data.py'
      - 'scripts/normalize_index_live_data_cadence.py'
      - 'scripts/test_index_live_data_cadence_v1.py'
      - 'apps/portal/assets/market.js'
      - 'apps/portal/assets/news-live.js'
      - 'apps/portal/data/market.json'
      - 'apps/portal/data/market_indices.json'
      - 'apps/portal/data/fast_market_status.json'
      - 'apps/portal/data/news.json'
      - 'apps/portal/data/news_archive.json'
      - 'apps/portal/data/news-status.json'

permissions:
  contents: read

concurrency:
  group: refresh-index-live-data-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public index feeds
        run: |
          python scripts/refresh_index_live_data.py
          python scripts/refresh_world_market_indices.py
      - name: Normalize public cadence metadata
        run: python scripts/normalize_index_live_data_cadence.py
      - name: Confirm cadence contract
        run: python scripts/test_index_live_data_cadence_v1.py
      - name: Confirm freshness contract
        run: python scripts/validate_index_live_data.py
      - name: Upload refreshed data evidence
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-index-live-data
          path: |
            apps/portal/data/market.json
            apps/portal/data/market_indices.json
            apps/portal/data/fast_market_status.json
            apps/portal/data/news.json
            apps/portal/data/news_archive.json
            apps/portal/data/news-status.json
          if-no-files-found: error
          retention-days: 3

  refresh-main:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh and validate public index feeds
        run: |
          python scripts/refresh_index_live_data.py
          python scripts/refresh_world_market_indices.py
          python scripts/normalize_index_live_data_cadence.py
          python scripts/test_index_live_data_cadence_v1.py
          python scripts/validate_index_live_data.py
      - name: Commit refreshed public data
        run: |
          git config user.name 'gnk-asg-live-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/portal/data/market.json apps/portal/data/market_indices.json apps/portal/data/fast_market_status.json apps/portal/data/news.json apps/portal/data/news_archive.json apps/portal/data/news-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh index market and business news data [skip ci]'
          git push origin HEAD:main
