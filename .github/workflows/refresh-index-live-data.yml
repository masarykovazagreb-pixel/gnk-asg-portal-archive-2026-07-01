name: Refresh index live data

on:
  schedule:
    # GitHub cron uses UTC. 07:05 and 15:05 UTC map to 09:05 and 17:05
    # during Croatian summer time and remain within one hour in winter.
    - cron: '5 7,15 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/refresh-index-live-data.yml'
      - 'scripts/refresh_index_live_data.py'
      - 'scripts/refresh_world_market_indices.py'
      - 'scripts/validate_index_live_data.py'
      - 'scripts/normalize_index_live_data_cadence.py'
      - 'scripts/test_index_live_data_cadence_v1.py'
      - 'scripts/validate-market-satellite-contract-v1.py'
      - 'apps/portal/scripts/refresh_market_satellites.py'
      - 'apps/portal/scripts/update_reference_assets.py'
      - 'ops/digital-assets-single-writer-guard-v1.json'
      - 'scripts/test-digital-assets-single-writer-guard-v1.mjs'
      - 'apps/portal/assets/market.js'
      - 'apps/portal/data/market.json'
      - 'apps/portal/data/market_indices.json'
      - 'apps/portal/data/fast_market_status.json'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('refresh-index-live-data-{0}', github.event_name) || 'gnk-asg-main-mutation' }}
  cancel-in-progress: true

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public market feeds
        run: |
          python scripts/refresh_index_live_data.py
          python scripts/refresh_world_market_indices.py
          python apps/portal/scripts/refresh_market_satellites.py
          python apps/portal/scripts/update_reference_assets.py
      - name: Normalize public cadence metadata
        run: python scripts/normalize_index_live_data_cadence.py
      - name: Confirm cadence contract
        run: python scripts/test_index_live_data_cadence_v1.py
      - name: Confirm freshness contract
        run: |
          python scripts/validate_index_live_data.py
          python scripts/validate-market-satellite-contract-v1.py
          node scripts/test-digital-assets-single-writer-guard-v1.mjs
      - name: Upload refreshed market-data evidence
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-index-live-data
          path: |
            apps/portal/data/market.json
            apps/portal/data/market_indices.json
            apps/portal/data/fast_market_status.json
            apps/portal/data/stablecoins.json
            apps/portal/data/btc_chart.json
            apps/portal/data/exchange_compare.json
            apps/portal/data/stock_exchanges.json
            apps/portal/data/asg_gold_asset.json
            apps/portal/data/reference_assets_status.json
          if-no-files-found: error
          retention-days: 3

  refresh-main:
    if: vars.GNK_ASG_RELEASE_FENCE != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh and validate public market feeds
        run: |
          python scripts/refresh_index_live_data.py
          python scripts/refresh_world_market_indices.py
          python apps/portal/scripts/refresh_market_satellites.py
          python apps/portal/scripts/update_reference_assets.py
          python scripts/normalize_index_live_data_cadence.py
          python scripts/test_index_live_data_cadence_v1.py
          python scripts/validate_index_live_data.py
          python scripts/validate-market-satellite-contract-v1.py
          node scripts/test-digital-assets-single-writer-guard-v1.mjs
          node scripts/freshness-status-v2.mjs
      - name: Commit refreshed public market data
        run: |
          set -euo pipefail
          expected_base="$(git rev-parse HEAD)"
          git config user.name 'gnk-asg-live-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            apps/portal/data/market.json \
            apps/portal/data/market_indices.json \
            apps/portal/data/fast_market_status.json \
            apps/portal/data/freshness-status.json \
            apps/portal/data/stablecoins.json \
            apps/portal/data/btc_chart.json \
            apps/portal/data/exchange_compare.json \
            apps/portal/data/stock_exchanges.json \
            apps/portal/data/asg_gold_asset.json \
            apps/portal/data/reference_assets_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh canonical market datasets [skip ci]'

          # Generated state belongs to one exact main snapshot. Never rebase
          # generated market output onto a newer main.
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          if [ "$current_main" != "$expected_base" ]; then
            echo "Main moved during market generation: expected $expected_base, found $current_main. Deferring without rebase/push."
            exit 75
          fi

          # Final compare-and-swap guard: ordinary non-force push must fail if
          # another writer moves main after the check above.
          git push origin HEAD:main
