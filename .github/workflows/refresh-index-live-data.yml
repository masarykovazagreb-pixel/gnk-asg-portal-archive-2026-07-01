name: Refresh index live data

on:
  schedule:
    # Six refresh windows daily; GitHub cron is UTC.
    - cron: '5 2,6,10,14,18,22 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/refresh-index-live-data.yml'
      - 'scripts/refresh_index_live_data.py'
      - 'scripts/refresh_world_market_indices.py'
      - 'scripts/validate_index_live_data.py'
      - 'scripts/normalize_index_live_data_cadence.py'
      - 'scripts/test_index_live_data_cadence_v1.py'
      - 'apps/portal/assets/market.js'
      - 'apps/portal/data/market.json'
      - 'apps/portal/data/market_indices.json'
      - 'apps/portal/data/fast_market_status.json'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('refresh-index-live-data-{0}', github.event_name) || 'gnk-asg-main-mutation' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public market feeds
        run: |
          python scripts/refresh_index_live_data.py
          python scripts/refresh_world_market_indices.py
      - name: Normalize public cadence metadata
        run: python scripts/normalize_index_live_data_cadence.py
      - name: Confirm cadence contract
        run: python scripts/test_index_live_data_cadence_v1.py
      - name: Confirm freshness contract
        run: python scripts/validate_index_live_data.py
      - name: Upload refreshed market-data evidence
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-index-live-data
          path: |
            apps/portal/data/market.json
            apps/portal/data/market_indices.json
            apps/portal/data/fast_market_status.json
          if-no-files-found: error
          retention-days: 3

  refresh-main:
    if: vars.GNK_ASG_RELEASE_FENCE != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh and validate public market feeds
        run: |
          python scripts/refresh_index_live_data.py
          python scripts/refresh_world_market_indices.py
          python scripts/normalize_index_live_data_cadence.py
          python scripts/test_index_live_data_cadence_v1.py
          python scripts/validate_index_live_data.py
          node scripts/freshness-status-v2.mjs
      - name: Commit refreshed public market data
        shell: bash
        run: |
          set -euo pipefail
          expected_base="$(git rev-parse HEAD)"
          git config user.name 'gnk-asg-live-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/portal/data/market.json apps/portal/data/market_indices.json apps/portal/data/fast_market_status.json apps/portal/data/freshness-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh index market data [skip ci]'
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          if [ "$current_main" != "$expected_base" ]; then
            echo "Main moved during index-market generation: expected $expected_base, found $current_main. Deferring without rebase/push."
            exit 75
          fi
          git push origin HEAD:main
