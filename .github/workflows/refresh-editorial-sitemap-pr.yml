name: Refresh Editorial Sitemap PR

on:
  push:
    branches:
      - feature/master-asg-99-sprint-20260819
    paths:
      - '.github/workflows/refresh-editorial-sitemap-pr.yml'

permissions:
  contents: write

concurrency:
  group: refresh-editorial-sitemap-pr
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/master-asg-99-sprint-20260819
          fetch-depth: 1
      - name: Generate canonical editorial sitemap
        run: node scripts/generate-editorial-sitemap-v2.mjs
      - name: Commit generated sitemap only when changed
        run: |
          if git diff --quiet -- apps/portal/editorial-sitemap.xml apps/portal/sitemap-index.xml; then
            echo "Canonical sitemap already synchronized."
            exit 0
          fi
          git config user.name "MASTER ASG Sitemap Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/portal/editorial-sitemap.xml apps/portal/sitemap-index.xml
          git commit -m "SEO: synchronize canonical editorial sitemap"
          git push origin HEAD:feature/master-asg-99-sprint-20260819
