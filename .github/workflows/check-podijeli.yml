name: Provjeri uzorak podijeli stranica
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v5
      - run: bash podijeli_check.sh
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          BRANCH="podijelicheck-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-podijeli-check
          git commit -m "check"
          git push origin "$BRANCH"
