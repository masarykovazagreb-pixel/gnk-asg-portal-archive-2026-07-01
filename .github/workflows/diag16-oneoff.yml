name: Verify the-code reveal classes (one-off)
on:
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the-code page
        run: |
          echo "# the-code reveal check $(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/d.md
          curl -s "https://gnk-asg.hr/the-code/?cb=$(date +%s)" -o /tmp/body.html
          echo '```' >> /tmp/d.md
          grep -o 'reveal[a-z0-9 "-]*' /tmp/body.html | head -20 >> /tmp/d.md
          echo '---IntersectionObserver---' >> /tmp/d.md
          grep -c 'IntersectionObserver' /tmp/body.html >> /tmp/d.md
          echo '---code-story section snippet---' >> /tmp/d.md
          grep -o '<section class="code-story">.\{0,300\}' /tmp/body.html >> /tmp/d.md
          echo '```' >> /tmp/d.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" --title "the-code reveal check $(date -u +%Y-%m-%dT%H:%M:%SZ)" --body-file /tmp/d.md
