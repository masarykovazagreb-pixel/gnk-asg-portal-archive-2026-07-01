name: Diagnose Cloudflare cache/route state (one-off, read-only)

on:
  workflow_dispatch:
    inputs:
      cf_token:
        description: "Cloudflare read-only API token (masked immediately, never logged)"
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mask token before anything else touches it
        run: |
          echo "::add-mask::${{ inputs.cf_token }}"
          echo "# Cloudflare diagnostic results ($(date -u +%Y-%m-%dT%H:%M:%SZ))" > /tmp/diag.md

      - name: Resolve zone id for gnk-asg.hr
        id: zone
        env:
          CF_TOKEN: ${{ inputs.cf_token }}
        run: |
          set -euo pipefail
          curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=gnk-asg.hr" -o /tmp/zone.json
          MSG=$(python3 -c "import json;d=json.load(open('/tmp/zone.json'));r=d.get('result') or [];print(('zone: '+r[0]['name']+' status: '+r[0]['status']+' plan: '+str(r[0].get('plan',{}).get('name'))) if r else ('errors: '+str(d.get('errors'))))")
          printf "\n## Zone\n%s\n" "$MSG" >> /tmp/diag.md
          zid=$(python3 -c "import json;d=json.load(open('/tmp/zone.json'));r=d.get('result') or [];print(r[0]['id'] if r else '')")
          echo "zone_id=$zid" >> "$GITHUB_OUTPUT"

      - name: List Worker routes for the zone
        env:
          CF_TOKEN: ${{ inputs.cf_token }}
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          set -euo pipefail
          curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes" -o /tmp/routes.json
          MSG=$(python3 -c "import json;d=json.load(open('/tmp/routes.json'));rs=d.get('result') or [];print(' | '.join((r.get('pattern','?')+' -> '+str(r.get('script'))) for r in rs) if rs else 'no routes / errors: '+str(d.get('errors')))")
          printf "\n## Worker Routes\n%s\n" "$MSG" >> /tmp/diag.md

      - name: Check cache-level / dev-mode / always-online zone settings
        env:
          CF_TOKEN: ${{ inputs.cf_token }}
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          set -euo pipefail
          for setting in cache_level browser_cache_ttl development_mode always_online; do
            curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/settings/${setting}" -o /tmp/setting.json
            MSG=$(python3 -c "import json;d=json.load(open('/tmp/setting.json'));r=d.get('result',{});print('value: '+str(r.get('value'))+' editable: '+str(r.get('editable')))" || echo "failed")
            printf "\n## Setting: %s\n%s\n" "$setting" "$MSG" >> /tmp/diag.md
          done

      - name: List page rules (may affect caching per-path)
        env:
          CF_TOKEN: ${{ inputs.cf_token }}
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          set -euo pipefail
          curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/pagerules" -o /tmp/pagerules.json
          MSG=$(python3 -c "import json;d=json.load(open('/tmp/pagerules.json'));rs=d.get('result') or [];print(' || '.join((str([t.get('constraint',{}).get('value') for t in pr.get('targets',[])])+' status='+str(pr.get('status'))+' actions='+str([(a.get('id'),a.get('value')) for a in pr.get('actions',[])])) for pr in rs) if rs else 'no page rules / errors: '+str(d.get('errors')))")
          printf "\n## Page Rules\n%s\n" "$MSG" >> /tmp/diag.md

      - name: List zones for account
        env:
          CF_TOKEN: ${{ inputs.cf_token }}
        run: |
          set -euo pipefail
          curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones?per_page=50" -o /tmp/allzones.json
          MSG=$(python3 -c "import json;d=json.load(open('/tmp/allzones.json'));rs=d.get('result') or [];print(' | '.join(z.get('name')+':'+z.get('id')+':'+z.get('status') for z in rs) if rs else 'errors: '+str(d.get('errors')))")
          printf "\n## All Zones\n%s\n" "$MSG" >> /tmp/diag.md

      - name: Verify live style.css contains the new 50% opacity value
        run: |
          curl -s "https://gnk-asg.hr/assets/style.css?diagcachebust=$(date +%s)" -o /tmp/live_style.css
          {
            echo ""
            echo "## Live style.css check"
            if grep -o '\.site-header{[^}]*}' /tmp/live_style.css; then :; else echo "site-header rule not found"; fi
            if grep -q 'rgba(255,255,255,\.5)' /tmp/live_style.css; then
              echo "CONFIRMED: rgba(255,255,255,.5) present in live style.css"
            else
              echo "NOT FOUND: rgba(255,255,255,.5) missing from live style.css"
            fi
          } >> /tmp/diag.md

      - name: Live HEAD request to / and /group-network/ with cache headers
        run: |
          for path in "/" "/group-network/" "/en/"; do
            headers=$(curl -s -D - -o /dev/null "https://gnk-asg.hr${path}?diagcachebust=$(date +%s)" | tr -d '\r' | grep -Ei '^(HTTP/|cf-cache-status|cf-ray|cache-control|age:|last-modified|etag|x-gnk-)' | tr '\n' ' | ')
            safe_path=$(echo "$path" | tr '/' '_')
            printf "\n## Headers for %s\n%s\n" "$path" "$headers" >> /tmp/diag.md
          done

      - name: Publish results as a GitHub issue (readable via API without blob-storage access)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "CF diagnostic $(date -u +%Y-%m-%dT%H:%M:%SZ) (run ${{ github.run_id }})" \
            --body-file /tmp/diag.md || cat /tmp/diag.md
