name: kanal-deploy

# Objavljuje GNK ASG KANAL (apps/kanal).
# Primarno: Cloudflare Pages (neograničen promet, domena kanal.gnk-asg.hr).
# Rezervno: GitHub Pages (ako je uključen u Settings → Pages).
# Ne dira portal gnk-asg.hr ni Cloudflare Workere.

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'apps/kanal/**'
      - '.github/workflows/kanal-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanal-deploy
  cancel-in-progress: true

jobs:
  cloudflare-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pripremi Cloudflare Pages projekt i domenu
        id: cf
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${CF_TOKEN:-}" ] || [ -z "${CF_ACCOUNT:-}" ]; then
            echo "::warning::Cloudflare secrets nisu dostupni — preskačem Cloudflare deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Provjera pristupa..."
          code=$(curl -s -o /tmp/proj.json -w '%{http_code}' \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/gnk-asg-kanal")
          if [ "$code" != "200" ]; then
            echo "Projekt ne postoji (HTTP $code) — kreiram."
            code=$(curl -s -o /tmp/create.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              --data '{"name":"gnk-asg-kanal","production_branch":"main"}' \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects")
            echo "Create HTTP $code"; head -c 400 /tmp/create.json || true; echo
          fi
          code=$(curl -s -o /tmp/proj.json -w '%{http_code}' \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/gnk-asg-kanal")
          if [ "$code" != "200" ]; then
            echo "::warning::Cloudflare Pages nije dostupan (HTTP $code). Provjeri ovlasti tokena (Pages:Edit)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

          attach_domain() {
            curl -s -o /tmp/dom.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              --data '{"name":"kanal.gnk-asg.hr"}' \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/gnk-asg-kanal/domains" > /tmp/dom.code
          }

          attach_domain
          if grep -q '"success":true' /tmp/dom.json; then
            echo "domain_ok=true" >> "$GITHUB_OUTPUT"
            echo "Domena kanal.gnk-asg.hr povezana."
          else
            echo "Prvi pokušaj nije prošao (HTTP $(cat /tmp/dom.code)); tražim zone i DNS zapis..."
            curl -s -o /tmp/zones.json -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones?name=gnk-asg.hr"
            ZONE_ID=$(python3 -c "import json;d=json.load(open('/tmp/zones.json'));r=d.get('result') or [];print(r[0]['id'] if r else '')" 2>/dev/null || true)
            echo "zone_id=${ZONE_ID:-<nema>}"
            if [ -n "${ZONE_ID:-}" ]; then
              curl -s -o /tmp/dns.json -X POST \
                -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
                --data '{"type":"CNAME","name":"kanal","content":"gnk-asg-kanal.pages.dev","proxied":true}' \
                "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" || true
              head -c 300 /tmp/dns.json || true; echo
              attach_domain
            fi
            if grep -q '"success":true' /tmp/dom.json; then
              echo "domain_ok=true" >> "$GITHUB_OUTPUT"
              echo "Domena kanal.gnk-asg.hr povezana nakon DNS zapisa."
            else
              echo "domain_ok=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Domena nije povezana automatski — potreban je CNAME kanal -> gnk-asg-kanal.pages.dev ili ovlast Pages:Edit + Zone:DNS:Edit na tokenu."
              head -c 300 /tmp/dom.json || true; echo
            fi
          fi

      - name: Gradnja (Cloudflare base)
        if: steps.cf.outputs.ready == 'true'
        shell: bash
        run: |
          if [ "${{ steps.cf.outputs.domain_ok }}" = "true" ]; then
            BASE="https://kanal.gnk-asg.hr/"
          else
            BASE="https://gnk-asg-kanal.pages.dev/"
          fi
          echo "KANAL_BASE=$BASE" >> "$GITHUB_ENV"
          node apps/kanal/build.mjs --base "$BASE"

      - name: Provjera izlaza
        if: steps.cf.outputs.ready == 'true'
        shell: bash
        run: |
          test -f apps/kanal/site/index.html
          test -f apps/kanal/site/feed.json
          test -f apps/kanal/site/sitemap.xml
          grep -q 'application/ld+json' apps/kanal/site/index.html
          grep -q 'Urednički pregledano' apps/kanal/site/index.html

      - name: Objavi na Cloudflare Pages
        if: steps.cf.outputs.ready == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy apps/kanal/site \
            --project-name=gnk-asg-kanal \
            --branch=main \
            --commit-dirty=true

      - name: Sažetak
        if: steps.cf.outputs.ready == 'true'
        shell: bash
        run: |
          {
            echo "## KANAL objavljen"
            if [ "${{ steps.cf.outputs.domain_ok }}" = "true" ]; then
              echo "- https://kanal.gnk-asg.hr/"
            fi
            echo "- https://gnk-asg-kanal.pages.dev/"
            echo "- feed: ${KANAL_BASE}feed.json"
            echo "- status: urednički pregledano 19. 10. 2026."
          } >> "$GITHUB_STEP_SUMMARY"

  github-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gradnja (GitHub Pages base)
        run: node apps/kanal/build.mjs --base "https://masarykovazagreb-pixel.github.io/gnk-asg-kanal/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/kanal/site
      - id: deployment
        uses: actions/deploy-pages@v4
