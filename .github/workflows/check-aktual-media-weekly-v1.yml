name: Check AKTUAL MEDIA Weekly V1

on:
  pull_request:
    paths:
      - 'apps/portal/gnk-aktual/tjedni/**'
      - 'apps/portal/en/gnk-aktual/weekly/**'
      - 'apps/portal/gnk-aktual/index.html'
      - 'apps/portal/en/gnk-aktual/index.html'
      - 'apps/portal/assets/aktual-media-weekly-v1.*'
      - 'apps/portal/assets/aktual-media-world-v1.js'
      - 'apps/portal/assets/public-unified-menu-v6.js'
      - 'apps/portal/data/news.json'
      - 'apps/portal/data/aktual-weekly.json'
      - 'apps/portal/data/aktual-weekly-curation.json'
      - 'apps/portal/data/aktual-weekly-archives/**'
      - 'apps/portal/sitemap.xml'
      - 'apps/portal/editorial-sitemap.xml'
      - 'scripts/build-aktual-media-weekly-v1.mjs'
      - 'scripts/build-aktual-media-weekly-archive-v1.mjs'
      - 'scripts/enforce-nermin-author-seo-v1.mjs'
      - 'apps/portal/gnk-aktual/kolumne/**'
      - 'scripts/test-aktual-media-weekly-v1.mjs'
      - '.github/workflows/editorial-scheduled-publish.yml'
      - '.github/workflows/check-aktual-media-weekly-v1.yml'
  push:
    branches: [main]
    paths:
      - 'apps/portal/gnk-aktual/tjedni/**'
      - 'apps/portal/en/gnk-aktual/weekly/**'
      - 'apps/portal/gnk-aktual/index.html'
      - 'apps/portal/en/gnk-aktual/index.html'
      - 'apps/portal/assets/aktual-media-weekly-v1.*'
      - 'apps/portal/assets/aktual-media-world-v1.js'
      - 'apps/portal/assets/public-unified-menu-v6.js'
      - 'apps/portal/data/news.json'
      - 'apps/portal/data/aktual-weekly.json'
      - 'apps/portal/data/aktual-weekly-curation.json'
      - 'apps/portal/data/aktual-weekly-archives/**'
      - 'apps/portal/sitemap.xml'
      - 'apps/portal/editorial-sitemap.xml'
      - 'scripts/build-aktual-media-weekly-v1.mjs'
      - 'scripts/build-aktual-media-weekly-archive-v1.mjs'
      - 'scripts/enforce-nermin-author-seo-v1.mjs'
      - 'apps/portal/gnk-aktual/kolumne/**'
      - 'scripts/test-aktual-media-weekly-v1.mjs'
      - '.github/workflows/editorial-scheduled-publish.yml'
      - '.github/workflows/check-aktual-media-weekly-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild and validate curated AKTUAL MEDIA Weekly issue and archive
        run: node scripts/test-aktual-media-weekly-v1.mjs
