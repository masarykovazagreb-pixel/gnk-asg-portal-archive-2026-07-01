name: Deploy Private Workforce Staging

on:
  push:
    branches:
      - agent/digital-workforce-puls-redesign-integration-20260722
    paths:
      - 'apps/portal/digital-workforce/**'
      - 'apps/portal/workers/**'
      - 'apps/portal/assets/digital-workforce-**'
      - 'apps/portal/assets/gnkc-**'
      - 'scripts/test-digital-workforce-**'
      - 'scripts/test-gnkc-**'
      - 'workers/gnk-asg-direct-operator/src/digital-workforce-suite-v1.js'
      - 'workers/gnk-asg-direct-operator/src/index-workforce-staging-gate-v1.js'
      - 'workers/gnk-asg-direct-operator/wrangler.workforce-staging.toml'
      - '.github/workflows/deploy-private-workforce-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnk-dinamo-workforce-private-staging
  cancel-in-progress: true

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Enforce approved staging source branch
        shell: bash
        run: |
          set -euo pipefail
          expected='refs/heads/agent/digital-workforce-puls-redesign-integration-20260722'
          [ "$GITHUB_REF" = "$expected" ] || { echo "::error::Private Workforce staging may deploy only from $expected; got $GITHUB_REF"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate staging entrypoint and public suite
        shell: bash
        run: |
          set -euo pipefail
          gate='workers/gnk-asg-direct-operator/src/index-workforce-staging-gate-v1.js'
          node --check "$gate"
          node --check workers/gnk-asg-direct-operator/src/digital-workforce-suite-v1.js
          node --check apps/portal/assets/digital-workforce-suite-v1.js
          node --check apps/portal/assets/gnkc-stable-index-v1.js
          node scripts/test-digital-workforce-puls-design-contract.mjs
          node scripts/test-digital-workforce-continuity-contract.mjs
          node scripts/test-gnkc-stable-index-contract.mjs
          grep -Fq 'GNK DINAMO Ltd grupa' workers/gnk-asg-direct-operator/wrangler.workforce-staging.toml
          grep -Fq 'PRODUCTION_WRITE_ALLOWED = "false"' workers/gnk-asg-direct-operator/wrangler.workforce-staging.toml
          grep -Fq 'PUBLIC_PUBLISHING_ALLOWED = "false"' workers/gnk-asg-direct-operator/wrangler.workforce-staging.toml
          grep -Fq "GNK_DINAMO_WORKFORCE_STAGING_GATE_V9" "$gate"
          grep -Fq 'Operatorski token' "$gate"
          grep -Fq 'HttpOnly; Secure; SameSite=Strict' "$gate"
          grep -Fq 'html{color-scheme:dark;background:#000}' "$gate"
          grep -Fq 'border:1px solid rgba(215,181,91,.34)' "$gate"
          grep -Fq 'background:#d7b55b;color:#090909' "$gate"
          grep -Fq 'outline:3px solid #f2d27d' "$gate"
          grep -Fq 'class="error" role="alert"' "$gate"
          grep -Fq "headers.set('x-content-type-options','nosniff')" "$gate"
          grep -Fq "headers.set('x-frame-options','DENY')" "$gate"
          grep -Fq "headers.set('referrer-policy','no-referrer')" "$gate"
          grep -Fq "headers.set('permissions-policy','camera=(), microphone=(), geolocation=()')" "$gate"
          grep -Fq "headers.set('x-gnk-environment','private-workforce-staging')" "$gate"
          grep -Fq "headers.set('x-gnk-staging-gate',VERSION)" "$gate"
          grep -Fq "script-src 'self'" "$gate"
          grep -Fq "style-src 'self' 'unsafe-inline'" "$gate"
          grep -Fq "img-src 'self' data:" "$gate"
          grep -Fq "connect-src 'self'" "$gate"
          grep -Fq "function unauthorizedApi()" "$gate"
          grep -Fq "function sessionValid(value,env)" "$gate"
          grep -Fq "const session=await sha256(token)" "$gate"
          grep -Fq "error:'STAGING_AUTH_REQUIRED'" "$gate"
          grep -Fq "'www-authenticate':'Bearer realm=\"GNK DINAMO Workforce staging\"'" "$gate"
          ! grep -Fqi 'encodeURIComponent(token)' "$gate"
          ! grep -Eqi '#06b6d4|#67e8f9|#8b5cf6|#0b3344|#07111f|#030712' "$gate"

      - name: Resolve shared operator token hash
        id: auth
        env:
          TOKEN: ${{ secrets.GNK_ASG_OPERATOR_TOKEN }}
          TOKEN_FALLBACK: ${{ secrets.OPERATOR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          value="$TOKEN"
          [ -n "$value" ] || value="$TOKEN_FALLBACK"
          [ -n "$value" ] || { echo '::error::Missing operator token'; exit 1; }
          echo "hash=$(printf '%s' "$value" | sha256sum | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "token=$value" >> "$GITHUB_OUTPUT"

      - name: Install direct operator dependencies
        working-directory: workers/gnk-asg-direct-operator
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Deploy isolated workers.dev staging
        id: deploy
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.workforce-staging.toml --name gnk-dinamo-workforce-staging --var "STAGING_TOKEN_SHA256:${{ steps.auth.outputs.hash }}" 2>&1 | tee staging-deploy.log
          url=$(grep -Eo 'https://[a-zA-Z0-9._-]+\.workers\.dev' staging-deploy.log | tail -1 || true)
          [ -n "$url" ] || { echo '::error::Staging URL was not found in Wrangler output'; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify browser login and bearer access
        env:
          URL: ${{ steps.deploy.outputs.url }}
          TOKEN: ${{ steps.auth.outputs.token }}
          TOKEN_HASH: ${{ steps.auth.outputs.hash }}
        shell: bash
        run: |
          set -euo pipefail
          login=$(curl -sS -D staging-login.headers -o staging-login.html -w '%{http_code}' "$URL/digital-workforce/")
          [ "$login" = '200' ] || { echo "::error::Expected login page 200, got $login"; exit 1; }
          grep -Fq 'PRIVATNI STAGING' staging-login.html
          grep -Fq 'Operatorski token' staging-login.html
          grep -Fq 'background:#000' staging-login.html
          grep -Fq '#d7b55b' staging-login.html
          grep -Fq '#f2d27d' staging-login.html
          ! grep -Eqi '#06b6d4|#67e8f9|#8b5cf6|#0b3344|#07111f|#030712' staging-login.html
          grep -Fqi 'x-gnk-environment: private-workforce-staging' staging-login.headers
          grep -Fqi 'x-gnk-staging-gate: GNK_DINAMO_WORKFORCE_STAGING_GATE_V9' staging-login.headers
          unauth_api=$(curl -sS -D staging-unauth-api.headers -o staging-unauth-api.json -w '%{http_code}' "$URL/api/public/digital-workforce/state")
          [ "$unauth_api" = '401' ] || { echo "::error::Expected unauthenticated API 401, got $unauth_api"; exit 1; }
          grep -Fq 'STAGING_AUTH_REQUIRED' staging-unauth-api.json
          grep -Fqi 'content-type: application/json' staging-unauth-api.headers
          grep -Fqi 'www-authenticate: Bearer realm="GNK DINAMO Workforce staging"' staging-unauth-api.headers
          grep -Fqi 'x-gnk-environment: private-workforce-staging' staging-unauth-api.headers
          grep -Fqi 'x-gnk-staging-gate: GNK_DINAMO_WORKFORCE_STAGING_GATE_V9' staging-unauth-api.headers
          curl -fsS -c staging-cookie.txt -o /dev/null -X POST --data-urlencode "token=$TOKEN" --data-urlencode 'next=/digital-workforce/' "$URL/_staging/login"
          ! grep -Fq "$TOKEN" staging-cookie.txt
          cookie_value=$(awk '$6=="gnk_workforce_staging"{print $7}' staging-cookie.txt | tail -1)
          [ "$cookie_value" = "$TOKEN_HASH" ] || { echo '::error::Staging cookie must contain only the token hash'; exit 1; }
          auth=$(curl -sS -b staging-cookie.txt -o staging-page.html -w '%{http_code}' "$URL/digital-workforce/")
          [ "$auth" = '200' ] || { echo "::error::Expected cookie-authenticated 200, got $auth"; exit 1; }
          grep -Fq 'Digitalna radna snaga' staging-page.html
          grep -Fq 'SIMULACIJA' staging-page.html
          bearer=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$URL/digital-workforce/")
          [ "$bearer" = '200' ] || { echo "::error::Expected bearer-authenticated 200, got $bearer"; exit 1; }
          headers=$(curl -sSI -b staging-cookie.txt "$URL/digital-workforce/")
          printf '%s' "$headers" | grep -Fqi 'x-robots-tag: noindex'
          printf '%s' "$headers" | grep -Fqi 'x-gnk-environment: private-workforce-staging'
          printf '%s' "$headers" | grep -Fqi 'x-gnk-staging-gate: GNK_DINAMO_WORKFORCE_STAGING_GATE_V9'
          printf '%s' "$headers" | grep -Fqi 'x-content-type-options: nosniff'
          printf '%s' "$headers" | grep -Fqi 'x-frame-options: DENY'
          printf '%s' "$headers" | grep -Fqi 'referrer-policy: no-referrer'
          printf '%s' "$headers" | grep -Fqi 'permissions-policy: camera=(), microphone=(), geolocation=()'
          printf '%s' "$headers" | grep -Fqi "content-security-policy: default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'"

      - name: Verify every tab API and write lock
        env:
          URL: ${{ steps.deploy.outputs.url }}
          TOKEN: ${{ steps.auth.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          endpoints=(state plan bulletins projects risks opinions dependencies tasks credits newsroom workers log)
          for endpoint in "${endpoints[@]}"; do
            file="staging-${endpoint}.json"
            code=$(curl -sS -o "$file" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$URL/api/public/digital-workforce/$endpoint")
            [ "$code" = '200' ] || { echo "::error::Expected $endpoint API 200, got $code"; exit 1; }
            ENDPOINT="$endpoint" FILE="$file" node - <<'NODE'
          const fs=require('fs');
          const endpoint=process.env.ENDPOINT;
          const file=process.env.FILE;
          const payload=JSON.parse(fs.readFileSync(file,'utf8'));
          if(!payload || typeof payload!=='object' || Array.isArray(payload))throw new Error(`${endpoint}: payload must be an object`);
          if(endpoint!=='state' && !Array.isArray(payload.items))throw new Error(`${endpoint}: items must be an array`);
          NODE
          done
          curl -fsS -H "Authorization: Bearer $TOKEN" "$URL/api/public/digital-workforce/workers?q=a&project=" > staging-workers-filtered.json
          node -e "const p=require('./staging-workers-filtered.json'); if(!p||!Array.isArray(p.items)) throw new Error('filtered workers payload invalid');"
          curl -fsS -H "Authorization: Bearer $TOKEN" "$URL/data/market-pulse.json" > staging-market.json
          node -e "JSON.parse(require('fs').readFileSync('staging-market.json','utf8'));"
          write=$(curl -sS -o staging-write.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' --data '{}' "$URL/api/public/digital-workforce/state")
          [ "$write" = '405' ] || { echo "::error::Expected staging write lock 405, got $write"; exit 1; }
          grep -Fq 'STAGING_WRITE_BLOCKED' staging-write.json

      - name: Publish staging verification summary
        shell: bash
        run: |
          cat > staging-verification.md <<EOF
          # Private Workforce Staging
          - URL: ${{ steps.deploy.outputs.url }}
          - Source SHA: $GITHUB_SHA
          - Source ref: $GITHUB_REF
          - Approved branch lock: verified
          - Browser login: same operator token verified
          - Session cookie: hashed identifier only; raw operator token absent
          - Staging identity headers: verified on login, unauthenticated API and authenticated portal
          - Unauthenticated API access: explicit 401 JSON with Bearer challenge verified
          - Login visual contract: pure black, black glass, gold and white verified
          - Authenticated portal: 200 verified
          - Bearer API access: verified
          - Robots: noindex/nofollow verified
          - Security headers: nosniff, frame deny, no-referrer, restricted permissions and asset-compatible CSP verified
          - All 11 tab APIs plus state: verified
          - Filtered Worker API: verified
          - Market data: verified
          - Production writes: blocked (405)
          - Mail and public publishing: disabled
          EOF
          cat staging-verification.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-workforce-staging-${{ github.sha }}
          path: |
            workers/gnk-asg-direct-operator/staging-deploy.log
            staging-verification.md
            staging-login.headers
            staging-login.html
            staging-page.html
            staging-cookie.txt
            staging-unauth-api.headers
            staging-*.json
          if-no-files-found: warn
          retention-days: 14
