name: Deploy Mobile App V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-mobile-app-v2.yml'
      - 'apps/portal/app/**'
      - 'apps/portal/operator-mobile/**'
      - 'apps/portal/assets/mobile-app-v2.css'
      - 'apps/portal/assets/mobile-app-v2.js'
      - 'apps/portal/app.webmanifest'
      - 'apps/portal/app-sw.js'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-mobile-app-v2.yml'
      - 'apps/portal/app/**'
      - 'apps/portal/operator-mobile/**'
      - 'apps/portal/assets/mobile-app-v2.css'
      - 'apps/portal/assets/mobile-app-v2.js'
      - 'apps/portal/app.webmanifest'
      - 'apps/portal/app-sw.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnk-asg-mobile-app-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate mobile app V2
        shell: bash
        run: |
          set -euxo pipefail
          node --check apps/portal/assets/mobile-app-v2.js
          node --check apps/portal/app-sw.js
          node -e "JSON.parse(require('fs').readFileSync('apps/portal/app.webmanifest','utf8'))"
          test -s apps/portal/assets/mobile-app-v2.css
          grep -q 'Jedna aplikacija' apps/portal/app/index.html
          grep -q 'data-mode="standard"' apps/portal/app/index.html
          grep -q 'data-mode="admin"' apps/portal/app/index.html
          grep -q '/api/operator-auth-check' apps/portal/assets/mobile-app-v2.js
          grep -q '/admin-center/?module=memorandum' apps/portal/assets/mobile-app-v2.js
          grep -q '/app/?mode=admin' apps/portal/operator-mobile/index.html
          grep -q "'/api/'" apps/portal/app-sw.js
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator
      - name: Deploy Cloudflare Worker
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator
      - name: Verify mobile app V2
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 18); do
            APP=$(curl -fsS "https://gnk-asg.hr/app/?cb=${GITHUB_RUN_ID}-${n}" || true)
            CSS=$(curl -fsS "https://gnk-asg.hr/assets/mobile-app-v2.css?cb=${GITHUB_RUN_ID}-${n}" || true)
            JS=$(curl -fsS "https://gnk-asg.hr/assets/mobile-app-v2.js?cb=${GITHUB_RUN_ID}-${n}" || true)
            MANIFEST=$(curl -fsS "https://gnk-asg.hr/app.webmanifest?cb=${GITHUB_RUN_ID}-${n}" || true)
            SW=$(curl -fsS "https://gnk-asg.hr/app-sw.js?cb=${GITHUB_RUN_ID}-${n}" || true)
            MOBILE=$(curl -fsS "https://gnk-asg.hr/operator-mobile/?cb=${GITHUB_RUN_ID}-${n}" || true)
            if printf '%s' "$APP" | grep -q 'mobile-app-v2.css' \
              && printf '%s' "$APP" | grep -q 'Standard' \
              && printf '%s' "$APP" | grep -q 'Admin' \
              && printf '%s' "$CSS" | grep -q 'GNK ASG Mobile App V2' \
              && printf '%s' "$JS" | grep -q '/api/operator-auth-check' \
              && printf '%s' "$MANIFEST" | grep -q 'Standard & Admin' \
              && printf '%s' "$SW" | grep -q 'gnk-asg-mobile-v2-20260627' \
              && printf '%s' "$MOBILE" | grep -q '/app/?mode=admin'; then
                exit 0
            fi
            sleep 10
          done
          exit 1
