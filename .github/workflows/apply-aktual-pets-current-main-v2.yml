name: Apply Aktual Pets Current Main V2
on:
  push:
    branches: [agent/aktual-pets-current-main-v2-20260807]
    paths: [.github/workflows/apply-aktual-pets-current-main-v2.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aktual-pets-current-main-v2-20260807
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch pets feeds into current news engine
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='scripts/gnk-news-refresh.mjs';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace(
            "// Grupe moraju odgovarati onima koje stranica /gnk-aktual/ poznaje:\n// economy | technology | digital-assets | international | hrvatska",
            "// Grupe moraju odgovarati onima koje stranica /gnk-aktual/ poznaje.\n// Glavne grupe ukljucuju economy, technology, digital-assets, international,\n// hrvatska, regije i tematske rubrike poput ljubimci."
          );
          const needle="  { source: 'European Commission', group: 'international', category: 'world', url: 'https://ec.europa.eu/commission/presscorner/api/rss?language=en' },\n\n  // --- Hrvatska";
          const insert="  { source: 'European Commission', group: 'international', category: 'world', url: 'https://ec.europa.eu/commission/presscorner/api/rss?language=en' },\n\n  // --- Kucni ljubimci --------------------------------------------------\n  // Prikazuje se samo naslov, slika/izvorni media URL kada ga RSS daje,\n  // kratak izvod i poveznica na izvornog izdavaca; puni tekst se ne pohranjuje.\n  { source: 'The Guardian Pets', group: 'ljubimci', category: 'pets', url: 'https://www.theguardian.com/lifeandstyle/pets/rss' },\n  { source: 'Dogster', group: 'ljubimci', category: 'dogs', url: 'https://www.dogster.com/feed' },\n  { source: 'Catster', group: 'ljubimci', category: 'cats', url: 'https://www.catster.com/feed' },\n\n  // --- Hrvatska";
          if(!s.includes(needle)) throw new Error('expected insertion point missing');
          s=s.replace(needle,insert);
          fs.writeFileSync(p,s);
          NODE
      - name: Validate pets contract
        run: node scripts/test-aktual-pets-sources-v1.mjs
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/apply-aktual-pets-current-main-v2.yml
          git config user.name 'gnk-asg-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/gnk-news-refresh.mjs scripts/test-aktual-pets-sources-v1.mjs .github/workflows/apply-aktual-pets-current-main-v2.yml
          git commit -m 'feat(aktual): add pets feeds on current main [skip ci]'
          git push origin HEAD:agent/aktual-pets-current-main-v2-20260807
