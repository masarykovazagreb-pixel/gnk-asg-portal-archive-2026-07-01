name: Deploy Portal Final V12

on:
  workflow_run:
    workflows: ["Production Index and Content Automation"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnk-asg-portal-final-v12
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate final wrapper
        working-directory: workers/gnk-asg-direct-operator
        run: |
          node --check src/index-portal-final-v12.js
          npx --yes wrangler@4 deploy src/index-portal-final-v12.js --dry-run --config wrangler.toml
      - name: Deploy final wrapper
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy src/index-portal-final-v12.js --config wrangler.toml --name gnk-asg-direct-operator
      - name: Verify final production routes
        shell: bash
        run: |
          sleep 15
          base="https://gnk-asg.hr"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$base/?cb=$(date +%s)")" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$base/en/?cb=$(date +%s)")" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$base/status-automatizacije/?cb=$(date +%s)")" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$base/data/index-media-config.json?cb=$(date +%s)")" = "200"
          admin_code="$(curl -sS -o admin.html -D admin.headers -w '%{http_code}' "$base/operator-dashboard/?cb=$(date +%s)")"
          test "$admin_code" != "404"
          grep -qi '^x-gnk-asg-portal-final: GNK_ASG_PORTAL_FINAL_V12_20260625' admin.headers
          ! grep -q 'window.GNK_ASG_FORCE_OPERATOR_TOKEN = "' admin.html
          grep -q 'if(false)' admin.html
          echo "PORTAL_FINAL_V12_OK=true"
