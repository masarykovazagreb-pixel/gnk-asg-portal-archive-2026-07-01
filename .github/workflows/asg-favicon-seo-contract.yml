name: ASG Favicon and SEO Audit Contract
on:
  pull_request:
    paths:
      - 'scripts/audit-asg-favicon-seo-v1.mjs'
      - 'tests/test-asg-favicon-seo-audit-v1.mjs'
      - '.github/workflows/asg-favicon-seo-contract.yml'
permissions:
  contents: read
jobs:
  audit-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check syntax
        run: |
          node --check scripts/audit-asg-favicon-seo-v1.mjs
          node --check tests/test-asg-favicon-seo-audit-v1.mjs
      - name: Run offline SEO audit fixtures
        run: node tests/test-asg-favicon-seo-audit-v1.mjs
      - name: Verify checked-out source was not modified
        run: git diff --exit-code
