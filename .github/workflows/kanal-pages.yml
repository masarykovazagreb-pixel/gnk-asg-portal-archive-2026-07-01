name: kanal-pages

# Objavljuje GNK ASG KANAL (apps/kanal) na GitHub Pages.
# Ne dira portal gnk-asg.hr ni Cloudflare deploy. Trigger samo za apps/kanal/**.

on:
  push:
    branches: [main]
    paths:
      - 'apps/kanal/**'
      - '.github/workflows/kanal-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kanal-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build kanal
        env:
          KANAL_BASE: ${{ vars.KANAL_BASE || 'https://masarykovazagreb-pixel.github.io/gnk-asg-kanal/' }}
        run: node apps/kanal/build.mjs --base "$KANAL_BASE"
      - name: Sanity check output
        run: |
          test -f apps/kanal/site/index.html
          test -f apps/kanal/site/feed.json
          test -f apps/kanal/site/sitemap.xml
          grep -q '<meta name="description"' apps/kanal/site/index.html
          grep -q 'application/ld+json' apps/kanal/site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/kanal/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
