name: Fix Floating Home Page Routes V16

on:
  push:
    branches: [main]
    paths:
      - ".github/fix-floating-home-page-routes-v16.trigger"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Assign public page routes to final Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('fs');
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const headers={Authorization:`Bearer ${token}`,'Content-Type':'application/json'};
          const targetScript='gnk-asg-direct-operator';
          const desired=[
            'gnk-asg.hr/news','gnk-asg.hr/news/*',
            'gnk-asg.hr/vijesti','gnk-asg.hr/vijesti/*',
            'gnk-asg.hr/app','gnk-asg.hr/app/*',
            'www.gnk-asg.hr/news','www.gnk-asg.hr/news/*',
            'www.gnk-asg.hr/vijesti','www.gnk-asg.hr/vijesti/*',
            'www.gnk-asg.hr/app','www.gnk-asg.hr/app/*'
          ];
          async function call(url,options={}){
            const response=await fetch(url,{...options,headers:{...headers,...(options.headers||{})}});
            const data=await response.json();
            if(!response.ok||data.success===false)throw new Error(`${response.status} ${JSON.stringify(data.errors||data)}`);
            return data;
          }
          (async()=>{
            const zones=await call('https://api.cloudflare.com/client/v4/zones?name=gnk-asg.hr&status=active');
            const zoneId=zones.result?.[0]?.id;
            if(!zoneId)throw new Error('zone_not_found');
            const current=await call(`https://api.cloudflare.com/client/v4/zones/${zoneId}/workers/routes`);
            const actions=[];
            for(const pattern of desired){
              const existing=(current.result||[]).find(route=>route.pattern===pattern);
              if(existing){
                if(existing.script===targetScript){
                  actions.push({pattern,action:'unchanged',script:targetScript});
                }else{
                  await call(`https://api.cloudflare.com/client/v4/zones/${zoneId}/workers/routes/${existing.id}`,{
                    method:'PUT',body:JSON.stringify({pattern,script:targetScript})
                  });
                  actions.push({pattern,action:'updated',from:existing.script||null,to:targetScript});
                }
              }else{
                await call(`https://api.cloudflare.com/client/v4/zones/${zoneId}/workers/routes`,{
                  method:'POST',body:JSON.stringify({pattern,script:targetScript})
                });
                actions.push({pattern,action:'created',script:targetScript});
              }
            }
            fs.writeFileSync('route-fix.json',JSON.stringify({checkedAt:new Date().toISOString(),ok:true,targetScript,actions},null,2));
          })().catch(error=>{
            fs.writeFileSync('route-fix.json',JSON.stringify({checkedAt:new Date().toISOString(),ok:false,error:error.message},null,2));
            process.exitCode=1;
          });
          JS
          body=$(printf 'V16 popravak vlasništva javnih ruta.\n\n```json\n%s\n```\n' "$(cat route-fix.json)")
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/67" -f body="$body"
