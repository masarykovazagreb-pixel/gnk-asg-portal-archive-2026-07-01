name: Public Status Snapshot Maintenance

on:
  pull_request:
    paths:
      - 'scripts/public-status-snapshot-v1.mjs'
      - 'apps/portal/data/public_service_status.json'
      - 'apps/portal/data/public_service_status_history.json'
      - 'apps/portal/tests/public-status-center.test.mjs'
      - '.github/workflows/public-status-snapshot-maintenance-v1.yml'
  workflow_dispatch:
  schedule:
    # Twice daily UTC, including weekends; avoid declaring external uptime.
    - cron: '10 7,18 * * *'

permissions:
  contents: write

concurrency:
  group: public-status-snapshot-maintenance
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate public status from actual repository files
        run: |
          node scripts/public-status-snapshot-v1.mjs
          node scripts/public-status-snapshot-v1.mjs --check
          node --test apps/portal/tests/public-status-center.test.mjs
      - name: Emit sanitized PR snapshot for review only
        if: github.event_name == 'pull_request'
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            for (const [key, file] of [
              ['SNAPSHOT_JSON', 'apps/portal/data/public_service_status.json'],
              ['HISTORY_JSON', 'apps/portal/data/public_service_status_history.json']
            ]) {
              console.log(key + '=' + JSON.stringify(JSON.parse(readFileSync(file, 'utf8'))));
            }
          "
      - name: Commit refreshed evidence on main when scheduled or manually triggered
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/portal/data/public_service_status.json apps/portal/data/public_service_status_history.json
          if git diff --cached --quiet; then
            echo 'No changes to status snapshot.'
            exit 0
          fi
          git commit -m 'chore(status): refresh repository-snapshot evidence'
          if git push origin HEAD:main; then
            echo 'Public status snapshot refreshed on main.'
            exit 0
          fi
          branch="automation/public-status-${GITHUB_RUN_ID}"
          if git push origin "HEAD:refs/heads/$branch"; then
            echo "::warning::Main push unavailable; refreshed evidence is reviewable but NOT deployed."
            echo "Review: https://github.com/${GITHUB_REPOSITORY}/compare/main...$branch?expand=1" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Status snapshot could not be published or staged on a review branch."
          fi
          exit 1
