name: Portal Stability Production

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "workers/gnk-asg-direct-operator/src/index-portal-stability-v6.js"
      - "workers/gnk-asg-direct-operator/wrangler.portal-public-stability.toml"
      - "apps/portal/assets/public-content-shell-v1.css"
      - "apps/portal/assets/public-content-shell-v1.js"
      - "apps/portal/en/assistant/index.html"
      - ".github/workflows/portal-stability-production.yml"
  push:
    branches: [main]
    paths:
      - "workers/gnk-asg-direct-operator/src/index-portal-stability-v6.js"
      - "workers/gnk-asg-direct-operator/wrangler.portal-public-stability.toml"
      - "apps/portal/assets/public-content-shell-v1.css"
      - "apps/portal/assets/public-content-shell-v1.js"
      - "apps/portal/en/assistant/index.html"
      - ".github/workflows/portal-stability-production.yml"

concurrency:
  group: gnk-asg-portal-stability-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enforce protected scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" || true)
          fi
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -Eq '^apps/portal/(index\.html|en/index\.html|assets/index-|assets/index-redesign|assets/index-iq200|assets/visual-quality)'; then
            echo "Index visual files are outside this change scope."
            exit 1
          fi
          if printf '%s\n' "$files" | grep -Eq '(^|/)(mail-studio|mail-studio-pro|index-mail|email-worker|contact-api)(/|\.|$)'; then
            echo "Mail and contact delivery files are outside this change scope."
            exit 1
          fi

      - name: Validate JavaScript and public assets
        shell: bash
        run: |
          set -euo pipefail
          node --check workers/gnk-asg-direct-operator/src/index-portal-stability-v6.js
          node --check apps/portal/assets/public-content-shell-v1.js
          test -s apps/portal/assets/public-content-shell-v1.css
          test -s apps/portal/en/assistant/index.html
          grep -q 'GNK_ASG_PORTAL_STABILITY_V6_20260625' workers/gnk-asg-direct-operator/src/index-portal-stability-v6.js
          grep -q 'quality_gate_failed' workers/gnk-asg-direct-operator/src/index-portal-stability-v6.js
          grep -q 'auto-editor:quarantine' workers/gnk-asg-direct-operator/src/index-portal-stability-v6.js
          grep -q 'fewer_than_two_valid_sources' workers/gnk-asg-direct-operator/src/index-portal-stability-v6.js
          grep -q 'hr_body_below_500_words' workers/gnk-asg-direct-operator/src/index-portal-stability-v6.js
          grep -q 'www.gnk-asg.hr' workers/gnk-asg-direct-operator/src/index-portal-stability-v6.js
          grep -q '<html lang="en">' apps/portal/en/assistant/index.html
          grep -q 'public-content-shell-v1.css' apps/portal/en/assistant/index.html

      - name: Validate isolated routing
        shell: bash
        run: |
          set -euo pipefail
          cfg=workers/gnk-asg-direct-operator/wrangler.portal-public-stability.toml
          grep -q 'name = "gnk-asg-portal-stability"' "$cfg"
          grep -q 'gnk-asg.hr/objave' "$cfg"
          grep -q 'gnk-asg.hr/data/market.json' "$cfg"
          grep -q 'www.gnk-asg.hr/\*' "$cfg"
          ! grep -q 'pattern = "gnk-asg.hr/\*"' "$cfg"
          ! grep -q '\[\[send_email\]\]' "$cfg"
          ! grep -q '\[triggers\]' "$cfg"

      - name: Build private runtime without changing source mail files
        shell: bash
        run: |
          set -euo pipefail
          src=workers/gnk-asg-direct-operator/src/index-portal-stability-v6.js
          runtime=workers/gnk-asg-direct-operator/src/index-portal-stability-runtime.js
          sed "s#'./index-publication-news-hotfix.js'#'./index-ui-harmonizer.js'#" "$src" > "$runtime"
          node --check "$runtime"
          head -n 1 "$runtime" | grep -q 'index-ui-harmonizer.js'

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Record untouched index fingerprints
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://gnk-asg.hr/ > /tmp/index-before.html
          curl --fail --silent --show-error --location https://gnk-asg.hr/en/ > /tmp/index-en-before.html
          sha256sum /tmp/index-before.html | awk '{print $1}' > /tmp/index-before.sha
          sha256sum /tmp/index-en-before.html | awk '{print $1}' > /tmp/index-en-before.sha

      - name: Deploy isolated public stability worker
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.portal-public-stability.toml --keep-vars

      - name: Build and deploy private quality runtime
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          sed "s#'./index-publication-news-hotfix.js'#'./index-ui-harmonizer.js'#" src/index-portal-stability-v6.js > src/index-portal-stability-runtime.js
          node --check src/index-portal-stability-runtime.js
          npx --yes wrangler@4 deploy src/index-portal-stability-runtime.js --config wrangler.dark-market.toml --name gnk-asg-direct-operator --keep-vars

      - name: Verify public routes and stable data
        shell: bash
        run: |
          set -euo pipefail
          sleep 18
          for path in objave publications vijesti news trzista markets assistant en/assistant status-automatizacije automation-status; do
            code=$(curl --silent --show-error --location --output "/tmp/${path//\//-}.html" --write-out '%{http_code}' "https://gnk-asg.hr/$path/?cb=${{ github.run_id }}")
            echo "$path HTTP=$code"
            test "$code" = "200"
          done
          for path in data/news.json data/market.json data/digital-assets.json data/market-indices.json data/exchanges.json data/stablecoins.json data/daily-market-brief.json data/status.json; do
            curl --fail --silent --show-error --location "https://gnk-asg.hr/$path?cb=${{ github.run_id }}" | python -m json.tool > /dev/null
          done
          curl --fail --silent --show-error --location "https://gnk-asg.hr/sitemap.xml?cb=${{ github.run_id }}" | grep -q '<urlset'
          curl --fail --silent --show-error --location "https://gnk-asg.hr/sitemap-objave.xml?cb=${{ github.run_id }}" | grep -q '<urlset'
          curl --fail --silent --show-error --location "https://gnk-asg.hr/image-sitemap-objave.xml?cb=${{ github.run_id }}" | grep -q '<urlset'
          curl --silent --show-error --head https://www.gnk-asg.hr/ | grep -Eqi '^location: https://gnk-asg.hr/'
          grep -q 'public-content-shell-v1.css' /tmp/objave.html
          grep -q 'GNK ASG' /tmp/en-assistant.html

      - name: Verify protected administration without mail actions
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --output /tmp/admin.html --write-out '%{http_code}' "https://gnk-asg.hr/operator-dashboard/?cb=${{ github.run_id }}")
          test "$code" = "401" -o "$code" = "200"
          grep -Eq 'Zaštićeni administratorski pristup|Sigurna administratorska prijava|GNK ASG' /tmp/admin.html

      - name: Confirm index HTML stayed unchanged
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://gnk-asg.hr/ > /tmp/index-after.html
          curl --fail --silent --show-error --location https://gnk-asg.hr/en/ > /tmp/index-en-after.html
          test "$(sha256sum /tmp/index-after.html | awk '{print $1}')" = "$(cat /tmp/index-before.sha)"
          test "$(sha256sum /tmp/index-en-after.html | awk '{print $1}')" = "$(cat /tmp/index-en-before.sha)"
          echo "INDEX_VISUAL_UNCHANGED=true"
