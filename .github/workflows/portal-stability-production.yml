name: Portal Stability Check

on:
  pull_request:
    branches: [main]
    paths:
      - "workers/gnk-asg-direct-operator/src/index-portal-stability-v6.js"
      - "workers/gnk-asg-direct-operator/wrangler.portal-public-stability.toml"
      - "apps/portal/assets/public-content-shell-v1.css"
      - "apps/portal/assets/public-content-shell-v1.js"
      - "apps/portal/en/assistant/index.html"
      - ".github/workflows/portal-stability-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enforce protected scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
            printf '%s\n' "$files"
            if printf '%s\n' "$files" | grep -Eq '^apps/portal/(index\.html|en/index\.html|assets/index-|assets/index-redesign|assets/index-iq200|assets/visual-quality)'; then
              exit 1
            fi
            if printf '%s\n' "$files" | grep -Eq '(^|/)(mail-studio|mail-studio-pro|index-mail|email-worker|contact-api)(/|\.|$)'; then
              exit 1
            fi
          fi
      - name: Validate JavaScript and public assets
        shell: bash
        run: |
          set -euo pipefail
          node --check workers/gnk-asg-direct-operator/src/index-portal-stability-v6.js
          node --check apps/portal/assets/public-content-shell-v1.js
          test -s apps/portal/assets/public-content-shell-v1.css
          test -s apps/portal/en/assistant/index.html
          grep -q 'GNK_ASG_PORTAL_STABILITY_V6_20260625' workers/gnk-asg-direct-operator/src/index-portal-stability-v6.js
          grep -q 'quality_gate_failed' workers/gnk-asg-direct-operator/src/index-portal-stability-v6.js
          grep -q 'auto-editor:quarantine' workers/gnk-asg-direct-operator/src/index-portal-stability-v6.js
          grep -q 'fewer_than_two_valid_sources' workers/gnk-asg-direct-operator/src/index-portal-stability-v6.js
          grep -q 'hr_body_below_500_words' workers/gnk-asg-direct-operator/src/index-portal-stability-v6.js
          grep -q '<html lang="en">' apps/portal/en/assistant/index.html
      - name: Validate isolated routing
        shell: bash
        run: |
          set -euo pipefail
          cfg=workers/gnk-asg-direct-operator/wrangler.portal-public-stability.toml
          grep -q 'name = "gnk-asg-portal-stability"' "$cfg"
          grep -q 'gnk-asg.hr/objave' "$cfg"
          grep -q 'gnk-asg.hr/data/market.json' "$cfg"
          grep -q 'www.gnk-asg.hr/\*' "$cfg"
          ! grep -q 'pattern = "gnk-asg.hr/\*"' "$cfg"
          ! grep -q '\[\[send_email\]\]' "$cfg"
          ! grep -q '\[triggers\]' "$cfg"
      - name: Verify private runtime composition
        shell: bash
        run: |
          set -euo pipefail
          src=workers/gnk-asg-direct-operator/src/index-portal-stability-v6.js
          runtime=/tmp/index-portal-stability-runtime.js
          sed "s#'./index-publication-news-hotfix.js'#'./index-ui-harmonizer.js'#" "$src" > "$runtime"
          node --check "$runtime"
          head -n 1 "$runtime" | grep -q 'index-ui-harmonizer.js'
