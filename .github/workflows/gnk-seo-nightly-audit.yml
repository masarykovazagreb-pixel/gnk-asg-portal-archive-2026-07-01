name: GNK ASG Nightly SEO, Meta, Backlink and IndexNow Audit

# Pokreće se svaku noć u 02:15 CET (01:15 UTC), i ručno po potrebi.
# 1. Provjerava meta/SEO stanje cijelog portala i sprema izvještaj.
# 2. Nastavlja Blogger backlink zaostatak.
# 3. Šalje sve stranice na IndexNow — trenutno obavještava Bing/Yandex/Seznam
#    o novim ili promijenjenim URL-ovima, bez čekanja standardnog crawla.

on:
  workflow_dispatch:
  schedule:
    - cron: '15 1 * * *'

permissions:
  contents: write

env:
  INDEXNOW_KEY: '2396905717b36885586139576d11142f'

jobs:
  seo-audit:
    name: Noćni SEO/meta audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pokreni SEO audit
        run: node scripts/gnk-seo-nightly-audit-v1.mjs
      - name: Objavi sažetak u summary
        if: always()
        run: |
          if [ -s apps/portal/data/seo-audit/nightly-report.json ]; then
            node -e "
              const r = require('./apps/portal/data/seo-audit/nightly-report.json');
              console.log('## Noćni SEO audit — ' + r.generatedAt);
              console.log('');
              console.log('Ukupno stranica: **' + r.ukupnoStranica + '**');
              console.log('');
              console.log('### Preporuke');
              for (const p of r.preporuke) console.log('- ' + p);
            " >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit izvještaj
        run: |
          git config user.name "gnk-seo-bot"
          git config user.email "it@gnk-asg.hr"
          git add apps/portal/data/seo-audit/nightly-report.json
          git diff --cached --quiet || git commit -m "chore: nightly SEO audit report"
          git pull --rebase --autostash origin main
          git push origin main

  backlink-blogger:
    name: Nastavi Blogger backlink zaostatak
    needs: seo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sync
        run: git pull --rebase --autostash origin main
      - name: Mirror na Blogger (backlink)
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOG_PER_RUN: '10'
          BLOG_PAUSE_MS: '15000'
          BLOG_MAX_ATTEMPTS: '2'
          BLOG_BACKOFF_MS: '60000'
        run: node scripts/blog-publish-resilient-v1.mjs
      - name: Commit
        run: |
          git config user.name "gnk-seo-bot"
          git config user.email "it@gnk-asg.hr"
          git add apps/portal/data/blog-content/
          git diff --cached --quiet || git commit -m "chore: nightly blogger backlink batch"
          git pull --rebase --autostash origin main
          git push origin main

  indexnow-submit:
    name: Pošalji sve URL-ove na IndexNow (Bing/Yandex trenutno indeksiranje)
    needs: seo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sync
        run: git pull --rebase --autostash origin main
      - name: Pošalji na IndexNow
        run: node scripts/gnk-indexnow-submit-v1.mjs
      - name: Ping Google i Bing sitemap
        run: |
          curl -s -o /dev/null -w "Google ping status: %{http_code}\n" "https://www.google.com/ping?sitemap=https://gnk-asg.hr/sitemap.xml"
          curl -s -o /dev/null -w "Bing ping status: %{http_code}\n" "https://www.bing.com/ping?sitemap=https://gnk-asg.hr/sitemap.xml"

  backlink-telegraph:
    name: Nastavi Telegraph backlink zaostatak
    needs: seo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sync
        run: git pull --rebase --autostash origin main
      - name: Objavi na Telegraph
        env:
          TELEGRAPH_PER_RUN: '5'
          TELEGRAPH_PAUSE_MS: '3000'
        run: node scripts/telegraph-publish-v1.mjs
      - name: Commit
        run: |
          git config user.name "gnk-seo-bot"
          git config user.email "it@gnk-asg.hr"
          git add apps/portal/data/telegraph-content/
          git diff --cached --quiet || git commit -m "chore: nightly telegraph backlink batch"
          git pull --rebase --autostash origin main
          git push origin main
