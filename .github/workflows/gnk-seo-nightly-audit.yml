name: GNK ASG Nightly SEO, Meta, Backlink and IndexNow Audit

# Nightly SEO/meta audit is read-only toward production main.
# External mirrors and search-engine notifications require separate per-run approval.

on:
  workflow_dispatch:
    inputs:
      notify_search_engines:
        description: 'Explicitly submit the current URL set to IndexNow for this run'
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '15 1 * * *'

permissions:
  contents: read

concurrency:
  group: gnk-seo-nightly-audit
  cancel-in-progress: true

jobs:
  seo-audit:
    name: Noćni SEO/meta audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pokreni SEO audit
        run: node scripts/gnk-seo-nightly-audit-v1.mjs
      - name: Objavi sažetak u summary
        if: always()
        run: |
          if [ -s apps/portal/data/seo-audit/nightly-report.json ]; then
            node -e "
              const r = require('./apps/portal/data/seo-audit/nightly-report.json');
              console.log('## Noćni SEO audit — ' + r.generatedAt);
              console.log('');
              console.log('Ukupno stranica: **' + r.ukupnoStranica + '**');
              console.log('');
              console.log('### Preporuke');
              for (const p of r.preporuke) console.log('- ' + p);
            " >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Spremi SEO izvještaj kao artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnk-seo-nightly-report-${{ github.run_id }}
          path: apps/portal/data/seo-audit/nightly-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Potvrdi da audit nije pomaknuo production main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if ! git diff --quiet -- . ':!apps/portal/data/seo-audit/nightly-report.json'; then
            echo "SEO audit je neočekivano promijenio datoteke izvan nightly-report.json."
            git status --short
            exit 1
          fi
          echo "Nightly SEO audit is read-only; report remains runner-local and is uploaded as evidence."

  indexnow-submit:
    name: Manually submit URLs to IndexNow after explicit approval
    if: github.event_name == 'workflow_dispatch' && inputs.notify_search_engines == true
    needs: seo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INDEXNOW_KEY: '2396905717b36885586139576d11142f'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pošalji na IndexNow
        run: node scripts/gnk-indexnow-submit-v1.mjs
