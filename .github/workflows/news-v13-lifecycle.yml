name: GNK ASG News V13 Lifecycle

on:
  workflow_dispatch:
  schedule:
    # Europe/Zagreb summer-time cadence: 09:00, 16:00, 21:00 local.
    # The script/status layer records the canonical local cadence.
    - cron: '0 7,14,19 * * *'
  push:
    paths:
      - '.github/workflows/news-v13-lifecycle.yml'
      - 'apps/portal/scripts/news_publication.py'
      - 'apps/portal/scripts/news_v13_lifecycle.py'
      - 'apps/portal/data/news_config_v2.json'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

concurrency:
  group: gnk-asg-news-v13-lifecycle
  cancel-in-progress: false

jobs:
  refresh-news:
    name: Refresh public news feed
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh GNK ASG news data
        run: python3 scripts/news_publication.py

      - name: Validate generated news files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = Path('data')
          news = json.loads((data / 'news.json').read_text(encoding='utf-8'))
          status = json.loads((data / 'news-automation-status.json').read_text(encoding='utf-8'))
          archive = json.loads((data / 'news_archive.json').read_text(encoding='utf-8')) if (data / 'news_archive.json').exists() else []
          assert isinstance(news, list) and news, 'news.json must contain at least one item'
          assert len(news) <= 100, 'public feed must expose at most 100 items'
          assert isinstance(archive, list) and len(archive) <= 1000, 'archive must stay within 1000 items'
          assert status.get('scheduled_hours_local') == [9, 16, 21], 'scheduled local hours must stay 09/16/21'
          assert status.get('max_public_items') == 100, 'public limit must stay 100'
          assert status.get('archive_prune_to') == 500, 'archive prune target must stay 500'
          assert status.get('rss_images_enabled') is True, 'RSS images must remain enabled'
          assert status.get('fallback_image') == '/assets/news-fallback.svg', 'fallback image must remain configured'
          print({'public_items': len(news), 'archive_items': len(archive), 'ok': status.get('ok'), 'updated_at': status.get('updated_at')})
          PY

      - name: Commit refreshed public news data
        run: |
          git config user.name "GNK ASG News Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/news_archive.json data/news-automation-status.json data/update_status.json
          if git diff --cached --quiet; then
            echo "No news data changes to commit."
            exit 0
          fi
          git commit -m "chore(news): refresh GNK ASG public news feed"
          git push
