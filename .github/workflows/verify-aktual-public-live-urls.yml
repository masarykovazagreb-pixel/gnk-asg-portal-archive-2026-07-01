name: Verify AKTUAL Public Live URLs

on:
  pull_request:
    paths:
      - '.github/workflows/verify-aktual-public-live-urls.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-url-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify exact public article, gallery and weekly URLs
        shell: bash
        run: |
          set -euo pipefail
          echo "Independent public-route verification at $(date -u +%FT%TZ)"
          while IFS='|' read -r path marker; do
            [ -n "$path" ] || continue
            url="https://gnk-asg.hr$path"
            output="$(mktemp)"
            code="$(curl --silent --show-error --retry 3 --retry-delay 1 --max-time 35 -A 'GNK-ASG-AKTUAL-Live-Check/1.0' -o "$output" -w '%{http_code}' "$url")"
            printf '%s -> HTTP %s\n' "$url" "$code"
            test "$code" = 200 || { echo "::error::Expected HTTP 200 for $url"; exit 1; }
            grep -Fq "$marker" "$output" || { echo "::error::Expected public marker missing on $url"; exit 1; }
            rm -f "$output"
          done <<'ROUTES'
          /komentari/roto-dinamic-apfel-prijava-nije-odobrenje/|Roto Dinamic i Apfel
          /galerija/roto-apfel-logistika-koncept/|Originalna
          /assets/editorial/roto-apfel-logistics-concept-20261019.svg|<svg
          /visual-index/roto-apfel-logistika-koncept/|Logistika
          /en/visual-index/roto-apfel-logistika-koncept/|Logistics
          /gnk-aktual/tjedni/2026-10-19/|AKTUAL
          /en/gnk-aktual/weekly/2026-10-19/|AKTUAL
          /gnk-aktual/|roto-dinamic-apfel-prijava-nije-odobrenje
          /komentari/|roto-dinamic-apfel-prijava-nije-odobrenje
          ROUTES
          echo 'Verified all requested public editorial routes with HTTP 200 and route-specific markers.'
