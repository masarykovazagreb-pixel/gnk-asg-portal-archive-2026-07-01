name: REGION Zagreb Preview Hub Gate

on:
  pull_request:
    paths:
      - 'scripts/check-hub-counts-v1.mjs'
      - 'tests/test-hub-counts-v1.mjs'
      - '.github/workflows/region-zagreb-preview-gate-v1.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/check-hub-counts-v1.mjs'
      - 'tests/test-hub-counts-v1.mjs'

permissions:
  contents: read

jobs:
  preview-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validator syntax and regression coverage
        run: |
          node --check scripts/check-hub-counts-v1.mjs
          node --test tests/test-hub-counts-v1.mjs
      - name: Validate checked-in HR/EN hub against real network counts
        run: node scripts/check-hub-counts-v1.mjs
