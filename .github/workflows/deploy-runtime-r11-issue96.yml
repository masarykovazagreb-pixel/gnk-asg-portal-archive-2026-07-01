name: Deploy runtime R11 via issue 96

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: gnk-asg-canonical-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.issue.number == 96 && github.event.comment.body == '/deploy-runtime-r11-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify package
        working-directory: workers/gnk-asg-direct-operator
        run: |
          set -euxo pipefail
          node --check src/index-admin-hub-v21.js
          node --check src/index-unified-auth-v15.js
          node --check src/index-article-automation-v2.js
          node --check src/media-outreach-delivery-v5.js
          grep -q 'GNK_ASG_ADMIN_HUB_V21_20260626_R11_RUNTIME_CONTRACTS' src/index-admin-hub-v21.js
          grep -q 'MEDIA_OUTREACH_LIVE = "false"' wrangler.toml
          grep -q 'MEDIA_OUTREACH_TEST_LIVE = "false"' wrangler.toml
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator
      - name: Deploy current main
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator
      - name: Verify live R11
        run: |
          set -euo pipefail
          sleep 45
          base='https://gnk-asg.hr'; cb=$(date +%s)
          curl -sS "$base/data/deployment-status.json?cb=$cb" -o /tmp/r11-status.json
          curl -sS -D /tmp/r11-root.headers "$base/?cb=$cb" -o /tmp/r11-root.html
          node <<'JS'
          const fs=require('node:fs');
          const status=JSON.parse(fs.readFileSync('/tmp/r11-status.json','utf8'));
          const html=fs.readFileSync('/tmp/r11-root.html','utf8');
          const headers=fs.readFileSync('/tmp/r11-root.headers','utf8');
          const failures=[];
          if(status.adminHub!=='GNK_ASG_ADMIN_HUB_V21_20260626_R11_RUNTIME_CONTRACTS')failures.push(`adminHub=${status.adminHub}`);
          if(status.marketChartCompatibility!=='GNK_ASG_MARKET_CHART_V3_BLOCK_V1_20260626')failures.push(`marketCompat=${status.marketChartCompatibility}`);
          if(status.newsRuntime!=='GNK_ASG_NEWS_RUNTIME_CONTRACT_V1_20260626')failures.push(`newsRuntime=${status.newsRuntime}`);
          if(status.testSending!=='LOCKED'||status.productionSending!=='LOCKED')failures.push('mail_not_locked');
          if(!headers.toLowerCase().includes('x-gnk-asg-index-hydration: gnk_asg_index_server_hydration_v1_20260626'.toLowerCase()))failures.push('hydration_header_missing');
          if(!html.includes('gnk-market-v3-final-guard'))failures.push('market_guard_missing');
          if(/index-live-market-chart-v3\.js/i.test(html))failures.push('v3_script_present');
          if(!html.includes('index-live-market-chart-v4.js'))failures.push('v4_script_missing');
          const report={ok:failures.length===0,checkedAt:new Date().toISOString(),failures,status};
          fs.writeFileSync('/tmp/r11-report.json',JSON.stringify(report,null,2));
          if(failures.length)process.exit(1);
          JS
      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
        run: |
          report=$(cat /tmp/r11-report.json 2>/dev/null || printf '{"error":"verification_not_reached"}')
          gh issue comment 96 --body "Runtime R11 deploy **${JOB_STATUS}** · commit \`${RUN_SHA}\` · ${RUN_URL}\n\n\`\`\`json\n${report}\n\`\`\`"
