name: AKTUAL MEDIA - Fast Publish v1

# One editorial decision; deterministic, auditable publisher and protected Cloudflare deploy.
# Manual-only. Does not spend recurring Actions minutes or auto-approve claims.
on:
  workflow_dispatch:
    inputs:
      headline:
        description: 'Naslov originalnog teksta (18-145 znakova)'
        required: true
        type: string
      slug:
        description: 'URL slug: mala slova i crtice'
        required: true
        type: string
      body_text:
        description: 'Originalni tekst, odlomci odvojeni praznim retkom'
        required: true
        type: string
      source_urls:
        description: 'Najmanje 2 neovisne HTTPS domene, URL po retku'
        required: true
        type: string
      image_path:
        description: 'Opcionalno: prethodno uploadana /assets/... fotografija, inače originalni SVG'
        required: false
        type: string
      image_license:
        description: 'Prava za dostavljenu fotografiju'
        required: false
        type: choice
        options: ['none', 'owned', 'licensed', 'cc-by', 'public-domain']
        default: 'none'
      image_credit:
        description: 'Fotograf i izvor; obavezno za tuđe fotografije'
        required: false
        type: string
      image_license_url:
        description: 'HTTPS dokaz licence za CC-BY/licensed'
        required: false
        type: string
      editorial_verified:
        description: 'Potvrđujem provjeru činjenica, vlastitu obradu i prava na objavu'
        required: true
        type: boolean
        default: false
      approval:
        description: 'Za pokretanje upiši OBJAVI'
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: gnk-asg-main-mutation
  cancel-in-progress: false

jobs:
  fast-publish:
    if: github.ref == 'refs/heads/main' && vars.GNK_ASG_RELEASE_FENCE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate editorial form and prepare one approved article
        id: prepare
        env:
          FAST_TITLE: ${{ inputs.headline }}
          FAST_SLUG: ${{ inputs.slug }}
          FAST_BODY: ${{ inputs.body_text }}
          FAST_SOURCES: ${{ inputs.source_urls }}
          FAST_IMAGE_PATH: ${{ inputs.image_path }}
          FAST_IMAGE_LICENSE: ${{ inputs.image_license }}
          FAST_IMAGE_CREDIT: ${{ inputs.image_credit }}
          FAST_IMAGE_LICENSE_URL: ${{ inputs.image_license_url }}
          FAST_FACTS_VERIFIED: ${{ inputs.editorial_verified }}
          FAST_ORIGINALITY_VERIFIED: ${{ inputs.editorial_verified }}
          FAST_APPROVAL: ${{ inputs.approval }}
        run: |
          set -euo pipefail
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          node scripts/aktual-fast-intake-v1.mjs
      - name: Fast essential tests and rights/duplicate preflight
        run: |
          set -euo pipefail
          node --check scripts/aktual-fast-intake-v1.mjs
          node tests/test-aktual-fast-intake-v1.mjs
          node scripts/content-queue-preflight-v1.mjs
      - name: Publish via existing canonical queue, sitemap and AKTUAL links
        run: node scripts/content-queue-publish-v1.mjs
      - name: Commit and launch protected exact-SHA Cloudflare deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BASE_SHA: ${{ steps.prepare.outputs.base_sha }}
          ARTICLE_SLUG: ${{ inputs.slug }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aktual-fast-publisher'
          git config user.email 'actions@github.com'
          git add content/factory-queue apps/portal
          git diff --cached --quiet && { echo 'No publishable change'; exit 1; }
          git commit -m "AKTUAL MEDIA: editorial publish ${ARTICLE_SLUG}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE_SHA" || { echo 'Main moved: cancel without force/rebase'; exit 75; }
          git push origin HEAD:main
          sha="$(git rev-parse HEAD)"
          gh workflow run deploy-admin-auth-v6.yml --repo "$GITHUB_REPOSITORY" --ref main -f confirm_production_deploy=DEPLOY_ADMIN_AUTH_V6 -f approved_sha="$sha" -f notify_search_engines=true
          echo "Prepared content commit: $sha; deploy dispatched, NOT YET LIVE" >> "$GITHUB_STEP_SUMMARY"
