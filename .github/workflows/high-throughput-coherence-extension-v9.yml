name: High Throughput Coherence Extension V9

on:
  pull_request:
    paths:
      - 'apps/portal/**'
      - 'ops/high-throughput-capability-extension-v9.json'
      - 'scripts/audit-image-sitemap-duplicate-coherence-v1.mjs'
      - 'scripts/audit-internal-link-noindex-target-v1.mjs'
      - 'scripts/audit-publication-future-date-coherence-v1.mjs'
      - 'scripts/validate-high-throughput-capability-extension-v9.py'
      - '.github/workflows/high-throughput-coherence-extension-v9.yml'
  push:
    branches: [main]
    paths:
      - 'apps/portal/**'
      - 'ops/high-throughput-capability-extension-v9.json'
      - 'scripts/audit-image-sitemap-duplicate-coherence-v1.mjs'
      - 'scripts/audit-internal-link-noindex-target-v1.mjs'
      - 'scripts/audit-publication-future-date-coherence-v1.mjs'
      - 'scripts/validate-high-throughput-capability-extension-v9.py'
      - '.github/workflows/high-throughput-coherence-extension-v9.yml'

permissions:
  contents: read
concurrency:
  group: high-throughput-coherence-v9-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax checks
        run: |
          set -euo pipefail
          node --check scripts/audit-image-sitemap-duplicate-coherence-v1.mjs
          node --check scripts/audit-internal-link-noindex-target-v1.mjs
          node --check scripts/audit-publication-future-date-coherence-v1.mjs
          python -m py_compile scripts/validate-high-throughput-capability-extension-v9.py
      - name: Image sitemap duplicate coherence
        run: node scripts/audit-image-sitemap-duplicate-coherence-v1.mjs
      - name: Internal link noindex target protection
        run: node scripts/audit-internal-link-noindex-target-v1.mjs
      - name: Publication future-date coherence
        run: node scripts/audit-publication-future-date-coherence-v1.mjs
      - name: Workforce capability extension topology
        run: python scripts/validate-high-throughput-capability-extension-v9.py
      - name: Upload V9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: high-throughput-coherence-v9-${{ github.sha }}
          path: |
            artifacts/image-sitemap-duplicate-coherence/**
            artifacts/internal-link-noindex-target/**
            artifacts/publication-future-date-coherence/**
            artifacts/high-throughput-capability-extension-v9/**
          if-no-files-found: warn
          retention-days: 14
