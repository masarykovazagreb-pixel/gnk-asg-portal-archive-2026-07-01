name: Validate Current Portal Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/portal/**'
      - 'workers/gnk-asg-direct-operator/**'
      - 'scripts/verify-public-redesign-contract.mjs'
      - 'scripts/validate-worker-import-graph.mjs'
      - 'docs/PUBLIC_REDESIGN_BACKEND_CONTRACT.md'
      - '.github/workflows/test-portal-repair-v9.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate current JavaScript
        shell: bash
        run: |
          set -euxo pipefail
          node --check apps/portal/assets/public-unified-menu-v6.js
          node --check workers/gnk-asg-direct-operator/src/public-shell-v11.js
          node --check workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
          node --check workers/gnk-asg-direct-operator/src/index-enterprise-projects-runtime-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js
          node --check workers/gnk-asg-direct-operator/src/manual-mail-service-v1.js
          node --check workers/gnk-asg-direct-operator/src/media-outreach-delivery-html-v1.js
          node --check workers/gnk-asg-direct-operator/src/media-registration-v1.js
          node --check workers/gnk-asg-direct-operator/src/campaign-mailer-shell-v2.js
          node --check workers/gnk-asg-direct-operator/src/campaign-mailer-v2.js
          node --check workers/gnk-asg-direct-operator/src/campaign-mailer-approval-v1.js
          find apps/portal/campaign-mailer -name '*.js' -type f -print0 | xargs -0 -r -n1 node --check

      - name: Verify public redesign and protected backend contract
        run: node scripts/verify-public-redesign-contract.mjs

      - name: Verify canonical review entrypoints
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'main = "src/index-unified-auth-v14.js"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'main = "src/index-enterprise-projects-runtime-v1.js"' workers/gnk-asg-direct-operator/wrangler.review-preview.toml
          grep -q "from './index-final-admin-gateway-v2.js'" workers/gnk-asg-direct-operator/src/index-enterprise-projects-runtime-v1.js
          grep -q 'campaign-mailer-shell-v2.js' workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js
          grep -q 'campaign-mailer-v2.js' workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js
          grep -q 'MAIL_MANUAL_LIVE = "false"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'MEDIA_OUTREACH_LIVE = "false"' workers/gnk-asg-direct-operator/wrangler.toml
          test -s apps/portal/index.html
          test -s apps/portal/en/index.html
          test -s apps/portal/contact/index.html
          test -s apps/portal/media-application/index.html
          test -s apps/portal/media-registration-admin/index.html
          test -s apps/portal/campaign-mailer/index.html

      - name: Validate active Worker import graph
        run: node scripts/validate-worker-import-graph.mjs
