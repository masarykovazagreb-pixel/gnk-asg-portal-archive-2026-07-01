name: Deploy Private Admin UI Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GNK_ASG_OPERATOR_TOKEN: ${{ secrets.GNK_ASG_OPERATOR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate private UI package
        run: |
          node --check workers/gnk-asg-direct-operator/src/index-private-ui-assets-v1.js
          node --check apps/portal/assets/private-admin-menu-v1.js
          node --check apps/portal/assets/admin-auth-controls-v1.js
          grep -q 'index-private-ui-assets-v1.js' workers/gnk-asg-direct-operator/wrangler.mail-proxy-no-routes.toml
      - name: Deploy without changing routes
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$GNK_ASG_OPERATOR_TOKEN"
          token_hash=$(printf '%s' "$GNK_ASG_OPERATOR_TOKEN" | sha256sum | awk '{print $1}')
          npx --yes wrangler@4 deploy --config wrangler.mail-proxy-no-routes.toml --name gnk-asg-direct-operator --var "OPERATOR_TOKEN_SHA256:$token_hash"
      - name: Verify menu login controls and logout
        shell: bash
        run: |
          sleep 10
          test -n "$GNK_ASG_OPERATOR_TOKEN"
          login_code=$(curl --silent --show-error --output login.html --dump-header login.headers --write-out '%{http_code}' \
            --cookie-jar cookies.txt \
            --request POST \
            --data-urlencode "token=$GNK_ASG_OPERATOR_TOKEN" \
            --data-urlencode 'next=/mail-studio/' \
            'https://gnk-asg.hr/mail-studio/')
          test "$login_code" = "303"

          for path in mail-studio admin-center operator-dashboard operator-mobile mail-studio-pro; do
            code=$(curl --silent --show-error --output "$path.html" --write-out '%{http_code}' --cookie cookies.txt "https://gnk-asg.hr/$path/")
            echo "$path HTTP=$code"
            test "$code" = "200"
            grep -q 'private-admin-menu-v1.js' "$path.html"
            grep -q 'admin-auth-controls-v1.js' "$path.html"
          done

          menu_code=$(curl --silent --show-error --output menu.js --write-out '%{http_code}' 'https://gnk-asg.hr/assets/private-admin-menu-v1.js?v=test')
          controls_code=$(curl --silent --show-error --output controls.js --write-out '%{http_code}' 'https://gnk-asg.hr/assets/admin-auth-controls-v1.js?v=test')
          test "$menu_code" = "200"
          test "$controls_code" = "200"
          grep -q 'gnk-private-admin-menu' menu.js
          grep -q 'gnk-admin-auth-controls' controls.js

          logout_code=$(curl --silent --show-error --output logout.html --dump-header logout.headers --write-out '%{http_code}' \
            --cookie cookies.txt \
            --request POST \
            'https://gnk-asg.hr/operator/session/logout')
          test "$logout_code" = "303"
          echo "PRIVATE_ADMIN_UI_OK=true"
