name: Editorial Production Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/editorial-production-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify final production deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            code=$(curl --silent --show-error --output health.json --write-out '%{http_code}' "https://gnk-asg.hr/api/editorial-public-health?cb=$(date +%s)" || true)
            echo "ATTEMPT=$attempt HTTP=$code"
            cat health.json 2>/dev/null || true
            if [ "$code" = "200" ] && grep -q 'GNK_ASG_EDITORIAL_CENTER_V1_20260624' health.json; then
              grep -q 'draft-review-manual-publish' health.json
              grep -q '09:00 and 16:00 Europe/Zagreb' health.json
              grep -q 'every 2 hours' health.json
              grep -q '"automaticPublicPublication": false' health.json
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Verify protected route exists
        shell: bash
        run: |
          set -euo pipefail
          editor_code=$(curl --silent --show-error --output editor.html --write-out '%{http_code}' "https://gnk-asg.hr/auto-editor/?cb=$(date +%s)")
          echo "AUTO_EDITOR_HTTP=$editor_code"
          head -c 500 editor.html || true
          echo
          test "$editor_code" = "200" -o "$editor_code" = "401"
          ! grep -q '"error"[[:space:]]*:[[:space:]]*"not_found"' editor.html
          status_code=$(curl --silent --show-error --output status.json --write-out '%{http_code}' "https://gnk-asg.hr/auto-editor/editorial/api/status?cb=$(date +%s)")
          echo "EDITORIAL_STATUS_HTTP=$status_code"
          cat status.json || true
          test "$status_code" = "200" -o "$status_code" = "401"
          ! grep -q '"error"[[:space:]]*:[[:space:]]*"not_found"' status.json
      - name: Verify live business source candidates
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { EDITORIAL_SOURCES } from './workers/gnk-asg-direct-operator/src/editorial-sources-v1.js';
          const results=[];
          for(const source of EDITORIAL_SOURCES){
            let active=null;
            const attempts=[];
            for(const url of source.feeds||[]){
              const controller=new AbortController();
              const timeout=setTimeout(()=>controller.abort(),12000);
              try{
                const response=await fetch(url,{signal:controller.signal,headers:{'user-agent':'GNK-ASG-Smoke/1.0',accept:'application/rss+xml,application/atom+xml,application/xml,text/xml,*/*'}});
                const text=await response.text();
                const items=(text.match(/<item\b/gi)||[]).length+(text.match(/<entry\b/gi)||[]).length;
                attempts.push({url,status:response.status,items});
                if(response.ok&&items>0){active={url,status:response.status,items};break;}
              }catch(error){attempts.push({url,status:0,error:String(error?.message||error)});}
              finally{clearTimeout(timeout);}
            }
            results.push({id:source.id,name:source.name,active,attempts});
          }
          const healthy=results.filter(item=>item.active).length;
          console.log(JSON.stringify({configured:results.length,healthy,results},null,2));
          if(results.length<10)process.exit(1);
          if(healthy<4)process.exit(1);
          NODE
      - name: Verify public publication routes
        shell: bash
        run: |
          set -euo pipefail
          for path in objave publications; do
            code=$(curl --silent --show-error --output "$path.html" --write-out '%{http_code}' "https://gnk-asg.hr/$path/?cb=$(date +%s)")
            echo "$path HTTP=$code"
            test "$code" = "200"
          done
          grep -q 'GNK ASG' objave.html
          grep -q 'GNK ASG' publications.html
