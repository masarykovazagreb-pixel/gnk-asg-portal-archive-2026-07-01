name: Editorial Production Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/editorial-production-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GNK_ASG_OPERATOR_TOKEN: ${{ secrets.GNK_ASG_OPERATOR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify routed production protection
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --output routed.html --write-out '%{http_code}' 'https://gnk-asg.hr/auto-editor/')
          echo "ROUTED_HTTP=$code"
          test "$code" = "401"
          grep -q 'Sigurna administratorska prijava' routed.html
          ! grep -q '"error"[[:space:]]*:[[:space:]]*"not_found"' routed.html
      - name: Verify Editorial Center worker directly
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GNK_ASG_OPERATOR_TOKEN"
          base='https://gnk-asg-auto-editor.beckuphome.workers.dev'
          login_code=$(curl --silent --show-error --output login.html --write-out '%{http_code}' --cookie-jar session.txt --request POST --data-urlencode "token=$GNK_ASG_OPERATOR_TOKEN" --data-urlencode 'next=/auto-editor/' "$base/auto-editor/")
          echo "LOGIN_HTTP=$login_code"
          test "$login_code" = "303"
          editor_code=$(curl --silent --show-error --output editor.html --write-out '%{http_code}' --cookie session.txt "$base/auto-editor/")
          echo "EDITOR_HTTP=$editor_code"
          test "$editor_code" = "200"
          grep -q 'Urednički centar' editor.html
          status_code=$(curl --silent --show-error --output status.json --write-out '%{http_code}' --cookie session.txt "$base/auto-editor/editorial/api/status")
          echo "STATUS_HTTP=$status_code"
          cat status.json
          test "$status_code" = "200"
          grep -q 'GNK_ASG_EDITORIAL_CENTER_V1_20260624' status.json
          rm -f session.txt
      - name: Verify live business source candidates
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { EDITORIAL_SOURCES } from './workers/gnk-asg-direct-operator/src/editorial-sources-v1.js';
          const results=[];
          for(const source of EDITORIAL_SOURCES){
            let active=null;
            const attempts=[];
            for(const url of source.feeds||[]){
              const controller=new AbortController();
              const timeout=setTimeout(()=>controller.abort(),12000);
              try{
                const response=await fetch(url,{signal:controller.signal,headers:{'user-agent':'GNK-ASG-Smoke/1.0',accept:'application/rss+xml,application/atom+xml,application/xml,text/xml,*/*'}});
                const text=await response.text();
                const items=(text.match(/<item\b/gi)||[]).length+(text.match(/<entry\b/gi)||[]).length;
                attempts.push({url,status:response.status,items});
                if(response.ok&&items>0){active={url,status:response.status,items};break;}
              }catch(error){attempts.push({url,status:0,error:String(error?.message||error)});}
              finally{clearTimeout(timeout);}
            }
            results.push({id:source.id,name:source.name,active,attempts});
          }
          const healthy=results.filter(item=>item.active).length;
          console.log(JSON.stringify({configured:results.length,healthy,results},null,2));
          if(results.length<10)process.exit(1);
          if(healthy<4)process.exit(1);
          NODE
      - name: Verify public publication routes
        shell: bash
        run: |
          set -euo pipefail
          for path in objave publications; do
            code=$(curl --silent --show-error --output "$path.html" --write-out '%{http_code}' "https://gnk-asg.hr/$path/?cb=$(date +%s)")
            echo "$path HTTP=$code"
            test "$code" = "200"
          done
          grep -q 'GNK ASG' objave.html
          grep -q 'GNK ASG' publications.html
