name: Restore stable index V28

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v30-emergency.yml'
      - '.github/deploy-v30.trigger'
      - 'apps/portal/assets/index-redesign-production.css'
      - 'workers/gnk-asg-direct-operator/src/public-shell-v11.js'

permissions:
  contents: read

concurrency:
  group: gnk-asg-index-v28-restore
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Verify stable V28 package
        shell: bash
        run: |
          set -euxo pipefail
          node --check workers/gnk-asg-direct-operator/src/public-shell-v11.js
          node --check apps/portal/assets/index-content-resilience-v1.js
          node --check apps/portal/assets/index-live-market-chart-v4.js
          grep -q 'GNK_ASG_PUBLIC_VISUAL_V28_STABLE_LAYOUT_RESILIENT_DATA_20260626' workers/gnk-asg-direct-operator/src/public-shell-v11.js
          grep -q 'STABLE_SINGLE_MENU_NO_POLISH' workers/gnk-asg-direct-operator/src/public-shell-v11.js
          grep -q 'public-menu-v13.js?v=20260626-stable-v28' workers/gnk-asg-direct-operator/src/public-shell-v11.js
          grep -q 'index-content-resilience-v1.js?v=20260626-data-v28' workers/gnk-asg-direct-operator/src/public-shell-v11.js
          if grep -q 'const headRuntime=' workers/gnk-asg-direct-operator/src/public-shell-v11.js; then
            echo 'V31 runtime injection is still active' >&2
            exit 1
          fi
          if grep -E -q 'const indexCore=.*index-critical-v31\.css' workers/gnk-asg-direct-operator/src/public-shell-v11.js; then
            echo 'V31 critical stylesheet injection is still active' >&2
            exit 1
          fi
          if grep -q 'index-stable-polish-v30.css' apps/portal/assets/index-redesign-production.css; then
            echo 'V30 polish layer is still active' >&2
            exit 1
          fi
          grep -q 'main = "src/index-admin-hub-v23-aktual.js"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'MEDIA_OUTREACH_LIVE = "false"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'MEDIA_OUTREACH_TEST_LIVE = "false"' workers/gnk-asg-direct-operator/wrangler.toml
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator

      - name: Deploy current canonical Worker
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator

      - name: Verify live HR and EN index
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const base='https://gnk-asg.hr';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function get(path){
            try{
              const response=await fetch(`${base}${path}${path.includes('?')?'&':'?'}cb=${Date.now()}`,{headers:{'cache-control':'no-cache'}});
              return {status:response.status,text:await response.text(),headers:Object.fromEntries(response.headers)};
            }catch(error){return {status:0,text:'',headers:{},error:String(error)};}
          }
          (async()=>{
            let last;
            for(let attempt=1;attempt<=12;attempt++){
              const [root,en,core,health]=await Promise.all([
                get('/'),get('/en/'),get('/assets/index-redesign-production.css'),get('/data/platform-health.json')
              ]);
              const failures=[];
              for(const [name,response] of Object.entries({root,en,core,health}))if(response.status!==200)failures.push(`${name}=${response.status}`);
              for(const [name,response] of Object.entries({root,en})){
                if(!response.text.includes('public-visual-v13.css?v=20260626-stable-v28'))failures.push(`${name}_visual_v28_missing`);
                if(!response.text.includes('public-menu-v13.js?v=20260626-stable-v28'))failures.push(`${name}_menu_v28_missing`);
                if(!response.text.includes('index-content-resilience-v1.js?v=20260626-data-v28'))failures.push(`${name}_resilience_v28_missing`);
                if(response.text.includes('index-runtime-lock-v31.js'))failures.push(`${name}_runtime_v31_present`);
                if(response.text.includes('index-critical-v31.css'))failures.push(`${name}_critical_v31_present`);
                if(response.text.includes('gallery-bootstrap.js')||response.text.includes('gallery-brand-safety.js'))failures.push(`${name}_gallery_mutator_present`);
                if(response.text.includes('class="gnk-index-title"'))failures.push(`${name}_hero_injector_present`);
                if(response.headers['x-gnk-asg-public-visual']!=='GNK_ASG_PUBLIC_VISUAL_V28_STABLE_LAYOUT_RESILIENT_DATA_20260626')failures.push(`${name}_visual_header=${response.headers['x-gnk-asg-public-visual']||''}`);
                if(response.headers['x-gnk-asg-index-layout-lock']!=='STABLE_SINGLE_MENU_NO_POLISH')failures.push(`${name}_layout_header=${response.headers['x-gnk-asg-index-layout-lock']||''}`);
              }
              if(core.text.includes('index-stable-polish-v30.css'))failures.push('core_v30_polish_present');
              last={checkedAt:new Date().toISOString(),attempt,failures,codes:{root:root.status,en:en.status,core:core.status,health:health.status},headers:{root:root.headers,en:en.headers}};
              console.log(JSON.stringify(last));
              if(!failures.length)process.exit(0);
              await sleep(10000);
            }
            console.error(JSON.stringify(last,null,2));
            process.exit(1);
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
