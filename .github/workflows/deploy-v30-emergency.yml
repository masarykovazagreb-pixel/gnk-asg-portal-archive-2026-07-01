name: Deploy clean index V31 stable2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v30-emergency.yml'
      - '.github/deploy-v30.trigger'
      - 'apps/portal/assets/index-critical-v31.css'
      - 'apps/portal/assets/index-runtime-lock-v31.js'
      - 'apps/portal/assets/gallery-bootstrap.js'
      - 'workers/gnk-asg-direct-operator/src/public-shell-v11.js'

permissions:
  contents: read
  issues: write

concurrency:
  group: gnk-asg-v31-stable2-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Verify clean V31 stable2 package
        id: package
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -eux
            node --check workers/gnk-asg-direct-operator/src/public-shell-v11.js
            node --check apps/portal/assets/index-runtime-lock-v31.js
            node --check apps/portal/assets/gallery-bootstrap.js
            test -s apps/portal/assets/index-critical-v31.css
            grep -q 'GNK_ASG_PUBLIC_VISUAL_V31_INDEX_RUNTIME_LOCK_20260626_STABLE2' workers/gnk-asg-direct-operator/src/public-shell-v11.js
            grep -q 'index-redesign-production.css?v=20260626-stable-v31' workers/gnk-asg-direct-operator/src/public-shell-v11.js
            grep -q 'index-runtime-lock-v31.js?v=20260626-v31-stable2' workers/gnk-asg-direct-operator/src/public-shell-v11.js
            grep -q 'index-critical-v31.css?v=20260626-v31' workers/gnk-asg-direct-operator/src/public-shell-v11.js
            grep -q "const VERSION='2026-06-26-v31-stable2'" apps/portal/assets/index-runtime-lock-v31.js
            grep -q 'addedObserver.observe(document.documentElement,{subtree:true,childList:true})' apps/portal/assets/index-runtime-lock-v31.js
            if grep -q "attributeFilter:\['class','style','hidden'\]" apps/portal/assets/index-runtime-lock-v31.js; then
              echo 'Unsafe self-triggering attribute observer is enabled' >&2
              exit 1
            fi
            grep -q "route === '/' || route === '/en'" apps/portal/assets/gallery-bootstrap.js
            if grep -q '/assets/iq200/' apps/portal/assets/index-redesign-production.css; then
              echo 'Conflicting IQ200 layers are still enabled' >&2
              exit 1
            fi
            grep -q 'MEDIA_OUTREACH_LIVE = "false"' workers/gnk-asg-direct-operator/wrangler.toml
            grep -q 'MEDIA_OUTREACH_TEST_LIVE = "false"' workers/gnk-asg-direct-operator/wrangler.toml
            cd workers/gnk-asg-direct-operator
            npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator
          } 2>&1 | tee /tmp/v31-stable2-package.log

      - name: Deploy V31 stable2 to Cloudflare
        id: cloudflare
        if: steps.package.outcome == 'success'
        continue-on-error: true
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator 2>&1 | tee /tmp/v31-stable2-cloudflare.log

      - name: Verify V31 stable2 production HTML
        id: production
        if: steps.cloudflare.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node <<'JS' 2>&1 | tee /tmp/v31-stable2-production.log
          const fs=require('node:fs');
          const base='https://gnk-asg.hr';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function get(path){
            try{
              const response=await fetch(`${base}${path}${path.includes('?')?'&':'?'}cb=${Date.now()}`,{headers:{'cache-control':'no-cache'}});
              return {status:response.status,text:await response.text(),headers:Object.fromEntries(response.headers)};
            }catch(error){return {status:0,text:'',headers:{},error:String(error)};}
          }
          (async()=>{
            let last;
            for(let attempt=1;attempt<=10;attempt++){
              const [root,en,core,critical,runtime,health]=await Promise.all([
                get('/'),get('/en/'),get('/assets/index-redesign-production.css?v=20260626-stable-v31'),
                get('/assets/index-critical-v31.css?v=20260626-v31'),get('/assets/index-runtime-lock-v31.js?v=20260626-v31-stable2'),
                get('/data/platform-health.json')
              ]);
              const failures=[];
              for(const [name,response] of Object.entries({root,en,core,critical,runtime,health}))if(response.status!==200)failures.push(`${name}=${response.status}`);
              for(const [name,response] of Object.entries({root,en})){
                if(!response.text.includes('index-redesign-production.css?v=20260626-stable-v31'))failures.push(`${name}_core_v31_missing`);
                if(!response.text.includes('index-critical-v31.css?v=20260626-v31'))failures.push(`${name}_critical_v31_missing`);
                if(!response.text.includes('index-runtime-lock-v31.js?v=20260626-v31-stable2'))failures.push(`${name}_runtime_stable2_missing`);
                if(response.text.includes('gallery-bootstrap.js'))failures.push(`${name}_gallery_bootstrap_present`);
              }
              if(!critical.text.includes('index critical lock V31'))failures.push('critical_marker_missing');
              if(!runtime.text.includes('INDEX_RUNTIME_LOCK_V31'))failures.push('runtime_marker_missing');
              if(!runtime.text.includes('2026-06-26-v31-stable2'))failures.push('runtime_stable2_marker_missing');
              if(runtime.text.includes("attributeFilter:['class','style','hidden']"))failures.push('unsafe_attribute_observer_present');
              last={checkedAt:new Date().toISOString(),attempt,failures,codes:{root:root.status,en:en.status,core:core.status,critical:critical.status,runtime:runtime.status,health:health.status},runtimeHeader:root.headers['x-gnk-asg-index-runtime']||''};
              fs.writeFileSync('/tmp/v31-stable2-diagnostic.json',JSON.stringify(last,null,2));
              console.log(JSON.stringify(last));
              if(!failures.length)process.exit(0);
              await sleep(10000);
            }
            process.exit(1);
          })().catch(error=>{console.error(error);process.exit(1)});
          JS

      - name: Report V31 stable2 result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          CLOUDFLARE_OUTCOME: ${{ steps.cloudflare.outcome }}
          PRODUCTION_OUTCOME: ${{ steps.production.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          diagnostic=$(cat /tmp/v31-stable2-diagnostic.json 2>/dev/null || printf '{"error":"production_verification_not_reached"}')
          gh issue comment 101 --body "V31 stable2 deploy · package **${PACKAGE_OUTCOME}** · Cloudflare **${CLOUDFLARE_OUTCOME}** · production **${PRODUCTION_OUTCOME}** · commit \`${RUN_SHA}\` · ${RUN_URL}\n\n\`\`\`json\n${diagnostic}\n\`\`\`"

      - name: Enforce successful deployment
        if: always()
        env:
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          CLOUDFLARE_OUTCOME: ${{ steps.cloudflare.outcome }}
          PRODUCTION_OUTCOME: ${{ steps.production.outcome }}
        shell: bash
        run: |
          test "$PACKAGE_OUTCOME" = success
          test "$CLOUDFLARE_OUTCOME" = success
          test "$PRODUCTION_OUTCOME" = success
