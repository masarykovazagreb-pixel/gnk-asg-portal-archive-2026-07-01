name: Deploy clean index V30 emergency

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v30-emergency.yml'
      - '.github/deploy-v30.trigger'

permissions:
  contents: read
  issues: write

concurrency:
  group: gnk-asg-v30-emergency-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Verify clean V30 package
        shell: bash
        run: |
          set -euxo pipefail
          node --check workers/gnk-asg-direct-operator/src/public-shell-v11.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v21.js
          node --check workers/gnk-asg-direct-operator/src/index-lock-v4.js
          node --check workers/gnk-asg-direct-operator/src/index-server-hydration-v1.js
          node --check apps/portal/assets/index-content-resilience-v1.js
          node --check apps/portal/assets/index-live-market-chart-v4.js
          test -s apps/portal/assets/index-stable-polish-v30.css
          grep -q 'GNK_ASG_PUBLIC_VISUAL_V30_CLEAN_POLISH_20260626' workers/gnk-asg-direct-operator/src/public-shell-v11.js
          grep -q 'INDEX_STABLE_POLISH_V30' workers/gnk-asg-direct-operator/src/public-shell-v11.js
          grep -q 'index-stable-polish-v30.css' apps/portal/assets/index-redesign-production.css
          if grep -q '/assets/iq200/' apps/portal/assets/index-redesign-production.css; then
            echo 'Conflicting IQ200 layers are still enabled' >&2
            exit 1
          fi
          if grep -q 'function patchIndexHero' workers/gnk-asg-direct-operator/src/public-shell-v11.js; then
            echo 'Legacy hero injector is still enabled' >&2
            exit 1
          fi
          if grep -E -q 'const indexHead=.*index-polish-v1\.css' workers/gnk-asg-direct-operator/src/public-shell-v11.js; then
            echo 'Legacy index polish injection is still enabled' >&2
            exit 1
          fi
          grep -q 'MEDIA_OUTREACH_LIVE = "false"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'MEDIA_OUTREACH_TEST_LIVE = "false"' workers/gnk-asg-direct-operator/wrangler.toml
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator

      - name: Deploy V30 to Cloudflare
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator

      - name: Verify V30 production
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs=require('node:fs');
          const base='https://gnk-asg.hr';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function get(path){
            try{
              const response=await fetch(`${base}${path}${path.includes('?')?'&':'?'}cb=${Date.now()}`,{headers:{'cache-control':'no-cache'}});
              return {status:response.status,text:await response.text(),headers:Object.fromEntries(response.headers)};
            }catch(error){return {status:0,text:'',headers:{},error:String(error)};}
          }
          (async()=>{
            let last;
            for(let attempt=1;attempt<=18;attempt++){
              const [root,en,polish,health]=await Promise.all([
                get('/'),get('/en/'),get('/assets/index-stable-polish-v30.css'),get('/data/platform-health.json')
              ]);
              const failures=[];
              for(const [name,response] of Object.entries({root,en,polish,health}))if(response.status!==200)failures.push(`${name}=${response.status}`);
              for(const [name,response] of Object.entries({root,en})){
                if(!response.text.includes('20260626-stable-v30'))failures.push(`${name}_stable_v30_missing`);
                if(!response.text.includes('index-redesign-production.css?v=20260626-stable-v30'))failures.push(`${name}_index_css_v30_missing`);
                if(response.text.includes('/assets/index-polish-v1.css'))failures.push(`${name}_legacy_polish_present`);
                if(response.text.includes('class="gnk-index-title"'))failures.push(`${name}_legacy_title_present`);
              }
              if(polish.status===200&&!polish.text.includes('stable polish V30'))failures.push('polish_marker_missing');
              last={checkedAt:new Date().toISOString(),attempt,failures,codes:{root:root.status,en:en.status,polish:polish.status,health:health.status},headers:{root:root.headers,en:en.headers}};
              fs.writeFileSync('/tmp/v30-diagnostic.json',JSON.stringify(last,null,2));
              console.log(JSON.stringify(last));
              if(!failures.length)process.exit(0);
              await sleep(10000);
            }
            console.error(JSON.stringify(last,null,2));
            process.exit(1);
          })().catch(error=>{console.error(error);process.exit(1)});
          JS

      - name: Report V30 result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          diagnostic=$(cat /tmp/v30-diagnostic.json 2>/dev/null || printf '{"error":"production_verification_not_reached"}')
          gh issue comment 100 --body "Emergency V30 index deploy **${JOB_STATUS}** · commit \`${RUN_SHA}\` · ${RUN_URL}\n\n\`\`\`json\n${diagnostic}\n\`\`\`"
