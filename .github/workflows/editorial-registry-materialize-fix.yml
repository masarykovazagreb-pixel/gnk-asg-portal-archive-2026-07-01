name: Materialize editorial registry persistence fix
on:
  push:
    branches: [fix/editorial-registry-en-persistence-20261002]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[registry-materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild canonical registry and sitemap
        run: |
          set -euo pipefail
          node scripts/editorial-registry-v1.mjs
          node scripts/generate-editorial-sitemap-v2.mjs
          python scripts/validate_publication_sitemap_registry_v1.py
          node scripts/test-index-content-contract.mjs
          grep -q 'https://gnk-asg.hr/en/publications/technology-capital-and-responsible-governance/' apps/portal/editorial-sitemap.xml
          ! grep -q 'https://gnk-asg.hr/komentari/gnk-asg-504-milijuna-eura-prihoda/' apps/portal/editorial-sitemap.xml
          ! grep -q 'https://gnk-asg.hr/objave/gnk-asg-504-milijuna-eura-prihoda/' apps/portal/editorial-sitemap.xml
      - name: Commit generated package
        run: |
          set -euo pipefail
          git config user.name 'editorial-registry-materializer'
          git config user.email 'actions@github.com'
          git rm .github/workflows/editorial-registry-materialize-fix.yml
          git add apps/portal/data/editorial-registry.json apps/portal/editorial-sitemap.xml apps/portal/sitemap-index.xml scripts/editorial-registry-v1.mjs
          git commit -m 'P0: materialize persistent HR+EN editorial registry [registry-materialized]'
          git push origin HEAD:${GITHUB_REF_NAME}
