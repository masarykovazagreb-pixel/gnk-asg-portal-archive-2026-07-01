name: Verify unified email status production

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-email-status-production.yml"
      - "apps/portal/assets/email-tools-hub-v4.js"
      - "apps/portal/assets/email-status-dashboard-v2.js"
      - "workers/gnk-asg-direct-operator/src/email-status-*.js"
      - "workers/gnk-asg-direct-operator/src/manual-mail-status-backfill-v1.js"
      - "workers/gnk-asg-direct-operator/wrangler.runtime.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-email-status-production.yml"
      - "apps/portal/assets/email-tools-hub-v4.js"
      - "apps/portal/assets/email-status-dashboard-v2.js"
      - "workers/gnk-asg-direct-operator/src/email-status-*.js"
      - "workers/gnk-asg-direct-operator/src/manual-mail-status-backfill-v1.js"
      - "workers/gnk-asg-direct-operator/wrangler.runtime.toml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-email-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPERATOR_TOKEN: ${{ secrets.GNK_ASG_ADMIN_TOKEN || secrets.OPERATOR_TOKEN || secrets.GNK_ASG_OPERATOR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Validate email-status source
        run: |
          set -euo pipefail
          for file in \
            workers/gnk-asg-direct-operator/src/email-status-tracking-v1.js \
            workers/gnk-asg-direct-operator/src/email-status-tracking-v2.js \
            workers/gnk-asg-direct-operator/src/email-status-tracking-v3.js \
            workers/gnk-asg-direct-operator/src/email-status-tracking-v4.js \
            workers/gnk-asg-direct-operator/src/email-status-tracking-v5.js \
            workers/gnk-asg-direct-operator/src/email-status-tracking-v5-core.js \
            workers/gnk-asg-direct-operator/src/email-status-tracking-v6.js \
            workers/gnk-asg-direct-operator/src/email-status-date-window-v1.js \
            workers/gnk-asg-direct-operator/src/manual-mail-status-backfill-v1.js \
            workers/gnk-asg-direct-operator/src/email-status-buttons-v1.js; do node --check "$file"; done
          node --check apps/portal/assets/email-tools-hub-v4.js
          node --check apps/portal/assets/email-status-dashboard-v2.js
          grep -q "email-status-tracking-v6.js" workers/gnk-asg-direct-operator/src/email-status-tracking-v5.js
          grep -q 'EMAIL_STATUS_PUBLIC_ORIGIN = "https://gnk-asg.hr"' workers/gnk-asg-direct-operator/wrangler.runtime.toml
          grep -q 'EMAIL_OPEN_TRACKING_ENABLED = "true"' workers/gnk-asg-direct-operator/wrangler.runtime.toml
          grep -q 'DEPLOY_REVISION = "20260703-visible-email-tools-status-v6"' workers/gnk-asg-direct-operator/wrangler.runtime.toml
      - name: Verify production routes without sending email
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: |
          set -euo pipefail
          pixel_id="00000000-0000-4000-8000-000000000000"
          for base in "https://gnk-asg-direct-operator.beckuphome.workers.dev" "https://www.gnk-asg.hr"; do
            ready=false
            for attempt in $(seq 1 40); do
              cb="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
              home=$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "$base/?cb=$cb" || true)
              dashboard=$(curl -sS -D /tmp/dashboard.headers -o /tmp/dashboard.body -w '%{http_code}' "$base/email-status?source=mail-studio&date=today&cb=$cb" || true)
              health=$(curl -sS -o /tmp/health.body -w '%{http_code}' "$base/api/email-status/health?cb=$cb" || true)
              pixel=$(curl -sS -D /tmp/pixel.headers -o /tmp/pixel.gif -w '%{http_code}' "$base/api/email-status/open/$pixel_id.gif?cb=$cb" || true)
              tools=$(curl -sS -o /tmp/tools.js -w '%{http_code}' "$base/assets/email-tools-hub-v4.js?cb=$cb" || true)
              status_asset=$(curl -sS -o /tmp/status.js -w '%{http_code}' "$base/assets/email-status-dashboard-v2.js?cb=$cb" || true)
              if [ "$home" = 200 ] \
                && { [ "$dashboard" = 303 ] || [ "$dashboard" = 401 ]; } \
                && [ "$health" = 401 ] && [ "$pixel" = 200 ] \
                && [ "$tools" = 200 ] && [ "$status_asset" = 200 ] \
                && grep -q '__GNK_ASG_EMAIL_TOOLS_HUB_V4__' /tmp/tools.js \
                && grep -q '__GNK_ASG_EMAIL_STATUS_DASHBOARD_V2__' /tmp/status.js \
                && grep -qi '^content-type: image/gif' /tmp/pixel.headers; then ready=true; break; fi
              sleep 6
            done
            echo "$base ready=$ready dashboard=$dashboard health=$health pixel=$pixel tools=$tools status_asset=$status_asset"
            test "$ready" = true
          done
          echo "Production routes and UI assets verified. No email was sent."
      - name: Verify authenticated today's Mail Studio statuses
        id: authenticated
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && env.OPERATOR_TOKEN != ''
        run: |
          set -euo pipefail
          base="https://gnk-asg-direct-operator.beckuphome.workers.dev"
          auth=(-H "authorization: Bearer $OPERATOR_TOKEN")
          cb="${GITHUB_RUN_ID}-auth-$(date +%s)"
          test "$(curl -sS "${auth[@]}" -o /tmp/mail.html -w '%{http_code}' "$base/mail-studio/?cb=$cb")" = 200
          test "$(curl -sS "${auth[@]}" -o /tmp/status.html -w '%{http_code}' "$base/email-status?source=mail-studio&date=today&cb=$cb")" = 200
          test "$(curl -sS "${auth[@]}" -o /tmp/records.json -w '%{http_code}' "$base/api/email-status/records?source=mail-studio&date=today&limit=100&cb=$cb")" = 200
          grep -q 'gnk-email-tools-hub-v4' /tmp/mail.html
          grep -q 'gnk-email-status-dashboard-v2' /tmp/status.html
          python - <<'PY'
          import json, os
          data=json.load(open('/tmp/records.json',encoding='utf-8'))
          assert data.get('manualAuditBackfill',{}).get('ok') is True, data
          assert data.get('dateWindow',{}).get('timeZone')=='Europe/Zagreb', data
          total=int(data.get('total',0))
          print(json.dumps({'todayTotal':total,'summary':data.get('summary',{}),'backfill':data['manualAuditBackfill']},indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f"today_total={total}\n")
              out.write("verified=true\n")
          PY
          echo "Authenticated status view verified. No email was sent."
      - name: Persist production verification record
        if: success() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
        env:
          AUTH_VERIFIED: ${{ steps.authenticated.outputs.verified || 'false' }}
          TODAY_TOTAL: ${{ steps.authenticated.outputs.today_total || 'unknown' }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B email-status-verification-record origin/main
          mkdir -p docs
          cat > docs/email-status-production-verification.json <<JSON
          {
            "ok": true,
            "verifiedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "workflowRun": "${GITHUB_RUN_ID}",
            "worker": "https://gnk-asg-direct-operator.beckuphome.workers.dev",
            "customDomain": "https://www.gnk-asg.hr",
            "dashboard": "/email-status?source=mail-studio&date=today",
            "emailToolsAsset": "/assets/email-tools-hub-v4.js",
            "statusDashboardAsset": "/assets/email-status-dashboard-v2.js",
            "authenticatedStatusVerified": ${AUTH_VERIFIED},
            "todayMailStudioRecords": "${TODAY_TOTAL}",
            "emailSent": false
          }
          JSON
          git config user.name "gnk-asg-verification-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/email-status-production-verification.json
          git commit -m "Record email status production verification [skip ci]" || exit 0
          git push origin HEAD:main
