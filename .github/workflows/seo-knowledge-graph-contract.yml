name: SEO Knowledge Graph Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/portal/data/seo-knowledge-graph-v1.json'
      - 'apps/portal/assets/seo-knowledge-graph-v1.js'
      - 'apps/portal/assets/seo-knowledge-graph-v1.css'
      - 'scripts/validate-seo-knowledge-graph-v1.mjs'
      - 'scripts/apply-seo-knowledge-graph-v1.mjs'
      - '.github/workflows/seo-knowledge-graph-contract.yml'

permissions:
  contents: read

concurrency:
  group: seo-knowledge-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate JavaScript syntax
        run: |
          node --check apps/portal/assets/seo-knowledge-graph-v1.js
          node --check scripts/validate-seo-knowledge-graph-v1.mjs
          node --check scripts/apply-seo-knowledge-graph-v1.mjs
      - name: Validate SEO Knowledge Graph contract
        run: node scripts/validate-seo-knowledge-graph-v1.mjs
      - name: Inventory editorial injection targets
        run: node scripts/apply-seo-knowledge-graph-v1.mjs
