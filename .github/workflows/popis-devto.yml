name: Popis svih Dev.to objava (jednokratno)
on:
  workflow_dispatch:
    inputs:
      devto_key: {required: true, type: string}
jobs:
  popis:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: echo "::add-mask::${{ inputs.devto_key }}"
      - env:
          DEVTO_KEY: ${{ inputs.devto_key }}
        run: |
          mkdir -p apps/portal/data/tmp-popis
          curl -s "https://dev.to/api/articles/me/all?per_page=1000" -H "api-key: $DEVTO_KEY" -o apps/portal/data/tmp-popis/svi.json
          python3 -c "
import json
d = json.load(open('apps/portal/data/tmp-popis/svi.json'))
print('ukupno:', len(d))
for a in d:
    print(a['id'], '|', a.get('canonical_url'), '|', a['title'])
" > apps/portal/data/tmp-popis/rezultat.txt
          cat apps/portal/data/tmp-popis/rezultat.txt
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          BRANCH="popis-devto-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-popis/rezultat.txt
          git commit -m "popis"
          git push origin "$BRANCH"

# osvjezi registraciju
