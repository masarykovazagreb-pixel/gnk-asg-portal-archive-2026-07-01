name: Check Existing Fields System Chrome

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Start worker
        working-directory: workers/gnk-asg-direct-operator
        run: |
          npx --yes wrangler@4 dev --config wrangler.existing-media-test.toml --ip 127.0.0.1 --port 8787 > existing-fields-system-chrome.log 2>&1 &
          echo $! > existing-fields-system-chrome.pid
          for i in $(seq 1 50); do
            curl -fsS http://127.0.0.1:8787/ > /dev/null && exit 0
            sleep 1
          done
          cat existing-fields-system-chrome.log
          exit 1
      - name: Prepare system Chrome
        working-directory: apps/portal
        run: |
          npm install --no-package-lock --no-save @playwright/test@1.52.0
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
      - name: Validate layout
        working-directory: apps/portal
        env:
          VISUAL_BASE: http://127.0.0.1:8787
        run: node tests/index-existing-media-layout-v1.mjs
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: index-existing-fields-system-chrome
          path: |
            apps/portal/existing-media-layout-output
            workers/gnk-asg-direct-operator/existing-fields-system-chrome.log
          retention-days: 7
