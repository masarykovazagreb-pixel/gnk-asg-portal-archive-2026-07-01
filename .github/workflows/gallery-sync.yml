name: GNK ASG Gallery Sync

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gnk-asg-main-mutation
  cancel-in-progress: true

jobs:
  sync-gallery:
    if: vars.GNK_ASG_RELEASE_FENCE != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate and index Gallery
        run: node scripts/gallery-sync.mjs

      - name: Remove non-editorial assets from publication pool
        run: node scripts/gallery-editorial-filter.mjs

      - name: Apply approved visual identity guard
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const portal=path.join(process.cwd(),'apps','portal');
          const pages=['index.html','en/index.html','objave/index.html','publications/index.html','en/insights/index.html','vijesti/index.html','news/index.html','insights-hr/index.html','visual-index/index.html'];
          const tag='<script src="/assets/gallery-brand-safety.js?v=20260626-v1"></script>';
          for(const rel of pages){
            const file=path.join(portal,rel);
            if(!fs.existsSync(file))continue;
            let html=fs.readFileSync(file,'utf8').replace(/\s*<script[^>]+gallery-brand-safety\.js[^>]*><\/script>/gi,'');
            html=html.replace(/<\/body>/i,tag+'\n</body>');
            fs.writeFileSync(file,html);
          }
          NODE

      - name: Verify approved catalog and quarantine
        run: |
          node <<'NODE'
          const fs=require('fs');
          const catalogPath='./apps/portal/data/gallery.catalog.json';
          const quarantinePath='./apps/portal/data/gallery.quarantine.json';
          const configPath='./apps/portal/data/gallery.json';
          for(const file of [catalogPath,quarantinePath,configPath]){
            if(!fs.existsSync(file))throw new Error(`Missing required Gallery file: ${file}`);
          }
          const catalog=JSON.parse(fs.readFileSync(catalogPath,'utf8'));
          const quarantine=JSON.parse(fs.readFileSync(quarantinePath,'utf8'));
          const config=JSON.parse(fs.readFileSync(configPath,'utf8'));
          if(!Array.isArray(catalog.items)||catalog.count!==catalog.items.length)throw new Error('Gallery catalog count mismatch');
          if(catalog.count<100)throw new Error(`Gallery contains only ${catalog.count} approved images`);
          if(!Array.isArray(quarantine.items)||quarantine.count!==quarantine.items.length)throw new Error('Gallery quarantine count mismatch');
          if(config.physical_image_count!==catalog.count)throw new Error('Gallery config approved count mismatch');
          if(config.quarantined_image_count!==quarantine.count)throw new Error('Gallery config quarantine count mismatch');
          const normalize=value=>String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[_-]+/g,' ').replace(/\s+/g,' ');
          const prohibited=item=>{
            const text=normalize([item.src,item.title,item.alt,item.description,item.source,...(item.topic||[])].filter(Boolean).join(' '));
            if(!text.includes('dinamo'))return false;
            const company=/\b(gnk dinamo ltd|dinamo ltd|colorado|boulder|corporate|company|business|poslovn)\b/.test(text);
            const club=/\b(dinamo zagreb|gnk dinamo zagreb|nk dinamo|football club|nogometni klub|stadion maksimir)\b/.test(text);
            const emblem=/\b(logo|logotip|grb|crest|badge|emblem|shield|club mark|club logo|klupski znak)\b/.test(text);
            return club||(emblem&&!company);
          };
          const nonEditorial=item=>/\b(favicon|app icon|touch icon|mask icon|sprite|loader|loading|placeholder|tracking pixel|qr code|qrcode|flag icon|avatar default|logo|logotip|wordmark|brand mark|crest|badge|emblem|shield|social card)\b/.test(normalize(`${item.src} ${item.title}`))&&!normalize(item.src).includes('/assets/gallery/generated/');
          const blocked=catalog.items.filter(prohibited);
          const utility=catalog.items.filter(nonEditorial);
          if(blocked.length)throw new Error(`Prohibited football-club visual records remain in public catalog: ${blocked.map(item=>item.src).join(', ')}`);
          if(utility.length)throw new Error(`Non-editorial assets remain in publication pool: ${utility.slice(0,20).map(item=>item.src).join(', ')}`);
          console.log(JSON.stringify({approved:catalog.count,quarantined:quarantine.count,policy:'passed'}));
          NODE

      - name: Commit synchronized Gallery
        run: |
          if git diff --quiet; then
            echo "Gallery is already synchronized."
            exit 0
          fi
          git config user.name "GNK ASG Gallery Bot"
          git config user.email "beckuphome@gmail.com"
          git add apps/portal scripts/gallery-sync.mjs scripts/gallery-editorial-filter.mjs
          git commit -m "chore(gallery): auto-sync images, SEO catalog and consumers [skip ci]"
          git push
