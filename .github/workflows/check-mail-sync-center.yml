name: Check Mail Sync Center

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/portal/assets/mail-sync-center-ui-v1.js'
      - 'apps/portal/mail-studio/index.html'
      - 'workers/gnk-asg-direct-operator/src/mail-sync-center-v1.js'
      - 'workers/gnk-asg-direct-operator/src/mail-sync-center-v2.js'
      - 'workers/gnk-asg-direct-operator/src/mail-studio-extension-v3.js'
      - 'workers/gnk-asg-direct-operator/src/mail-studio-extension-v4.js'
      - 'workers/gnk-asg-direct-operator/src/email-signature-contract-v1.js'
      - 'workers/gnk-asg-direct-operator/src/index-media-command-center-v20.js'
      - 'workers/gnk-asg-direct-operator/src/index-final-admin-gateway-projects-v1.js'
      - 'workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js'
      - 'workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js'
      - 'workers/gnk-asg-direct-operator/src/index-enterprise-projects-runtime-v1.js'
      - 'workers/gnk-asg-direct-operator/wrangler.toml'
      - 'workers/gnk-asg-direct-operator/test/mail-sync-center.test.mjs'
      - 'workers/gnk-asg-direct-operator/test/email-control-copy.test.mjs'
      - '.github/workflows/check-mail-sync-center.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check syntax
        run: |
          set -euxo pipefail
          node --check apps/portal/assets/mail-sync-center-ui-v1.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/mail-sync-center-v1.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/mail-sync-center-v2.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/mail-studio-extension-v3.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/mail-studio-extension-v4.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/email-signature-contract-v1.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/index-final-admin-gateway-projects-v1.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/index-enterprise-projects-runtime-v1.js
          node --check workers/gnk-asg-direct-operator/test/mail-sync-center.test.mjs
          node --check workers/gnk-asg-direct-operator/test/email-control-copy.test.mjs
      - name: Test protected routes and persistence contract
        run: node workers/gnk-asg-direct-operator/test/mail-sync-center.test.mjs
      - name: Test control-copy and mailbox contract
        run: node workers/gnk-asg-direct-operator/test/email-control-copy.test.mjs
      - name: Verify storage and threading contract
        run: |
          set -euxo pipefail
          base=workers/gnk-asg-direct-operator/src/mail-sync-center-v1.js
          webmail=workers/gnk-asg-direct-operator/src/mail-sync-center-v2.js
          grep -q 'mail_sync_messages' "$base"
          grep -q 'mail_sync_attachments' "$base"
          grep -q 'mail_sync_state' "$base"
          grep -q 'raw.tee' "$base"
          grep -q 'thread_id' "$base"
          grep -q 'LEGACY_METADATA_ONLY' "$base"
          grep -q 'STATUS_METADATA_ONLY' "$base"
          grep -q 'mail_sync_drafts' "$webmail"
          grep -q 'folderStats' "$webmail"
          grep -q "folder==='spam'" "$webmail"
          grep -q "folder==='trash'" "$webmail"
          grep -q "folder==='starred'" "$webmail"
      - name: Verify Mail Studio integration
        run: |
          set -euxo pipefail
          grep -q "from './mail-studio-extension-v4.js'" workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js
          grep -q "PUBLIC_PREFIX='/api/mail-center/sync'" workers/gnk-asg-direct-operator/src/mail-studio-extension-v4.js
          grep -q "INTERNAL_PREFIX='/api/mail-sync'" workers/gnk-asg-direct-operator/src/mail-studio-extension-v4.js
          grep -q 'mail-sync-center-ui-v1.js' workers/gnk-asg-direct-operator/src/mail-studio-extension-v4.js
          grep -q 'prepareMailSyncInbound' workers/gnk-asg-direct-operator/src/mail-studio-extension-v3.js
          grep -q 'recordMailSyncOutbound' workers/gnk-asg-direct-operator/src/mail-studio-extension-v3.js
          grep -q "path.startsWith('/api/mail-center/')" workers/gnk-asg-direct-operator/src/index-unified-auth-v14.js
          grep -q "from './index-final-admin-gateway-v2.js'" workers/gnk-asg-direct-operator/src/index-enterprise-projects-runtime-v1.js
      - name: Verify review-only UI
        run: |
          set -euxo pipefail
          grep -q 'Inbox' apps/portal/mail-studio/index.html
          grep -q 'Sent' apps/portal/mail-studio/index.html
          grep -q 'Drafts' apps/portal/mail-studio/index.html
          grep -q 'Sync Health' apps/portal/assets/mail-sync-center-ui-v1.js
          grep -q 'Reply in Compose' apps/portal/assets/mail-sync-center-ui-v1.js
          grep -q 'sandbox="allow-popups allow-popups-to-escape-sandbox"' apps/portal/assets/mail-sync-center-ui-v1.js
          ! grep -q 'wrangler deploy' apps/portal/assets/mail-sync-center-ui-v1.js
