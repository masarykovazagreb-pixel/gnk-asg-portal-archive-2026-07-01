name: Publication Sitemap Registry Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publication-sitemap-registry-gate.yml'
      - 'scripts/validate_publication_sitemap_registry_v1.py'
      - 'apps/portal/sitemap.xml'
      - 'apps/portal/data/editorial-plan/**'
      - 'apps/portal/objave/**'
      - 'apps/portal/komentari/**'
      - 'apps/portal/analize/**'
      - 'apps/portal/publications/**'
      - 'apps/portal/comments/**'
      - 'apps/portal/analysis/**'

permissions:
  contents: read

concurrency:
  group: publication-sitemap-registry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate approved routes, sitemap lastmod and publication registry
        run: python scripts/validate_publication_sitemap_registry_v1.py
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-sitemap-registry-${{ github.sha }}
          path: artifacts/publication-sitemap-registry/report.json
          if-no-files-found: error
          retention-days: 1
