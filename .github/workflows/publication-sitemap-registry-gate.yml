name: Publication Sitemap Registry Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publication-sitemap-registry-gate.yml'
      - 'scripts/validate_publication_sitemap_registry_v1.py'
      - 'scripts/editorial-registry-v1.mjs'
      - 'scripts/lib/seo-description-v1.mjs'
      - 'scripts/test-seo-description-v1.mjs'
      - 'scripts/test-editorial-publish-seo-v1.mjs'
      - 'scripts/validate-direct-static-editorial-v1.mjs'
      - 'scripts/test-direct-static-editorial-v1.mjs'
      - 'scripts/generate-editorial-sitemap-v2.mjs'
      - 'scripts/audit-editorial-publication-completeness-v1.mjs'
      - 'scripts/apply-editorial-publication-completeness-v1.mjs'
      - 'scripts/build-editorial-archive-listings-v1.mjs'
      - 'scripts/build-aktual-columns-index-v1.mjs'
      - 'scripts/build-aktual-media-weekly-archive-v1.mjs'
      - 'scripts/build-aktual-media-weekly-v1.mjs'
      - 'scripts/generate-editorial-cover-assets-v1.mjs'
      - 'scripts/generate-aktual-weekly-cover-assets-v1.mjs'
      - 'scripts/generate_aktual_columns.py'
      - 'scripts/generate-kolumna-page.mjs'
      - 'scripts/kolumne-publish-v1.mjs'
      - 'scripts/lib/editorial-cover-art-v1.mjs'
      - 'scripts/lib/editorial-route-protection-v1.mjs'
      - 'scripts/test-editorial-route-protection-v1.mjs'
      - 'scripts/validate_aktual_columns.py'
      - 'scripts/lib/publication-gate-v2.mjs'
      - 'scripts/validate-workflow-schedule-allowlist-v2.py'
      - 'ops/production-workflow-allowlist-v2.json'
      - '.github/workflows/**'
      - 'apps/portal/editorial-sitemap.xml'
      - 'apps/portal/sitemap-index.xml'
      - 'apps/portal/data/editorial-registry.json'
      - 'apps/portal/data/editorial-image-manifest.json'
      - 'apps/portal/data/kolumne.json'
      - 'apps/portal/data/news.json'
      - 'apps/portal/data/aktual-weekly-curation.json'
      - 'apps/portal/data/aktual-weekly.json'
      - 'apps/portal/data/aktual-weekly-archives/**'
      - 'apps/portal/data/aktual-weekly-image-manifest.json'
      - 'apps/portal/assets/aktual-media-*'
      - 'apps/portal/assets/editorial-content-v2.css'
      - 'apps/portal/assets/editorial/generated/**'
      - 'apps/portal/gnk-aktual/**'
      - 'apps/portal/en/gnk-aktual/**'
      - 'apps/portal/objave/**'
      - 'apps/portal/komentari/**'
      - 'apps/portal/analize/**'
      - 'apps/portal/publications/**'
      - 'apps/portal/comments/**'
      - 'apps/portal/analysis/**'
      - 'apps/portal/en/publications/**'
      - 'apps/portal/en/commentary/**'
      - 'apps/portal/en/analyses/**'

permissions:
  contents: read

concurrency:
  group: publication-sitemap-registry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce canonical editorial registry and sitemap
        run: |
          set -euo pipefail
          mkdir -p artifacts/publication-sitemap-registry/reproduced
          cp apps/portal/data/editorial-registry.json "$RUNNER_TEMP/editorial-registry.json"
          cp apps/portal/editorial-sitemap.xml "$RUNNER_TEMP/editorial-sitemap.xml"
          cp apps/portal/sitemap-index.xml "$RUNNER_TEMP/sitemap-index.xml"

          node scripts/editorial-registry-v1.mjs
          cp apps/portal/data/editorial-registry.json artifacts/publication-sitemap-registry/reproduced/editorial-registry.json
          set +e
          diff -u "$RUNNER_TEMP/editorial-registry.json" apps/portal/data/editorial-registry.json > artifacts/publication-sitemap-registry/reproduced/editorial-registry.diff
          registry_rc=$?
          set -e

          cp apps/portal/editorial-sitemap.xml artifacts/publication-sitemap-registry/reproduced/editorial-sitemap.xml
          cp apps/portal/sitemap-index.xml artifacts/publication-sitemap-registry/reproduced/sitemap-index.xml
          set +e
          diff -u "$RUNNER_TEMP/editorial-sitemap.xml" apps/portal/editorial-sitemap.xml > artifacts/publication-sitemap-registry/reproduced/editorial-sitemap.diff
          sitemap_rc=$?
          diff -u "$RUNNER_TEMP/sitemap-index.xml" apps/portal/sitemap-index.xml > artifacts/publication-sitemap-registry/reproduced/sitemap-index.diff
          index_rc=$?
          set -e

          if [ "$registry_rc" -ne 0 ]; then
            echo "::warning::Editorial registry metadata drift detected. SEO completeness was validated; inspect the uploaded registry diff and let the canonical publisher persist metadata convergence."
          fi
          if [ "$sitemap_rc" -ne 0 ] || [ "$index_rc" -ne 0 ]; then
            echo "::error::Canonical editorial sitemap artifacts drift from their generator. Review the uploaded reproduced artifacts." >&2
            exit 1
          fi
      - name: Validate published routes, lastmod and canonical registry
        run: python scripts/validate_publication_sitemap_registry_v1.py
      - name: Verify weekly curation digest is materialized
        run: node scripts/build-aktual-media-weekly-v1.mjs --check
      - name: Enforce editorial publication completeness
        run: node scripts/audit-editorial-publication-completeness-v1.mjs
      - name: Validate AKTUAL column archives and editorial feed links
        run: python scripts/validate_aktual_columns.py
      - name: Enforce production workflow schedule allowlist
        run: python scripts/validate-workflow-schedule-allowlist-v2.py
      - name: Enforce exact-SHA release-race hygiene
        run: python scripts/validate-release-race-hygiene-v1.py
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-sitemap-registry-${{ github.sha }}
          path: artifacts/publication-sitemap-registry/
          if-no-files-found: error
          retention-days: 1
