name: Check news source errors (one-off)
on:
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run news refresh and capture output
        run: |
          cd apps/portal/scripts
          python3 refresh_news_policy.py > /tmp/out.txt 2>&1 || true
          echo "# News source errors $(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/d.md
          echo '```' >> /tmp/d.md
          cat /tmp/out.txt >> /tmp/d.md
          echo '```' >> /tmp/d.md
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" --title "News source errors $(date -u +%Y-%m-%dT%H:%M:%SZ)" --body-file /tmp/d.md
