name: Puni audit 2

on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'

permissions:
  contents: read

concurrency:
  group: audit2
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Pokreni puni audit
        run: bash audit2_script.sh

      - name: Sazetak
        if: always()
        run: |
          if [ -f apps/portal/data/tmp-audit2/r.txt ]; then
            ukupno=$(wc -l < apps/portal/data/tmp-audit2/r.txt)
            ok=$(grep -c '^200 ' apps/portal/data/tmp-audit2/r.txt || true)
            fail=$(grep -vc '^200 ' apps/portal/data/tmp-audit2/r.txt || true)
            {
              echo "## Puni audit 2"
              echo "- Ukupno: **${ukupno}** | OK: **${ok}** | Ne-200: **${fail}**"
              if [ "$fail" -gt 0 ]; then
                echo '```'
                grep -v '^200 ' apps/portal/data/tmp-audit2/r.txt || true
                echo '```'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Spremi rezultate kao artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit2-results-${{ github.run_id }}
          path: apps/portal/data/tmp-audit2
          if-no-files-found: warn
          retention-days: 30

      - name: Potvrdi da audit ne pise u main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if ! git diff --quiet -- . ':!apps/portal/data/tmp-audit2'; then
            echo "Audit2 je neocekivano promijenio datoteke izvan privremenih rezultata."
            git status --short
            exit 1
          fi
          echo "Audit2 je read-only; rezultati ostaju runner-local i spremaju se kao artifact."
