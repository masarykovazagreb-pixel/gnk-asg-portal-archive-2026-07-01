name: PR404 - Rebuild Prenos Data Only

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr404-prenos-regenerate.yml
  push:
    branches:
      - feat/aktual-world-ci-release-20261109
    paths:
      - .github/workflows/pr404-prenos-regenerate.yml

permissions:
  contents: write

concurrency:
  group: pr404-prenos-data
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.repository == 'masarykovazagreb-pixel/gnk-asg-portal-archive-2026-07-01' && ((github.event_name == 'pull_request' && github.event.pull_request.number == 404 && github.head_ref == 'feat/aktual-world-ci-release-20261109') || (github.event_name == 'push' && github.ref == 'refs/heads/feat/aktual-world-ci-release-20261109'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aktual-world-ci-release-20261109
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce canonical prenos data, never alter editorial sources
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-prenos-hub-v1.mjs
          git diff --check
          node scripts/build-prenos-hub-v1.mjs --check
          changed="$(git diff --name-only)"
          if [ -n "$changed" ] && [ "$changed" != 'apps/portal/data/prenos-network-v1.json' ]; then
            echo "::error::Unexpected generated changes; refusing to commit: $changed"
            exit 1
          fi
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Commit only canonical prenos snapshot to development branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/portal/data/prenos-network-v1.json; then
            echo 'Prenos registry already in sync'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/portal/data/prenos-network-v1.json
          git diff --cached --name-only | grep -Fx 'apps/portal/data/prenos-network-v1.json'
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '1'
          git commit -m "build(prenos): materialize canonical network registry on PR404"
          # Non-force push fails safely on concurrent changes.
          git push origin HEAD:refs/heads/feat/aktual-world-ci-release-20261109
