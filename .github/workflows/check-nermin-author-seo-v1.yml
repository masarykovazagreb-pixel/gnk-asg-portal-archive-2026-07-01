name: Check Nermin Author SEO V1

on:
  pull_request:
    paths:
      - 'apps/portal/gnk-aktual/kolumne/index.html'
      - 'apps/portal/en/gnk-aktual/columns/index.html'
      - 'apps/portal/autorske-objave/index.html'
      - 'apps/portal/en/autorske-objave/index.html'
      - 'apps/portal/nermin-sefic/index.html'
      - 'apps/portal/index.html'
      - 'apps/portal/en/index.html'
      - 'apps/portal/komentari/index.html'
      - 'apps/portal/en/commentary/index.html'
      - 'apps/portal/favicon.svg'
      - 'apps/shared/brand/favicon.svg'
      - 'apps/portal/assets/favicon.svg'
      - 'scripts/lib/sitewide-meta-enrichment-v1.mjs'
      - 'scripts/lib/seo-topic-taxonomy-v1.mjs'
      - 'scripts/sitewide-seo-meta-v1.mjs'
      - 'scripts/test-sitewide-semantic-seo-v1.mjs'
      - 'scripts/apply-network-entity-v1.mjs'
      - 'apps/portal/robots.txt'
      - 'apps/portal/sitemap.xml'
      - 'apps/portal/scripts/generate_seo.py'
      - 'docs/editorial/nermin-sefic-20-komentara-nacrti-2026-11-06.md'
      - 'scripts/test-asg-public-seo-release-v1.mjs'
      - 'apps/portal/en/nermin-sefic/index.html'
      - 'apps/portal/data/approved_mentions.json'
      - 'scripts/test-nermin-author-seo-v1.mjs'
      - '.github/workflows/check-nermin-author-seo-v1.yml'
  push:
    branches: [main]
    paths:
      - 'apps/portal/gnk-aktual/kolumne/index.html'
      - 'apps/portal/en/gnk-aktual/columns/index.html'
      - 'apps/portal/autorske-objave/index.html'
      - 'apps/portal/en/autorske-objave/index.html'
      - 'apps/portal/nermin-sefic/index.html'
      - 'apps/portal/index.html'
      - 'apps/portal/en/index.html'
      - 'apps/portal/komentari/index.html'
      - 'apps/portal/en/commentary/index.html'
      - 'apps/portal/favicon.svg'
      - 'apps/shared/brand/favicon.svg'
      - 'apps/portal/assets/favicon.svg'
      - 'scripts/lib/sitewide-meta-enrichment-v1.mjs'
      - 'scripts/lib/seo-topic-taxonomy-v1.mjs'
      - 'scripts/sitewide-seo-meta-v1.mjs'
      - 'scripts/test-sitewide-semantic-seo-v1.mjs'
      - 'scripts/apply-network-entity-v1.mjs'
      - 'apps/portal/robots.txt'
      - 'apps/portal/sitemap.xml'
      - 'apps/portal/scripts/generate_seo.py'
      - 'docs/editorial/nermin-sefic-20-komentara-nacrti-2026-11-06.md'
      - 'scripts/test-asg-public-seo-release-v1.mjs'
      - 'apps/portal/en/nermin-sefic/index.html'
      - 'apps/portal/data/approved_mentions.json'
      - 'scripts/test-nermin-author-seo-v1.mjs'
      - '.github/workflows/check-nermin-author-seo-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Nermin Sefić entity and author SEO contract
        run: |
          node scripts/test-nermin-author-seo-v1.mjs
          node scripts/test-asg-public-seo-release-v1.mjs
          node scripts/test-sitewide-semantic-seo-v1.mjs
