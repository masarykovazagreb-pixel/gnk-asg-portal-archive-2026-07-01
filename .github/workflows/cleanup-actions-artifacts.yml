name: Cleanup old Actions artifacts

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DELETE to remove Actions artifacts older than 1 day
        required: true
        default: DELETE

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Delete artifacts older than 1 day
    runs-on: ubuntu-latest

    steps:
      - name: Remove old workflow artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail

          if [ "$CONFIRM" != "DELETE" ]; then
            echo "Confirmation did not match DELETE. Nothing was removed."
            exit 1
          fi

          cutoff_epoch="$(date -u -d '1 day ago' +%s)"
          deleted=0
          kept=0

          while IFS=$'\t' read -r artifact_id artifact_name created_at size_bytes; do
            [ -z "${artifact_id:-}" ] && continue
            created_epoch="$(date -u -d "$created_at" +%s)"

            if [ "$created_epoch" -lt "$cutoff_epoch" ]; then
              echo "Deleting artifact: $artifact_name (ID $artifact_id, created $created_at, ${size_bytes} bytes)"
              gh api \
                --method DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/$REPO/actions/artifacts/$artifact_id"
              deleted=$((deleted + 1))
            else
              echo "Keeping recent artifact: $artifact_name (created $created_at)"
              kept=$((kept + 1))
            fi
          done < <(
            gh api \
              --paginate \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$REPO/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | [.id, .name, .created_at, .size_in_bytes] | @tsv'
          )

          echo "Deleted artifacts: $deleted"
          echo "Kept artifacts from the last day: $kept"

          {
            echo "### Actions artifact cleanup"
            echo "- Deleted artifacts older than 1 day: $deleted"
            echo "- Kept artifacts from the last day: $kept"
          } >> "$GITHUB_STEP_SUMMARY"
