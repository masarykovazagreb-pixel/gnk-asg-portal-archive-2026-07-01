name: Issue-triggered News V16 production validation

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: contains(github.event.issue.title, 'GNK ASG production validation')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Announce validation
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 120 --body "Issue-triggered News V16 validation **STARTED** · ${RUN_URL}"
          gh issue comment "${{ github.event.issue.number }}" --body "Production validation started: ${RUN_URL}"
      - name: Validate and deploy current main
        run: |
          set -euxo pipefail
          node --check workers/gnk-asg-direct-operator/src/news-curation-v10.js
          node --check workers/gnk-asg-direct-operator/src/index-news-lifecycle-v12.js
          node --check workers/gnk-asg-direct-operator/src/index-portal-experience-v10.js
          node --check apps/portal/assets/business-news-v16.js
          grep -q 'GNK_ASG_NEWS_LIFECYCLE_V16_VERIFIED_MEDIA_20260626' workers/gnk-asg-direct-operator/src/news-curation-v10.js
          grep -q 'export const ARCHIVE_PRUNE_AT=900' workers/gnk-asg-direct-operator/src/news-curation-v10.js
          grep -q 'export const ARCHIVE_RETAIN_AFTER_PRUNE=450' workers/gnk-asg-direct-operator/src/news-curation-v10.js
          npx --yes wrangler@4 deploy --config workers/gnk-asg-direct-operator/wrangler.toml
      - name: Warm and verify production
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node <<'JS' 2>&1 | tee validation.log
          const fs=require('node:fs');
          const base='https://gnk-asg.hr';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(path,timeout=420000){try{const response=await fetch(`${base}${path}${path.includes('?')?'&':'?'}cb=${Date.now()}`,{headers:{accept:'application/json,text/html;q=0.9','cache-control':'no-cache'},signal:AbortSignal.timeout(timeout)});return{status:response.status,text:await response.text()}}catch(error){return{status:0,text:'',error:String(error)}}}
          const valid=item=>Boolean(item?.verified&&item?.verification?.article?.ok&&item?.verification?.image?.ok&&/^https?:\/\//i.test(item?.url||'')&&/^https?:\/\//i.test(item?.image||'')&&!/news-fallback\.svg/i.test(item?.image||'')&&String(item?.summary||'').trim().length>=60&&String(item?.source||'').trim());
          (async()=>{
            const warm=await get('/data/news.json?warm=1');
            let report={warmStatus:warm.status,failures:['not_checked']};
            for(let attempt=1;attempt<=10;attempt++){
              const [feedResponse,statusResponse,archiveResponse,hr,en,visual]=await Promise.all([get('/data/news.json',60000),get('/data/news-automation-status.json',60000),get('/data/news-archive.json',60000),get('/vijesti/',60000),get('/news/',60000),get('/visual-index/?lang=en',60000)]);
              let feed={},status={},archive={};try{feed=JSON.parse(feedResponse.text)}catch{}try{status=JSON.parse(statusResponse.text)}catch{}try{archive=JSON.parse(archiveResponse.text)}catch{}
              const items=Array.isArray(feed.items)?feed.items:[],invalid=items.filter(item=>!valid(item)),failures=[];
              if(feedResponse.status!==200)failures.push(`feed_http=${feedResponse.status}`);
              if(feed.version!=='GNK_ASG_NEWS_LIFECYCLE_V16_VERIFIED_MEDIA_20260626')failures.push(`version=${feed.version||'missing'}`);
              if(items.length<15||items.length>100)failures.push(`items=${items.length}`);
              if(invalid.length)failures.push(`invalid=${invalid.length}`);
              if(status.newsRefreshesPerDay!==3||status.minimumVerifiedLinks!==15)failures.push('schedule_contract');
              if(status.archivePruneAt!==900||status.archiveRetainAfterPrune!==450||status.archiveHardLimit!==1000)failures.push('archive_contract');
              if(Number(archive.count||0)>1000)failures.push(`archive_count=${archive.count}`);
              if(hr.status!==200||!hr.text.includes('business-news-v16.js'))failures.push(`hr=${hr.status}`);
              if(en.status!==200||!en.text.includes('business-news-v16.js'))failures.push(`en=${en.status}`);
              if(visual.status!==200)failures.push(`visual=${visual.status}`);
              report={checkedAt:new Date().toISOString(),attempt,warmStatus:warm.status,failures,feed:{status:feed.status,count:items.length,freshCount:feed.freshCount,verifiedCount:feed.verifiedCount,successfulSourceCount:feed.successfulSourceCount,updatedAt:feed.updatedAt},automation:{schedule:status.newsSchedule,lastNewsRefresh:status.lastNewsRefresh},archive:{count:archive.count,pruneAt:archive.pruneAt,retainAfterPrune:archive.retainAfterPrune,hardLimit:archive.hardLimit},codes:{feed:feedResponse.status,status:statusResponse.status,archive:archiveResponse.status,hr:hr.status,en:en.status,visual:visual.status}};
              fs.writeFileSync('validation.json',JSON.stringify(report,null,2));
              console.log(JSON.stringify(report));
              if(!failures.length)process.exit(0);
              await sleep(15000);
            }
            process.exit(1);
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-v16-issue-validation
          path: |
            validation.json
            validation.log
          if-no-files-found: warn
      - name: Report validation result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report=$(cat validation.json 2>/dev/null || printf '{"error":"validation report unavailable"}')
          body="News V16 production validation **${VERIFY_OUTCOME}** · ${RUN_URL}\n\n\`\`\`json\n${report}\n\`\`\`"
          gh issue comment 120 --body "$body"
          gh issue comment "${{ github.event.issue.number }}" --body "$body"
      - name: Enforce validation
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: test "$VERIFY_OUTCOME" = success
