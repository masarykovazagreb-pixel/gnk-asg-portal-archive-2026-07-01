name: Check Digital Workforce Root SEO

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/portal/digital-workforce/index.html'
      - '.github/workflows/check-digital-workforce-root-seo.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate root metadata and schema
        run: |
          set -euxo pipefail
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('apps/portal/digital-workforce/index.html','utf8');
          const required=[
            '<title>','name="description"','noindex,nofollow,noarchive','rel="canonical"',
            'hreflang="en"','property="og:title"','property="og:description"','property="og:image"',
            'property="og:image:alt"','name="twitter:card"','name="twitter:title"',
            'name="twitter:description"','name="twitter:image"','/digital-workforce/directory/',
            '/digital-workforce/protocols/','/about-the-group/','/the-code/intelligence/'
          ];
          for(const token of required){if(!html.includes(token))throw new Error(`missing ${token}`);}
          const match=html.match(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/);
          if(!match)throw new Error('schema.org JSON-LD missing');
          const schema=JSON.parse(match[1]);
          const graph=schema['@graph']||[];
          for(const type of ['Organization','WebSite','WebPage','BreadcrumbList']){
            if(!graph.some(item=>item['@type']===type))throw new Error(`schema type missing ${type}`);
          }
          if(graph.some(item=>item['@type']==='Person'))throw new Error('Person schema is not relevant on Digital Workforce root');
          console.log('DIGITAL_WORKFORCE_ROOT_SEO_OK');
          NODE
