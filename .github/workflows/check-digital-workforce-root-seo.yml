name: Check Digital Workforce Root SEO

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/portal/digital-workforce/index.html'
      - 'apps/portal/en/digital-workforce/index.html'
      - '.github/workflows/check-digital-workforce-root-seo.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate public simulation metadata and schema
        run: |
          set -euxo pipefail
          node <<'NODE'
          const fs=require('fs');
          const pages=[
            ['apps/portal/digital-workforce/index.html','https://gnk-asg.hr/digital-workforce/','https://gnk-asg.hr/en/digital-workforce/','JAVNA SIMULACIJA'],
            ['apps/portal/en/digital-workforce/index.html','https://gnk-asg.hr/en/digital-workforce/','https://gnk-asg.hr/digital-workforce/','PUBLIC SIMULATION']
          ];
          for(const [file,canonical,alternate,simulationLabel] of pages){
            const html=fs.readFileSync(file,'utf8');
            const required=[
              '<title>','name="description"','index,follow,max-image-preview:large','rel="canonical"',
              canonical,alternate,'hreflang="en"','property="og:title"','property="og:description"',
              'property="og:image"','property="og:image:alt"','name="twitter:card"','name="twitter:title"',
              'name="twitter:description"','name="twitter:image"','application/ld+json',simulationLabel,
              'data-dw-tab="ideas"','<h1>'
            ];
            for(const token of required){if(!html.includes(token))throw new Error(`${file}: missing ${token}`);}
            if(html.includes('noindex,nofollow,noarchive'))throw new Error(`${file}: public simulation must not retain a noindex review lock`);
            const match=html.match(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/);
            if(!match)throw new Error(`${file}: schema.org JSON-LD missing`);
            const schema=JSON.parse(match[1]);
            if(schema['@type']!=='WebApplication')throw new Error(`${file}: WebApplication schema missing`);
            if(schema.publisher?.['@type']!=='Organization')throw new Error(`${file}: Organization publisher missing`);
            if(schema.editor?.['@type']!=='Person'||schema.editor?.name!=='Nermin Sefić')throw new Error(`${file}: attributable human editor missing`);
          }
          console.log('DIGITAL_WORKFORCE_ROOT_PUBLIC_SEO_OK');
          NODE
