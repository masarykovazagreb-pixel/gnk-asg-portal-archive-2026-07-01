name: World Monitor Data Refresh (free sources)

on:
  workflow_dispatch:
  schedule:
    - cron: '20 1,7,13,19 * * *'  # four times daily; Control Plane V2

permissions:
  contents: write

concurrency:
  group: gnk-asg-main-mutation
  cancel-in-progress: false

jobs:
  refresh:
    if: vars.GNK_ASG_RELEASE_FENCE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch World Monitor data (USGS, GDELT, World Bank)
        run: node scripts/world-monitor-refresh-v1.mjs
      - name: Commit if changed
        shell: bash
        run: |
          set -euo pipefail
          expected_base="$(git rev-parse HEAD)"
          git config user.name "gnk-worldmonitor-bot"
          git config user.email "actions@github.com"
          git add apps/portal/data/world-monitor.json
          if git diff --cached --quiet; then
            echo "Nema promjena."
            exit 0
          fi
          git commit -m "World Monitor: refresh data (free sources)"

          # Exact-SHA writer fence: never rebase generated intelligence state
          # onto a main revision different from the snapshot used to compute it.
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          if [ "$current_main" != "$expected_base" ]; then
            echo "Main moved during World Monitor refresh: expected $expected_base, found $current_main. Deferring without rebase/push."
            exit 75
          fi

          # Final compare-and-swap guard via ordinary non-force push.
          git push origin HEAD:main
