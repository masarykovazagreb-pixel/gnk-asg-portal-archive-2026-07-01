name: Media Center readiness audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/media-readiness-audit.yml'

permissions:
  contents: write

concurrency:
  group: gnk-asg-media-readiness-audit
  cancel-in-progress: true

jobs:
  audit:
    if: vars.GNK_ASG_RELEASE_FENCE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: 2116c4e5-1850-4888-91e7-c47deead3ced
      KV_NAMESPACE_ID: a3e9e78c7d554d7fa10996da9a89e7bc
      R2_BUCKET: gnk-asg-media-assets
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Read Media Center stores
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"
          query(){
            local sql="$1" out="$2"
            jq -n --arg sql "$sql" '{sql:$sql}' | curl -fsS -X POST "$api" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @- > "$out"
            jq -e '.success == true' "$out" >/dev/null
          }
          query "SELECT COUNT(*) AS total, SUM(CASE WHEN email IS NOT NULL AND TRIM(email)<>'' THEN 1 ELSE 0 END) AS with_email, SUM(CASE WHEN automation_allowed=1 THEN 1 ELSE 0 END) AS automation_allowed, SUM(CASE WHEN approved=1 THEN 1 ELSE 0 END) AS approved FROM media_outreach_contacts" /tmp/contact-summary.json
          query "SELECT COUNT(*) AS ready FROM media_outreach_contacts c LEFT JOIN media_outreach_contact_controls ctrl ON ctrl.mail_code=c.mail_code LEFT JOIN media_suppressions s ON LOWER(s.email)=LOWER(c.email) WHERE c.approved=1 AND c.automation_allowed=1 AND c.email<>'' AND s.email IS NULL AND ctrl.operational_status='READY'" /tmp/ready-summary.json
          query "SELECT c.mail_code,c.outlet,c.email,c.country,c.language,c.priority,c.recipient_name,c.recipient_title,c.person_status,c.channel_status,c.note,c.approved,c.automation_allowed,ctrl.operational_status,ctrl.blocked_reason,ctrl.requires_personalization,ctrl.to_email,ctrl.cc_email FROM media_outreach_contacts c LEFT JOIN media_outreach_contact_controls ctrl ON ctrl.mail_code=c.mail_code LEFT JOIN media_suppressions s ON LOWER(s.email)=LOWER(c.email) WHERE c.email<>'' AND c.automation_allowed=1 AND s.email IS NULL ORDER BY CASE c.priority WHEN 'A' THEN 0 WHEN 'B' THEN 1 ELSE 2 END,c.country,c.outlet" /tmp/candidates.json
          query "SELECT LOWER(email) AS email,COUNT(*) AS count,GROUP_CONCAT(outlet,' | ') AS outlets FROM media_outreach_contacts WHERE email IS NOT NULL AND TRIM(email)<>'' GROUP BY LOWER(email) HAVING COUNT(*)>1 ORDER BY count DESC,email" /tmp/duplicates.json
          query "SELECT status,COUNT(*) AS count FROM media_delivery_queue GROUP BY status ORDER BY status" /tmp/queue.json
          query "SELECT recipient,subject,pdf_key,pdf_sha256,status,created_at FROM media_delivery_tests ORDER BY created_at DESC LIMIT 10" /tmp/tests.json

          kv_get(){
            local key="$1" out="$2" encoded code
            encoded=$(jq -rn --arg value "$key" '$value|@uri')
            code=$(curl -sS -o "$out" -w '%{http_code}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$KV_NAMESPACE_ID/values/$encoded" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            if [ "$code" != '200' ]; then printf '{}' > "$out"; fi
            jq empty "$out" 2>/dev/null || printf '{}' > "$out"
          }
          kv_get 'media-command-center:campaign:v1' /tmp/campaign.json
          kv_get 'media-command-center:delivery-test:v1' /tmp/test-gate.json

          pdf_key=$(jq -r '.pdfR2Key // empty' /tmp/campaign.json)
          if [ -z "$pdf_key" ]; then
            pdf_key='media-outreach/campaigns/new-york-2026/GNK_ASG_Media_Invitation_New_York_2026_HR_EN.pdf'
          fi
          printf '%s' "$pdf_key" > /tmp/pdf-key.txt
          cd workers/gnk-asg-direct-operator
          if npx --yes wrangler@4 r2 object get "$R2_BUCKET/$pdf_key" --file=/tmp/media-campaign.pdf --remote; then
            test "$(head -c 5 /tmp/media-campaign.pdf)" = '%PDF-'
            stat -c %s /tmp/media-campaign.pdf > /tmp/pdf-size.txt
            sha256sum /tmp/media-campaign.pdf | awk '{print $1}' > /tmp/pdf-sha.txt
          else
            printf '0' > /tmp/pdf-size.txt
            printf '' > /tmp/pdf-sha.txt
          fi

      - name: Build private audit JSON
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime
          import json
          import pathlib
          def rows(path):
              raw=json.loads(pathlib.Path(path).read_text())
              result=(raw.get('result') or [{}])[0]
              return result.get('results') or []
          def obj(path):
              try:
                  return json.loads(pathlib.Path(path).read_text())
              except Exception:
                  return {}
          summary=(rows('/tmp/contact-summary.json') or [{}])[0]
          ready=(rows('/tmp/ready-summary.json') or [{}])[0]
          candidates=rows('/tmp/candidates.json')
          duplicates=rows('/tmp/duplicates.json')
          queue=rows('/tmp/queue.json')
          tests=rows('/tmp/tests.json')
          campaign=obj('/tmp/campaign.json')
          gate=obj('/tmp/test-gate.json')
          pdf_key=pathlib.Path('/tmp/pdf-key.txt').read_text().strip()
          pdf_sha=pathlib.Path('/tmp/pdf-sha.txt').read_text().strip()
          pdf_size=int(pathlib.Path('/tmp/pdf-size.txt').read_text().strip() or 0)
          pdf={
              'key':pdf_key,
              'sizeBytes':pdf_size,
              'sha256':pdf_sha,
              'valid':bool(pdf_size and pdf_sha),
              'campaignHashMatches':not campaign.get('pdfSha256') or campaign.get('pdfSha256')==pdf_sha,
              'testGateHashMatches':not gate.get('pdfSha256') or gate.get('pdfSha256')==pdf_sha,
          }
          reasons=[]
          if not ready.get('ready'):
              reasons.append('no_approved_ready_contacts')
          if gate.get('passed') is not True:
              reasons.append('valid_test_gate_missing')
          if not pdf['valid']:
              reasons.append('campaign_pdf_missing_or_invalid')
          if not pdf['campaignHashMatches']:
              reasons.append('campaign_pdf_hash_mismatch')
          if not pdf['testGateHashMatches']:
              reasons.append('test_gate_pdf_hash_mismatch')
          if duplicates:
              reasons.append('duplicate_recipient_addresses')
          result={
              'auditedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'contactsSummary':summary,
              'readySummary':ready,
              'automationCandidates':candidates,
              'duplicateEmails':duplicates,
              'queueSummary':queue,
              'deliveryTests':tests,
              'campaign':campaign,
              'testGate':gate,
              'pdf':pdf,
              'productionReady':not reasons,
              'blockingReasons':reasons,
          }
          pathlib.Path('ops/media-readiness-audit.json').write_text(
              json.dumps(result,ensure_ascii=False,indent=2)+'\n',
              encoding='utf-8'
          )
          PY

      - name: Persist private audit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GNK ASG Media Audit'
          git config user.email 'media@gnk-asg.hr'
          git add ops/media-readiness-audit.json
          git commit -m 'Record Media Center readiness audit [skip ci]' || exit 0
          git pull --rebase origin main
          git push
