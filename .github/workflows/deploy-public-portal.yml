name: Deploy public portal

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-public-portal.yml"
      - "apps/portal/**"
      - "workers/gnk-asg-direct-operator/src/**"
      - "workers/gnk-asg-direct-operator/migrations/**"
      - "workers/gnk-asg-direct-operator/wrangler.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnk-asg-canonical-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Verify package and locked index layout
        shell: bash
        run: |
          set -euxo pipefail
          node --check apps/portal/assets/admin-hub-v21.js
          node --check apps/portal/assets/admin-session-fallback-v17.js
          node --check apps/portal/assets/mail-studio-auth-bridge-v16.js
          node --check apps/portal/assets/media-command-center-v2.js
          node --check apps/portal/assets/media-command-handoff-ui-v3.js
          node --check apps/portal/assets/media-outreach-delivery-ui-v3.js
          node --check apps/portal/assets/index-content-resilience-v1.js
          node --check apps/portal/assets/index-live-market-chart-v4.js
          node --check workers/gnk-asg-direct-operator/src/public-shell-v11.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v21.js
          node --check workers/gnk-asg-direct-operator/src/index-lock-v4.js
          node --check workers/gnk-asg-direct-operator/src/index-public-r2-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-server-hydration-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-article-automation-v2.js
          node --check workers/gnk-asg-direct-operator/src/article-visual-v2.js
          node --check workers/gnk-asg-direct-operator/src/index-media-command-center-v21.js
          node --check workers/gnk-asg-direct-operator/src/index-mail-studio-bridge-v15.js
          node --check workers/gnk-asg-direct-operator/src/media-command-center-v2.js
          node --check workers/gnk-asg-direct-operator/src/media-command-readiness-v2.js
          node --check workers/gnk-asg-direct-operator/src/media-outreach-delivery-v3.js
          test -s apps/portal/assets/index-stable-polish-v30.css
          test -s workers/gnk-asg-direct-operator/migrations/0001_media_command_controls.sql
          grep -q 'main = "src/index-admin-hub-v21.js"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'MEDIA_OUTREACH_LIVE = "false"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'MEDIA_OUTREACH_TEST_LIVE = "false"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'GNK_ASG_PUBLIC_VISUAL_V30_CLEAN_POLISH_20260626' workers/gnk-asg-direct-operator/src/public-shell-v11.js
          grep -q 'INDEX_STABLE_POLISH_V30' workers/gnk-asg-direct-operator/src/public-shell-v11.js
          grep -q 'index-stable-polish-v30.css' apps/portal/assets/index-redesign-production.css
          if grep -q '/assets/iq200/' apps/portal/assets/index-redesign-production.css; then
            echo 'Conflicting IQ200 index layers detected' >&2
            exit 1
          fi
          grep -q 'STABLE_SINGLE_MENU_NO_POLISH' workers/gnk-asg-direct-operator/src/public-shell-v11.js
          if grep -q 'function patchIndexHero' workers/gnk-asg-direct-operator/src/public-shell-v11.js; then
            echo 'Forbidden index hero injector detected' >&2
            exit 1
          fi
          if grep -E -q 'const indexHead=.*index-polish-v1\.css' workers/gnk-asg-direct-operator/src/public-shell-v11.js; then
            echo 'Forbidden legacy index polish stylesheet injection detected' >&2
            exit 1
          fi
          grep -q 'GNK_ASG_INDEX_SERVER_HYDRATION_V1_20260626' workers/gnk-asg-direct-operator/src/index-server-hydration-v1.js
          grep -q 'GNK_ASG_PUBLIC_R2_V1_20260626' workers/gnk-asg-direct-operator/src/index-public-r2-v1.js
          grep -q 'GNK_ASG_MEDIA_OUTREACH_DELIVERY_V3_20260626' workers/gnk-asg-direct-operator/src/media-outreach-delivery-v3.js
          grep -q 'COOKIE_ONLY' apps/portal/assets/admin-session-fallback-v17.js
          grep -q 'COOKIE_ONLY' apps/portal/assets/mail-studio-auth-bridge-v16.js
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator

      - name: Apply D1 migrations
        id: d1
        continue-on-error: true
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4 d1 migrations apply gnk_asg_operator_logs --remote --config wrangler.toml 2>&1 | tee /tmp/gnk-d1-migration.log

      - name: Deploy to Cloudflare
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator

      - name: Verify production index and protected routes
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const base='https://gnk-asg.hr';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function get(path,redirect='follow'){
            try{
              const response=await fetch(`${base}${path}${path.includes('?')?'&':'?'}cb=${Date.now()}`,{redirect,headers:{'cache-control':'no-cache'}});
              return {status:response.status,text:await response.text(),headers:Object.fromEntries(response.headers)};
            }catch(error){return {status:0,text:'',headers:{},error:String(error)};}
          }
          let last;
          for(let attempt=1;attempt<=18;attempt++){
            const [deployment,health,root,en,content,market,polish,favicon,manifest,mediaApi,deliveryApi,admin]=await Promise.all([
              get('/data/deployment-status.json'),get('/data/platform-health.json'),get('/'),get('/en/'),
              get('/assets/index-content-resilience-v1.js'),get('/assets/index-live-market-chart-v4.js'),
              get('/assets/index-stable-polish-v30.css'),get('/favicon.svg'),get('/site.webmanifest'),
              get('/api/media-command-center/status','manual'),get('/api/media-command-center/delivery-status','manual'),get('/operator-dashboard/','manual')
            ]);
            let status=null;try{status=JSON.parse(deployment.text);}catch{}
            let healthData=null;try{healthData=JSON.parse(health.text);}catch{}
            const failures=[];
            if(deployment.status!==200||!status?.ok)failures.push(`deployment=${deployment.status}`);
            if(status?.entryPoint!=='src/index-admin-hub-v21.js')failures.push(`entryPoint=${JSON.stringify(status?.entryPoint)}`);
            if(status?.indexLock!=='GNK_ASG_INDEX_LOCK_V4_20260626')failures.push(`indexLock=${JSON.stringify(status?.indexLock)}`);
            if(status?.indexHydration!=='GNK_ASG_INDEX_SERVER_HYDRATION_V1_20260626')failures.push(`indexHydration=${JSON.stringify(status?.indexHydration)}`);
            if(status?.browserTokenStorage!=='DISABLED')failures.push(`browserTokenStorage=${JSON.stringify(status?.browserTokenStorage)}`);
            if(status?.testSending!=='LOCKED'||status?.productionSending!=='LOCKED')failures.push('sending_lock_invalid');
            if(health.status!==200||!healthData?.ok)failures.push(`health=${health.status}:${JSON.stringify(healthData)}`);
            for(const [name,response] of Object.entries({root,en,content,market,polish,favicon,manifest}))if(response.status!==200)failures.push(`${name}=${response.status}`);
            if(polish.status===200&&!polish.text.includes('stable polish V30'))failures.push('polish_marker_missing');
            if(![401,403].includes(mediaApi.status))failures.push(`mediaApi=${mediaApi.status}`);
            if(![401,403].includes(deliveryApi.status))failures.push(`deliveryApi=${deliveryApi.status}`);
            if(admin.status!==303||!String(admin.headers.location||'').includes('/admin-center/?module=operator'))failures.push(`admin=${admin.status}:${admin.headers.location||''}`);
            for(const [name,response] of Object.entries({root,en})){
              if(response.text.includes('/assets/index-polish-v1.css'))failures.push(`${name}_legacy_polish_present`);
              if(response.text.includes('class="gnk-index-title"'))failures.push(`${name}_hero_injector_present`);
              if(!response.text.includes('20260626-stable-v30'))failures.push(`${name}_stable_visual_missing`);
              if(!response.text.includes('index-redesign-production.css?v=20260626-stable-v30'))failures.push(`${name}_stable_index_css_missing`);
              const placeholders=name==='root'
                ? ['Učitavanje najnovijih vijesti','Učitavanje mreže','Učitavanje objava','class="market-value">Učitavanje']
                : ['Loading latest news','Loading network','Loading publications','class="market-value">Loading'];
              for(const marker of placeholders)if(response.text.includes(marker))failures.push(`${name}_placeholder=${marker}`);
            }
            last={attempt,failures,codes:{deployment:deployment.status,health:health.status,root:root.status,en:en.status,content:content.status,market:market.status,polish:polish.status,favicon:favicon.status,manifest:manifest.status,mediaApi:mediaApi.status,deliveryApi:deliveryApi.status,admin:admin.status},status,healthData,headers:{root:root.headers,en:en.headers}};
            console.log(JSON.stringify(last));
            if(!failures.length){console.log('GNK_ASG_CANONICAL_PRODUCTION_OK=true');process.exit(0);}
            await sleep(10000);
          }
          console.error(JSON.stringify(last,null,2));
          process.exit(1);
          JS

      - name: Route diagnostics
        if: always()
        shell: bash
        run: |
          set -u
          base="https://gnk-asg.hr"
          echo "D1 migration outcome: ${{ steps.d1.outcome }}"
          for path in / /en/ /assets/index-stable-polish-v30.css /data/deployment-status.json /data/platform-health.json /admin-center/ /operator-dashboard/ /media-command-center/ /api/media-command-center/status /api/media-command-center/delivery-status; do
            code=$(curl -sS -o /tmp/route.out -w '%{http_code}' "$base$path?cb=$(date +%s)" || true)
            echo "$path HTTP=$code"
          done
