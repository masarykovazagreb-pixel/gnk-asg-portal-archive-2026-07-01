name: Deploy public portal

on:
  push:
    branches:
      - main
    paths:
      - ".github/deploy-public-visual-v13.trigger"
      - ".github/workflows/deploy-public-portal.yml"
      - "apps/portal/index.html"
      - "apps/portal/en/index.html"
      - "apps/portal/admin-center/**"
      - "apps/portal/favicon.svg"
      - "apps/portal/site.webmanifest"
      - "apps/portal/assets/admin-hub-v21.css"
      - "apps/portal/assets/admin-hub-v21.js"
      - "apps/portal/assets/public-menu-v13.js"
      - "apps/portal/assets/index-redesign-production.css"
      - "apps/portal/assets/index-redesign-production-base.css"
      - "apps/portal/assets/index-redesign-production.js"
      - "apps/portal/assets/iq200/**"
      - "apps/portal/assets/brand/**"
      - "apps/portal/media-command-center/**"
      - "apps/portal/assets/media-command-center-v1.css"
      - "apps/portal/assets/media-command-center-v1.js"
      - "apps/portal/assets/admin-media-command-center-nav-v20.js"
      - "apps/portal/data/media-outreach-contacts-v1.json"
      - "workers/gnk-asg-direct-operator/src/index-portal-final-v13.js"
      - "workers/gnk-asg-direct-operator/src/index-media-command-center-v20.js"
      - "workers/gnk-asg-direct-operator/src/index-admin-hub-v21.js"
      - "workers/gnk-asg-direct-operator/src/favicon-contract-v2.js"
      - "workers/gnk-asg-direct-operator/src/media-command-center-v1.js"
      - "workers/gnk-asg-direct-operator/wrangler.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iq200-index-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify IQ200 index, favicon, Admin Hub and Media Command package
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/portal/index.html
          test -s apps/portal/en/index.html
          test -s apps/portal/admin-center/index.html
          test -s apps/portal/favicon.svg
          test -s apps/portal/site.webmanifest
          test -s apps/portal/assets/admin-hub-v21.css
          test -s apps/portal/assets/admin-hub-v21.js
          test -s apps/portal/assets/public-menu-v13.js
          test -s apps/portal/assets/index-redesign-production.css
          test -s apps/portal/assets/index-redesign-production-base.css
          test -s apps/portal/assets/index-redesign-production.js
          test -s apps/portal/assets/iq200/01.css
          test -s apps/portal/assets/iq200/responsive.css
          test -s apps/portal/assets/iq200/final-fixes.css
          test -s apps/portal/media-command-center/index.html
          test -s apps/portal/assets/media-command-center-v1.css
          test -s apps/portal/assets/media-command-center-v1.js
          test -s apps/portal/assets/admin-media-command-center-nav-v20.js
          test -s apps/portal/data/media-outreach-contacts-v1.json
          test -s workers/gnk-asg-direct-operator/src/index-media-command-center-v20.js
          test -s workers/gnk-asg-direct-operator/src/index-admin-hub-v21.js
          test -s workers/gnk-asg-direct-operator/src/favicon-contract-v2.js
          test -s workers/gnk-asg-direct-operator/src/media-command-center-v1.js
          grep -q 'index-redesign-production.css' apps/portal/index.html
          grep -q 'index-redesign-production.css' apps/portal/en/index.html
          grep -q 'GNK ASG d.o.o.' apps/portal/index.html
          grep -q 'GNK DINAMO Ltd.' apps/portal/en/index.html
          grep -q '/admin-center/' apps/portal/assets/public-menu-v13.js
          grep -q 'Mediji · Komandni centar' apps/portal/assets/admin-hub-v21.js
          grep -q '20. 7. 2026.' apps/portal/media-command-center/index.html
          grep -q 'rezerviran i plaćen' apps/portal/media-command-center/index.html
          grep -q 'MEDIA_OUTREACH_LIVE = "false"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'applyFaviconContract' workers/gnk-asg-direct-operator/src/index-admin-hub-v21.js
          grep -q 'GNK_ASG_FAVICON_CONTRACT_V2_20260626' workers/gnk-asg-direct-operator/src/favicon-contract-v2.js
          node --check workers/gnk-asg-direct-operator/src/index-portal-final-v13.js
          node --check workers/gnk-asg-direct-operator/src/index-media-command-center-v20.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v21.js
          node --check workers/gnk-asg-direct-operator/src/favicon-contract-v2.js
          node --check workers/gnk-asg-direct-operator/src/media-command-center-v1.js
          node --check apps/portal/assets/admin-hub-v21.js
          node --check apps/portal/assets/public-menu-v13.js
          node --check apps/portal/assets/media-command-center-v1.js
          node --check apps/portal/assets/admin-media-command-center-nav-v20.js
          grep -q 'main = "src/index-portal-final-v13.js"' workers/gnk-asg-direct-operator/wrangler.toml
          node - <<'JS'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('apps/portal/data/media-outreach-contacts-v1.json','utf8'));
          const codes=new Set(data.map(item=>item.mailCode));
          const ready=data.filter(item=>item.automationAllowed&&item.email).length;
          if(data.length!==112||codes.size!==112||ready!==22) throw new Error(`media seed mismatch total=${data.length} unique=${codes.size} ready=${ready}`);
          console.log('MEDIA_COMMAND_SEED_OK=true');
          JS
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy src/index-admin-hub-v21.js --dry-run --config wrangler.toml --name gnk-asg-direct-operator

      - name: Deploy IQ200 index, favicon, Admin Hub and Media Command Center to Cloudflare
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy src/index-admin-hub-v21.js --config wrangler.toml --name gnk-asg-direct-operator

      - name: Verify IQ200, favicon, Admin Hub and Media Command production
        shell: bash
        run: |
          set -euo pipefail
          base="https://gnk-asg.hr"
          success=false
          for attempt in $(seq 1 18); do
            stamp=$(date +%s)
            version_code=$(curl -sSL -o version.json -w '%{http_code}' "$base/data/portal-version.json?cb=$stamp" || true)
            root_code=$(curl -sSL -o root.html -w '%{http_code}' "$base/?cb=$stamp" || true)
            en_code=$(curl -sSL -o en.html -w '%{http_code}' "$base/en/?cb=$stamp" || true)
            css_code=$(curl -sSL -o index.css -w '%{http_code}' "$base/assets/index-redesign-production.css?cb=$stamp" || true)
            iq_code=$(curl -sSL -o iq.css -w '%{http_code}' "$base/assets/iq200/final-fixes.css?cb=$stamp" || true)
            menu_code=$(curl -sSL -o menu.js -w '%{http_code}' "$base/assets/public-menu-v13.js?cb=$stamp" || true)
            admin_code=$(curl -sS -o admin-login.html -w '%{http_code}' "$base/admin-center/?cb=$stamp" || true)
            legacy_code=$(curl -sS -o legacy.html -w '%{http_code}' "$base/operator/session/login?cb=$stamp" || true)
            media_code=$(curl -sS -o media-redirect.html -w '%{http_code}' "$base/media-command-center/?cb=$stamp" || true)
            media_follow_code=$(curl -sSL -o media-login.html -w '%{http_code}' "$base/media-command-center/?cb=$stamp" || true)
            api_code=$(curl -sS -o media-api.json -w '%{http_code}' "$base/api/media-command-center/status?cb=$stamp" || true)
            favicon_svg_code=$(curl -sSL -o favicon.svg -w '%{http_code}' "$base/favicon.svg?cb=$stamp" || true)
            favicon_ico_code=$(curl -sSL -o favicon-ico-final.svg -w '%{http_code}' "$base/favicon.ico?cb=$stamp" || true)
            manifest_code=$(curl -sSL -o site.webmanifest -w '%{http_code}' "$base/site.webmanifest?cb=$stamp" || true)
            if [ "$version_code" = "200" ] && [ "$root_code" = "200" ] && [ "$en_code" = "200" ] && [ "$css_code" = "200" ] && [ "$iq_code" = "200" ] && [ "$menu_code" = "200" ] && [ "$admin_code" = "401" ] && [ "$legacy_code" = "303" ] && [ "$media_code" = "303" ] && [ "$media_follow_code" = "401" ] && [ "$api_code" = "401" ] && [ "$favicon_svg_code" = "200" ] && [ "$favicon_ico_code" = "200" ] && [ "$manifest_code" = "200" ] && grep -q 'GNK_ASG_PORTAL_FINAL_V13_GALLERY_20260625' version.json && grep -q 'src/index-portal-final-v13.js' version.json && grep -q 'GNK_ASG_MEDIA_COMMAND_CENTER_V1_20260626' version.json && grep -q 'src/index-media-command-center-v20.js' version.json && grep -q '/admin-center/' menu.js && grep -q 'index-redesign-production.css' root.html && grep -q 'index-redesign-production.css' en.html && grep -q 'GNK ASG d.o.o.' root.html && grep -q 'GNK DINAMO Ltd.' en.html && grep -q '/favicon.svg' root.html && grep -q '/favicon.svg' en.html && grep -q '/favicon.svg' admin-login.html && grep -q '/favicon.svg' media-login.html && grep -q '<svg' favicon.svg && grep -q '<svg' favicon-ico-final.svg && grep -q 'GNK ASG' site.webmanifest; then
              success=true
              break
            fi
            sleep 10
          done
          if [ "$success" != "true" ]; then
            echo "VERSION=$version_code ROOT=$root_code EN=$en_code CSS=$css_code IQ=$iq_code MENU=$menu_code ADMIN=$admin_code LEGACY=$legacy_code MEDIA=$media_code MEDIA_FOLLOW=$media_follow_code API=$api_code FAVICON_SVG=$favicon_svg_code FAVICON_ICO=$favicon_ico_code MANIFEST=$manifest_code"
            cat version.json || true
            cat media-api.json || true
            exit 1
          fi
          node -e "const v=require('./version.json');if(!v.ok||v.version!=='GNK_ASG_PORTAL_FINAL_V13_GALLERY_20260625'||v.deployedEntryPoint!=='src/index-portal-final-v13.js'||v.mediaCommandEntryPoint!=='src/index-media-command-center-v20.js'||v.mediaCommandCenter!=='GNK_ASG_MEDIA_COMMAND_CENTER_V1_20260626'||v.indexDesign!=='IQ200')process.exit(1);console.log('GNK_ASG_FAVICON_ALL_ROUTES_PRODUCTION_OK=true')"
