name: Legacy public portal diagnostics (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnk-asg-direct-operator-production
  cancel-in-progress: true

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Worker dependencies
        working-directory: workers/gnk-asg-direct-operator
        run: npm install --no-audit --no-fund

      - name: Validate legacy and canonical gateways
        shell: bash
        run: |
          set -euo pipefail
          node --check workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-final-admin-gateway-v2.js
          node --check workers/gnk-asg-direct-operator/src/mail-studio-extension-v1.js
          node --check workers/gnk-asg-direct-operator/src/mail-studio-extension-v2.js
          test "$(grep -c '^main = "src/index-final-admin-gateway-v2.js"$' workers/gnk-asg-direct-operator/wrangler.runtime.toml)" = '1'

      - name: Bundle canonical Worker without deployment
        working-directory: workers/gnk-asg-direct-operator
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.runtime.toml --name gnk-asg-direct-operator

      - name: Explain safety state
        run: |
          echo 'Legacy automatic production deployment is intentionally retired.'
          echo 'This workflow performs diagnostics only and never deploys or sends email.'
