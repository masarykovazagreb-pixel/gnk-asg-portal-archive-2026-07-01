name: Deploy public portal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-public-portal.yml'
      - 'apps/portal/**'
      - 'workers/gnk-asg-direct-operator/src/**'
      - 'workers/gnk-asg-direct-operator/wrangler.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnk-asg-public-portal-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate locked index and stable THE CODE iframe
        shell: bash
        run: |
          set -euxo pipefail
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v27-news-status.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v28-news-no-fallback.js
          test -s apps/portal/index.html
          test -s apps/portal/en/index.html
          grep -q '<nav class="menu"' apps/portal/index.html
          grep -q '<nav class="menu"' apps/portal/en/index.html
          grep -q 'id="codePreview"' apps/portal/index.html
          grep -q 'id="codePreview"' apps/portal/en/index.html
          grep -q 'STABLE_IFRAME' workers/gnk-asg-direct-operator/src/index-admin-hub-v27-news-status.js
          grep -q 'index-code-cleanup-v8' workers/gnk-asg-direct-operator/src/index-admin-hub-v27-news-status.js
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator

      - name: Deploy to Cloudflare
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator

      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function read(path){const r=await fetch(`https://gnk-asg.hr${path}${path.includes('?')?'&':'?'}cb=${Date.now()}`,{headers:{'cache-control':'no-cache'}});return {status:r.status,text:await r.text(),headers:Object.fromEntries(r.headers)}}
          for(let i=1;i<=24;i++){
            const [hr,en,code]=await Promise.all([read('/'),read('/en/'),read('/the-code/?embed=1')]);
            const ok=hr.status===200&&en.status===200&&code.status===200&&hr.text.includes('<nav class="menu"')&&en.text.includes('<nav class="menu"')&&hr.text.includes('id="codePreview"')&&en.text.includes('id="codePreview"')&&!hr.text.includes('index-code-cleanup-v8.js')&&!en.text.includes('index-code-cleanup-v8.js')&&hr.headers['x-gnk-asg-the-code-player']==='STABLE_IFRAME'&&en.headers['x-gnk-asg-the-code-player']==='STABLE_IFRAME';
            console.log(JSON.stringify({attempt:i,ok,hr:hr.status,en:en.status,code:code.status,player:hr.headers['x-gnk-asg-the-code-player']}));
            if(ok)process.exit(0);
            await sleep(10000);
          }
          process.exit(1);
          JS
