name: Deploy public portal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-public-portal.yml'
      - 'apps/portal/**'
      - 'workers/gnk-asg-direct-operator/src/**'
      - 'workers/gnk-asg-direct-operator/migrations/**'
      - 'workers/gnk-asg-direct-operator/wrangler.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnk-asg-public-portal-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate portal and luxury index package
        shell: bash
        run: |
          set -euxo pipefail
          node --check apps/portal/assets/index-white-static-v2.js
          node --check apps/portal/assets/index-white-static-enhance-v2.js
          node --check workers/gnk-asg-direct-operator/src/index-activation-wrapper-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v24-activation.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v25-mail-smoke.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v26-clean-index.js
          node --check workers/gnk-asg-direct-operator/src/news-curation-v10.js
          test -s apps/portal/index-white-static-preview-v2.html
          test -s apps/portal/en/index-white-static-preview-v2.html
          test -s apps/portal/assets/index-white-static-v2.css
          test -s apps/portal/the-code/index.html
          grep -q 'main = "src/index-admin-hub-v26-clean-index.js"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'GNK_ASG_WHITE_STATIC_INDEX_V2_20260627' workers/gnk-asg-direct-operator/src/index-activation-wrapper-v1.js
          grep -q 'data-index-template="white-static-v2"' apps/portal/index-white-static-preview-v2.html
          grep -q 'data-index-template="white-static-v2"' apps/portal/en/index-white-static-preview-v2.html
          grep -q 'id="codePreview"' apps/portal/index-white-static-preview-v2.html
          grep -q 'min-height:820px' apps/portal/assets/index-white-static-v2.css
          grep -q 'location-dot' apps/portal/assets/index-white-static-v2.css
          grep -q "\['Perth','Perth'" apps/portal/assets/index-white-static-v2.js
          grep -q 'operator-dashboard' apps/portal/index-white-static-preview-v2.html
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator

      - name: Apply D1 migrations
        id: d1
        continue-on-error: true
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations apply gnk_asg_operator_logs --remote --config wrangler.toml

      - name: Deploy to Cloudflare
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator

      - name: Verify index and existing services
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const base='https://gnk-asg.hr';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function get(path,redirect='follow'){
            try{
              const response=await fetch(`${base}${path}${path.includes('?')?'&':'?'}cb=${Date.now()}`,{redirect,headers:{'cache-control':'no-cache'}});
              return {status:response.status,text:await response.text(),headers:Object.fromEntries(response.headers)};
            }catch(error){return {status:0,text:'',headers:{},error:String(error)};}
          }
          let last;
          for(let attempt=1;attempt<=24;attempt++){
            const [root,en,css,js,code,news,pubs,market,health,admin]=await Promise.all([
              get('/'),get('/en/'),get('/assets/index-white-static-v2.css'),get('/assets/index-white-static-v2.js'),
              get('/the-code/'),get('/vijesti/'),get('/objave/'),get('/trzista/'),get('/data/platform-health.json'),
              get('/operator-dashboard/','manual')
            ]);
            const failures=[];
            for(const [name,response] of Object.entries({root,en,css,js,code,news,pubs,market}))if(response.status!==200)failures.push(`${name}=${response.status}`);
            if(!root.text.includes('data-index-template="white-static-v2"'))failures.push('root_template_missing');
            if(!en.text.includes('data-index-template="white-static-v2"'))failures.push('en_template_missing');
            if(!root.text.includes('Interaktivna prezentacija · puna veličina'))failures.push('root_code_full_size_missing');
            if(!en.text.includes('Interactive presentation · full size'))failures.push('en_code_full_size_missing');
            if(!root.text.includes('Globalna mreža')||!en.text.includes('Global network'))failures.push('network_missing');
            if(root.headers['x-gnk-asg-index-template']!=='GNK_ASG_WHITE_STATIC_INDEX_V2_20260627')failures.push(`root_header=${root.headers['x-gnk-asg-index-template']||''}`);
            if(en.headers['x-gnk-asg-index-template']!=='GNK_ASG_WHITE_STATIC_INDEX_V2_20260627')failures.push(`en_header=${en.headers['x-gnk-asg-index-template']||''}`);
            if(![200,303,401,403].includes(admin.status))failures.push(`admin=${admin.status}`);
            if(![200,503].includes(health.status))failures.push(`health=${health.status}`);
            last={attempt,failures,codes:{root:root.status,en:en.status,css:css.status,js:js.status,code:code.status,news:news.status,pubs:pubs.status,market:market.status,health:health.status,admin:admin.status}};
            console.log(JSON.stringify(last));
            if(!failures.length){console.log('GNK_ASG_LUXURY_INDEX_PRODUCTION_OK=true');process.exit(0);}
            await sleep(10000);
          }
          console.error(JSON.stringify(last,null,2));
          process.exit(1);
          JS

      - name: Route diagnostics
        if: always()
        shell: bash
        run: |
          for path in / /en/ /the-code/ /vijesti/ /objave/ /trzista/ /operator-dashboard/ /data/platform-health.json; do
            code=$(curl -sS -o /tmp/route.out -w '%{http_code}' "https://gnk-asg.hr$path?cb=$(date +%s)" || true)
            echo "$path -> $code"
          done
