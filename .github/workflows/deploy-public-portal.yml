name: Deploy public portal

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-public-portal.yml"
      - "apps/portal/**"
      - "workers/gnk-asg-direct-operator/src/**"
      - "workers/gnk-asg-direct-operator/migrations/**"
      - "workers/gnk-asg-direct-operator/wrangler.toml"
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: gnk-asg-canonical-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.number == 65 &&
       github.event.comment.body == '/deploy-public-portal' &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Verify package
        shell: bash
        run: |
          set -euxo pipefail
          node --check apps/portal/assets/admin-hub-v21.js
          node --check apps/portal/assets/admin-session-fallback-v17.js
          node --check apps/portal/assets/mail-studio-auth-bridge-v16.js
          node --check apps/portal/assets/media-command-center-v2.js
          node --check apps/portal/assets/media-command-handoff-ui-v3.js
          node --check apps/portal/assets/index-content-resilience-v1.js
          node --check apps/portal/assets/index-live-market-chart-v4.js
          node --check workers/gnk-asg-direct-operator/src/index-admin-hub-v21.js
          node --check workers/gnk-asg-direct-operator/src/index-lock-v4.js
          node --check workers/gnk-asg-direct-operator/src/index-public-r2-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-server-hydration-v1.js
          node --check workers/gnk-asg-direct-operator/src/index-article-automation-v2.js
          node --check workers/gnk-asg-direct-operator/src/article-visual-v2.js
          node --check workers/gnk-asg-direct-operator/src/index-media-command-center-v21.js
          node --check workers/gnk-asg-direct-operator/src/index-mail-studio-bridge-v15.js
          node --check workers/gnk-asg-direct-operator/src/media-command-center-v2.js
          node --check workers/gnk-asg-direct-operator/src/media-command-readiness-v2.js
          test -s workers/gnk-asg-direct-operator/migrations/0001_media_command_controls.sql
          grep -q 'main = "src/index-admin-hub-v21.js"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'MEDIA_OUTREACH_LIVE = "false"' workers/gnk-asg-direct-operator/wrangler.toml
          grep -q 'GNK_ASG_INDEX_SERVER_HYDRATION_V1_20260626' workers/gnk-asg-direct-operator/src/index-server-hydration-v1.js
          grep -q 'GNK_ASG_PUBLIC_R2_V1_20260626' workers/gnk-asg-direct-operator/src/index-public-r2-v1.js
          grep -q 'GNK_ASG_MEDIA_COMMAND_CENTER_V2_20260626_R3_HANDOFF_LOCK' workers/gnk-asg-direct-operator/src/media-command-center-v2.js
          grep -q 'f34dda0a2aa7dfd88128c91a0e359b14ce20ced9bb74e02bcfaad62dfa81012f' workers/gnk-asg-direct-operator/src/media-command-center-v2.js
          grep -q 'COOKIE_ONLY' apps/portal/assets/admin-session-fallback-v17.js
          grep -q 'COOKIE_ONLY' apps/portal/assets/mail-studio-auth-bridge-v16.js
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --name gnk-asg-direct-operator

      - name: Apply D1 migrations
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: npx --yes wrangler@4 d1 migrations apply gnk_asg_operator_logs --remote --config wrangler.toml

      - name: Deploy to Cloudflare
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-direct-operator

      - name: Verify production contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const base='https://gnk-asg.hr';
          const expected={
            entryPoint:'src/index-admin-hub-v21.js',
            adminHub:'GNK_ASG_ADMIN_HUB_V21_20260626_R9_ARTICLE_AUTOMATION',
            indexLock:'GNK_ASG_INDEX_LOCK_V4_20260626',
            indexHydration:'GNK_ASG_INDEX_SERVER_HYDRATION_V1_20260626',
            publicR2:'GNK_ASG_PUBLIC_R2_V1_20260626',
            browserTokenStorage:'DISABLED',
            mailStudioAuth:'GNK_ASG_MAIL_STUDIO_AUTH_BRIDGE_V16_20260626_COOKIE_ONLY',
            mediaCommand:'src/index-media-command-center-v21.js',
            contactImport:'HASH_LOCKED_V3',
            articleAutomation:'GNK_ASG_ARTICLE_AUTOMATION_V2_20260626_R2',
            productionSending:'LOCKED'
          };
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function get(path,redirect='follow'){
            try{
              const response=await fetch(`${base}${path}${path.includes('?')?'&':'?'}cb=${Date.now()}`,{redirect,headers:{'cache-control':'no-cache'}});
              return {status:response.status,text:await response.text()};
            }catch(error){return {status:0,text:'',error:String(error)};}
          }
          let last;
          for(let attempt=1;attempt<=18;attempt++){
            const [deployment,root,en,content,market,favicon,manifest,mediaApi,handoffUi]=await Promise.all([
              get('/data/deployment-status.json'),get('/'),get('/en/'),
              get('/assets/index-content-resilience-v1.js'),get('/assets/index-live-market-chart-v4.js'),
              get('/favicon.svg'),get('/site.webmanifest'),get('/api/media-command-center/status','manual'),
              get('/assets/media-command-handoff-ui-v3.js')
            ]);
            let status=null;try{status=JSON.parse(deployment.text);}catch{}
            const failures=[];
            if(deployment.status!==200||!status?.ok)failures.push(`deployment=${deployment.status}`);
            for(const [key,value] of Object.entries(expected))if(status?.[key]!==value)failures.push(`${key}=${JSON.stringify(status?.[key])}`);
            if(root.status!==200)failures.push(`root=${root.status}`);
            if(en.status!==200)failures.push(`en=${en.status}`);
            if(content.status!==200)failures.push(`content=${content.status}`);
            if(market.status!==200)failures.push(`market=${market.status}`);
            if(handoffUi.status!==200)failures.push(`handoffUi=${handoffUi.status}`);
            if(favicon.status!==200||!favicon.text.includes('<svg'))failures.push(`favicon=${favicon.status}`);
            if(manifest.status!==200||!manifest.text.includes('GNK ASG'))failures.push(`manifest=${manifest.status}`);
            if(![401,403].includes(mediaApi.status))failures.push(`mediaApi=${mediaApi.status}`);
            last={attempt,failures,codes:{deployment:deployment.status,root:root.status,en:en.status,content:content.status,market:market.status,handoffUi:handoffUi.status,favicon:favicon.status,manifest:manifest.status,mediaApi:mediaApi.status},status};
            console.log(JSON.stringify(last));
            if(!failures.length){console.log('GNK_ASG_CANONICAL_PRODUCTION_OK=true');process.exit(0);}
            await sleep(10000);
          }
          console.error(JSON.stringify(last,null,2));
          process.exit(1);
          JS

      - name: Route diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set -u
          base="https://gnk-asg.hr"
          for path in / /en/ /admin-center/ /operator/session/login /media-command-center/ /api/media-command-center/status; do
            code=$(curl -sS -o /tmp/route.out -w '%{http_code}' "$base$path?cb=$(date +%s)" || true)
            echo "$path HTTP=$code"
          done
