name: Deploy Media Command Gateway

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-media-command-gateway.yml'
      - 'workers/gnk-asg-direct-operator/src/index-media-command-gateway-v1.js'
      - 'workers/gnk-asg-direct-operator/src/media-command-bridge-v1.js'
      - 'workers/gnk-asg-direct-operator/src/media-command-center-v1.js'
  workflow_run:
    workflows: ["Deploy public portal"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnk-asg-media-command-gateway-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate Media Center gateway
        shell: bash
        run: |
          set -euo pipefail
          node --check workers/gnk-asg-direct-operator/src/index-media-command-gateway-v1.js
          node --check workers/gnk-asg-direct-operator/src/media-command-bridge-v1.js
          node --check workers/gnk-asg-direct-operator/src/media-command-center-v1.js
          grep -q 'GNK_ASG_MEDIA_COMMAND_GATEWAY_V1_20260628' workers/gnk-asg-direct-operator/src/index-media-command-gateway-v1.js
          grep -q 'GNK_ASG_MEDIA_COMMAND_BRIDGE_V1_20260628' workers/gnk-asg-direct-operator/src/media-command-bridge-v1.js
          cd workers/gnk-asg-direct-operator
          npx --yes wrangler@4 deploy src/index-media-command-gateway-v1.js --dry-run --config wrangler.toml --name gnk-asg-direct-operator \
            --var MEDIA_OUTREACH_LIVE:false \
            --var 'MEDIA_OUTREACH_TEST_RECIPIENTS:beckuphome@gmail.com rht@gmx.com' \
            --var MEDIA_OUTREACH_FROM:media@gnk-asg.hr

      - name: Deploy Media Center gateway
        working-directory: workers/gnk-asg-direct-operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy src/index-media-command-gateway-v1.js --config wrangler.toml --name gnk-asg-direct-operator \
            --var MEDIA_OUTREACH_LIVE:false \
            --var 'MEDIA_OUTREACH_TEST_RECIPIENTS:beckuphome@gmail.com rht@gmx.com' \
            --var MEDIA_OUTREACH_FROM:media@gnk-asg.hr

      - name: Verify Media Center gateway
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for attempt in $(seq 1 24); do
            code=$(curl -sS -D /tmp/bridge.headers -o /tmp/bridge.json -w '%{http_code}' "https://gnk-asg.hr/api/media-command-bridge/status?cb=${GITHUB_RUN_ID}-${attempt}" || true)
            media=$(curl -sS -o /dev/null -w '%{http_code}' "https://gnk-asg.hr/media-command-center/?cb=${GITHUB_RUN_ID}-${attempt}" || true)
            if [ "$code" = '200' ] \
              && [ "$media" = '303' ] \
              && grep -qi '^x-gnk-asg-media-command-gateway: GNK_ASG_MEDIA_COMMAND_GATEWAY_V1_20260628' /tmp/bridge.headers \
              && grep -q 'GNK_ASG_MEDIA_COMMAND_BRIDGE_V1_20260628' /tmp/bridge.json \
              && grep -q '"testRecipients": 2' /tmp/bridge.json \
              && grep -q '"productionActionsEnabled": false' /tmp/bridge.json; then
                ok=true
                break
            fi
            sleep 10
          done
          cat /tmp/bridge.json || true
          [ "$ok" = 'true' ]
