name: AKTUAL Editorial V4 Design and Generation

on:
  pull_request:
    paths:
      - 'apps/portal/assets/aktual-editorial-v4.css'
      - 'apps/portal/gnk-aktual/index.html'
      - 'apps/portal/en/gnk-aktual/index.html'
      - 'apps/region/engine/**'
      - 'tests/test-aktual-editorial-system-v4.mjs'
      - '.github/workflows/aktual-editorial-system-v4.yml'
  push:
    branches: [main]
    paths:
      - 'apps/portal/assets/aktual-editorial-v4.css'
      - 'apps/region/engine/kanal-design-v2.mjs'
      - 'tests/test-aktual-editorial-system-v4.mjs'

permissions:
  contents: read

concurrency:
  group: aktual-editorial-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check engine syntax
        run: |
          node --check apps/region/engine/kanal-design-v2.mjs
          node --check apps/region/engine/build.mjs
          node --check apps/region/engine/aktual-central.mjs
          node --check apps/region/engine/aktual-en-home-parity-v1.mjs
      - name: Run unified editorial quality contracts
        run: node --test tests/test-aktual-editorial-system-v4.mjs
      - name: Rebuild a real city edition with bundled RSS data
        run: |
          node apps/region/engine/build.mjs --channel zagreb
          test -s apps/region/site/zagreb/assets/region.css
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const css = readFileSync('apps/region/site/zagreb/assets/region.css', 'utf8');
          const html = readFileSync('apps/region/site/zagreb/index.html', 'utf8');
          const checks = {
            'photo-grid CSS': css.includes('.grid .card:nth-child(7n+6)'),
            'responsive CSS': css.includes('@media(max-width:520px)'),
            'expanded image cards': html.includes('grid grid--more'),
            'brand-image fallback': css.includes('aktual-media-mark.svg')
          };
          console.log({ cssBytes: css.length, htmlBytes: html.length, checks });
          for (const [name, passed] of Object.entries(checks)) {
            if (!passed) throw new Error('Generated Zagreb: missing '+name);
          }
          NODE
      - name: Publish validation summary
        if: always()
        run: |
          echo "Editorial V4 checks and source generation completed. No production deploy and no external publishing." >> "$GITHUB_STEP_SUMMARY"
