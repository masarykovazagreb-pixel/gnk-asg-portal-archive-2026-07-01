name: GNK ASG Legacy News V6 Empty Image URL Fix

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  fix:
    if: contains(github.event.issue.title, 'RUN GNK ASG LEGACY NEWS V6 EMPTY URL FIX')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Guard empty URL candidates
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python - <<'PY'
          from pathlib import Path
          path=Path('workers/gnk-asg-direct-operator/src/index-publication-news-hotfix.js')
          lines=path.read_text(encoding='utf-8').splitlines()
          matches=[i for i,line in enumerate(lines) if line.strip()=="function validHttp(value,base=''){" ]
          if len(matches)!=1: raise SystemExit(f'validHttp definitions={len(matches)}')
          i=matches[0]
          expected=["  try{","    const url=new URL(String(value||'').trim(),base||undefined);"]
          if lines[i+1:i+3]!=expected: raise SystemExit(f'unexpected validHttp body: {lines[i+1:i+3]}')
          lines[i+1:i+3]=[
            "  const raw=String(value||'').trim();",
            "  if(!raw)return '';",
            "  try{",
            "    const url=new URL(raw,base||undefined);"
          ]
          path.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          node --check workers/gnk-asg-direct-operator/src/index-publication-news-hotfix.js
          grep -Fq "if(!raw)return '';" workers/gnk-asg-direct-operator/src/index-publication-news-hotfix.js
      - name: Commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/gnk-asg-direct-operator/src/index-publication-news-hotfix.js
          git commit -m 'Prevent article URLs from being treated as news images'
          git pull --rebase origin main
          node --check workers/gnk-asg-direct-operator/src/index-publication-news-hotfix.js
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "empty_image_url_fix_commit=${{ steps.commit.outputs.sha }} workflow=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
