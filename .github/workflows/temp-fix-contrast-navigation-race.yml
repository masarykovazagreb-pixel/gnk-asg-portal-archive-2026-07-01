name: Temporary Fix Contrast Navigation Race

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: temp-fix-contrast-navigation-race
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/editorial-paragraph-contract-20260724
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch transient navigation retry into Playwright audit
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('apps/portal/tests/all-pages-visual-contrast.spec.js')
          s=p.read_text()
          anchor="const routeEntries = [...new Map(\n"
          helper="""async function evaluateWithNavigationRetry(page, callback, argument) {
  const attempts = 5;
  for (let attempt = 1; attempt <= attempts; attempt += 1) {
    try {
      return await page.evaluate(callback, argument);
    } catch (error) {
      const transient = /Execution context was destroyed|Cannot find context with specified id|Inspected target navigated or closed/i.test(error?.message || String(error));
      if (!transient || attempt === attempts) throw error;
      await page.waitForLoadState('domcontentloaded', { timeout: 10_000 }).catch(() => {});
      await page.waitForTimeout(300);
    }
  }
  throw new Error('Navigation retry exhausted without a result');
}

"""
          if 'async function evaluateWithNavigationRetry' not in s:
              if anchor not in s: raise SystemExit('routeEntries anchor missing')
              s=s.replace(anchor,helper+anchor,1)
          old="const runtimeWasPresent = await page.evaluate(() => document.documentElement.dataset.gnkContrast === 'hardened-v4');"
          new="const runtimeWasPresent = await evaluateWithNavigationRetry(page, () => document.documentElement.dataset.gnkContrast === 'hardened-v4');"
          count=s.count(old)
          if count not in (0,2): raise SystemExit(f'unexpected runtime evaluate count: {count}')
          s=s.replace(old,new)
          p.write_text(s)
          PY
          node --check apps/portal/tests/all-pages-visual-contrast.spec.js
      - name: Commit test-harness fix only
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/portal/tests/all-pages-visual-contrast.spec.js; then
            echo 'Test harness already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/portal/tests/all-pages-visual-contrast.spec.js
          git commit -m 'fix(test): tolerate transient homepage navigation during contrast audit'
          git push origin HEAD:fix/editorial-paragraph-contract-20260724
