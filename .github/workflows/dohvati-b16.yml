name: Dohvati slike b16 (jednokratno)
on: workflow_dispatch
jobs:
  dohvati:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p apps/portal/data/tmp-b16b
          curl -s "https://gnk-asg.hr/api/slike?upit=succession+planning+keys+ownership+transfer" -o apps/portal/data/tmp-b16b/nasljedivanje2.json
      - run: |
          git config user.name "gnk-asg-bot"; git config user.email "it@gnk-asg.hr"
          BRANCH="slikeb16b-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add apps/portal/data/tmp-b16b
          git commit -m "slike b16b"
          git push origin "$BRANCH"
