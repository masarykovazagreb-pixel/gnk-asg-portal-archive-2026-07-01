name: Final direct inbound autoreply fix and deploy
on:
  push:
    paths:
      - '.github/workflows/fix-deploy-direct-inbound-final-20260722.yml'
permissions:
  contents: write
  issues: write
concurrency:
  group: gnk-asg-direct-inbound-final
  cancel-in-progress: false
jobs:
  fix-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply verified pipeline patch and regression contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,re
          from pathlib import Path
          text=Path('.github/workflows/fix-deploy-mail-autoreply-mime-20260722.yml').read_text()
          patterns={
            '/tmp/patch-direct-inbound.py':r"echo '([A-Za-z0-9+/=]+)' \| base64 -d > /tmp/patch-direct-inbound\.py",
            'workers/gnk-asg-mail-center-worker/wrangler.toml':r"echo '([A-Za-z0-9+/=]+)' \| base64 -d > workers/gnk-asg-mail-center-worker/wrangler\.toml"
          }
          for target,pattern in patterns.items():
              match=re.search(pattern,text)
              if not match: raise SystemExit(f'embedded payload not found: {target}')
              path=Path(target);path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(base64.b64decode(match.group(1)))
          PY
          python3 /tmp/patch-direct-inbound.py
          node --check workers/gnk-asg-mail-center-worker/src/index.js
          node --check workers/gnk-asg-direct-operator/src/outbound-mail-transport-v1.js
          node --check workers/gnk-asg-direct-operator/src/email-status-tracking-v1.js
          cat > scripts/test-mail-center-direct-inbound-pipeline-v2.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const mail=fs.readFileSync('workers/gnk-asg-mail-center-worker/src/index.js','utf8');
          const transport=fs.readFileSync('workers/gnk-asg-direct-operator/src/outbound-mail-transport-v1.js','utf8');
          const status=fs.readFileSync('workers/gnk-asg-direct-operator/src/email-status-tracking-v1.js','utf8');
          const config=fs.readFileSync('workers/gnk-asg-mail-center-worker/wrangler.toml','utf8');
          const checks={
            wrapperOrder:mail.includes("withEmailStatusTracking(withBrandedMimeTransport(env), 'direct-inbound-auto-reply')"),
            aiRuntime:mail.includes('target = prepareAiAutoReply(message, runtimeEnv)'),
            brandedMime:mail.includes('return sendBrandedEmail(env, payload)'),
            reference:mail.includes("'X-GNK-ASG-Reference': id"),
            messageIdReserved:transport.includes('const messageId=`<${crypto.randomUUID()}@gnk-asg.hr>`'),
            messageIdHeader:transport.includes('`Message-ID: ${messageId}`'),
            messageIdReturned:transport.includes('messageId:prepared.messageId'),
            providerMatch:(status.match(/REPLACE\(REPLACE\(provider_message_id/g)||[]).length>=2,
            d1:config.includes('binding = "GNK_ASG_D1"'),
            opens:config.includes('EMAIL_OPEN_TRACKING_ENABLED = "true"'),
            receipts:config.includes('EMAIL_RECEIPT_CONFIRMATION_ENABLED = "true"')
          };
          for(const [name,value] of Object.entries(checks))assert.equal(value,true,name);
          console.log(JSON.stringify({ok:true,contract:'AI -> Email Status -> branded MIME -> Cloudflare',checks},null,2));
          EOF
          node scripts/test-mail-center-direct-inbound-pipeline-v2.mjs
      - name: Commit durable fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/gnk-asg-mail-center-worker/src/index.js \
                  workers/gnk-asg-mail-center-worker/wrangler.toml \
                  workers/gnk-asg-direct-operator/src/outbound-mail-transport-v1.js \
                  workers/gnk-asg-direct-operator/src/email-status-tracking-v1.js \
                  scripts/test-mail-center-direct-inbound-pipeline-v2.mjs
          git commit -m 'fix(mail): restore tracked AI autoreply for direct inbound email'
          git pull --rebase origin main
          git push origin HEAD:main
          echo "FIX_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Deploy Mail Center Worker
        working-directory: workers/gnk-asg-mail-center-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name gnk-asg-mail-center-worker --keep-vars
      - name: Publish deployment result
        if: always()
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set +e
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/services/gnk-asg-mail-center-worker/environments/production/settings" -H "Authorization: Bearer $CF_TOKEN" > /tmp/settings.json
          python3 - <<'PY' > /tmp/report.md
          import json,os
          try: settings=json.load(open('/tmp/settings.json'))
          except Exception: settings={}
          wanted={'AI','AI_AUTO_REPLY_DISABLED','EMAIL','GNK_ASG_KV','GNK_ASG_D1','EMAIL_OPEN_TRACKING_ENABLED','EMAIL_RECEIPT_CONFIRMATION_ENABLED'}
          bindings=[]
          for item in settings.get('result',{}).get('bindings',[]):
              if item.get('name') in wanted: bindings.append({k:item.get(k) for k in ('name','type','text') if item.get(k) is not None})
          print('## Final direct inbound autoreply deployment')
          print()
          print('Job status:',os.environ.get('JOB_STATUS'))
          print('Fix SHA:',os.environ.get('FIX_SHA','not-created'))
          print('```json')
          print(json.dumps({'bindings':bindings},ensure_ascii=False,indent=2))
          print('```')
          PY
          gh issue edit 712 --repo "${{ github.repository }}" --body-file /tmp/report.md
