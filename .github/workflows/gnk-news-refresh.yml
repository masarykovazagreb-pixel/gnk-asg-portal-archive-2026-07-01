name: GNK News Refresh

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gnk-news-refresh
  cancel-in-progress: false

jobs:
  refresh-news:
    name: Refresh public news feed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh GNK ASG news data
        run: node scripts/gnk-news-refresh.mjs

      - name: Commit refreshed news data
        run: |
          git config user.name "gnk-news-bot"
          git config user.email "actions@github.com"
          git add apps/portal/data/news.json apps/portal/data/news_archive.json apps/portal/data/news-automation-status.json
          if git diff --cached --quiet; then
            echo "No news data changes to commit."
          else
            git commit -m "Refresh GNK ASG news feed"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                break
              fi
              echo "Push odbijen (pokusaj $attempt) - main se pomaknuo, radim fetch+rebase."
              git fetch origin main
              git rebase origin/main || { echo "Rebase konflikt."; exit 1; }
              sleep $((attempt * 5))
              if [ "$attempt" = "5" ]; then echo "Push nije uspio nakon 5 pokusaja."; exit 1; fi
            done
          fi
