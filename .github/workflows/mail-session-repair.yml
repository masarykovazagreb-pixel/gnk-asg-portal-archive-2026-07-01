name: Contact and Mail Repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mail-session-repair.yml"

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
      GNK_ASG_OPERATOR_TOKEN: ${{ secrets.GNK_ASG_OPERATOR_TOKEN }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      GNK_ASG_ADMIN_TOKEN: ${{ secrets.GNK_ASG_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate active contact worker
        working-directory: workers/gnk-asg-contact-api-worker
        run: |
          node --check src/index.js
          grep -q 'remote = true' wrangler.no-routes.toml
          grep -q '/api/operator-send-mail' src/index.js
          grep -q '/api/contact-submit' src/index.js
      - name: Synchronize operator secret
        working-directory: workers/gnk-asg-contact-api-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          token="$GNK_ASG_OPERATOR_TOKEN"
          [ -n "$token" ] || token="$OPERATOR_TOKEN"
          [ -n "$token" ] || token="$GNK_ASG_ADMIN_TOKEN"
          [ -n "$token" ] || token="$ADMIN_TOKEN"
          test -n "$token"
          printf '%s' "$token" | npx --yes wrangler@4 secret put GNK_ASG_OPERATOR_TOKEN --name gnk-asg-contact-api
      - name: Deploy active contact worker without route changes
        working-directory: workers/gnk-asg-contact-api-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.no-routes.toml --name gnk-asg-contact-api
      - name: Verify operator mail and contact reply
        shell: bash
        run: |
          sleep 10
          token="$OPERATOR_TOKEN"
          [ -n "$token" ] || token="$GNK_ASG_OPERATOR_TOKEN"
          [ -n "$token" ] || token="$ADMIN_TOKEN"
          [ -n "$token" ] || token="$GNK_ASG_ADMIN_TOKEN"
          test -n "$token"

          mail_code=$(curl --silent --show-error --output mail.json --write-out '%{http_code}' \
            --request POST \
            -H "Authorization: Bearer $token" \
            -H 'content-type: application/json' \
            --data '{"mailbox":"info","to":"beckuphome@gmail.com","subject":"[TEST] GNK ASG operator mail popravak","body":"Produkcijska provjera izlaznog maila nakon popravka.","addSignature":"yes"}' \
            'https://gnk-asg.hr/api/operator-send-mail')

          contact_code=$(curl --silent --show-error --output contact.json --write-out '%{http_code}' \
            --request POST \
            --form 'mailbox=info' \
            --form 'name=GNK ASG kontakt test' \
            --form 'email=beckuphome@gmail.com' \
            --form 'phone=' \
            --form 'subject=[TEST] GNK ASG kontakt nakon popravka' \
            --form 'message=Produkcijska provjera kontakta i automatskog odgovora.' \
            --form 'consent=yes' \
            'https://gnk-asg.hr/api/contact-submit')

          echo "OPERATOR_MAIL_HTTP=$mail_code"
          cat mail.json
          echo "CONTACT_HTTP=$contact_code"
          cat contact.json

          test "$mail_code" = "200"
          test "$contact_code" = "200"

          python - <<'PY'
          import json
          mail=json.load(open('mail.json',encoding='utf-8'))
          contact=json.load(open('contact.json',encoding='utf-8'))
          print('MAIL_OK='+str(bool(mail.get('ok'))))
          print('CONTACT_OK='+str(bool(contact.get('ok'))))
          print('CONTACT_CASE_ID='+str(contact.get('caseId') or ''))
          print('INTERNAL_MAIL_SENT='+str(bool((contact.get('internalMail') or {}).get('sent'))))
          print('AUTO_REPLY_SENT='+str(bool((contact.get('autoReply') or {}).get('sent'))))
          if not mail.get('ok'): raise SystemExit(1)
          if not contact.get('ok'): raise SystemExit(1)
          if not (contact.get('internalMail') or {}).get('sent'): raise SystemExit(1)
          if not (contact.get('autoReply') or {}).get('sent'): raise SystemExit(1)
          PY

# active routed worker repair with synchronized secret 2026-06-24
