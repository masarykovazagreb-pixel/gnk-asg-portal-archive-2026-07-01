name: PR394 — deterministic generated-output repair
on:
  push:
    branches: [arena/0ba72079-gnk-asg-portal-archive-2026-07]
    paths:
      - '.github/workflows/pr394-regenerate-outputs.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gnk-asg-main-mutation
  cancel-in-progress: false
jobs:
  rebuild:
    if: vars.GNK_ASG_RELEASE_FENCE != 'true' && github.ref == 'refs/heads/arena/0ba72079-gnk-asg-portal-archive-2026-07'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate six independent sites and cross-domain copies
        run: |
          set -euo pipefail
          node apps/sites/build.mjs
          # WORLD output is intentionally gitignored, but its nine portals must
          # exist in the runner before the transfer contract is validated.
          node apps/world/build.mjs
          node scripts/build-prenos-hub-v1.mjs
      - name: Repair refresh tags and radio promo blocks
        run: |
          set -euo pipefail
          node scripts/apply-refresh-v1.mjs
          python3 scripts/factory/radio_promo_v1.py
          python3 scripts/factory/apply_standard.py
      - name: Save regenerated outputs to PR branch for review
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for dir in apps/sites/site apps/portal/prenos apps/portal/en/prenos apps/portal/assets apps/kanal/site apps/arhiva/site apps/dnevnik/site; do
            if test -d "$dir"; then git add -A -- "$dir"; fi
          done
          git add -u -- apps/portal/
          # Preserve archival article bodies; stage only refresh-tag updates from the idempotent updater.
          # The refresh script replaces one script tag and leaves the article HTML otherwise intact.
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit -m 'build(network): regenerate sites, syndication and refresh output'
          # The branch can advance while generation runs. Rebase only the generated
          # output commit onto its latest tip; fail safely if changes conflict.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort || true; exit 1; }
            if git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
              break
            fi
            if test "$attempt" -eq 3; then exit 1; fi
          done

      - name: Verify generated changes (failure keeps PR blocked)
        run: |
          set -euo pipefail
          node scripts/build-prenos-hub-v1.mjs --check
          node tests/test-prenos-v1.mjs
          node tests/test-sites-network-v1.mjs
          node tests/test-refresh-layer-v1.mjs
          python3 scripts/factory/radio_promo_v1.py --check
          python3 scripts/factory/apply_standard.py --check
