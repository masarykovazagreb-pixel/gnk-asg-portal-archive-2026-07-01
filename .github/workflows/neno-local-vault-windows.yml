name: NENO Local Vault Windows Installer
on:
  push:
    branches:
      - feature/neno-local-vault-20261022
    paths:
      - 'tools/neno-local-vault/**'
      - '.github/workflows/neno-local-vault-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neno-local-vault-setup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tools/neno-local-vault
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and unpack baseline source
        run: python decode_source.py
      - name: Verify and apply ChatGPT + installer upgrade
        run: python apply_upgrade.py
      - name: Install Python dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Verify installer and authentication imports
        run: python -c "import jwt,cryptography,tkinter,neno_vault.chatgpt_auth,neno_vault.gui;print('imports OK')"
      - name: Run full automated suite
        run: python -m unittest discover -s tests -v
      - name: Build standalone Windows app
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --collect-all pypdfium2 --name NenoLocalVault app.py
      - name: Install NSIS installer compiler
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - name: Compile native setup EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output | Out-Null
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path $compiler)) { throw "NSIS compiler missing: $compiler" }
          & $compiler /V2 /DVERSION=0.3.0 installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS build failed" }
          if (-not (Test-Path 'output/NenoLocalVault-Setup-0.3.0.exe')) { throw "Setup EXE not created" }
      - name: Silent install and uninstall smoke test
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'output/NenoLocalVault-Setup-0.3.0.exe').Path
          $p = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent install failed: $($p.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\Neno Local Vault\NenoLocalVault.exe'
          if (-not (Test-Path $installed)) { throw 'Installed EXE missing' }
          $u = Join-Path $env:LOCALAPPDATA 'Programs\Neno Local Vault\Uninstall.exe'
          $p = Start-Process -FilePath $u -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent uninstall failed: $($p.ExitCode)" }
          if (Test-Path $installed) { throw 'Uninstall left executable behind' }
      - name: Publish installer and hashes
        shell: pwsh
        run: |
          Copy-Item dist/NenoLocalVault.exe output/NenoLocalVault-portable.exe
          Copy-Item README.md output/README.md
          Get-ChildItem output -Filter *.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)"
          } | Set-Content output/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NenoLocalVault-Setup-Windows11-v0.3.0
          path: tools/neno-local-vault/output/
          retention-days: 30
          if-no-files-found: error
