name: AKTUAL WORLD201 — no-Vercel release gate
on:
  pull_request:
    paths:
      - "apps/portal/data/world-countries-v1.json"
      - "apps/portal/gnk-aktual/media/**"
      - "tests/check-world201-no-vercel-release.mjs"
      - ".github/workflows/world201-no-vercel-release-gate.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: node tests/check-world201-no-vercel-release.mjs
