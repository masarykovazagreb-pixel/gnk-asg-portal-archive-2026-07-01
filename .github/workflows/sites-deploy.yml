name: sites-deploy

# Objavljuje šest neovisnih stranica GNK ASG mreže na vlastite Cloudflare
# Pages projekte (gnk-bor-usa, gnk-kosarka, gnk-scena-znanosti,
# gnk-step-buducnosti, gnk-zdravlje, gnk-izbori-srbija).
#
# • push na apps/sites/** gradi i objavljuje svih šest;
# • raspored svakih sat vremena osvježava SAMO izborni desk;
# • kill switch: repository variable IZBORI_DESK_ENABLED=false zaustavlja
#   raspored bez diranja povijesti — desk prestaje biti živ, arhiva ostaje.
#
# Ne dira gnk-asg.hr: hub (/mreza/) putuje s portalom, a ova radnja samo
# gradi apps/sites/site i predaje ga Cloudflareu. Svaki projekt je naveden
# imenom u ovom zapisu, pa se iz workflows datoteke može pročitati točno
# što se objavljuje (scripts/test-deploy-approval-guardrails.mjs).

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'apps/sites/**'
      - '.github/workflows/sites-deploy.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sites-deploy
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      only: ${{ steps.list.outputs.only }}
      enabled: ${{ steps.kill.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kill switch
        id: kill
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ vars.IZBORI_DESK_ENABLED }}" = "false" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::IZBORI_DESK_ENABLED=false — raspored preskače izborni desk."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Popis stranica
        id: list
        shell: bash
        run: |
          ONLY=""
          if [ "${{ github.event_name }}" = "schedule" ]; then ONLY="izbori-srbija"; fi
          echo "only=$ONLY" >> "$GITHUB_OUTPUT"
          node -e '
            import("./apps/sites/lib/registry.mjs").then(({ SITES }) => {
              console.log(`stranica u registru: ${SITES.map((s) => s.slug).join(", ")}`);
            });
          '

  build:
    needs: prepare
    if: needs.prepare.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Provjere mreže (stanje u repozitoriju)
        shell: bash
        run: node tests/test-sites-network-v1.mjs

      - name: Izborni feedovi (neobavezno)
        shell: bash
        continue-on-error: true
        run: node apps/sites/engine/ingest-izbori.mjs

      - name: Gradnja šest stranica
        shell: bash
        run: node apps/sites/build.mjs

      - name: Provjere mreže (svježi izlaz)
        shell: bash
        run: node tests/test-sites-network-v1.mjs --no-fresh

      - uses: actions/upload-artifact@v4
        with:
          name: sites-out
          path: apps/sites/site
          retention-days: 3

  deploy:
    needs: [prepare, build]
    if: needs.prepare.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sites-out
          path: sites-out

      - name: Provjeri Cloudflare pristup i projekte
        id: cf
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${CF_TOKEN:-}" ] || [ -z "${CF_ACCOUNT:-}" ]; then
            echo "::warning::Cloudflare secrets nisu dostupni — preskačem deploy mreže."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for project in gnk-bor-usa gnk-kosarka gnk-scena-znanosti gnk-step-buducnosti gnk-zdravlje gnk-izbori-srbija; do
            code=$(curl -s -o /tmp/proj.json -w '%{http_code}' \
              -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$project")
            if [ "$code" != "200" ]; then
              echo "Projekt $project ne postoji (HTTP $code) — kreiram."
              curl -s -o /tmp/create.json -X POST \
                -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
                --data "{\"name\":\"$project\",\"production_branch\":\"main\"}" \
                "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects" || true
              head -c 200 /tmp/create.json || true; echo
            fi
          done
          if [ "${{ needs.prepare.outputs.only }}" = "" ]; then
            for slug in bor-usa kosarka scena-znanosti step-buducnosti zdravlje izbori-srbija; do
              if [ ! -s "sites-out/$slug/index.html" ]; then
                echo "::error::Nedostaje izlaz za $slug."
                echo "ready=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          else
            test -s "sites-out/${{ needs.prepare.outputs.only }}/index.html" || { echo "::error::Nedostaje izlaz za ${{ needs.prepare.outputs.only }}."; echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; }
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Instaliraj wrangler
        if: steps.cf.outputs.ready == 'true'
        shell: bash
        run: npm install --global wrangler@4

      - name: Objavi BOR USA
        if: steps.cf.outputs.ready == 'true' && (needs.prepare.outputs.only == '' || needs.prepare.outputs.only == 'bor-usa')
        shell: bash
        run: wrangler pages deploy "sites-out/bor-usa" --project-name=gnk-bor-usa --branch=main --commit-dirty=true

      - name: Objavi KOŠARKA 360
        if: steps.cf.outputs.ready == 'true' && (needs.prepare.outputs.only == '' || needs.prepare.outputs.only == 'kosarka')
        shell: bash
        run: wrangler pages deploy "sites-out/kosarka" --project-name=gnk-kosarka --branch=main --commit-dirty=true

      - name: Objavi SCENA ZNANOSTI
        if: steps.cf.outputs.ready == 'true' && (needs.prepare.outputs.only == '' || needs.prepare.outputs.only == 'scena-znanosti')
        shell: bash
        run: wrangler pages deploy "sites-out/scena-znanosti" --project-name=gnk-scena-znanosti --branch=main --commit-dirty=true

      - name: Objavi STEP BUDUĆNOSTI
        if: steps.cf.outputs.ready == 'true' && (needs.prepare.outputs.only == '' || needs.prepare.outputs.only == 'step-buducnosti')
        shell: bash
        run: wrangler pages deploy "sites-out/step-buducnosti" --project-name=gnk-step-buducnosti --branch=main --commit-dirty=true

      - name: Objavi ZDRAVLJE 360
        if: steps.cf.outputs.ready == 'true' && (needs.prepare.outputs.only == '' || needs.prepare.outputs.only == 'zdravlje')
        shell: bash
        run: wrangler pages deploy "sites-out/zdravlje" --project-name=gnk-zdravlje --branch=main --commit-dirty=true

      - name: Objavi IZBORI U SRBIJI
        if: steps.cf.outputs.ready == 'true' && (needs.prepare.outputs.only == '' || needs.prepare.outputs.only == 'izbori-srbija')
        shell: bash
        run: wrangler pages deploy "sites-out/izbori-srbija" --project-name=gnk-izbori-srbija --branch=main --commit-dirty=true

      - name: Sažetak
        if: steps.cf.outputs.ready == 'true'
        shell: bash
        run: |
          {
            echo "## Mreža objavljena"
            echo "- okidač: ${{ github.event_name }}"
            echo "- opseg: ${{ needs.prepare.outputs.only == '' && 'svih šest izdanja' || needs.prepare.outputs.only }}"
            echo "- hub: https://gnk-asg.hr/mreza/ (putuje s portalom)"
          } >> "$GITHUB_STEP_SUMMARY"
