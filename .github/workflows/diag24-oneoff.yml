name: Check mail-center-worker KV logs (one-off)
on:
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query mail-center-worker settings and KV
        run: |
          CF_TOKEN="cfut_RQcfszqhP9EYO7NmPjgWRjrklpw9pCN4e89DjKXL42804731"
          ACCOUNT_ID="1728309632b4e7be93fba322822905da"
          echo "# mail-center-worker check" > /tmp/d.md
          echo '```' >> /tmp/d.md
          echo "--- worker settings ---" >> /tmp/d.md
          SETTINGS=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/services/gnk-asg-mail-center-worker/environments/production/settings" -H "Authorization: Bearer $CF_TOKEN")
          echo "$SETTINGS" >> /tmp/d.md
          KV_ID=$(echo "$SETTINGS" | python3 -c "import json,sys;d=json.load(sys.stdin);print(next((b.get('namespace_id') for b in d.get('result',{}).get('bindings',[]) if b.get('type')=='kv_namespace'), ''))")
          echo "" >> /tmp/d.md
          echo "kv_id: $KV_ID" >> /tmp/d.md
          echo "--- mail:inbox ---" >> /tmp/d.md
          curl -s "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/storage/kv/namespaces/$KV_ID/values/mail:inbox" -H "Authorization: Bearer $CF_TOKEN" | head -c 2000 >> /tmp/d.md
          echo "" >> /tmp/d.md
          echo "--- mail:sent ---" >> /tmp/d.md
          curl -s "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/storage/kv/namespaces/$KV_ID/values/mail:sent" -H "Authorization: Bearer $CF_TOKEN" | head -c 3000 >> /tmp/d.md
          echo '```' >> /tmp/d.md
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" --title "mail-center-worker check" --body-file /tmp/d.md
