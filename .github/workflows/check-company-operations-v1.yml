name: Check Company Operations V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'workers/gnk-asg-direct-operator/src/enterprise-company-operations-v1.js'
      - 'workers/gnk-asg-direct-operator/src/index-enterprise-projects-runtime-v1.js'
      - 'workers/gnk-asg-direct-operator/test/enterprise-company-operations.test.mjs'
      - 'apps/portal/data/group_network.json'
      - '.github/workflows/check-company-operations-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate syntax and runtime wiring
        run: |
          set -euxo pipefail
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/enterprise-company-operations-v1.js
          node --input-type=module --check < workers/gnk-asg-direct-operator/src/index-enterprise-projects-runtime-v1.js
          node --check workers/gnk-asg-direct-operator/test/enterprise-company-operations.test.mjs
          grep -Fq "from './enterprise-company-operations-v1.js'" workers/gnk-asg-direct-operator/src/index-enterprise-projects-runtime-v1.js
          grep -Fq 'isCompanyOperationsApi(path)' workers/gnk-asg-direct-operator/src/index-enterprise-projects-runtime-v1.js
          grep -Fq "export const API_PREFIX='/api/company-operations'" workers/gnk-asg-direct-operator/src/enterprise-company-operations-v1.js
      - name: Test company operations aggregation
        run: node workers/gnk-asg-direct-operator/test/enterprise-company-operations.test.mjs
      - name: Confirm privacy and authority boundaries
        run: |
          set -euxo pipefail
          file=workers/gnk-asg-direct-operator/src/enterprise-company-operations-v1.js
          grep -Fq "counterparties:'hidden'" "$file"
          grep -Fq "collaborators:'hidden'" "$file"
          grep -Fq "privateAssignments:'hidden'" "$file"
          grep -Fq "messages:'hidden'" "$file"
          grep -Fq 'prepareProposals:true' "$file"
          grep -Fq 'delegatedOperationalDecisions:true' "$file"
          grep -Fq 'prepareCompanyPublications:true' "$file"
          ! grep -Eiq 'paymentAuthority:true|contractAuthority:true|automaticPublication:true' "$file"
