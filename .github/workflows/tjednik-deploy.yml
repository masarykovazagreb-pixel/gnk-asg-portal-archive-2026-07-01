name: TJEDNIK — deploy

# Objavljuje GNK ASG BUSINESS TJEDNIK (apps/tjednik) na Cloudflare Pages.
# Kanonska adresa: https://gnk-asg-tjednik.pages.dev/
# Prije deploya pokreće dnevni stroj koji čita izvore i gradi stranice.

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'apps/tjednik/**'
      - '.github/workflows/tjednik-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tjednik-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TJEDNIK_BASE: https://gnk-asg-tjednik.pages.dev/
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sastavi kritike i stranice
        shell: bash
        run: |
          set -uo pipefail
          node apps/tjednik/engine/tjednik.mjs || echo "::warning::Dio izvora nije dostupan — gradim iz postojeće arhive."
          test -f apps/tjednik/site/index.html
          test -f apps/tjednik/site/feed.json
          test -f apps/tjednik/site/sitemap.xml
          node -e "const f=require('./apps/tjednik/site/feed.json'); console.log('feed items:', f.items.length); if(!f.items.length) process.exit(1)"

      - name: Pripremi Cloudflare Pages projekt
        id: cf
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${CF_TOKEN:-}" ] || [ -z "${CF_ACCOUNT:-}" ]; then
            echo "::warning::Cloudflare secrets nisu dostupni — preskačem deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(curl -s -o /tmp/proj.json -w '%{http_code}' \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/gnk-asg-tjednik")
          if [ "$code" != "200" ]; then
            echo "Projekt ne postoji (HTTP $code) — kreiram."
            curl -s -o /tmp/create.json -w 'Create HTTP %{http_code}\n' -X POST \
              -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              --data '{"name":"gnk-asg-tjednik","production_branch":"main"}' \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects"
            head -c 300 /tmp/create.json || true; echo
          fi
          if curl -fsS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/gnk-asg-tjednik" >/dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Projekt nije dostupan (ovlasti tokena Pages:Edit?)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Objavi na Cloudflare Pages
        if: steps.cf.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy apps/tjednik/site \
            --project-name=gnk-asg-tjednik \
            --branch=main \
            --commit-dirty=true

      - name: Sažetak
        if: always()
        shell: bash
        run: |
          COUNT=$(node -e "const f=require('./apps/tjednik/site/feed.json');console.log(f.items.length)" 2>/dev/null || echo 0)
          {
            echo "## BUSINESS TJEDNIK"
            echo "- https://gnk-asg-tjednik.pages.dev/"
            echo "- kritika u feedu: ${COUNT}"
            echo "- status: automatski kritički osvrti, izvornici povezani"
          } >> "$GITHUB_STEP_SUMMARY"
