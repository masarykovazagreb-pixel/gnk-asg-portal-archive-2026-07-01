name: Set gnk-asg-image-proxy secret (jednokratno)

on:
  workflow_dispatch:
    inputs:
      pexels_key:
        description: "Pexels API kljuc - jednokratni unos, maskiran u logovima"
        required: true
        type: string

permissions:
  contents: read

jobs:
  postavi-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: workers/gnk-asg-image-proxy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Maskiraj kljuc u logovima
        run: echo "::add-mask::${{ inputs.pexels_key }}"

      - name: Postavi PEXELS_API_KEY kao Cloudflare secret
        env:
          PEXELS_KEY: ${{ inputs.pexels_key }}
        run: echo "$PEXELS_KEY" | npx wrangler@4 secret put PEXELS_API_KEY

      - name: Provjeri da ruta sada stvarno vraca slike
        run: |
          set -euo pipefail
          sleep 5
          status=$(curl -s -o /tmp/o.json -w '%{http_code}' "https://gnk-asg.hr/api/slike?upit=business")
          echo "status: $status"
          cat /tmp/o.json
          test "$status" = "200"
          grep -q '"rezultati"' /tmp/o.json
