name: Macro Market Data Refresh
on:
  schedule:
    - cron: '25 6,14 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: editorial-main-writer
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh BTC / gold / Brent oil / USD-EUR cross-asset dataset
        run: node scripts/refresh-macro-market.mjs
      - name: Commit if changed
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/portal/data/macro_market.json; then
            echo "No macro market change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/portal/data/macro_market.json
          git commit -m "Refresh macro market data (BTC/gold/Brent/USD-EUR)"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            echo "Push odbijen (pokusaj $attempt) - main se pomaknuo, radim fetch+rebase."
            git fetch origin main
            git rebase origin/main || { echo "Rebase konflikt."; exit 1; }
            sleep $((attempt * 5))
            if [ "$attempt" = "5" ]; then echo "Push nije uspio nakon 5 pokusaja."; exit 1; fi
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Dispatch exact-SHA production deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          gh workflow run deploy-admin-auth-v6.yml \
            --repo beckuphome-gnk/gnk-asg-portal \
            --ref main \
            -f confirm_production_deploy=DEPLOY_ADMIN_AUTH_V6 \
            -f approved_sha="$APPROVED_SHA"
