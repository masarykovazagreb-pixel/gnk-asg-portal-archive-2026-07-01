name: Objavi na Dev.to sada (jednokratno)

on:
  workflow_dispatch:
    inputs:
      devto_key:
        description: "Dev.to API kljuc - koristi se samo u ovom pokretanju, nigdje se ne sprema kao secret"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: blog-mirror-publish
  cancel-in-progress: false

jobs:
  objavi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Maskiraj kljuc u logovima
        run: echo "::add-mask::${{ inputs.devto_key }}"
      - name: Prvo azuriraj stare objave bez slike
        env:
          DEVTO_API_KEY: ${{ inputs.devto_key }}
          DEVTO_PAUSE_MS: '10000'
        run: node scripts/devto-publish-v1.mjs --azuriraj-stare --live
      - name: Zatim objavi sve preostalo spremno
        env:
          DEVTO_API_KEY: ${{ inputs.devto_key }}
          DEVTO_PER_RUN: '16'
          DEVTO_PAUSE_MS: '10000'
        run: node scripts/devto-publish-v1.mjs --live
      - name: Commit evidencije objavljenog
        run: |
          git config user.name "gnk-asg-bot"
          git config user.email "it@gnk-asg.hr"
          git add apps/portal/data/devto-content/
          if git diff --cached --quiet; then
            echo "Nema promjena za commit."
            exit 0
          fi
          git commit -m "Dev.to: evidencija objavljenog"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Push uspio (pokusaj $attempt)."
              exit 0
            fi
            echo "Push odbijen (pokusaj $attempt) - main se pomaknuo, radim fetch+rebase i pokusavam ponovno."
            git fetch origin main
            git rebase origin/main || { echo "Rebase konflikt - zaustavljam se, evidencija ostaje u workflow logu."; exit 1; }
            sleep $((attempt * 5))
          done
          echo "Push nije uspio nakon 5 pokusaja."
          exit 1
