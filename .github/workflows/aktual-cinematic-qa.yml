name: AKTUAL Cinematic Channels QA
on:
  pull_request:
    paths:
      - 'apps/kanal/**'
      - 'apps/tjednik/**'
      - 'apps/region/engine/build.mjs'
      - 'apps/region/engine/kanal-cinematic-v3.mjs'
      - 'apps/region/image-photo-rights-v1.json'
      - '.github/workflows/aktual-cinematic-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  channel-design:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check apps/kanal/build.mjs
          node --check apps/region/engine/build.mjs
          node --check apps/region/engine/kanal-cinematic-v3.mjs
          node --check apps/kanal/src/assets/kanal.js
          node --input-type=module -e "import {CINEMATIC_JS} from './apps/region/engine/kanal-cinematic-v3.mjs'; new Function(CINEMATIC_JS)"
      - name: Build Zagreb KANAL
        run: |
          node apps/kanal/build.mjs
          grep -q 'cinematic-intro' apps/kanal/site/index.html
          grep -q 'data-local-clock' apps/kanal/site/index.html
          grep -q 'data-freshness' apps/kanal/site/index.html
          grep -q 'share-hashtags' apps/kanal/site/index.html || grep -R -q 'share-hashtags' apps/kanal/site/*/index.html
      - name: Build Beograd regional channel
        run: |
          node apps/region/engine/build.mjs --channel beograd
          test -s apps/portal/kanal/beograd/assets/kanal-cinematic-v3.js
          grep -q 'region-clock' apps/portal/kanal/beograd/index.html
          grep -q 'region-fresh' apps/portal/kanal/beograd/index.html
          node --input-type=module -e "import {readFileSync} from 'node:fs';import assert from 'node:assert/strict';const items=JSON.parse(readFileSync('apps/region/data/beograd.json','utf8')).items;const latest=items.map(x=>x.date).filter(x=>x&&!Number.isNaN(Date.parse(x))).sort((a,b)=>Date.parse(b)-Date.parse(a))[0]||'';const html=readFileSync('apps/portal/kanal/beograd/index.html','utf8');const marker=html.match(/data-region-fresh=\"([^\"]*)\"/);assert(marker,'missing freshness marker');assert.equal(marker[1],latest,'badge must track latest article, not build time');"
          grep -q 'cinematic-ink' apps/portal/kanal/beograd/assets/region.css
          grep -R -q 'region-share' apps/portal/kanal/beograd/clanak/
          grep -R -q 'class="artimg"' apps/portal/kanal/beograd/clanak/
          if grep -R -q '/api/img?u=' apps/portal/kanal/beograd/clanak/; then
            echo "ERROR: External RSS photos must have documented licensing evidence."
            exit 1
          fi
          node --input-type=module -e "import {readFileSync} from 'node:fs';const d=JSON.parse(readFileSync('apps/region/image-photo-rights-v1.json','utf8'));if(d.schema_version!=='AKTUAL_REGION_IMAGE_RIGHTS_V1'||!Array.isArray(d.approved_images))throw Error('photo-rights-registry-missing');console.log('External image licences:',d.approved_images.length)"

      - name: Build Business Tjednik
        run: |
          node --check apps/tjednik/build.mjs
          node --check apps/tjednik/src/assets/tjednik.js
          node apps/tjednik/build.mjs
          test -s apps/tjednik/site/assets/og/tjednik.png
          test -s apps/tjednik/site/assets/tjednik.js
          grep -q 'tjednik-cinematic-hero' apps/tjednik/site/index.html
          grep -q 'data-tjednik-clock' apps/tjednik/site/index.html
          grep -q 'data-tjednik-fresh' apps/tjednik/site/index.html
          grep -q 'tjednik-hero-visual' apps/tjednik/site/index.html
      - name: No production publishing in QA
        run: echo "This workflow runs offline build checks only; no deploy."
