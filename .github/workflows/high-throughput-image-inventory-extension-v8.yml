name: High Throughput Image Inventory Extension V8

on:
  pull_request:
    paths:
      - 'apps/portal/**'
      - 'ops/high-throughput-capability-extension-v8.json'
      - 'scripts/audit-public-image-unified-inventory-v1.mjs'
      - 'scripts/audit-image-preload-contract-v1.mjs'
      - 'scripts/audit-image-cross-surface-traceability-v1.mjs'
      - 'scripts/validate-high-throughput-capability-extension-v8.py'
      - '.github/workflows/high-throughput-image-inventory-extension-v8.yml'
  push:
    branches: [main]
    paths:
      - 'apps/portal/**'
      - 'ops/high-throughput-capability-extension-v8.json'
      - 'scripts/audit-public-image-unified-inventory-v1.mjs'
      - 'scripts/audit-image-preload-contract-v1.mjs'
      - 'scripts/audit-image-cross-surface-traceability-v1.mjs'
      - 'scripts/validate-high-throughput-capability-extension-v8.py'
      - '.github/workflows/high-throughput-image-inventory-extension-v8.yml'
permissions:
  contents: read
concurrency:
  group: high-throughput-image-inventory-v8-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax checks
        run: |
          set -euo pipefail
          node --check scripts/audit-public-image-unified-inventory-v1.mjs
          node --check scripts/audit-image-preload-contract-v1.mjs
          node --check scripts/audit-image-cross-surface-traceability-v1.mjs
          python -m py_compile scripts/validate-high-throughput-capability-extension-v8.py
      - name: Unified public image inventory
        run: node scripts/audit-public-image-unified-inventory-v1.mjs
      - name: Image preload contract
        run: node scripts/audit-image-preload-contract-v1.mjs
      - name: Image cross-surface traceability
        run: node scripts/audit-image-cross-surface-traceability-v1.mjs
      - name: Workforce capability extension topology
        run: python scripts/validate-high-throughput-capability-extension-v8.py
      - name: Upload extension evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: high-throughput-image-inventory-v8-${{ github.sha }}
          path: |
            artifacts/public-image-unified-inventory/**
            artifacts/image-preload-contract/**
            artifacts/image-cross-surface-traceability/**
            artifacts/high-throughput-capability-extension-v8/**
          if-no-files-found: warn
          retention-days: 14
