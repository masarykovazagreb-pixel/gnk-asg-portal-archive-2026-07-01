name: Test expanded market pulse data (one-off)
on:
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run and capture output
        run: |
          echo "# expanded market-pulse test v3" > /tmp/d.md
          echo '```' >> /tmp/d.md
          node scripts/refresh-market-pulse.mjs >> /tmp/d.md 2>&1 || echo "EXIT: $?" >> /tmp/d.md
          echo '```' >> /tmp/d.md
          echo "## detail" >> /tmp/d.md
          echo '```' >> /tmp/d.md
          python3 -c "import json;d=json.load(open('apps/portal/data/market-pulse.json'));print('indices ok:',sum(1 for x in d['indices'] if x['ok']),'/',len(d['indices']));print('commodities ok:',sum(1 for x in d['commodities'] if x['ok']),'/',len(d['commodities']));print('currencies ok:',sum(1 for x in d['currencies'] if x['ok']),'/',len(d['currencies']));print('stocks ok:',sum(1 for x in d['stocks'] if x['ok']),'/',len(d['stocks']));print('ecb ok:',d['ecbRates'].get('ok'));print('ecb rates count:',len(d['ecbRates'].get('rates',{})));[print(' FAIL:',x['label'],x.get('error')) for x in d['indices']+d['commodities']+d['currencies']+d['stocks'] if not x['ok']]" >> /tmp/d.md
          echo '```' >> /tmp/d.md
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" --title "expanded market-pulse test v3" --body-file /tmp/d.md
