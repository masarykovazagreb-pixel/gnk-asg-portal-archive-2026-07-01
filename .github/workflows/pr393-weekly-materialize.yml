name: PR393 weekly static materialization (staging only)

on:
  push:
    branches:
      - integration/aktual-world-201-current-main-20261107
    paths:
      - .github/workflows/pr393-weekly-materialize.yml
      - apps/portal/data/aktual-weekly-curation.json

permissions:
  contents: write

concurrency:
  group: pr393-weekly-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'masarykovazagreb-pixel/gnk-asg-portal-archive-2026-07-01' && github.ref == 'refs/heads/integration/aktual-world-201-current-main-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize source-linked, curated weekly issue (branch only)
        run: |
          set -euo pipefail
          node scripts/build-aktual-media-weekly-v1.mjs
          node scripts/build-aktual-media-weekly-archive-v1.mjs --refresh
          node scripts/editorial-registry-v1.mjs
          node scripts/generate-editorial-sitemap-v2.mjs
          node scripts/test-aktual-weekly-source-integrity-v1.mjs
          python3 scripts/validate_publication_sitemap_registry_v1.py
          node scripts/test-aktual-media-weekly-v1.mjs
          node scripts/audit-editorial-publication-completeness-v1.mjs
      - name: Commit only verified weekly artifacts to staging branch
        run: |
          set -euo pipefail
          git add -- \
            apps/portal/data/aktual-weekly.json \
            apps/portal/data/editorial-registry.json \
            apps/portal/data/aktual-weekly-archives/2026-11-02.json \
            apps/portal/gnk-aktual/tjedni/2026-11-02/index.html \
            apps/portal/en/gnk-aktual/weekly/2026-11-02/index.html \
            apps/portal/gnk-aktual/tjedni/index.html \
            apps/portal/en/gnk-aktual/weekly/index.html \
            apps/portal/editorial-sitemap.xml \
            apps/portal/sitemap-index.xml
          if git diff --cached --quiet; then
            echo "No weekly artifacts changed."
            exit 0
          fi
          git diff --cached --stat
          git -c user.name='MASTER ASG CI' -c user.email='actions@users.noreply.github.com' commit -m 'build(weekly): persist eight distinct illustrated cards and archive'
          git push origin "HEAD:${GITHUB_REF_NAME}"
