name: DNEVNIK — deploy

# Objavljuje AKTUAL DNEVNIK (apps/dnevnik) na Cloudflare Pages.
# Kanonska adresa: https://gnk-asg-dnevnik.pages.dev/
# Samostalan portal: jedan dan, osam gradova, objave po satima.
# Isti gate kao ARHIVA (tests/test-satellites-v1.mjs) — HR/EN par, sitemap, feed, alt.

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'apps/dnevnik/**'
      - 'apps/satellites/**'
      - 'apps/region/data/**'
      - 'apps/region/channels.json'
      - 'tests/test-satellites-v1.mjs'
      - '.github/workflows/dnevnik-deploy.yml'
  schedule:
    - cron: '45 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dnevnik-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DNEVNIK_BASE: https://gnk-asg-dnevnik.pages.dev/
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sastavi dnevnik
        shell: bash
        run: |
          set -uo pipefail
          node apps/dnevnik/engine/build.mjs
          test -f apps/dnevnik/site/index.html
          test -f apps/dnevnik/site/en/index.html
          test -f apps/dnevnik/site/sitemap.xml
          test -f apps/dnevnik/site/feed.xml
          test -f apps/dnevnik/site/data/days.json
          node -e "const d=require('./apps/dnevnik/site/data/days.json'); console.log('dana:', d.days.length); if(!d.days.length) process.exit(1)"

      - name: Gate samostalnih portala
        shell: bash
        run: node tests/test-satellites-v1.mjs

      - name: Pripremi Cloudflare Pages projekt
        id: cf
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${CF_TOKEN:-}" ] || [ -z "${CF_ACCOUNT:-}" ]; then
            echo "::warning::Cloudflare secrets nisu dostupni — preskačem deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(curl -s -o /tmp/proj.json -w '%{http_code}' \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/gnk-asg-dnevnik")
          if [ "$code" != "200" ]; then
            echo "Projekt ne postoji (HTTP $code) — kreiram."
            curl -s -o /tmp/create.json -w 'Create HTTP %{http_code}\n' -X POST \
              -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              --data '{"name":"gnk-asg-dnevnik","production_branch":"main"}' \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects"
            head -c 300 /tmp/create.json || true; echo
          fi
          if curl -fsS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/gnk-asg-dnevnik" >/dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Projekt nije dostupan (ovlasti tokena Pages:Edit?)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Objavi na Cloudflare Pages
        if: steps.cf.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy apps/dnevnik/site \
            --project-name=gnk-asg-dnevnik \
            --branch=main \
            --commit-dirty=true

      - name: Sažetak
        if: always()
        shell: bash
        run: |
          DAYS=$(node -e "const d=require('./apps/dnevnik/site/data/days.json');console.log(d.days.length)" 2>/dev/null || echo 0)
          {
            echo "## AKTUAL DNEVNIK"
            echo "- https://gnk-asg-dnevnik.pages.dev/"
            echo "- dana u presjeku: ${DAYS}"
            echo "- rute: /, /en/, /dan/<datum>/, /en/day/<datum>/, /o-dnevniku/, /en/about/"
            echo "- sitemap: https://gnk-asg-dnevnik.pages.dev/sitemap.xml"
          } >> "$GITHUB_STEP_SUMMARY"
