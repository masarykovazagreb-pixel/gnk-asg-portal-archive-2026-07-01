name: Fix and deploy Mail Center autoreply BCC
on:
  push:
    paths:
      - '.github/workflows/fix-deploy-mail-autoreply-bcc-20260722.yml'
permissions:
  contents: write
  issues: write
concurrency:
  group: gnk-asg-mail-autoreply-hotfix
  cancel-in-progress: false
jobs:
  fix-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch BCC transport and add executable regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('workers/gnk-asg-mail-center-worker/src/index.js')
          text = path.read_text()
          old = "      bcc: mandatoryBcc(env).join(', '),"
          new = "      bcc: mandatoryBcc(env),"
          if old not in text:
              raise SystemExit('Expected broken BCC transport expression not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cat > scripts/test-mail-center-autoreply-bcc-v1.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const source = fs.readFileSync('workers/gnk-asg-mail-center-worker/src/index.js', 'utf8');
          assert.match(source, /bcc:\s*mandatoryBcc\(env\),/);
          assert.doesNotMatch(source, /bcc:\s*mandatoryBcc\(env\)\.join\(/);
          assert.match(source, /prepareAiAutoReply\(message, env\)/);
          assert.match(source, /target = \{ message, env \}/);
          console.log('Mail Center autoreply BCC array and non-blocking AI fallback contract: PASS');
          EOF
          node --check workers/gnk-asg-mail-center-worker/src/index.js
          node scripts/test-mail-center-autoreply-bcc-v1.mjs
      - name: Commit durable source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/gnk-asg-mail-center-worker/src/index.js scripts/test-mail-center-autoreply-bcc-v1.mjs
          git commit -m 'fix(mail): send autoreply BCC as address array with resilient AI fallback'
          git push origin HEAD:main
          echo "FIX_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build Mail Center runtime config
        working-directory: workers/gnk-asg-mail-center-worker
        shell: bash
        run: |
          cat > wrangler.runtime.toml <<'EOF'
          name = "gnk-asg-mail-center-worker"
          main = "src/index.js"
          compatibility_date = "2026-06-18"
          workers_dev = true
          preview_urls = true

          [ai]
          binding = "AI"

          [vars]
          AI_AUTO_REPLY_DISABLED = "false"

          [[kv_namespaces]]
          binding = "GNK_ASG_KV"
          id = "a3e9e78c7d554d7fa10996da9a89e7bc"

          [[send_email]]
          name = "EMAIL"
          remote = true
          EOF
      - name: Deploy fixed Mail Center Worker
        working-directory: workers/gnk-asg-mail-center-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.runtime.toml --name gnk-asg-mail-center-worker --keep-vars
      - name: Verify live bindings and status
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CF_TOKEN")
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/services/gnk-asg-mail-center-worker/environments/production/settings" "${auth[@]}" > /tmp/settings.json
          curl -fsS "https://gnk-asg-mail-center-worker.beckuphome.workers.dev/api/mail-center/status" > /tmp/status.json
          python3 - <<'PY' > /tmp/report.md
          import json, os
          settings=json.load(open('/tmp/settings.json'))
          status=json.load(open('/tmp/status.json'))
          bindings=[]
          for item in settings.get('result',{}).get('bindings',[]):
              if item.get('name') in {'AI','AI_AUTO_REPLY_DISABLED','EMAIL','GNK_ASG_KV'}:
                  bindings.append({k:item.get(k) for k in ('name','type','text') if item.get(k) is not None})
          print('## Mail autoreply hotfix deployed')
          print('```json')
          print(json.dumps({'fixSha':os.environ.get('FIX_SHA'),'bindings':bindings,'status':status},ensure_ascii=False,indent=2))
          print('```')
          PY
          gh issue comment 712 --repo "${{ github.repository }}" --body-file /tmp/report.md
