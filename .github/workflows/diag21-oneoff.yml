name: Check MAIL_AUTO_REPLY_LIVE env var (one-off)
on:
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find account and query worker settings
        run: |
          CF_TOKEN="cfut_RQcfszqhP9EYO7NmPjgWRjrklpw9pCN4e89DjKXL42804731"
          echo "# MAIL_AUTO_REPLY_LIVE check $(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/d.md
          echo '```' >> /tmp/d.md
          echo "--- token verify ---" >> /tmp/d.md
          curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" -H "Authorization: Bearer $CF_TOKEN" >> /tmp/d.md
          echo "" >> /tmp/d.md
          echo "--- accounts ---" >> /tmp/d.md
          ACCOUNTS=$(curl -s "https://api.cloudflare.com/client/v4/accounts" -H "Authorization: Bearer $CF_TOKEN")
          echo "$ACCOUNTS" >> /tmp/d.md
          ACCOUNT_ID=$(echo "$ACCOUNTS" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['result'][0]['id'] if d.get('result') else '')")
          echo "" >> /tmp/d.md
          echo "account_id: $ACCOUNT_ID" >> /tmp/d.md
          echo "--- worker settings for gnk-asg-direct-operator ---" >> /tmp/d.md
          curl -s "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/services/gnk-asg-direct-operator/environments/production/settings" -H "Authorization: Bearer $CF_TOKEN" >> /tmp/d.md
          echo '```' >> /tmp/d.md
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" --title "MAIL_AUTO_REPLY_LIVE check $(date -u +%Y-%m-%dT%H:%M:%SZ)" --body-file /tmp/d.md
