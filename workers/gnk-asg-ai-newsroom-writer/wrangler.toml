name = "gnk-asg-ai-newsroom-writer"
main = "src/index.js"
compatibility_date = "2026-06-13"
workers_dev = false

# Draft-only source-gated worker. There is no public route. The schedule is a
# no-op unless the operator separately enables both runtime gates below and
# configures reviewed service/trigger credentials.
# It reads only the existing RSS metadata feed, creates original local SVG art,
# and enqueues drafts for human review. It never republishes source images or
# article bodies and never comments on external media platforms.

[vars]
NEWSROOM_DRAFT_GENERATION_ENABLED = "false"
NEWSROOM_CLOUDFLARE_AI_APPROVED = "false"

[triggers]
# Daily draft window only; generation stays disabled by default.
crons = ["0 6 * * *"]
