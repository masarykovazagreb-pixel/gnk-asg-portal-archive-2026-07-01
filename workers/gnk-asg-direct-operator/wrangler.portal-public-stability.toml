  { pattern = "gnk-asg.hr/data/exchanges.json*", zone_name = "gnk-asg.hr" },
  { pattern = "gnk-asg.hr/data/stablecoins.json*", zone_name = "gnk-asg.hr" },
  { pattern = "gnk-asg.hr/data/daily-market-brief.json*", zone_name = "gnk-asg.hr" },
  { pattern = "gnk-asg.hr/data/status.json*", zone_name = "gnk-asg.hr" },
  { pattern = "gnk-asg.hr/assets/public-content-shell-v1.css*", zone_name = "gnk-asg.hr" },
  { pattern = "gnk-asg.hr/assets/public-content-shell-v1.js*", zone_name = "gnk-asg.hr" }
