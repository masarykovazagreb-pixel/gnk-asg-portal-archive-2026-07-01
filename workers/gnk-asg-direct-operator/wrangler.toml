name = "gnk-asg-direct-operator-review"
main = "src/index-digital-workforce-v1.js"
compatibility_date = "2026-06-13"
workers_dev = true
preview_urls = true

# ISOLATED REVIEW-ONLY CONFIG
# This default profile is deliberately separated from the production Worker.
# It has no production KV, D1, R2, Email or AI bindings and no scheduled triggers.
# Production configuration remains in wrangler.workforce-production-no-routes.toml
# and must only be used after separate explicit production-deploy approval.

[assets]
directory = "../../apps/portal"
binding = "ASSETS"
run_worker_first = true

[vars]
PUBLIC_BRAND = "GNK ASG"
PUBLIC_ENVIRONMENT = "review-direct-operator"
DEPLOY_REVISION = "20261012-local-review-only"
SAFE_GET_DIRECT_MODE = "true"
NEWS_AUTO_PUBLICATION_SCHEDULED_LIVE = "false"
MAIL_AUTO_REPLY_LIVE = "false"
MAIL_STUDIO_LIVE = "false"
MAIL_MANUAL_LIVE = "false"
MAIL_PROFILE_TEST_LIVE = "false"
MAIL_PROFILE_TEST_RECIPIENTS = "beckuphome@gmail.com"
MAIL_BOOTSTRAP_SMOKE_TEST = "false"
MAIL_MANDATORY_BCC = "beckuphome@gmail.com"
MEDIA_OUTREACH_LIVE = "false"
MEDIA_OUTREACH_SCHEDULED_LIVE = "false"
MEDIA_OUTREACH_TEST_LIVE = "false"
MEDIA_OUTREACH_TEST_RECIPIENTS = "beckuphome@gmail.com"
MEDIA_OUTREACH_AUTO_TEST_RECIPIENT = "beckuphome@gmail.com"
MEDIA_OUTREACH_REPORT_RECIPIENTS = "beckuphome@gmail.com"
MEDIA_APPLICATION_AUTO_ACK = "false"
EMAIL_OPEN_TRACKING_ENABLED = "false"
EMAIL_RECEIPT_CONFIRMATION_ENABLED = "false"
