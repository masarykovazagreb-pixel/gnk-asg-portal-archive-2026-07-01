name = "gnk-asg-direct-operator"
main = "src/index-admin-hub-v21.js"
compatibility_date = "2026-06-13"
workers_dev = true
preview_urls = true

routes = [
  { pattern = "gnk-asg.hr/*", zone_name = "gnk-asg.hr" },
  { pattern = "www.gnk-asg.hr/*", zone_name = "gnk-asg.hr" },
  { pattern = "gnk-asg.hr/news", zone_name = "gnk-asg.hr" },
  { pattern = "gnk-asg.hr/news/*", zone_name = "gnk-asg.hr" },
  { pattern = "gnk-asg.hr/vijesti", zone_name = "gnk-asg.hr" },
  { pattern = "gnk-asg.hr/vijesti/*", zone_name = "gnk-asg.hr" },
  { pattern = "gnk-asg.hr/app", zone_name = "gnk-asg.hr" },
  { pattern = "gnk-asg.hr/app/*", zone_name = "gnk-asg.hr" },
  { pattern = "www.gnk-asg.hr/news", zone_name = "gnk-asg.hr" },
  { pattern = "www.gnk-asg.hr/news/*", zone_name = "gnk-asg.hr" },
  { pattern = "www.gnk-asg.hr/vijesti", zone_name = "gnk-asg.hr" },
  { pattern = "www.gnk-asg.hr/vijesti/*", zone_name = "gnk-asg.hr" },
  { pattern = "www.gnk-asg.hr/app", zone_name = "gnk-asg.hr" },
  { pattern = "www.gnk-asg.hr/app/*", zone_name = "gnk-asg.hr" },
  { pattern = "gnk-asg.hr/operator-dashboard*", zone_name = "gnk-asg.hr" },
  { pattern = "www.gnk-asg.hr/operator-dashboard*", zone_name = "gnk-asg.hr" },
  { pattern = "gnk-asg.hr/status-automatizacije*", zone_name = "gnk-asg.hr" },
  { pattern = "www.gnk-asg.hr/status-automatizacije*", zone_name = "gnk-asg.hr" },
  { pattern = "gnk-asg.hr/automation-status*", zone_name = "gnk-asg.hr" },
  { pattern = "www.gnk-asg.hr/automation-status*", zone_name = "gnk-asg.hr" }
]

[[kv_namespaces]]
binding = "GNK_ASG_CONFIG_KV"
id = "d6f5dac9fa034d8d813db0de44eb7b1b"

[[kv_namespaces]]
binding = "GNK_ASG_KV"
id = "a3e9e78c7d554d7fa10996da9a89e7bc"

[[d1_databases]]
binding = "GNK_ASG_D1"
database_name = "gnk_asg_operator_logs"
database_id = "2116c4e5-1850-4888-91e7-c47deead3ced"

[[r2_buckets]]
binding = "GNK_ASG_MEDIA_ASSETS"
bucket_name = "gnk-asg-media-assets"

[[send_email]]
name = "EMAIL"
remote = true

[vars]
PUBLIC_BRAND = "GNK ASG"
PUBLIC_ENVIRONMENT = "direct-operator"
SAFE_GET_DIRECT_MODE = "true"
AUTO_EDITOR_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
MEDIA_OUTREACH_LIVE = "false"
MEDIA_OUTREACH_TEST_LIVE = "false"
MEDIA_APPLICATION_AUTO_ACK = "true"
MEDIA_APPLICATION_DEADLINE = "2026-07-20T21:59:59.000Z"
MEDIA_OUTREACH_FROM = "media@gnk-asg.hr"
MEDIA_OUTREACH_MAX_PER_HOUR = "10"
MEDIA_OUTREACH_MAX_PER_DAY = "50"

[assets]
directory = "../../apps/portal"
binding = "ASSETS"
run_worker_first = true

[triggers]
crons = ["*/5 * * * *"]

[ai]
binding = "AI"
