name = "gnk-asg-news-publications-hotfix"
main = "src/index-publication-news-hotfix.js"
compatibility_date = "2026-06-13"
workers_dev = true
preview_urls = true

[[kv_namespaces]]
binding = "GNK_ASG_CONFIG_KV"
id = "d6f5dac9fa034d8d813db0de44eb7b1b"

[[kv_namespaces]]
binding = "GNK_ASG_KV"
id = "a3e9e78c7d554d7fa10996da9a89e7bc"

[vars]
PUBLIC_BRAND = "GNK ASG"
PUBLIC_ENVIRONMENT = "news-publications-hotfix"
AUTO_EDITOR_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"

[assets]
directory = "../../apps/portal"
binding = "ASSETS"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]

[ai]
binding = "AI"

[[routes]]
pattern = "gnk-asg.hr/data/news*"
zone_name = "gnk-asg.hr"

[[routes]]
pattern = "gnk-asg.hr/data/auto-editor*"
zone_name = "gnk-asg.hr"

[[routes]]
pattern = "gnk-asg.hr/api/news-refresh*"
zone_name = "gnk-asg.hr"

[[routes]]
pattern = "gnk-asg.hr/operator/news*"
zone_name = "gnk-asg.hr"

[[routes]]
pattern = "gnk-asg.hr/operator/auto-editor*"
zone_name = "gnk-asg.hr"

[[routes]]
pattern = "gnk-asg.hr/objave*"
zone_name = "gnk-asg.hr"

[[routes]]
pattern = "gnk-asg.hr/publications*"
zone_name = "gnk-asg.hr"

[[routes]]
pattern = "gnk-asg.hr/vijesti*"
zone_name = "gnk-asg.hr"

[[routes]]
pattern = "gnk-asg.hr/news*"
zone_name = "gnk-asg.hr"
