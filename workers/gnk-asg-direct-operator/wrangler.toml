name = "gnk-asg-direct-operator"
main = "src/index-unified-auth-v14.js"
compatibility_date = "2026-06-13"
workers_dev = true
preview_urls = true

# REVIEW-ONLY SAFETY LOCK
# This branch must not be used as production approval. Production routes are kept
# here only as the existing deployment contract, but all campaign/outreach live
# switches below are disabled for review runtime and must be re-enabled only after
# explicit executive deploy approval.
routes = [
  { pattern = "gnk-asg.hr/*", zone_name = "gnk-asg.hr" },
  { pattern = "www.gnk-asg.hr/*", zone_name = "gnk-asg.hr" }
]

[assets]
directory = "../../apps/portal"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "GNK_ASG_CONFIG_KV"
id = "d6f5dac9fa034d8d813db0de44eb7b1b"

[[kv_namespaces]]
binding = "GNK_ASG_KV"
id = "a3e9e78c7d554d7fa10996da9a89e7bc"

[[d1_databases]]
binding = "GNK_ASG_D1"
database_name = "gnk_asg_operator_logs"
database_id = "2116c4e5-1850-4888-91e7-c47deead3ced"

[[r2_buckets]]
binding = "GNK_ASG_MEDIA_ASSETS"
bucket_name = "gnk-asg-media-assets"

[[send_email]]
name = "EMAIL"
remote = true

[triggers]
crons = ["*/15 * * * *"]

[vars]
PUBLIC_BRAND = "GNK ASG"
PUBLIC_ENVIRONMENT = "review-direct-operator"
DEPLOY_REVISION = "20260705-enterprise-review-worker-lock-v1"
SAFE_GET_DIRECT_MODE = "true"
AUTO_EDITOR_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"

# Mail/Webmail may render, draft, validate and run internal status checks in review,
# but must not send real campaign or bulk traffic from this branch.
MAIL_MANUAL_LIVE = "false"
MAIL_MANDATORY_BCC = "rht@gmx.com"
MAIL_PROFILE_TEST_LIVE = "false"
MAIL_PROFILE_TEST_RECIPIENTS = "rht@gmx.com,beckuphome@gmail.com"
MAIL_BOOTSTRAP_SMOKE_TEST = "false"

# Media outreach is locked down for review. These switches prevent accidental mass
# sending while preserving UI/status validation and endpoint health checks.
MEDIA_OUTREACH_LIVE = "false"
MEDIA_OUTREACH_SCHEDULED_LIVE = "false"
MEDIA_OUTREACH_TEST_LIVE = "false"
MEDIA_OUTREACH_TEST_RECIPIENTS = "rht@gmx.com"
MEDIA_OUTREACH_AUTO_TEST_RECIPIENT = "rht@gmx.com"
MEDIA_OUTREACH_REPORT_RECIPIENTS = "rht@gmx.com"
MEDIA_OUTREACH_MAX_PER_HOUR = "1"
MEDIA_OUTREACH_MAX_PER_DAY = "3"
MEDIA_APPLICATION_AUTO_ACK = "false"

EMAIL_STATUS_PUBLIC_ORIGIN = "https://gnk-asg.hr"
EMAIL_OPEN_TRACKING_ENABLED = "false"
EMAIL_STATUS_SYNC_LOOKBACK_HOURS = "48"
EMAIL_STATUS_SYNC_OVERLAP_MINUTES = "15"
EMAIL_STATUS_SYNC_LIMIT = "5000"
