name = "gnk-asg-direct-operator"
main = "src/index-unified-auth-v18.js"
compatibility_date = "2026-06-13"
workers_dev = true
preview_urls = true

# SAFETY-COMPAT CONFIG
# Production routes are not declared here. Existing route assignment remains unchanged.

[[kv_namespaces]]
binding = "GNK_ASG_CONFIG_KV"
id = "d6f5dac9fa034d8d813db0de44eb7b1b"

# GNK_ASG_KV is intentionally not bound here.

[[d1_databases]]
binding = "GNK_ASG_D1"
database_name = "gnk_asg_operator_logs"
database_id = "2116c4e5-1850-4888-91e7-c47deead3ced"

[[r2_buckets]]
binding = "GNK_ASG_MEDIA_ASSETS"
bucket_name = "gnk-asg-media-assets"

[[send_email]]
name = "EMAIL"
remote = true

[vars]
PUBLIC_BRAND = "GNK ASG"
PUBLIC_ENVIRONMENT = "review-direct-operator"
DEPLOY_REVISION = "20260713-index-the-code-newsroom-final"
SAFE_GET_DIRECT_MODE = "true"
AUTO_EDITOR_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"

# Controlled inbound acknowledgements and individual manual messages only.
MAIL_AUTO_REPLY_LIVE = "true"
MAIL_STUDIO_LIVE = "true"
MAIL_MANUAL_LIVE = "true"
MAIL_MANDATORY_BCC = "beckuphome@gmail.com"
MAIL_PROFILE_TEST_LIVE = "false"
MAIL_PROFILE_TEST_RECIPIENTS = "beckuphome@gmail.com"
MAIL_BOOTSTRAP_SMOKE_TEST = "false"

# Campaign, bulk and scheduled outreach remain locked.
MEDIA_OUTREACH_FROM = "media@gnk-asg.hr"
MEDIA_OUTREACH_LIVE = "false"
MEDIA_OUTREACH_SCHEDULED_LIVE = "false"
MEDIA_OUTREACH_TEST_LIVE = "false"
MEDIA_OUTREACH_TEST_RECIPIENTS = "beckuphome@gmail.com"
MEDIA_OUTREACH_AUTO_TEST_RECIPIENT = "beckuphome@gmail.com"
MEDIA_OUTREACH_REPORT_RECIPIENTS = "beckuphome@gmail.com"
MEDIA_OUTREACH_MAX_PER_HOUR = "1"
MEDIA_OUTREACH_MAX_PER_DAY = "3"
MEDIA_APPLICATION_AUTO_ACK = "false"

EMAIL_STATUS_PUBLIC_ORIGIN = "https://gnk-asg.hr"
EMAIL_OPEN_TRACKING_ENABLED = "false"
EMAIL_STATUS_SYNC_LOOKBACK_HOURS = "48"
EMAIL_STATUS_SYNC_OVERLAP_MINUTES = "15"
EMAIL_STATUS_SYNC_LIMIT = "5000"

[assets]
directory = "../../apps/portal"
binding = "ASSETS"
run_worker_first = true
html_handling = "auto-trailing-slash"

[triggers]
crons = ["*/15 * * * *"]

[ai]
binding = "AI"