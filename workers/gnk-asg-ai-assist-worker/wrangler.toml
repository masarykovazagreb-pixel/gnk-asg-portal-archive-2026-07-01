name = "gnk-asg-ai-assist-worker"
main = "src/index.js"
compatibility_date = "2026-06-18"
workers_dev = true

routes = [
  { pattern = "gnk-asg.hr/api/ai-assist*", zone_name = "gnk-asg.hr" }
]

[ai]
binding = "AI"
# S+Chat anonymous usage budget: Cloudflare Workers Rate Limiting API.
# Namespace IDs are unique within the Cloudflare account; this is a new S+Chat-only namespace.
[[ratelimits]]
name = "SPLUS_CHAT_LIMITER"
namespace_id = "20261020"

[ratelimits.simple]
limit = 5
period = 60
