name = "gnk-asg-mail-studio-frontend"
main = "src/index.js"
compatibility_date = "2026-06-22"
workers_dev = true
preview_urls = true

[assets]
directory = "../../apps/portal"
binding = "ASSETS"
run_worker_first = true

[[routes]]
pattern = "gnk-asg.hr/mail-studio-pro/*"
zone_name = "gnk-asg.hr"

[[routes]]
pattern = "www.gnk-asg.hr/mail-studio-pro/*"
zone_name = "gnk-asg.hr"

[[routes]]
pattern = "gnk-asg.hr/assets/operator-token-vault.js"
zone_name = "gnk-asg.hr"

[[routes]]
pattern = "www.gnk-asg.hr/assets/operator-token-vault.js"
zone_name = "gnk-asg.hr"

[[routes]]
pattern = "gnk-asg.hr/assets/mail-studio-pro-bridge.js"
zone_name = "gnk-asg.hr"

[[routes]]
pattern = "www.gnk-asg.hr/assets/mail-studio-pro-bridge.js"
zone_name = "gnk-asg.hr"

[[routes]]
pattern = "gnk-asg.hr/assets/mail-studio-pro.js"
zone_name = "gnk-asg.hr"

[[routes]]
pattern = "www.gnk-asg.hr/assets/mail-studio-pro.js"
zone_name = "gnk-asg.hr"