# Template only. Never deploy before confirming DEV host and D1 binding.
name = "aktual-fast-news-dev"
main = "src/index.mjs"
compatibility_date = "2026-11-27"
workers_dev = false
preview_urls = false

[vars]
PUBLIC_ORIGIN = "https://dev.gnk-asg.hr"
PUBLISH_ENABLED = "false"

[[d1_databases]]
binding = "DB"
database_name = "aktual-fast-news-dev"
database_id = "REPLACE_WITH_AUTHORIZED_DEV_DATABASE_ID"
migrations_dir = "migrations"
