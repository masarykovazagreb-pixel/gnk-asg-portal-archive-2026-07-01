<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dnevni financijski dashboard | GNK ASG</title>
<meta name="robots" content="index,follow">
<style>
:root{color-scheme:dark;--gold:#f3cc62;--gold2:#ffe8a0;--line:rgba(243,204,98,.28);--muted:#b7c2d4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,rgba(243,204,98,.20),transparent 30%),#030508;color:#f8fafc;font-family:Inter,Arial,sans-serif}.wrap{width:min(1160px,calc(100% - 32px));margin:auto;padding:30px 0 60px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.mark{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#071a38,#0a1020);padding:12px 15px}.mark b{display:block;font:900 20px/1 Arial,sans-serif}.mark small{display:block;color:var(--gold2);font-size:10px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;margin-top:5px}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:10px 13px;text-decoration:none;background:rgba(255,255,255,.04);color:#fff;font-size:12px;font-weight:900}.gold{background:linear-gradient(135deg,#c99d35,#ffe08a);color:#07101f}.panel{border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,rgba(17,26,42,.94),rgba(5,8,14,.96));padding:20px;margin:20px 0}.k{color:var(--gold);text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:950}h1,h2{font-family:Georgia,serif;margin:.2em 0}h1{font-size:clamp(38px,6vw,72px);line-height:.94}p{color:var(--muted);line-height:1.55}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{border:1px solid rgba(255,255,255,.12);border-radius:20px;background:rgba(255,255,255,.045);padding:15px}.card strong{display:block;color:var(--gold2);font:700 26px/1 Georgia,serif;margin:7px 0}.chart{display:grid;gap:10px}.barrow{display:grid;grid-template-columns:190px 1fr 150px;gap:10px;align-items:center}.bar{height:18px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}.fill{height:100%;width:var(--w);background:linear-gradient(90deg,#b98b2d,#ffe08a)}.src{display:block;color:#ffe8a0;margin-top:6px}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.barrow{grid-template-columns:1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div class="mark"><b>GNK ASG · Finance Desk</b><small>daily dashboard</small></div><nav class="nav"><a class="btn" href="/">Index</a><a class="btn" href="/downloads/">PDF</a><a class="btn gold" href="/data/finance-daily-dashboard.json">JSON</a></nav></header>
<section class="panel"><p class="k">Dnevni financijski pregled</p><h1>Brojke, grafovi i izvori.</h1><p>Dashboard prikazuje zadnji potvrđeni financijski snapshot. Nove dnevne brojke dodaju se nakon novog dokumenta ili provjerenog internog izvora.</p></section>
<section id="content" class="panel"><p>Učitavanje financijskih podataka…</p></section>
</main>
<script>
const eur=new Intl.NumberFormat('hr-HR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const pct=n=>Math.max(4,Math.min(100,n));
fetch('/data/finance-daily-dashboard.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{
  const max=Math.max(...data.entities.flatMap(e=>e.metrics.filter(m=>m.id!=='equityRatio').map(m=>m.value)));
  document.getElementById('content').innerHTML=data.entities.map(entity=>`
    <section class="panel"><p class="k">${entity.name} · ${entity.period}</p><h2>${entity.name}</h2><div class="grid">${entity.metrics.map(m=>`<article class="card"><span>${m.label}</span><strong>${m.display}</strong></article>`).join('')}</div><div class="chart" style="margin-top:18px">${entity.metrics.map(m=>`<div class="barrow"><b>${m.label}</b><div class="bar"><div class="fill" style="--w:${m.id==='equityRatio'?pct(m.value):pct((m.value/max)*100)}%"></div></div><span>${m.display}</span></div>`).join('')}</div></section>
  `).join('')+`<section class="panel"><p class="k">Izvori</p>${data.sources.map(s=>`<a class="src" href="${s.url}">${s.entity} · ${s.period} · ${s.document}</a>`).join('')}</section><section class="panel"><p class="k">Approval queue</p><p>${data.approvalQueue.join(' · ')}</p></section>`;
}).catch(()=>{document.getElementById('content').innerHTML='<p>Financijski JSON trenutno nije dostupan.</p>';});
</script>
</body>
</html>
