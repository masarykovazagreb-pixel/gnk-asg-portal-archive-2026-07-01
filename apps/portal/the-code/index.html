<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>THE CODE</title>
<meta name="description" content="THE CODE">
<link rel="canonical" href="https://www.gnk-asg.hr/the-code/">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff}body{display:grid;place-items:center;font-family:Georgia,'Times New Roman',serif;overflow:hidden}.app{width:390px;height:844px;max-width:100vw;max-height:100vh;background:#000;position:relative;overflow:hidden}.scene{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:36px;animation:fade .9s ease}.scene.active{display:flex}@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.k{font-family:'Courier New',monospace;color:#333;font-size:10px;letter-spacing:4px;text-transform:uppercase;margin-bottom:24px}.title{color:#c9a84c;font-size:clamp(48px,14vw,92px);font-weight:400;letter-spacing:.16em;line-height:1;text-shadow:0 0 35px rgba(201,168,76,.55),0 0 90px rgba(201,168,76,.20)}.text{margin-top:28px;color:#bbb;font-size:18px;line-height:1.8;font-style:italic;max-width:310px}.gold{color:#c9a84c}.dots{display:flex;gap:14px;margin-top:32px}.dot{width:8px;height:8px;border-radius:999px;background:#c9a84c;animation:pulse 1.7s infinite}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}.dot:nth-child(4){animation-delay:.6s}.dot:nth-child(5){animation-delay:.8s}@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(.75)}}.bar{position:absolute;left:0;bottom:0;height:1px;background:#c9a84c;width:0}.nav{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:5;font-family:'Courier New',monospace}.nav span{font-size:10px;color:#333;letter-spacing:3px}.nav button{border:1px solid #c9a84c55;background:transparent;color:#c9a84c;padding:7px 12px;font:10px 'Courier New',monospace;letter-spacing:2px;cursor:pointer}.scan{position:absolute;left:0;top:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,#c9a84c22,transparent);animation:scan 5s linear infinite}@keyframes scan{from{transform:translateY(-2px)}to{transform:translateY(846px)}}@media(max-width:430px){.app{width:100vw;height:100vh}.title{font-size:54px;letter-spacing:.10em}.text{font-size:16px}}
</style>
</head>
<body>
<div class="app">
<div class="scan"></div>
<div class="nav"><span>THE CODE</span><button id="play">PLAY</button></div>
<section class="scene active"><div class="k">01</div><div class="title">THE<br>CODE</div><div class="text">A black signal.<br><span class="gold">A gold mark.</span></div><div class="bar"></div></section>
<section class="scene"><div class="k">02</div><div class="title">OPEN</div><div class="text">The page is clear.<br><span class="gold">Nothing else loads.</span></div><div class="bar"></div></section>
<section class="scene"><div class="k">03</div><div class="title">FOCUS</div><div class="text">No board.<br>No feed.<br><span class="gold">Only THE CODE.</span></div><div class="bar"></div></section>
<section class="scene"><div class="k">04</div><div class="title">SIGNAL</div><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><div class="bar"></div></section>
<section class="scene"><div class="k">05</div><div class="title">7 OCT<br>2026</div><div class="text"><span class="gold">New York</span></div><div class="bar"></div></section>
<section class="scene"><div class="k">06</div><div class="title">THE CODE</div><div class="text"><span class="gold">Unlocked.</span></div><div class="bar"></div></section>
</div>
<script>
const scenes=[...document.querySelectorAll('.scene')];const bars=[...document.querySelectorAll('.bar')];let i=0,t=null,p=null;const dur=4500;function show(n){i=n;scenes.forEach((s,k)=>s.classList.toggle('active',k===n));bars.forEach(b=>b.style.width='0');clearInterval(p);let e=0;p=setInterval(()=>{e+=50;bars[n].style.width=Math.min(100,e/dur*100)+'%';if(e>=dur)clearInterval(p)},50)}function next(){if(i>=scenes.length-1)return;show(i+1);t=setTimeout(next,dur)}function play(){clearTimeout(t);show(0);t=setTimeout(next,dur)}document.getElementById('play').onclick=play;play();
</script>
</body>
</html>
