<script id="gnk-asg-single-ai-button-script">
(function(){
  function norm(s){
    return String(s||'').replace(/\s+/g,' ').trim().toLowerCase();
  }

  function isVisible(el){
    if(!el) return false;
    var cs = window.getComputedStyle(el);
    if(cs.display === 'none' || cs.visibility === 'hidden' || parseFloat(cs.opacity||'1') === 0) return false;
    var r = el.getBoundingClientRect();
    return r.width > 20 && r.height > 20;
  }

  function isFloating(el){
    if(!el) return false;
    var cs = window.getComputedStyle(el);
    var pos = String(cs.position||'').toLowerCase();
    var r = el.getBoundingClientRect();
    return (pos === 'fixed' || pos === 'sticky' || pos === 'absolute') && r.bottom > 0 && r.right > 0 && r.left < window.innerWidth && r.top < window.innerHeight;
  }

  function looksLikeAiButton(el){
    if(!el) return false;
    var txt = norm(el.innerText || el.textContent || '');
    var attrs = norm((el.id||'') + ' ' + (el.className||'') + ' ' + (el.getAttribute('aria-label')||'') + ' ' + (el.getAttribute('title')||''));
    var textHit = /ai pomoć|ai pomoc|ai help|ai assistant|assistant|chat/.test(txt);
    var attrHit = /ai|assistant|chat|help|badge|widget|floating/.test(attrs);
    return (textHit || attrHit) && isFloating(el) && isVisible(el);
  }

  function score(el){
    var txt = norm(el.innerText || el.textContent || '');
    var s = 0;
    if(/ai pomoć|ai pomoc/.test(txt)) s += 1000;
    if(/ai help/.test(txt)) s += 900;
    if(/assistant/.test(txt)) s += 500;
    if(/chat/.test(txt)) s += 200;
    var r = el.getBoundingClientRect();
    if(r.right > window.innerWidth - 220) s += 80;
    if(r.bottom > window.innerHeight - 220) s += 80;
    s += Math.max(0, Math.round(r.width + r.height));
    return s;
  }

  function removeDuplicates(){
    try{
      var candidates = Array.from(document.querySelectorAll('a,button,div,span'))
        .filter(looksLikeAiButton)
        .filter(function(el){
          return !el.closest('.gnk-asg-final-menu-wrap') && !el.closest('nav') && !el.closest('header');
        });

      if(candidates.length <= 1) return;

      candidates.sort(function(a,b){ return score(b) - score(a); });
      var keep = candidates[0];

      candidates.slice(1).forEach(function(el){
        if(el === keep) return;
        if(keep.contains(el) || el.contains(keep)) return;
        el.classList.add('gnk-asg-ai-hidden-duplicate');
        try{
          if(el.parentElement && el.parentElement.children.length === 1 && isFloating(el.parentElement)){
            el.parentElement.classList.add('gnk-asg-ai-hidden-duplicate');
          }
        }catch(e){}
      });
    }catch(e){}
  }

  removeDuplicates();
  document.addEventListener('DOMContentLoaded', removeDuplicates);
  window.addEventListener('load', removeDuplicates);
  setTimeout(removeDuplicates, 300);
  setTimeout(removeDuplicates, 1000);
  setTimeout(removeDuplicates, 2500);
})();
</script>
