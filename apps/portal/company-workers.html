<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Company Workers · GNK Portal</title><style>body{margin:0;background:#050505;color:#f8f3e6;font-family:Inter,Arial,sans-serif}.shell{width:min(980px,94vw);margin:auto;padding:30px 0}.panel{border:1px solid rgba(214,173,79,.35);border-radius:26px;background:#101010;padding:22px;margin:16px 0}.gold{color:#f5d77b}a{color:#f5d77b}select{width:100%;padding:13px;background:#050505;color:#f8f3e6;border:1px solid rgba(214,173,79,.35);border-radius:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{border:1px solid rgba(214,173,79,.2);border-radius:18px;padding:14px;background:#070707}</style></head><body><main class="shell"><p><a href="/">← Portal index</a></p><section class="panel"><h1 class="gold">Company Workers</h1><p>Svaka firma/lokacija ima vlastiti worker pregled. Workeri nisu AI asistenti; rade uz pomoć AI asistenata za sažetke, provjere, routing i komunikaciju.</p><select id="company"></select><div id="out" class="grid"></div></section></main><script>const companies='Boulder / Colorado|USA|35;Zagreb|Croatia|34;Ljubljana|Slovenia|34;Budapest|Hungary|34;Belgrade 1|Serbia|35;Belgrade 2|Serbia|34;Belgrade 3|Serbia|34;Belgrade 4|Serbia|33;Vancouver|Canada|34;Toronto|Canada|33;Mexico City|Mexico|33;Panama City|Panama|34;Bogotá|Colombia|35;Lima|Peru|34;Santiago|Chile|34;São Paulo|Brazil|34;Buenos Aires|Argentina|35;Dubai|UAE|34;Mumbai|India|34;Singapore|Singapore|34;Jakarta|Indonesia|35;Beijing|China|34;Seoul|South Korea|34;Tokyo|Japan|35;Kuala Lumpur|Malaysia|35;Hong Kong|Hong Kong|34;Casablanca|Morocco|34;Lagos|Nigeria|34;Nairobi|Kenya|35;Johannesburg|South Africa|34;Cape Town|South Africa|34;Sydney|Australia|34;Auckland|New Zealand|35;San José|Costa Rica|34;Quito|Ecuador|34;Montevideo|Uruguay|34;Doha|Qatar|35;Bangkok|Thailand|34;Manila|Philippines|34;Ho Chi Minh City|Vietnam|34;Accra|Ghana|34;Kigali|Rwanda|34;Port Louis|Mauritius|34;Dar es Salaam|Tanzania|34;Perth|Australia|34'.split(';').map((x,i)=>{const a=x.split('|');return{code:'GNK_LOC_'+String(i+1).padStart(2,'0'),city:a[0],country:a[1],workers:+a[2]}});const roles=['Finance Reporting Worker','Publications Worker','Media Registration Worker','Markets Intelligence Worker','Gallery Worker','Admin Routing Worker','Mail Studio Worker','Campaign Approval Worker','Security Worker','Operator Worker','THE CODE Worker','Daily Publications Journalist Worker'];const s=document.getElementById('company');companies.forEach((c,i)=>s.add(new Option(`${c.city} · ${c.country} · ${c.workers} workers`,i)));function render(){const c=companies[s.value||0];let html='';for(let i=0;i<c.workers;i++){const r=roles[i%roles.length];html+=`<div class="card"><b class="gold">${r}</b><br>Worker ${i+1} / ${c.workers}<br>${c.city}, ${c.country}<br><small>${c.code}</small><p>Radi uz pomoć AI asistenata. Nije AI asistent.</p></div>`}document.getElementById('out').innerHTML=html}s.onchange=render;render()</script></body></html>
