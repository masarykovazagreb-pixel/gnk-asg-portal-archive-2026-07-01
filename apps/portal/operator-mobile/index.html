<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07122a">
<title>GNK ASG Mobilni Admin</title>
<link rel="manifest" href="/site.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/brand/gnk-asg-global-layer.css?v=20260620-premium-v3">
<script defer src="/assets/brand/gnk-asg-global-layer.js?v=20260620-premium-v3"></script>
<style>
main{width:min(860px,calc(100% - 20px));margin:22px auto 110px}.admin-card{border:1px solid var(--asg-line);border-radius:26px;background:var(--asg-panel);padding:18px;margin-bottom:14px;box-shadow:var(--asg-shadow)}.admin-brand{display:flex;gap:16px;align-items:center}.admin-brand img{width:150px;height:auto}.admin-brand h1{margin:0 0 8px}.admin-brand p{margin:0;color:var(--asg-muted);line-height:1.55}.admin-tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 14px}.admin-tabs button,.admin-tabs a,.actions button{white-space:nowrap;padding:11px 14px;border:1px solid var(--asg-line);border-radius:999px;background:rgba(255,255,255,.07);color:var(--asg-text)!important;text-decoration:none!important;font-weight:900;cursor:pointer}.admin-tabs .active,.actions .primary{background:linear-gradient(135deg,var(--asg-gold),var(--asg-gold-2));color:#07101f!important}.admin-panel{display:none}.admin-panel.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;margin:11px 0 6px;color:var(--asg-gold);font-size:11px;font-weight:950;letter-spacing:.08em;text-transform:uppercase}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--asg-line);border-radius:14px;background:#fff;color:#07101f;font:inherit}textarea{min-height:175px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}pre{white-space:pre-wrap;word-break:break-word;max-height:390px;overflow:auto;background:#02050b;border:1px solid var(--asg-line);border-radius:14px;padding:12px;color:#dfe7f8}.mail-list{max-height:430px;overflow:auto}.mail-item{padding:11px;border:1px solid var(--asg-line);border-radius:14px;margin-bottom:9px;background:rgba(255,255,255,.04)}.mail-item strong{display:block;color:var(--asg-gold-2);margin-bottom:5px}.mail-item small{display:block;color:var(--asg-muted);margin-bottom:6px}.mail-item div{color:var(--asg-text);font-size:13px;line-height:1.45}.word-count{margin-top:8px;color:var(--asg-muted);font-size:13px}.word-count.bad{color:#fca5a5}.word-count.ok{color:#86efac}@media(max-width:660px){.grid{grid-template-columns:1fr}.admin-brand{align-items:flex-start;flex-direction:column}.admin-card{padding:15px}}
</style>
</head>
<body class="gnk-asg-premium-shell">
<main>
<section class="admin-card admin-brand">
<img src="/assets/gnk-asg-email-logo-final.png" alt="GNK ASG">
<div><h1>GNK ASG Mobilni Admin</h1><p>Status, mail, Inbox, Sent, fotografiranje, upload, SEO priprema i objava preko postojećih backend servisa.</p></div>
</section>
<section class="admin-card">
<label>Operator token</label>
<input id="operatorToken" type="password" autocomplete="off" placeholder="Unesite operator token">
<div class="actions"><button class="primary" id="saveToken" type="button">Sigurna prijava</button><button id="clearToken" type="button">Odjava</button></div>
</section>
<section class="admin-card">
<div class="admin-tabs">
<button type="button" data-tab="status" class="active">Status</button>
<button type="button" data-tab="mail">Mail</button>
<button type="button" data-tab="inbox">Inbox</button>
<button type="button" data-tab="sent">Sent</button>
<button type="button" data-tab="media">Fotografija</button>
<button type="button" data-tab="publish">Objava</button>
<a href="/mail-studio/">Desktop Mail</a>
<a href="/operator-dashboard/">Desktop Admin</a>
</div>
<div id="status" class="admin-panel active">
<div class="actions"><button type="button" id="loadStatus">Osvježi status</button></div>
<pre id="statusOut">Status nije učitan.</pre>
</div>
<div id="mail" class="admin-panel">
<div class="grid"><div><label>Adresa</label><select id="mailbox"></select><label>Primatelj</label><input id="mailTo"><label>Predmet</label><input id="mailSubject"></div><div><label>Poruka</label><textarea id="mailBody"></textarea></div></div>
<div class="actions"><button type="button" class="primary" id="sendMail">Pošalji</button></div>
<pre id="mailOut"></pre>
</div>
<div id="inbox" class="admin-panel"><div class="actions"><button type="button" id="loadInbox">Osvježi Inbox</button></div><div id="inboxOut" class="mail-list"></div></div>
<div id="sent" class="admin-panel"><div class="actions"><button type="button" id="loadSent">Osvježi Sent</button></div><div id="sentOut" class="mail-list"></div></div>
<div id="media" class="admin-panel">
<label>Naziv slike</label><input id="mediaTitle" value="mobilna-objava">
<label>Fotografiraj ili odaberi sliku</label><input id="mediaFile" type="file" accept="image/*" capture="environment">
<div class="actions"><button type="button" class="primary" id="uploadMedia">Upload slike</button><button type="button" id="listMedia">Lista slika</button></div>
<pre id="mediaOut"></pre>
</div>
<div id="publish" class="admin-panel">
<div class="grid"><div><label>Jezik</label><select id="pubLang"><option value="hr">HR</option><option value="en">EN</option></select><label>Naslov</label><input id="pubTitle"><label>Slika URL</label><input id="pubImage"><label>Izvor URL</label><input id="pubSource"></div><div><label>Sažetak</label><textarea id="pubSummary"></textarea></div></div>
<label>Tekst članka — najmanje 500 riječi</label><textarea id="pubBody"></textarea>
<div id="wordCount" class="word-count bad">0 riječi</div>
<div class="actions"><button type="button" id="prepareSeo">Pripremi SEO</button><button type="button" id="dryRun">Provjeri</button><button type="button" class="primary" id="publishNow">Objavi odmah</button></div>
<pre id="publishOut"></pre>
</div>
</section>
</main>
<script src="/assets/operator-token-vault.js?v=20260621-1"></script>
<script>
const q=id=>document.getElementById(id);
const token=()=>window.GNKOperatorToken?.get()||'';
const auth=()=>window.GNKOperatorToken?.headers()||{};
const show=(id,data)=>q(id).textContent=typeof data==='string'?data:JSON.stringify(data,null,2);
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const words=text=>(String(text||'').match(/[\p{L}\p{N}][\p{L}\p{N}'-]*/gu)||[]).length;
const bodyHtml=text=>String(text||'').split(/\n\s*\n/).map(p=>'<p>'+esc(p)+'</p>').join('');
q('operatorToken').value=token();
q('saveToken').onclick=()=>{const value=q('operatorToken').value.trim();if(value)window.GNKOperatorToken.set(value);loadAll()};
q('clearToken').onclick=()=>{window.GNKOperatorToken.clear();q('operatorToken').value=''};
document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>{document.querySelectorAll('.admin-panel').forEach(panel=>panel.classList.remove('active'));document.querySelectorAll('[data-tab]').forEach(item=>item.classList.remove('active'));q(button.dataset.tab).classList.add('active');button.classList.add('active')});
async function request(url,opt={}){const headers=new Headers(opt.headers||{});Object.entries(auth()).forEach(([key,value])=>headers.set(key,value));const response=await fetch(url,{...opt,headers,cache:opt.cache||'no-store'});const raw=await response.text();let data;try{data=JSON.parse(raw)}catch{data={raw}}return{ok:response.ok,status:response.status,data}}
async function loadStatus(){show('statusOut',await request('/operator/dashboard-status?cb='+Date.now()))}
async function loadBoxes(){const result=await request('/api/operator-mailbox-config?cb='+Date.now());const items=result.data?.mailboxes||[{key:'info',label:'Info',address:'info@gnk-asg.hr'},{key:'it',label:'IT',address:'it@gnk-asg.hr'},{key:'legal',label:'Legal',address:'legal@gnk-asg.hr'},{key:'media',label:'Media',address:'media@gnk-asg.hr'}];q('mailbox').innerHTML=items.map(item=>'<option value="'+esc(item.key)+'">'+esc((item.label||item.key)+' — '+(item.address||''))+'</option>').join('')}
async function sendMail(){const form=new FormData();form.append('mailbox',q('mailbox').value);form.append('to',q('mailTo').value);form.append('subject',q('mailSubject').value);form.append('body',q('mailBody').value);form.append('addSignature','yes');show('mailOut',await request('/api/operator-send-mail',{method:'POST',body:form}));loadSent()}
function renderList(id,data){const items=Array.isArray(data)?data:(data?.items||data?.messages||data?.logs||data?.data||[]);q(id).innerHTML=items.length?items.slice(0,100).map(item=>'<article class="mail-item"><strong>'+esc(item.subject||item.title||item.event||'(bez predmeta)')+'</strong><small>'+esc(item.from||item.to||item.email||item.createdAt||item.sentAt||'')+'</small><div>'+esc(String(item.snippet||item.message||item.body||JSON.stringify(item)).slice(0,450))+'</div></article>').join(''):'<article class="mail-item">Nema zapisa ili backend nije dostupan.</article>'}
async function loadInbox(){let result=await request('/operator/contact-inbox?cb='+Date.now());if(!result.ok)result=await request('/api/mail-center/inbox?cb='+Date.now());renderList('inboxOut',result.data)}
async function loadSent(){let result=await request('/api/mail-center/sent?cb='+Date.now());if(!result.ok)result=await request('/operator/mail-log-list?cb='+Date.now());renderList('sentOut',result.data)}
async function uploadMedia(){const form=new FormData();form.append('title',q('mediaTitle').value);const file=q('mediaFile').files[0];if(file)form.append('file',file);const result=await request('/operator/media-upload',{method:'POST',body:form});show('mediaOut',result);const url=result.data?.url||result.data?.publicUrl||result.data?.imageUrl;if(url)q('pubImage').value=url}
async function listMedia(){show('mediaOut',await request('/operator/media-list?cb='+Date.now()))}
function updateWordCount(){const count=words(q('pubBody').value);q('wordCount').textContent=count+' riječi';q('wordCount').className='word-count '+(count>=500?'ok':'bad');return count}
function prepareSeo(){const title=q('pubTitle').value.trim(),body=q('pubBody').value.trim();if(!q('pubSummary').value.trim())q('pubSummary').value=(body.replace(/\s+/g,' ').slice(0,260)||title);show('publishOut',{wordCount:updateWordCount(),title,summary:q('pubSummary').value,imageAlt:title,author:'Nermin Sefić',keywords:['GNK ASG','GNK DINAMO Ltd.','Nermin Sefić',...title.toLowerCase().split(/\W+/).filter(x=>x.length>4).slice(0,8)]})}
async function publish(dryRun){prepareSeo();const body=q('pubBody').value,summary=q('pubSummary').value,title=q('pubTitle').value;if(words(body)<500){show('publishOut','Članak mora imati najmanje 500 riječi. Trenutno: '+words(body));return}const payload={title,lang:q('pubLang').value,summary,bodyHtml:bodyHtml(body),image:q('pubImage').value,imageAlt:title,author:'Nermin Sefić',sources:q('pubSource').value?[{title:'Izvor',url:q('pubSource').value}]:[],keywords:['GNK ASG','GNK DINAMO Ltd.','Nermin Sefić'],seo:{description:summary},dryRun};const response=await fetch('https://publish.gnk-asg.hr/api/publications/publish',{method:'POST',headers:{'content-type':'application/json',...auth()},body:JSON.stringify(payload)});const raw=await response.text();let data;try{data=JSON.parse(raw)}catch{data={raw}}show('publishOut',{ok:response.ok,status:response.status,data})}
async function loadAll(){await Promise.allSettled([loadStatus(),loadBoxes(),loadInbox(),loadSent()])}
q('loadStatus').onclick=loadStatus;q('sendMail').onclick=sendMail;q('loadInbox').onclick=loadInbox;q('loadSent').onclick=loadSent;q('uploadMedia').onclick=uploadMedia;q('listMedia').onclick=listMedia;q('prepareSeo').onclick=prepareSeo;q('dryRun').onclick=()=>publish(true);q('publishNow').onclick=()=>publish(false);q('pubBody').addEventListener('input',updateWordCount);
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
loadAll();
</script>
<script defer src="/assets/operator-mobile-live-bridge.js?v=20260621-1"></script>
</body>
</html>
