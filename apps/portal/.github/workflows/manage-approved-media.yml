name: Manage Corporate Media Visibility

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Radnja / Action'
        required: true
        type: choice
        options:
          - approve
          - remove
        default: remove
      subject:
        description: 'Subjekt / Subject'
        required: false
        type: string
        default: 'GNK ASG d.o.o.'
      title:
        description: 'Naslov kod rucnog dodavanja ili obnove / Title for manual add or restore'
        required: false
        type: string
      source:
        description: 'Naziv izvora kod rucnog dodavanja ili obnove / Source for manual add or restore'
        required: false
        type: string
      url:
        description: 'Javni URL za uklanjanje ili obnovu / Public URL to remove or restore'
        required: true
        type: string
      published_at:
        description: 'Datum objave ISO / Publication date'
        required: false
        type: string
      summary:
        description: 'Kratki sazetak / Short summary'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: approved-corporate-media
  cancel-in-progress: false

jobs:
  manage-publication:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply visibility change
        env:
          MEDIA_ACTION: ${{ inputs.action }}
          MEDIA_SUBJECT: ${{ inputs.subject }}
          MEDIA_TITLE: ${{ inputs.title }}
          MEDIA_SOURCE: ${{ inputs.source }}
          MEDIA_URL: ${{ inputs.url }}
          MEDIA_DATE: ${{ inputs.published_at }}
          MEDIA_SUMMARY: ${{ inputs.summary }}
        run: python scripts/manage_approved_media.py
      - name: Commit visibility lists
        run: |
          if git diff --quiet -- data/media_approved.json data/media_removed.json; then
            echo "No media visibility changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/media_approved.json data/media_removed.json
          git commit -m "Update corporate media visibility [skip ci]"
          git push
