name: Apply Homepage Corporate Fields

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-homepage-fields.yml'
      - 'scripts/publish_homepage_ubo.py'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apply-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply prepared homepage fields
        run: python scripts/publish_homepage_ubo.py
      - name: Commit updated homepages
        run: |
          git config user.name "gnk-asg-publication-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html en/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Apply homepage corporate profile fields"
            git push origin HEAD:main
          fi
      - name: Prepare public portal artifact
        run: |
          git fetch origin main
          git reset --hard origin/main
          rm -rf _site
          mkdir -p _site
          rsync -a --delete --exclude '.git/' --exclude '.github/' --exclude 'scripts/' --exclude '_site/' --exclude '*.py' ./ _site/
          test -f _site/index.html
          test -f _site/en/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload public portal artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy current public portal
        id: deployment
        uses: actions/deploy-pages@v4
