name: Refresh business news

# Public status cleaner added: 2026-06-01T08:50Z
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/refresh_news.py'
      - 'scripts/clean_news_status.py'
      - '.github/workflows/refresh-news.yml'

permissions:
  contents: write

concurrency:
  group: refresh-business-news
  cancel-in-progress: true

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh public business news
        run: python scripts/refresh_news.py

      - name: Clean public news status
        run: python scripts/clean_news_status.py

      - name: Commit refreshed news data
        run: |
          git config user.name "gnk-asg-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/news_archive.json data/update_status.json
          if git diff --cached --quiet; then
            echo "No news data changes to commit."
          else
            git commit -m "Refresh business news data"
            git push
          fi
