name: Daily Market Brief Publication

# Production regeneration: refresh commentary after restoration of the five-minute market dataset.
on:
  schedule:
    - cron: '12 6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/generate_daily_market_brief.py'
      - '.github/workflows/daily-market-brief.yml'

permissions:
  contents: write

concurrency:
  group: daily-market-brief-publication
  cancel-in-progress: false

jobs:
  publish-brief:
    name: Generate professional daily public market commentary
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate factual daily market brief from latest published data
        run: python scripts/generate_daily_market_brief.py
      - name: Commit daily public market commentary
        run: |
          git config user.name "gnk-asg-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/daily_market_brief.json
          if git diff --cached --quiet; then
            echo "No daily brief changes."
          else
            git commit -m "Automated daily public market brief"
            git push
          fi
