name: Refresh macro market panel

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/refresh_macro_market.py'
      - '.github/workflows/refresh-macro-market.yml'

permissions:
  contents: write

concurrency:
  group: refresh-macro-market
  cancel-in-progress: true

jobs:
  refresh-macro-market:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh macro market data
        run: python scripts/refresh_macro_market.py

      - name: Commit refreshed macro data
        run: |
          git config user.name "gnk-asg-market-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/macro_market.json data/fast_market_status.json
          if git diff --cached --quiet; then
            echo "No macro market data changes to commit."
          else
            git commit -m "Refresh macro market data"
            git push
          fi
