ta.authenticated){show('Sesija je aktivna. Preusmjeravanje…','ok');setTimeout(()=>location.assign(next),350)}else show('Aktivna sesija nije pronađena.','bad')}catch(error){show(`Provjera nije uspjela: ${error.message}`,'bad')}finally{checkButton.disabled=false}}form.addEventListener('submit',async event=>{event.preventDefault();const value=token.value.trim();if(!value){show('Upišite operator/admin token.','bad');token.focus();return}loginButton.disabled=true;show('Provjera vjerodajnice…');try{const r=await fetch('/api/operator-session-login',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'content-type':'application/json',accept:'application/json'},body:JSON.stringify({token:value})});const data=await r.json().catch(()=>({}));token.value='';if(!r.ok||!data.authenticated)throw new Error(data.error==='invalid_credentials'?'Neispravna vjerodajnica.':data.error||`HTTP ${r.status}`);show('Prijava je uspješna. Preusmjeravanje…','ok');setTimeout(()=>location.assign(next),450)}catch(error){show(error.message||'Prijava nije uspjela.','bad');token.focus()}finally{loginButton.disabled=false}});checkButton.addEventListener('click',check);check()})();</script></body></html>
