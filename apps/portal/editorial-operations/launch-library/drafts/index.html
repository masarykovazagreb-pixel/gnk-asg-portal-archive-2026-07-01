<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Full Launch Drafts | THE CODE Intelligence</title><meta name="description" content="Review-only full first drafts for the 60-item THE CODE Intelligence launch library."><meta name="robots" content="noindex,nofollow,noarchive"><link rel="canonical" href="https://www.gnk-asg.hr/editorial-operations/launch-library/drafts/"><style>:root{--g:#d4af37;--l:rgba(212,175,55,.32);--m:#aab4c7}*{box-sizing:border-box}body{margin:0;background:#050814;color:#f8fafc;font-family:Inter,Arial,sans-serif}header,main{max-width:1500px;margin:auto;padding:20px}h1{font-size:clamp(34px,6vw,64px);margin:8px 0}.eyebrow{color:var(--g);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.15em}.sub,.muted{color:var(--m);line-height:1.6}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.btn{display:inline-flex;padding:10px 13px;border:1px solid var(--l);border-radius:999px;color:#fff;background:rgba(255,255,255,.05);text-decoration:none;font:inherit;font-weight:900;cursor:pointer}.layout{display:grid;grid-template-columns:360px 1fr;gap:14px;margin-top:16px}.panel,.article{border:1px solid var(--l);border-radius:20px;background:#0b1324;padding:16px}.panel{max-height:78vh;overflow:auto;position:sticky;top:12px}.filters{display:grid;gap:8px;margin-bottom:10px}input,select{width:100%;padding:10px;border:1px solid rgba(255,255,255,.15);border-radius:11px;background:#07101f;color:#fff}.item{display:block;width:100%;text-align:left;padding:11px;margin:7px 0;border:1px solid rgba(255,255,255,.09);border-radius:12px;background:rgba(255,255,255,.03);color:#fff;cursor:pointer}.item.active{border-color:var(--g);background:rgba(212,175,55,.1)}.item small{display:block;color:var(--m);margin-top:4px}.article h2{font-size:clamp(28px,4vw,48px);margin:8px 0}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.pill{padding:5px 8px;border:1px solid rgba(255,255,255,.14);border-radius:999px;color:var(--m);font-size:10px}.body{white-space:pre-wrap;font:1.08rem/1.85 Georgia,serif;color:#edf0f6}.notice{padding:13px 15px;border:1px solid rgba(245,158,11,.45);border-radius:15px;background:rgba(245,158,11,.08);color:#fde7b0;margin:12px 0}@media(max-width:900px){.layout{grid-template-columns:1fr}.panel{position:static;max-height:400px}}@media(max-width:520px){header,main{padding:12px}.toolbar>*{width:100%;justify-content:center}}@media print{header,.panel,.toolbar,.notice{display:none}.layout{display:block}.article{border:0;background:#fff;color:#111}.body{color:#111}}</style></head><body>
<header><div class="eyebrow">THE CODE Intelligence · internal editorial review</div><h1>Full Launch Drafts</h1><p class="sub">Sixty complete first drafts. They remain unverified, non-public and blocked until required sources, fact-check, author/editor confirmation and final approval are recorded.</p><div class="toolbar"><a class="btn" href="/editorial-operations/launch-library/">Launch Library</a><a class="btn" href="/mobile-admin/">Approval Queue</a><button class="btn" id="print" type="button">Print selected draft</button></div></header>
<main><div class="layout"><aside class="panel"><div class="filters"><input id="query" type="search" placeholder="Search 60 drafts"><select id="category"><option value="">All categories</option></select></div><p id="count" class="muted"></p><div id="list"></div></aside><article class="article"><div id="article"></div></article></div></main>
<script src="/assets/js/editorial-launch-library-v1.js"></script><script src="/assets/js/editorial-launch-drafts-v1.js"></script><script>(()=>{'use strict';const base=window.GNKEditorialLaunchLibrary,expander=window.GNKEditorialLaunchDrafts;if(!base||!expander)throw new Error('Draft library unavailable');const data=expander.expandLibrary(base),$=id=>document.getElementById(id),esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));let selected=data.items[0];for(const value of [...new Set(data.items.map(item=>item.category))].sort())$('category').insertAdjacentHTML('beforeend',`<option value="${esc(value)}">${esc(value)}</option>`);function show(item){selected=item;location.hash=item.id;$('article').innerHTML=`<div class="eyebrow">${esc(item.id)} · ${esc(item.category)}</div><h2>${esc(item.title)}</h2><p class="muted">${esc(item.summary)}</p><div class="meta"><span class="pill">${esc(item.publicationType)}</span><span class="pill">Author candidate: ${esc(item.proposedAuthor)}</span><span class="pill">Editor candidate: ${esc(item.proposedEditor)}</span><span class="pill">${esc(item.status)}</span></div><div class="notice"><strong>Not publishable yet:</strong> required sources, fact-check and final human approval are incomplete.</div><div class="body">${esc(item.draftBody)}</div>`;renderList()}function filtered(){const q=$('query').value.trim().toLowerCase(),category=$('category').value;return data.items.filter(item=>(!q||[item.title,item.summary,item.category,item.id].some(value=>value.toLowerCase().includes(q)))&&(!category||item.category===category))}function renderList(){const items=filtered();$('count').textContent=`${items.length} of ${data.items.length} drafts`;$('list').innerHTML=items.map(item=>`<button class="item${selected?.id===item.id?' active':''}" type="button" data-id="${esc(item.id)}"><strong>${esc(item.title)}</strong><small>${esc(item.id)} · ${esc(item.category)}</small></button>`).join('');$('list').querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>show(data.items.find(item=>item.id===button.dataset.id))))}[$('query'),$('category')].forEach(node=>node.addEventListener(node.tagName==='INPUT'?'input':'change',renderList));$('print').addEventListener('click',()=>window.print());const requested=location.hash.slice(1),initial=data.items.find(item=>item.id===requested)||selected;show(initial)})();</script></body></html>
