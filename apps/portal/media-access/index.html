<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>GNK ASG Media Access</title>
  <style>
    :root{color-scheme:light;--ink:#17130c;--muted:#6f685c;--gold:#b8892f;--paper:#fffdf8;--line:#dec47a;--dark:#17140f}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f8f1df,#fffdf8);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif}.card{width:min(720px,calc(100vw - 28px));padding:34px;border:1px solid var(--line);border-radius:24px;background:rgba(255,253,248,.96);box-shadow:0 24px 70px rgba(53,38,10,.14)}.eyebrow{margin:0 0 8px;color:#8a6828;font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}h1{margin:0 0 12px;font:600 34px/1.1 Georgia,serif}p{line-height:1.6;color:var(--muted)}label{display:block;margin:16px 0 6px;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}input{width:100%;height:48px;border:1px solid #d8c28a;border-radius:12px;padding:0 14px;background:#fff;color:var(--ink);font-size:16px}button{margin-top:20px;width:100%;height:50px;border:0;border-radius:999px;background:linear-gradient(135deg,#17140f,#3d301a);color:#f5dfa1;font-weight:900;letter-spacing:.09em;text-transform:uppercase;cursor:pointer}.result{margin-top:18px;padding:14px;border-radius:14px;background:#f4ead0;color:#332916}.result.bad{background:#f8dedb;color:#741f16}.hidden{display:none}.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.links a{color:#6f4d0a;font-weight:800;text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">GNK ASG Media Relations</p>
    <h1>Siguran pristup medijskoj prijavi</h1>
    <p>Unesite šifru poziva, službeni e-mail i jednokratni kod koji je izdan samo odobrenoj redakciji. Kod vrijedi ograničeno vrijeme i ne smije se prosljeđivati.</p>
    <form id="form">
      <label for="mailCode">Šifra poziva / Invitation reference</label>
      <input id="mailCode" name="mailCode" autocomplete="off" required>
      <label for="email">Službeni e-mail / Official e-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="code">Jednokratni kod / One-time code</label>
      <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
      <button type="submit">Prijava</button>
    </form>
    <div id="result" class="result hidden" role="status"></div>
    <div class="links"><a href="/">Javni portal</a><a href="/contact/">Kontakt</a></div>
  </main>
  <script>
    const form=document.getElementById('form'),result=document.getElementById('result');
    function show(message,bad=false){result.className='result'+(bad?' bad':'');result.textContent=message;}
    async function checkSession(){try{const r=await fetch('/api/media-access/session',{credentials:'same-origin',cache:'no-store'});if(r.ok){const d=await r.json();if(d.applicationUrl)location.href=d.applicationUrl;}}catch{}}
    form.addEventListener('submit',async event=>{event.preventDefault();show('Provjera koda…');const payload={mailCode:form.mailCode.value,email:form.email.value,code:form.code.value};try{const response=await fetch('/api/media-access/verify',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Prijava nije uspjela');show('Kod je potvrđen. Otvaram prijavu…');location.href=data.applicationUrl||'/media-application/';}catch(error){show(String(error.message||error),true);}});
    checkSession();
  </script>
</body>
</html>
