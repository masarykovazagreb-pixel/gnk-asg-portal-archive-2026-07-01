<script>
(() => {
  const grid = document.getElementById('shopGrid');
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  fetch('/data/webshop-hardware-demo.json?v=' + Date.now(), { cache: 'no-store' })
    .then(r => r.json())
    .then(data => {
      const products = data.products || [];
      if (!products.length) { grid.innerHTML = '<p class="shop-empty">Nema demo stavki.</p>'; return; }
      grid.innerHTML = products.map(p => `
        <article class="shop-card">
          <span class="shop-kicker">${esc(p.category)}</span>
          <h3>${esc(p.name)}</h3>
          <p class="shop-price">${Number(p.priceEur).toFixed(2)} EUR</p>
          <small style="color:#9c968a">Dostupnost: ${esc(p.availability)}</small>
        </article>`).join('');
    })
    .catch(() => { grid.innerHTML = '<p class="shop-empty">Podaci trenutačno nisu dostupni.</p>'; });
})();
</script>
