  <style>
    :root{color-scheme:dark;--bg:#050505;--panel:#111;--line:#3b3120;--gold:#d8b66a;--text:#f5f2ea;--muted:#b9b2a5;--ok:#8dd8a3;--warn:#f0c37a;--bad:#f2a2a2}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#18130b 0,#050505 44%);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}.wrap{width:min(1180px,calc(100% - 32px));margin:auto;padding:34px 0 64px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{color:var(--gold);font-weight:900;letter-spacing:.08em}.back{color:var(--muted);text-decoration:none}h1{font-size:clamp(36px,6vw,64px);margin:34px 0 10px}.lead{color:var(--muted);line-height:1.6;max-width:820px}.notice{margin:24px 0;padding:16px 18px;border-left:3px solid var(--gold);background:#0e0d0a;color:var(--muted)}.toolbar{display:flex;gap:10px;align-items:center;margin:22px 0}.btn{border:1px solid var(--line);border-radius:999px;padding:11px 15px;background:#15120d;color:var(--text);font-weight:800;cursor:pointer}.status{color:var(--muted)}.grid{display:grid;gap:14px}.card{border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#15120d,#0b0b0b);padding:18px}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;color:var(--muted);font-size:12px}.pill{border:1px solid #4a402c;border-radius:999px;padding:4px 8px}.queued{color:var(--ok)}.manual_review{color:var(--warn)}.published{color:var(--ok)}.empty{padding:28px;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}}
  </style>
<link rel="stylesheet" href="/assets/public-unified-menu-v6.css?v=20260721-remove-static-overview-v1"></head>
<body><header id="gnk-unified-header" data-gnk-unified-shell="v6-static"><div class="inner"><a class="brand" href="/" aria-label="GNK ASG"><img src="/assets/logo-gnk-asg-canonical.svg?v=20260713-standard-64" alt="GNK ASG" width="110" height="68" data-gnk-canonical-logo="1"></a><div id="gnk-unified-menu"><div class="actions"><div class="lang"><a href="/" aria-label="Hrvatski" aria-current="page">HR</a><a href="/en/" aria-label="English">EN</a></div><button class="toggle" type="button" aria-expanded="false" aria-controls="gnk-unified-nav">IZBORNIK</button></div><nav id="gnk-unified-nav"></nav></div></div></header>
<main class="wrap">
  <div class="top"><div class="brand">GNK ASG · ZAŠTIĆENO</div><a class="back" href="/admin-center/">← Admin centar</a></div>
  <h1>News Auto Publication</h1>
  <p class="lead">Zaštićeni pregled reda nacrta, statusa i kontrolnih oznaka sustava za objavu vijesti.</p>
  <div class="notice">Ova stranica je trenutačno samo za pregled. Ne pokreće automatsku objavu, raspoređivanje ni vanjsku distribuciju.</div>
  <div class="toolbar"><button class="btn" id="refresh" type="button">Osvježi pregled</button><span class="status" id="status">Spremno.</span></div>
  <section class="grid" id="list" aria-live="polite"><div class="empty">Učitavanje zapisa…</div></section>
</main>
<script>
(()=>{
  const list=document.getElementById('list');
  const status=document.getElementById('status');
  const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  async function load(){
    status.textContent='Učitavanje…';
    list.innerHTML='<div class="empty">Učitavanje zapisa…</div>';
    try{
      const r=await fetch('/api/news-auto-publication/list?cb='+Date.now(),{credentials:'same-origin',cache:'no-store'});
      const raw=await r.text();
      let data;try{data=JSON.parse(raw)}catch{data={error:raw}}
      if(!r.ok)throw new Error(data.message||data.error||('HTTP '+r.status));
      const posts=Array.isArray(data.posts)?data.posts:[];
      if(!posts.length){list.innerHTML='<div class="empty">Nema zapisa u redu objava.</div>';status.textContent='Nema zapisa.';return}
      list.innerHTML=posts.map(p=>`<article class="card"><h2>${esc(p.title||'Bez naslova')}</h2><p>${esc(p.summary||'')}</p><div class="meta"><span class="pill ${esc(p.status)}">${esc(p.status||'unknown')}</span><span class="pill">${esc(p.category||'')}</span><span class="pill">${esc(p.createdAt||'')}</span>${Array.isArray(p.reviewFlags)&&p.reviewFlags.length?`<span class="pill">Kontrole: ${esc(p.reviewFlags.join(', '))}</span>`:''}</div></article>`).join('');
      status.textContent='Učitano: '+posts.length;
    }catch(e){
      list.innerHTML='<div class="empty">Pregled nije dostupan: '+esc(e.message)+'</div>';
      status.textContent='Greška pri učitavanju.';
    }
  }
  document.getElementById('refresh').addEventListener('click',load);
  load();
})();
</script>
<script src="/assets/app.js?v=20260721-ideje-sticker-top-sway-v1" defer></script></body>
</html>
