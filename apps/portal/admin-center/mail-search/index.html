mmary><div class="raw">${esc(JSON.stringify(item,null,2))}</div></details></article>`};form.addEventListener('submit',async event=>{event.preventDefault();const value=input.value.trim();if(!value)return;status.textContent='Pretraživanje…';status.className='status';results.replaceChildren();const looksLikeCase=/^GNK[-_]/i.test(value)||/^[A-Z0-9-]{8,}$/i.test(value),url='/case-lookup?'+new URLSearchParams({[looksLikeCase?'case':'q']:value});try{const response=await fetch(url,{credentials:'same-origin',cache:'no-store',headers:{accept:'application/json'}});if(response.status===401||response.status===403){location.href='/admin-login/?next='+encodeURIComponent(location.pathname);return}const text=await response.text();let data;try{data=JSON.parse(text)}catch{throw new Error(text||`HTTP ${response.status}`)}if(!response.ok)throw new Error(data?.message||data?.error||`HTTP ${response.status}`);const list=rows(data);status.textContent=list.length?`Pronađeno: ${list.length}`:'Nema rezultata.';results.innerHTML=list.map(renderItem).join('');if(!list.length&&data&&typeof data==='object')results.innerHTML=`<article class="item"><div class="raw">${esc(JSON.stringify(data,null,2))}</div></article>`}catch(error){status.textContent='Pretraga nije uspjela: '+error.message;status.className='status error'}})})();</script><script src="/assets/app.js?v=20260723-remove-dup-sections-v1" defer></script></body></html>
