<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Pretraga mailova · GNK ASG</title>
  <style>
    :root{color-scheme:dark;--bg:#050505;--panel:#111;--line:#3b3120;--gold:#d8b66a;--text:#f5f2ea;--muted:#b9b2a5;--bad:#ef8d8d}*{box-sizing:border-box}body{margin:0;background:#050505;color:var(--text);font-family:Arial,sans-serif}.wrap{width:min(980px,calc(100% - 32px));margin:auto;padding:32px 0 64px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{color:var(--gold);font-weight:800;letter-spacing:.08em}.back{color:var(--muted);text-decoration:none}h1{font-size:clamp(34px,6vw,58px);margin:44px 0 10px}.lead{color:var(--muted);line-height:1.55}.search{display:flex;gap:10px;margin:26px 0}input{flex:1;min-width:0;padding:15px 16px;border-radius:12px;border:1px solid var(--line);background:#111;color:var(--text);font-size:16px}button{padding:14px 20px;border:0;border-radius:12px;background:var(--gold);color:#111;font-weight:800;cursor:pointer}.status{color:var(--muted);min-height:24px}.results{display:grid;gap:12px;margin-top:20px}.item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.item h2{font-size:18px;margin:0 0 10px}.meta{color:var(--muted);font-size:14px;line-height:1.5}.raw{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);font:13px/1.5 Consolas,monospace}.error{color:var(--bad)}@media(max-width:640px){.search{flex-direction:column}.top{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top"><div class="brand">GNK ASG · ZAŠTIĆENO</div><a class="back" href="/admin-center/">← Admin centar</a></div>
    <h1>Pretraga mailova</h1>
    <p class="lead">Upiši broj predmeta ili slobodan tekst: ime, e-mail adresu ili naslov poruke.</p>
    <form class="search" id="searchForm"><input id="query" autocomplete="off" placeholder="Broj predmeta, ime, e-mail ili naslov" required><button type="submit">Pretraži</button></form>
    <div class="status" id="status"></div>
    <section class="results" id="results" aria-live="polite"></section>
  </main>
<script>
(()=>{
  const form=document.getElementById('searchForm'),input=document.getElementById('query'),status=document.getElementById('status'),results=document.getElementById('results');
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const rows=data=>Array.isArray(data)?data:Array.isArray(data?.items)?data.items:Array.isArray(data?.results)?data.results:Array.isArray(data?.cases)?data.cases:[];
  const renderItem=(item,index)=>{
    const title=item.subject||item.title||item.case_number||item.case||item.email||`Rezultat ${index+1}`;
    const meta=[item.case_number||item.case,item.name||item.sender_name,item.email||item.sender_email,item.status,item.created_at||item.updated_at].filter(Boolean).join(' · ');
    return `<article class="item"><h2>${esc(title)}</h2>${meta?`<div class="meta">${esc(meta)}</div>`:''}<details><summary>Detalji</summary><div class="raw">${esc(JSON.stringify(item,null,2))}</div></details></article>`;
  };
  form.addEventListener('submit',async event=>{
    event.preventDefault();const value=input.value.trim();if(!value)return;
    status.textContent='Pretraživanje…';status.className='status';results.replaceChildren();
    const looksLikeCase=/^GNK[-_]/i.test(value)||/^[A-Z0-9-]{8,}$/i.test(value);
    const url='/case-lookup?'+new URLSearchParams({[looksLikeCase?'case':'q']:value});
    try{
      const response=await fetch(url,{credentials:'same-origin',cache:'no-store',headers:{accept:'application/json'}});
      if(response.status===401||response.status===403){location.href='/admin-login/?next='+encodeURIComponent(location.pathname);return;}
      const text=await response.text();let data;try{data=JSON.parse(text)}catch{throw new Error(text||`HTTP ${response.status}`)}
      if(!response.ok)throw new Error(data?.message||data?.error||`HTTP ${response.status}`);
      const list=rows(data);status.textContent=list.length?`Pronađeno: ${list.length}`:'Nema rezultata.';
      results.innerHTML=list.map(renderItem).join('');
      if(!list.length&&data&&typeof data==='object')results.innerHTML=`<article class="item"><div class="raw">${esc(JSON.stringify(data,null,2))}</div></article>`;
    }catch(error){status.textContent='Pretraga nije uspjela: '+error.message;status.className='status error';}
  });
})();
</script>
</body>
</html>
