<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">Odustajanje ili pravna prepreka?</title><desc id="d">Urednička usporedba javnog dojma i dokumentiranog konteksta završetka pregovora.</desc>
<rect width="1200" height="675" fill="#06101c"/><rect width="1200" height="10" fill="#22c55e"/>
<text x="58" y="76" fill="#f8fafc" font-family="Arial,sans-serif" font-weight="800" font-size="28">AKTUAL · DOKUMENTI · INVESTICIJA</text>
<text x="58" y="154" fill="#fff" font-family="Arial,sans-serif" font-weight="900" font-size="50">ODUSTAJANJE ILI PRAVNA PREPREKA?</text>
<text x="58" y="205" fill="#fbbf24" font-family="Arial,sans-serif" font-weight="800" font-size="28">Dokumenti mijenjaju kontekst završetka pregovora</text>
<rect x="78" y="255" width="480" height="238" rx="24" fill="#111827" stroke="#64748b" stroke-width="3"/>
<text x="115" y="306" fill="#e2e8f0" font-family="Arial,sans-serif" font-weight="900" font-size="28">JAVNI DOJAM</text>
<text x="115" y="356" fill="#f8fafc" font-family="Arial,sans-serif" font-size="27">“Željeli ulagati, pa odustali.”</text>
<text x="115" y="408" fill="#94a3b8" font-family="Arial,sans-serif" font-size="21">Pojednostavljeni prikaz završetka</text>
<text x="115" y="439" fill="#94a3b8" font-family="Arial,sans-serif" font-size="21">višemjesečnih pregovora.</text>
<rect x="642" y="255" width="480" height="238" rx="24" fill="#0f172a" stroke="#22c55e" stroke-width="3"/>
<text x="679" y="306" fill="#bbf7d0" font-family="Arial,sans-serif" font-weight="900" font-size="28">DOKUMENTI</text>
<text x="679" y="356" fill="#fff" font-family="Arial,sans-serif" font-size="26">Formalno otvoren pravni problem</text>
<text x="679" y="394" fill="#fff" font-family="Arial,sans-serif" font-size="26">prije realizacije ulaganja.</text>
<text x="679" y="443" fill="#86efac" font-family="Arial,sans-serif" font-size="21">Ključna razlika: volja ≠ provedivost.</text>
<text x="58" y="638" fill="#94a3b8" font-family="Arial,sans-serif" font-size="20">Urednička ilustracija · dokumentarni kontekst · bez prejudiciranja odgovornosti</text></svg>