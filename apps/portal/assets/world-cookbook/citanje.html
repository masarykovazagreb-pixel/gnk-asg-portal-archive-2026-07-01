<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The World Table — listanje knjige</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:#0b0b0a;color:#f7f1e5;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
  .citac{height:100vh;display:grid;grid-template-columns:250px 1fr;grid-template-rows:auto 1fr}

  /* traka */
  .traka{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:10px 16px;
         background:#080808;border-bottom:1px solid rgba(213,173,84,.3)}
  .traka b{font:600 15px Georgia,serif;color:#d5ad54;white-space:nowrap}
  .traka .razmak{margin-left:auto}
  .traka button{background:#111;color:#f7f1e5;border:1px solid rgba(213,173,84,.35);
                border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
  .traka button:hover:not(:disabled){border-color:#d5ad54;color:#d5ad54}
  .traka button:disabled{opacity:.35;cursor:default}
  .traka input{width:64px;background:#111;color:#fff;border:1px solid rgba(213,173,84,.3);
               border-radius:8px;padding:7px;text-align:center;font-size:13px}
  .traka span{color:#b7ad9e;font-size:13px;white-space:nowrap}

  /* poglavlja */
  .poglavlja{background:#0d0d0c;border-right:1px solid rgba(213,173,84,.22);overflow-y:auto;padding:14px 0}
  .poglavlja h2{margin:0 0 10px;padding:0 16px;font:600 11px Arial;letter-spacing:.16em;
                text-transform:uppercase;color:#8d8577}
  .poglavlja button{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
                    width:100%;background:none;border:0;border-left:2px solid transparent;
                    color:#e8dfd0;padding:9px 16px;font-size:14px;text-align:left;cursor:pointer}
  .poglavlja button:hover{background:rgba(213,173,84,.08);color:#d5ad54}
  .poglavlja button[aria-current=true]{border-left-color:#d5ad54;color:#d5ad54;background:rgba(213,173,84,.06)}
  .poglavlja small{color:#8d8577;font-size:11px}

  /* stranice */
  .platno{overflow-y:auto;padding:20px;display:flex;flex-direction:column;align-items:center;gap:18px;
          background:#050505;scroll-behavior:smooth}
  .stranica{position:relative;width:100%;max-width:820px;background:#141414;
            border:1px solid rgba(213,173,84,.16);border-radius:6px;min-height:200px}
  .stranica canvas{display:block;width:100%;height:auto;border-radius:6px}
  .stranica .oznaka{position:absolute;right:10px;bottom:8px;background:rgba(0,0,0,.7);
                    color:#b7ad9e;font-size:11px;padding:3px 8px;border-radius:6px}
  .poruka{margin:40px 0;color:#b7ad9e;font-size:14px;text-align:center;line-height:1.7}
  .poruka a{color:#d5ad54}

  @media(max-width:820px){
    .citac{grid-template-columns:1fr}
    .poglavlja{position:fixed;inset:52px auto 0 0;width:240px;z-index:10;transform:translateX(-100%);
               transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.6)}
    .poglavlja.otvoren{transform:none}
    .traka .naslov{display:none}
  }
  @media(min-width:821px){ .traka .izbornik{display:none} }
</style>
</head>
<body>
<div class="citac">

  <div class="traka">
    <button class="izbornik" type="button" id="izbornik" aria-label="Poglavlja">☰</button>
    <b class="naslov">The World Table</b>
    <span class="razmak"></span>
    <button type="button" id="natrag">‹ Prethodna</button>
    <input id="skok" type="number" min="1" value="1" aria-label="Broj stranice">
    <span id="ukupno">/ …</span>
    <button type="button" id="naprijed">Sljedeća ›</button>
  </div>

  <nav class="poglavlja" id="poglavlja" aria-label="Poglavlja">
    <h2>Poglavlja</h2>
  </nav>

  <div class="platno" id="platno">
    <p class="poruka" id="poruka">Učitavanje knjige…<br><small>1424 stranice, prvo otvaranje traje nekoliko sekundi.</small></p>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(() => {
  'use strict';
  const PDF = 'THE_WORLD_TABLE_GNK_ASG_WORLD_RECIPE_BOOK_EN.pdf';
  const OKO = 2;                       // koliko stranica oko vidljive drzimo iscrtano
  const platno = document.getElementById('platno');
  const poruka = document.getElementById('poruka');
  const skok = document.getElementById('skok');
  const ukupno = document.getElementById('ukupno');

  if (!window.pdfjsLib) {
    poruka.innerHTML = 'Listalica se nije mogla učitati.<br>' +
      '<a href="' + PDF + '" download>Preuzmi knjigu u PDF-u</a>';
    return;
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  let knjiga = null, okviri = [], iscrtane = new Set();

  // Poglavlja se ucitavaju iz zasebne datoteke, jer sam PDF nema ugradjen sadrzaj.
  fetch('poglavlja.json').then(r => r.json()).then(({ poglavlja }) => {
    const nav = document.getElementById('poglavlja');
    poglavlja.forEach(p => {
      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.stranica = p.stranica;
      b.innerHTML = '<span>' + p.naziv + '</span><small>' + p.recepata + '</small>';
      b.onclick = () => idiNa(p.stranica);
      nav.appendChild(b);
    });
  }).catch(() => {});

  function oznaciPoglavlje(broj) {
    document.querySelectorAll('#poglavlja button').forEach(b => {
      b.removeAttribute('aria-current');
    });
    const svi = [...document.querySelectorAll('#poglavlja button')];
    let zadnji = null;
    for (const b of svi) if (+b.dataset.stranica <= broj) zadnji = b;
    if (zadnji) zadnji.setAttribute('aria-current', 'true');
  }

  async function iscrtaj(broj) {
    if (iscrtane.has(broj)) return;
    iscrtane.add(broj);
    const okvir = okviri[broj - 1];
    try {
      const str = await knjiga.getPage(broj);
      const mjera = str.getViewport({ scale: 1 });
      const sirina = Math.min(okvir.clientWidth || 820, 1200);
      const omjer = Math.min(window.devicePixelRatio || 1, 2);
      const pogled = str.getViewport({ scale: (sirina / mjera.width) * omjer });
      const c = document.createElement('canvas');
      c.width = pogled.width; c.height = pogled.height;
      await str.render({ canvasContext: c.getContext('2d'), viewport: pogled }).promise;
      okvir.querySelector('canvas')?.remove();
      okvir.prepend(c);
    } catch (e) {
      iscrtane.delete(broj);
    }
  }

  function idiNa(broj) {
    const okvir = okviri[broj - 1];
    if (!okvir) return;
    okvir.scrollIntoView({ behavior: 'smooth', block: 'start' });
    document.getElementById('poglavlja').classList.remove('otvoren');
  }

  pdfjsLib.getDocument(PDF).promise.then(async (doc) => {
    knjiga = doc;
    poruka.remove();
    ukupno.textContent = '/ ' + doc.numPages;
    skok.max = doc.numPages;

    // Okviri se stvaraju odmah, a same stranice se iscrtavaju tek kad dodju na red.
    // Zato listanje radi i kod knjige od 1424 stranice.
    const frag = document.createDocumentFragment();
    for (let i = 1; i <= doc.numPages; i++) {
      const d = document.createElement('div');
      d.className = 'stranica';
      d.dataset.broj = i;
      d.style.aspectRatio = '210 / 297';
      d.innerHTML = '<span class="oznaka">' + i + '</span>';
      okviri.push(d);
      frag.appendChild(d);
    }
    platno.appendChild(frag);

    const oko = new IntersectionObserver((unosi) => {
      for (const u of unosi) {
        if (!u.isIntersecting) continue;
        const broj = +u.target.dataset.broj;
        for (let i = Math.max(1, broj - OKO); i <= Math.min(doc.numPages, broj + OKO); i++) iscrtaj(i);
        skok.value = broj;
        oznaciPoglavlje(broj);
      }
    }, { root: platno, rootMargin: '600px 0px', threshold: 0.01 });
    okviri.forEach(o => oko.observe(o));

    iscrtaj(1); iscrtaj(2);
  }).catch(() => {
    poruka.innerHTML = 'Knjigu nije moguće prikazati u pregledniku.<br>' +
      '<a href="' + PDF + '" download>Preuzmi je u PDF-u</a>';
  });

  document.getElementById('natrag').onclick = () => idiNa(Math.max(1, (+skok.value || 1) - 1));
  document.getElementById('naprijed').onclick = () => idiNa((+skok.value || 1) + 1);
  skok.onchange = () => idiNa(Math.min(Math.max(1, +skok.value || 1), knjiga ? knjiga.numPages : 1));
  document.getElementById('izbornik').onclick = () =>
    document.getElementById('poglavlja').classList.toggle('otvoren');
  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') document.getElementById('naprijed').click();
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') document.getElementById('natrag').click();
  });
})();
</script>
</body>
</html>
