<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="636" viewBox="0 0 1240 636" role="img" aria-labelledby="t d"><title id="t">Anonimizirani ugovorni izvadak — približno 264 m² bruto i približno 375 m² neto korisne površine</title><desc id="d">Transkripcija ključne formulacije iz anonimiziranog izvatka ugovora: bruto površine kuće približno 264 m², odnosno ukupne neto korisne površine približno 375 m².</desc><rect width="1240" height="636" fill="#f4f1e9"/><rect x="56" y="54" width="1128" height="528" rx="10" fill="#fff" stroke="#8a7b5a" stroke-width="3"/><text x="92" y="112" font-family="Georgia,serif" font-size="28" fill="#332a1d" font-weight="700">ANONIMIZIRANI IZVADAK UGOVORA · ČLANAK 1. STAVAK 2.</text><line x1="92" y1="138" x2="1148" y2="138" stroke="#b8aa8a" stroke-width="2"/><text x="92" y="220" font-family="Georgia,serif" font-size="32" fill="#2e2a22">„bruto površine kuće</text><rect x="445" y="177" width="342" height="62" rx="7" fill="#ffe16b"/><text x="468" y="220" font-family="Arial,sans-serif" font-size="38" fill="#111" font-weight="900">približno 264 m²</text><text x="805" y="220" font-family="Georgia,serif" font-size="32" fill="#2e2a22">, odnosno</text><text x="92" y="306" font-family="Georgia,serif" font-size="32" fill="#2e2a22">ukupne neto korisne površine</text><rect x="566" y="263" width="352" height="62" rx="7" fill="#ffe16b"/><text x="589" y="306" font-family="Arial,sans-serif" font-size="38" fill="#111" font-weight="900">približno 375 m²</text><text x="928" y="306" font-family="Georgia,serif" font-size="32" fill="#2e2a22">“</text><text x="92" y="397" font-family="Arial,sans-serif" font-size="25" fill="#7b1e1e" font-weight="800">Riječ „približno“ u ugovoru stoji uz obje površine.</text><text x="92" y="455" font-family="Arial,sans-serif" font-size="21" fill="#5b5144">Vizualna transkripcija ključne ugovorne formulacije radi čitljivosti.</text><text x="92" y="492" font-family="Arial,sans-serif" font-size="21" fill="#5b5144">Izvorni anonimizirani izvadak ostaje mjerodavan za puni kontekst.</text><rect x="56" y="530" width="1128" height="52" fill="#0b1726"/><text x="87" y="564" font-family="Arial,sans-serif" font-size="19" fill="#fff">AKTUAL MEDIA · GNK ASG · Nermin Sefić · #Šestine #Ugovor #Kvadratura</text></svg>