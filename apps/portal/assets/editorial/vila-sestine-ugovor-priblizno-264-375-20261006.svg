<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Vila u Šestinama — prema ugovoru približno 264 m² bruto i približno 375 m² ukupne neto korisne površine</title><desc id="d">Urednička ilustracija AKTUAL MEDIA. Točna formulacija iz anonimiziranog izvatka ugovora: bruto površine kuće približno 264 m², odnosno ukupne neto korisne površine približno 375 m². Nije fotografija predmetne nekretnine.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101d"/><stop offset="1" stop-color="#27100f"/></linearGradient><linearGradient id="glass"><stop stop-color="#2e5c7d"/><stop offset="1" stop-color="#14283a"/></linearGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><g transform="translate(760 90)"><rect x="0" y="105" width="350" height="260" rx="8" fill="#172b3d" stroke="#d4af37" stroke-width="3"/><rect x="55" y="25" width="245" height="130" rx="6" fill="url(#glass)" stroke="#d4af37" stroke-width="3"/><rect x="35" y="185" width="90" height="120" fill="#315b77"/><rect x="150" y="185" width="90" height="120" fill="#315b77"/><rect x="265" y="185" width="60" height="120" fill="#315b77"/><path d="M-35 365H390" stroke="#6da4c7" stroke-width="18" opacity=".6"/><path d="M0 105L55 25H300L350 105" fill="none" stroke="#d4af37" stroke-width="5"/></g><rect x="38" y="34" width="300" height="55" rx="9" fill="#b91c1c"/><text x="56" y="70" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="900">VILA U ŠESTINAMA</text><text x="45" y="140" fill="#fff" font-family="Arial,sans-serif" font-size="37" font-weight="900">PREMA UGOVORU STOJI:</text><text x="45" y="225" fill="#f5d879" font-family="Arial,sans-serif" font-size="58" font-weight="900">približno 264 m²</text><text x="48" y="267" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="800">BRUTO POVRŠINE KUĆE</text><text x="45" y="355" fill="#f5d879" font-family="Arial,sans-serif" font-size="58" font-weight="900">približno 375 m²</text><text x="48" y="397" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="800">UKUPNE NETO KORISNE POVRŠINE</text><text x="47" y="460" fill="#dbeafe" font-family="Arial,sans-serif" font-size="24">„bruto površine kuće približno 264 m², odnosno</text><text x="47" y="495" fill="#dbeafe" font-family="Arial,sans-serif" font-size="24">ukupne neto korisne površine približno 375 m²“</text><rect x="0" y="552" width="1200" height="78" fill="#050c18"/><text x="50" y="586" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">ILUSTRACIJA · nije fotografija predmetne nekretnine · prema anonimiziranom izvatku ugovora</text><text x="50" y="615" fill="#b9c7d7" font-family="Arial,sans-serif" font-size="17">#LuksuznaVila  #Šestine  #Ugovor  #Kvadratura  #GNKASG  #NerminSefić  #JutarnjiList</text></svg>