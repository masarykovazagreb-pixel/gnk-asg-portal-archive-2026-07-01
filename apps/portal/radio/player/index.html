<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AKTUAL MEDIA RADIO — persistent player</title>
<meta name="description" content="AKTUAL MEDIA RADIO persistent internet audio player with desktop installation and operating-system media controls.">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#071426">
<link rel="manifest" href="/aktual-media-radio.webmanifest">
<link rel="icon" href="/assets/app-icon-192.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/aktual-media-radio-player-v2.css?v=20261012">
</head>
<body>
<main class="rp-shell">
  <div class="rp-brand">
    <strong>AKTUAL MEDIA RADIO</strong>
    <a href="/gnk-aktual/" target="_blank" rel="noopener">AKTUAL MEDIA ↗</a>
  </div>
  <section class="rp-card" aria-labelledby="radioStationTitle">
    <div class="rp-status"><span class="radio-status" id="radioStatusLabel">○ RADIO STANDBY</span></div>
    <h1 id="radioStationTitle">AKTUAL MEDIA RADIO</h1>
    <p id="radioStationTag">Persistent internet radio player</p>
    <div class="rp-now">
      <div><strong id="radioTrackName">Live audio stream</strong><span id="radioTrackArtist">Track metadata unavailable</span></div>
      <div class="equalizer-visualizer" id="radioVisualizer" aria-hidden="true"><span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span></div>
    </div>
    <div id="radioAnnounceBanner" aria-live="polite"></div>
    <div class="rp-controls">
      <label for="radioStationSelect">Stream</label>
      <select id="radioStationSelect" class="radio-select">
        <option value="0">AKTUAL MEDIA USA Top Hits &amp; Rock</option>
        <option value="1">AKTUAL MEDIA Lo-Fi Chill &amp; Business Lounge</option>
        <option value="2">AKTUAL MEDIA Synthwave &amp; Retro Tech</option>
        <option value="3">AKTUAL MEDIA RADIO USA · Country &amp; Americana</option>
        <option value="4">AKTUAL MEDIA RADIO USA · Jazz &amp; Soul Lounge</option>
      </select>
      <button type="button" id="radioPlayBtn" class="btn-radio-play">▶ PLAY</button>
      <button type="button" id="radioNextBtn" class="btn-radio-next">⏭ Info / promo</button>
      <div class="rp-volume">
        <button id="radioVolDown" type="button" class="btn-vol-adj" aria-label="Volume down">−</button>
        <input id="radioVolSlider" type="range" min="0" max="1" step=".05" value=".8" aria-label="Volume">
        <button id="radioVolUp" type="button" class="btn-vol-adj" aria-label="Volume up">+</button>
      </div>
    </div>
    <div class="rp-install-wrap">
      <button type="button" id="radioInstallBtn" class="rp-install">⬇ INSTALL / PIN AKTUAL MEDIA RADIO</button>
      <p id="radioInstallHelp" class="rp-help"></p>
    </div>
  </section>
</main>
<script src="/assets/aktual-radio-player-v1.js?v=20261012-persistent" defer></script>
<script src="/assets/aktual-media-radio-install-v1.js?v=20261012" defer></script>
</body>
</html>
