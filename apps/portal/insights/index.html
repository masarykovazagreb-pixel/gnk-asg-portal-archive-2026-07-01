<div class="wrap">

    <h1>Insights</h1>
    <p>Published texts and analysis connected to the backend data layer.</p>
  </div>
  <div id="app"></div>
</div>
<script>
const MODE="articles";
const app=document.getElementById("app");
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));}
async function loadJson(url){const r=await fetch(url+"?cb="+Date.now(),{cache:"no-store"});return await r.json();}
async function renderList(kind,url){
  app.innerHTML='<div class="card"><b>Učitavanje...</b></div>';
  try{
    const data=await loadJson(url);
    const items=Array.isArray(data.items)?data.items:[];
    app.innerHTML='<div class="card"><h2>'+kind+'</h2><p>Ukupno: '+items.length+'</p></div>'+items.map(x=>'<div class="card"><h3>'+esc(x.title)+'</h3><p>'+esc(x.summary||x.excerpt||"")+'</p><p>'+esc(x.createdAt||x.publishedAt||"")+'</p></div>').join("");
  }catch(e){
    app.innerHTML='<div class="card"><h2>Greška</h2><pre>'+esc(e.message)+'</pre></div>';
  }
}
function renderAdmin(){
  app.innerHTML='<div class="grid"><div class="card"><h2>Objava vijesti</h2><label>Admin token</label><input id="tokenNews" type="password"><label>Jezik</label><select id="langNews"><option value="hr">HR</option><option value="en">EN</option></select><label>Naslov</label><input id="titleNews"><label>Sažetak</label><textarea id="summaryNews"></textarea><label>Tekst</label><textarea id="bodyNews"></textarea><label>Izvor URL</label><input id="sourceNews"><button onclick="publishItem(\\'news\\')">OBJAVI VIJEST</button><pre id="outNews"></pre></div><div class="card"><h2>Objava teksta / objave</h2><label>Admin token</label><input id="tokenArticle" type="password"><label>Jezik</label><select id="langArticle"><option value="hr">HR</option><option value="en">EN</option></select><label>Naslov</label><input id="titleArticle"><label>Sažetak</label><textarea id="summaryArticle"></textarea><label>Puni tekst</label><textarea id="bodyArticle"></textarea><label>Kategorija</label><input id="categoryArticle" value="GNK ASG"><button onclick="publishItem(\\'article\\')">OBJAVI TEKST</button><pre id="outArticle"></pre></div></div><div class="card"><h2>Status backend povezivanja</h2><button onclick="checkBackend()">PROVJERI BACKEND</button><pre id="backendOut"></pre></div>';
}
async function publishItem(type){
  const isNews=type==="news";
  const p=isNews?"News":"Article";
  const token=document.getElementById(isNews?"tokenNews":"tokenArticle").value;
  const payload={
    lang:document.getElementById(isNews?"langNews":"langArticle").value,
    title:document.getElementById(isNews?"titleNews":"titleArticle").value,
    summary:document.getElementById(isNews?"summaryNews":"summaryArticle").value,
    body:document.getElementById(isNews?"bodyNews":"bodyArticle").value,
    sourceUrl:isNews?document.getElementById("sourceNews").value:"",
    category:isNews?"news":document.getElementById("categoryArticle").value
  };
  const out=document.getElementById(isNews?"outNews":"outArticle");
  out.textContent="Slanje...";
  try{
    const r=await fetch(isNews?"/operator/publish-news":"/operator/publish-article",{method:"POST",headers:{"content-type":"application/json","x-operator-token":token},body:JSON.stringify(payload)});
    out.textContent=JSON.stringify(await r.json(),null,2);
  }catch(e){out.textContent=e.message;}
}
async function checkBackend(){
  const urls=["/data/backend-menu.json","/data/news.json","/data/articles.json","/operator/publish-status"];
  const rows=[];
  for(const u of urls){
    try{const r=await fetch(u+"?cb="+Date.now(),{cache:"no-store"});rows.push({url:u,status:r.status,ok:r.ok});}
    catch(e){rows.push({url:u,error:e.message});}
  }
  document.getElementById("backendOut").textContent=JSON.stringify(rows,null,2);
}
if(MODE==="news") renderList("Vijesti","/data/news.json");
if(MODE==="articles") renderList("Objave i tekstovi","/data/articles.json");
if(MODE==="admin") renderAdmin();
if(MODE==="control"){app.innerHTML='<div class="card"><h2>Control Center</h2><p>Provjera povezanosti javnih data datoteka i operator endpointa.</p><button onclick="checkBackend()">PROVJERI BACKEND</button><pre id="backendOut"></pre></div>';}
</script>
